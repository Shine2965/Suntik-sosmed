<!DOCTYPE html>
<html lang="id">
<head>
  <meta name="google-adsense-account" content="ca-pub-9912622413153708">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riwayat Pesanan</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      padding: 20px;
      margin: 0;
    }
    .container {
      max-width: 500px;
      margin: 40px auto;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    h1 { text-align: center; }
    input, button {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background: #0056b3; }
    .result {
      margin-top: 15px;
      padding: 15px;
      border-radius: 8px;
      background: #f9f9f9;
      display: none;
    }
    .status { font-weight: bold; font-size: 15px; }
    .success { color: green; }
    .process { color: orange; }
    .pending { color: #888; }
    .failed { color: red; }
    .nav { text-align: center; margin-top: 15px; }
    .nav a { color: #007bff; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Cek Riwayat Pesanan</h1>
    <input type="text" id="transaksiId" placeholder="Masukkan ID Transaksi">
    <button onclick="cekStatus()">Cek Status</button>
    <div id="hasil" class="result"></div>

    <div class="nav">
      <p>⬅️ <a href="index.html">Kembali ke Pemesanan</a></p>
    </div>
  </div>

  <script>
    // Data pesanan manual
      const dataPesanan = {
      "TRX-1758547857284": { produk: "5595 - 200 IG followers", status: "Proses" },
      "TRX-1758613881408": { produk: "5930 - 233 Tiktok Followers ", status: "Proses" },
      "TRX-1758534587581": { produk: "3016 - 1K Views tiktok", status: "Proses" },
      "TRX-1758623698259": { produk: "5946 - 400 IG Followers", status: "Proses" },
      "TRX-1758664506366": { produk: "5281 - 20K tiktok views", status: "Proses" },
      "TRX-1758673185993": { produk: "5930 - 500 Tiktok Followers", status: "Proses" },
      "TRX-1758708988443": { produk: "5830 - 200 Tiktok Followers", status: "Proses" },
      "TRX-1758542893292": { produk: "5595 - 100 Followers IG", status: "Proses" },
      "TRX-1758721021649": { produk: "5281 - 1K Views Tiktok", status: "Proses" },
      "TRX-1758722225719": { produk: "5626 - 1K like Tiktok", status: "Proses" },
      "TRX-1758728097516": { produk: "5861 - 100 Like IG", status: "Proses" },
      "TRX-1758728158261": { produk: "5929 - 100 Followers Tiktok", status: "Proses" },
      "TRX-1758754429932": { produk: "5930 - 10 Followers Tiktok", status: "Gagal" },
      "TRX-1758772989687": { produk: "14444 - 10 Followers Saluran WhatsApp", status: "Sukses" },
      "TRX-1758765570612": { produk: "5281 - 1K tiktok Views", status: "Gagal" },
      "TRX-1758773264497": { produk: "5595 - 100 Followers IG", status: "Pending" },
      "TRX-1758773804862": { produk: "14444 - 30 Followers Saluran WhatsApp", status: "Sukses" },
      "TRX-1758774511857": { produk: "5519 - 30 Followers Saluran WhatsApp", status: "Sukses" },
      "TRX-1758775346263": { produk: "5519 - 30 Followers Saluran WhatsApp", status: "Sukses" }<∆∆
      "TRX-1758788662882": { produk: "5840 - 1K Tiktok Views", status: "Proses" }
        
    };
    
    function cekStatus() {
      const inputId = document.getElementById("transaksiId").value.trim().toUpperCase();
      const hasil = document.getElementById("hasil");

      if (dataPesanan[inputId]) {
        let statusClass = "";
        switch(dataPesanan[inputId].status.toLowerCase()) {
          case "sukses": statusClass = "success"; break;
          case "proses": statusClass = "process"; break;
          case "pending": statusClass = "pending"; break;
          case "gagal": statusClass = "failed"; break;
        }

        hasil.style.display = "block";
        hasil.innerHTML = `
          <p>📌 ID Transaksi: <b>${inputId}</b></p>
          <p>🛒 Produk: ${dataPesanan[inputId].produk}</p>
          <p class="status ${statusClass}">📦 Status: ${dataPesanan[inputId].status}</p>
        `;
      } else {
        hasil.style.display = "block";
        hasil.innerHTML = `<p style="color:red;">❌ ID Transaksi tidak ditemukan!</p>`;
      }
    }
  </script>
</body>
</html>
