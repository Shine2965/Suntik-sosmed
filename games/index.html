<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🚂 Dragon Rail PRO MAX - Kontrol Total</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #080c14;
            color: #d0dcec;
            display: flex;
            justify-content: center;
            padding: 15px;
            min-height: 100vh;
        }
        .container {
            max-width: 1500px;
            width: 100%;
            background: #0f1824;
            border-radius: 28px;
            padding: 22px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.95);
            border: 1px solid #1a2c3f;
        }
        h1 {
            font-size: 26px;
            color: #f5c97a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #1a2c3f;
            padding-bottom: 14px;
            margin-bottom: 18px;
            flex-wrap: wrap;
            gap: 10px;
        }
        h1 small {
            font-size: 13px;
            font-weight: 300;
            color: #7a94b0;
        }
        #railCanvas {
            width: 100%;
            height: auto;
            background: #0c1520;
            border-radius: 16px;
            border: 1px solid #1f3448;
            display: block;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 16px 0 12px;
            align-items: center;
        }
        .controls button {
            background: #1a2a3c;
            border: 1px solid #34516a;
            color: #dce6f0;
            padding: 9px 22px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 3px 0 #080e16;
        }
        .controls button:hover {
            background: #28405a;
            transform: translateY(-2px);
            box-shadow: 0 5px 0 #080e16;
            border-color: #4a708f;
        }
        .controls button.danger {
            background: #4d2732;
            border-color: #884a5a;
        }
        .controls button.danger:hover {
            background: #6d3747;
        }
        .controls button.success {
            background: #1d4a3a;
            border-color: #3a8a6a;
        }
        .controls button.success:hover {
            background: #2d6a4a;
        }
        .badge {
            background: #0f1a26;
            padding: 7px 18px;
            border-radius: 40px;
            border: 1px solid #2a435c;
            font-size: 13px;
            color: #b8cddf;
        }
        .train-control-panel {
            background: #0a121e;
            border: 1px solid #1d3245;
            border-radius: 16px;
            padding: 16px;
            margin: 12px 0;
            max-height: 200px;
            overflow-y: auto;
        }
        .train-control-panel::-webkit-scrollbar {
            width: 6px;
            background: #0a121e;
        }
        .train-control-panel::-webkit-scrollbar-thumb {
            background: #2a4a6a;
            border-radius: 10px;
        }
        .train-item {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            margin: 4px 0;
            background: #0f1a28;
            border-radius: 10px;
            border-left: 4px solid #facc15;
        }
        .train-item .name {
            font-weight: 600;
            font-size: 14px;
            min-width: 180px;
        }
        .train-item .color-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: inline-block;
            border: 1px solid #2a4a6a;
        }
        .train-item select {
            background: #1a2a3c;
            color: #dce6f0;
            border: 1px solid #34516a;
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 12px;
            cursor: pointer;
        }
        .train-item .status {
            font-size: 12px;
            color: #8aadcc;
            margin-left: auto;
        }
        .train-item .status.stop {
            color: #f77a7a;
        }
        .train-item .status.run {
            color: #7acf8a;
        }
        .info-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            padding: 12px 0 8px;
            border-top: 1px solid #14222f;
            margin-top: 14px;
            font-size: 13px;
        }
        .info-panel .item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .info-panel .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 1px solid #2a4a6a;
        }
        .popup-train {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #0c1622;
            border-left: 6px solid #f5c97a;
            padding: 16px 26px;
            border-radius: 16px;
            border: 1px solid #2a4660;
            box-shadow: 0 12px 40px rgba(0,0,0,0.95);
            color: #ecf4fa;
            font-weight: 600;
            font-size: 18px;
            max-width: 380px;
            z-index: 9999;
            transition: all 0.4s ease;
            transform: translateY(30px);
            opacity: 0;
            pointer-events: none;
            backdrop-filter: blur(8px);
        }
        .popup-train.show {
            transform: translateY(0);
            opacity: 1;
        }
        .popup-train small {
            display: block;
            font-weight: 300;
            font-size: 13px;
            color: #9ab0cc;
            margin-top: 4px;
        }
        .signal-indicator {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin: 8px 0;
        }
        .signal-indicator .sig {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }
        .signal-indicator .sig .light {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid #2a4a6a;
        }
        footer {
            text-align: center;
            margin-top: 20px;
            color: #3a5670;
            font-size: 12px;
            border-top: 1px solid #14212e;
            padding-top: 16px;
        }
        @media (max-width: 800px) {
            .controls { flex-direction: column; align-items: stretch; }
            .train-item { flex-direction: column; align-items: stretch; }
            .train-item .status { margin-left: 0; }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>
        🚂 DRAGON RAIL PRO MAX <small>— sinyal merah = stop total!</small>
    </h1>
    
    <canvas id="railCanvas" width="1500" height="750"></canvas>
    
    <div class="controls">
        <button id="addTrainBtn">➕ Tambah Kereta</button>
        <button id="toggleAllSignalBtn">🚦 Ubah Semua Sinyal</button>
        <button id="resetBtn" class="danger">⟳ Reset</button>
        <button id="toggleWeselBtn" class="success">🔀 Next Wesel</button>
        <div class="badge" id="trainCount">🚆 6 kereta</div>
        <div class="badge" id="weselStatus">🔀 Wesel: 1</div>
    </div>

    <div class="signal-indicator" id="signalIndicators">
        <!-- Dinamis dari JS -->
    </div>

    <div class="train-control-panel" id="trainControlPanel">
        <div style="font-weight:300;color:#6a8aaa;margin-bottom:8px;font-size:13px;">🎛️ KONTROL PER KERETA — pilih jalur masuk:</div>
        <div id="trainList"></div>
    </div>

    <div class="info-panel">
        <span class="item"><span class="dot" style="background:#facc15;"></span> Commuter Line</span>
        <span class="item"><span class="dot" style="background:#f97316;"></span> KA Harina</span>
        <span class="item"><span class="dot" style="background:#3b82f6;"></span> KA Pandalungan</span>
        <span class="item"><span class="dot" style="background:#a855f7;"></span> KA Anggrek</span>
        <span class="item"><span class="dot" style="background:#ec4899;"></span> Stasiun</span>
        <span class="item"><span class="dot" style="background:#22d3ee;"></span> Wesel aktif</span>
        <span class="item"><span class="dot" style="background:#ef4444;"></span> Sinyal MERAH (stop)</span>
        <span class="item"><span class="dot" style="background:#22c55e;"></span> Sinyal HIJAU (jalan)</span>
    </div>
    <footer>©Alvino Jeremy - 2026</footer>
</div>

<!-- POPUP -->
<div id="trainPopup" class="popup-train">
    🚆 <span id="popupName">Commuter Line</span>
    <small id="popupStation">melewati stasiun</small>
</div>

<script>
(function() {
    // ============================================================
    //  DRAGON RAIL PRO MAX — SINYAL MERAH = STOP + KONTROL JALUR
    // ============================================================
    const canvas = document.getElementById('railCanvas');
    const ctx = canvas.getContext('2d');
    const popup = document.getElementById('trainPopup');
    const popupName = document.getElementById('popupName');
    const popupStation = document.getElementById('popupStation');
    const trainCountBadge = document.getElementById('trainCount');
    const weselStatus = document.getElementById('weselStatus');
    const trainListEl = document.getElementById('trainList');
    const signalIndicatorsEl = document.getElementById('signalIndicators');

    // -- STASIUN (4) --
    const stations = [
        { id: 'turi', name: 'Surabaya Pasar Turi', x: 130, y: 380, jalurCount: 6, signal: true },
        { id: 'gubeng', name: 'Gubeng', x: 580, y: 260, jalurCount: 8, signal: true },
        { id: 'wonokromo', name: 'Wonokromo', x: 1000, y: 500, jalurCount: 4, signal: true },
        { id: 'waru', name: 'Waru', x: 1350, y: 320, jalurCount: 2, signal: true }
    ];

    // -- WESEL --
    let wesels = [
        { from: 'turi', to: 'gubeng', jalur: 0, aktif: true },
        { from: 'turi', to: 'gubeng', jalur: 1, aktif: false },
        { from: 'gubeng', to: 'wonokromo', jalur: 0, aktif: false },
        { from: 'gubeng', to: 'wonokromo', jalur: 1, aktif: false },
        { from: 'wonokromo', to: 'waru', jalur: 0, aktif: false }
    ];
    let currentWeselIndex = 0;

    // -- KERETA --
    const trainTypes = [
        { name: 'Commuter Line Arjonegoro', color: '#facc15', speed: 1.3, size: 18 },
        { name: 'Commuter Line Penataran', color: '#facc15', speed: 1.1, size: 18 },
        { name: 'KA HARINA', color: '#f97316', speed: 1.9, size: 20 },
        { name: 'KA PANDALUNGAN', color: '#3b82f6', speed: 2.1, size: 20 },
        { name: 'KA ANGGREK', color: '#a855f7', speed: 1.7, size: 20 },
        { name: 'Commuter Line Arjonegoro', color: '#facc15', speed: 1.2, size: 18 }
    ];

    let trains = [];
    let lastPopupTime = 0;
    let popupTimer = null;
    let animationId = null;
    let selectedWesel = 0;

    // -- INIT --
    function initTrains() {
        trains = trainTypes.map((t, idx) => {
            return {
                ...t,
                id: Date.now() + idx,
                progress: 0.05 + (idx / trainTypes.length) * 0.85,
                direction: 1,
                active: true,
                currentStation: null,
                assignedJalur: 0, // jalur yang dipilih user
                isStopped: false,
                stopAtStation: null,
                lastStationIdx: -1
            };
        });
        updateTrainCount();
        renderTrainControls();
    }

    // -- POSISI --
    function getPositionOnPath(progress, jalurIndex = 0) {
        const offset = jalurIndex * 14;
        const p0 = { x: 30, y: 320 + offset };
        const p1 = { x: stations[0].x, y: stations[0].y + offset - 8 };
        const p2 = { x: stations[1].x, y: stations[1].y + offset - 6 };
        const p3 = { x: stations[2].x, y: stations[2].y + offset + 6 };
        const p4 = { x: stations[3].x, y: stations[3].y + offset };
        const p5 = { x: 1470, y: 320 + offset };

        const pts = [p0, p1, p2, p3, p4, p5];
        const t = Math.min(1, Math.max(0, progress));
        const seg = t * 5;
        const segIdx = Math.min(4, Math.floor(seg));
        const localT = seg - segIdx;

        const idx = segIdx;
        const a = pts[Math.max(0, idx - 1)];
        const b = pts[idx];
        const c = pts[Math.min(5, idx + 1)];
        const d = pts[Math.min(5, idx + 2)];

        const t2 = localT * localT;
        const t3 = t2 * localT;
        const x = 0.5 * ( (2*b.x) + (-a.x + c.x)*localT + (2*a.x - 5*b.x + 4*c.x - d.x)*t2 + (-a.x + 3*b.x - 3*c.x + d.x)*t3 );
        const y = 0.5 * ( (2*b.y) + (-a.y + c.y)*localT + (2*a.y - 5*b.y + 4*c.y - d.y)*t2 + (-a.y + 3*b.y - 3*c.y + d.y)*t3 );
        return { x, y };
    }

    // -- CEK STASIUN TERDEKAT --
    function getNearestStation(pos) {
        let minDist = 50;
        let found = null;
        for (let s of stations) {
            const dx = pos.x - s.x;
            const dy = pos.y - s.y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < minDist) {
                minDist = dist;
                found = s;
            }
        }
        return found;
    }

    // -- UPDATE KERETA (DENGAN SINYAL MERAH) --
    function updateTrains() {
        const now = Date.now();
        for (let train of trains) {
            if (!train.active) continue;

            const pos = getPositionOnPath(train.progress, train.assignedJalur);
            const nearStation = getNearestStation(pos);
            
            // Cek apakah di dalam area stasiun (radius 35)
            let inStationArea = false;
            let currentStation = null;
            if (nearStation) {
                const dx = pos.x - nearStation.x;
                const dy = pos.y - nearStation.y;
                if (Math.sqrt(dx*dx + dy*dy) < 38) {
                    inStationArea = true;
                    currentStation = nearStation;
                }
            }

            // LOGIKA SINYAL MERAH: berhenti di jalur masuk/keluar stasiun
            let shouldStop = false;
            if (inStationArea && currentStation) {
                // Cek sinyal stasiun
                if (!currentStation.signal) {
                    shouldStop = true;
                    train.stopAtStation = currentStation.id;
                } else {
                    train.stopAtStation = null;
                }
            } else {
                train.stopAtStation = null;
            }

            // Jika kereta berhenti karena sinyal merah
            if (shouldStop) {
                train.isStopped = true;
                // Popup peringatan
                if (now - lastPopupTime > 2000) {
                    showPopup('🔴 ' + train.name, 'BERHENTI di ' + currentStation.name + ' (SINYAL MERAH)');
                    lastPopupTime = now;
                }
                continue; // SKIP gerakan
            } else {
                train.isStopped = false;
            }

            // Gerakan normal
            let speedMul = 1.0;
            // Cek wesel aktif
            const aktifWesel = wesels[currentWeselIndex];
            if (aktifWesel && !aktifWesel.aktif) {
                speedMul = 0.5;
            }

            let delta = (train.speed * 0.004) * speedMul;
            if (train.direction === 1) {
                train.progress += delta;
                if (train.progress > 1.0) {
                    train.progress = 1.0;
                    train.direction = -1;
                }
            } else {
                train.progress -= delta;
                if (train.progress < 0.0) {
                    train.progress = 0.0;
                    train.direction = 1;
                }
            }

            // Popup lewat stasiun (hanya jika sinyal hijau)
            if (inStationArea && currentStation && currentStation.signal) {
                if (now - lastPopupTime > 1500) {
                    showPopup(train.name, 'melewati ' + currentStation.name);
                    lastPopupTime = now;
                    train.currentStation = currentStation.name;
                }
            }
        }
        updateTrainControls();
    }

    // -- POPUP --
    function showPopup(name, station) {
        popupName.textContent = name;
        popupStation.textContent = station;
        popup.classList.add('show');
        if (popupTimer) clearTimeout(popupTimer);
        popupTimer = setTimeout(() => {
            popup.classList.remove('show');
        }, 2200);
    }

    // -- DRAW --
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. GAMBAR JALUR (8 jalur)
        for (let j = 0; j < 8; j++) {
            ctx.beginPath();
            ctx.strokeStyle = j < 6 ? '#2a4a6a' : '#1a3a5a';
            ctx.lineWidth = j < 4 ? 4 : 2.5;
            ctx.setLineDash(j % 2 === 0 ? [] : [6, 8]);
            const offset = j * 14;
            const p0 = { x: 30, y: 320 + offset };
            const p1 = { x: stations[0].x, y: stations[0].y + offset - 8 };
            const p2 = { x: stations[1].x, y: stations[1].y + offset - 6 };
            const p3 = { x: stations[2].x, y: stations[2].y + offset + 6 };
            const p4 = { x: stations[3].x, y: stations[3].y + offset };
            const p5 = { x: 1470, y: 320 + offset };
            const pts = [p0, p1, p2, p3, p4, p5];
            ctx.moveTo(pts[0].x, pts[0].y);
            for (let i = 1; i < pts.length; i++) {
                const prev = pts[i-1];
                const curr = pts[i];
                const cp1x = prev.x + (curr.x - prev.x) * 0.4;
                const cp1y = prev.y;
                const cp2x = curr.x - (curr.x - prev.x) * 0.4;
                const cp2y = curr.y;
                ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, curr.x, curr.y);
            }
            ctx.stroke();
        }
        ctx.setLineDash([]);

        // 2. GAMBAR STASIUN + SINYAL
        for (let s of stations) {
            // Tiang sinyal
            ctx.fillStyle = '#1a2a3c';
            ctx.fillRect(s.x - 3, s.y - 65, 6, 65);
            // Lampu sinyal
            const signalColor = s.signal ? '#22c55e' : '#ef4444';
            ctx.beginPath();
            ctx.arc(s.x, s.y - 72, 12, 0, 2 * Math.PI);
            ctx.fillStyle = '#0a121e';
            ctx.fill();
            ctx.strokeStyle = '#2a4a6a';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(s.x, s.y - 72, 8, 0, 2 * Math.PI);
            ctx.fillStyle = signalColor;
            ctx.fill();
            // Label sinyal
            ctx.fillStyle = s.signal ? '#8fde7a' : '#f77a7a';
            ctx.font = 'bold 10px monospace';
            ctx.textAlign = 'center';
            ctx.fillText(s.signal ? 'HIJAU' : 'MERAH', s.x, s.y - 92);

            // Nama stasiun
            ctx.fillStyle = '#d4e6f5';
            ctx.font = 'bold 13px "Segoe UI"';
            ctx.textAlign = 'center';
            ctx.fillText(s.name, s.x, s.y - 110);
            
            // Marker stasiun
            ctx.beginPath();
            ctx.arc(s.x, s.y, 14, 0, 2 * Math.PI);
            ctx.fillStyle = '#ec4899';
            ctx.fill();
            ctx.strokeStyle = '#f9c8e0';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Info jalur
            ctx.fillStyle = '#8aadcc';
            ctx.font = '10px monospace';
            ctx.fillText(`${s.jalurCount} jalur`, s.x, s.y + 32);
        }

        // 3. GAMBAR WESEL
        for (let i = 0; i < wesels.length; i++) {
            const w = wesels[i];
            const fromSt = stations.find(s => s.id === w.from);
            const toSt = stations.find(s => s.id === w.to);
            if (!fromSt || !toSt) continue;
            const isActive = i === currentWeselIndex && w.aktif;
            ctx.beginPath();
            ctx.strokeStyle = isActive ? '#22d3ee' : '#2a4a6a';
            ctx.lineWidth = isActive ? 6 : 2;
            ctx.setLineDash(isActive ? [] : [6, 8]);
            const midX = (fromSt.x + toSt.x) / 2;
            const midY = (fromSt.y + toSt.y) / 2 - 30;
            ctx.moveTo(fromSt.x + 20, fromSt.y + 10);
            ctx.quadraticCurveTo(midX, midY, toSt.x - 20, toSt.y + 10);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = isActive ? '#22d3ee' : '#3a5a7a';
            ctx.font = 'bold 10px monospace';
            ctx.textAlign = 'center';
            ctx.fillText(`Wesel ${i+1}`, (fromSt.x + toSt.x)/2, midY - 12);
        }

        // 4. GAMBAR KERETA
        for (let train of trains) {
            if (!train.active) continue;
            const pos = getPositionOnPath(train.progress, train.assignedJalur);
            
            // Efek berhenti (lingkaran merah)
            if (train.isStopped) {
                ctx.beginPath();
                ctx.arc(pos.x, pos.y, train.size/2 + 8, 0, 2 * Math.PI);
                ctx.strokeStyle = '#ef444488';
                ctx.lineWidth = 3;
                ctx.setLineDash([4, 6]);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // Body kereta
            ctx.shadowColor = '#00000088';
            ctx.shadowBlur = 18;
            ctx.fillStyle = train.color;
            ctx.beginPath();
            ctx.roundRect(pos.x - train.size/2, pos.y - train.size/2, train.size, train.size, 4);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#0b141e';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Nama kereta
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 10px monospace';
            ctx.textAlign = 'center';
            ctx.fillText(train.name.substring(0, 12), pos.x, pos.y - train.size/2 - 8);
            
            // Arah
            ctx.fillStyle = '#ffffffcc';
            ctx.font = '14px sans-serif';
            ctx.fillText(train.direction === 1 ? '▶' : '◀', pos.x, pos.y + 4);

            // Label jalur assigned
            ctx.fillStyle = '#8aadcc';
            ctx.font = '9px monospace';
            ctx.fillText(`J${train.assignedJalur+1}`, pos.x + train.size/2 + 12, pos.y + 4);
        }

        // Update status
        const aktifWesel = wesels[currentWeselIndex] || wesels[0];
        weselStatus.textContent = `🔀 Wesel: ${currentWeselIndex + 1} ${aktifWesel.aktif ? '✅' : '🔴'}`;
        updateTrainCount();
        updateSignalIndicators();
    }

    // -- SIGNAL INDICATORS --
    function updateSignalIndicators() {
        signalIndicatorsEl.innerHTML = stations.map(s => `
            <div class="sig">
                <span class="light" style="background:${s.signal ? '#22c55e' : '#ef4444'};"></span>
                ${s.name} ${s.signal ? '🟢' : '🔴'}
                <button onclick="toggleStationSignal('${s.id}')" style="background:#1a2a3c;border:1px solid #34516a;color:#dce6f0;border-radius:20px;padding:2px 12px;cursor:pointer;font-size:11px;">Toggle</button>
            </div>
        `).join('');
    }

    // -- TOGGLE SINYAL STASIUN --
    window.toggleStationSignal = function(stationId) {
        const st = stations.find(s => s.id === stationId);
        if (st) {
            st.signal = !st.signal;
            showPopup('🚦 Sinyal ' + (st.signal ? 'HIJAU' : 'MERAH'), st.name);
            updateSignalIndicators();
        }
    };

    // -- RENDER KONTROL KERETA --
    function renderTrainControls() {
        trainListEl.innerHTML = trains.map((t, idx) => `
            <div class="train-item">
                <span class="color-dot" style="background:${t.color};"></span>
                <span class="name">${t.name}</span>
                <select onchange="assignJalur(${idx}, this.value)">
                    ${Array.from({length: 8}, (_, i) => `
                        <option value="${i}" ${t.assignedJalur === i ? 'selected' : ''}>Jalur ${i+1}</option>
                    `).join('')}
                </select>
                <span class="status ${t.isStopped ? 'stop' : 'run'}">
                    ${t.isStopped ? '⏹ BERHENTI' : '▶ BERJALAN'}
                </span>
            </div>
        `).join('');
    }

    function updateTrainControls() {
        // Update status tanpa re-render penuh
        const items = trainListEl.querySelectorAll('.train-item');
        items.forEach((item, idx) => {
            if (idx < trains.length) {
                const statusEl = item.querySelector('.status');
                if (statusEl) {
                    statusEl.textContent = trains[idx].isStopped ? '⏹ BERHENTI' : '▶ BERJALAN';
                    statusEl.className = `status ${trains[idx].isStopped ? 'stop' : 'run'}`;
                }
            }
        });
    }

    // -- ASSIGN JALUR --
    window.assignJalur = function(trainIdx, jalur) {
        if (trainIdx < trains.length) {
            trains[trainIdx].assignedJalur = parseInt(jalur);
            showPopup('🛤️ ' + trains[trainIdx].name, 'masuk Jalur ' + (parseInt(jalur)+1));
        }
    };

    // -- LOOP --
    function loop() {
        updateTrains();
        draw();
        animationId = requestAnimationFrame(loop);
    }

    // -- HELPERS --
    function updateTrainCount() {
        const active = trains.filter(t => t.active).length;
        trainCountBadge.textContent = `🚆 ${active} kereta`;
    }

    // -- TAMBAH KERETA --
    function addRandomTrain() {
        const types = [
            { name: 'Commuter Line Arjonegoro', color: '#facc15', speed: 1.3, size: 18 },
            { name: 'Commuter Line Penataran', color: '#facc15', speed: 1.1, size: 18 },
            { name: 'KA HARINA', color: '#f97316', speed: 1.9, size: 20 },
            { name: 'KA PANDALUNGAN', color: '#3b82f6', speed: 2.1, size: 20 },
            { name: 'KA ANGGREK', color: '#a855f7', speed: 1.7, size: 20 }
        ];
        const t = types[Math.floor(Math.random() * types.length)];
        const newTrain = {
            ...t,
            id: Date.now() + Math.random(),
            progress: Math.random() * 0.8 + 0.1,
            direction: Math.random() > 0.5 ? 1 : -1,
            active: true,
            currentStation: null,
            assignedJalur: Math.floor(Math.random() * 4),
            isStopped: false,
            stopAtStation: null,
            lastStationIdx: -1
        };
        trains.push(newTrain);
        updateTrainCount();
        renderTrainControls();
        showPopup('🚆 ' + newTrain.name, 'kereta baru masuk!');
    }

    // -- TOGGLE ALL SIGNAL --
    function toggleAllSignals() {
        const allGreen = stations.every(s => s.signal);
        stations.forEach(s => s.signal = !allGreen);
        showPopup('🚦 Semua sinyal ' + (allGreen ? 'MERAH' : 'HIJAU'), 'sistem global');
        updateSignalIndicators();
    }

    // -- TOGGLE WESEL --
    function toggleWesel() {
        currentWeselIndex = (currentWeselIndex + 1) % wesels.length;
        for (let i = 0; i < wesels.length; i++) {
            wesels[i].aktif = (i === currentWeselIndex);
        }
        showPopup('🔀 Wesel ke-' + (currentWeselIndex + 1), 'jalur diubah');
    }

    // -- RESET --
    function resetAll() {
        if (animationId) cancelAnimationFrame(animationId);
        stations.forEach(s => s.signal = true);
        currentWeselIndex = 0;
        wesels.forEach((w, i) => w.aktif = (i === 0));
        initTrains();
        lastPopupTime = 0;
        if (popupTimer) clearTimeout(popupTimer);
        popup.classList.remove('show');
        updateSignalIndicators();
        loop();
    }

    // -- EVENT: KLIK STASIUN UNTUK TOGGLE SINYAL --
    canvas.addEventListener('click', (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const mx = (e.clientX - rect.left) * scaleX;
        const my = (e.clientY - rect.top) * scaleY;

        for (let s of stations) {
            const dx = mx - s.x;
            const dy = my - s.y;
            if (Math.sqrt(dx*dx + dy*dy) < 40) {
                s.signal = !s.signal;
                showPopup('🚦 Sinyal ' + (s.signal ? 'HIJAU' : 'MERAH'), s.name);
                updateSignalIndicators();
                return;
            }
        }
    });

    // -- BIND BUTTONS --
    document.getElementById('addTrainBtn').addEventListener('click', addRandomTrain);
    document.getElementById('toggleAllSignalBtn').addEventListener('click', toggleAllSignals);
    document.getElementById('toggleWeselBtn').addEventListener('click', toggleWesel);
    document.getElementById('resetBtn').addEventListener('click', resetAll);

    // -- START --
    initTrains();
    updateSignalIndicators();
    loop();

    console.log('🚂 DRAGON RAIL PRO MAX — sinyal merah = stop total!');
    console.log('💡 Klik stasiun untuk toggle sinyal, pilih jalur di panel kontrol!');
})();
</script>
</body>
</html>
