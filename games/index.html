<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPKA Stasiun Indonesia - Simulasi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(145deg, #0a0a0a 0%, #1a1a1a 100%);
            color: #0f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .game-container {
            max-width: 1000px;
            width: 100%;
            background: #111;
            border: 2px solid #0f0;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 0 40px rgba(0,255,0,0.2);
        }
        .header {
            text-align: center;
            border-bottom: 2px solid #0f0;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 28px;
            letter-spacing: 4px;
            text-shadow: 0 0 10px #0f0;
        }
        .header .sub {
            font-size: 14px;
            color: #aaa;
            margin-top: 5px;
        }
        .status-board {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            background: #1a1a1a;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #333;
            margin-bottom: 20px;
        }
        .status-item {
            font-size: 14px;
        }
        .status-item span {
            color: #fff;
            font-weight: bold;
        }
        .track-area {
            background: #0a0a0a;
            border-radius: 10px;
            padding: 20px;
            border: 1px solid #2a2a2a;
            margin-bottom: 20px;
            min-height: 300px;
            position: relative;
        }
        .track-line {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px dashed #2a2a2a;
        }
        .track-line:last-child {
            border-bottom: none;
        }
        .train {
            display: inline-block;
            background: #0f0;
            color: #000;
            font-weight: bold;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            letter-spacing: 1px;
            transition: all 0.3s;
            box-shadow: 0 0 20px rgba(0,255,0,0.3);
        }
        .train-arrive {
            background: #ffaa00;
            box-shadow: 0 0 20px rgba(255,170,0,0.5);
        }
        .train-depart {
            background: #ff3333;
            box-shadow: 0 0 20px rgba(255,0,0,0.5);
        }
        .station-name {
            color: #aaa;
            font-size: 16px;
            font-weight: bold;
            width: 100px;
        }
        .schedule {
            color: #fff;
            font-size: 13px;
        }
        .signal {
            display: inline-block;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin: 0 10px;
        }
        .signal-green {
            background: #0f0;
            box-shadow: 0 0 20px #0f0;
        }
        .signal-red {
            background: #f00;
            box-shadow: 0 0 20px #f00;
        }
        .signal-yellow {
            background: #ff0;
            box-shadow: 0 0 20px #ff0;
        }
        .control-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }
        .btn {
            background: #1a1a1a;
            color: #0f0;
            border: 2px solid #0f0;
            padding: 12px 25px;
            border-radius: 30px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .btn:hover {
            background: #0f0;
            color: #000;
            box-shadow: 0 0 30px rgba(0,255,0,0.3);
            transform: scale(1.05);
        }
        .btn-danger {
            border-color: #f00;
            color: #f00;
        }
        .btn-danger:hover {
            background: #f00;
            color: #000;
            box-shadow: 0 0 30px rgba(255,0,0,0.3);
        }
        .log-area {
            margin-top: 20px;
            background: #0a0a0a;
            border-radius: 10px;
            padding: 15px;
            border: 1px solid #2a2a2a;
            max-height: 150px;
            overflow-y: auto;
            font-size: 13px;
            color: #0f0;
        }
        .log-area .log-entry {
            padding: 4px 0;
            border-bottom: 1px solid #1a1a1a;
        }
        .log-area .log-time {
            color: #666;
            margin-right: 10px;
        }
        ::-webkit-scrollbar {
            width: 8px;
            background: #1a1a1a;
        }
        ::-webkit-scrollbar-thumb {
            background: #0f0;
            border-radius: 10px;
        }
        @media (max-width: 600px) {
            .station-name { width: 70px; font-size: 12px; }
            .train { font-size: 10px; padding: 4px 10px; }
            .btn { padding: 8px 15px; font-size: 12px; }
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="header">
        <h1>🚂 PPKA STASIUN</h1>
        <div class="sub">PT KERETA API INDONESIA (PERSERO) • SIMULASI</div>
    </div>

    <div class="status-board">
        <div class="status-item">⏰ WAKTU: <span id="gameTime">06:00</span></div>
        <div class="status-item">🚆 KERETA AKTIF: <span id="trainCount">0</span></div>
        <div class="status-item">📋 PERINTAH: <span id="lastCommand">-</span></div>
    </div>

    <div class="track-area" id="trackArea">
        <!-- akan diisi JS -->
    </div>

    <div class="control-panel">
        <button class="btn" onclick="tambahKereta()">➕ TAMBAH KERETA</button>
        <button class="btn" onclick="gerakkanKereta()">▶️ GERAKKAN</button>
        <button class="btn" onclick="acakJadwal()">🔄 ACAK JADWAL</button>
        <button class="btn btn-danger" onclick="resetSimulasi()">💥 RESET</button>
    </div>

    <div class="log-area" id="logArea">
        <div class="log-entry"><span class="log-time">[06:00]</span> Sistem PPKA siap. Stasiun Gambir aktif.</div>
    </div>
</div>

<script>
    // ========== DATA ==========
    const stasiunList = [
        'Gambir', 'Jakarta Kota', 'Pasar Senen', 'Bandung', 'Surabaya Gubeng',
        'Yogyakarta', 'Semarang Tawang', 'Medan', 'Palembang', 'Makassar'
    ];

    const namaKereta = [
        'Argo Bromo', 'Argo Lawu', 'Argo Dwipangga', 'Gajayana', 'Bima',
        'Sembrani', 'Taksaka', 'Purwojaya', 'Bangunkarta', 'Jayabaya'
    ];

    let trains = [];
    let gameTime = 360; // menit dari 06:00
    let logEntries = [];
    let trainIdCounter = 0;

    // ========== FUNGSI ==========
    function formatTime(m) {
        let h = Math.floor(m / 60);
        let min = m % 60;
        return `${String(h).padStart(2,'0')}:${String(min).padStart(2,'0')}`;
    }

    function addLog(msg) {
        let timeStr = formatTime(gameTime);
        logEntries.push(`[${timeStr}] ${msg}`);
        if (logEntries.length > 50) logEntries.shift();
        renderLog();
    }

    function renderLog() {
        let area = document.getElementById('logArea');
        area.innerHTML = logEntries.map(e => `<div class="log-entry">${e}</div>`).join('');
        area.scrollTop = area.scrollHeight;
    }

    function renderTrack() {
        let area = document.getElementById('trackArea');
        let html = '';
        // tampilkan 5 stasiun dengan kereta
        let displayStations = stasiunList.slice(0, 5);
        displayStations.forEach((stasiun, idx) => {
            let trainOnStation = trains.filter(t => t.stationIndex === idx);
            let trainHtml = trainOnStation.map(t => {
                let cls = 'train';
                if (t.status === 'arrive') cls += ' train-arrive';
                else if (t.status === 'depart') cls += ' train-depart';
                return `<span class="${cls}" style="margin:0 5px;">🚆${t.name}</span>`;
            }).join(' ');

            // sinyal
            let signalClass = 'signal-green';
            if (trainOnStation.length > 0 && trainOnStation.some(t => t.status === 'arrive')) {
                signalClass = 'signal-yellow';
            } else if (trainOnStation.length > 2) {
                signalClass = 'signal-red';
            }

            html += `
                <div class="track-line">
                    <div class="station-name">${stasiun}</div>
                    <div class="schedule">${trainHtml || '⚪ Kosong'}</div>
                    <div class="signal ${signalClass}"></div>
                </div>
            `;
        });
        area.innerHTML = html;
        document.getElementById('trainCount').innerText = trains.length;
        document.getElementById('gameTime').innerText = formatTime(gameTime);
    }

    // ========== PERINTAH ==========
    function tambahKereta() {
        if (trains.length >= 20) {
            addLog('⚠️ Stasiun penuh! Maksimal 20 kereta.');
            return;
        }
        let name = namaKereta[Math.floor(Math.random() * namaKereta.length)];
        let stationIdx = Math.floor(Math.random() * 5);
        let status = ['arrive', 'depart', 'standby'][Math.floor(Math.random() * 3)];
        trains.push({
            id: trainIdCounter++,
            name: name + '-' + (Math.floor(Math.random() * 900) + 100),
            stationIndex: stationIdx,
            status: status,
            delay: 0
        });
        addLog(`🚆 Kereta ${name} ditambahkan di ${stasiunList[stationIdx]} (${status})`);
        renderTrack();
        document.getElementById('lastCommand').innerText = 'Tambah Kereta';
    }

    function gerakkanKereta() {
        if (trains.length === 0) {
            addLog('⚠️ Tidak ada kereta untuk digerakkan.');
            return;
        }
        // naikkan waktu 15 menit
        gameTime += 15;
        if (gameTime >= 1440) gameTime -= 1440; // reset ke 00:00

        // gerakkan kereta
        let moved = 0;
        trains.forEach(t => {
            // 40% chance pindah ke stasiun berikutnya
            if (Math.random() < 0.4) {
                t.stationIndex = (t.stationIndex + 1) % 5;
                t.status = ['arrive', 'depart', 'standby'][Math.floor(Math.random() * 3)];
                moved++;
            } else {
                // ubah status random
                if (Math.random() < 0.3) {
                    t.status = ['arrive', 'depart', 'standby'][Math.floor(Math.random() * 3)];
                }
            }
            // tambah delay random
            if (Math.random() < 0.1) t.delay += Math.floor(Math.random() * 5);
        });

        addLog(`⏩ Waktu maju 15 menit. ${moved} kereta berpindah.`);
        document.getElementById('lastCommand').innerText = 'Gerakkan';
        renderTrack();
    }

    function acakJadwal() {
        trains.forEach(t => {
            t.stationIndex = Math.floor(Math.random() * 5);
            t.status = ['arrive', 'depart', 'standby'][Math.floor(Math.random() * 3)];
            t.delay = Math.floor(Math.random() * 10);
        });
        addLog('🔄 Jadwal diacak! Semua kereta berpindah posisi.');
        document.getElementById('lastCommand').innerText = 'Acak Jadwal';
        renderTrack();
    }

    function resetSimulasi() {
        trains = [];
        gameTime = 360;
        trainIdCounter = 0;
        logEntries = ['[06:00] Sistem PPKA siap. Stasiun Gambir aktif.'];
        addLog('💥 Simulasi di-reset!');
        document.getElementById('lastCommand').innerText = 'Reset';
        renderTrack();
    }

    // ========== INIT ==========
    // tambah 3 kereta awal
    for (let i = 0; i < 3; i++) tambahKereta();
    // auto update tiap 10 detik
    setInterval(() => {
        // gerakkan otomatis pelan
        if (trains.length > 0 && Math.random() < 0.3) {
            gerakkanKereta();
        }
    }, 10000);

    renderTrack();
</script>
</body>
</html>
