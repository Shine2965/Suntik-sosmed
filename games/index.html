<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPKA Simulator DAOP 8 | Wesel Garis Putus-Putus</title>
<style>
  :root {
    --bg:#0f1419; --panel:#1a2332; --track:#1a1a1a; --hl:#48bb78;
    --red:#e53e3e; --green:#38a169; --yellow:#d69e2e; --blue:#4299e1;
    --text:#e2e8f0; --muted:#a0aec0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:#151c27;border-bottom:1px solid #2d3748;flex-shrink:0;z-index:100}
  .topbar-left{display:flex;align-items:center;gap:12px}
  .time-box{background:#1a2332;border:1px solid #2d3748;border-radius:20px;padding:4px 12px;font-family:Consolas,monospace;font-size:.95rem;display:flex;gap:8px;align-items:center}
  .station-select{background:#1a2332;border:1px solid #2d3748;color:var(--text);padding:5px 10px;border-radius:6px;font-size:.85rem}

  .diagram-wrap{flex:1;overflow:auto;position:relative;background:linear-gradient(rgba(45,55,72,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(45,55,72,.18) 1px,transparent 1px);background-size:28px 28px}
  .diagram{position:relative;width:1100px;height:400px;margin:45px auto 25px}

  /* Jalur utama */
  .track{position:absolute;height:5px;background:#1a1a1a;border-radius:2px;z-index:2;transition:.2s}
  .track.hl{background:#2f855a;box-shadow:0 0 0 3px #48bb78,0 0 10px rgba(72,187,120,.4)}

  /* Wesel = garis putus-putus */
  .wesel-line{
    position:absolute;height:0;
    border-top:3px dashed #718096;
    transform-origin:left center;
    z-index:3;cursor:pointer;
    transition:border-color .2s, border-style .2s;
  }
  .wesel-line:hover{border-color:var(--blue)}
  .wesel-line.active{
    border-top:3px solid var(--hl);
    box-shadow:0 0 8px rgba(72,187,120,.5);
  }

  /* Label wesel kecil */
  .wesel-label{
    position:absolute;font-size:.58rem;font-weight:700;color:#a0aec0;
    background:rgba(26,35,50,.85);padding:1px 4px;border-radius:3px;
    z-index:6;pointer-events:none;
  }

  .signal{position:absolute;width:14px;height:32px;background:#1a202c;border:1px solid #4a5568;border-radius:3px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:10}
  .signal:hover{border-color:var(--blue)}
  .sig-light{width:8px;height:8px;border-radius:50%;background:#4a5568}
  .sig-light.red{background:var(--red);box-shadow:0 0 6px var(--red)}
  .sig-light.green{background:var(--green);box-shadow:0 0 6px var(--green)}
  .sig-light.yellow{background:var(--yellow);box-shadow:0 0 6px var(--yellow)}

  .label{position:absolute;font-size:.7rem;color:#a0aec0;z-index:5}
  .label.num{font-weight:700;color:#cbd5e0;font-size:.85rem}
  .dir-label{position:absolute;font-size:.72rem;font-weight:600;color:var(--blue);background:rgba(26,35,50,.9);padding:3px 8px;border-radius:4px;z-index:5}

  .train{position:absolute;height:16px;min-width:85px;padding:0 6px;background:linear-gradient(90deg,#2b6cb0,#4299e1);border-radius:3px;font-size:.62rem;font-weight:600;color:#fff;display:flex;align-items:center;justify-content:center;z-index:20;transition:left 2s linear;box-shadow:0 2px 8px rgba(0,0,0,.4);white-space:nowrap;cursor:pointer}
  .train.stopped{background:linear-gradient(90deg,#c53030,#e53e3e)}
  .train.departing{background:linear-gradient(90deg,#276749,#38a169)}
  .train.selected{outline:2px solid var(--yellow)}

  .notif-area{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:420px;max-width:94%;z-index:200;display:flex;flex-direction:column;gap:8px}
  .notif{background:#1a2332;border:1px solid #4a5568;border-left:4px solid var(--yellow);border-radius:8px;padding:11px 13px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
  .notif.from-left{border-left-color:var(--blue)}
  .notif.from-right{border-left-color:var(--green)}
  .notif-title{font-size:.75rem;color:var(--muted);margin-bottom:3px}
  .notif-body{font-size:.88rem;font-weight:600;margin-bottom:8px}
  .notif-actions{display:flex;gap:8px}
  .notif-btn{flex:1;padding:6px;border:none;border-radius:5px;font-size:.78rem;cursor:pointer;font-weight:600}
  .notif-btn.izin{background:#276749;color:#fff}
  .notif-btn.tolak{background:#742a2a;color:#fff}

  .sop-panel{position:absolute;right:12px;top:55px;width:220px;background:rgba(26,35,50,.97);border:1px solid #2d3748;border-radius:10px;padding:12px;z-index:80;display:none}
  .sop-panel.show{display:block}
  .sop-panel h4{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
  .sop-train{font-size:.88rem;font-weight:600;margin-bottom:10px;color:var(--blue)}
  .sop-step{display:flex;align-items:center;gap:8px;padding:7px 9px;margin-bottom:5px;background:#151c27;border-radius:6px;border:1px solid #2d3748;font-size:.78rem;cursor:pointer}
  .sop-step.done{border-color:var(--green);background:#1a2e1a}
  .sop-step.locked{opacity:.4;cursor:not-allowed}
  .sop-step .num{width:20px;height:20px;border-radius:50%;background:#2d3748;display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:700}
  .sop-step.done .num{background:var(--green);color:#000}
  .sop-hint{font-size:.68rem;color:var(--muted);margin-top:8px}

  .route-info{position:absolute;top:12px;left:12px;background:rgba(26,35,50,.95);border:1px solid #2d3748;border-radius:8px;padding:8px 12px;font-size:.75rem;z-index:50;max-width:240px}
  .route-info b{color:var(--green)}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;display:none;align-items:center;justify-content:center}
  .modal-overlay.show{display:flex}
  .modal{background:#1a2332;border:1px solid #2d3748;border-radius:12px;width:340px;max-width:95%;max-height:65vh;overflow:hidden}
  .modal-header{padding:11px 14px;border-bottom:1px solid #2d3748;display:flex;justify-content:space-between;align-items:center}
  .modal-close{background:none;border:none;color:var(--muted);font-size:1.2rem;cursor:pointer}
  .modal-body{padding:12px 14px;overflow-y:auto;max-height:50vh}
  .sched-item{display:flex;justify-content:space-between;gap:6px;padding:7px 0;border-bottom:1px solid #2d3748;font-size:.82rem}
  .sched-item .time{color:var(--blue);font-family:Consolas,monospace}

  .log-mini{position:absolute;bottom:10px;left:10px;width:270px;max-height:110px;overflow-y:auto;background:rgba(26,35,50,.93);border:1px solid #2d3748;border-radius:8px;padding:7px;font-family:Consolas,monospace;font-size:.62rem;z-index:50}
  .log-mini div{margin-bottom:2px}
  .log-mini .t{color:var(--muted)}
  .log-mini .ok{color:var(--green)}
  .log-mini .warn{color:var(--yellow)}
  .log-mini .err{color:var(--red)}
  .log-mini .info{color:var(--blue)}

  .bottombar{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;background:#151c27;border-top:1px solid #2d3748;flex-shrink:0;z-index:100}
  .neighbor-btn{background:#1a2332;border:1px solid #2d3748;border-radius:18px;padding:7px 14px;font-size:.78rem;display:flex;align-items:center;gap:7px;min-width:130px}
  .neighbor-btn .arrow{color:var(--muted);font-size:.68rem}
  .ctrl-buttons{display:flex;gap:9px}
  .ctrl-btn{width:54px;height:54px;border-radius:50%;border:none;background:#1a2332;color:var(--text);font-size:.6rem;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
  .ctrl-btn:hover{background:#2d3748}
  .ctrl-btn .icon{font-size:1.1rem;margin-bottom:1px}
  .ctrl-btn.active{background:#2b6cb0}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="time-box"><span id="clock">04:00:00</span><span style="color:var(--yellow)">☀ 28°C</span></div>
    <select class="station-select" onchange="changeStation(this.value)">
      <option value="SGU">SGU — Surabaya Gubeng</option>
      <option value="SBI">SBI — Surabaya Pasarturi</option>
      <option value="WO">WO — Wonokromo</option>
      <option value="ML">ML — Malang</option>
    </select>
  </div>
</div>

<div class="diagram-wrap">
  <div class="route-info" id="routeInfo">Sistem siap.<br>Jalur dipilih otomatis. Atur wesel (garis putus-putus).</div>
  <div class="notif-area" id="notifArea"></div>
  <div class="diagram" id="diagram"></div>

  <div class="sop-panel" id="sopPanel">
    <h4>SOP Keberangkatan</h4>
    <div class="sop-train" id="sopTrainName">—</div>
    <div class="sop-step locked" id="sop1" onclick="doSOP(1)"><div class="num">1</div> Penutupan Pintu</div>
    <div class="sop-step locked" id="sop2" onclick="doSOP(2)"><div class="num">2</div> Warta</div>
    <div class="sop-step locked" id="sop3" onclick="doSOP(3)"><div class="num">3</div> S41</div>
    <div class="sop-step locked" id="sop4" onclick="doSOP(4)"><div class="num">4</div> S35</div>
    <div class="sop-hint" id="sopHint">Klik kereta yang berhenti.</div>
  </div>

  <div class="log-mini" id="logBox"></div>
</div>

<div class="modal-overlay" id="jadwalModal">
  <div class="modal">
    <div class="modal-header"><h3>📅 Jadwal</h3><button class="modal-close" onclick="closeJadwal()">×</button></div>
    <div class="modal-body" id="schedList"></div>
  </div>
</div>

<div class="bottombar">
  <div class="neighbor-btn"><span>📞</span><div><div id="leftName">Surabaya Kota</div><div class="arrow" id="leftDir">← UTARA</div></div></div>
  <div class="ctrl-buttons">
    <button class="ctrl-btn active" onclick="setMode(this)"><span class="icon">🎛</span>KONTROL</button>
    <button class="ctrl-btn" onclick="setMode(this)"><span class="icon">🔔</span>GENTA</button>
    <button class="ctrl-btn" onclick="openJadwal()"><span class="icon">📅</span>JADWAL</button>
    <button class="ctrl-btn" onclick="setMode(this)"><span class="icon">⚠</span>INSIDEN</button>
    <button class="ctrl-btn" onclick="giveWarta()"><span class="icon">📖</span>WARTA</button>
  </div>
  <div class="neighbor-btn" style="justify-content:flex-end"><div style="text-align:right"><div id="rightName">Wonokromo</div><div class="arrow" id="rightDir">SELATAN →</div></div><span>📞</span></div>
</div>

<script>
const STATIONS = {
  SGU:{name:"Surabaya Gubeng",left:{name:"Surabaya Kota",dir:"← UTARA"},right:{name:"Wonokromo",dir:"SELATAN →"},
    schedule:[
      {time:"04:05",name:"Jayabaya",from:"Surabaya Kota",dir:"left"},
      {time:"04:20",name:"CL Dhoho",from:"Wonokromo",dir:"right"},
      {time:"04:45",name:"Gaya Baru MS",from:"Wonokromo",dir:"right"},
      {time:"05:10",name:"Sancaka",from:"Surabaya Kota",dir:"left"},
      {time:"05:35",name:"Arjuno Ekspres",from:"Wonokromo",dir:"right"},
      {time:"06:00",name:"Mutiara Selatan",from:"Wonokromo",dir:"right"}
    ]},
  SBI:{name:"Surabaya Pasarturi",left:{name:"Lamongan",dir:"← UTARA"},right:{name:"Surabaya Gubeng",dir:"SELATAN →"},
    schedule:[
      {time:"04:05",name:"Jayabaya",from:"Surabaya Gubeng",dir:"right"},
      {time:"04:25",name:"Sembrani",from:"Lamongan",dir:"left"},
      {time:"04:50",name:"Argo Bromo",from:"Lamongan",dir:"left"},
      {time:"05:20",name:"Airlangga",from:"Lamongan",dir:"left"},
      {time:"05:50",name:"Gumarang",from:"Surabaya Gubeng",dir:"right"}
    ]},
  WO:{name:"Wonokromo",left:{name:"Gubeng",dir:"← UTARA"},right:{name:"Sidoarjo",dir:"SELATAN →"},
    schedule:[
      {time:"04:10",name:"CL Penataran",from:"Gubeng",dir:"left"},
      {time:"04:40",name:"Pasundan",from:"Gubeng",dir:"left"},
      {time:"05:15",name:"Sri Tanjung",from:"Sidoarjo",dir:"right"},
      {time:"05:45",name:"Logawa",from:"Gubeng",dir:"left"}
    ]},
  ML:{name:"Malang",left:{name:"Lawang",dir:"← UTARA"},right:{name:"Kepanjen",dir:"SELATAN →"},
    schedule:[
      {time:"04:10",name:"Arjuno Ekspres",from:"Kepanjen",dir:"right"},
      {time:"04:35",name:"Jayabaya",from:"Lawang",dir:"left"},
      {time:"05:10",name:"Gajayana",from:"Kepanjen",dir:"right"},
      {time:"05:40",name:"Jayabaya",from:"Kepanjen",dir:"right"}
    ]}
};

let current="SGU", trains=[], signals={}, weselState={}, pending=[], nextId=1;
let simMinutes=4*60, spawned=new Set(), selectedTrain=null, sopStep=0, assignedTrack=0;

const SY=75, GAP=55, LEFT=80, MID_L=290, MID_R=780, RIGHT=1000;

function changeStation(code){
  current=code; trains=[]; signals={}; weselState={}; pending=[]; spawned.clear();
  selectedTrain=null; sopStep=0; assignedTrack=0;
  document.getElementById("diagram").innerHTML="";
  document.getElementById("notifArea").innerHTML="";
  document.getElementById("sopPanel").classList.remove("show");
  document.getElementById("routeInfo").innerHTML="Sistem siap.<br>Jalur dipilih otomatis. Atur wesel (garis putus-putus).";
  buildDiagram(); updateNeighbors();
  log("Pindah ke stasiun "+STATIONS[code].name,"info");
}

function buildDiagram(){
  const d=document.getElementById("diagram");
  const st=STATIONS[current];

  d.innerHTML=`
    <div class="dir-label" style="left:10px;top:10px">\( {st.left.name}<br><small> \){st.left.dir}</small></div>
    <div class="dir-label" style="right:10px;top:10px;text-align:right">\( {st.right.name}<br><small> \){st.right.dir}</small></div>
  `;

  // 4 jalur utama
  for(let i=0;i<4;i++){
    const y=SY+i*GAP;
    const roman=["I","II","III","IV"][i];

    addTrack(d, LEFT, y, MID_L-LEFT-25, "appL"+(i+1));
    addTrack(d, MID_L, y, MID_R-MID_L, "track"+(i+1));
    addTrack(d, MID_R+25, y, RIGHT-MID_R-25, "appR"+(i+1));

    const lbl=document.createElement("div");
    lbl.className="label num";
    lbl.style.cssText=`left:\( {MID_L+(MID_R-MID_L)/2-8}px;top: \){y-16}px`;
    lbl.textContent="Jalur "+roman;
    d.appendChild(lbl);

    createSignal(d, "sigIn"+(i+1), MID_L+25, y-14, i+1, "in");
    createSignal(d, "sigOut"+(i+1), MID_R-45, y-14, i+1, "out");
  }

  // ===== WESEL KIRI (garis putus-putus) =====
  // W1: Jalur I ↔ II
  createWesel(d, "W1", MID_L-75, SY, MID_L-15, SY+GAP, "I↔II");
  createWesel(d, "W1b", MID_L-75, SY+GAP, MID_L-15, SY, "II↔I");
  // W2: Jalur II ↔ III
  createWesel(d, "W2", MID_L-75, SY+GAP, MID_L-15, SY+2*GAP, "II↔III");
  createWesel(d, "W2b", MID_L-75, SY+2*GAP, MID_L-15, SY+GAP, "III↔II");
  // W3: Jalur III ↔ IV
  createWesel(d, "W3", MID_L-75, SY+2*GAP, MID_L-15, SY+3*GAP, "III↔IV");
  createWesel(d, "W3b", MID_L-75, SY+3*GAP, MID_L-15, SY+2*GAP, "IV↔III");

  // ===== WESEL KANAN =====
  createWesel(d, "W4", MID_R+15, SY, MID_R+75, SY+GAP, "I↔II");
  createWesel(d, "W4b", MID_R+15, SY+GAP, MID_R+75, SY, "II↔I");
  createWesel(d, "W5", MID_R+15, SY+GAP, MID_R+75, SY+2*GAP, "II↔III");
  createWesel(d, "W5b", MID_R+15, SY+2*GAP, MID_R+75, SY+GAP, "III↔II");
  createWesel(d, "W6", MID_R+15, SY+2*GAP, MID_R+75, SY+3*GAP, "III↔IV");
  createWesel(d, "W6b", MID_R+15, SY+3*GAP, MID_R+75, SY+2*GAP, "IV↔III");
}

function addTrack(parent, x, y, w, id){
  const el=document.createElement("div");
  el.className="track"; el.id=id;
  el.style.cssText=`left:\( {x}px;top: \){y}px;width:${w}px`;
  parent.appendChild(el);
}

function createWesel(parent, id, x1, y1, x2, y2, label){
  const el=document.createElement("div");
  el.className="wesel-line";
  el.id=id;
  const len=Math.hypot(x2-x1, y2-y1);
  const ang=Math.atan2(y2-y1, x2-x1)*180/Math.PI;
  el.style.cssText=`left:\( {x1}px;top: \){y1}px;width:\( {len}px;transform:rotate( \){ang}deg)`;
  el.title="Wesel "+id+" ("+label+") — klik untuk aktif/nonaktif";
  el.onclick=()=>toggleWesel(id);
  parent.appendChild(el);
  weselState[id]=false;

  // Label kecil di tengah garis
  const midX=(x1+x2)/2 - 10;
  const midY=(y1+y2)/2 - 8;
  const lbl=document.createElement("div");
  lbl.className="wesel-label";
  lbl.id="lbl-"+id;
  lbl.style.cssText=`left:\( {midX}px;top: \){midY}px`;
  lbl.textContent=id;
  parent.appendChild(lbl);
}

function toggleWesel(id){
  weselState[id]=!weselState[id];
  const el=document.getElementById(id);
  if(el) el.classList.toggle("active", weselState[id]);
  log("Wesel "+id+" → "+(weselState[id]?"AKTIF (rute terbuka)":"NONAKTIF (putus-putus)"),"info");
}

function createSignal(parent, id, x, y, track, side){
  const sig=document.createElement("div");
  sig.className="signal"; sig.id=id;
  sig.style.cssText=`left:\( {x}px;top: \){y}px`;
  const roman=["I","II","III","IV"][track-1];
  sig.title=(side==="in"?"Sinyal Masuk":"Sinyal Keluar")+" Jalur "+roman;
  sig.innerHTML=`<div class="sig-light red" id="${id}-l"></div>`;
  sig.onclick=()=>toggleSignal(id, track, side);
  parent.appendChild(sig);
  signals[id]="red";
}

function toggleSignal(id, track, side){
  const light=document.getElementById(id+"-l");
  if(!light) return;
  let next=signals[id]==="red"?"green":(signals[id]==="green"?"yellow":"red");
  signals[id]=next;
  light.className="sig-light "+next;
  const roman=["I","II","III","IV"][track-1];
  log((side==="in"?"Sinyal Masuk":"Sinyal Keluar")+" Jalur "+roman+" → "+next.toUpperCase(),"info");

  if(side==="in" && next==="green"){
    if(assignedTrack && assignedTrack!==track){
      log("Sistem assign ke Jalur "+["I","II","III","IV"][assignedTrack-1],"warn");
    }
    tryEnter(track);
  }
  if(side==="out" && next==="green") tryDepart(track);
  if(side==="in" && next==="red") clearHighlight();
}

function setSignal(id, color){
  signals[id]=color;
  const light=document.getElementById(id+"-l");
  if(light) light.className="sig-light "+color;
}

function highlight(track){
  clearHighlight();
  ["track"+track,"appL"+track,"appR"+track].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.classList.add("hl");
  });
}
function clearHighlight(){
  document.querySelectorAll(".track.hl").forEach(el=>el.classList.remove("hl"));
}

function findFreeTrack(){
  for(let i=1;i<=4;i++){
    if(!trains.some(t=>t.track===i && t.status!=="departed")) return i;
  }
  return 0;
}

function requestPermission(s){
  const id="req"+Date.now();
  const fromLeft=s.dir==="left";
  pending.push({id,name:s.name,from:s.from,fromLeft,allowed:false,track:0});

  const n=document.createElement("div");
  n.className="notif "+(fromLeft?"from-left":"from-right");
  n.id=id;
  n.innerHTML=`
    <div class="notif-title">📡 Laporan dari arah ${s.from}</div>
    <div class="notif-body">KA <b>${s.name}</b> meminta izin masuk</div>
    <div class="notif-actions">
      <button class="notif-btn izin" onclick="izinkan('${id}')">✓ Izinkan</button>
      <button class="notif-btn tolak" onclick="tolak('${id}')">✗ Tolak</button>
    </div>`;
  document.getElementById("notifArea").appendChild(n);
  log("Laporan: KA "+s.name+" dari arah "+s.from,"warn");
}

function izinkan(reqId){
  const item=pending.find(p=>p.id===reqId);
  if(!item) return;
  const track=findFreeTrack();
  if(!track){ log("Semua jalur penuh","err"); return; }

  item.allowed=true;
  item.track=track;
  assignedTrack=track;
  document.getElementById(reqId)?.remove();

  highlight(track);
  const roman=["I","II","III","IV"][track-1];
  document.getElementById("routeInfo").innerHTML=
    `Sistem assign: <b>Jalur ${roman}</b><br>
     1. Klik garis putus-putus (wesel) agar AKTIF<br>
     2. Set Sinyal Masuk Jalur ${roman} → HIJAU`;

  log("Sistem assign KA "+item.name+" ke Jalur "+roman,"ok");
  log("Atur wesel lalu set Sinyal Masuk Jalur "+roman+" HIJAU","info");
}

function tolak(reqId){
  pending=pending.filter(p=>p.id!==reqId);
  document.getElementById(reqId)?.remove();
  log("Izin ditolak","err");
}

function tryEnter(track){
  const item=pending.find(p=>p.allowed && p.track===track);
  if(!item || signals["sigIn"+track]!=="green") return;
  pending=pending.filter(p=>p.id!==item.id);
  assignedTrack=0;
  spawnTrain(item.name, track, item.fromLeft);
}

function spawnTrain(name, track, fromLeft){
  const id="T"+nextId++;
  const y=SY+(track-1)*GAP-5;
  const roman=["I","II","III","IV"][track-1];
  const el=document.createElement("div");
  el.className="train"; el.id=id;
  el.style.left=(fromLeft?LEFT+10:RIGHT-90)+"px";
  el.style.top=y+"px";
  el.textContent=name.split(" ").slice(0,2).join(" ");
  el.onclick=()=>selectTrain(id);
  document.getElementById("diagram").appendChild(el);
  trains.push({id,name,track,status:"moving",fromLeft,sop:0});

  setTimeout(()=>{ const t=document.getElementById(id); if(t) t.style.left=(fromLeft?430:550)+"px"; },40);
  setTimeout(()=>{
    const t=document.getElementById(id);
    if(!t) return;
    t.classList.add("stopped");
    const tr=trains.find(x=>x.id===id);
    if(tr) tr.status="stopped";
    setSignal("sigIn"+track,"red");
    document.getElementById("routeInfo").innerHTML="KA berhenti di Jalur "+roman+".<br>Lakukan SOP, lalu set Sinyal Keluar HIJAU.";
    log("KA "+name+" berhenti di Jalur "+roman+" → Sinyal Masuk MERAH","warn");
  },2200);
  log("KA "+name+" masuk Jalur "+roman,"ok");
}

function selectTrain(id){
  const t=trains.find(x=>x.id===id);
  if(!t||t.status!=="stopped") return;
  selectedTrain=t; sopStep=t.sop||0;
  document.querySelectorAll(".train").forEach(e=>e.classList.remove("selected"));
  document.getElementById(id)?.classList.add("selected");
  showSOP();
}
function showSOP(){
  document.getElementById("sopPanel").classList.add("show");
  const roman=["I","II","III","IV"][selectedTrain.track-1];
  document.getElementById("sopTrainName").textContent=selectedTrain.name+" (Jalur "+roman+")";
  for(let i=1;i<=4;i++){
    const el=document.getElementById("sop"+i);
    el.classList.remove("done","locked");
    if(i<=sopStep) el.classList.add("done");
    else if(i>sopStep+1) el.classList.add("locked");
  }
  const hints=["Klik 1: Penutupan Pintu","Klik 2: Warta","Klik 3: S41","Klik 4: S35","SOP selesai. Set Sinyal Keluar HIJAU."];
  document.getElementById("sopHint").textContent=hints[Math.min(sopStep,4)];
}
function doSOP(step){
  if(!selectedTrain||selectedTrain.status!=="stopped") return;
  if(step!==sopStep+1){ log("Ikuti urutan SOP!","err"); return; }
  sopStep=step; selectedTrain.sop=step;
  const names=["","Penutupan Pintu","Warta","S41","S35"];
  log("SOP "+step+": "+names[step],"ok");
  showSOP();
}

function tryDepart(track){
  const t=trains.find(x=>x.track===track&&x.status==="stopped");
  if(!t) return;
  if((t.sop||0)<4){
    log("SOP belum lengkap!","err");
    selectedTrain=t; showSOP(); return;
  }
  if(signals["sigOut"+track]!=="green") return;

  t.status="departing";
  const el=document.getElementById(t.id);
  if(el){
    el.classList.remove("stopped","selected");
    el.classList.add("departing");
    el.style.left=(t.fromLeft?RIGHT-20:LEFT+10)+"px";
  }
  const roman=["I","II","III","IV"][track-1];
  log("S35 + Sinyal Keluar HIJAU → KA "+t.name+" berangkat dari Jalur "+roman,"ok");
  document.getElementById("sopPanel").classList.remove("show");
  selectedTrain=null; sopStep=0;

  setTimeout(()=>{
    el?.remove();
    trains=trains.filter(x=>x.id!==t.id);
    setSignal("sigOut"+track,"red");
    clearHighlight();
    document.getElementById("routeInfo").innerHTML="Sistem siap.<br>Jalur dipilih otomatis. Atur wesel (garis putus-putus).";
    log("KA "+t.name+" keluar stasiun → Sinyal Keluar MERAH","warn");
  },2300);
}

function checkSchedule(){
  const st=STATIONS[current];
  const h=Math.floor(simMinutes/60)%24, m=simMinutes%60;
  const now=String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");
  st.schedule.forEach(s=>{
    const key=s.time+"|"+s.name;
    if(s.time===now&&!spawned.has(key)){
      spawned.add(key);
      requestPermission(s);
    }
  });
}

function openJadwal(){
  const st=STATIONS[current];
  document.getElementById("schedList").innerHTML=st.schedule.map(s=>
    `<div class="sched-item"><span class="time">\( {s.time}</span><span> \){s.name}</span>
     <span style="color:var(--muted);font-size:.72rem">dari ${s.from}</span></div>`
  ).join("");
  document.getElementById("jadwalModal").classList.add("show");
}
function closeJadwal(){ document.getElementById("jadwalModal").classList.remove("show"); }
document.getElementById("jadwalModal").onclick=e=>{ if(e.target.id==="jadwalModal") closeJadwal(); };

function giveWarta(){ log("WARTA dikirim","ok"); }
function setMode(btn){
  document.querySelectorAll(".ctrl-btn").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
}
function updateNeighbors(){
  const st=STATIONS[current];
  document.getElementById("leftName").textContent=st.left.name;
  document.getElementById("leftDir").textContent=st.left.dir;
  document.getElementById("rightName").textContent=st.right.name;
  document.getElementById("rightDir").textContent=st.right.dir;
}
function log(msg,type){
  const box=document.getElementById("logBox");
  const t=document.getElementById("clock").textContent;
  const d=document.createElement("div");
  d.innerHTML=`<span class="t">[\( {t}]</span> <span class=" \){type}">${msg}</span>`;
  box.prepend(d);
}

setInterval(()=>{
  simMinutes++;
  if(simMinutes>=24*60){ simMinutes=4*60; spawned.clear(); }
  const h=Math.floor(simMinutes/60)%24, m=simMinutes%60;
  document.getElementById("clock").textContent=String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":00";
  checkSchedule();
},2500);

buildDiagram(); updateNeighbors();
log("Wesel = garis putus-putus. Klik untuk AKTIF (solid hijau).","info");
log("Penamaan: Jalur I-IV | Sinyal Masuk/Keluar | Wesel W1-W6","ok");
</script>
