<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPKA Simulator Indonesia – DAOP 8 Surabaya</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Roboto', monospace;
            background: #0a0e14;
            color: #e0e8f0;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #1a1f26;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a7a3a;
            border-radius: 8px;
        }

        /* ===== LAYOUT UTAMA ===== */
        #app {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ===== HEADER ===== */
        .header {
            background: linear-gradient(135deg, #0f151c 0%, #1a232e 100%);
            border-bottom: 2px solid #2a7a3a;
            padding: 12px 24px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 20px rgba(42, 122, 58, 0.15);
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: #4ade80;
            letter-spacing: 1px;
            text-shadow: 0 0 20px rgba(74, 222, 128, 0.15);
        }
        .logo small {
            font-weight: 400;
            font-size: 13px;
            color: #94a3b8;
            letter-spacing: 0;
        }

        .header-status {
            display: flex;
            flex-wrap: wrap;
            gap: 16px 28px;
            font-size: 13px;
            color: #94a3b8;
        }
        .header-status span {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .header-status .label {
            color: #64748b;
        }
        .header-status .value {
            color: #e2e8f0;
            font-weight: 600;
        }
        .header-status .value.warning {
            color: #fbbf24;
        }
        .header-status .value.danger {
            color: #f87171;
        }
        .header-status .value.success {
            color: #4ade80;
        }

        .header-time {
            font-size: 18px;
            font-weight: 600;
            color: #4ade80;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 30px rgba(74, 222, 128, 0.08);
            background: #0f151c;
            padding: 6px 16px;
            border-radius: 8px;
            border: 1px solid #2a3a3a;
            letter-spacing: 0.5px;
            text-align: right;
        }
        .header-time .date {
            font-size: 12px;
            font-weight: 400;
            color: #94a3b8;
            display: block;
            text-align: right;
        }

        /* ===== KONTROL SPEED ===== */
        .speed-control {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #0f151c;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid #2a3a3a;
        }
        .speed-control button {
            background: none;
            border: none;
            color: #94a3b8;
            padding: 2px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.15s;
        }
        .speed-control button:hover {
            background: #2a3a3a;
            color: #e2e8f0;
        }
        .speed-control button.active {
            background: #2a7a3a;
            color: #fff;
            box-shadow: 0 0 15px rgba(42, 122, 58, 0.3);
        }
        .speed-control .label-speed {
            color: #64748b;
            font-size: 11px;
            margin-right: 4px;
        }

        /* ===== MAIN PANEL ===== */
        .main-panel {
            display: flex;
            flex: 1;
            gap: 0;
            height: calc(100vh - 80px);
        }

        /* ===== SIDEBAR KIRI (STASIUN) ===== */
        .sidebar-left {
            width: 260px;
            min-width: 260px;
            background: #11181f;
            border-right: 1px solid #1a2a2a;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sidebar-left h3 {
            font-size: 13px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
            border-bottom: 1px solid #1a2a2a;
            padding-bottom: 6px;
        }

        .station-select {
            width: 100%;
            padding: 8px 12px;
            background: #0f151c;
            border: 1px solid #2a3a3a;
            border-radius: 6px;
            color: #e2e8f0;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }
        .station-select:focus {
            border-color: #4ade80;
        }

        .difficulty-select {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .difficulty-select button {
            flex: 1;
            min-width: 50px;
            padding: 6px 8px;
            background: #0f151c;
            border: 1px solid #2a3a3a;
            border-radius: 6px;
            color: #94a3b8;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
        }
        .difficulty-select button:hover {
            background: #1a2a2a;
            color: #e2e8f0;
        }
        .difficulty-select button.active {
            background: #2a7a3a;
            border-color: #4ade80;
            color: #fff;
        }

        .train-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 4px;
        }
        .train-item {
            background: #0f151c;
            border-left: 3px solid #2a7a3a;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s;
            font-size: 13px;
        }
        .train-item:hover {
            background: #1a232e;
            border-left-color: #4ade80;
        }
        .train-item .train-number {
            font-weight: 700;
            color: #4ade80;
        }
        .train-item .train-name {
            color: #94a3b8;
            font-size: 12px;
        }
        .train-item .train-status {
            font-size: 11px;
            color: #fbbf24;
            margin-top: 2px;
        }
        .train-item .train-status.arrived {
            color: #4ade80;
        }
        .train-item .train-status.departed {
            color: #94a3b8;
        }
        .train-item .train-status.delayed {
            color: #f87171;
        }

        /* ===== VIEWPORT (Canvas) ===== */
        .viewport {
            flex: 1;
            background: #0a0e14;
            position: relative;
            overflow: hidden;
        }
        #trackCanvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #0a0e14;
        }

        /* ===== NOTIFICATION CENTER ===== */
        .notification-center {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 380px;
            max-height: 320px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
            z-index: 999;
        }
        .notification {
            background: #11181f;
            border-left: 4px solid #4ade80;
            padding: 12px 16px;
            border-radius: 6px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.7);
            pointer-events: auto;
            animation: slideIn 0.3s ease-out;
            font-size: 13px;
            border: 1px solid #1a2a2a;
        }
        .notification.info {
            border-left-color: #3b82f6;
        }
        .notification.warning {
            border-left-color: #fbbf24;
        }
        .notification.danger {
            border-left-color: #f87171;
        }
        .notification .notif-time {
            color: #64748b;
            font-size: 11px;
            display: block;
            margin-top: 4px;
        }
        .notification .notif-title {
            font-weight: 600;
            color: #e2e8f0;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(40px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1024px) {
            .sidebar-left {
                width: 200px;
                min-width: 200px;
            }
            .header-time {
                font-size: 14px;
            }
            .notification-center {
                width: 300px;
                bottom: 10px;
                right: 10px;
            }
        }
        @media (max-width: 768px) {
            .main-panel {
                flex-direction: column;
                height: auto;
            }
            .sidebar-left {
                width: 100%;
                min-width: unset;
                max-height: 300px;
                border-right: none;
                border-bottom: 1px solid #1a2a2a;
            }
            .viewport {
                height: 500px;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .header-left {
                flex-wrap: wrap;
            }
            .header-status {
                font-size: 12px;
                gap: 8px 16px;
            }
            .notification-center {
                width: 90%;
                right: 5%;
                bottom: 10px;
                max-height: 200px;
            }
        }

        /* ===== TOOLTIP ===== */
        .tooltip {
            position: absolute;
            background: #11181f;
            border: 1px solid #2a7a3a;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 12px;
            color: #e2e8f0;
            pointer-events: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
            z-index: 50;
            display: none;
            max-width: 220px;
        }
        .tooltip .tt-label {
            color: #94a3b8;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .tooltip .tt-value {
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- HEADER -->
        <header class="header">
            <div class="header-left">
                <div class="logo">
                    PPKA SIMULATOR <small>INDONESIA</small>
                </div>
                <div class="header-status">
                    <span><span class="label">DAOP</span> <span class="value" id="daopDisplay">8 SURABAYA</span></span>

                    <span><span class="label">MODE</span> <span class="value" id="modeDisplay">NORMAL</span></span>
                    <span><span class="label">STATUS</span> <span class="value success" id="systemStatus">NORMAL</span></span>

            </div>
            <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
                <div class="speed-control">
                    <span class="label-speed">SPEED</span>

        <!-- MAIN -->
        <div class="main-panel">
            <!-- SIDEBAR KIRI -->
            <aside class="sidebar-left">
                <div>
                    <h3>📍 Pilih Stasiun</h3>
                    <select class="station-select" id="stationSelect">
                        <option value="Surabaya Gubeng">Surabaya Gubeng</option>
                        <option value="Surabaya Pasarturi">Surabaya Pasarturi</option>

                    <div class="difficulty-select" id="difficultyGroup">
                        <button data-diff="easy" class="active">EASY</button>
                        <button data-diff="normal">NORMAL</button>
                        <button data-diff="hard">HARD</button>
                        <button data-diff="expert">EXPERT</button>
                    </div>
                </div>
                <div style="flex:1;min-height:0;">
                    <h3>🚆 Kereta Aktif</h3>
                    <div class="train-list" id="trainList">
                        <!-- diisi JS -->
                    </div>
                </div>
                <div style="font-size:12px;color:#64748b;border-top:1px solid #1a2a2a;padding-top:8px;">
                    <span>SKOR: <strong id="scoreDisplay" style="color:#4ade80;">0</strong></span>
                    <span style="margin-left:12px;">Tepat: <span id="onTimeCount" style="color:#4ade80;">0</span></span>
                    <span style="margin-left:12px;">Terlambat: <span id="delayedCount" style="color:#f87171;">0</span></span>
                </div>
            </aside>

            <!-- CANVAS -->
            <div class="viewport" id="viewport">
                <canvas id="trackCanvas"></canvas>
                <div class="tooltip" id="tooltip"></div>
            </div>
        </div>
    </div>

    <!-- NOTIFICATION CENTER -->
    <div class="notification-center" id="notificationCenter"></div>

    <script>
        // ============================================================
        // DATA JSON (embedded)
        // ============================================================
        const STATIONS_DATA = {

                switches: [],

                ]
            },
            "Sidoarjo": {
                tracks: [
                    { id: "T1", name: "Jalur 1", x: 150, y: 140 },
                    { id: "T2", name: "Jalur 2", x: 150, y: 220 },
                    { id: "T3", name: "Jalur 3", x: 150, y: 300 },

                ],
                signals: [

                    { id: "S_OUT1", x: 580, y: 140, type: "keluar", state: "red" },
                ]
            },
            "Mojokerto": {
                tracks: [
                    { id: "T1", name: "Jalur 1", x: 150, y: 160 },
                    { id: "T2", name: "Jalur 2", x: 150, y: 240 },
                ],
                switches: [],
                signals: [
                    { id: "S_IN", x: 80, y: 200, type: "masuk", state: "red" },
                    { id: "S_OUT1", x: 580, y: 160, type: "keluar", state: "red" },
                ]
            },
            "Jombang": {
                tracks: [
                    { id: "T1", name: "Jalur 1", x: 150, y: 150 },
                    { id: "T2", name: "Jalur 2", x: 150, y: 230 },
                    { id: "T3", name: "Jalur 3", x: 150, y: 310 },
                ],
                switches: [
                    { id: "W1", x: 380, y: 230, state: "normal" },
                ],
                signals: [
                    { id: "S_IN", x: 80, y: 230, type: "masuk", state: "red" },
                    { id: "S_OUT1", x: 580, y: 150, type: "keluar", state: "red" },
                ]
            },
            "Bojonegoro": {
                tracks: [
                    { id: "T1", name: "Jalur 1", x: 150, y: 160 },
                    { id: "T2", name: "Jalur 2", x: 150, y: 240 },
                ],
                switches: [],
                signals: [
                    { id: "S_IN", x: 80, y: 200, type: "masuk", state: "red" },
                    { id: "S_OUT1", x: 580, y: 160, type: "keluar", state: "red" },
                ]
            }
        };

        // DATA KERETA (jadwal)
        const TRAINS_DATA = [{
            number: "KA123",
            name: "Argo Bromo Anggrek",
            origin: "Surabaya Pasarturi",
            destination: "Surabaya Gubeng",
            station: "Surabaya Gubeng",
            arrival: "23:20",
            departure: "23:25",
            platform: "Jalur 2",
            status: "menunggu"
        }, {
            number: "KA456",
            name: "Mutiara Selatan",
            origin: "Malang",
            destination: "Surabaya Gubeng",
            station: "Surabaya Gubeng",
            arrival: "23:40",
            departure: "23:45",
            platform: "Jalur 1",
            status: "menunggu"
        }, {
            number: "KA789",
            name: "Local Surabaya",
            origin: "Sidoarjo",
            destination: "Surabaya Gubeng",
            station: "Surabaya Gubeng",
            arrival: "23:55",
            departure: "00:05",
            platform: "Jalur 3",
            status: "menunggu"
        }, {
            number: "KA101",
            name: "Gajayana",
            origin: "Malang",
            destination: "Surabaya Pasarturi",
            station: "Surabaya Pasarturi",
            arrival: "00:10",
            departure: "00:15",
            platform: "Jalur 1",
            status: "menunggu"
        }, {
            number: "KA202",
            name: "Brawijaya",
            origin: "Surabaya Gubeng",
            destination: "Malang",
            station: "Malang",
            arrival: "00:30",
            departure: "00:35",
            platform: "Jalur 2",
            status: "menunggu"
        }];

        // ============================================================
        // STATE GLOBAL
        // ============================================================
        const state = {
            station: 'Surabaya Gubeng',
            difficulty: 'easy',
            speed: 1,
            score: 0,
            onTime: 0,
            delayed: 0,
            trains: [],
            timeOffset: 0, // ms
            lastTimestamp: Date.now(),
            selectedTrain: null,
            routeLocked: false,
            switchStates: {},
            signalStates: {},
            trainPositions: {},
        };

        // ============================================================
        // DOM REFS
        // ============================================================
        const canvas = document.getElementById('trackCanvas');
        const ctx = canvas.getContext('2d');
        const viewport = document.getElementById('viewport');
        const stationSelect = document.getElementById('stationSelect');
        const trainListEl = document.getElementById('trainList');
        const clockDisplay = document.getElementById('clockDisplay');
        const timeStr = document.getElementById('timeStr');
        const dateStr = document.getElementById('dateStr');
        const notificationCenter = document.getElementById('notificationCenter');
        const tooltip = document.getElementById('tooltip');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const onTimeCount = document.getElementById('onTimeCount');
        const delayedCount = document.getElementById('delayedCount');
        const stationDisplay = document.getElementById('stationDisplay');
        const modeDisplay = document.getElementById('modeDisplay');

        // ============================================================
        // FUNGSI UTILITY
        // ============================================================
        function formatTime(d) {
            const pad = n => String(n).padStart(2, '0');
            return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
        }

        function formatDate(d) {
            const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            const months = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober',
                'November', 'Desember'
            ];
            return `${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
        }

        function getCurrentTime() {
            const now = new Date();
            return new Date(now.getTime() + state.timeOffset);
        }

        function parseTime(str) {
            const [h, m] = str.split(':').map(Number);
            return { h, m };
        }

        function timeToMinutes(str) {
            const { h, m } = parseTime(str);
            return h * 60 + m;
        }

        function getTrainStatus(train, now) {
            const nowMin = now.getHours() * 60 + now.getMinutes();
            const arrMin = timeToMinutes(train.arrival);
            const depMin = timeToMinutes(train.departure);

            // sederhana
            if (nowMin < arrMin - 5) return { text: 'Menunggu', cls: '', eta: arrMin - nowMin };
            if (nowMin < arrMin) return { text: 'Mendekati', cls: 'warning', eta: arrMin - nowMin };
            if (nowMin < depMin) return { text: 'Berhenti', cls: 'arrived', eta: depMin - nowMin };
            if (nowMin < depMin + 2) return { text: 'Berangkat', cls: 'departed', eta: 0 };
            return { text: 'Selesai', cls: 'departed', eta: 0 };
        }

        function addNotification(message, type = 'info', title = '') {
            const el = document.createElement('div');
            el.className = `notification ${type}`;
            const now = getCurrentTime();
            el.innerHTML = `
                ${title ? `<div class="notif-title">${title}</div>` : ''}
                ${message}
                <span class="notif-time">${formatTime(now)} WIB</span>
            `;
            notificationCenter.prepend(el);
            if (notificationCenter.children.length > 20) {
                notificationCenter.lastChild.remove();
            }
        }

        // ============================================================
        // SIMULATOR CORE
        // ============================================================
        function updateTrains() {
            const now = getCurrentTime();
            const station = state.station;

            // filter kereta untuk stasiun aktif
            state.trains = TRAINS_DATA.filter(t => t.station === station).map(t => {
                const status = getTrainStatus(t, now);
                return { ...t, statusText: status.text, statusCls: status.cls, eta: status.eta };
            });

            // update UI
            renderTrainList();
            updateScore();
        }

        function renderTrainList() {
            trainListEl.innerHTML = '';
            state.trains.forEach(train => {
                const div = document.createElement('div');
                div.className = 'train-item';
                div.innerHTML = `
                    <div class="train-number">${train.number}</div>
                    <div class="train-name">${train.name}</div>
                    <div class="train-status ${train.statusCls}">${train.statusText} ${train.eta > 0 ? `ETA: ${train.eta}m` : ''}</div>
                `;
                div.addEventListener('click', () => {
                    state.selectedTrain = train;
                    addNotification(`Detail ${train.number}: ${train.name} | ${train.origin} → ${train.destination} | Jalur ${train.platform}`, 'info', '📋 Informasi Kereta');
                });
                trainListEl.appendChild(div);
            });
        }

        function updateScore() {
            // sederhana: hitung dari status
            let onTime = state.trains.filter(t => t.statusCls === 'arrived' || t.statusCls === 'departed').length;
            let delayed = state.trains.filter(t => t.statusCls === 'warning' && t.eta > 10).length;
            state.onTime = onTime;
            state.delayed = delayed;
            state.score = onTime * 100 - delayed * 50;

            scoreDisplay.textContent = state.score;
            onTimeCount.textContent = state.onTime;
            delayedCount.textContent = state.delayed;
        }

        // ============================================================
        // RENDER CANVAS (Layout jalur)
        // ============================================================
        function renderCanvas() {
            const rect = viewport.getBoundingClientRect();
            canvas.width = rect.width || 800;
            canvas.height = rect.height || 500;
            const W = canvas.width,
                H = canvas.height;

            ctx.clearRect(0, 0, W, H);

            const stationData = STATIONS_DATA[state.station] || STATIONS_DATA['Surabaya Gubeng'];
            const tracks = stationData.tracks || [];
            const switches = stationData.switches || [];
            const signals = stationData.signals || [];

            // --- Gambar rel ---
            tracks.forEach((track, idx) => {
                const y = track.y || (100 + idx * 60);
                const x1 = 60,
                    x2 = W - 60;

                // status jalur (simulasi)
                let color = '#2a3a3a';
                if (idx === 0) color = '#4ade80'; // jalur 1 hijau
                else if (idx === 1) color = '#fbbf24'; // jalur 2 kuning
                else color = '#2a3a3a';

                ctx.beginPath();
                ctx.moveTo(x1, y);
                ctx.lineTo(x2, y);
                ctx.strokeStyle = color;
                ctx.lineWidth = 4;
                ctx.stroke();

                // label
                ctx.fillStyle = '#64748b';
                ctx.font = '11px monospace';
                ctx.fillText(track.name, x1 - 50, y + 4);
            });

            // --- Gambar wesel ---
            switches.forEach(sw => {
                const x = sw.x || 380;
                const y = sw.y || 180;
                const state = state.switchStates[sw.id] || sw.state || 'normal';
                const isDiverging = state === 'diverging';

                ctx.beginPath();
                ctx.arc(x, y, 14, 0, Math.PI * 2);
                ctx.fillStyle = isDiverging ? '#fbbf24' : '#4ade80';
                ctx.fill();
                ctx.strokeStyle = '#0a0e14';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillStyle = '#e2e8f0';
                ctx.font = '9px monospace';
                ctx.textAlign = 'center';
                ctx.fillText(sw.id, x, y + 4);

                // garis wesel
                if (isDiverging) {
                    ctx.beginPath();
                    ctx.moveTo(x - 20, y - 20);
                    ctx.lineTo(x + 20, y + 20);
                    ctx.strokeStyle = '#fbbf24';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                } else {
                    ctx.beginPath();
                    ctx.moveTo(x - 20, y);
                    ctx.lineTo(x + 20, y);
                    ctx.strokeStyle = '#4ade80';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }

                // interaktivitas
                const rect2 = { x: x - 20, y: y - 20, w: 40, h: 40 };
                // simpan untuk click detection
                if (!canvas._switches) canvas._switches = [];
                canvas._switches.push({ id: sw.id, rect: rect2, state: state });
            });

            // --- Gambar sinyal ---
            signals.forEach(sig => {
                const x = sig.x || 80;
                const y = sig.y || 180;
                const state = state.signalStates[sig.id] || sig.state || 'red';

                const colors = { red: '#f87171', yellow: '#fbbf24', green: '#4ade80' };
                const color = colors[state] || '#f87171';

                ctx.beginPath();
                ctx.arc(x, y, 10, 0, Math.PI * 2);
                ctx.fillStyle = color;
                ctx.fill();
                ctx.shadowColor = color;
                ctx.shadowBlur = 20;
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.fillStyle = '#e2e8f0';
                ctx.font = '8px monospace';
                ctx.textAlign = 'center';
                ctx.fillText(sig.id, x, y + 20);
                ctx.fillText(sig.type, x, y + 30);
            });

            // --- Gambar kereta (simulasi posisi) ---
            state.trains.forEach((train, idx) => {
                if (train.statusText === 'Selesai' || train.statusText === 'Menunggu') return;
                const progress = Math.min(1, Math.max(0, (Date.now() % 5000) / 5000));
                const xPos = 100 + progress * (W - 200);
                const yPos = 180 + (idx % 3) * 50;

                ctx.beginPath();
                ctx.rect(xPos - 15, yPos - 8, 30, 16);
                ctx.fillStyle = '#f87171';
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1;
                ctx.stroke();

                ctx.fillStyle = '#fff';
                ctx.font = '8px monospace';
                ctx.textAlign = 'center';
                ctx.fillText(train.number, xPos, yPos + 4);
            });

            // update signal states berdasarkan logika sederhana
            // jika ada kereta mendekati, sinyal hijau
            const hasApproaching = state.trains.some(t => t.statusText === 'Mendekati');
            signals.forEach(sig => {
                if (sig.type === 'masuk') {
                    state.signalStates[sig.id] = hasApproaching ? 'green' : 'red';
                }
            });
        }

        // ============================================================
        // INTERAKSI CANVAS (Klik wesel)
        // ============================================================
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const mx = (e.clientX - rect.left) * scaleX;
            const my = (e.clientY - rect.top) * scaleY;

            if (!canvas._switches) return;
            for (const sw of canvas._switches) {
                const r = sw.rect;
                if (mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h) {
                    // toggle wesel
                    const newState = sw.state === 'normal' ? 'diverging' : 'normal';
                    state.switchStates[sw.id] = newState;
                    addNotification(`Wesel ${sw.id} diubah menjadi ${newState.toUpperCase()}`, 'info', '🔄 Wesel');
                    renderCanvas();
                    return;
                }
            }
        });

        // ============================================================
        // SPEED CONTROL
        // ============================================================
        document.querySelectorAll('.speed-control button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.speed-control button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                state.speed = parseInt(btn.dataset.speed);
                addNotification(`Kecepatan simulasi: ${state.speed}×`, 'info', '⏱️ Speed');
            });
        });

        // ============================================================
        // DIFFICULTY
        // ============================================================
        document.querySelectorAll('#difficultyGroup button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#difficultyGroup button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                state.difficulty = btn.dataset.diff;
                modeDisplay.textContent = btn.dataset.diff.toUpperCase();
                addNotification(`Mode kesulitan: ${btn.dataset.diff.toUpperCase()}`, 'info', '🎯 Difficulty');
            });
        });

        // ============================================================
        // STATION SELECT
        // ============================================================
        stationSelect.addEventListener('change', () => {
            state.station = stationSelect.value;
            stationDisplay.textContent = state.station;
            addNotification(`Berpindah ke stasiun ${state.station}`, 'info', '📍 Stasiun');
            // reset sinyal & wesel
            state.switchStates = {};
            state.signalStates = {};
            updateTrains();
            renderCanvas();
        });

        // ============================================================
        // CLOCK UPDATE
        // ============================================================
        function updateClock() {
            const now = getCurrentTime();
            timeStr.textContent = formatTime(now) + ' WIB';
            dateStr.textContent = formatDate(now);
        }

        // ============================================================
        // LOOP UTAMA
        // ============================================================
        let lastUpdate = Date.now();

        function gameLoop() {
            const now = Date.now();
            const delta = (now - lastUpdate) * state.speed;
            lastUpdate = now;

            // update time offset untuk simulasi
            state.timeOffset += delta;

            // update clock setiap 100ms
            updateClock();

            // update trains setiap 2 detik
            if (now % 2000 < 50) {
                updateTrains();
                // notifikasi jika ada kereta mendekati
                const approaching = state.trains.filter(t => t.statusText === 'Mendekati' && t.eta <= 3);
                approaching.forEach(t => {
                    addNotification(`${t.number} ${t.name} akan memasuki stasiun dalam ${t.eta} menit. Siapkan jalur ${t.platform}.`, 'warning', '🚆 Kereta Mendekati');
                });
            }

            // render canvas setiap 100ms
            if (now % 100 < 20) {
                renderCanvas();
            }

            requestAnimationFrame(gameLoop);
        }

        // ============================================================
        // RESIZE
        // ============================================================
        window.addEventListener('resize', () => {
            renderCanvas();
        });

        // ============================================================
        // INIT
        // ============================================================
        function init() {
            // set default
            stationSelect.value = state.station;
            stationDisplay.textContent = state.station;
            modeDisplay.textContent = state.difficulty.toUpperCase();

            // load data
            updateTrains();
            renderCanvas();

            // notifikasi awal
            addNotification('Selamat datang di PPKA Simulator Indonesia – DAOP 8 Surabaya', 'info', '🚀 Sistem Siap');
            addNotification(`Stasiun ${state.station} aktif. Mode: ${state.difficulty.toUpperCase()}`, 'info', '📋 Status');

            // mulai loop
            lastUpdate = Date.now();
            gameLoop();

            // update clock immediately
            updateClock();
        }

        // jalankan
        init();

        // ============================================================
        // SIMULASI KERETA OTOMATIS (scheduler sederhana)
        // ============================================================
        // Tambahkan kereta baru setiap 30 detik (simulasi)
        setInterval(() => {
            const now = getCurrentTime();
            const hour = now.getHours();
            const min = now.getMinutes();

            // cek jadwal: jika waktu mendekati arrival, ubah status
            TRAINS_DATA.forEach(train => {
                const arrMin = timeToMinutes(train.arrival);
                const nowMin = hour * 60 + min;
                if (nowMin >= arrMin - 2 && nowMin < arrMin) {
                    // kirim notifikasi
                    if (train.station === state.station) {
                        addNotification(`${train.number} ${train.name} segera tiba. Jalur ${train.platform}`, 'warning', '🚆 Jadwal');
                    }
                }
            });
        }, 10000);

        console.log('PPKA Simulator Indonesia – DAOP 8 Surabaya');
        console.log('Sistem siap digunakan. Selamat bersimulasi!');
    </script>
</body>
