:root{
  --bg:#0f172a;

}

*{box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{
  margin:0;

  animation:gradientBG 15s ease infinite;
}
@keyframes gradientBG{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

.header{display:flex;align-items:center;padding:18px 22px;background:rgba(0,0,0,0.3);border-bottom:1px solid var(--border);}
.brand{display:flex;align-items:center;gap:14px;}
.logo{width:50px;height:50px;border-radius:14px;overflow:hidden;background:rgba(255,255,255,0.05);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;}
.logo img{width:100%;height:100%;object-fit:cover;}

.container{
  max-width:900px;
  margin:60px auto;
  padding:40px;
  border-radius:28px;
  background:linear-gradient(145deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
  border:1px solid rgba(255,255,255,0.15);
  backdrop-filter:blur(20px);
  box-shadow:0 20px 60px rgba(0,0,0,0.6);
}

h2{
  text-align:center;
  margin-bottom:25px;
  font-weight:700;
  font-size:24px;
  background:linear-gradient(90deg,var(--accent1),var(--accent2));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.input-group{
  margin-bottom:15px;
}

label{
  font-size:13px;
  opacity:.7;
}

input,select{
  width:100%;
  padding:14px;
  margin-top:6px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,0.15);
  background:rgba(255,255,255,0.05);
  color:#fff;
  transition:.3s;
}

input:focus,select:focus{
  outline:none;
  border-color:var(--accent2);
  box-shadow:0 0 20px rgba(6,182,212,0.4);
}

button{
  width:100%;
  padding:16px;
  margin-top:20px;
  border-radius:16px;
  border:none;
  font-weight:700;
  font-size:15px;
  cursor:pointer;
  background:linear-gradient(90deg,var(--accent1),var(--accent2));
  color:white;
  box-shadow:0 10px 30px rgba(124,58,237,0.6);
  transition:.3s;
}

button:hover{
  transform:translateY(-3px);
  box-shadow:0 15px 40px rgba(6,182,212,0.8);
}

.best-seller{
  display:inline-block;
  padding:4px 10px;
  margin-left:6px;
  border-radius:999px;
  font-size:11px;
  font-weight:700;
  background:linear-gradient(90deg, orange, gold);
  color:#000;
  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(255,165,0,0.7)}
  70%{box-shadow:0 0 0 10px rgba(255,165,0,0)}
  100%{box-shadow:0 0 0 0 rgba(255,165,0,0)}
}

.discount{
  display:inline-block;
  padding:4px 8px;
  border-radius:8px;
  font-size:11px;
  background:#22c55e;
  color:#000;
  margin-left:6px;
  font-weight:700;
}

input,select,button{width:100%;padding:12px;margin-top:10px;border-radius:10px;border:1px solid var(--border);background:#111;color:#fff;}
button{cursor:pointer;background:linear-gradient(90deg,var(--accent1),var(--accent2));}

.desc{margin-top:10px;padding:10px;background:var(--glass);border-radius:10px;}
</style></head>

let selectedService=null;

function generateTransactionID(){
  return `TRX${Date.now()}${Math.floor(Math.random()*1000)}`;
}

window.onload=function(){
  const kategori=document.getElementById("kategori");
  kategori.innerHTML="<option value=''>Pilih Kategori</option>";
  for(let k in layananData){
    let opt=document.createElement("option");
    opt.value=k; opt.textContent=k;
    kategori.appendChild(opt);
  }
}

function loadLayanan(){
  const kategori=document.getElementById("kategori").value;
  const layanan=document.getElementById("layanan");
  layanan.innerHTML="<option value=''>Pilih Layanan</option>";

  if(kategori){
    layananData[kategori].forEach(l=>{
      let opt=document.createElement("option");
      opt.value=l.id;

      let label=l.name+" (ID: "+l.id+")";
      if(l.bestSeller){
        label+=" 🔥 BEST SELLER";
      }

      opt.textContent=label;
      layanan.appendChild(opt);
    });
  }
}

function showInfo(){
  const kategori=document.getElementById("kategori").value;
  const layananID=document.getElementById("layanan").value;

  selectedService=layananData[kategori].find(l=>l.id==layananID);

  if(!selectedService) return;

  const badge=selectedService.bestSeller ? " 🔥 <span class='best-seller'>BEST SELLER</span>" : "";

  document.getElementById("infoLayanan").innerHTML=
  `<b>${selectedService.name}${badge}</b><br>
  Harga: Rp${selectedService.pricePerFollower}<br>
  ${selectedService.desc}`;
}

function hitungTotal(){
  if(!selectedService)return;
  const jumlah=parseInt(document.getElementById("jumlah").value||0);

  const min = selectedService.min || 1;
  const max = selectedService.max || Infinity;

  if(jumlah < min || jumlah > max){
    document.getElementById("total").value="Jumlah tidak valid";
    return;
  }

  document.getElementById("total").value=jumlah*selectedService.pricePerFollower;
}

function searchLayanan(){
  const q=document.getElementById("search").value.toLowerCase();
  for(let k in layananData){
    for(let l of layananData[k]){
      if(l.name.toLowerCase().includes(q)){
        document.getElementById("kategori").value=k;
        loadLayanan();
        document.getElementById("layanan").value=l.id;
        showInfo();
        return;
      }
    }
  }
}

function lanjutPembayaran(){
  if(!selectedService){alert("Pilih layanan terlebih dahulu!");return;}

  const jumlah=parseInt(document.getElementById("jumlah").value||"0");
  const min = selectedService.min || 1;
  const max = selectedService.max || Infinity;

  if(jumlah < min || jumlah > max){
    alert(`Jumlah harus antara ${min} dan ${max === Infinity ? '∞' : max}`);
    return;
  }

  const trxID=generateTransactionID();
  const kategori=document.getElementById("kategori").value;
  const target=document.getElementById("target").value;
  const total=jumlah * selectedService.pricePerFollower;

  window.location.href=`payment?trx=${trxID}&kategori=${kategori}&layanan=${selectedService.name}&id=${selectedService.id}&jumlah=${jumlah}&total=${total}&target=${encodeURIComponent(target)}`;
}
