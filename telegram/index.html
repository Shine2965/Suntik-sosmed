<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shine Shop - SMM</title>

<style>/* ===============================
   ROOT THEME
=================================*/
:root{
  --bg:#0f172a;
  --glass:rgba(255,255,255,0.05);
  --glass-strong:rgba(255,255,255,0.08);
  --border:rgba(255,255,255,0.15);
  --accent1:#7c3aed;
  --accent2:#06b6d4;
  --text:#f8fafc;
}

/* ===============================
   BASE
=================================*/
*{
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  margin:0;
  color:var(--text);
  background:linear-gradient(-45deg,#0f172a,#1e293b,#111827,#0f2027);
  background-size:400% 400%;
  animation:gradientBG 15s ease infinite;
}

@keyframes gradientBG{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

/* ===============================
   HEADER
=================================*/
.header{
  display:flex;
  align-items:center;
  padding:18px 22px;
  backdrop-filter:blur(12px);
  background:rgba(0,0,0,0.3);
  border-bottom:1px solid var(--border);
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
}

.logo{
  width:50px;
  height:50px;
  border-radius:14px;
  overflow:hidden;
  background:rgba(255,255,255,0.05);
  border:1px solid var(--border);
  box-shadow:0 0 20px rgba(124,58,237,0.6);
  display:flex;
  align-items:center;
  justify-content:center;
}

.logo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

h1{
  font-size:18px;
  margin:0;
  font-weight:600;
}

/* ===============================
   HAMBURGER
=================================*/
.hamburger-btn{
  margin-left:auto;
  background:var(--glass);
  border:1px solid var(--border);
  padding:10px 14px;
  border-radius:12px;
  cursor:pointer;
}

.hamburger-icon span{
  display:block;
  height:3px;
  width:24px;
  background:white;
  margin:4px 0;
  border-radius:6px;
  transition:.3s;
}

.hamburger-btn.active span:nth-child(1){
  transform:rotate(45deg) translateY(7px);
}
.hamburger-btn.active span:nth-child(2){
  opacity:0;
}
.hamburger-btn.active span:nth-child(3){
  transform:rotate(-45deg) translateY(-7px);
}

/* ===============================
   OFFCANVAS
=================================*/
.offcanvas{
  position:fixed;
  top:0;
  left:-280px;
  width:260px;
  height:100%;
  background:#0b1120;
  padding:25px;
  transition:.4s;
  z-index:100;
  border-right:2px solid var(--accent1);
}

.offcanvas.open{
  left:0;
}

.menu-list{
  list-style:none;
  padding:0;
}

.menu-list li{
  margin-bottom:10px;
}

.menu-list a{
  display:block;
  padding:12px;
  background:var(--glass);
  border-radius:10px;
  color:white;
  text-decoration:none;
  border:1px solid var(--border);
}

.menu-list a:hover{
  background:var(--glass-strong);
  transform:translateX(6px);
}

/* ===============================
   OVERLAY
=================================*/
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  opacity:0;
  pointer-events:none;
  transition:.3s;
  z-index:90;
}
.overlay.show{
  opacity:1;
  pointer-events:auto;
}

/* ===============================
   CONTAINER
=================================*/
.container{
  max-width:820px;
  margin:60px auto;
  padding:35px;
  border-radius:25px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(15px);
  border:1px solid var(--border);
  box-shadow:0 0 40px rgba(0,0,0,0.6);
}

h2{
  text-align:center;
  margin-bottom:25px;
  font-weight:600;
  background:linear-gradient(90deg,var(--accent1),var(--accent2));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* ===============================
   FORM
=================================*/
label{
  display:block;
  margin-top:15px;
  font-size:14px;
  font-weight:500;
}

input,select{
  width:100%;
  padding:13px;
  margin-top:5px;
  border-radius:12px;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.07);
  color:white;
  font-size:14px;
}

input:focus,select:focus{
  outline:none;
  border-color:var(--accent2);
  box-shadow:0 0 15px rgba(6,182,212,0.6);
}

.desc{
  margin-top:10px;
  padding:15px;
  background:var(--glass);
  border-radius:12px;
  border:1px dashed var(--border);
  font-size:13px;
}

button{
  width:100%;
  padding:14px;
  margin-top:25px;
  border-radius:14px;
  border:none;
  font-weight:600;
  font-size:15px;
  cursor:pointer;
  background:linear-gradient(90deg,var(--accent1),var(--accent2));
  color:white;
  box-shadow:0 0 20px rgba(124,58,237,0.6);
  transition:.3s;
}

button:hover{
  transform:translateY(-3px);
  box-shadow:0 0 30px rgba(6,182,212,0.9);
}

</style>

<script>
const toggleBtn=document.getElementById("menuToggle");
const closeBtn=document.getElementById("menuClose");
const offcanvas=document.getElementById("siteMenu");
const overlay=document.getElementById("menuOverlay");

function openMenu(){
  offcanvas.classList.add("open");
  overlay.classList.add("show");
  toggleBtn.classList.add("active");
}
function closeMenu(){
  offcanvas.classList.remove("open");
  overlay.classList.remove("show");
  toggleBtn.classList.remove("active");
}

toggleBtn.onclick=()=> offcanvas.classList.contains("open")?closeMenu():openMenu();
closeBtn.onclick=closeMenu;
overlay.onclick=closeMenu;
</script>

let selectedService=null;

window.onload=function(){
  const kategori=document.getElementById("kategori");
  for(let k in layananData){
    let opt=document.createElement("option");
    opt.value=k; opt.textContent=k;
    kategori.appendChild(opt);
  }
}

function loadLayanan(){
  const kategori=document.getElementById("kategori").value;
  const layanan=document.getElementById("layanan");
  layanan.innerHTML="<option value=''>-- Pilih Layanan --</option>";

  if(kategori){
    layananData[kategori].forEach(l=>{
      let opt=document.createElement("option");
      opt.value=l.id;
      opt.textContent=l.name+" (ID: "+l.id+")";
      layanan.appendChild(opt);
    });
  }
  document.getElementById("infoLayanan").innerHTML="";
  selectedService=null;
}

function showInfo(){
  const kategori=document.getElementById("kategori").value;
  const layananID=document.getElementById("layanan").value;

  selectedService=layananData[kategori].find(l=>l.id==layananID);
  document.getElementById("infoLayanan").innerHTML=
  `<b>${selectedService.name}</b><br>
   ID Produk: ${selectedService.id}<br>
   Harga: Rp${selectedService.pricePerFollower}/unit<br>
   Min: ${selectedService.min} | Max: ${selectedService.max}<br>
   ${selectedService.desc}`;
}

function hitungTotal(){
  if(!selectedService)return;
  const jumlah=parseInt(document.getElementById("jumlah").value||"0");
  if(jumlah < selectedService.min || jumlah > selectedService.max){
    document.getElementById("total").value="Jumlah tidak valid!";
    return;
  }
  document.getElementById("total").value=jumlah * selectedService.pricePerFollower;
}

function generateTransactionID(){
  return `TRX${Date.now()}${Math.floor(Math.random()*1000)}`;
}

function searchLayanan(){
  const q=document.getElementById("search").value.toLowerCase();
  const kategori=document.getElementById("kategori");
  const layanan=document.getElementById("layanan");

  for(let k in layananData){
    for(let l of layananData[k]){
      if(l.name.toLowerCase().includes(q) || String(l.id).includes(q)){
        kategori.value=k;
        loadLayanan();
        layanan.value=l.id;
        showInfo();
        return;
      }
    }
  }
}

function lanjutPembayaran(){
  if(!selectedService){alert("Pilih layanan terlebih dahulu!");return;}

  const jumlah=parseInt(document.getElementById("jumlah").value||"0");
  if(jumlah < selectedService.min || jumlah > selectedService.max){
    alert(`Jumlah harus antara ${selectedService.min} dan ${selectedService.max}`);
    return;
  }

  const trxID=generateTransactionID();
  const kategori=document.getElementById("kategori").value;
  const target=document.getElementById("target").value;
  const total=jumlah * selectedService.pricePerFollower;

  window.location.href=`/payment/?trx=${trxID}&kategori=${kategori}&layanan=${selectedService.name}&id=${selectedService.id}&jumlah=${jumlah}&total=${total}&target=${encodeURIComponent(target)}`;
}
