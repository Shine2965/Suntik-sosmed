<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Pembayaran QRIS - Shine Shop</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>

<style>
*{box-sizing:border-box}
body{
  font-family:'Poppins',sans-serif;
  background:
    radial-gradient(circle at top left,#00c6ff33,transparent 40%),
    radial-gradient(circle at bottom right,#0072ff33,transparent 40%),
    linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
  color:#fff;
}
.card{
  width:100%;
  max-width:460px;
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(14px);
  border-radius:22px;
  padding:24px;
}
h2{margin:0;font-size:22px;font-weight:700}
.subtitle{font-size:14px;color:#cbd5e1;margin-top:4px}
.qr-wrapper{
  background:#fff;
  border-radius:18px;
  padding:16px;
  margin:18px auto;
  width:fit-content
}
.details{font-size:13.5px;line-height:1.7}
input{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:none;
  margin-top:10px;
  font-size:13px
}
.btn{
  width:100%;
  margin-top:18px;
  padding:14px;
  border-radius:999px;
  border:none;
  font-size:15px;
  font-weight:700;
  color:#fff;
  background:linear-gradient(135deg,#00c6ff,#0072ff);
  cursor:pointer
}
.muted{text-align:center;font-size:12px;color:#cbd5e1;margin-top:12px}
</style>

<script>
async function checkIPBan(){
  try{
    const ipRes = await fetch("https://api.ipify.org?format=json");
    const { ip } = await ipRes.json();

    const banRes = await fetch("sosmed-2/payment/ip.json",{cache:"no-store"});
    if(!banRes.ok) return;

    const bannedList = await banRes.json();
    const banned = bannedList.find(x => x.ip === ip);

    if(banned){
      const reason = banned.reason || "Tidak ada keterangan";

      document.body.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:center;height:100vh;background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);color:white;text-align:center;">
      <div style="max-width:420px;background:rgba(255,255,255,.12);padding:30px;border-radius:22px;">
      <h1>🚫 Akses Diblokir</h1>
      <p>Akses kamu diblokir</p>
      <div>${reason}</div>
      </div></div>`;
      throw new Error("IP_BANNED");
    }
  }catch(e){
    if(e.message === "IP_BANNED") throw e;
  }
}
checkIPBan();
</script>

</head>
<body>

<div class="card">
<h2>Pembayaran QRIS Shine Shop - Telegram Market</h2>
<div class="subtitle">Scan QR untuk menyelesaikan pembayaran</div>

<div class="qr-wrapper">
<canvas id="qrisCanvas" width="240" height="240"></canvas>
</div>

<div class="details" id="orderDetails"></div>

<input type="text" id="namaInput" placeholder="Nama Lengkap">
<input type="email" id="gmailInput" placeholder="Gmail Aktif">

<input type="text" id="voucherInput" placeholder="Kode Voucher (opsional)">
<button id="applyVoucher" class="btn" style="margin-top:10px;background:#22c55e;">Gunakan Voucher</button>

<input type="file" id="buktiInput" accept="image/*">

<button id="confirmBtn" class="btn">Konfirmasi Pembayaran</button>

<div class="muted">Admin memproses maksimal 72 jam</div>
</div>

<script>
const discordWebhook = "https://discord.com/api/webhooks/1482244989021851748/oq__kcKXWHJILOG96lbfFxfZKoKCLEqkLJrlSS_rTQ6YEhgSTnFL_Guu8ZulERNEmCZV";
const discordWebhookTransaksi = "https://discord.com/api/webhooks/1482245411325345793/79LyZzxEZxoHVZeW9bgJpf_SmPDQ4uZCO6DO652Hids_7xZjK0gUYuOZrgBqoin-Qez6";

/* PARAM */
const p = new URLSearchParams(location.search);
const trx = p.get("trx") || "-";
const kategori = p.get("kategori") || "-";
const layanan = p.get("layanan") || "-";
const total = Number(p.get("total") || 0);
const target = p.get("target") || "-";

/* STATE */
let originalTotal = total;
let finalTotal = total;
let appliedVoucher = null;

/* DISPLAY */
function updateDisplay(){
  orderDetails.innerHTML = `
  <strong>ID:</strong> ${trx}<br>
  <strong>Layanan:</strong> ${layanan}<br>
  <strong>Target:</strong> ${target}<br>
  <strong>Total:</strong> <s>Rp ${originalTotal.toLocaleString("id-ID")}</s><br>
  <strong>Total Bayar:</strong> Rp ${finalTotal.toLocaleString("id-ID")}
  `;
  QRCode.toCanvas(qrisCanvas, buildQR(finalTotal), {width:240});
}

/* QR */
function crc16(s){
let c=0xFFFF;
for(let i=0;i<s.length;i++){
c^=s.charCodeAt(i)<<8;
for(let j=0;j<8;j++){
c=c&0x8000?(c<<1)^0x1021:c<<1;
}}
return (c&0xFFFF).toString(16).toUpperCase().padStart(4,'0');
}
function buildQR(a){
const str=String(parseInt(a));
const tag="54"+String(str.length).padStart(2,"0")+str;
const base="00020101021226670016COM.NOBUBANK.WWW01189360050300000879140214526036770909650303UMI51440014ID.CO.QRIS.WWW0215ID20243611417480303UMI5204541153033605802ID5920SHINE SHOP OK19967206008SURABAYA61056011162070703A01";
const d=base+tag+"6304";
return d+crc16(d);
}

async function loadVoucher(){
  try{
    const r = await fetch("/telegram/payment/voucher.json",{cache:"no-store"});
    const data = await r.json();

    if(!Array.isArray(data)) return [];

    return data;
  }catch{
    return [];
  }
}
/* APPLY VOUCHER */
applyVoucher.onclick = async()=>{
  const code = voucherInput.value.trim().toUpperCase();
  if(!code) return Swal.fire("Isi kode voucher","","warning");

  const list = await loadVoucher();
  const v = list.find(x => x.code === code);

  if(!v) return Swal.fire("Voucher tidak valid","","error");

  if(v.min_purchase && originalTotal < v.min_purchase){
    return Swal.fire("Minimal pembelian",
    `Min Rp ${v.min_purchase.toLocaleString("id-ID")}`,"warning");
  }

  let discount = 0;

  if(v.type==="percent"){
    discount = originalTotal * v.value / 100;
    if(v.max_discount) discount = Math.min(discount, v.max_discount);
  }else{
    discount = v.value;
  }

  finalTotal = Math.max(originalTotal - discount,0);
  appliedVoucher = v.code;

  updateDisplay();
  Swal.fire("Berhasil","Voucher dipakai","success");
};

/* SEND */
confirmBtn.onclick = async()=>{
  const nama = namaInput.value;
  const gmail = gmailInput.value;
  const file = buktiInput.files[0];

  if(!nama||!gmail||!file){
    return Swal.fire("Lengkapi data","","warning");
  }

  Swal.fire({title:"Mengirim...",didOpen:()=>Swal.showLoading()});

  await fetch(discordWebhook,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      content:`💰 Pembayaran Baru Telegram market
ID: ${trx}
Layanan: ${layanan}
Total: Rp ${finalTotal.toLocaleString("id-ID")}
target: ${target}
Voucher: ${appliedVoucher || "-"}
Nama: ${nama}
Gmail: ${gmail}`
    })
  });

  let form = new FormData();
  form.append("file",file);
  await fetch(discordWebhook,{method:"POST",body:form});

  await fetch(discordWebhookTransaksi,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      content:`🆕 TRANSAKSI BARU TELEGRAM MARKET
ID: ${trx}
Total: Rp ${finalTotal.toLocaleString("id-ID")}
Voucher: ${appliedVoucher || "-"}`
    })
  });

  Swal.fire("Berhasil","Terkirim","success");
};

  /* ANTI INSPECT */

document.addEventListener("contextmenu",e=>e.preventDefault());

document.addEventListener("keydown",function(e){

if(e.key === "F12") e.preventDefault();

if(e.ctrlKey && e.shiftKey && ["I","C","J"].includes(e.key)) e.preventDefault();

if(e.ctrlKey && e.key === "u") e.preventDefault();

});

setInterval(()=>{

if(window.outerWidth-window.innerWidth>160||window.outerHeight-window.innerHeight>160){

document.body.innerHTML="<h1 style='color:gold;text-align:center;margin-top:40vh;'>🚫 Developer Tools Terdeteksi</h1>";

}

},1000);

setInterval(()=>{console.clear();},1000);
  
/* INIT */
updateDisplay();
</script>

</body>
</html>
