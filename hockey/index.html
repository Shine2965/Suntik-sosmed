<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<title>Air Hockey Game v3.0 Arena</title>
<style>
body{margin:0;background:#000;display:flex;flex-direction:column;align-items:center;color:#0ff;font-family:Arial Black,sans-serif}
h1{margin:10px}
#controls{margin:10px}
select,button{padding:8px;margin:5px;border-radius:8px;border:none;background:#111;color:#0ff;box-shadow:0 0 10px #0ff inset;cursor:pointer}
canvas{background:#031b0f;border:4px solid #0ff;box-shadow:0 0 20px #0ff;touch-action:none}
#status{margin-top:10px}
.goal{position:absolute}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center}
.modal-content{background:#111;padding:20px;border-radius:15px;text-align:center}
.modal-content img{width:250px}
</style>
</head>
<body><h1>Air Hockey Neon Arena</h1><div id="controls">
<select id="mode">
<option value="easy">AI EASY</option>
<option value="hard">AI HARD</option>
<option value="pvp">PLAYER VS PLAYER</option>
</select>
<button onclick="startGame()">Mulai Game</button>
<button onclick="openQRIS()">❤️ Donate QRIS</button>
</div><canvas id="gameCanvas" width="400" height="600"></canvas>

<div id="status">Skor P1: 0 | P2: 0 | Waktu: 180</div><div class="modal" id="qrisModal">
<div class="modal-content">
<h2>Scan QRIS</h2>
<img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=00020101021126670016COM.NOBUBANK.WWW01189360050300000879140214526036770909650303UMI51440014ID.CO.QRIS.WWW0215ID20243611417480303UMI5204541153033605802ID5920SHINE%20SHOP%20OK19967206008SURABAYA61056011162070703A0163041008">
<br><br><button onclick="closeQRIS()">Tutup</button>
</div></div><script>
const canvas=document.getElementById("gameCanvas");
const ctx=canvas.getContext("2d");
const statusText=document.getElementById("status");

let mode="easy";
let score1=0,score2=0,timeLeft=180;
let player1,player2,puck;
let gameInterval,timer;

const goalWidth=140;
const goalLeft=(canvas.width-goalWidth)/2;
const goalRight=goalLeft+goalWidth;

function startGame(){
mode=document.getElementById("mode").value;
score1=0;score2=0;timeLeft=180;
player1={x:200,y:520,r:25};
player2={x:200,y:80,r:25};
puck={x:200,y:300,r:15,dx:4,dy:4};
clearInterval(gameInterval);clearInterval(timer);
gameInterval=setInterval(update,1000/60);
timer=setInterval(()=>{
timeLeft--;
statusText.textContent=`Skor P1: ${score1} | P2: ${score2} | Waktu: ${timeLeft}`;
if(timeLeft<=0){clearInterval(gameInterval);clearInterval(timer);} },1000);
}

function drawArena(){
ctx.strokeStyle="#0ff";
ctx.lineWidth=3;
ctx.strokeRect(0,0,canvas.width,canvas.height);
ctx.beginPath();
ctx.moveTo(0,canvas.height/2);
ctx.lineTo(canvas.width,canvas.height/2);
ctx.stroke();
ctx.strokeRect(goalLeft,0,goalWidth,10);
ctx.strokeRect(goalLeft,canvas.height-10,goalWidth,10);
}

function update(){
ctx.clearRect(0,0,canvas.width,canvas.height);
drawArena();

puck.x+=puck.dx;
puck.y+=puck.dy;

// side walls
if(puck.x<puck.r||puck.x>canvas.width-puck.r)puck.dx*=-1;

// top goal
if(puck.y<puck.r){
if(puck.x>goalLeft&&puck.x<goalRight){score1++;resetPuck();}
else puck.dy*=-1;
}

// bottom goal
if(puck.y>canvas.height-puck.r){
if(puck.x>goalLeft&&puck.x<goalRight){score2++;resetPuck();}
else puck.dy*=-1;
}

// AI movement
if(mode!=="pvp"){
let speed=mode==="easy"?2:5;
player2.x+= (puck.x-player2.x)*0.05*speed;
}

collide(player1);
collide(player2);

drawCircle(player1,"#0ff");
drawCircle(player2,"#f0f");
drawCircle(puck,"#ff0");
}

function collide(player){
let dx=puck.x-player.x;
let dy=puck.y-player.y;
let dist=Math.sqrt(dx*dx+dy*dy);
if(dist<player.r+puck.r){
let angle=Math.atan2(dy,dx);
puck.dx=Math.cos(angle)*6;
puck.dy=Math.sin(angle)*6;
}
}

function drawCircle(o,c){ctx.beginPath();ctx.arc(o.x,o.y,o.r,0,Math.PI*2);ctx.fillStyle=c;ctx.fill();}

function resetPuck(){puck.x=200;puck.y=300;puck.dx*=-1;puck.dy*=-1;}

canvas.addEventListener("mousemove",e=>{
const rect=canvas.getBoundingClientRect();
let x=e.clientX-rect.left;
let y=e.clientY-rect.top;
if(y>canvas.height/2) {player1.x=x;player1.y=y;}
if(mode==="pvp"&&y<canvas.height/2){player2.x=x;player2.y=y;}
});

canvas.addEventListener("touchmove",e=>{
const rect=canvas.getBoundingClientRect();
let x=e.touches[0].clientX-rect.left;
let y=e.touches[0].clientY-rect.top;
if(y>canvas.height/2){player1.x=x;player1.y=y;}
});

function openQRIS(){document.getElementById("qrisModal").style.display="flex"}
function closeQRIS(){document.getElementById("qrisModal").style.display="none"}
</script></body>
</html>
