<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Air Hockey Game v1.8 Neon</title>

  <style>
    body {
      margin: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #0ff;
      font-family: 'Arial Black', sans-serif;
      text-shadow: 0 0 8px #0ff;
    }

    h1 {
      margin: 10px;
      text-align: center;
      color: #0ff;
      text-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
    }

    #controls {
      margin: 10px;
      text-align: center;
    }

    select, button {
      padding: 8px;
      font-size: 16px;
      margin: 5px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: #0ff;
      box-shadow: 0 0 10px #0ff inset, 0 0 15px #0ff;
      cursor: pointer;
    }

    .donate-btn {
      color: #76CC11;
      font-weight: bold;
      box-shadow: 0 0 10px #76CC11 inset, 0 0 15px #76CC11;
      text-shadow: 0 0 5px #76CC11;
    }

    #gameCanvas {
      background: #02010a;
      display: block;
      margin: 10px auto;
      border: 3px solid #0ff;
      box-shadow: 0 0 20px #0ff, 0 0 40px #0ff;
      touch-action: none;
    }

    #status {
      font-size: 18px;
      margin-top: 10px;
      color: #0ff;
    }

    footer {
      margin: 20px;
      font-size: 14px;
      color: #f0f;
      text-shadow: 0 0 10px #f0f, 0 0 20px #f0f;
    }

    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    .modal-content {
      background: #111;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 0 20px #0ff;
      max-width: 350px;
    }

    .modal-content img {
      width: 250px;
      margin: 15px 0;
      border-radius: 10px;
      box-shadow: 0 0 15px #0ff;
    }

    .close-btn {
      background: #ff0055;
      color: #fff;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <h1>Air Hockey Game v1.8 Neon</h1>

  <div id="controls">
    <select id="mode">
      <option value="2p">2 Pemain</option>
      <option value="easy">Vs AI Easy</option>
      <option value="hard">Vs AI Hard</option>
    </select>

    <button onclick="startGame()">Mulai Game</button>
    <button class="donate-btn" onclick="openQRIS()">❤️ Donate QRIS</button>
  </div>

  <canvas id="gameCanvas" width="400" height="600"></canvas>

  <div id="status">
    Skor P1: 0 | P2: 0 | Waktu: 180
  </div>

  <footer>
    Dibuat oleh Alvino Jeremy - 2025
  </footer>

  <div class="modal" id="qrisModal">
    <div class="modal-content">
      <h2>Scan QRIS Untuk Donate</h2>
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=00020101021126670016COM.NOBUBANK.WWW01189360050300000879140214526036770909650303UMI51440014ID.CO.QRIS.WWW0215ID20243611417480303UMI5204541153033605802ID5920SHINE%20SHOP%20OK19967206008SURABAYA61056011162070703A0163041008" alt="QRIS Code">
      <br>
      <button class="close-btn" onclick="closeQRIS()">Tutup</button>
    </div>
  </div>

  <script>

    /* =======================
       ANTI INSPECT PROTECTION
    ======================== */

    document.addEventListener('contextmenu', e => e.preventDefault());

    document.onkeydown = function(e) {
      if (
        e.keyCode == 123 ||
        (e.ctrlKey && e.shiftKey && e.keyCode == 73) ||
        (e.ctrlKey && e.shiftKey && e.keyCode == 74) ||
        (e.ctrlKey && e.keyCode == 85) ||
        (e.ctrlKey && e.shiftKey && e.keyCode == 67)
      ) {
        return false;
      }
    };

    setInterval(function(){
      const devtools = /./;
      devtools.toString = function(){
        this.opened = true;
      }
      console.log(devtools);
      if(devtools.opened){
        document.body.innerHTML = "<h1 style='color:red;text-align:center;margin-top:50px'>Inspect Terdeteksi!</h1>";
      }
    },1000);

    /* =======================
       GAME LOGIC
    ======================== */

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const statusText = document.getElementById("status");

    let score1 = 0, score2 = 0, timeLeft = 180;
    let player1, player2, puck;
    let gameInterval, timer;

    function startGame() {
      score1 = 0;
      score2 = 0;
      timeLeft = 180;

      player1 = { x: 200, y: 550, r: 25 };
      player2 = { x: 200, y: 50, r: 25 };
      puck = { x: 200, y: 300, r: 15, dx: 3, dy: 3 };

      clearInterval(gameInterval);
      clearInterval(timer);

      gameInterval = setInterval(update, 1000 / 60);
      timer = setInterval(() => {
        timeLeft--;
        statusText.textContent = `Skor P1: ${score1} | P2: ${score2} | Waktu: ${timeLeft}`;
        if (timeLeft <= 0) {
          clearInterval(gameInterval);
          clearInterval(timer);
          statusText.textContent = `Waktu Habis! Skor Akhir P1: ${score1} | P2: ${score2}`;
        }
      }, 1000);
    }

    function update() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      puck.x += puck.dx;
      puck.y += puck.dy;

      if (puck.x < puck.r || puck.x > canvas.width - puck.r) puck.dx *= -1;
      if (puck.y < puck.r) { score1++; resetPuck(); }
      if (puck.y > canvas.height - puck.r) { score2++; resetPuck(); }

      ctx.beginPath();
      ctx.arc(puck.x, puck.y, puck.r, 0, Math.PI * 2);
      ctx.fillStyle = "#ff0";
      ctx.fill();
    }

    function resetPuck(){
      puck.x = 200;
      puck.y = 300;
      puck.dx *= -1;
      puck.dy *= -1;
    }

    function openQRIS(){
      document.getElementById("qrisModal").style.display = "flex";
    }

    function closeQRIS(){
      document.getElementById("qrisModal").style.display = "none";
    }

    window.onclick = function(e){
      const modal = document.getElementById("qrisModal");
      if(e.target === modal){
        modal.style.display = "none";
      }
    }

  </script>

</body>
</html>
