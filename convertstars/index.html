<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convert Stars - Shine Shop</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body{
  font-family:Poppins;
  background:linear-gradient(135deg,#0f172a,#020617);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.box{
  background:#1e293b;
  padding:25px;
  border-radius:20px;
  width:330px;
  box-shadow:0 0 30px rgba(0,0,0,0.6);
  animation:fadeIn 1s ease;
}

h2{
  text-align:center;
  margin-bottom:15px;
}

input{
  width:100%;
  padding:12px;
  margin:8px 0;
  border:none;
  border-radius:10px;
  outline:none;
  background:#0f172a;
  color:white;
}

button{
  width:100%;
  padding:12px;
  background:#22c55e;
  border:none;
  border-radius:10px;
  color:white;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  background:#16a34a;
}

.result{
  margin-top:10px;
  text-align:center;
  font-size:15px;
  color:#38bdf8;
}

.loader{
  display:none;
  text-align:center;
  margin-top:15px;
}

.spinner{
  width:40px;
  height:40px;
  border:4px solid rgba(255,255,255,0.2);
  border-top:4px solid #22c55e;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin:auto;
}

.status{
  text-align:center;
  margin-top:10px;
  font-size:14px;
}

@keyframes spin{
  0%{transform:rotate(0deg);}
  100%{transform:rotate(360deg);}
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<div class="box">
  <h2>Convert Stars ⭐</h2>

  <input type="number" id="stars" placeholder="Jumlah Stars">
  <input type="text" id="userid" placeholder="User ID Telegram">
  <input type="text" id="payment" placeholder="Rekening / QRIS Kamu">

  <div class="result" id="result">Rp 0</div>

  <button onclick="convert()">Convert & Kirim</button>

  <div class="loader" id="loader">
    <div class="spinner"></div>
    <div class="status" id="status">Mengirim invoice...</div>
  </div>
</div>

<script>
const RATE = 150;

document.getElementById("stars").addEventListener("input",()=>{
  let stars = document.getElementById("stars").value;
  let total = stars * RATE;
  document.getElementById("result").innerText = "Rp " + total.toLocaleString();
});

async function convert(){
  let stars = document.getElementById("stars").value;
  let userid = document.getElementById("userid").value;
  let payment = document.getElementById("payment").value;

  if(!stars || !userid || !payment){
    alert("Harap isi semua data!");
    return;
  }

  let total = stars * RATE;

  // tampilkan loader
  document.getElementById("loader").style.display = "block";
  document.getElementById("status").innerText = "Mengirim invoice ke Telegram...";

  try{
    let res = await fetch("/api/convert",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        stars,
        userid,
        payment,
        total
      })
    });

    let data = await res.json();

    if(res.ok){
      document.getElementById("status").innerText = "✅ Invoice berhasil dikirim!";
    }else{
      document.getElementById("status").innerText = "❌ Gagal mengirim!";
    }

  }catch(e){
    document.getElementById("status").innerText = "⚠️ Server error!";
  }
}
</script>

</body>
</html>
