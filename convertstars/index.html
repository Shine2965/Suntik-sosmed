<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convert Stars Telegram</title>

<style>
body{
  font-family:Poppins;
  background:#0f172a;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#1e293b;
  padding:25px;
  border-radius:15px;
  width:320px;
}
input, textarea, button{
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:8px;
}
button{
  background:#38bdf8;
  color:black;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="box">
  <h2>Convert Stars ⭐</h2>

  <input type="text" id="user" placeholder="User ID / Username">
  <input type="number" id="stars" placeholder="Jumlah Stars">
  <textarea id="payment" placeholder="Isi QRIS / Rekening / E-Wallet"></textarea>
  <input type="file" id="bukti">

  <button onclick="kirim()">Kirim</button>
</div>

<script>
async function kirim(){
  const user = document.getElementById("user").value;
  const stars = document.getElementById("stars").value;
  const payment = document.getElementById("payment").value;
  const file = document.getElementById("bukti").files[0];

  if(!user || !stars || !payment){
    alert("Lengkapi semua data!");
    return;
  }

  const formData = new FormData();
  formData.append("user", user);
  formData.append("stars", stars);
  formData.append("payment", payment);
  if(file) formData.append("file", file);

  const res = await fetch("/api/order", {
    method:"POST",
    body: formData
  });

  const data = await res.json();
  alert(data.message);
}
</script>

</body>
</html>
