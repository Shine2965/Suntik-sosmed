<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convert Stars - Shine Shop</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
body{
  font-family:Poppins;
  background:#0f172a;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.box{
  background:#1e293b;
  padding:25px;
  border-radius:15px;
  width:320px;
  box-shadow:0 0 20px rgba(0,0,0,0.5);
}

h2{
  text-align:center;
  margin-bottom:15px;
}

input, select{
  width:100%;
  padding:10px;
  margin:8px 0;
  border:none;
  border-radius:8px;
  outline:none;
}

button{
  width:100%;
  padding:10px;
  background:#22c55e;
  border:none;
  border-radius:8px;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.result{
  margin-top:10px;
  text-align:center;
  font-size:14px;
  color:#38bdf8;
}
</style>
</head>

<body>

<div class="box">
  <h2>Convert Stars ⭐</h2>

  <input type="number" id="stars" placeholder="Jumlah Stars">
  
  <input type="text" id="userid" placeholder="User ID Telegram">
  
  <input type="text" id="payment" placeholder="Rekening / QRIS Kamu">

  <div class="result" id="result">Rp 0</div>

  <button onclick="convert()">Convert & Kirim</button>
</div>

<script>
const RATE = 150; // 1 star = Rp150

function convert(){
  let stars = document.getElementById("stars").value;
  let userid = document.getElementById("userid").value;
  let payment = document.getElementById("payment").value;

  let total = stars * RATE;

  document.getElementById("result").innerText = "Rp " + total.toLocaleString();

  fetch("/api/convert",{
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      stars,
      userid,
      payment,
      total
    })
  })
  .then(res=>res.json())
  .then(data=>{
    alert("Berhasil dikirim ke owner!");
  })
}
</script>

</body>
</html>
