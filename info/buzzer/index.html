<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buzzer Misi - Shine Shop</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            padding: 30px 20px;
            background: radial-gradient(circle at 20% 30%, #ffaa0010, transparent 50%),
                        radial-gradient(circle at 80% 70%, #ff660010, transparent 50%),
                        #0a0a0a;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .card {
            background: #1a1a1a;
            border-radius: 24px;
            padding: 30px 28px;
            border: 1px solid #ffaa0033;
            box-shadow: 0 0 40px rgba(255,170,0,0.05);
            margin-bottom: 20px;
        }
        .card h2 {
            color: #ffaa00;
            font-size: 22px;
            margin-bottom: 6px;
        }
        .card .sub {
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .btn {
            padding: 10px 24px;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-size: 13px;
        }
        .btn-back {
            background: #444;
            color: #fff;
        }
        .btn-back:hover {
            background: #555;
        }
        .btn-refresh {
            background: #00ffaa22;
            color: #00ffaa;
            border: 1px solid #00ffaa44;
        }
        .btn-refresh:hover {
            background: #00ffaa44;
        }
        .btn-upload {
            background: #ffaa0044;
            color: #ffaa00;
            border: 1px solid #ffaa0055;
        }
        .btn-upload:hover {
            background: #ffaa0066;
        }
        .btn-upload:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .misi-card {
            background: #0d0d0d;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #ffaa0015;
            margin-bottom: 16px;
            transition: 0.3s;
        }
        .misi-card:hover {
            border-color: #ffaa0044;
        }
        .misi-card .title {
            font-size: 18px;
            font-weight: 700;
            color: #ffaa00;
        }
        .misi-card .detail {
            color: #ccc;
            font-size: 14px;
            margin: 6px 0;
        }
        .misi-card .detail strong {
            color: #fff;
        }
        .misi-card .id-misi {
            color: #ffaa00;
            font-weight: 600;
            font-size: 13px;
        }
        .misi-card .target {
            color: #00ccff;
            font-size: 13px;
            word-break: break-all;
        }
        .misi-card .target a {
            color: #00ccff;
            text-decoration: underline;
        }
        .misi-card .target a.disabled-link {
            color: #555;
            text-decoration: line-through;
            cursor: not-allowed;
            pointer-events: none;
        }
        .misi-card .pesan-box {
            background: #ffaa0008;
            border-left: 3px solid #ffaa00;
            padding: 10px 14px;
            border-radius: 8px;
            margin: 8px 0;
            color: #ddd;
            font-size: 13px;
            font-style: italic;
        }
        .misi-card .completed-by {
            color: #888;
            font-size: 12px;
            margin-top: 8px;
        }
        .misi-card .completed-by .email-list {
            color: #00ffaa;
            font-weight: 500;
        }
        .misi-card .upload-area {
            margin-top: 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }
        .misi-card .upload-area input[type="file"] {
            background: #222;
            color: #fff;
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid #ffaa0033;
            font-size: 12px;
            flex: 1;
            min-width: 150px;
        }
        .misi-card .upload-area input[type="file"]::file-selector-button {
            background: #ffaa0022;
            color: #ffaa00;
            border: 1px solid #ffaa0044;
            padding: 4px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 11px;
        }
        .misi-card .upload-area input[type="file"]::file-selector-button:hover {
            background: #ffaa0044;
        }
        .misi-card .upload-area input[type="file"]:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .misi-card .input-buzzer {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }
        .misi-card .input-buzzer input {
            flex: 1;
            min-width: 120px;
            background: #222;
            color: #fff;
            border: 1px solid #ffaa0033;
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 13px;
            outline: none;
            transition: 0.3s;
        }
        .misi-card .input-buzzer input:focus {
            border-color: #ffaa00;
            box-shadow: 0 0 20px rgba(255,170,0,0.1);
        }
        .misi-card .input-buzzer input:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            background: #ffaa0022;
            color: #ffaa00;
        }
        .badge.done {
            background: #00ffaa22;
            color: #00ffaa;
        }
        .badge.limit {
            background: #ff444422;
            color: #ff6666;
        }
        .badge.full {
            background: #ff444422;
            color: #ff4444;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .badge.closed {
            background: #444;
            color: #888;
        }
        .text-muted {
            color: #666;
            font-size: 12px;
        }
        .text-warning {
            color: #ffaa00;
            font-size: 12px;
        }
        .text-success {
            color: #00ffaa;
            font-size: 12px;
        }
        .no-data {
            color: #666;
            text-align: center;
            padding: 30px 0;
            font-size: 14px;
        }
        .loading {
            color: #888;
            text-align: center;
            padding: 20px 0;
            font-size: 14px;
        }
        .divider {
            border: none;
            border-top: 1px solid #ffaa0015;
            margin: 16px 0;
        }
        .progress-bar {
            background: #222;
            border-radius: 20px;
            height: 6px;
            margin: 8px 0;
            overflow: hidden;
        }
        .progress-bar .fill {
            background: linear-gradient(90deg, #ffaa00, #ff6600);
            height: 100%;
            border-radius: 20px;
            transition: width 0.5s ease;
        }
        .progress-bar .fill.full {
            background: linear-gradient(90deg, #ff4444, #ff6600);
        }
        .history-item {
            background: #00ffaa08;
            border-left: 2px solid #00ffaa;
            padding: 8px 12px;
            border-radius: 8px;
            margin: 4px 0;
            font-size: 12px;
            color: #aaa;
        }
        .history-item .h-user {
            color: #00ffaa;
            font-weight: 600;
        }
        .history-item .h-id {
            color: #ffaa00;
            font-size: 10px;
            font-weight: 600;
        }
        .history-item .h-date {
            color: #888;
            font-size: 11px;
        }
        .history-item .h-bukti {
            color: #888;
            font-size: 11px;
        }
        .limit-info {
            background: #ffaa0010;
            border: 1px solid #ffaa0033;
            border-radius: 10px;
            padding: 8px 14px;
            margin-top: 8px;
            font-size: 12px;
            color: #ffaa00;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .limit-info .count {
            font-weight: 700;
            font-size: 14px;
        }
        .closed-info {
            background: #ff444415;
            border: 1px solid #ff444455;
            border-radius: 10px;
            padding: 12px 16px;
            margin-top: 8px;
            font-size: 13px;
            color: #ff6666;
            text-align: center;
            font-weight: 600;
        }
        .hidden {
            display: none !important;
        }
        @media (max-width: 600px) {
            .card {
                padding: 20px 16px;
            }
            .misi-card .upload-area {
                flex-direction: column;
            }
            .misi-card .upload-area input[type="file"] {
                width: 100%;
            }
            .misi-card .input-buzzer {
                flex-direction: column;
            }
            .misi-card .input-buzzer input {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ===== HEADER ===== -->
        <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;">
                <div>
                    <h2>📢 Buzzer Misi</h2>
                    <div class="sub">Selesaikan misi & dapatkan reward! (Maks 5 konfirmasi per user)</div>
                </div>
                <div class="header-actions">
                    <button class="btn btn-back" onclick="location.href='/info/dashboard/index.html'">⬅️ Kembali</button>
                    <button class="btn btn-refresh" onclick="loadMisi()">🔄 Refresh</button>
                </div>
            </div>
            <div id="userInfo" style="color:#888;font-size:13px;margin-top:8px;">
                👤 <span id="userEmailDisplay">-</span>
            </div>
        </div>

        <!-- ===== LIST MISI ===== -->
        <div id="misiContainer">
            <div class="loading">⏳ Memuat daftar misi...</div>
        </div>

        <div class="text-muted" style="text-align:center;margin-top:20px;">
            © Shine Shop · Buzzer System
        </div>
    </div>

    <script>
        // ===================== KONFIGURASI =====================
        const DATA_URL = '/info/buzzer/data.json';
        const TELEGRAM_TOKEN = '8785872128:AAGJApScDjRIjg1VorXB35OvrvtUDCtVr0M';
        const TELEGRAM_CHAT_ID = '6317157631';
        const MAX_KONFIRMASI_PER_USER = 5;

        // ===================== CEK SESSION =====================
        function checkSession() {
            const loggedIn = localStorage.getItem('logged_in');
            if (loggedIn !== 'true') {
                window.location.href = '/info/index.html';
                return false;
            }
            return true;
        }

        if (!checkSession()) {
            throw new Error('Redirect ke login');
        }

        // ===================== GET USER DATA =====================
        function getUserData() {
            return {
                email: localStorage.getItem('user_email') || '',
                role: localStorage.getItem('user_role') || 'user'
            };
        }

        // ===================== HITUNG KONFIRMASI PER USER =====================
        function getUserKonfirmasiCount(history, userEmail) {
            return history.filter(h => h.user === userEmail).length;
        }

        // ===================== CEK APAKAH USERNAME SUDAH PERNAH DIPAKAI =====================
        function isUsernameAlreadyUsed(history, username, excludeIndex = -1) {
            return history.some((h, idx) => {
                if (idx === excludeIndex) return false;
                return h.nama && h.nama.toLowerCase() === username.toLowerCase();
            });
        }

        // ===================== CEK APAKAH KUOTA MISI PENUH =====================
        function isMisiFull(misi) {
            const history = misi.History || [];
            const jumlah = misi.Jumlah || 0;
            if (jumlah === 0) return false;
            return history.length >= jumlah;
        }

        // ===================== LOAD MISI =====================
        async function loadMisi() {
            const container = document.getElementById('misiContainer');
            container.innerHTML = '<div class="loading">⏳ Memuat daftar misi...</div>';

            const user = getUserData();
            document.getElementById('userEmailDisplay').textContent = user.email || 'Belum login';

            try {
                const res = await fetch(DATA_URL + '?t=' + Date.now());
                if (!res.ok) throw new Error('Gagal mengambil data misi');

                const data = await res.json();
                if (!Array.isArray(data) || data.length === 0) {
                    container.innerHTML = '<div class="no-data">📭 Belum ada misi tersedia.</div>';
                    return;
                }

                let html = '';
                data.forEach((misi, index) => {
                    const history = misi.History || [];
                    const completedList = history.map(h => h.user);
                    
                    // CEK APAKAH MISI SUDAH PENUH
                    const isFull = isMisiFull(misi);
                    
                    // Hitung konfirmasi user untuk misi ini
                    const userCount = getUserKonfirmasiCount(history, user.email);
                    const isLimitReached = userCount >= MAX_KONFIRMASI_PER_USER;
                    const isCompleted = completedList.includes(user.email);
                    
                    // Cek apakah user bisa upload (misi belum penuh DAN user belum limit)
                    const canUpload = !isFull && !isLimitReached && !isCompleted;
                    
                    const progress = misi.Jumlah ? Math.min((completedList.length / misi.Jumlah) * 100, 100) : 0;

                    // Buat riwayat
                    let historyHtml = '';
                    if (history.length > 0) {
                        historyHtml = `<div style="margin-top:10px;"><strong style="color:#888;font-size:12px;">📜 Riwayat Penyelesaian:</strong>`;
                        history.forEach(h => {
                            historyHtml += `
                                <div class="history-item">
                                    <span class="h-user">${h.user}</span>
                                    <span class="h-id">[${h.id_misi || misi.id_misi || '-'}]</span>
                                    <span class="h-date">${h.tanggal || '-'}</span>
                                    <span class="h-bukti">| Bukti: ${h.bukti || 'Tidak ada'}</span>
                                    ${h.nama ? `<span style="color:#ffaa00;font-size:10px;">| @${h.nama}</span>` : ''}
                                    ${h.konfirmasi_ke ? `<span style="color:#ffaa00;font-size:10px;">| #${h.konfirmasi_ke}</span>` : ''}
                                </div>
                            `;
                        });
                        historyHtml += `</div>`;
                    }

                    // Pesan 1 & Pesan 2
                    const pesan1 = Array.isArray(misi.Pesan) ? misi.Pesan[0] || '-' : misi.Pesan || '-';
                    const pesan2 = Array.isArray(misi.Pesan) && misi.Pesan[1] ? misi.Pesan[1] : '-';

                    // Status badge
                    let statusBadge = '';
                    if (isFull) {
                        statusBadge = `<span class="badge full">🔒 MISI TELAH SELESAI</span>`;
                    } else if (isLimitReached) {
                        statusBadge = `<span class="badge limit">⛔ Limit 5</span>`;
                    } else if (isCompleted) {
                        statusBadge = `<span class="badge done">✅ Selesai</span>`;
                    } else {
                        statusBadge = `<span class="badge">⏳ ${userCount}/${MAX_KONFIRMASI_PER_USER}</span>`;
                    }

                    // Target link - disabled jika misi penuh
                    const targetLink = isFull 
                        ? `<span class="target" style="color:#555;">🔒 Target telah ditutup (kuota penuh)</span>`
                        : `<div class="target"><strong>🎯 Target:</strong> 
                            <a href="${misi.Target || '#'}" target="_blank">${misi.Target || '-'}</a>
                           </div>`;

                    // Upload area - hidden jika misi penuh
                    const uploadArea = isFull ? `
                        <div class="closed-info">
                            🔒 MISI TELAH SELESAI - Kuota ${misi.Jumlah || '∞'} target telah terpenuhi
                        </div>
                    ` : `
                        <div class="input-buzzer">
                            <input type="text" id="buzzerName-${index}" placeholder="Nama/Username Buzzer (wajib unik)" style="flex:2;" ${!canUpload ? 'disabled' : ''}>
                            <input type="text" id="buzzerEmail-${index}" placeholder="Gmail Buzzer" style="flex:2;" value="${user.email}" ${!canUpload ? 'disabled' : ''}>
                        </div>

                        <div class="upload-area">
                            <input type="file" id="fileInput-${index}" accept="image/*" ${!canUpload ? 'disabled' : ''}>
                            <button class="btn btn-upload" id="uploadBtn-${index}" ${!canUpload ? 'disabled' : ''}>
                                ${isLimitReached ? '⛔ Limit 5' : isCompleted ? '✅ Selesai' : '📤 Upload Bukti'}
                            </button>
                        </div>
                        ${isLimitReached ? '<div class="text-muted" style="margin-top:4px;">⛔ Anda sudah mencapai batas 5 konfirmasi untuk misi ini.</div>' : ''}
                        ${isCompleted && !isLimitReached ? '<div class="text-muted" style="margin-top:4px;">✨ Anda sudah menyelesaikan misi ini.</div>' : ''}
                        ${!isCompleted && !isLimitReached && !isFull ? '<div class="text-muted" style="margin-top:4px;">📌 Gunakan username yang berbeda untuk setiap konfirmasi.</div>' : ''}
                    `;

                    html += `
                        <div class="misi-card" id="misi-${index}">
                            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;">
                                <div class="title">${misi.Tugas || 'Misi'}</div>
                                ${statusBadge}
                            </div>
                            
                            <div class="detail"><strong>🆔 ID Misi:</strong> <span class="id-misi">${misi.id_misi || '-'}</span></div>
                            <div class="detail"><strong>💰 Harga:</strong> ${misi.Harga || 'Gratis'}</div>
                            <div class="detail"><strong>📊 Jumlah yang dibutuhkan:</strong> ${misi.Jumlah || '∞'}</div>
                            <div class="detail"><strong>✅ Sudah dikerjakan:</strong> ${completedList.length} / ${misi.Jumlah || '∞'} ${isFull ? '🔒 (PENUH)' : ''}</div>
                            <div class="detail"><strong>👤 Konfirmasi Anda:</strong> ${userCount} / ${MAX_KONFIRMASI_PER_USER}</div>
                            
                            <div class="progress-bar">
                                <div class="fill ${isFull ? 'full' : ''}" style="width:${Math.min(progress, 100)}%;"></div>
                            </div>

                            ${targetLink}

                            ${misi.Pesan ? `
                                <div class="pesan-box">
                                    <strong>📝 Pesan 1:</strong> ${pesan1}
                                    ${pesan2 !== '-' ? `<br><strong>📝 Pesan 2:</strong> ${pesan2}` : ''}
                                </div>
                            ` : ''}

                            ${historyHtml}

                            ${isLimitReached && !isFull ? `
                                <div class="limit-info">
                                    <span>⛔ Anda sudah mencapai batas maksimal ${MAX_KONFIRMASI_PER_USER} konfirmasi untuk misi ini.</span>
                                    <span class="count">${userCount}/${MAX_KONFIRMASI_PER_USER}</span>
                                </div>
                            ` : ''}

                            <div class="divider"></div>

                            ${uploadArea}
                        </div>
                    `;
                });

                container.innerHTML = html;

                // ===== ATTACH EVENT UPLOAD (hanya jika misi belum penuh) =====
                data.forEach((misi, index) => {
                    const isFull = isMisiFull(misi);
                    if (isFull) return; // Skip attach event jika misi penuh

                    const btn = document.getElementById(`uploadBtn-${index}`);
                    const fileInput = document.getElementById(`fileInput-${index}`);
                    const nameInput = document.getElementById(`buzzerName-${index}`);
                    const emailInput = document.getElementById(`buzzerEmail-${index}`);

                    if (btn && fileInput && !btn.disabled) {
                        btn.addEventListener('click', function() {
                            const buzzerName = nameInput ? nameInput.value.trim() : '-';
                            const buzzerEmail = emailInput ? emailInput.value.trim() : user.email;
                            handleUpload(misi, index, fileInput, buzzerName, buzzerEmail);
                        });
                    }
                });

            } catch (err) {
                console.error('Error load misi:', err);
                container.innerHTML = `<div class="no-data" style="color:#ff6666;">❌ Gagal memuat misi: ${err.message}</div>`;
            }
        }

        // ===================== HANDLE UPLOAD =====================
        async function handleUpload(misi, index, fileInput, buzzerName, buzzerEmail) {
            const user = getUserData();
            const file = fileInput.files[0];

            // CEK APAKAH MISI SUDAH PENUH (validasi ulang)
            if (isMisiFull(misi)) {
                Swal.fire({
                    title: '🔒 Misi Telah Selesai',
                    text: 'Maaf, misi ini sudah mencapai kuota penuh dan tidak dapat menerima konfirmasi lagi.',
                    icon: 'info',
                    confirmButtonColor: '#ffaa00'
                });
                loadMisi();
                return;
            }

            if (!file) {
                Swal.fire({
                    title: '⚠️ Belum ada file',
                    text: 'Silakan pilih bukti screenshot terlebih dahulu.',
                    icon: 'warning',
                    confirmButtonColor: '#ffaa00'
                });
                return;
            }

            if (!buzzerName) {
                Swal.fire({
                    title: '⚠️ Isi Nama Buzzer',
                    text: 'Silakan isi nama/username buzzer terlebih dahulu.',
                    icon: 'warning',
                    confirmButtonColor: '#ffaa00'
                });
                return;
            }

            // ===== CEK LIMIT KONFIRMASI =====
            const history = misi.History || [];
            const userCount = getUserKonfirmasiCount(history, buzzerEmail);

            if (userCount >= MAX_KONFIRMASI_PER_USER) {
                Swal.fire({
                    title: '⛔ Limit Maksimal',
                    text: `Anda sudah mencapai batas maksimal ${MAX_KONFIRMASI_PER_USER} konfirmasi untuk misi ini.`,
                    icon: 'error',
                    confirmButtonColor: '#ffaa00'
                });
                return;
            }

            // ===== CEK USERNAME UNIK =====
            if (isUsernameAlreadyUsed(history, buzzerName)) {
                Swal.fire({
                    title: '⚠️ Username Sudah Dipakai',
                    text: `Username "${buzzerName}" sudah pernah digunakan untuk misi ini. Gunakan username yang berbeda.`,
                    icon: 'warning',
                    confirmButtonColor: '#ffaa00'
                });
                return;
            }

            // Cek kuota misi (validasi ulang)
            const completedEmails = history.map(h => h.user);
            if (misi.Jumlah && completedEmails.length >= misi.Jumlah) {
                Swal.fire({
                    title: '❌ Kuota Penuh',
                    text: 'Misi ini sudah mencapai jumlah target yang dibutuhkan.',
                    icon: 'error',
                    confirmButtonColor: '#ffaa00'
                });
                loadMisi();
                return;
            }

            // Konfirmasi
            const confirmResult = await Swal.fire({
                title: '📤 Upload Bukti Buzzer',
                html: `
                    <div style="text-align:left;">
                        <b>🆔 ID Misi:</b> ${misi.id_misi || '-'}<br>
                        <b>📋 Misi:</b> ${misi.Tugas}<br>
                        <b>🎯 Target:</b> ${misi.Target}<br>
                        <b>👤 Nama Buzzer:</b> ${buzzerName}<br>
                        <b>📧 Email:</b> ${buzzerEmail}<br>
                        <b>📎 File:</b> ${file.name}<br>
                        <b>📊 Konfirmasi ke-:</b> ${userCount + 1} / ${MAX_KONFIRMASI_PER_USER}
                    </div>
                `,
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: '✅ Kirim',
                cancelButtonText: '❌ Batal',
                confirmButtonColor: '#ffaa00',
                cancelButtonColor: '#666'
            });

            if (!confirmResult.isConfirmed) return;

            // ===== KIRIM KE TELEGRAM =====
            const btn = document.getElementById(`uploadBtn-${index}`);
            if (btn) {
                btn.disabled = true;
                btn.textContent = '⏳ Mengirim...';
            }

            try {
                const tanggal = new Date().toLocaleString('id-ID', {
                    day: '2-digit',
                    month: 'long',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                // Pesan 1 & Pesan 2
                const pesan1 = Array.isArray(misi.Pesan) ? misi.Pesan[0] || '-' : misi.Pesan || '-';
                const pesan2 = Array.isArray(misi.Pesan) && misi.Pesan[1] ? misi.Pesan[1] : '-';

                // Kirim pesan teks ke Telegram
                const textMessage = `
📢 **LAPORAN BUZZER MISI**
━━━━━━━━━━━━━━━━━━━━━
🆔 **ID Misi:** ${misi.id_misi || '-'}
📋 **Misi:** ${misi.Tugas}
🎯 **Target:** ${misi.Target}
💰 **Harga:** ${misi.Harga || 'Gratis'}

👤 **Nama Buzzer:** ${buzzerName}
📧 **Email:** ${buzzerEmail}
📅 **Tanggal:** ${tanggal}
📊 **Konfirmasi ke-:** ${userCount + 1} / ${MAX_KONFIRMASI_PER_USER}

📝 **Pesan 1:** ${pesan1}
📝 **Pesan 2:** ${pesan2}

━━━━━━━━━━━━━━━━━━━━━
📎 **Bukti terlampir di bawah**
                `;

                // Kirim teks
                await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: textMessage,
                        parse_mode: 'Markdown'
                    })
                });

                // Kirim file (foto)
                const formData = new FormData();
                formData.append('chat_id', TELEGRAM_CHAT_ID);
                formData.append('photo', file);
                formData.append('caption', `📸 Bukti: ${misi.Tugas} - ${buzzerName} [${misi.id_misi || '-'}] (${userCount + 1}/${MAX_KONFIRMASI_PER_USER})`);

                await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });

                // ===== UPDATE HISTORY DI LOCALSTORAGE =====
                const historyKey = 'buzzer_history_' + (misi.id_misi || misi.Tugas.replace(/\s/g, '_'));
                let historyData = JSON.parse(localStorage.getItem(historyKey) || '[]');
                
                historyData.push({
                    user: buzzerEmail,
                    nama: buzzerName,
                    tanggal: tanggal,
                    bukti: file.name,
                    id_misi: misi.id_misi || '-',
                    misi: misi.Tugas,
                    target: misi.Target,
                    konfirmasi_ke: userCount + 1
                });

                localStorage.setItem(historyKey, JSON.stringify(historyData));

                Swal.fire({
                    title: '✅ Berhasil!',
                    html: `
                        Bukti untuk misi <b>"${misi.Tugas}"</b> berhasil dikirim ke admin!<br>
                        <span style="font-size:13px;color:#888;">🆔 ${misi.id_misi || '-'} | Nama: ${buzzerName}</span><br>
                        <span style="font-size:13px;color:#ffaa00;">📊 Konfirmasi ke-${userCount + 1} / ${MAX_KONFIRMASI_PER_USER}</span>
                    `,
                    icon: 'success',
                    confirmButtonColor: '#ffaa00'
                });

                // Refresh tampilan
                loadMisi();

            } catch (err) {
                console.error('Error upload:', err);
                Swal.fire({
                    title: '❌ Gagal',
                    text: 'Terjadi error saat mengirim bukti: ' + err.message,
                    icon: 'error',
                    confirmButtonColor: '#ffaa00'
                });
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = '📤 Upload Bukti';
                }
            }
        }

        // ===================== INIT =====================
        document.addEventListener('DOMContentLoaded', function() {
            loadMisi();
        });

        // Refresh otomatis setiap 30 detik
        setInterval(loadMisi, 30000);

        console.log('📢 Buzzer Misi siap!');
        console.log('👤 User:', getUserData().email);
        console.log('📊 Maks konfirmasi per user:', MAX_KONFIRMASI_PER_USER);
    </script>
</body>
</html>
