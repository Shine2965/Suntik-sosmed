<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buzzer Misi - Shine Shop</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            padding: 30px 20px;
            background: radial-gradient(circle at 20% 30%, #ffaa0010, transparent 50%),
                        radial-gradient(circle at 80% 70%, #ff660010, transparent 50%),
                        #0a0a0a;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .card {
            background: #1a1a1a;
            border-radius: 24px;
            padding: 30px 28px;
            border: 1px solid #ffaa0033;
            box-shadow: 0 0 40px rgba(255,170,0,0.05);
            margin-bottom: 20px;
        }
        .card h2 {
            color: #ffaa00;
            font-size: 22px;
            margin-bottom: 6px;
        }
        .card .sub {
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .btn {
            padding: 10px 24px;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-size: 13px;
        }
        .btn-back {
            background: #444;
            color: #fff;
        }
        .btn-back:hover {
            background: #555;
        }
        .btn-refresh {
            background: #00ffaa22;
            color: #00ffaa;
            border: 1px solid #00ffaa44;
        }
        .btn-refresh:hover {
            background: #00ffaa44;
        }
        .btn-upload {
            background: #ffaa0044;
            color: #ffaa00;
            border: 1px solid #ffaa0055;
        }
        .btn-upload:hover {
            background: #ffaa0066;
        }
        .btn-upload:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-copy {
            background: #00ffaa22;
            color: #00ffaa;
            border: 1px solid #00ffaa44;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-copy:hover {
            background: #00ffaa44;
        }
        .btn-filter {
            background: #222;
            color: #aaa;
            border: 1px solid #333;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-filter:hover {
            background: #333;
            color: #fff;
        }
        .btn-filter.active {
            background: #ffaa0044;
            color: #ffaa00;
            border-color: #ffaa0055;
        }
        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 12px 0 16px 0;
            padding: 12px;
            background: #0d0d0d;
            border-radius: 12px;
            border: 1px solid #ffaa0015;
        }
        .filter-group .filter-label {
            color: #888;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            margin-right: 8px;
        }
        .misi-card {
            background: #0d0d0d;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #ffaa0015;
            margin-bottom: 16px;
            transition: 0.3s;
        }
        .misi-card:hover {
            border-color: #ffaa0044;
        }
        .misi-card .title {
            font-size: 18px;
            font-weight: 700;
            color: #ffaa00;
        }
        .misi-card .detail {
            color: #ccc;
            font-size: 14px;
            margin: 6px 0;
        }
        .misi-card .detail strong {
            color: #fff;
        }
        .misi-card .id-misi {
            color: #ffaa00;
            font-weight: 600;
            font-size: 13px;
        }
        .misi-card .target {
            color: #00ccff;
            font-size: 13px;
            word-break: break-all;
        }
        .misi-card .target a {
            color: #00ccff;
            text-decoration: underline;
        }
        .misi-card .target a.disabled-link {
            color: #555;
            text-decoration: line-through;
            cursor: not-allowed;
            pointer-events: none;
        }
        .misi-card .pesan-box {
            background: #ffaa0008;
            border-left: 3px solid #ffaa00;
            padding: 10px 14px;
            border-radius: 8px;
            margin: 8px 0;
            color: #ddd;
            font-size: 13px;
            font-style: italic;
        }
        .misi-card .pesan-box .pesan-item {
            padding: 4px 0;
            border-bottom: 1px solid #ffaa0015;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .misi-card .pesan-box .pesan-item:last-child {
            border-bottom: none;
        }
        .misi-card .pesan-box .pesan-text {
            flex: 1;
            word-break: break-all;
        }
        .misi-card .pesan-box .pesan-badge {
            font-size: 10px;
            background: #ffaa0022;
            color: #ffaa00;
            padding: 2px 8px;
            border-radius: 10px;
            white-space: nowrap;
        }
        .misi-card .pesan-box .pesan-badge.active {
            background: #00ffaa22;
            color: #00ffaa;
        }
        .misi-card .pesan-box .pesan-badge.done {
            background: #444;
            color: #666;
        }
        .misi-card .upload-area {
            margin-top: 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }
        .misi-card .upload-area input[type="file"] {
            background: #222;
            color: #fff;
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid #ffaa0033;
            font-size: 12px;
            flex: 1;
            min-width: 150px;
        }
        .misi-card .upload-area input[type="file"]::file-selector-button {
            background: #ffaa0022;
            color: #ffaa00;
            border: 1px solid #ffaa0044;
            padding: 4px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 11px;
        }
        .misi-card .upload-area input[type="file"]::file-selector-button:hover {
            background: #ffaa0044;
        }
        .misi-card .upload-area input[type="file"]:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .misi-card .input-buzzer {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }
        .misi-card .input-buzzer select {
            flex: 1;
            min-width: 120px;
            background: #222;
            color: #fff;
            border: 1px solid #ffaa0033;
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 13px;
            outline: none;
            transition: 0.3s;
            cursor: pointer;
        }
        .misi-card .input-buzzer select:focus {
            border-color: #ffaa00;
            box-shadow: 0 0 20px rgba(255,170,0,0.1);
        }
        .misi-card .input-buzzer select:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .misi-card .input-buzzer input {
            flex: 1;
            min-width: 120px;
            background: #222;
            color: #fff;
            border: 1px solid #ffaa0033;
            border-radius: 12px;
            padding: 10px 14px;
            font-size: 13px;
            outline: none;
            transition: 0.3s;
        }
        .misi-card .input-buzzer input:focus {
            border-color: #ffaa00;
            box-shadow: 0 0 20px rgba(255,170,0,0.1);
        }
        .misi-card .input-buzzer input:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            background: #ffaa0022;
            color: #ffaa00;
        }
        .badge.done {
            background: #00ffaa22;
            color: #00ffaa;
        }
        .badge.limit {
            background: #ff444422;
            color: #ff6666;
        }
        .badge.full {
            background: #ff444422;
            color: #ff4444;
            animation: pulse 1.5s ease-in-out infinite;
        }
        .badge.no-account {
            background: #ff444422;
            color: #ff6666;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .text-muted {
            color: #666;
            font-size: 12px;
        }
        .text-warning {
            color: #ffaa00;
            font-size: 12px;
        }
        .text-success {
            color: #00ffaa;
            font-size: 12px;
        }
        .no-data {
            color: #666;
            text-align: center;
            padding: 30px 0;
            font-size: 14px;
        }
        .loading {
            color: #888;
            text-align: center;
            padding: 20px 0;
            font-size: 14px;
        }
        .divider {
            border: none;
            border-top: 1px solid #ffaa0015;
            margin: 16px 0;
        }
        .progress-bar {
            background: #222;
            border-radius: 20px;
            height: 6px;
            margin: 8px 0;
            overflow: hidden;
        }
        .progress-bar .fill {
            background: linear-gradient(90deg, #ffaa00, #ff6600);
            height: 100%;
            border-radius: 20px;
            transition: width 0.5s ease;
        }
        .progress-bar .fill.full {
            background: linear-gradient(90deg, #ff4444, #ff6600);
        }
        .history-item {
            background: #00ffaa08;
            border-left: 2px solid #00ffaa;
            padding: 8px 12px;
            border-radius: 8px;
            margin: 4px 0;
            font-size: 12px;
            color: #aaa;
        }
        .history-item .h-user {
            color: #00ffaa;
            font-weight: 600;
        }
        .history-item .h-id {
            color: #ffaa00;
            font-size: 10px;
            font-weight: 600;
        }
        .history-item .h-date {
            color: #888;
            font-size: 11px;
        }
        .history-item .h-bukti {
            color: #888;
            font-size: 11px;
        }
        .limit-info {
            background: #ffaa0010;
            border: 1px solid #ffaa0033;
            border-radius: 10px;
            padding: 8px 14px;
            margin-top: 8px;
            font-size: 12px;
            color: #ffaa00;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .limit-info .count {
            font-weight: 700;
            font-size: 14px;
        }
        .closed-info {
            background: #ff444415;
            border: 1px solid #ff444455;
            border-radius: 10px;
            padding: 12px 16px;
            margin-top: 8px;
            font-size: 13px;
            color: #ff6666;
            text-align: center;
            font-weight: 600;
        }
        .no-account-warning {
            background: #ffaa0010;
            border: 1px solid #ffaa0044;
            border-radius: 12px;
            padding: 16px 20px;
            color: #ffaa00;
            text-align: center;
            font-size: 14px;
            margin: 10px 0;
        }
        .no-account-warning .icon {
            font-size: 24px;
            display: block;
            margin-bottom: 6px;
        }
        .no-account-warning .btn-contact {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 20px;
            background: #ffaa0044;
            color: #ffaa00;
            border: 1px solid #ffaa0055;
            border-radius: 20px;
            text-decoration: none;
            font-size: 13px;
            transition: 0.3s;
        }
        .no-account-warning .btn-contact:hover {
            background: #ffaa0066;
        }
        .hidden {
            display: none !important;
        }
        .env-status {
            text-align: center;
            font-size: 11px;
            color: #555;
            margin-top: 8px;
        }
        .account-used-info {
            font-size: 11px;
            color: #888;
            margin-top: 4px;
        }
        .account-used-info .used {
            color: #ff6666;
        }
        .account-used-info .available {
            color: #00ffaa;
        }
        @media (max-width: 600px) {
            .card {
                padding: 20px 16px;
            }
            .misi-card .upload-area {
                flex-direction: column;
            }
            .misi-card .upload-area input[type="file"] {
                width: 100%;
            }
            .misi-card .input-buzzer {
                flex-direction: column;
            }
            .misi-card .input-buzzer select,
            .misi-card .input-buzzer input {
                width: 100%;
            }
            .filter-group {
                flex-direction: column;
            }
            .misi-card .pesan-box .pesan-item {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ===== HEADER ===== -->
        <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;">
                <div>
                    <h2>📢 Buzzer Misi</h2>
                    <div class="sub">Selesaikan misi & dapatkan reward! (Maks 5 konfirmasi per user)</div>
                </div>
                <div class="header-actions">
                    <button class="btn btn-back" onclick="location.href='/info/dashboard/index.html'">⬅️ Kembali</button>
                    <button class="btn btn-refresh" onclick="loadMisi()">🔄 Refresh</button>
                </div>
            </div>
            <div id="userInfo" style="color:#888;font-size:13px;margin-top:8px;">
                👤 <span id="userEmailDisplay">-</span>
            </div>
            <div id="accountInfo" style="color:#00ffaa;font-size:12px;margin-top:4px;">
                📱 Akun Buzzer: <span id="accountCount">0</span> terdaftar
            </div>
            <div class="env-status" id="envStatus">🔌 Mengambil konfigurasi...</div>
        </div>

        <!-- ===== FILTER PLATFORM ===== -->
        <div class="card" id="filterCard">
            <div class="filter-group">
                <span class="filter-label">🎯 Filter Platform:</span>
                <button class="btn-filter active" data-filter="all" onclick="setFilter('all')">📋 Semua</button>
                <button class="btn-filter" data-filter="Instagram" onclick="setFilter('Instagram')">📷 Instagram</button>
                <button class="btn-filter" data-filter="TikTok" onclick="setFilter('TikTok')">🎵 TikTok</button>
                <button class="btn-filter" data-filter="YouTube" onclick="setFilter('YouTube')">▶️ YouTube</button>
                <button class="btn-filter" data-filter="Facebook" onclick="setFilter('Facebook')">👍 Facebook</button>
                <button class="btn-filter" data-filter="Twitter" onclick="setFilter('Twitter')">🐦 Twitter/X</button>
                <button class="btn-filter" data-filter="Telegram" onclick="setFilter('Telegram')">✈️ Telegram</button>
                <button class="btn-filter" data-filter="WhatsApp" onclick="setFilter('WhatsApp')">💬 WhatsApp</button>
            </div>
        </div>

        <!-- ===== LIST MISI ===== -->
        <div id="misiContainer">
            <div class="loading">⏳ Memuat daftar misi...</div>
        </div>

        <div class="text-muted" style="text-align:center;margin-top:20px;">
            © Shine Shop · Buzzer System
        </div>
    </div>

    <script>
        // ===================== KONFIGURASI =====================
        const DATA_URL = '/info/buzzer/data.json';
        const CONFIG_API = '/api/config';
        const BUZZ_ACCOUNTS_URL = '/info/buzz.json';
        const RULES_URL = '/rules/';
        const MAX_KONFIRMASI_PER_USER = 10;
        const LOGIN_PAGE = '/info/index.html';

        // ===================== VARIABEL =====================
        let TELEGRAM_TOKEN = '';
        let TELEGRAM_CHAT_ID = '';
        let currentFilter = 'all';
        let userAccounts = [];

        // ===================== CEK SESSION & REDIRECT =====================
        function checkSession() {
            const loggedIn = localStorage.getItem('logged_in');
            const userEmail = localStorage.getItem('user_email');
            
            if (loggedIn !== 'true' || !userEmail) {
                window.location.href = LOGIN_PAGE;
                return false;
            }
            return true;
        }

        if (!checkSession()) {
            throw new Error('Redirect ke login');
        }

        // ===================== GET USER DATA =====================
        function getUserData() {
            return {
                email: localStorage.getItem('user_email') || '',
                role: localStorage.getItem('user_role') || 'user',
                saldo: localStorage.getItem('user_saldo') || '0'
            };
        }

        // ===================== AMBIL KONFIGURASI =====================
        async function fetchConfig() {
            const statusEl = document.getElementById('envStatus');
            try {
                statusEl.textContent = '⏳ Mengambil konfigurasi...';
                statusEl.style.color = '#888';
                
                const res = await fetch(CONFIG_API + '?t=' + Date.now());
                if (!res.ok) throw new Error('Gagal mengambil konfigurasi: ' + res.status);

                const data = await res.json();
                if (!data.success) throw new Error(data.message || 'Format data tidak valid');

                TELEGRAM_TOKEN = data.telegram_token;
                TELEGRAM_CHAT_ID = data.owner_id;

                statusEl.textContent = '✅ Konfigurasi berhasil dimuat';
                statusEl.style.color = '#00ffaa';
                console.log('✅ Telegram Config loaded');
                return true;

            } catch (err) {
                console.error('Error fetch config:', err);
                statusEl.textContent = '❌ ' + err.message;
                statusEl.style.color = '#ff6666';
                return false;
            }
        }

        // ===================== AMBIL DATA AKUN BUZZER =====================
        async function fetchBuzzerAccounts() {
            try {
                const res = await fetch(BUZZ_ACCOUNTS_URL + '?t=' + Date.now());
                if (!res.ok) throw new Error('Gagal mengambil data akun buzzer');

                const data = await res.json();
                if (!Array.isArray(data)) throw new Error('Format data tidak valid');

                const user = getUserData();
                
                const found = data.find(item => 
                    item.email && item.email.toLowerCase() === user.email.toLowerCase()
                );
                
                if (found && found.accounts) {
                    const validAccounts = found.accounts.filter(acc => 
                        acc.username && acc.username !== '-' && acc.username.trim() !== ''
                    );
                    userAccounts = validAccounts;
                    document.getElementById('accountCount').textContent = userAccounts.length;
                    document.getElementById('accountCount').style.color = userAccounts.length > 0 ? '#00ffaa' : '#ff6666';
                    return userAccounts;
                }

                userAccounts = [];
                document.getElementById('accountCount').textContent = '0 ❌ Tidak ada akun';
                document.getElementById('accountCount').style.color = '#ff6666';
                return [];

            } catch (err) {
                console.error('Error fetch buzzer accounts:', err);
                userAccounts = [];
                document.getElementById('accountCount').textContent = '❌ Gagal memuat';
                document.getElementById('accountCount').style.color = '#ff6666';
                return [];
            }
        }

        // ===================== EKSTRAK PLATFORM DARI MISI =====================
        function extractPlatformFromMisi(tugas) {
            const taskLower = (tugas || '').toLowerCase();
            if (taskLower.includes('instagram')) return 'Instagram';
            if (taskLower.includes('tiktok')) return 'TikTok';
            if (taskLower.includes('youtube')) return 'YouTube';
            if (taskLower.includes('facebook')) return 'Facebook';
            if (taskLower.includes('twitter') || taskLower.includes('x')) return 'Twitter';
            if (taskLower.includes('telegram')) return 'Telegram';
            if (taskLower.includes('whatsapp')) return 'WhatsApp';
            return null;
        }

        // ===================== FILTER AKUN SESUAI PLATFORM MISI =====================
        function getFilteredAccounts(platform) {
            if (!platform) return userAccounts;
            return userAccounts.filter(acc => 
                acc.platform && acc.platform.toLowerCase() === platform.toLowerCase()
            );
        }

        // ===================== CEK AKUN YANG SUDAH DIGUNAKAN UNTUK MISI INI =====================
        function getUsedAccountsForMisi(history, misiId) {
            return history
                .filter(h => h.id_misi === misiId)
                .map(h => h.used_account)
                .filter(acc => acc && acc !== '');
        }

        // ===================== GET AKUN YANG TERSEDIA UNTUK MISI =====================
        function getAvailableAccounts(platform, history, misiId) {
            const filteredAccounts = getFilteredAccounts(platform);
            const usedAccounts = getUsedAccountsForMisi(history, misiId);
            
            return filteredAccounts.filter(acc => {
                const accountKey = `${acc.platform}|${acc.username}`;
                return !usedAccounts.includes(accountKey);
            });
        }

        // ===================== TAMPILKAN SYARAT & KETENTUAN =====================
        async function showRules() {
            try {
                const res = await fetch(RULES_URL + '?t=' + Date.now());
                if (!res.ok) throw new Error('Gagal mengambil syarat & ketentuan');

                const rulesText = await res.text();
                
                const result = await Swal.fire({
                    title: '📋 Syarat & Ketentuan Buzzer',
                    html: `
                        <div style="text-align:left;max-height:400px;overflow-y:auto;color:#ccc;font-size:13px;line-height:1.8;padding:10px;">
                            ${rulesText || 'Syarat & ketentuan belum tersedia.'}
                        </div>
                        <div style="margin-top:15px;padding:10px;background:#ffaa0010;border-radius:8px;border:1px solid #ffaa0033;">
                            <label style="color:#ffaa00;cursor:pointer;font-size:14px;">
                                <input type="checkbox" id="rulesAgree" style="accent-color:#ffaa00;width:18px;height:18px;margin-right:10px;vertical-align:middle;">
                                Saya sudah membaca dan menyetujui syarat & ketentuan
                            </label>
                        </div>
                    `,
                    icon: 'info',
                    confirmButtonText: '✅ Lanjutkan',
                    cancelButtonText: '❌ Batal',
                    showCancelButton: true,
                    confirmButtonColor: '#ffaa00',
                    cancelButtonColor: '#666',
                    preConfirm: () => {
                        const agree = document.getElementById('rulesAgree');
                        if (!agree || !agree.checked) {
                            Swal.showValidationMessage('⚠️ Anda harus menyetujui syarat & ketentuan terlebih dahulu!');
                            return false;
                        }
                        return true;
                    },
                    allowOutsideClick: false
                });

                return result.isConfirmed;

            } catch (err) {
                console.error('Error show rules:', err);
                Swal.fire({
                    title: '❌ Gagal',
                    text: 'Gagal mengambil syarat & ketentuan.',
                    icon: 'error',
                    confirmButtonColor: '#ffaa00'
                });
                return false;
            }
        }

        // ===================== FILTER MISI =====================
        function setFilter(platform) {
            currentFilter = platform;
            
            document.querySelectorAll('.btn-filter').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === platform);
            });
            
            loadMisi();
        }

        // ===================== HITUNG KONFIRMASI PER USER =====================
        function getUserKonfirmasiCount(history, userEmail) {
            return history.filter(h => h.user === userEmail).length;
        }

        // ===================== CEK USERNAME SUDAH DIPAKAI =====================
        function isUsernameAlreadyUsed(history, username, excludeIndex = -1) {
            return history.some((h, idx) => {
                if (idx === excludeIndex) return false;
                return h.nama && h.nama.toLowerCase() === username.toLowerCase();
            });
        }

        // ===================== CEK KUOTA MISI PENUH =====================
        function isMisiFull(misi) {
            const history = misi.History || [];
            const jumlah = misi.Jumlah || 0;
            if (jumlah === 0) return false;
            return history.length >= jumlah;
        }

        // ===================== CEK APAKAH USER PUNYA AKUN =====================
        function hasUserAccounts() {
            return userAccounts.length > 0;
        }

        // ===================== GET PESAN AKTIF =====================
        function getActivePesan(misi) {
            const history = misi.History || [];
            const pesanList = misi.Pesan || [];
            const completedCount = history.length;
            
            if (pesanList.length === 0) return null;
            
            if (completedCount >= pesanList.length) {
                return {
                    index: pesanList.length - 1,
                    text: pesanList[pesanList.length - 1],
                    isLast: true,
                    isActive: true
                };
            }
            
            return {
                index: completedCount,
                text: pesanList[completedCount],
                isLast: completedCount === pesanList.length - 1,
                isActive: true
            };
        }

        // ===================== LOAD MISI =====================
        async function loadMisi() {
            const container = document.getElementById('misiContainer');
            container.innerHTML = '<div class="loading">⏳ Memuat daftar misi...</div>';

            const user = getUserData();
            document.getElementById('userEmailDisplay').textContent = user.email || 'Belum login';

            await fetchBuzzerAccounts();
            const hasAccounts = hasUserAccounts();

            try {
                const res = await fetch(DATA_URL + '?t=' + Date.now());
                if (!res.ok) throw new Error('Gagal mengambil data misi');

                const data = await res.json();
                if (!Array.isArray(data) || data.length === 0) {
                    container.innerHTML = '<div class="no-data">📭 Belum ada misi tersedia.</div>';
                    return;
                }

                let filteredData = data;
                if (currentFilter !== 'all') {
                    filteredData = data.filter(misi => {
                        const taskLower = (misi.Tugas || '').toLowerCase();
                        const filterLower = currentFilter.toLowerCase();
                        return taskLower.includes(filterLower);
                    });
                }

                if (filteredData.length === 0) {
                    container.innerHTML = `<div class="no-data">📭 Tidak ada misi untuk platform <b>${currentFilter}</b>.</div>`;
                    return;
                }

                let html = '';
                filteredData.forEach((misi, index) => {
                    const history = misi.History || [];
                    const completedList = history.map(h => h.user);
                    
                    const isFull = isMisiFull(misi);
                    const userCount = getUserKonfirmasiCount(history, user.email);
                    const isLimitReached = userCount >= MAX_KONFIRMASI_PER_USER;
                    const isCompleted = completedList.includes(user.email);
                    
                    const misiPlatform = extractPlatformFromMisi(misi.Tugas);
                    const filteredAccounts = getFilteredAccounts(misiPlatform);
                    const hasMatchingAccount = filteredAccounts.length > 0;
                    
                    // ===== CEK AKUN YANG TERSEDIA =====
                    const availableAccounts = getAvailableAccounts(misiPlatform, history, misi.id_misi);
                    const hasAvailableAccount = availableAccounts.length > 0;
                    
                    const canUpload = hasAccounts && hasMatchingAccount && hasAvailableAccount && !isFull && !isLimitReached;
                    
                    const progress = misi.Jumlah ? Math.min((completedList.length / misi.Jumlah) * 100, 100) : 0;

                    const activePesan = getActivePesan(misi);
                    
                    // ===== RIWAYAT =====
                    let historyHtml = '';
                    if (history.length > 0) {
                        historyHtml = `<div style="margin-top:10px;"><strong style="color:#888;font-size:12px;">📜 Riwayat Penyelesaian:</strong>`;
                        history.forEach(h => {
                            historyHtml += `
                                <div class="history-item">
                                    <span class="h-user">${h.user}</span>
                                    <span class="h-id">[${h.id_misi || misi.id_misi || '-'}]</span>
                                    <span class="h-date">${h.tanggal || '-'}</span>
                                    <span class="h-bukti">| Bukti: ${h.bukti || 'Tidak ada'}</span>
                                    ${h.nama ? `<span style="color:#ffaa00;font-size:10px;">| @${h.nama}</span>` : ''}
                                    ${h.konfirmasi_ke ? `<span style="color:#ffaa00;font-size:10px;">| #${h.konfirmasi_ke}</span>` : ''}
                                    ${h.used_account ? `<span style="color:#00ffaa;font-size:10px;">| 📱 ${h.used_account}</span>` : ''}
                                </div>
                            `;
                        });
                        historyHtml += `</div>`;
                    }

                    // ===== PESAN BOX =====
                    let pesanHtml = '';
                    if (misi.Pesan && misi.Pesan.length > 0) {
                        pesanHtml = `
                            <div class="pesan-box">
                                <strong style="color:#ffaa00;font-size:12px;">📝 Custom Komentar (Copy & Gunakan):</strong>
                                <div style="margin-top:6px;">
                        `;
                        
                        misi.Pesan.forEach((p, idx) => {
                            const isActive = activePesan && activePesan.index === idx;
                            const isDone = activePesan && activePesan.index > idx;
                            
                            let badgeText = '';
                            let badgeClass = '';
                            if (isActive && !isDone) {
                                badgeText = '✅ AKTIF';
                                badgeClass = 'active';
                            } else if (isDone) {
                                badgeText = '✅ DONE';
                                badgeClass = 'done';
                            } else {
                                badgeText = `#${idx + 1}`;
                                badgeClass = '';
                            }
                            
                            pesanHtml += `
                                <div class="pesan-item">
                                    <span class="pesan-text">${p}</span>
                                    <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
                                        <span class="pesan-badge ${badgeClass}">${badgeText}</span>
                                        <button class="btn-copy" onclick="copyPesan('${p.replace(/'/g, "\\'")}')">📋 Copy</button>
                                    </div>
                                </div>
                            `;
                        });
                        
                        pesanHtml += `
                                </div>
                            </div>
                        `;
                    }

                    // ===== STATUS BADGE =====
                    let statusBadge = '';
                    if (isFull) {
                        statusBadge = `<span class="badge full">🔒 MISI TELAH SELESAI</span>`;
                    } else if (!hasAccounts || !hasMatchingAccount) {
                        statusBadge = `<span class="badge no-account">⛔ Tidak Ada Akun</span>`;
                    } else if (isLimitReached) {
                        statusBadge = `<span class="badge limit">⛔ Limit 5</span>`;
                    } else if (isCompleted && !hasAvailableAccount) {
                        statusBadge = `<span class="badge done">✅ Semua akun sudah digunakan</span>`;
                    } else if (isCompleted) {
                        statusBadge = `<span class="badge done">✅ Selesai</span>`;
                    } else {
                        statusBadge = `<span class="badge">⏳ ${userCount}/${MAX_KONFIRMASI_PER_USER}</span>`;
                    }

                    // ===== TARGET LINK =====
                    let targetHtml = '';
                    if (hasAccounts && hasMatchingAccount && !isFull) {
                        targetHtml = `<div class="target"><strong>🎯 Target:</strong> 
                            <a href="${misi.Target || '#'}" target="_blank">${misi.Target || '-'}</a>
                        </div>`;
                    } else if (isFull) {
                        targetHtml = `<span class="target" style="color:#555;">🔒 Target telah ditutup (kuota penuh)</span>`;
                    } else {
                        targetHtml = `
                            <div class="target" style="color:#555;">
                                🔒 Target tidak tersedia - <span style="color:#ff6666;">Anda belum memiliki akun buzzer yang sesuai</span>
                            </div>
                        `;
                    }

                    // ===== NO ACCOUNT WARNING =====
                    const noAccountWarning = (!hasAccounts || !hasMatchingAccount) && !isFull ? `
                        <div class="no-account-warning">
                            <span class="icon">⚠️</span>
                            ${!hasAccounts ? 'Anda belum memiliki akun buzzer yang terdaftar.' : 'Anda tidak memiliki akun untuk platform ini.'}
                            <br>
                            Silakan daftarkan akun yang sesuai terlebih dahulu.
                            <br>
                            <a href="https://wa.me/6289518103883" target="_blank" class="btn-contact">📱 Hubungi Admin</a>
                        </div>
                    ` : '';

                    // ===== AKUN BUZZER OPTIONS (hanya yang tersedia/belum digunakan) =====
                    let accountOptions = '<option value="">Pilih akun yang digunakan...</option>';
                    
                    const accountsToShow = hasMatchingAccount ? availableAccounts : [];
                    
                    if (accountsToShow.length === 0) {
                        const usedAccounts = getUsedAccountsForMisi(history, misi.id_misi);
                        if (usedAccounts.length > 0 && hasMatchingAccount) {
                            accountOptions = '<option value="" disabled>✅ Semua akun sudah digunakan</option>';
                        } else {
                            accountOptions = '<option value="" disabled>Tidak ada akun valid</option>';
                        }
                    } else {
                        accountsToShow.forEach(acc => {
                            const isMatching = misiPlatform && acc.platform && 
                                acc.platform.toLowerCase() === misiPlatform.toLowerCase();
                            accountOptions += `
                                <option value="${acc.platform}|${acc.username}" ${isMatching ? 'selected' : ''}>
                                    ${acc.platform}: ${acc.username}
                                </option>
                            `;
                        });
                    }

                    // ===== UPLOAD AREA =====
                    let uploadAreaHtml = '';
                    if (isFull) {
                        uploadAreaHtml = `
                            <div class="closed-info">
                                🔒 MISI TELAH SELESAI - Kuota ${misi.Jumlah || '∞'} target telah terpenuhi
                            </div>
                        `;
                    } else if (!hasAccounts || !hasMatchingAccount || accountsToShow.length === 0) {
                        const usedAccounts = getUsedAccountsForMisi(history, misi.id_misi);
                        let message = '';
                        if (!hasAccounts) message = 'Akun buzzer tidak ditemukan.';
                        else if (!hasMatchingAccount) message = 'Tidak ada akun untuk platform ini.';
                        else if (accountsToShow.length === 0 && usedAccounts.length > 0) {
                            message = '✅ Semua akun Anda sudah digunakan untuk misi ini.';
                        } else {
                            message = 'Tidak ada akun valid untuk platform ini.';
                        }
                        uploadAreaHtml = `
                            <div style="text-align:center;padding:12px;color:#ff6666;background:#ff444415;border-radius:12px;border:1px solid #ff444455;">
                                ${message}
                                ${usedAccounts.length > 0 ? `<br><span style="font-size:11px;color:#888;">Akun yang sudah digunakan: ${usedAccounts.join(', ')}</span>` : ''}
                            </div>
                        `;
                    } else {
                        const canUploadFinal = hasAccounts && hasMatchingAccount && accountsToShow.length > 0 && !isFull && !isLimitReached;
                        
                        uploadAreaHtml = `
                            ${noAccountWarning}
                            <div class="input-buzzer">
                                <select id="accountSelect-${index}" ${!canUploadFinal ? 'disabled' : ''}>
                                    ${accountOptions}
                                </select>
                                <input type="text" id="buzzerName-${index}" placeholder="Nama/Username Buzzer" style="flex:1;" ${!canUploadFinal ? 'disabled' : ''}>
                                <input type="email" id="buzzerEmail-${index}" value="${user.email}" style="flex:1;" disabled>
                            </div>

                            <div class="upload-area">
                                <input type="file" id="fileInput-${index}" accept="image/*" ${!canUploadFinal ? 'disabled' : ''}>
                                <button class="btn btn-upload" id="uploadBtn-${index}" ${!canUploadFinal ? 'disabled' : ''}>
                                    ${isLimitReached ? '⛔ Limit 5' : isCompleted ? '✅ Selesai' : '📤 Upload Bukti'}
                                </button>
                            </div>
                            ${isLimitReached ? '<div class="text-muted" style="margin-top:4px;">⛔ Anda sudah mencapai batas 5 konfirmasi.</div>' : ''}
                            ${isCompleted && !isLimitReached && accountsToShow.length === 0 ? '<div class="text-muted" style="margin-top:4px;">✅ Semua akun Anda sudah digunakan untuk misi ini.</div>' : ''}
                            ${isCompleted && !isLimitReached && accountsToShow.length > 0 ? '<div class="text-muted" style="margin-top:4px;">✨ Anda sudah menyelesaikan misi ini dengan akun lain. Bisa gunakan akun lain untuk konfirmasi tambahan.</div>' : ''}
                            ${!isCompleted && !isLimitReached && !isFull && hasAccounts && hasMatchingAccount && accountsToShow.length > 0 ? '<div class="text-muted" style="margin-top:4px;">📌 Pilih akun yang digunakan untuk mengerjakan misi. (Sisa akun: ' + accountsToShow.length + ')</div>' : ''}
                        `;
                    }

                    html += `
                        <div class="misi-card" id="misi-${index}">
                            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;">
                                <div class="title">${misi.Tugas || 'Misi'}</div>
                                ${statusBadge}
                            </div>
                            
                            <div class="detail"><strong>🆔 ID Misi:</strong> <span class="id-misi">${misi.id_misi || '-'}</span></div>
                            <div class="detail"><strong>💰 Harga:</strong> ${misi.Harga || 'Gratis'}</div>
                            <div class="detail"><strong>📊 Jumlah yang dibutuhkan:</strong> ${misi.Jumlah || '∞'}</div>
                            <div class="detail"><strong>✅ Sudah dikerjakan:</strong> ${completedList.length} / ${misi.Jumlah || '∞'} ${isFull ? '🔒 (PENUH)' : ''}</div>
                            <div class="detail"><strong>👤 Konfirmasi Anda:</strong> ${userCount} / ${MAX_KONFIRMASI_PER_USER}</div>
                            
                            <div class="progress-bar">
                                <div class="fill ${isFull ? 'full' : ''}" style="width:${Math.min(progress, 100)}%;"></div>
                            </div>

                            ${targetHtml}

                            ${pesanHtml}

                            ${historyHtml}

                            ${isLimitReached && !isFull && hasAccounts && hasMatchingAccount ? `
                                <div class="limit-info">
                                    <span>⛔ Anda sudah mencapai batas maksimal ${MAX_KONFIRMASI_PER_USER} konfirmasi.</span>
                                    <span class="count">${userCount}/${MAX_KONFIRMASI_PER_USER}</span>
                                </div>
                            ` : ''}

                            <div class="divider"></div>

                            ${uploadAreaHtml}
                        </div>
                    `;
                });

                container.innerHTML = html;

                // ===== ATTACH EVENT UPLOAD =====
                if (hasAccounts) {
                    filteredData.forEach((misi, index) => {
                        const isFull = isMisiFull(misi);
                        if (isFull) return;

                        const btn = document.getElementById(`uploadBtn-${index}`);
                        const fileInput = document.getElementById(`fileInput-${index}`);
                        const accountSelect = document.getElementById(`accountSelect-${index}`);
                        const nameInput = document.getElementById(`buzzerName-${index}`);
                        const emailInput = document.getElementById(`buzzerEmail-${index}`);

                        if (btn && fileInput && !btn.disabled) {
                            btn.addEventListener('click', function() {
                                const selectedAccount = accountSelect ? accountSelect.value : '';
                                const buzzerName = nameInput ? nameInput.value.trim() : '-';
                                const buzzerEmail = emailInput ? emailInput.value.trim() : user.email;
                                handleUpload(misi, index, fileInput, buzzerName, buzzerEmail, selectedAccount);
                            });
                        }
                    });
                }

            } catch (err) {
                console.error('Error load misi:', err);
                container.innerHTML = `<div class="no-data" style="color:#ff6666;">❌ Gagal memuat misi: ${err.message}</div>`;
            }
        }

        // ===================== COPY PESAN =====================
        window.copyPesan = function(text) {
            navigator.clipboard.writeText(text).then(() => {
                Swal.fire({
                    title: '✅ Berhasil Disalin!',
                    text: 'Pesan komentar berhasil disalin ke clipboard.',
                    icon: 'success',
                    timer: 1500,
                    showConfirmButton: false,
                    toast: true,
                    position: 'top-end'
                });
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                Swal.fire({
                    title: '✅ Berhasil Disalin!',
                    icon: 'success',
                    timer: 1500,
                    showConfirmButton: false,
                    toast: true,
                    position: 'top-end'
                });
            });
        };

        // ===================== HANDLE UPLOAD =====================
        async function handleUpload(misi, index, fileInput, buzzerName, buzzerEmail, selectedAccount) {
            const user = getUserData();
            const file = fileInput.files[0];

            if (!hasUserAccounts()) {
                Swal.fire({
                    title: '⛔ Tidak Ada Akun',
                    text: 'Anda tidak memiliki akun buzzer terdaftar. Hubungi admin untuk mendaftarkan akun.',
                    icon: 'error',
                    confirmButtonColor: '#ffaa00'
                });
                return;
            }

            // CEK APAKAH AKUN SUDAH DIGUNAKAN
            const history = misi.History || [];
            const usedAccounts = getUsedAccountsForMisi(history, misi.id_misi);
            
            if (usedAccounts.includes(selectedAccount)) {
                Swal.fire({
                    title: '⚠️ Akun Sudah Digunakan',
                    text: `Akun "${selectedAccount.replace('|', ' - ')}" sudah digunakan untuk misi ini. Pilih akun lain.`,
                    icon: 'warning',
                    confirmButtonColor: '#ffaa00'
                });
                return;
            }

            const rulesAccepted = await showRules();
            if (!rulesAccepted) return;

            if (isMisiFull(misi)) {
                Swal.fire({
                    title: '🔒 Misi Telah Selesai',
                    text: 'Maaf, misi ini sudah mencapai kuota penuh.',
                    icon: 'info',
                    confirmButtonColor: '#ffaa00'
                });
                loadMisi();
                return;
            }

            if (!file) {
                Swal.fire({
                    title: '⚠️ Belum ada file',
                    text: 'Silakan pilih bukti screenshot terlebih dahulu.',
                    icon: 'warning',
                    confirmButtonColor: '#ffaa00'
                });
                return;
            }

            if (!selectedAccount) {
                Swal.fire({
                    title: '⚠️ Pilih Akun Buzzer',
                    text: 'Silakan pilih akun yang digunakan untuk mengerjakan misi.',
                    icon: 'warning',
                    confirmButtonColor: '#ffaa00'
                });
                return;
            }

            if (!buzzerName) {
                Swal.fire({
                    title: '⚠️ Isi Nama Buzzer',
                    text: 'Silakan isi nama/username buzzer terlebih dahulu.',
                    icon: 'warning',
                    confirmButtonColor: '#ffaa00'
                });
                return;
            }

            const userCount = getUserKonfirmasiCount(history, buzzerEmail);

            if (userCount >= MAX_KONFIRMASI_PER_USER) {
                Swal.fire({
                    title: '⛔ Limit Maksimal',
                    text: `Anda sudah mencapai batas maksimal ${MAX_KONFIRMASI_PER_USER} konfirmasi.`,
                    icon: 'error',
                    confirmButtonColor: '#ffaa00'
                });
                return;
            }

            if (isUsernameAlreadyUsed(history, buzzerName)) {
                Swal.fire({
                    title: '⚠️ Username Sudah Dipakai',
                    text: `Username "${buzzerName}" sudah pernah digunakan. Gunakan username berbeda.`,
                    icon: 'warning',
                    confirmButtonColor: '#ffaa00'
                });
                return;
            }

            const completedEmails = history.map(h => h.user);
            if (misi.Jumlah && completedEmails.length >= misi.Jumlah) {
                Swal.fire({
                    title: '❌ Kuota Penuh',
                    text: 'Misi ini sudah mencapai jumlah target.',
                    icon: 'error',
                    confirmButtonColor: '#ffaa00'
                });
                loadMisi();
                return;
            }

            const confirmResult = await Swal.fire({
                title: '📤 Upload Bukti Buzzer',
                html: `
                    <div style="text-align:left;">
                        <b>🆔 ID Misi:</b> ${misi.id_misi || '-'}<br>
                        <b>📋 Misi:</b> ${misi.Tugas}<br>
                        <b>🎯 Target:</b> ${misi.Target}<br>
                        <b>👤 Nama Buzzer:</b> ${buzzerName}<br>
                        <b>📧 Email:</b> ${buzzerEmail}<br>
                        <b>📱 Akun Digunakan:</b> ${selectedAccount.replace('|', ' - ')}<br>
                        <b>📎 File:</b> ${file.name}<br>
                        <b>📊 Konfirmasi ke-:</b> ${userCount + 1} / ${MAX_KONFIRMASI_PER_USER}
                    </div>
                `,
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: '✅ Kirim',
                cancelButtonText: '❌ Batal',
                confirmButtonColor: '#ffaa00',
                cancelButtonColor: '#666'
            });

            if (!confirmResult.isConfirmed) return;

            const btn = document.getElementById(`uploadBtn-${index}`);
            if (btn) {
                btn.disabled = true;
                btn.textContent = '⏳ Mengirim...';
            }

            try {
                const tanggal = new Date().toLocaleString('id-ID', {
                    day: '2-digit',
                    month: 'long',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                const pesan1 = Array.isArray(misi.Pesan) ? misi.Pesan[0] || '-' : misi.Pesan || '-';
                const pesan2 = Array.isArray(misi.Pesan) && misi.Pesan[1] ? misi.Pesan[1] : '-';

                const [platform, username] = selectedAccount.split('|');

                const textMessage = `
📢 **LAPORAN BUZZER MISI**
━━━━━━━━━━━━━━━━━━━━━
🆔 **ID Misi:** ${misi.id_misi || '-'}
📋 **Misi:** ${misi.Tugas}
🎯 **Target:** ${misi.Target}
💰 **Harga:** ${misi.Harga || 'Gratis'}

👤 **Nama Buzzer:** ${buzzerName}
📧 **Email:** ${buzzerEmail}
📱 **Akun Digunakan:** ${platform} - ${username}
📅 **Tanggal:** ${tanggal}
📊 **Konfirmasi ke-:** ${userCount + 1} / ${MAX_KONFIRMASI_PER_USER}

📝 **Pesan yang digunakan:** ${pesan1}
${pesan2 !== '-' ? `📝 **Pesan tambahan:** ${pesan2}` : ''}

━━━━━━━━━━━━━━━━━━━━━
📎 **Bukti terlampir di bawah**
                `;

                await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: textMessage,
                        parse_mode: 'Markdown'
                    })
                });

                const formData = new FormData();
                formData.append('chat_id', TELEGRAM_CHAT_ID);
                formData.append('photo', file);
                formData.append('caption', `📸 Bukti: ${misi.Tugas} - ${buzzerName} [${misi.id_misi || '-'}] (${userCount + 1}/${MAX_KONFIRMASI_PER_USER}) | Akun: ${platform} - ${username}`);

                await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });

                const historyKey = 'buzzer_history_' + (misi.id_misi || misi.Tugas.replace(/\s/g, '_'));
                let historyData = JSON.parse(localStorage.getItem(historyKey) || '[]');
                
                historyData.push({
                    user: buzzerEmail,
                    nama: buzzerName,
                    tanggal: tanggal,
                    bukti: file.name,
                    id_misi: misi.id_misi || '-',
                    misi: misi.Tugas,
                    target: misi.Target,
                    konfirmasi_ke: userCount + 1,
                    used_account: selectedAccount
                });

                localStorage.setItem(historyKey, JSON.stringify(historyData));

                Swal.fire({
                    title: '✅ Berhasil!',
                    html: `
                        Bukti untuk misi <b>"${misi.Tugas}"</b> berhasil dikirim!<br>
                        <span style="font-size:13px;color:#888;">🆔 ${misi.id_misi || '-'} | Nama: ${buzzerName}</span><br>
                        <span style="font-size:13px;color:#ffaa00;">📊 Konfirmasi ke-${userCount + 1} / ${MAX_KONFIRMASI_PER_USER}</span><br>
                        <span style="font-size:13px;color:#00ffaa;">📱 Akun: ${platform} - ${username}</span>
                    `,
                    icon: 'success',
                    confirmButtonColor: '#ffaa00'
                });

                loadMisi();

            } catch (err) {
                console.error('Error upload:', err);
                Swal.fire({
                    title: '❌ Gagal',
                    text: 'Error: ' + err.message,
                    icon: 'error',
                    confirmButtonColor: '#ffaa00'
                });
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = '📤 Upload Bukti';
                }
            }
        }

        // ===================== INIT =====================
        document.addEventListener('DOMContentLoaded', async function() {
            const configLoaded = await fetchConfig();
            if (!configLoaded) {
                Swal.fire({
                    title: '❌ Gagal memuat konfigurasi',
                    text: 'Tidak dapat mengambil konfigurasi Telegram dari server.',
                    icon: 'error',
                    confirmButtonColor: '#ffaa00'
                });
                return;
            }

            await loadMisi();
        });

        setInterval(loadMisi, 30000);

        console.log('📢 Buzzer Misi siap!');
        console.log('👤 User:', getUserData().email);
        console.log('📊 Maks konfirmasi per user:', MAX_KONFIRMASI_PER_USER);
        console.log('🔐 Telegram Config loaded');
    </script>
</body>
</html>
