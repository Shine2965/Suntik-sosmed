<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Shine Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0e1a;
            color: #fff;
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 198, 255, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 114, 255, 0.10) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(168, 85, 247, 0.06) 0%, transparent 60%);
            animation: bgFloat 20s ease-in-out infinite alternate;
            z-index: 0;
            pointer-events: none;
        }
        @keyframes bgFloat {
            0% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(2%, -2%) rotate(2deg); }
            66% { transform: translate(-1%, 3%) rotate(-1deg); }
            100% { transform: translate(1%, -1%) rotate(1deg); }
        }
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
            animation: orbPulse 6s ease-in-out infinite alternate;
        }
        .orb-1 { width: 400px; height: 400px; top: -100px; right: -100px; background: rgba(0, 198, 255, 0.12); }
        .orb-2 { width: 300px; height: 300px; bottom: -50px; left: -50px; background: rgba(168, 85, 247, 0.10); }
        @keyframes orbPulse {
            0% { transform: scale(0.8); opacity: 0.6; }
            100% { transform: scale(1.2); opacity: 1; }
        }
        .login-container {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px) saturate(180%);
            border-radius: 28px;
            padding: 45px 35px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            position: relative;
            z-index: 1;
        }
        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 20%;
            right: 20%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00c6ff, #0072ff, #8b5cf6, transparent);
            border-radius: 100%;
            filter: blur(2px);
            opacity: 0.6;
        }
        .logo-wrapper {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(0, 198, 255, 0.2), rgba(0, 114, 255, 0.2));
            padding: 4px;
            animation: logoPulse 3s ease-in-out infinite;
        }
        .logo-wrapper::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00c6ff, #0072ff, #8b5cf6);
            opacity: 0.3;
            filter: blur(12px);
            z-index: -1;
            animation: logoGlow 3s ease-in-out infinite alternate;
        }
        .logo-wrapper img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }
        @keyframes logoGlow {
            0% { opacity: 0.2; transform: scale(0.9); }
            100% { opacity: 0.6; transform: scale(1.1); }
        }
        @keyframes logoPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
        h1 {
            text-align: center;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #f0f9ff 0%, #b6d4fe 40%, #a5b4fc 70%, #c4b5fd 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 6px;
        }
        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
            font-weight: 300;
            letter-spacing: 0.5px;
            margin-bottom: 30px;
        }
        .input-group {
            margin-bottom: 18px;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #94a3b8;
            margin-bottom: 6px;
            letter-spacing: 0.3px;
        }
        .input-group input {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.05);
            color: #f1f5f9;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            outline: none;
        }
        .input-group input:focus {
            border-color: #00c6ff;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(0, 198, 255, 0.10);
        }
        .input-group input::placeholder {
            color: #64748b;
        }
        .btn-login {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 999px;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            color: #fff;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 24px rgba(0, 114, 255, 0.3);
            margin-top: 8px;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(0, 114, 255, 0.45);
            background: linear-gradient(135deg, #00d4ff, #0066ff);
        }
        .btn-login:active {
            transform: scale(0.97);
        }
        .btn-login:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        .error-msg {
            color: #f87171;
            font-size: 13px;
            text-align: center;
            margin-top: 12px;
            min-height: 20px;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            font-size: 11px;
            color: #475569;
            letter-spacing: 0.5px;
        }
        .footer span {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 600;
        }
        .loading-spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    
    <div class="login-container">
        <div class="logo-wrapper">
            <img src="/home/logo.png" alt="Shine Shop">
        </div>
        <h1>Shine Shop</h1>
        <p class="subtitle">✦ Dashboard Saldo ✦</p>
        
        <div class="input-group">
            <label>📧 Gmail</label>
            <input type="email" id="loginEmail" placeholder="Masukkan Gmail..." autocomplete="email">
        </div>
        
        <div class="input-group">
            <label>🔑 Password</label>
            <input type="password" id="loginPassword" placeholder="Masukkan Password..." autocomplete="current-password">
        </div>
        
        <button class="btn-login" id="loginBtn">🚀 Login</button>
        <div class="error-msg" id="loginError"></div>
        
        <div class="footer">© <span>Shine Shop</span> · 2025</div>
    </div>

    <script>
        // ===================== LOAD ACCOUNTS =====================
        async function loadAccounts() {
            try {
                const res = await fetch('/info/accounts.json?cache=' + Date.now());
                if (!res.ok) throw new Error('Gagal load accounts');
                return await res.json();
            } catch (e) {
                console.error('Error loading accounts:', e);
                return [];
            }
        }

        // ===================== LOGIN =====================
        const loginBtn = document.getElementById('loginBtn');
        const loginEmail = document.getElementById('loginEmail');
        const loginPassword = document.getElementById('loginPassword');
        const loginError = document.getElementById('loginError');

        async function handleLogin() {
            const email = loginEmail.value.trim();
            const password = loginPassword.value.trim();

            if (!email || !password) {
                loginError.textContent = '❌ Harap isi Gmail dan Password!';
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="loading-spinner"></span> Memeriksa...';
            loginError.textContent = '';

            const accounts = await loadAccounts();
            
            // Cari akun yang match
            const found = accounts.find(acc => 
                acc.Gmail.toLowerCase() === email.toLowerCase() && 
                acc.Password === password
            );

            if (!found) {
                loginError.textContent = '❌ Gmail atau Password salah!';
                loginBtn.disabled = false;
                loginBtn.textContent = '🚀 Login';
                return;
            }

            // Simpan session
            localStorage.setItem('dashboard_user', JSON.stringify({
                email: found.Gmail,
                password: found.Password,
                saldo: found.Saldo || '0',
                dana: found.Dana || '-',
                qris: found.qris || '-'
            }));

            // Redirect ke dashboard
            window.location.href = 'dashboard.html';
        }

        // Event listeners
        loginBtn.addEventListener('click', handleLogin);
        loginPassword.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') handleLogin();
        });
        loginEmail.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') loginPassword.focus();
        });

        // Cek apakah sudah login
        const session = localStorage.getItem('dashboard_user');
        if (session) {
            try {
                const data = JSON.parse(session);
                if (data.email) {
                    window.location.href = 'info/dashboard/';
                }
            } catch(e) {}
        }
    </script>
</body>
</html>
