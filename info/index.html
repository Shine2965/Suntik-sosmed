<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Info Saldo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 20% 30%, #00c6ff15, transparent 50%),
                        radial-gradient(circle at 80% 70%, #0072ff15, transparent 50%),
                        #0a0a0a;
        }
        .login-container {
            background: #1a1a1a;
            border-radius: 24px;
            padding: 40px 35px;
            max-width: 420px;
            width: 90%;
            border: 1px solid #00ffaa33;
            box-shadow: 0 0 60px rgba(0,255,170,0.08);
        }
        .login-container h1 {
            color: #00ffaa;
            font-size: 28px;
            text-align: center;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }
        .login-container .sub {
            color: #888;
            text-align: center;
            font-size: 14px;
            margin-bottom: 28px;
        }
        .login-container label {
            color: #ccc;
            font-size: 13px;
            font-weight: 600;
            display: block;
            margin-top: 16px;
            margin-bottom: 6px;
        }
        .login-container input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid #00ffaa33;
            background: #0d0d0d;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }
        .login-container input:focus {
            border-color: #00ffaa;
            box-shadow: 0 0 20px rgba(0,255,170,0.1);
        }
        .login-container button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            background: #00ffaa;
            border: none;
            border-radius: 30px;
            font-weight: 700;
            font-size: 16px;
            color: #0a0a0a;
            cursor: pointer;
            transition: 0.3s;
        }
        .login-container button:hover {
            background: #00dd99;
            transform: scale(0.97);
        }
        .login-container button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .login-container .btn-buzzer {
            background: #ffaa0044;
            color: #ffaa00;
            border: 1px solid #ffaa0055;
            margin-top: 12px;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            transition: 0.3s;
        }
        .login-container .btn-buzzer:hover {
            background: #ffaa0066;
            transform: scale(0.97);
        }
        .login-container .error-msg {
            color: #ff6666;
            font-size: 13px;
            text-align: center;
            margin-top: 14px;
            min-height: 20px;
        }
        .login-container .info-text {
            color: #666;
            font-size: 12px;
            text-align: center;
            margin-top: 16px;
        }
        .login-container .divider {
            border: none;
            border-top: 1px solid #00ffaa15;
            margin: 20px 0 16px 0;
        }
        .env-status {
            text-align: center;
            font-size: 11px;
            color: #555;
            margin-top: 8px;
        }
        .security-badge {
            text-align: center;
            font-size: 10px;
            color: #444;
            margin-top: 12px;
            border-top: 1px solid #00ffaa15;
            padding-top: 12px;
        }
        .buzzer-promo {
            text-align: center;
            font-size: 12px;
            color: #888;
            margin-top: 8px;
        }
        .buzzer-promo strong {
            color: #ffaa00;
        }
        .user-id-display {
            text-align: center;
            font-size: 10px;
            color: #444;
            margin-top: 6px;
            font-family: monospace;
        }
        .user-id-display span {
            color: #666;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>🔐 Info Saldo</h1>
        <div class="sub">Masuk untuk melihat saldo akun</div>
        
        <label>📧 Gmail</label>
        <input type="email" id="loginEmail" placeholder="Masukkan Gmail..." autocomplete="email">
        
        <label>🔑 Password</label>
        <input type="password" id="loginPassword" placeholder="Masukkan Password..." autocomplete="current-password">
        
        <button id="loginBtn">✅ Masuk</button>
        <div class="error-msg" id="loginError"></div>
        
        <hr class="divider">
        
        <!-- ===== TOMBOL DAFTAR BUZZER ===== -->
        <a href="https://wa.me/6289518103883?text=Halo%20Admin%2C%20saya%20ingin%20mendaftar%20menjadi%20buzzer%20di%20Shine%20Shop.%20Mohon%20informasi%20lebih%20lanjutnya." 
           target="_blank" 
           class="btn btn-buzzer">
           📢 Daftar Jadi Buzzer
        </a>
        <div class="buzzer-promo">
            💰 Dapatkan <strong>reward</strong> dari setiap misi yang diselesaikan!
        </div>
        
        <div class="info-text">🔒 Data aman & hanya bisa diakses oleh pemilik akun</div>
        <div class="env-status" id="envStatus">🔌 Mengambil data dari server...</div>
        <div class="user-id-display">
            🆔 User ID: <span id="userIdDisplay">-</span>
        </div>
        <div class="security-badge">📁 Data dari Shine Shop</div>
    </div>

    <script>
        // ===================== KONFIGURASI =====================
        const ACCOUNTS_FILE = '/info/accounts.json';
        const DASHBOARD_URL = '/info/dashboard/index.html';

        // ===================== ELEMEN =====================
        const emailInput = document.getElementById('loginEmail');
        const passInput = document.getElementById('loginPassword');
        const loginBtn = document.getElementById('loginBtn');
        const errorEl = document.getElementById('loginError');
        const envStatus = document.getElementById('envStatus');
        const userIdDisplay = document.getElementById('userIdDisplay');

        let accountsData = [];

        // ===================== USER ID (PERSISTEN - TIDAK BUAT ULANG) =====================
        function generateUserID() {
            return 'user-' + Math.random().toString(36).substring(2, 10) + '-' + Date.now().toString(36);
        }

        function getOrCreateUserID() {
            // CEK APAKAH SUDAH ADA DI LOCAL STORAGE
            let id = localStorage.getItem('user_id');
            
            // JIKA SUDAH ADA, LANGSUNG KEMBALIKAN (TIDAK BUAT BARU)
            if (id) {
                console.log('✅ User ID sudah ada (persisten):', id);
                return id;
            }
            
            // JIKA BELUM ADA, BUAT BARU
            id = generateUserID();
            localStorage.setItem('user_id', id);
            console.log('🆕 User ID baru dibuat:', id);
            return id;
        }

        // ===================== GET USER ID (TANPA MEMBUAT BARU) =====================
        function getUserID() {
            // HANYA MENGAMBIL, TIDAK MEMBUAT BARU
            return localStorage.getItem('user_id') || null;
        }

        // ===================== TAMPILKAN USER ID =====================
        function displayUserID() {
            const id = getUserID();
            if (id) {
                userIdDisplay.textContent = id;
                userIdDisplay.style.color = '#00ffaa';
            } else {
                userIdDisplay.textContent = 'Belum ada (akan dibuat saat login)';
                userIdDisplay.style.color = '#666';
            }
        }

        // ===================== GENERATE SESSION TOKEN =====================
        function generateSessionToken() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let token = 'session_';
            for (let i = 0; i < 32; i++) {
                token += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            token += '_' + Date.now().toString(36);
            return token;
        }

        // ===================== AMBIL DATA DARI accounts.json =====================
        async function fetchAccounts() {
            try {
                envStatus.textContent = '⏳ Mengambil data akun...';
                envStatus.style.color = '#888';
                
                const res = await fetch(ACCOUNTS_FILE + '?t=' + Date.now());
                
                if (!res.ok) {
                    throw new Error('Gagal mengambil data: ' + res.status);
                }

                const data = await res.json();
                
                if (!Array.isArray(data)) {
                    throw new Error('Format data tidak valid (harus array)');
                }

                accountsData = data;
                envStatus.textContent = '✅ ' + accountsData.length + ' akun tersedia';
                envStatus.style.color = '#00ffaa';
                console.log('✅ Akun dimuat:', accountsData.length, 'akun');
                return accountsData;

            } catch (err) {
                console.error('Error fetch accounts:', err);
                envStatus.textContent = '❌ ' + err.message;
                envStatus.style.color = '#ff6666';
                return [];
            }
        }

        // ===================== LOGIN =====================
        async function handleLogin() {
            const email = emailInput.value.trim();
            const password = passInput.value.trim();

            if (!email || !password) {
                errorEl.textContent = '❌ Harap isi Gmail dan Password!';
                return;
            }

            errorEl.textContent = '⏳ Memeriksa akun...';
            loginBtn.disabled = true;

            try {
                // Pastikan data akun sudah di-load
                if (accountsData.length === 0) {
                    await fetchAccounts();
                }

                if (accountsData.length === 0) {
                    errorEl.textContent = '❌ Tidak ada data akun. Hubungi admin.';
                    loginBtn.disabled = false;
                    return;
                }

                // Cari akun yang cocok
                const found = accountsData.find(acc => 
                    acc.Gmail && acc.Gmail.toLowerCase() === email.toLowerCase() &&
                    acc.Password && acc.Password === password
                );

                if (!found) {
                    errorEl.textContent = '❌ Gmail atau Password salah!';
                    loginBtn.disabled = false;
                    return;
                }

                // ✅ DAPATKAN USER ID (TANPA MEMBUAT BARU)
                let userId = getUserID();
                
                // JIKA BELUM ADA USER ID, BUAT SEKARANG
                if (!userId) {
                    userId = getOrCreateUserID();
                    console.log('🆕 User ID dibuat saat login:', userId);
                } else {
                    console.log('✅ User ID existing digunakan:', userId);
                }

                // ✅ Generate session token
                const sessionToken = generateSessionToken();
                
                // ✅ Login berhasil → simpan session ke localStorage
                localStorage.setItem('logged_in', 'true');
                localStorage.setItem('session_token', sessionToken);
                localStorage.setItem('session_created', Date.now().toString());
                localStorage.setItem('user_email', found.Gmail);
                localStorage.setItem('user_password', found.Password);
                localStorage.setItem('user_saldo', found.Saldo || '0');
                localStorage.setItem('user_role', found.role || 'user');
                localStorage.setItem('user_qris', found.qris || '');
                localStorage.setItem('user_dana', found.Dana || '');

                // Redirect ke dashboard
                window.location.href = DASHBOARD_URL;

            } catch (err) {
                errorEl.textContent = '❌ Error: ' + err.message;
                loginBtn.disabled = false;
            }
        }

        // ===================== EVENT =====================
        loginBtn.addEventListener('click', handleLogin);

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleLogin();
            }
        });

        // ===================== INIT =====================
        async function init() {
            // Cek apakah sudah login sebelumnya
            const loggedIn = localStorage.getItem('logged_in');
            const sessionToken = localStorage.getItem('session_token');
            
            if (loggedIn === 'true' && sessionToken) {
                window.location.href = DASHBOARD_URL;
                return;
            }

            // Hapus session lama jika ada (tapi PERTAHANKAN user_id)
            if (loggedIn === 'true' && !sessionToken) {
                const userId = localStorage.getItem('user_id'); // Simpan dulu
                localStorage.clear();
                if (userId) {
                    localStorage.setItem('user_id', userId); // Restore user_id
                    console.log('🔄 User ID dipertahankan:', userId);
                }
            }

            // Tampilkan User ID yang sudah ada (jika ada)
            displayUserID();

            // Ambil data akun dari accounts.json
            await fetchAccounts();
            
            console.log('🔐 Halaman Login siap!');
            console.log('📊 Total akun:', accountsData.length);
            console.log('📁 Sumber data: /info/accounts.json');
            
            // Log status User ID
            const existingId = getUserID();
            if (existingId) {
                console.log('🆔 User ID existing:', existingId);
            } else {
                console.log('🆔 Belum ada User ID (akan dibuat saat login)');
            }
        }

        init();

        // ===================== ANTI INSPECT =====================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' || 
                (e.ctrlKey && e.shiftKey && ['I', 'C', 'J'].includes(e.key)) ||
                (e.ctrlKey && e.key === 'u')) {
                e.preventDefault();
                return false;
            }
        });
    </script>
</body>
</html>
