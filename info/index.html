<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Info Saldo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 20% 30%, #00c6ff15, transparent 50%),
                        radial-gradient(circle at 80% 70%, #0072ff15, transparent 50%),
                        #0a0a0a;
        }
        .login-container {
            background: #1a1a1a;
            border-radius: 24px;
            padding: 40px 35px;
            max-width: 420px;
            width: 90%;
            border: 1px solid #00ffaa33;
            box-shadow: 0 0 60px rgba(0,255,170,0.08);
        }
        .login-container h1 {
            color: #00ffaa;
            font-size: 28px;
            text-align: center;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }
        .login-container .sub {
            color: #888;
            text-align: center;
            font-size: 14px;
            margin-bottom: 28px;
        }
        .login-container label {
            color: #ccc;
            font-size: 13px;
            font-weight: 600;
            display: block;
            margin-top: 16px;
            margin-bottom: 6px;
        }
        .login-container input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid #00ffaa33;
            background: #0d0d0d;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }
        .login-container input:focus {
            border-color: #00ffaa;
            box-shadow: 0 0 20px rgba(0,255,170,0.1);
        }
        .login-container button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            background: #00ffaa;
            border: none;
            border-radius: 30px;
            font-weight: 700;
            font-size: 16px;
            color: #0a0a0a;
            cursor: pointer;
            transition: 0.3s;
        }
        .login-container button:hover {
            background: #00dd99;
            transform: scale(0.97);
        }
        .login-container button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .login-container .error-msg {
            color: #ff6666;
            font-size: 13px;
            text-align: center;
            margin-top: 14px;
            min-height: 20px;
        }
        .login-container .info-text {
            color: #666;
            font-size: 12px;
            text-align: center;
            margin-top: 16px;
        }
        .env-status {
            text-align: center;
            font-size: 11px;
            color: #555;
            margin-top: 8px;
        }
        .security-badge {
            text-align: center;
            font-size: 10px;
            color: #444;
            margin-top: 12px;
            border-top: 1px solid #00ffaa15;
            padding-top: 12px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>🔐 Login Page</h1>
        <div class="sub">Masuk untuk melihat saldo akun</div>
        
        <label>📧 Gmail</label>
        <input type="email" id="loginEmail" placeholder="Masukkan Gmail..." autocomplete="email">
        
        <label>🔑 Password</label>
        <input type="password" id="loginPassword" placeholder="Masukkan Password..." autocomplete="current-password">
        
        <button id="loginBtn">✅ Masuk</button>
        <div class="error-msg" id="loginError"></div>
        <div class="info-text">🔒 Data aman & hanya bisa diakses oleh pemilik akun</div>
        <div class="env-status" id="envStatus">🔌 Mengambil data dari server...</div>
        <div class="security-badge">🛡️ Akses Dilindungi Shine Shop</div>
    </div>

    <script>
        // ===================== KONFIGURASI =====================
        const API_ENDPOINT = '/api/accounts';
        const DASHBOARD_URL = '/info/dashboard/index.html';
        const LOGIN_URL = '/info/index.html';

        // ===================== ELEMEN =====================
        const emailInput = document.getElementById('loginEmail');
        const passInput = document.getElementById('loginPassword');
        const loginBtn = document.getElementById('loginBtn');
        const errorEl = document.getElementById('loginError');
        const envStatus = document.getElementById('envStatus');

        let accountsData = [];

        // ===================== GENERATE SESSION TOKEN =====================
        function generateSessionToken() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let token = 'session_';
            for (let i = 0; i < 32; i++) {
                token += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            token += '_' + Date.now().toString(36);
            return token;
        }

        // ===================== AMBIL DATA DARI API =====================
        async function fetchAccountsFromAPI() {
            try {
                envStatus.textContent = '⏳ Menghubungi server...';
                envStatus.style.color = '#888';
                
                const res = await fetch(API_ENDPOINT + '?t=' + Date.now(), {
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    },
                    credentials: 'include'
                });
                
                if (!res.ok) {
                    if (res.status === 403) {
                        throw new Error('Akses API ditolak. Domain atau IP tidak terdaftar.');
                    }
                    if (res.status === 429) {
                        throw new Error('Terlalu banyak request. Coba lagi nanti.');
                    }
                    throw new Error('Gagal mengambil data: ' + res.status);
                }

                const data = await res.json();
                
                if (!data.success || !data.accounts) {
                    throw new Error(data.message || 'Format data tidak valid');
                }

                envStatus.textContent = '✅ ' + data.accounts.length + ' akun tersedia';
                envStatus.style.color = '#00ffaa';
                console.log('✅ Akun dari API:', data.accounts.length, 'akun');
                console.log('📡 Request Info:', data.request_info || 'N/A');
                return data.accounts;

            } catch (err) {
                console.error('Error fetch accounts:', err);
                envStatus.textContent = '❌ ' + err.message;
                envStatus.style.color = '#ff6666';
                return [];
            }
        }

        // ===================== LOGIN =====================
        async function handleLogin() {
            const email = emailInput.value.trim();
            const password = passInput.value.trim();

            if (!email || !password) {
                errorEl.textContent = '❌ Harap isi Gmail dan Password!';
                return;
            }

            errorEl.textContent = '⏳ Memeriksa akun...';
            loginBtn.disabled = true;

            try {
                // Ambil data dari API
                const accounts = await fetchAccountsFromAPI();

                if (accounts.length === 0) {
                    errorEl.textContent = '❌ Tidak ada data akun. Hubungi admin.';
                    loginBtn.disabled = false;
                    return;
                }

                // Cari akun yang cocok
                const found = accounts.find(acc => 
                    acc.Gmail && acc.Gmail.toLowerCase() === email.toLowerCase() &&
                    acc.Password && acc.Password === password
                );

                if (!found) {
                    errorEl.textContent = '❌ Gmail atau Password salah!';
                    loginBtn.disabled = false;
                    return;
                }

                // ✅ Generate session token
                const sessionToken = generateSessionToken();
                
                // ✅ Login berhasil → simpan session ke localStorage
                localStorage.setItem('logged_in', 'true');
                localStorage.setItem('session_token', sessionToken);
                localStorage.setItem('session_created', Date.now().toString());
                localStorage.setItem('user_email', found.Gmail);
                localStorage.setItem('user_password', found.Password);
                localStorage.setItem('user_saldo', found.Saldo || '0');
                localStorage.setItem('user_role', found.role || 'user');
                localStorage.setItem('user_qris', found.qris || '');
                localStorage.setItem('user_dana', found.Dana || '');

                // Redirect ke dashboard
                window.location.href = DASHBOARD_URL;

            } catch (err) {
                errorEl.textContent = '❌ Error: ' + err.message;
                loginBtn.disabled = false;
            }
        }

        // ===================== EVENT =====================
        loginBtn.addEventListener('click', handleLogin);

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleLogin();
            }
        });

        // ===================== INIT =====================
        async function init() {
            // Cek apakah sudah login sebelumnya
            const loggedIn = localStorage.getItem('logged_in');
            const sessionToken = localStorage.getItem('session_token');
            
            if (loggedIn === 'true' && sessionToken) {
                window.location.href = DASHBOARD_URL;
                return;
            }

            // Hapus session lama jika ada
            if (loggedIn === 'true' && !sessionToken) {
                localStorage.clear();
            }

            // Ambil data akun dari API (untuk menampilkan status)
            await fetchAccountsFromAPI();
            
            console.log('🔐 Halaman Login siap!');
            console.log('📡 Domain: ' + window.location.hostname);
            console.log('🛡️ API dilindungi oleh Domain & IP Validation');
        }

        init();

        // ===================== ANTI INSPECT =====================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' || 
                (e.ctrlKey && e.shiftKey && ['I', 'C', 'J'].includes(e.key)) ||
                (e.ctrlKey && e.key === 'u')) {
                e.preventDefault();
                return false;
            }
        });
    </script>
</body>
</html>
