<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Saldo - Shine Shop</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: #1a1a1a;
            padding: 35px 30px;
            border-radius: 24px;
            border: 1px solid #00ffaa44;
            box-shadow: 0 0 60px rgba(0, 255, 170, 0.08);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .container h1 {
            color: #00ffaa;
            font-size: 26px;
            margin-bottom: 8px;
        }
        .container .sub {
            color: #888;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .container input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #00ffaa44;
            border-radius: 30px;
            background: #0d0d0d;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
            margin-bottom: 14px;
        }
        .container input:focus {
            border-color: #00ffaa;
            box-shadow: 0 0 20px rgba(0, 255, 170, 0.1);
        }
        .container input::placeholder {
            color: #555;
        }
        .container button {
            width: 100%;
            padding: 14px;
            background: #00ffaa;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 16px;
            color: #0a0a0a;
            cursor: pointer;
            transition: 0.3s;
        }
        .container button:hover {
            background: #00dd99;
            transform: scale(0.97);
        }
        .container .error-msg {
            color: #ff6666;
            font-size: 14px;
            margin-top: 10px;
            min-height: 24px;
        }
        .saldo-box {
            background: #00ffaa12;
            border: 1px solid #00ffaa44;
            border-radius: 20px;
            padding: 20px;
            margin: 15px 0;
        }
        .saldo-box .label {
            color: #888;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .saldo-box .amount {
            font-size: 38px;
            font-weight: 800;
            color: #00ffaa;
            margin: 6px 0;
            text-shadow: 0 0 30px rgba(0, 255, 170, 0.2);
        }
        .saldo-box .gmail {
            color: #aaa;
            font-size: 14px;
        }
        .logout-btn {
            background: #ff4444 !important;
            margin-top: 10px;
        }
        .logout-btn:hover {
            background: #dd3333 !important;
        }
        .hidden {
            display: none !important;
        }
        .footer {
            color: #555;
            font-size: 11px;
            margin-top: 20px;
        }
        .footer span {
            color: #00ffaa;
        }

        /* Payment Cards */
        .payment-card {
            background: #00ffaa08;
            border: 1px solid #00ffaa33;
            border-radius: 16px;
            padding: 16px;
            margin: 12px 0;
            text-align: left;
        }
        .payment-card .acc-gmail {
            color: #00ffaa;
            font-weight: 600;
            font-size: 14px;
        }
        .payment-card .acc-role {
            color: #888;
            font-size: 12px;
        }
        .payment-card .acc-saldo {
            color: #facc15;
            font-weight: 600;
        }
        .payment-card .acc-dana {
            color: #60a5fa;
            font-size: 13px;
        }
        .qr-wrapper {
            background: #fff;
            border-radius: 12px;
            padding: 12px;
            margin: 8px 0;
            display: inline-block;
        }
        .qr-wrapper canvas {
            display: block;
            border-radius: 8px;
        }
        .admin-badge {
            background: #ff4444;
            color: #fff;
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 20px;
            display: inline-block;
            margin-left: 8px;
        }
        .view-all-btn {
            background: #00ffaa22 !important;
            color: #00ffaa !important;
            border: 1px solid #00ffaa44 !important;
            margin-top: 12px !important;
            font-size: 14px !important;
        }
        .view-all-btn:hover {
            background: #00ffaa44 !important;
        }
        .payment-list {
            max-height: 400px;
            overflow-y: auto;
            margin-top: 10px;
        }
        .payment-list::-webkit-scrollbar {
            width: 4px;
        }
        .payment-list::-webkit-scrollbar-thumb {
            background: #00ffaa66;
            border-radius: 10px;
        }
        .crc16-box {
            background: #0d0d0d;
            padding: 10px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 11px;
            color: #888;
            word-break: break-all;
            margin-top: 6px;
            border: 1px solid #00ffaa22;
        }
        .crc16-box .label {
            color: #00ffaa;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<!-- LOGIN CONTAINER -->
<div class="container" id="loginContainer">
    <h1>🔐 Check Saldo</h1>
    <div class="sub">Masukkan Gmail & Password untuk melihat saldo</div>
    
    <input type="email" id="loginGmail" placeholder="Gmail" autocomplete="email">
    <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
    
    <button id="loginBtn">✅ Login</button>
    <div class="error-msg" id="loginError"></div>
    
    <div class="footer">© <span>Shine Shop</span> · 2025</div>
</div>

<!-- DASHBOARD CONTAINER -->
<div class="container hidden" id="dashboardContainer">
    <h1>💰 Saldo dari komisi Anda</h1>
    <div class="sub" id="dashboardGmail">-</div>
    
    <div class="saldo-box">
        <div class="label">Total Saldo</div>
        <div class="amount" id="dashboardSaldo">Rp 0</div>
    </div>

    <!-- Tombol Lihat Semua Payment (hanya untuk admin) -->
    <button class="view-all-btn hidden" id="viewAllPaymentsBtn">
        📊 Lihat Semua Payment & QRIS
    </button>
    
    <!-- List Payment (hidden default) -->
    <div id="paymentListContainer" class="hidden" style="margin-top:15px;">
        <div class="payment-list" id="paymentList"></div>
    </div>

    <!-- QRIS & Dana untuk user biasa -->
    <div id="userPaymentInfo" class="hidden" style="margin-top:15px;">
        <div class="payment-card">
            <div class="acc-gmail">📱 QRIS Payment</div>
            <div id="userQrWrapper" class="qr-wrapper">
                <canvas id="userQrCanvas" width="180" height="180"></canvas>
            </div>
            <div class="crc16-box">
                <div class="label">🔑 QRIS String (CRC16)</div>
                <div id="userQrData" style="font-size:10px;color:#666;word-break:break-all;">-</div>
            </div>
            <div class="acc-dana" style="margin-top:8px;">💳 Dana: <span id="userDana">-</span></div>
        </div>
    </div>
    
    <button class="logout-btn" id="logoutBtn">🚪 Logout</button>
    <div class="footer">© <span>Shine Shop</span> · 2025</div>
</div>

<script>
    // ===================== DOM =====================
    const loginContainer = document.getElementById('loginContainer');
    const dashboardContainer = document.getElementById('dashboardContainer');
    const loginGmail = document.getElementById('loginGmail');
    const loginPassword = document.getElementById('loginPassword');
    const loginBtn = document.getElementById('loginBtn');
    const loginError = document.getElementById('loginError');
    const dashboardGmail = document.getElementById('dashboardGmail');
    const dashboardSaldo = document.getElementById('dashboardSaldo');
    const logoutBtn = document.getElementById('logoutBtn');
    const viewAllPaymentsBtn = document.getElementById('viewAllPaymentsBtn');
    const paymentListContainer = document.getElementById('paymentListContainer');
    const paymentList = document.getElementById('paymentList');
    const userPaymentInfo = document.getElementById('userPaymentInfo');
    const userQrCanvas = document.getElementById('userQrCanvas');
    const userQrData = document.getElementById('userQrData');
    const userDana = document.getElementById('userDana');

    const API_URL = '/api/saldo.php';

    let currentUser = null;
    let allPaymentsData = [];

    // ===================== CHECK SESSION =====================
    function checkSession() {
        const savedGmail = localStorage.getItem('saldo_gmail');
        const savedData = localStorage.getItem('saldo_data');
        
        if (savedGmail && savedData) {
            try {
                const data = JSON.parse(savedData);
                currentUser = data;
                showDashboard(savedGmail, data.Saldo, data.Role, data.qr_data, data.dana);
                return true;
            } catch (e) {
                localStorage.removeItem('saldo_gmail');
                localStorage.removeItem('saldo_data');
                return false;
            }
        }
        return false;
    }

    // ===================== GENERATE QR =====================
    function generateQR(canvasId, data) {
        if (!data) return;
        QRCode.toCanvas(document.getElementById(canvasId), data, { width: 180 }, function(err) {
            if (err) console.error('QR Error:', err);
        });
    }

    // ===================== SHOW DASHBOARD =====================
    function showDashboard(gmail, saldo, role, qrData, dana) {
        loginContainer.classList.add('hidden');
        dashboardContainer.classList.remove('hidden');
        dashboardGmail.textContent = '📧 ' + gmail;
        
        const numericSaldo = parseInt(saldo) || 0;
        dashboardSaldo.textContent = 'Rp ' + numericSaldo.toLocaleString('id-ID');

        // Admin check
        if (role === 'admin') {
            viewAllPaymentsBtn.classList.remove('hidden');
            viewAllPaymentsBtn.textContent = '📊 Lihat Semua Payment & QRIS';
            // Auto load all payments
            loadAllPayments(gmail);
        } else {
            viewAllPaymentsBtn.classList.add('hidden');
            // Tampilkan QRIS & Dana user biasa
            if (qrData || dana) {
                userPaymentInfo.classList.remove('hidden');
                if (qrData) {
                    generateQR('userQrCanvas', qrData);
                    userQrData.textContent = qrData;
                }
                userDana.textContent = dana || 'Tidak tersedia';
            } else {
                userPaymentInfo.classList.add('hidden');
            }
        }
    }

    // ===================== LOAD ALL PAYMENTS (ADMIN) =====================
    async function loadAllPayments(gmail) {
        try {
            const response = await fetch(`${API_URL}?action=all_payments&gmail=${encodeURIComponent(gmail)}`);
            const result = await response.json();
            
            if (result.status === 'success') {
                allPaymentsData = result.data;
                renderAllPayments(allPaymentsData);
            } else {
                console.error('Failed to load payments:', result.message);
            }
        } catch (error) {
            console.error('Error loading payments:', error);
        }
    }

    // ===================== RENDER ALL PAYMENTS =====================
    function renderAllPayments(data) {
        paymentList.innerHTML = '';
        
        data.forEach((acc, index) => {
            const card = document.createElement('div');
            card.className = 'payment-card';
            
            const roleBadge = acc.Role === 'admin' ? '<span class="admin-badge">👑 ADMIN</span>' : '';
            const saldoFormatted = parseInt(acc.Saldo || 0).toLocaleString('id-ID');
            
            // QRIS preview
            let qrHtml = '';
            if (acc.qr_data) {
                const canvasId = 'qr_canvas_' + index;
                qrHtml = `
                    <div class="qr-wrapper">
                        <canvas id="${canvasId}" width="140" height="140"></canvas>
                    </div>
                    <div class="crc16-box">
                        <div class="label">🔑 QRIS CRC16</div>
                        <div style="font-size:9px;color:#666;word-break:break-all;">${acc.qr_data}</div>
                    </div>
                `;
                // Generate QR after render
                setTimeout(() => {
                    generateQR(canvasId, acc.qr_data);
                }, 100);
            } else {
                qrHtml = '<div style="color:#666;font-size:12px;">❌ Tidak ada QRIS</div>';
            }
            
            card.innerHTML = `
                <div class="acc-gmail">📧 ${acc.Gmail} ${roleBadge}</div>
                <div class="acc-saldo">💰 Rp ${saldoFormatted}</div>
                <div class="acc-dana">💳 Dana: ${acc.dana || 'Tidak tersedia'}</div>
                <div style="margin-top:8px;">${qrHtml}</div>
            `;
            
            paymentList.appendChild(card);
        });
        
        paymentListContainer.classList.remove('hidden');
    }

    // ===================== TOGGLE PAYMENT LIST =====================
    viewAllPaymentsBtn.addEventListener('click', function() {
        if (paymentListContainer.classList.contains('hidden')) {
            paymentListContainer.classList.remove('hidden');
            this.textContent = '📊 Sembunyikan Payment & QRIS';
        } else {
            paymentListContainer.classList.add('hidden');
            this.textContent = '📊 Lihat Semua Payment & QRIS';
        }
    });

    // ===================== LOGIN =====================
    async function handleLogin() {
        const gmail = loginGmail.value.trim();
        const password = loginPassword.value.trim();

        if (!gmail || !password) {
            loginError.textContent = '❌ Gmail dan password wajib diisi!';
            return;
        }

        loginError.textContent = '⏳ Memproses...';
        loginBtn.disabled = true;

        try {
            const response = await fetch(`${API_URL}?action=login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ gmail, password })
            });

            const result = await response.json();

            if (result.status === 'success') {
                // Simpan session
                localStorage.setItem('saldo_gmail', result.data.Gmail);
                localStorage.setItem('saldo_data', JSON.stringify({
                    Saldo: result.data.Saldo,
                    Role: result.data.Role || 'user',
                    qr_data: result.data.qr_data || null,
                    dana: result.data.dana || null
                }));
                
                currentUser = result.data;
                showDashboard(result.data.Gmail, result.data.Saldo, result.data.Role, result.data.qr_data, result.data.dana);
                loginError.textContent = '';
                
                Swal.fire({
                    icon: 'success',
                    title: 'Login Berhasil!',
                    text: `Saldo: Rp ${parseInt(result.data.Saldo).toLocaleString('id-ID')}`,
                    timer: 1500,
                    showConfirmButton: false
                });
            } else {
                loginError.textContent = '❌ ' + result.message;
                Swal.fire({
                    icon: 'error',
                    title: 'Login Gagal',
                    text: result.message
                });
            }
        } catch (error) {
            loginError.textContent = '❌ Gagal terhubung ke server!';
            console.error('Login error:', error);
        }

        loginBtn.disabled = false;
    }

    // ===================== LOGOUT =====================
    function handleLogout() {
        localStorage.removeItem('saldo_gmail');
        localStorage.removeItem('saldo_data');
        currentUser = null;
        allPaymentsData = [];
        
        dashboardContainer.classList.add('hidden');
        paymentListContainer.classList.add('hidden');
        userPaymentInfo.classList.add('hidden');
        loginContainer.classList.remove('hidden');
        loginGmail.value = '';
        loginPassword.value = '';
        loginError.textContent = '';
        
        Swal.fire({
            icon: 'info',
            title: 'Logout Berhasil',
            timer: 1000,
            showConfirmButton: false
        });
    }

    // ===================== EVENT LISTENERS =====================
    loginBtn.addEventListener('click', handleLogin);
    logoutBtn.addEventListener('click', handleLogout);

    loginPassword.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') handleLogin();
    });
    loginGmail.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') handleLogin();
    });

    // ===================== STARTUP =====================
    if (!checkSession()) {
        loginContainer.classList.remove('hidden');
        dashboardContainer.classList.add('hidden');
    }
</script>
</body>
</html>
