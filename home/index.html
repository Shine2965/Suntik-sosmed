<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Shine Shop - Natal Spesial</title>
  <style>
    :root{
      --accent:#e11d48;
      --green:#16a34a;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Poppins',sans-serif;
      background:linear-gradient(135deg,#14532d 0%,#7f1d1d 100%);
      color:#f8fafc;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
      padding:24px;
    }
    .snowflake{
      position:fixed;top:-10px;color:white;opacity:0.9;
      animation:fall linear infinite;
      pointer-events:none;
    }
    @keyframes fall{
      0%{transform:translateY(0) rotate(0deg);}
      100%{transform:translateY(100vh) rotate(360deg);}
    }
    .container{
      width:100%;
      max-width:600px;
      background:rgba(255,255,255,0.08);
      border-radius:16px;
      padding:28px;
      box-shadow:0 0 25px rgba(255,255,255,0.2);
      text-align:center;
      position:relative;
      z-index:2;
    }
    .logo{
      width:120px;
      margin:0 auto 16px;
      display:block;
      filter:drop-shadow(0 0 8px #fff);
    }
    h1{
      font-size:24px;
      text-shadow:0 0 10px #e11d48,0 0 20px #16a34a;
      margin-bottom:18px;
    }
    nav{display:flex;flex-direction:column;gap:10px}
    .nav-btn{
      background:linear-gradient(135deg,#e11d48,#16a34a);
      color:white;border:none;padding:10px;
      border-radius:10px;font-size:16px;
      cursor:pointer;transition:transform .2s,box-shadow .3s;
    }
    .nav-btn:hover{
      transform:scale(1.03);
      box-shadow:0 0 10px #f87171,0 0 15px #4ade80;
    }
    .login-admin{
      margin-top:10px;
      background:linear-gradient(135deg,#16a34a,#22c55e);
      border:none;color:white;padding:10px 18px;
      border-radius:10px;cursor:pointer;font-weight:bold;
    }
    .playlist{
      margin-top:25px;
      background:rgba(255,255,255,0.08);
      border-radius:10px;
      padding:10px;text-align:left;
      box-shadow:inset 0 0 15px rgba(255,255,255,0.1);
    }
    .playlist h3{text-align:center;color:#ffe4e6;font-size:18px;margin-bottom:10px;}
    .song{padding:10px;border-radius:8px;margin:5px 0;cursor:pointer;transition:background 0.3s;}
    .song:hover{background:rgba(255,255,255,0.1);}
    .song.active{background:linear-gradient(90deg,#e11d48,#16a34a);color:white;font-weight:bold;}
    .music-controls{
      margin-top:15px;
      display:flex;
      justify-content:center;
      gap:10px;
      flex-wrap:wrap;
    }
    .music-btn{
      background:#334155;
      color:white;border:none;
      padding:8px 14px;border-radius:8px;
      cursor:pointer;transition:background 0.3s ease;
    }
    .music-btn:hover{background:#475569;}
    .music-btn.active{
      background:linear-gradient(135deg,#e11d48,#16a34a);
      box-shadow:0 0 10px rgba(255,255,255,0.4);
    }
    .song-notif{
      position:fixed;bottom:20px;right:20px;
      background:rgba(15,23,42,0.9);
      color:white;padding:10px 18px;border-radius:10px;
      font-size:14px;box-shadow:0 0 15px rgba(255,255,255,0.2);
      opacity:0;transform:translateY(20px);
      transition:all 0.5s ease;z-index:100;
    }
    .song-notif.show{opacity:1;transform:translateY(0);}
    .popup{
      position:fixed;top:0;left:0;width:100%;height:100%;
      display:none;justify-content:center;align-items:center;
      background:rgba(0,0,0,0.6);z-index:10;
    }
    .popup-content{
      background:#1e293b;padding:25px;border-radius:12px;
      text-align:center;box-shadow:0 0 25px rgba(0,0,0,0.5);
    }
    .popup-content input{
      width:100%;margin:8px 0;padding:8px;
      border-radius:6px;border:none;background:#334155;color:white;
    }
    .btn-submit{
      margin-top:10px;
      background:linear-gradient(135deg,#0ea5e9,#6366f1);
      border:none;padding:8px 18px;border-radius:8px;
      color:white;cursor:pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="logo.png" alt="Logo Toko" class="logo">
    <h1>🎄 Selamat Natal di Shine Shop 🎅</h1>

    <nav>
      <button class="nav-btn" onclick="window.location.href='/topupgame/'">💎 Top up game</button>
      <button class="nav-btn" onclick="window.location.href='/dashboard/'">🚀 Suntik sosmed</button>
      <button class="nav-btn" onclick="window.location.href='/slot/'">🎰 Slot</button>
      <button class="nav-btn" onclick="window.location.href='/kontaksmm/'">🎧 Customer Service</button>
      <button class="nav-btn" onclick="window.location.href='/informasi/'">🔔 Informasi</button>
      <button class="nav-btn" onclick="window.location.href='/testimoni/'">🌟 Testimoni</button>
    </nav>

    <button class="login-admin" onclick="openLogin()">🔐 Login Admin</button>

    <div class="playlist">
      <h3>🎶 Playlist Natal</h3>
      <div id="playlistContainer"></div>
    </div>

    <div class="music-controls">
      <button class="music-btn" onclick="togglePlay()">⏯️ Play / Pause</button>
      <button class="music-btn" onclick="nextSong()">⏭️ Next</button>
      <button id="loopBtn" class="music-btn" onclick="toggleLoop()">🔁 Loop Lagu</button>
    </div>
  </div>

  <div class="popup" id="loginPopup">
    <div class="popup-content">
      <h2>Login Admin Panel</h2>
      <input type="text" id="username" placeholder="Username"><br>
      <input type="password" id="password" placeholder="Password"><br>
      <button class="btn-submit" onclick="login()">Masuk</button>
    </div>
  </div>

  <div id="songNotif" class="song-notif"></div>

  <script>
    // ❄️ Salju turun
    const snowCount = 50;
    for(let i=0;i<snowCount;i++){
      const s=document.createElement("div");
      s.classList.add("snowflake");
      s.textContent="❄";
      s.style.left=Math.random()*100+"vw";
      s.style.animationDuration=5+Math.random()*10+"s";
      s.style.fontSize=12+Math.random()*14+"px";
      s.style.opacity=Math.random();
      document.body.appendChild(s);
    }

    function openLogin(){document.getElementById('loginPopup').style.display='flex';}
    function login(){
      const user=document.getElementById('username').value.trim();
      const pass=document.getElementById('password').value.trim();
      if(user==="Alvino"&&pass==="Alvino11"){localStorage.setItem("adminName",user);window.location.href="/admin/";}
      else{alert("Username atau password salah!");}
    }

    const playlist=[
      {name:"Jingle Bells - Instrumental",file:"/mp3/jinglebells.mp3"},
      {name:"We Wish You a Merry Christmas",file:"/mp3/wewish.mp3"},
      {name:"Silent Night - Piano",file:"/mp3/silentnight.mp3"},
      {name:"All I Want for Christmas Is You",file:"/mp3/alliwant.mp3"}
    ];

    let currentSong=0;
    const audio=new Audio();
    audio.volume=1;
    let isLooping=false;

    function renderPlaylist(){
      const c=document.getElementById("playlistContainer");
      c.innerHTML="";
      playlist.forEach((song,i)=>{
        const div=document.createElement("div");
        div.classList.add("song");
        div.textContent=song.name;
        if(i===currentSong)div.classList.add("active");
        div.onclick=()=>playSong(i);
        c.appendChild(div);
      });
    }

    function showNotif(text){
      const n=document.getElementById("songNotif");
      n.textContent=text;
      n.classList.add("show");
      setTimeout(()=>n.classList.remove("show"),3000);
    }

    function playSong(i){
      currentSong=i;
      audio.src=playlist[i].file;
      audio.play().then(()=>{
        renderPlaylist();
        showNotif(`🎵 Sekarang memutar: ${playlist[i].name}`);
      }).catch(()=>{
        document.body.addEventListener("click",()=>audio.play(),{once:true});
      });
    }

    function togglePlay(){
      if(audio.paused){audio.play();showNotif(`▶️ Memutar: ${playlist[currentSong].name}`);}
      else{audio.pause();showNotif(`⏸️ Dijeda: ${playlist[currentSong].name}`);}
    }

    function nextSong(){
      if(isLooping){audio.currentTime=0;audio.play();return;}
      currentSong=(currentSong+1)%playlist.length;
      playSong(currentSong);
    }

    function toggleLoop(){
      isLooping=!isLooping;
      document.getElementById("loopBtn").classList.toggle("active",isLooping);
      audio.loop=isLooping;
      showNotif(isLooping?"🔁 Loop aktif: lagu diulang":"⏹️ Loop dimatikan");
    }

    audio.addEventListener("ended",()=>{if(!isLooping)nextSong();});

    window.addEventListener("load",()=>{
      renderPlaylist();
      playSong(currentSong);
    });
  </script>
</body>
</html>
