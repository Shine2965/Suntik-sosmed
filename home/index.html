<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shine Shop • Imlek 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:
    radial-gradient(circle at top left,#ffd70033,transparent 40%),
    radial-gradient(circle at bottom right,#ff000033,transparent 40%),
    linear-gradient(180deg,#7f1d1d,#991b1b,#450a0a);
  color:white;
  min-height:100vh;
  overflow-x:hidden;
}

/* GOLD PARTICLES */
.particle{
  position:fixed;
  top:-20px;
  color:#ffd700;
  font-size:18px;
  animation:fall linear infinite;
  opacity:.8;
  text-shadow:0 0 10px gold;
}

@keyframes fall{
  to{transform:translateY(110vh)}
}

.container{
  max-width:640px;
  margin:40px auto;
  padding:30px;
  background:rgba(255,0,0,.15);
  backdrop-filter:blur(18px);
  border-radius:26px;
  box-shadow:
    0 0 40px rgba(255,215,0,.6),
    inset 0 0 25px rgba(255,215,0,.3);
  text-align:center;
  border:1px solid rgba(255,215,0,.4);
  animation:fadeUp .7s ease;
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(25px)}
  to{opacity:1;transform:none}
}

h1{
  margin:0 0 12px;
  font-size:28px;
  background:linear-gradient(90deg,#fff5cc,#ffd700,#ffcc00);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  text-shadow:0 0 25px rgba(255,215,0,.8);
}

/* BUTTON */
.nav-btn{
  width:100%;
  margin:10px 0;
  padding:15px;
  border:none;
  border-radius:16px;
  background:linear-gradient(135deg,#b91c1c,#facc15);
  color:white;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  transition:.3s;
  box-shadow:0 8px 25px rgba(0,0,0,.5);
}

.nav-btn:hover{
  transform:translateY(-3px) scale(1.02);
  box-shadow:0 15px 35px rgba(255,215,0,.7);
}

.cs-btn{
  background:linear-gradient(135deg,#dc2626,#fbbf24);
}

/* PLAYLIST */
.playlist{
  margin-top:24px;
  background:rgba(0,0,0,.3);
  padding:18px;
  border-radius:18px;
  max-height:240px;
  overflow-y:auto;
  text-align:left;
  border:1px solid rgba(255,215,0,.3);
}

.playlist h3{
  margin-top:0;
  color:#ffd700;
  text-align:center;
}

.song{
  padding:12px;
  border-bottom:1px solid rgba(255,255,255,.1);
  cursor:pointer;
  border-radius:12px;
  transition:.25s;
}

.song:hover{
  background:rgba(255,215,0,.2);
}

.song.active{
  background:rgba(255,215,0,.4);
  box-shadow:0 0 12px gold;
}

.music-controls{
  margin-top:16px;
  display:flex;
  justify-content:center;
  gap:12px;
}

.music-btn{
  background:#7f1d1d;
  border:1px solid gold;
  color:#ffd700;
  padding:10px 16px;
  border-radius:12px;
  cursor:pointer;
  transition:.3s;
}

.music-btn:hover{
  background:#991b1b;
  box-shadow:0 0 12px gold;
}

/* WATERMARK */
.watermark{
  position:fixed;
  bottom:14px;
  left:50%;
  transform:translateX(-50%);
  font-size:12px;
  color:rgba(255,255,255,.6);
  letter-spacing:1px;
}

/* POPUP */
.popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:999;
}

.popup-content{
  background:#7f1d1d;
  padding:24px;
  border-radius:20px;
  max-width:360px;
  text-align:center;
  box-shadow:0 0 35px gold;
  border:1px solid gold;
}

.popup-content h3{
  color:#ffd700;
}

.popup-content button{
  margin-top:14px;
  padding:10px 18px;
  border:none;
  border-radius:12px;
  background:linear-gradient(135deg,#facc15,#b91c1c);
  color:white;
  cursor:pointer;
  font-weight:600;
}
</style>
</head>

<body>

<div class="popup" id="infoPopup">
  <div class="popup-content">
    <h3>🧧 Informasi Pesanan Imlek</h3>
    <p>Pesanan diproses manual oleh admin.</p>
    <p><b>Maksimal 1x24 jam.</b></p>
    <button onclick="closePopup()">Mengerti</button>
  </div>
</div>

<div class="container">
  <h1>🧧 Shine Shop • Imlek 2026 🧧</h1>

  <button class="nav-btn" onclick="location.href='/dashboard/'">🌟 Telegram</button>
  <button class="nav-btn" onclick="location.href='/testimoni/'">📈 Testimoni</button>
  <button class="nav-btn" onclick="location.href='/ewallet/'">💳 E Wallet</button>
  <button class="nav-btn" onclick="location.href='https://store.shinedomain.my.id'">📰 Informasi</button>
  <button class="nav-btn cs-btn" onclick="location.href='https://t.me/shineshopstore1'">💬 Customer Service</button>

  <div class="playlist">
    <h3>🎶 Playlist Imlek</h3>
    <div id="playlist"></div>
  </div>

  <div class="music-controls">
    <button class="music-btn" onclick="toggleMusic()">⏯ Play / Pause</button>
    <button class="music-btn" onclick="nextSong()">⏭ Next</button>
    <button class="music-btn" onclick="toggleLoop()">🔁 Loop</button>
  </div>
</div>

<div class="watermark">© SHINE SHOP 2026 • Gong Xi Fa Cai 🐉</div>

<script>
/* GOLD PARTICLES */
function particle(){
  const p=document.createElement('div');
  p.className='particle';
  p.textContent='✨';
  p.style.left=Math.random()*100+'vw';
  p.style.animationDuration=4+Math.random()*6+'s';
  document.body.appendChild(p);
  setTimeout(()=>p.remove(),10000);
}
setInterval(particle,250);

/* PLAYLIST */
const songs=[
  {title:"Chinese New Year Instrumental",file:"https://files.catbox.moe/1120of.mp3"}
];

let current=0, loop=false;
const audio=new Audio();
const list=document.getElementById("playlist");

songs.forEach((s,i)=>{
  const d=document.createElement("div");
  d.className="song";
  d.textContent=s.title;
  d.onclick=()=>play(i);
  list.appendChild(d);
});

function play(i){
  current=i;
  document.querySelectorAll('.song').forEach((e,id)=>e.classList.toggle('active',id===current));
  audio.src=songs[current].file;
  audio.play();
}

function toggleMusic(){audio.paused?audio.play():audio.pause();}
function nextSong(){play((current+1)%songs.length);}
function toggleLoop(){loop=!loop;audio.loop=loop;}

function closePopup(){
  document.getElementById("infoPopup").style.display="none";
}
</script>

</body>
</html>
