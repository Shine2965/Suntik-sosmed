<!DOCTYPE html>
<html lang="id">
<head> 
  <meta name="google-adsense-account" content="ca-pub-9912622413153708">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9912622413153708"
     crossorigin="anonymous"></script>
 <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Menu - Top Up & Suntik Sosmed</title>
  <style>
    :root{--bg:#0f172a;--accent:#7c3aed;--muted:#94a3b8}
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter,Segoe UI,system-ui,Arial;
      background:linear-gradient(180deg,#071026 0%, #07193a 100%);
      color:#e6eef8;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px
    }
    .container{
      width:100%;
      max-width:600px;
      background:rgba(255,255,255,0.03);
      border-radius:16px;
      padding:28px;
      box-shadow:0 8px 30px rgba(2,6,23,0.6);
      text-align:center
    }
    .logo{
      width:120px;
      margin:0 auto 16px;
      display:block;
      opacity:0;
      animation:fadeIn 1.2s ease forwards;
    }
    @keyframes fadeIn{
      from{opacity:0; transform:translateY(-15px);}
      to{opacity:1; transform:translateY(0);}
    }
    h1{
      font-size:22px;
      margin-bottom:20px;
      opacity:0;
      animation:fadeSlideIn 0.8s ease forwards;
      animation-delay:0.2s;
    }
    nav{display:flex;flex-direction:column;gap:12px}
    .nav-btn {
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.3s ease;
    }
    .nav-btn:hover {
      transform: translateY(-2px);
      background: linear-gradient(135deg, #0284c7, #4f46e5);
    }
    .login-admin {
      margin-top: 25px;
      background: linear-gradient(135deg, #16a34a, #22c55e);
      border: none;
      color: white;
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
    }
    .login-admin:hover {
      background: linear-gradient(135deg, #15803d, #16a34a);
    }

    /* Popup login */
    .popup {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
    }
    .popup-content {
      background: #1e293b;
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      width: 90%;
      max-width: 360px;
    }
    input {
      width: 90%;
      padding: 8px;
      margin: 8px 0;
      border: none;
      border-radius: 6px;
    }
    .btn-submit {
      background: #4f46e5;
      color: white;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-submit:hover {
      background: #4338ca;
    }

    /* Kontrol musik */
    .music-controls {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 10px;
    }
    .music-btn {
      background: #334155;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
    }
    .music-btn:hover {
      background: #475569;
    }
  </style>
</head>
<body>
  <script>
  // 🔧 Toggle Maintenance ON/OFF
  const isMaintenance = false; // ubah ke true jika mau matikan website
  if (isMaintenance) {
    window.location.href = "/maintenance/";
  }
  </script>

  <div class="container">
    <img src="logo.png" alt="Logo Toko" class="logo">
    <h1>Navigasi</h1>
    <nav>
      <button class="nav-btn" onclick="window.location.href='/topupgame/'">💎 Top up game</button>
      <button class="nav-btn" onclick="window.location.href='/dashboard/'">🚀 Suntik sosmed</button>
      <button class="nav-btn" onclick="window.location.href='/slot/'">🎰 Slot</button>
      <button class="nav-btn" onclick="window.location.href='/kontaksmm/'">🎧 Customer Service</button>
      <button class="nav-btn" onclick="window.location.href='/informasi/'">🔔 Informasi</button>
      <button class="nav-btn" onclick="window.location.href='/testimoni/'">🌟 Testimoni</button>
    </nav>

    <div class="music-controls">
      <button class="music-btn" onclick="toggleMusic()">⏯️ Play / Pause lagu</button>
      <button class="music-btn" onclick="nextSong()">⏭️ Next lagu</button>
    </div>

    <button class="login-admin" onclick="openLogin()">🔐 Login Admin</button>
  </div>

  <!-- Popup login -->
  <div class="popup" id="loginPopup">
    <div class="popup-content">
      <h2>Login Admin Panel</h2>
      <input type="text" id="username" placeholder="Username"><br>
      <input type="password" id="password" placeholder="Password"><br>
      <button class="btn-submit" onclick="login()">Masuk</button>
    </div>
  </div>

  <script>
    function openLogin() {
      document.getElementById('loginPopup').style.display = 'flex';
    }

    function login() {
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();
      const adminUser = "Alvino";
      const adminPass = "Alvino11";

      if (user === adminUser && pass === adminPass) {
        localStorage.setItem("adminName", user);
        window.location.href = "/admin/";
      } else {
        alert("Username atau password salah!");
      }
    }

    // 🎵 Pemutar musik otomatis
    const playlist = [
      "/mp3/once again.mp3",
      "/mp3/not you.mp3"
      
    ];
    let currentSong = Math.floor(Math.random() * playlist.length);
    const audio = new Audio(playlist[currentSong]);
    audio.volume = 0.8;
    audio.autoplay = true;
    audio.loop = true;

    audio.addEventListener("ended", nextSong);
    window.addEventListener("load", () => {
      audio.play().catch(() => console.log("Autoplay diblokir oleh browser"));
    });

    function toggleMusic() {
      if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
    }

    function nextSong() {
      currentSong = (currentSong + 1) % playlist.length;
      audio.src = playlist[currentSong];
      audio.play();
    }
  </script>
</body>
  </html>
