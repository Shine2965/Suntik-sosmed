<!DOCTYPE html>
<html lang="id">
<head>
  <meta name="google-adsense-account" content="ca-pub-9912622413153708">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9912622413153708"
     crossorigin="anonymous"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Shine Shop - Top Up & Suntik Sosmed</title>
  <style>
    :root{--bg:#0f172a;--accent:#6366f1;--muted:#94a3b8}
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter,Segoe UI,system-ui,Arial;
      background:linear-gradient(180deg,#071026 0%, #07193a 100%);
      color:#e6eef8;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }
    .container{
      width:100%;
      max-width:600px;
      background:rgba(255,255,255,0.03);
      border-radius:16px;
      padding:28px;
      box-shadow:0 8px 30px rgba(2,6,23,0.6);
      text-align:center;
    }
    .logo{
      width:120px;
      margin:0 auto 16px;
      display:block;
      opacity:0;
      animation:fadeIn 1.2s ease forwards;
    }
    @keyframes fadeIn{
      from{opacity:0; transform:translateY(-15px);}
      to{opacity:1; transform:translateY(0);}
    }
    h1{
      font-size:22px;
      margin-bottom:20px;
      opacity:0;
      animation:fadeSlideIn 0.8s ease forwards;
      animation-delay:0.2s;
    }
    nav{display:flex;flex-direction:column;gap:12px}
    .nav-btn {
      background: linear-gradient(135deg, #0ea5e9, var(--accent));
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.3s ease;
    }
    .nav-btn:hover {
      transform: translateY(-2px);
      background: linear-gradient(135deg, #0284c7, #4f46e5);
    }
    .login-admin {
      margin-top: 10px;
      background: linear-gradient(135deg, #16a34a, #22c55e);
      border: none;
      color: white;
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
    }
    .login-admin:hover {
      background: linear-gradient(135deg, #15803d, #16a34a);
    }

    .playlist {
      margin-top: 25px;
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
      padding: 10px;
      text-align: left;
    }
    .playlist h3 {
      text-align: center;
      color: #cbd5e1;
      font-size: 18px;
      margin-bottom: 10px;
    }
    .song {
      padding: 10px;
      border-radius: 8px;
      margin: 5px 0;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .song:hover {background: rgba(255,255,255,0.1);}
    .song.active {
      background: linear-gradient(90deg, var(--accent), #0ea5e9);
      color: white;
      font-weight: bold;
    }

    .music-controls {
      margin-top: 15px;
      display: flex;
      justify-content: center;
      gap: 10px;
    }
    .music-btn {
      background: #334155;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .music-btn:hover {background: #475569;}

    .song-notif {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(15,23,42,0.9);
      color: white;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 14px;
      box-shadow: 0 0 15px rgba(0,0,0,0.3);
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.5s ease;
      z-index: 100;
    }
    .song-notif.show {
      opacity: 1;
      transform: translateY(0);
    }
    .popup {
      position: fixed;
      top: 0;left: 0;width: 100%;height: 100%;
      display: none;
      justify-content: center;
      align-items: center;
      background: rgba(0,0,0,0.6);
    }
    .popup-content {
      background: #1e293b;
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 0 25px rgba(0,0,0,0.5);
    }
    .popup-content input {
      width: 100%;
      margin: 8px 0;
      padding: 8px;
      border-radius: 6px;
      border: none;
      background: #334155;
      color: white;
    }
    .btn-submit {
      margin-top: 10px;
      background: linear-gradient(135deg,#0ea5e9,#6366f1);
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      color: white;
      cursor: pointer;
    }
    .btn-submit:hover {background: linear-gradient(135deg,#0284c7,#4f46e5);}
  </style>
</head>
<body>
  <div class="container">
    <img src="logo.png" alt="Logo Toko" class="logo">
    <h1>Navigasi</h1>

    <nav>
      <button class="nav-btn" onclick="window.location.href='/topupgame/'">💎 Top up game</button>
      <button class="nav-btn" onclick="window.location.href='/dashboard/'">🚀 Suntik sosmed</button>
      <button class="nav-btn" onclick="window.location.href='/slot/'">🎰 Slot</button>
      <button class="nav-btn" onclick="window.location.href='/kontaksmm/'">🎧 Customer Service</button>
      <button class="nav-btn" onclick="window.location.href='/informasi/'">🔔 Informasi</button>
      <button class="nav-btn" onclick="window.location.href='/testimoni/'">🌟 Testimoni</button>
    </nav>

    <button class="login-admin" onclick="openLogin()">🔐 Login Admin</button>

    <div class="playlist">
      <h3>🎶 Playlist Lagu</h3>
      <div id="playlistContainer"></div>
    </div>

    <div class="music-controls">
      <button class="music-btn" onclick="togglePlay()">⏯️ Play / Pause lagu</button>
      <button class="music-btn" onclick="nextSong()">⏭️ Next lagu</button>
    </div>
  </div>

  <div class="popup" id="loginPopup">
    <div class="popup-content">
      <h2>Login Admin Panel</h2>
      <input type="text" id="username" placeholder="Username"><br>
      <input type="password" id="password" placeholder="Password"><br>
      <button class="btn-submit" onclick="login()">Masuk</button>
    </div>
  </div>

  <div id="songNotif" class="song-notif"></div>

  <script>
    function openLogin(){document.getElementById('loginPopup').style.display='flex';}
    function login(){
      const user=document.getElementById('username').value.trim();
      const pass=document.getElementById('password').value.trim();
      if(user==="Alvino"&&pass==="Alvino11"){localStorage.setItem("adminName",user);window.location.href="/admin/";}
      else{alert("Username atau password salah!");}
    }

    // 🎧 Playlist musik
    const playlist=[
      {name:"Once Again - Kim Min Seung",file:"/mp3/once again.mp3"},
      {name:"Not You - Alan Walker",file:"/mp3/Not You.mp3"}, 
      {name:"Selalu Ada Di Nadimu - JUMBO",file: "/mp3/Selalu Ada Di Nadimu JUMBO.mp3" }
    ];

    let currentSong=0;
    const audio=new Audio();
    audio.volume=1;

    function renderPlaylist(){
      const container=document.getElementById("playlistContainer");
      container.innerHTML="";
      playlist.forEach((song,index)=>{
        const div=document.createElement("div");
        div.classList.add("song");
        div.textContent=song.name;
        if(index===currentSong)div.classList.add("active");
        div.onclick=()=>playSong(index);
        container.appendChild(div);
      });
    }

    function showNotif(text){
      const notif=document.getElementById("songNotif");
      notif.textContent=text;
      notif.classList.add("show");
      setTimeout(()=>notif.classList.remove("show"),3000);
    }

    function playSong(index){
      currentSong=index;
      audio.src=playlist[index].file;
      audio.play().then(()=>{
        renderPlaylist();
        showNotif(`🎵 Sekarang memutar: ${playlist[index].name}`);
      }).catch(()=>{
        // jika autoplay ditolak, tunggu interaksi pengguna
        document.body.addEventListener("click",()=>audio.play(),{once:true});
      });
    }

    function togglePlay(){
      if(audio.paused){audio.play();showNotif(`▶️ Memutar: ${playlist[currentSong].name}`);}
      else{audio.pause();showNotif(`⏸️ Dijeda: ${playlist[currentSong].name}`);}
    }

    function nextSong(){
      currentSong=(currentSong+1)%playlist.length;
      playSong(currentSong);
    }

    audio.addEventListener("ended",nextSong);

    window.addEventListener("load",()=>{
      renderPlaylist();
      // coba autoplay
      playSong(currentSong);
    });
  </script>
</body>
</html>
