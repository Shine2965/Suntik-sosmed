<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shine Shop - Christmas Edition</title>

  <style>
    body {
      margin: 0;
      font-family: Poppins, sans-serif;
      background: linear-gradient(180deg, #0b1c2c, #042f1a);
      color: white;
      overflow-x: hidden;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
      text-align: center;
      background: rgba(255,255,255,0.08);
      border-radius: 20px;
      margin-top: 40px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }

    .nav-btn {
      padding: 10px 20px;
      border: none;
      margin: 6px 0;
      border-radius: 10px;
      background: linear-gradient(135deg, #22c55e, #ef4444);
      color: white;
      cursor: pointer;
      width: 100%;
      font-size: 15px;
    }

    .login-admin {
      margin-top: 20px;
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      background: #22c55e;
      color: white;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }

    .playlist {
      margin-top: 20px;
      background: rgba(255,255,255,0.1);
      padding: 15px;
      border-radius: 12px;
      max-height: 200px;
      overflow-y: auto;
      text-align: left;
    }
    .song {
      padding: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      cursor: pointer;
    }
    .song:hover { background: rgba(255,255,255,0.15);}
    .song.active { background: rgba(34,197,94,0.4); }

    .music-controls {
      margin-top: 15px;
      display: flex;
      justify-content: center;
      gap: 10px;
    }
    .music-btn {
      background: #334155;
      border: none;
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    .popup {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.6);
    }
    .popup-content {
      background: #1e293b;
      padding: 20px;
      width: 90%; 
      max-width: 360px;
      border-radius: 10px;
      text-align: center;
    }
    input {
      width: 90%;
      padding: 8px;
      margin: 8px 0;
      border: none;
      border-radius: 6px;
    }
    .btn-submit {
      background: #22c55e;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
    }
    .btn-submit[disabled] {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .btn-close {
      background: #ef4444;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      color: white;
      margin-left: 10px;
      cursor: pointer;
    }

    .snowflake {
      position: fixed;
      top: 0;
      color: #fff;
      font-size: 1.2em;
      user-select: none;
      animation: fall linear infinite;
      pointer-events: none;
    }
    @keyframes fall {
      0% { transform: translateY(0); }
      100% { transform: translateY(100vh); }
    }

    #notif {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(34,197,94,0.9);
      color: white;
      padding: 12px 16px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      display: none;
      animation: fadeInOut 4s ease;
    }
    @keyframes fadeInOut {
      0% {opacity:0; transform:translateY(20px);}
      10%,90% {opacity:1; transform:translateY(0);}
      100% {opacity:0; transform:translateY(20px);}
    }
  </style>
</head>

<body>

<div class="container">
  <h1>🎄 Menu Natal Shine Shop 🎁</h1>

  <button class="nav-btn" onclick="location.href='/dashboard/'">🚀 Suntik Sosmed & Top Up Game</button>
  <button class="nav-btn" onclick="location.href='/kontaksmm/'">🎧 Customer Service</button>
  <button class="nav-btn" onclick="location.href='/informasi/'">🔔 Informasi</button>
  <button class="nav-btn" onclick="location.href='/testimoni/'">🌟 Testimoni</button>

  <button class="login-admin" onclick="openLogin()">🔐 Login Admin</button>

  <div class="playlist">
    <h3>🎶 Playlist Natal</h3>
    <div id="playlist"></div>
  </div>

  <div class="music-controls">
    <button class="music-btn" onclick="toggleMusic()">⏯️ Play/Pause</button>
    <button class="music-btn" onclick="nextSong()">⏭️ Next</button>
    <button class="music-btn" onclick="toggleLoop()">🔁 Loop</button>
  </div>
</div>

<div id="notif"></div>

<div class="popup" id="loginPopup" aria-hidden="true">
  <div class="popup-content">
    <h2>Login Admin Panel</h2>
    <input type="text" id="username" placeholder="Username" autocomplete="off">
    <input type="password" id="password" placeholder="Password" autocomplete="off">
    <div style="display:flex;justify-content:center;gap:8px;margin-top:8px;">
      <button id="btnLogin" class="btn-submit" onclick="login()" disabled>Masuk</button>
      <button class="btn-close" onclick="closeLogin()">Tutup</button>
    </div>
    <p id="loginMsg" style="margin-top:8px;color:#fca5a5;display:none;"></p>
  </div>
</div>

<script>
/* ❄️ SALJU ❄️ */
function createSnowflakes(){
  for(let i=0;i<10;i++){
    const s=document.createElement('div');
    s.textContent='❄️';
    s.classList.add('snowflake');
    s.style.left=Math.random()*100+'vw';
    s.style.animationDuration=5+Math.random()*5+'s';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),10000);
  }
}
setInterval(createSnowflakes,3000);

/* 🎵 PLAYLIST 🎵 */
const songs = [
  {title:"Jingle Bells - Lagu Natal", file:"/mp3/JingleBells.mp3"},
  {title:"Dari Pulau Dan Benua - Lagu Natal", file:"/mp3/DariPulauDanBenuanatal.mp3"}
];

let current = 0;
let loopMode = false;
const audio = new Audio();
const playlistEl = document.getElementById("playlist");

songs.forEach((s, i) => {
  const div = document.createElement("div");
  div.className = "song";
  div.textContent = s.title;
  div.onclick = () => playSong(i);
  playlistEl.appendChild(div);
});

function playSong(i){
  current = i;
  document.querySelectorAll('.song').forEach((e,id)=>e.classList.toggle('active', id===current));
  audio.src = songs[current].file;
  audio.play().catch(()=> {
    // autoplay mungkin diblokir, tapi tidak fatal
    showNotif("Autoplay diblokir — klik Play untuk memulai.");
  });
  showNotif("▶️ Memutar: " + songs[current].title);
}

function toggleMusic(){
  if (!audio.src) {
    playSong(current);
    return;
  }
  if (audio.paused) {
    audio.play().catch(()=> showNotif("Autoplay diblokir — klik Play untuk memulai."));
    showNotif("🎵 Musik Diputar");
  } else {
    audio.pause();
    showNotif("⏸️ Musik Dijeda");
  }
}
function nextSong(){ current = (current + 1) % songs.length; playSong(current); }
function toggleLoop(){ loopMode = !loopMode; audio.loop = loopMode; showNotif(loopMode ? "🔁 Mode Loop Aktif" : "➡️ Mode Loop Nonaktif"); }

audio.addEventListener("ended", () => {
  if (!audio.loop) nextSong();
});

/* Notifikasi kecil */
function showNotif(text){
  const n = document.getElementById('notif');
  n.textContent = text;
  n.style.display = 'block';
  // restart animation by reflow
  n.style.animation = 'none';
  void n.offsetWidth;
  n.style.animation = '';
  setTimeout(()=> n.style.display = 'none', 3500);
}

/* LOGIN (multi-admin from /home/data.json) */
let adminData = [];
let dataLoaded = false;
const btnLogin = document.getElementById("btnLogin");
const loginMsg = document.getElementById("loginMsg");

// Load data.json from /home/data.json
fetch("/home/data.json")
  .then(res => {
    if (!res.ok) throw new Error("HTTP status " + res.status);
    return res.json();
  })
  .then(data => {
    // Expect { "admins": [...] } or a single admin object fallback
    if (Array.isArray(data.admins)) {
      adminData = data.admins;
    } else if (Array.isArray(data)) {
      adminData = data;
    } else if (data && data.admins === undefined && data.username) {
      // legacy single-admin saved as object
      adminData = [data];
    } else {
      adminData = [];
    }
    dataLoaded = true;
    btnLogin.disabled = false;
    loginMsg.style.display = 'none';
  })
  .catch(err => {
    console.error("Gagal memuat /home/data.json", err);
    loginMsg.textContent = "Gagal memuat data admin.";
    loginMsg.style.display = "block";
    // keep button disabled
    btnLogin.disabled = true;
  });

// UI open/close login
function openLogin(){
  document.getElementById("loginPopup").style.display = "flex";
  document.getElementById("loginPopup").setAttribute("aria-hidden", "false");
}
function closeLogin(){
  document.getElementById("loginPopup").style.display = "none";
  document.getElementById("loginPopup").setAttribute("aria-hidden", "true");
  document.getElementById('username').value = '';
  document.getElementById('password').value = '';
}

// Login handler
function login(){
  if (!dataLoaded) {
    showNotif("Tunggu, data admin masih dimuat...");
    return;
  }

  const user = document.getElementById('username').value.trim();
  const pass = document.getElementById('password').value.trim();

  if (!user || !pass) {
    showNotif("Isi username & password.");
    return;
  }

  const admin = adminData.find(a => a.username === user && a.password === pass);

  if (admin) {
    // simpan username ke localStorage agar dashboard bisa baca
    try { localStorage.setItem("adminUsername", admin.username); } catch(e){/*ignore*/}

    showNotif("Login berhasil! Saldo: " + admin.saldo);
    // redirect ke dashboard (tunggu 600ms agar notif terlihat)
    setTimeout(()=> window.location.href = "/admin/", 600);
  } else {
    showNotif("❌ Username atau password salah!");
  }
}
</script>

</body>
</html>
