<!-- File: index.html (Shine Shop Christmas Edition - Fixed Autoplay & Loop) -->
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shine Shop - Christmas Edition</title>
<style>
  :root {
    --bg: linear-gradient(180deg, #0b1c2c, #042f1a);
    --accent: #22c55e;
    --red: #ef4444;
    --white: #ffffff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: var(--bg);
    color: var(--white);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow-x: hidden;
  }

  .container {
    width: 100%;
    max-width: 600px;
    background: rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 28px;
    box-shadow: 0 8px 30px rgba(2,6,23,0.6);
    text-align: center;
    position: relative;
  }

  h1 {
    font-size: 24px;
    color: #facc15;
    text-shadow: 0 0 10px #fbbf24;
  }

  nav { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }

  .nav-btn {
    background: linear-gradient(135deg, #22c55e, #ef4444);
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 12px;
    font-size: 16px;
    cursor: pointer;
    transition: transform 0.2s ease;
  }
  .nav-btn:hover { transform: scale(1.05); }

  .login-admin {
    margin-top: 25px;
    background: linear-gradient(135deg, #16a34a, #22c55e);
    border: none;
    color: white;
    padding: 10px 18px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    font-size: 16px;
  }
  .login-admin:hover { background: linear-gradient(135deg, #15803d, #16a34a); }

  /* Popup Login */
  .popup {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
  }
  .popup-content {
    background: #1e293b;
    padding: 25px;
    border-radius: 12px;
    text-align: center;
    width: 90%;
    max-width: 360px;
  }
  input {
    width: 90%;
    padding: 8px;
    margin: 8px 0;
    border: none;
    border-radius: 6px;
  }
  .btn-submit {
    background: #22c55e;
    color: white;
    padding: 8px 16px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 10px;
  }

  /* Playlist Visual */
  .playlist {
    margin-top: 20px;
    background: rgba(255,255,255,0.1);
    padding: 15px;
    border-radius: 12px;
    text-align: left;
    max-height: 200px;
    overflow-y: auto;
  }
  .playlist h3 {
    text-align: center;
    color: #facc15;
    margin-bottom: 10px;
  }
  .song {
    padding: 8px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    cursor: pointer;
    transition: background 0.2s;
  }
  .song:hover { background: rgba(255,255,255,0.2); }
  .song.active { background: rgba(34,197,94,0.4); }

  /* Kontrol musik */
  .music-controls {
    margin-top: 15px;
    display: flex;
    justify-content: center;
    gap: 10px;
  }
  .music-btn {
    background: #334155;
    color: white;
    border: none;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
  }
  .music-btn:hover { background: #475569; }

  /* Notifikasi lagu */
  .notification {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: rgba(34,197,94,0.9);
    color: white;
    padding: 12px 16px;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    display: none;
    animation: fadeInOut 4s ease;
  }
  @keyframes fadeInOut {
    0% { opacity: 0; transform: translateY(20px); }
    10%,90% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(20px); }
  }

  /* Efek Salju */
  .snowflake {
    position: fixed;
    top: 0;
    color: #fff;
    user-select: none;
    z-index: 999;
    font-size: 1.2em;
    animation: fall linear infinite;
  }
  @keyframes fall {
    0% { transform: translateY(0); }
    100% { transform: translateY(100vh); }
  }
</style>
</head>

  <div class="container">
    <h1>🎄 Menu Natal Shine Shop 🎁</h1>

    <nav>
      <button class="nav-btn" onclick="window.location.href='/topupgame/'">💎 Top up Game</button>
      <button class="nav-btn" onclick="window.location.href='/dashboard/'">🚀 Suntik Sosmed</button>
      <button class="nav-btn" onclick="window.location.href='/slot/'">🎰 Slot</button>
      <button class="nav-btn" onclick="window.location.href='/kontaksmm/'">🎧 Customer Service</button>
      <button class="nav-btn" onclick="window.location.href='/informasi/'">🔔 Informasi</button>
      <button class="nav-btn" onclick="window.location.href='/testimoni/'">🌟 Testimoni</button>
    </nav>

    <button class="login-admin" onclick="openLogin()">🔐 Login Admin</button>

    <div class="playlist">
      <h3>🎶 Playlist Natal</h3>
      <div id="playlist"></div>
    </div>

    <div class="music-controls">
      <button class="music-btn" onclick="toggleMusic()">⏯️ Play / Pause</button>
      <button class="music-btn" onclick="nextSong()">⏭️ Next</button>
      <button class="music-btn" onclick="toggleLoop()">🔁 Loop</button>
    </div>
  </div>

  <!-- Popup Login -->
  <div class="popup" id="loginPopup">
    <div class="popup-content">
      <h2>Login Admin Panel</h2>
      <input type="text" id="username" placeholder="Username"><br>
      <input type="password" id="password" placeholder="Password"><br>
      <button class="btn-submit" onclick="login()">Masuk</button>
    </div>
  </div>

  <!-- Notifikasi -->
  <div class="notification" id="notif"></div>

<script>
  // Efek salju
  function createSnowflakes() {
    for (let i = 0; i < 20; i++) {
      const snowflake = document.createElement('div');
      snowflake.textContent = '❄️';
      snowflake.classList.add('snowflake');
      snowflake.style.left = Math.random() * 100 + 'vw';
      snowflake.style.animationDuration = 5 + Math.random() * 5 + 's';
      document.body.appendChild(snowflake);
      setTimeout(() => snowflake.remove(), 10000);
    }
  }
  setInterval(createSnowflakes, 1000);

  // Login
  function openLogin() {
    document.getElementById('loginPopup').style.display = 'flex';
  }

  function login() {
    const user = document.getElementById('username').value.trim();
    const pass = document.getElementById('password').value.trim();
    if (user === "Alvino" && pass === "Alvino11") {
      window.location.href = "/gambling/";
    } else {
      alert("❌ Username atau password salah!");
    }
  }

  // Playlist
  const songs = [
    { title: "Jingle Bells - Lagu Natal", file: "/mp3/JingleBells.mp3" },
    { title: "Dari Pulau Dan Benua - Lagu Natal", file: "/mp3/Dari Pulau Dan Benua natal.mp3" }
      ];

  const playlistDiv = document.getElementById("playlist");
  songs.forEach((song, index) => {
    const div = document.createElement("div");
    div.className = "song";
    div.textContent = song.title;
    div.onclick = () => playSong(index);
    playlistDiv.appendChild(div);
  });

  let current = 0;
  const audio = new Audio();
  audio.volume = 0.8;
  let isLoop = false;

  function showNotif(text) {
    const notif = document.getElementById('notif');
    notif.textContent = text;
    notif.style.display = 'block';
    setTimeout(() => notif.style.display = 'none', 4000);
  }

  function playSong(index) {
    current = index;
    document.querySelectorAll(".song").forEach((s, i) => {
      s.classList.toggle("active", i === current);
    });
    audio.src = songs[current].file;
    audio.play().then(() => {
      showNotif(`▶️ Memutar: ${songs[current].title}`);
    }).catch(() => {
      console.log("Autoplay diblokir oleh browser.");
    });
  }

  function toggleMusic() {
    if (audio.paused) {
      audio.play();
      showNotif("🎵 Musik Diputar");
    } else {
      audio.pause();
      showNotif("⏸️ Musik Dijeda");
    }
  }

  function nextSong() {
    current++;
    if (current >= songs.length) {
      current = 0; // balik ke awal playlist
    }
    playSong(current);
  }

  function toggleLoop() {
    isLoop = !isLoop;
    audio.loop = isLoop;
    showNotif(isLoop ? "🔁 Mode Loop Aktif" : "➡️ Mode Loop Nonaktif");
  }

  audio.addEventListener("ended", () => {
    if (isLoop) {
      playSong(current);
    } else {
      nextSong();
    }
  });

  // Auto mulai lagu pertama saat halaman terbuka
  window.addEventListener("load", () => {
    playSong(current);
  });
</script>
</body>
</html>
