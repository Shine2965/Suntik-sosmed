<!DOCTYPE html>
<html lang="id">
<head> 
  <meta name="google-adsense-account" content="ca-pub-9912622413153708">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9912622413153708"
     crossorigin="anonymous"></script>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Shine Shop - Top Up & Suntik Sosmed</title>
  <style>
    :root {
      --bg: #0f172a;
      --accent: #7c3aed;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, Segoe UI, system-ui, Arial;
      background: linear-gradient(180deg, #071026 0%, #07193a 100%);
      color: #e6eef8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 24px;
      overflow-y: auto; /* memungkinkan scroll */
    }
    .container {
      width: 100%;
      max-width: 600px;
      background: rgba(255,255,255,0.03);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 8px 30px rgba(2,6,23,0.6);
      text-align: center;
      margin-bottom: 20px;
    }
    .logo {
      width: 120px;
      margin: 0 auto 16px;
      display: block;
      animation: fadeIn 1.2s ease forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-15px); }
      to { opacity: 1; transform: translateY(0); }
    }
    h1 {
      font-size: 22px;
      margin-bottom: 20px;
      animation: fadeSlideIn 0.8s ease forwards;
    }
    nav {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .nav-btn {
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.3s ease;
    }
    .nav-btn:hover {
      transform: translateY(-2px);
      background: linear-gradient(135deg, #0284c7, #4f46e5);
    }
    .login-admin {
      margin-bottom: 25px;
      background: linear-gradient(135deg, #16a34a, #22c55e);
      border: none;
      color: white;
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
    }
    .login-admin:hover {
      background: linear-gradient(135deg, #15803d, #16a34a);
    }

    /* Popup login */
    .popup {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
    }
    .popup-content {
      background: #1e293b;
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      width: 90%;
      max-width: 360px;
    }
    input {
      width: 90%;
      padding: 8px;
      margin: 8px 0;
      border: none;
      border-radius: 6px;
    }
    .btn-submit {
      background: #4f46e5;
      color: white;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-submit:hover {
      background: #4338ca;
    }

    /* Playlist */
    .playlist {
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 15px;
      margin-top: 20px;
      text-align: left;
    }
    .playlist h3 {
      margin-top: 0;
      text-align: center;
    }
    .song-item {
      padding: 8px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      cursor: pointer;
    }
    .song-item:hover {
      background: rgba(255,255,255,0.08);
    }
    .song-item.active {
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      color: white;
      font-weight: bold;
    }

    /* Kontrol musik */
    .music-controls {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .music-btn {
      background: #334155;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
    }
    .music-btn:hover {
      background: #475569;
    }

    /* Notifikasi lagu */
    .song-notif {
      margin-top: 15px;
      padding: 10px;
      background: rgba(255,255,255,0.08);
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <script>
  const isMaintenance = false;
  if (isMaintenance) window.location.href = "/maintenance/";
  </script>

  <div class="container">
    <img src="logo.png" alt="Logo Toko" class="logo">
    <h1>Navigasi</h1>
    <nav>
      <button class="nav-btn" onclick="window.location.href='/topupgame/'">💎 Top up game</button>
      <button class="nav-btn" onclick="window.location.href='/dashboard/'">🚀 Suntik sosmed</button>
      <button class="nav-btn" onclick="window.location.href='/slot/'">🎰 Slot</button>
      <button class="nav-btn" onclick="window.location.href='/kontaksmm/'">🎧 Customer Service</button>
      <button class="nav-btn" onclick="window.location.href='/informasi/'">🔔 Informasi</button>
      <button class="nav-btn" onclick="window.location.href='/testimoni/'">🌟 Testimoni</button>
    </nav>
  </div>

  <button class="login-admin" onclick="openLogin()">🔐 Login Admin</button>

  <!-- Playlist visual -->
  <div class="container">
    <div class="playlist" id="playlist">
      <h3>🎵 Playlist Musik</h3>
      <!-- Lagu akan muncul di sini via JS -->
    </div>

    <div class="music-controls">
      <button class="music-btn" onclick="toggleMusic()">⏯️ Play / Pause</button>
      <button class="music-btn" onclick="nextSong()">⏭️ Next</button>
      <button class="music-btn" onclick="toggleLoop()">🔁 Loop: <span id="loopStatus">OFF</span></button>
    </div>

    <div class="song-notif" id="songNotif">Lagu belum diputar...</div>
  </div>

  <!-- Popup login -->
  <div class="popup" id="loginPopup">
    <div class="popup-content">
      <h2>Login Admin Panel</h2>
      <input type="text" id="username" placeholder="Username"><br>
      <input type="password" id="password" placeholder="Password"><br>
      <button class="btn-submit" onclick="login()">Masuk</button>
    </div>
  </div>

  <script>
    function openLogin() {
      document.getElementById('loginPopup').style.display = 'flex';
    }

    function login() {
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();
      const adminUser = "Alvino";
      const adminPass = "Alvino11";

      if (user === adminUser && pass === adminPass) {
        localStorage.setItem("adminName", user);
        window.location.href = "/admin/";
      } else {
        alert("Username atau password salah!");
      }
    }

    // 🎵 Pemutar Musik
    const playlist = [
      {name: "Jingle Bells - Lagu Natal", src: "/mp3/JingleBells.mp3" }
      
    ];

    let currentSong = 0;
    let loopEnabled = false;
    const audio = new Audio(playlist[currentSong].src);

    const playlistDiv = document.getElementById("playlist");
    const notif = document.getElementById("songNotif");
    const loopStatus = document.getElementById("loopStatus");

    // tampilkan daftar lagu
    function renderPlaylist() {
      playlistDiv.innerHTML = "<h3>🎵 Playlist Musik</h3>";
      playlist.forEach((song, i) => {
        const div = document.createElement("div");
        div.className = "song-item" + (i === currentSong ? " active" : "");
        div.textContent = song.name;
        div.onclick = () => playSong(i);
        playlistDiv.appendChild(div);
      });
    }

    function playSong(index) {
      currentSong = index;
      audio.src = playlist[currentSong].src;
      audio.play();
      updateNotif();
      renderPlaylist();
    }

    function nextSong() {
      currentSong = (currentSong + 1) % playlist.length;
      playSong(currentSong);
    }

    function toggleMusic() {
      if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
      updateNotif();
    }

    function toggleLoop() {
      loopEnabled = !loopEnabled;
      audio.loop = loopEnabled;
      loopStatus.textContent = loopEnabled ? "ON" : "OFF";
    }

    function updateNotif() {
      notif.textContent = audio.paused
        ? `⏸️ Lagu dijeda: ${playlist[currentSong].name}`
        : `🎶 Sedang diputar: ${playlist[currentSong].name}`;
    }

    audio.addEventListener("ended", () => {
      if (!loopEnabled) nextSong();
    });

    window.addEventListener("load", () => {
      renderPlaylist();
      audio.play().catch(() => console.log("Autoplay diblokir"));
      updateNotif();
    });
  </script>
</body>
</html>
