<!DOCTYPE html>
<html lang="id">
<head> 
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>🎄 Shine Shop - Suntik Sosmed & Top up game</title>
  <meta name="google-adsense-account" content="ca-pub-9912622413153708">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9912622413153708"
     crossorigin="anonymous"></script>
  <style>
    :root {
      --accent: #c0392b;
      --green: #16a34a;
      --gold: #facc15;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Poppins", system-ui, Arial;
      color: #fff;
      background: linear-gradient(180deg, #1a1a2e 0%, #0f172a 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 24px;
      overflow-y: auto;
    }

    /* Efek salju */
    @keyframes snow {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(100vh); opacity: 0; }
    }
    .snowflake {
      position: fixed;
      top: 0;
      color: white;
      font-size: 1em;
      animation: snow 10s linear infinite;
      opacity: 0.8;
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 600px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      text-align: center;
      margin-bottom: 20px;
      border: 2px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(8px);
    }
    .logo {
      width: 100px;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 20px;
      color: var(--gold);
      text-shadow: 0 0 10px #facc15;
    }

    nav {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .nav-btn {
      background: linear-gradient(135deg, #ef4444, #f59e0b);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.3s ease;
    }
    .nav-btn:hover {
      transform: translateY(-2px);
      background: linear-gradient(135deg, #dc2626, #ca8a04);
    }

    .login-admin {
      margin: 15px 0;
      background: linear-gradient(135deg, #16a34a, #22c55e);
      border: none;
      color: white;
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
    }
    .login-admin:hover {
      background: linear-gradient(135deg, #15803d, #16a34a);
    }

    /* Playlist */
    .playlist {
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 15px;
      text-align: left;
    }
    .playlist h3 {
      text-align: center;
      color: var(--gold);
      margin-bottom: 10px;
    }
    .song-item {
      padding: 8px 12px;
      border-radius: 6px;
      margin: 4px 0;
      cursor: pointer;
      transition: background 0.3s;
    }
    .song-item:hover {
      background: rgba(255,255,255,0.15);
    }
    .song-item.active {
      background: linear-gradient(90deg, #ef4444, #f59e0b);
      font-weight: bold;
    }

    .music-controls {
      margin-top: 15px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .music-btn {
      background: #334155;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .music-btn:hover {
      background: #475569;
    }

    .song-notif {
      margin-top: 15px;
      padding: 10px;
      background: rgba(255,255,255,0.08);
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
      color: #fff;
    }

    /* Popup login */
    .popup {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }
    .popup-content {
      background: #1e293b;
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      width: 90%;
      max-width: 360px;
      box-shadow: 0 0 25px rgba(0,0,0,0.5);
    }
    .popup-content input {
      width: 100%;
      margin: 8px 0;
      padding: 8px;
      border-radius: 6px;
      border: none;
      background: #334155;
      color: white;
    }
    .btn-submit {
      background: linear-gradient(135deg,#ef4444,#f59e0b);
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-submit:hover {
      background: linear-gradient(135deg,#dc2626,#ca8a04);
    }
  </style>
</head>
<body>
  <!-- Salju -->
  <script>
    for (let i = 0; i < 25; i++) {
      const snow = document.createElement('div');
      snow.className = 'snowflake';
      snow.textContent = '❄';
      snow.style.left = Math.random() * 100 + 'vw';
      snow.style.fontSize = (Math.random() * 10 + 10) + 'px';
      snow.style.animationDuration = (Math.random() * 5 + 5) + 's';
      snow.style.animationDelay = (Math.random() * 5) + 's';
      document.body.appendChild(snow);
    }
  </script>

  <div class="container">
    <img src="logo.png" alt="Logo Toko" class="logo">
    <h1>🎅 Selamat Datang di Shine Shop🎁</h1>
    <nav>
      <button class="nav-btn" onclick="window.location.href='/topupgame/'">💎 Top up game</button>
      <button class="nav-btn" onclick="window.location.href='/dashboard/'">🚀 Suntik sosmed</button>
      <button class="nav-btn" onclick="window.location.href='/slot/'">🎰 Slot</button>
      <button class="nav-btn" onclick="window.location.href='/kontaksmm/'">🎧 Customer Service</button>
      <button class="nav-btn" onclick="window.location.href='/informasi/'">🔔 Informasi</button>
      <button class="nav-btn" onclick="window.location.href='/testimoni/'">🌟 Testimoni</button>
    </nav>

    <button class="login-admin" onclick="openLogin()">🔐 Login Admin</button>

    <div class="playlist" id="playlist"></div>

    <div class="music-controls">
      <button class="music-btn" onclick="toggleMusic()">⏯️ Play / Pause</button>
      <button class="music-btn" onclick="nextSong()">⏭️ Next</button>
      <button class="music-btn" onclick="toggleLoop()">🔁 Loop: <span id="loopStatus">OFF</span></button>
    </div>

    <div class="song-notif" id="songNotif">🎄 Lagu belum diputar...</div>
  </div>

  <!-- Popup Login -->
  <div class="popup" id="loginPopup">
    <div class="popup-content">
      <h2>Login Admin Panel</h2>
      <input type="text" id="username" placeholder="Username"><br>
      <input type="password" id="password" placeholder="Password"><br>
      <button class="btn-submit" onclick="login()">Masuk</button>
    </div>
  </div>

  <script>
    // 🎅 Popup Login
    function openLogin() {
      document.getElementById('loginPopup').style.display = 'flex';
    }

    function login() {
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();
      if (user === "Alvino" && pass === "Alvino11") {
        localStorage.setItem("adminName", user);
        window.location.href = "/admin/";
      } else {
        alert("Username atau password salah!");
      }
    }

    // 🎵 Playlist
    const playlist = [
      { name:"🎄 Jingle Bells - Lagu Natal", src: "/mp3/JingleBells.mp3" },
      { name:"🕯️ Feliz Navidad - Lagu Natal", src: "/mp3/Feliz Navidad.mp3" }
        ];

    let currentSong = 0;
    let loopEnabled = false;
    const audio = new Audio(playlist[currentSong].src);
    const playlistDiv = document.getElementById("playlist");
    const notif = document.getElementById("songNotif");
    const loopStatus = document.getElementById("loopStatus");

    function renderPlaylist() {
      playlistDiv.innerHTML = "<h3>🎵 Playlist Natal</h3>";
      playlist.forEach((song, i) => {
        const div = document.createElement("div");
        div.className = "song-item" + (i === currentSong ? " active" : "");
        div.textContent = song.name;
        div.onclick = () => playSong(i);
        playlistDiv.appendChild(div);
      });
    }

    function playSong(index) {
      currentSong = index;
      audio.src = playlist[currentSong].src;
      audio.play();
      updateNotif();
      renderPlaylist();
    }

    function nextSong() {
      currentSong = (currentSong + 1) % playlist.length;
      playSong(currentSong);
    }

    function toggleMusic() {
      if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
      updateNotif();
    }

    function toggleLoop() {
      loopEnabled = !loopEnabled;
      audio.loop = loopEnabled;
      loopStatus.textContent = loopEnabled ? "ON" : "OFF";
    }

    function updateNotif() {
      notif.textContent = audio.paused
        ? `⏸️ Dijeda: ${playlist[currentSong].name}`
        : `🎶 Sedang diputar: ${playlist[currentSong].name}`;
    }

    audio.addEventListener("ended", () => {
      if (!loopEnabled) nextSong();
    });

    window.addEventListener("load", () => {
      renderPlaylist();
      updateNotif();
    });
  </script>
</body>
</html>
