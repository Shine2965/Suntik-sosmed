<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shine Shop • Valentine 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:
    radial-gradient(circle at top left,#ff4da6aa,transparent 40%),
    radial-gradient(circle at bottom right,#ff99cc66,transparent 40%),
    linear-gradient(180deg,#1a0512,#2b0a1f,#12030c);
  color:white;
  min-height:100vh;
  overflow-x:hidden;
}

/* HEART PARTICLES */
.particle{
  position:fixed;
  top:-20px;
  color:#ff4da6;
  font-size:20px;
  animation:fall linear infinite;
  opacity:.9;
  text-shadow:0 0 12px #ff4da6;
}

@keyframes fall{
  to{transform:translateY(110vh)}
}

.container{
  max-width:640px;
  margin:40px auto;
  padding:30px;
  background:rgba(255,105,180,.1);
  backdrop-filter:blur(18px);
  border-radius:26px;
  box-shadow:
    0 0 40px rgba(255,20,147,.6),
    inset 0 0 25px rgba(255,105,180,.3);
  text-align:center;
  border:1px solid rgba(255,105,180,.4);
  animation:fadeUp .7s ease;
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(25px)}
  to{opacity:1;transform:none}
}

h1{
  margin:0 0 12px;
  font-size:28px;
  background:linear-gradient(90deg,#ffc1e3,#ff4da6,#ff80bf);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  text-shadow:0 0 25px rgba(255,105,180,.8);
}

/* BUTTON */
.nav-btn{
  width:100%;
  margin:10px 0;
  padding:15px;
  border:none;
  border-radius:16px;
  background:linear-gradient(135deg,#ff4da6,#ff80bf);
  color:white;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  transition:.3s;
  box-shadow:0 8px 25px rgba(0,0,0,.5);
}

.nav-btn:hover{
  transform:translateY(-3px) scale(1.02);
  box-shadow:0 15px 35px rgba(255,105,180,.7);
}

.cs-btn{
  background:linear-gradient(135deg,#e60073,#ff3399);
}

/* PLAYLIST */
.playlist{
  margin-top:24px;
  background:rgba(0,0,0,.35);
  padding:18px;
  border-radius:18px;
  max-height:240px;
  overflow-y:auto;
  text-align:left;
  border:1px solid rgba(255,105,180,.3);
}

.playlist h3{
  margin-top:0;
  color:#ff80bf;
  text-align:center;
}

.song{
  padding:12px;
  border-bottom:1px solid rgba(255,255,255,.1);
  cursor:pointer;
  border-radius:12px;
  transition:.25s;
}

.song:hover{
  background:rgba(255,105,180,.25);
}

.song.active{
  background:rgba(255,105,180,.45);
  box-shadow:0 0 12px #ff4da6;
}

.music-controls{
  margin-top:16px;
  display:flex;
  justify-content:center;
  gap:12px;
}

.music-btn{
  background:#2b0a1f;
  border:1px solid #ff4da6;
  color:#ff80bf;
  padding:10px 16px;
  border-radius:12px;
  cursor:pointer;
  transition:.3s;
}

.music-btn:hover{
  background:#4d1437;
  box-shadow:0 0 12px #ff4da6;
}

/* WATERMARK */
.watermark{
  position:fixed;
  bottom:14px;
  left:50%;
  transform:translateX(-50%);
  font-size:12px;
  color:rgba(255,255,255,.6);
  letter-spacing:1px;
}

/* POPUP */
.popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:999;
}

.popup-content{
  background:#2b0a1f;
  padding:24px;
  border-radius:20px;
  max-width:360px;
  text-align:center;
  box-shadow:0 0 35px #ff4da6;
  border:1px solid #ff80bf;
}

.popup-content h3{
  color:#ff80bf;
}

.popup-content button{
  margin-top:14px;
  padding:10px 18px;
  border:none;
  border-radius:12px;
  background:linear-gradient(135deg,#ff4da6,#ff80bf);
  color:white;
  cursor:pointer;
  font-weight:600;
}
</style>
</head>

<body>

<div class="popup" id="infoPopup">
  <div class="popup-content">
    <h3>💖 Informasi Pesanan Valentine</h3>
    <p>Pesanan diproses manual oleh admin.</p>
    <p><b>Maksimal 1x24 jam.</b></p>
    <button onclick="closePopup()">Mengerti</button>
  </div>
</div>

<div class="container">
  <h1>💘 Shine Shop • Valentine 2026 💘</h1>

  <button class="nav-btn" onclick="location.href='/dashboard/'">🛒 Belanja</button>
  <button class="nav-btn" onclick="location.href='/testimoni/'">🌹 Testimoni</button>
  <button class="nav-btn" onclick="location.href='/ewallet/'">💳 E Wallet</button>
  <button class="nav-btn" onclick="location.href='https://store.shinedomain.my.id'">Informasi</button>
  <button class="nav-btn cs-btn" onclick="location.href='https://t.me/shineshopstore1'">💬 Customer Service</button>

  <div class="playlist">
    <h3>🎶 Love Playlist</h3>
    <div id="playlist"></div>
  </div>

  <div class="music-controls">
    <button class="music-btn" onclick="toggleMusic()">⏯ Play / Pause</button>
    <button class="music-btn" onclick="nextSong()">⏭ Next</button>
    <button class="music-btn" onclick="toggleLoop()">🔁 Loop</button>
  </div>
</div>

<div class="watermark">© SHINE SHOP 2026 • Made with Love 💖</div>

<script>
/* HEART PARTICLES */
function particle(){
  const p=document.createElement('div');
  p.className='particle';
  p.textContent='💖';
  p.style.left=Math.random()*100+'vw';
  p.style.animationDuration=4+Math.random()*6+'s';
  document.body.appendChild(p);
  setTimeout(()=>p.remove(),10000);
}
setInterval(particle,900);

/* PLAYLIST */
const songs=[
   {title:"Yi Dian Tian",file:"https://files.catbox.moe/lkrrqk.mp3"}
];

let current=0, loop=false;
const audio=new Audio();
const list=document.getElementById("playlist");

songs.forEach((s,i)=>{
  const d=document.createElement("div");
  d.className="song";
  d.textContent=s.title;
  d.onclick=()=>play(i);
  list.appendChild(d);
});

function play(i){
  current=i;
  document.querySelectorAll('.song').forEach((e,id)=>e.classList.toggle('active',id===current));
  audio.src=songs[current].file;
  audio.play().catch(()=>{});
}

function toggleMusic(){audio.paused?audio.play():audio.pause();}
function nextSong(){play((current+1)%songs.length);}
function toggleLoop(){loop=!loop;audio.loop=loop;}

function closePopup(){
  document.getElementById("infoPopup").style.display="none";


/* 🚫 ANTI INSPECT */ 
document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("keydown",function(e){
if(e.key==="F12") e.preventDefault();
if(e.ctrlKey&&e.shiftKey&&["I","C","J"].includes(e.key)) e.preventDefault();
if(e.ctrlKey&&e.key==="u") e.preventDefault();
});

setInterval(()=>{
if(window.outerWidth-window.innerWidth>160||window.outerHeight-window.innerHeight>160){
document.body.innerHTML="<h1 style='color:gold;text-align:center;margin-top:40vh;'>🚫 Developer Tools Terdeteksi</h1>";
}
},1000);

setInterval(()=>{console.clear();},1000);
setInterval(()=>{debugger;},3000);

</script>

</body>
</html>
