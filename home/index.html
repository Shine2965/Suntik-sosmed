<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shine Shop • 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:
    radial-gradient(circle at top left,#22c55e33,transparent 40%),
    radial-gradient(circle at bottom right,#ef444433,transparent 40%),
    linear-gradient(180deg,#0b1c2c,#042f1a);
  color:white;
  min-height:100vh;
  overflow-x:hidden;
}

.container{
  max-width:620px;
  margin:40px auto;
  padding:24px;
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(14px);
  border-radius:22px;
  box-shadow:0 15px 40px rgba(0,0,0,.45);
  text-align:center;
  animation:fadeUp .6s ease;
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:none}
}

h1{
  margin:0 0 10px;
  font-size:26px;
}

.nav-btn{
  width:100%;
  margin:8px 0;
  padding:14px;
  border:none;
  border-radius:14px;
  background:linear-gradient(135deg,#22c55e,#ef4444);
  color:white;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  transition:.25s;
}

.nav-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 25px rgba(0,0,0,.4);
}

/* CS BUTTON */
.cs-btn{
  margin-top:12px;
  background:linear-gradient(135deg,#38bdf8,#0284c7);
}

/* PLAYLIST */
.playlist{
  margin-top:20px;
  background:rgba(255,255,255,.1);
  padding:16px;
  border-radius:16px;
  max-height:220px;
  overflow-y:auto;
  text-align:left;
}

.song{
  padding:10px;
  border-bottom:1px solid rgba(255,255,255,.12);
  cursor:pointer;
  border-radius:10px;
}

.song:hover{background:rgba(255,255,255,.15)}
.song.active{background:rgba(34,197,94,.45)}

.music-controls{
  margin-top:16px;
  display:flex;
  justify-content:center;
  gap:12px;
}

.music-btn{
  background:#334155;
  border:none;
  color:white;
  padding:10px 14px;
  border-radius:10px;
  cursor:pointer;
}

/* WATERMARK */
.watermark{
  position:fixed;
  bottom:12px;
  left:50%;
  transform:translateX(-50%);
  font-size:12px;
  color:rgba(255,255,255,.45);
  letter-spacing:1px;
}

/* SNOW */
.snowflake{
  position:fixed;
  top:-20px;
  color:white;
  font-size:1.2em;
  animation:fall linear infinite;
  user-select:none;
}

@keyframes fall{
  to{transform:translateY(110vh)}
}

/* POPUP INFO */
.popup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:999;
}

.popup-content{
  background:#0f172a;
  padding:22px;
  border-radius:18px;
  max-width:360px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,.5);
}

.popup-content button{
  margin-top:14px;
  padding:10px 18px;
  border:none;
  border-radius:12px;
  background:#22c55e;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- POPUP INFO -->
<div class="popup" id="infoPopup">
  <div class="popup-content">
    <h3>📦 Informasi Pesanan</h3>
    <p>Pesanan anda diproses oleh admin secara manual.</p>
    <p><b>Maksimal 1x24 jam.</b></p>
    <button onclick="closePopup()">Mengerti</button>
  </div>
</div>

<div class="container">
  <h1></h1> Shine Shop</h1>

  <button class="nav-btn" onclick="location.href='/tidaktersedia/'">
    🚀 Suntik Sosmed & Top Up Game
  </button>

  <button class="nav-btn" onclick="location.href='/dashboard/'">
    🌟 Telegram
  </button>

   <button class="nav-btn" onclick="location.href='https://store.shinedomain.my.id'">
    📰 Peraturan/SOP
   </button>
  

  <button class="nav-btn cs-btn" onclick="location.href='https://t.me/shineshopstore1'">
    💬 Hubungi Customer Service
  </button>

  <div class="playlist">
    <h3>🎶 Playlist Natal</h3>
    <div id="playlist"></div>
  </div>

  <div class="music-controls">
    <button class="music-btn" onclick="toggleMusic()">⏯ Play / Pause</button>
    <button class="music-btn" onclick="nextSong()">⏭ Next</button>
    <button class="music-btn" onclick="toggleLoop()">🔁 Loop</button>
  </div>
</div>

<div class="watermark">© SHINE SHOP</div>

<script>
/* ❄️ SALJU ❄️ */
function snow(){
  const s=document.createElement('div');
  s.className='snowflake';
  s.textContent='❄️';
  s.style.left=Math.random()*100+'vw';
  s.style.animationDuration=5+Math.random()*6+'s';
  document.body.appendChild(s);
  setTimeout(()=>s.remove(),12000);
}
setInterval(snow,300);

/* 🎵 PLAYLIST 🎵 */
const songs=[
  {title:"C418-SWEDEN",file:"https://files.catbox.moe/1120of.mp3"}
];

let current=0, loop=false;
const audio=new Audio();
const list=document.getElementById("playlist");

songs.forEach((s,i)=>{
  const d=document.createElement("div");
  d.className="song";
  d.textContent=s.title;
  d.onclick=()=>play(i);
  list.appendChild(d);
});

function play(i){
  current=i;
  document.querySelectorAll('.song').forEach((e,id)=>e.classList.toggle('active',id===current));
  audio.src=songs[current].file;
  audio.play();
}

function toggleMusic(){audio.paused?audio.play():audio.pause();}
function nextSong(){play((current+1)%songs.length);}
function toggleLoop(){loop=!loop;audio.loop=loop;}

/* POPUP */
function closePopup(){
  document.getElementById("infoPopup").style.display="none";
}
</script>

</body>
</html>
