<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shine Player</title>
  <style>
    body {
      margin: 0;
      font-family: "Poppins", Arial, sans-serif;
      background: linear-gradient(135deg, #1e1e2f, #12121a);
      color: white;
      overflow-y: auto;
      height: 100vh;
    }

    /* Tombol login di atas playlist */
    .top-bar {
      width: 100%;
      background: rgba(255,255,255,0.1);
      padding: 10px;
      text-align: right;
      position: sticky;
      top: 0;
      backdrop-filter: blur(10px);
    }
    .top-bar button {
      background: #4f46e5;
      border: none;
      padding: 8px 16px;
      color: white;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    .top-bar button:hover {
      background: #6366f1;
    }

    /* Popup login */
    .popup {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
      z-index: 999;
    }
    .popup-content {
      background: #1e1e2e;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      width: 300px;
      text-align: center;
    }
    .popup-content input {
      width: 90%;
      padding: 10px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;
      text-align: center;
    }
    .popup-content button {
      background: #22c55e;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }

    /* Playlist */
    .playlist {
      margin: 20px auto;
      max-width: 400px;
      text-align: center;
    }
    .playlist h2 {
      margin-bottom: 10px;
    }
    .song {
      background: rgba(255,255,255,0.08);
      margin: 8px 0;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }
    .song:hover {
      background: rgba(255,255,255,0.2);
    }
    .controls {
      text-align: center;
      margin-top: 20px;
    }
    .controls button {
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      margin: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    .controls button:hover {
      background: #6366f1;
    }

    .current-song {
      text-align: center;
      font-size: 14px;
      margin-top: 8px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <button id="loginBtn">Login Admin</button>
  </div>

  <!-- Popup Login -->
  <div class="popup" id="loginPopup">
    <div class="popup-content">
      <h3>Login Admin</h3>
      <input type="text" id="username" placeholder="Username"><br>
      <input type="password" id="password" placeholder="Password"><br>
      <button id="submitLogin">Login</button>
    </div>
  </div>

  <!-- Playlist Musik -->
  <div class="playlist">
    <h2>🎶 Playlist Musik</h2>
    <div id="songList"></div>
    <div class="controls">
      <button id="prevBtn">⏮</button>
      <button id="playPauseBtn">⏯</button>
      <button id="nextBtn">⏭</button>
      <button id="loopBtn">🔁</button>
    </div>
    <div class="current-song" id="currentSong">Tidak ada lagu diputar</div>
  </div>

  <audio id="audioPlayer"></audio>

  <script>
    // === LOGIN POPUP ===
    const loginBtn = document.getElementById("loginBtn");
    const loginPopup = document.getElementById("loginPopup");
    const submitLogin = document.getElementById("submitLogin");

    loginBtn.addEventListener("click", () => loginPopup.style.display = "flex");
    submitLogin.addEventListener("click", () => {
      const user = document.getElementById("username").value;
      const pass = document.getElementById("password").value;
      if (user === "Alvino" && pass === "Alvino11") {
        window.location.href = "/gambling/";
      } else {
        alert("Username atau password salah!");
      }
    });

    // === PLAYLIST MUSIK ===
    const playlist = [
      { name: "Jingle Bells - Frank Sinatra", src: "mp3/jinglebells.mp3" },
      { name: "Feliz Navidad - Jose Feliciano", src: "mp3/feliznavidad.mp3" },
          ];

    const audio = document.getElementById("audioPlayer");
    const songList = document.getElementById("songList");
    const currentSong = document.getElementById("currentSong");
    const playPauseBtn = document.getElementById("playPauseBtn");
    const nextBtn = document.getElementById("nextBtn");
    const prevBtn = document.getElementById("prevBtn");
    const loopBtn = document.getElementById("loopBtn");

    let currentIndex = 0;
    let isPlaying = false;
    let isLoop = false;

    function loadSong(index) {
      audio.src = playlist[index].src;
      currentSong.textContent = "Sedang memutar: " + playlist[index].name;
    }

    function playSong() {
      audio.play();
      isPlaying = true;
      playPauseBtn.textContent = "⏸";
    }

    function pauseSong() {
      audio.pause();
      isPlaying = false;
      playPauseBtn.textContent = "▶";
    }

    function nextSong() {
      currentIndex = (currentIndex + 1) % playlist.length;
      loadSong(currentIndex);
      playSong();
    }

    function prevSong() {
      currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
      loadSong(currentIndex);
      playSong();
    }

    playlist.forEach((song, index) => {
      const div = document.createElement("div");
      div.classList.add("song");
      div.textContent = song.name;
      div.addEventListener("click", () => {
        currentIndex = index;
        loadSong(index);
        playSong();
      });
      songList.appendChild(div);
    });

    playPauseBtn.addEventListener("click", () => {
      if (isPlaying) pauseSong();
      else playSong();
    });
    nextBtn.addEventListener("click", nextSong);
    prevBtn.addEventListener("click", prevSong);
    loopBtn.addEventListener("click", () => {
      isLoop = !isLoop;
      loopBtn.style.background = isLoop ? "#22c55e" : "#4f46e5";
    });

    audio.addEventListener("ended", () => {
      if (isLoop) playSong();
      else nextSong();
    });

    // Auto load song pertama
    loadSong(currentIndex);
  </script>
</body>
</html>
