<!DOCTYPE html>
<html lang="id">
<head> 
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Shine Shop - Christmas Edition 🎄</title>
  <style>
    :root {
      --bg1: #7b1113;
      --bg2: #0d3b20;
      --accent: #d4af37; /* emas */
      --muted: #f5e6ca;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Poppins", Segoe UI, system-ui, Arial;
      background: linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 100%);
      color: var(--muted);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 24px;
      overflow-y: auto;
    }

    /* Efek salju */
    @keyframes snow {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(100vh); opacity: 0; }
    }
    .snowflake {
      position: fixed;
      top: -10px;
      color: white;
      font-size: 1em;
      user-select: none;
      animation: snow linear infinite;
      z-index: 9999;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: rgba(255,255,255,0.05);
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      text-align: center;
      margin-bottom: 20px;
      backdrop-filter: blur(5px);
    }

    .logo {
      width: 120px;
      margin: 0 auto 16px;
      display: block;
      animation: fadeIn 1.2s ease forwards;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
      color: #fffbe0;
      text-shadow: 0 0 8px rgba(255,255,255,0.4);
    }

    nav {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .nav-btn {
      background: linear-gradient(135deg, #e63946, #f4a261);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s ease;
      font-weight: 600;
    }
    .nav-btn:hover {
      transform: translateY(-2px);
      background: linear-gradient(135deg, #e63946, #ffb703);
    }

    .login-admin {
      margin-bottom: 25px;
      background: linear-gradient(135deg, #2a9d8f, #34d399);
      border: none;
      color: white;
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
      box-shadow: 0 0 10px rgba(52, 211, 153, 0.6);
    }
    .login-admin:hover {
      background: linear-gradient(135deg, #1d7874, #2dd4bf);
    }

    /* Popup login */
    .popup {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .popup-content {
      background: rgba(255,255,255,0.15);
      padding: 25px;
      border-radius: 16px;
      text-align: center;
      width: 90%;
      max-width: 360px;
      color: white;
      backdrop-filter: blur(8px);
      border: 2px solid rgba(255,255,255,0.3);
    }
    input {
      width: 90%;
      padding: 8px;
      margin: 8px 0;
      border: none;
      border-radius: 6px;
      background: rgba(255,255,255,0.8);
      color: #111;
    }
    .btn-submit {
      background: linear-gradient(135deg, #ef4444, #facc15);
      color: white;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
      font-weight: bold;
    }
    .btn-submit:hover {
      background: linear-gradient(135deg, #dc2626, #fbbf24);
    }

    /* Playlist */
    .playlist {
      background: rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 15px;
      margin-top: 20px;
      text-align: left;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .playlist h3 {
      margin-top: 0;
      text-align: center;
      color: #fffbe0;
    }
    .song-item {
      padding: 8px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      cursor: pointer;
    }
    .song-item:hover {
      background: rgba(255,255,255,0.08);
    }
    .song-item.active {
      background: linear-gradient(135deg, #e63946, #f4a261);
      color: white;
      font-weight: bold;
    }

    /* Kontrol musik */
    .music-controls {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .music-btn {
      background: #2d3748;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
    }
    .music-btn:hover {
      background: #475569;
    }

    .song-notif {
      margin-top: 15px;
      padding: 10px;
      background: rgba(255,255,255,0.1);
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="snow"></div>

  <div class="container">
    <img src="logo.png" alt="Logo Toko" class="logo">
    <h1>🎅 Navigasi Natal 🎄</h1>
    <nav>
      <button class="nav-btn" onclick="window.location.href='/topupgame/'">🎮 Top up game</button>
      <button class="nav-btn" onclick="window.location.href='/dashboard/'">🎁 Suntik sosmed</button>
      <button class="nav-btn" onclick="window.location.href='/slot/'">🎰 Slot</button>
      <button class="nav-btn" onclick="window.location.href='/kontaksmm/'">🎧 Customer Service</button>
      <button class="nav-btn" onclick="window.location.href='/informasi/'">🔔 Informasi</button>
      <button class="nav-btn" onclick="window.location.href='/testimoni/'">🌟 Testimoni</button>
    </nav>
  </div>

  <button class="login-admin" onclick="openLogin()">🔐 Login Admin</button>

  <div class="container">
    <div class="playlist" id="playlist">
      <h3>🎵 Christmas Playlist</h3>
    </div>

    <div class="music-controls">
      <button class="music-btn" onclick="toggleMusic()">⏯️ Play / Pause</button>
      <button class="music-btn" onclick="nextSong()">⏭️ Next</button>
      <button class="music-btn" onclick="toggleLoop()">🔁 Loop: <span id="loopStatus">OFF</span></button>
    </div>

    <div class="song-notif" id="songNotif">Lagu belum diputar...</div>
  </div>

  <div class="popup" id="loginPopup">
    <div class="popup-content">
      <h2>🎄 Login Admin Panel 🎅</h2>
      <input type="text" id="username" placeholder="Username"><br>
      <input type="password" id="password" placeholder="Password"><br>
      <button class="btn-submit" onclick="login()">Masuk</button>
    </div>
  </div>

  <script>
    // ❄️ Efek salju
    function createSnowflake() {
      const snowflake = document.createElement("div");
      snowflake.classList.add("snowflake");
      snowflake.textContent = "❄";
      snowflake.style.left = Math.random() * 100 + "vw";
      snowflake.style.fontSize = Math.random() * 10 + 10 + "px";
      snowflake.style.animationDuration = Math.random() * 3 + 5 + "s";
      document.body.appendChild(snowflake);
      setTimeout(() => snowflake.remove(), 8000);
    }
    setInterval(createSnowflake, 200);

    // 🔐 Login
    function openLogin() {
      document.getElementById('loginPopup').style.display = 'flex';
    }
    function login() {
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();
      if (user === "Alvino" && pass === "Alvino11") {
        window.location.href = "/gambling/";
      } else {
        alert("Username atau password salah!");
      }
    }

    // 🎶 Musik
    const playlist = [
      { name: "Jingle Bells", src: "/mp3/JingleBells.mp3" },
      { name: "Feliz Navidad", src: "/mp3/Feliz Navidad.mp3" },
         ];

    let currentSong = 0;
    let loopEnabled = false;
    const audio = new Audio(playlist[currentSong].src);

    const playlistDiv = document.getElementById("playlist");
    const notif = document.getElementById("songNotif");
    const loopStatus = document.getElementById("loopStatus");

    function renderPlaylist() {
      playlistDiv.innerHTML = "<h3>🎵 Christmas Playlist</h3>";
      playlist.forEach((song, i) => {
        const div = document.createElement("div");
        div.className = "song-item" + (i === currentSong ? " active" : "");
        div.textContent = song.name;
        div.onclick = () => playSong(i);
        playlistDiv.appendChild(div);
      });
    }

    function playSong(index) {
      currentSong = index;
      audio.src = playlist[currentSong].src;
      audio.play();
      updateNotif();
      renderPlaylist();
    }

    function nextSong() {
      currentSong = (currentSong + 1) % playlist.length;
      playSong(currentSong);
    }

    function toggleMusic() {
      if (audio.paused) {
        audio.play();
      } else {
        audio.pause();
      }
      updateNotif();
    }

    function toggleLoop() {
      loopEnabled = !loopEnabled;
      audio.loop = loopEnabled;
      loopStatus.textContent = loopEnabled ? "ON" : "OFF";
    }

    function updateNotif() {
      notif.textContent = audio.paused
        ? `⏸️ Lagu dijeda: ${playlist[currentSong].name}`
        : `🎶 Sedang diputar: ${playlist[currentSong].name}`;
    }

    audio.addEventListener("ended", () => {
      if (!loopEnabled) nextSong();
    });

    window.addEventListener("load", () => {
      renderPlaylist();
      audio.play().catch(() => console.log("Autoplay diblokir oleh browser"));
      updateNotif();
    });
  </script>
</body>
</html>
