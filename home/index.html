<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shine Shop - Christmas Edition</title>

  <style>
    body {
      margin: 0;
      font-family: Poppins, sans-serif;
      background: linear-gradient(180deg, #0b1c2c, #042f1a);
      color: white;
      overflow-x: hidden;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
      text-align: center;
      background: rgba(255,255,255,0.08);
      border-radius: 20px;
      margin-top: 40px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }

    .nav-btn {
      padding: 10px 20px;
      border: none;
      margin: 6px 0;
      border-radius: 10px;
      background: linear-gradient(135deg, #22c55e, #ef4444);
      color: white;
      cursor: pointer;
      width: 100%;
      font-size: 15px;
    }

    .login-admin {
      margin-top: 20px;
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      background: #22c55e;
      color: white;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }

    /* Playlist */
    .playlist {
      margin-top: 20px;
      background: rgba(255,255,255,0.1);
      padding: 15px;
      border-radius: 12px;
      max-height: 200px;
      overflow-y: auto;
      text-align: left;
    }
    .song {
      padding: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      cursor: pointer;
    }
    .song:hover { background: rgba(255,255,255,0.15);}
    .song.active { background: rgba(34,197,94,0.4); }

    /* Controls */
    .music-controls {
      margin-top: 15px;
      display: flex;
      justify-content: center;
      gap: 10px;
    }
    .music-btn {
      background: #334155;
      border: none;
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    /* Popup Login */
    .popup {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.6);
    }
    .popup-content {
      background: #1e293b;
      padding: 20px;
      width: 90%; 
      max-width: 360px;
      border-radius: 10px;
      text-align: center;
    }
    input {
      width: 90%;
      padding: 8px;
      margin: 8px 0;
      border: none;
      border-radius: 6px;
    }
    .btn-submit {
      background: #22c55e;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      color: white;
    }
    .btn-close {
      background: #ef4444;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      color: white;
      margin-left: 10px;
    }

    /* Snow */
    .snowflake {
      position: fixed;
      top: 0;
      color: #fff;
      font-size: 1.2em;
      user-select: none;
      animation: fall linear infinite;
    }
    @keyframes fall {
      0% { transform: translateY(0); }
      100% { transform: translateY(100vh); }
    }

    /* Notif */
    #notif {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(34,197,94,0.9);
      color: white;
      padding: 12px 16px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      display: none;
      animation: fadeInOut 4s ease;
    }
    @keyframes fadeInOut {
      0% {opacity:0; transform:translateY(20px);}
      10%,90% {opacity:1; transform:translateY(0);}
      100% {opacity:0; transform:translateY(20px);}
    }
  </style>
</head>

<body>

<div class="container">
  <h1>🎄 Menu Natal Shine Shop 🎁</h1>

  <button class="nav-btn" onclick="location.href='/dashboard/'">🚀 Suntik Sosmed & Top Up Game</button>
 <button class="nav-btn" onclick="location.href='/dashboard/'">🎧Customer Service</button>
  <button class="nav-btn" onclick="location.href='/testimoni/'">🌟 Testimoni</button>
<button class="nav-btn" onclick="location.href='/informasi/'">📰 Informasi</button>
  
  <button class="login-admin" onclick="openLogin()">🔐 Login Admin</button>

  <div class="playlist">
    <h3>🎶 Playlist Natal</h3>
    <div id="playlist"></div>
  </div>

  <div class="music-controls">
    <button class="music-btn" onclick="toggleMusic()">⏯️ Play/Pause</button>
    <button class="music-btn" onclick="nextSong()">⏭️ Next</button>
    <button class="music-btn" onclick="toggleLoop()">🔁 Loop</button>
  </div>
</div>

<div id="notif"></div>

<!-- POPUP LOGIN -->
<div class="popup" id="loginPopup">
  <div class="popup-content">
    <h2>Login Admin Panel</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button class="btn-submit" onclick="login()">Masuk</button>
    <button class="btn-close" onclick="closeLogin()">Tutup</button>
  </div>
</div>

<script>
/* ❄️ SALJU ❄️ */
function createSnowflakes(){
  for(let i=0;i<10;i++){
    const s=document.createElement('div');
    s.textContent='❄️';
    s.classList.add('snowflake');
    s.style.left=Math.random()*100+'vw';
    s.style.animationDuration=5+Math.random()*5+'s';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),10000);
  }
}
setInterval(createSnowflakes,3000);

/* 🎵 PLAYLIST 🎵 */
const songs=[
  {title:"Jingle Bells - Lagu Natal", file:"/mp3/JingleBells.mp3"},
  {title:"Dari Pulau Dan Benua - Lagu Natal", file:"/mp3/DariPulauDanBenuanatal.mp3"}
];

let current=0, loop=false;
const audio=new Audio();
const playlist=document.getElementById("playlist");

songs.forEach((s,i)=>{
  const div=document.createElement("div");
  div.className="song";
  div.textContent=s.title;
  div.onclick=()=>playSong(i);
  playlist.appendChild(div);
});

function playSong(i){
  current=i;
  document.querySelectorAll('.song').forEach((e,id)=>e.classList.toggle('active',id===current));
  audio.src=songs[current].file;
  audio.play();
}

function toggleMusic(){ audio.paused?audio.play():audio.pause(); }
function nextSong(){ current=(current+1)%songs.length; playSong(current); }
function toggleLoop(){ loop=!loop; audio.loop=loop; }

/* 🔐 LOGIN ADMIN – NON ENCRYPT */
let adminData = { username:"", password:"", saldo:0 };

fetch("/home/data.json")
  .then(r => r.json())
  .then(data => {
    adminData.username = data.username;
    adminData.password = data.password;
    adminData.saldo = data.saldo;
  });

function openLogin(){ document.getElementById('loginPopup').style.display='flex'; }
function closeLogin(){ document.getElementById('loginPopup').style.display='none'; }

function login(){
  const u=document.getElementById('username').value.trim();
  const p=document.getElementById('password').value.trim();

  if(u===adminData.username && p===adminData.password){
    alert("Login berhasil! Saldo: Rp " + adminData.saldo);
    location.href="/admin/";
  } else {
    alert("❌ Username atau password salah!");
  }
}
</script>

</body>
</html>
