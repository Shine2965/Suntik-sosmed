<!DOCTYPE html>
<html lang="id">
<head> 
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Shine Shop - Suntik Sosmed & Top Up Game</title>
  <style>
    :root {
      --bg: #1a202c;
      --red: #dc2626;
      --green: #16a34a;
      --white: #fefefe;
      --gold: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Poppins", Arial, sans-serif;
      background: linear-gradient(180deg, #062d0e 0%, #0a1e0d 100%);
      color: var(--white);
      min-height: 100vh;
      text-align: center;
      overflow-y: auto;
      padding: 20px;
      position: relative;
    }

    /* ❄️ Animasi salju */
    @keyframes snow {
      0% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(100vh); opacity: 0; }
    }
    .snowflake {
      position: fixed;
      top: 0;
      color: white;
      font-size: 1em;
      animation: snow linear infinite;
      z-index: 9999;
      pointer-events: none;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: rgba(255,255,255,0.07);
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(255,255,255,0.2);
      padding: 24px;
      border: 2px solid var(--green);
    }

    h1 {
      font-size: 24px;
      margin-bottom: 15px;
      color: var(--gold);
      text-shadow: 0 0 10px #facc15;
    }

    nav {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .nav-btn {
      background: linear-gradient(135deg, #dc2626, #b91c1c);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.3s ease;
    }
    .nav-btn:hover {
      transform: translateY(-2px);
      background: linear-gradient(135deg, #f87171, #dc2626);
    }

    .login-admin {
      margin-top: 25px;
      background: linear-gradient(135deg, #16a34a, #22c55e);
      border: none;
      color: white;
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
    }
    .login-admin:hover {
      background: linear-gradient(135deg, #15803d, #16a34a);
    }

    .popup {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .popup-content {
      background: #14532d;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
      width: 90%;
      max-width: 360px;
      box-shadow: 0 0 20px rgba(34,197,94,0.7);
      border: 2px solid var(--gold);
    }

    input {
      width: 90%;
      padding: 8px;
      margin: 8px 0;
      border: none;
      border-radius: 6px;
      background: #e5e7eb;
      color: #111;
    }

    .btn-submit {
      background: #dc2626;
      color: white;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
      font-weight: bold;
    }
    .btn-submit:hover { background: #b91c1c; }

    .player {
      margin-top: 40px;
      padding: 20px;
      background: rgba(255,255,255,0.08);
      border-radius: 12px;
      border: 2px solid var(--gold);
      position: relative;
    }

    .player h2 {
      color: var(--gold);
      text-shadow: 0 0 5px var(--gold);
    }

    .playlist {
      margin-top: 20px;
    }

    .song {
      background: rgba(255,255,255,0.08);
      margin: 8px 0;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    .song:hover {
      background: rgba(255,255,255,0.2);
    }

    .controls button {
      background: #dc2626;
      color: white;
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      margin: 5px;
      cursor: pointer;
      font-size: 18px;
      box-shadow: 0 0 10px rgba(255,255,255,0.2);
    }

    .controls button:hover {
      background: #ef4444;
    }

    .current-song {
      font-size: 14px;
      margin-top: 10px;
      opacity: 0.9;
      color: var(--white);
    }
  </style>
</head>
<body>

  <!-- ❄️ Efek salju -->
  <script>
    for (let i = 0; i < 30; i++) {
      const snowflake = document.createElement("div");
      snowflake.classList.add("snowflake");
      snowflake.textContent = "❄";
      snowflake.style.left = Math.random() * 100 + "vw";
      snowflake.style.animationDuration = 5 + Math.random() * 5 + "s";
      snowflake.style.fontSize = 12 + Math.random() * 12 + "px";
      document.body.appendChild(snowflake);
    }
  </script>

  <div class="container">
    <h1>🎄 Selamat Natal di Shine Shop 🎁</h1>
    <nav>
      <button class="nav-btn" onclick="window.location.href='/topupgame/'">💎 Top up game</button>
      <button class="nav-btn" onclick="window.location.href='/dashboard/'">🚀 Suntik sosmed</button>
      <button class="nav-btn" onclick="window.location.href='/slot/'">🎰 Slot</button>
      <button class="nav-btn" onclick="window.location.href='/kontaksmm/'">🎧 Customer Service</button>
      <button class="nav-btn" onclick="window.location.href='/informasi/'">🔔 Informasi</button>
      <button class="nav-btn" onclick="window.location.href='/testimoni/'">🌟 Testimoni</button>
    </nav>

    <button class="login-admin" onclick="openLogin()">🔐 Login Admin</button>

    <!-- Musik Player -->
    <div class="player">
      <h2>🎶 Playlist Natal</h2>
      <div id="songList" class="playlist"></div>
      <div class="controls">
        <button id="prevBtn">⏮</button>
        <button id="playPauseBtn">⏯</button>
        <button id="nextBtn">⏭</button>
        <button id="loopBtn">🔁</button>
      </div>
      <div class="current-song" id="currentSong">Tidak ada lagu diputar</div>
    </div>
  </div>

  <!-- Popup login -->
  <div class="popup" id="loginPopup">
    <div class="popup-content">
      <h2>🔐 Login Admin Panel</h2>
      <input type="text" id="username" placeholder="Username"><br>
      <input type="password" id="password" placeholder="Password"><br>
      <button class="btn-submit" onclick="login()">Masuk</button>
    </div>
  </div>

  <audio id="audioPlayer"></audio>

  <script>
    // === LOGIN ===
    function openLogin() {
      document.getElementById('loginPopup').style.display = 'flex';
    }
    function login() {
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();
      if (user === "Alvino" && pass === "Alvino11") {
        window.location.href = "/gambling/";
      } else {
        alert("🎅 Username atau password salah!");
      }
    }

    // === MUSIK PLAYER ===
    const playlist = [
      { name: "🎵 Jingle Bells - Frank Sinatra", src: "mp3/jinglebells.mp3" },
      { name: "🎶 Feliz Navidad - Jose Feliciano", src: "mp3/feliznavidad.mp3" },
         ];

    const audio = document.getElementById("audioPlayer");
    const songList = document.getElementById("songList");
    const currentSong = document.getElementById("currentSong");
    const playPauseBtn = document.getElementById("playPauseBtn");
    const nextBtn = document.getElementById("nextBtn");
    const prevBtn = document.getElementById("prevBtn");
    const loopBtn = document.getElementById("loopBtn");

    let currentIndex = 0;
    let isPlaying = false;
    let isLoop = false;

    function loadSong(index) {
      audio.src = playlist[index].src;
      currentSong.textContent = "Sedang memutar: " + playlist[index].name;
    }

    function playSong() {
      audio.play();
      isPlaying = true;
      playPauseBtn.textContent = "⏸";
    }

    function pauseSong() {
      audio.pause();
      isPlaying = false;
      playPauseBtn.textContent = "▶";
    }

    function nextSong() {
      currentIndex = (currentIndex + 1) % playlist.length;
      loadSong(currentIndex);
      playSong();
    }

    function prevSong() {
      currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
      loadSong(currentIndex);
      playSong();
    }

    playlist.forEach((song, index) => {
      const div = document.createElement("div");
      div.classList.add("song");
      div.textContent = song.name;
      div.addEventListener("click", () => {
        currentIndex = index;
        loadSong(index);
        playSong();
      });
      songList.appendChild(div);
    });

    playPauseBtn.addEventListener("click", () => {
      if (isPlaying) pauseSong();
      else playSong();
    });
    nextBtn.addEventListener("click", nextSong);
    prevBtn.addEventListener("click", prevSong);
    loopBtn.addEventListener("click", () => {
      isLoop = !isLoop;
      loopBtn.style.background = isLoop ? "#16a34a" : "#dc2626";
    });

    audio.addEventListener("ended", () => {
      if (isLoop) playSong();
      else nextSong();
    });

    loadSong(currentIndex);
  </script>
</body>
</html>
