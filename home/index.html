<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shine Shop • Valentine Edition 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:
    radial-gradient(circle at top left,#ff4d88aa,transparent 40%),
    radial-gradient(circle at bottom right,#ff99cc55,transparent 40%),
    linear-gradient(180deg,#1a0512,#2b0a1f,#12030c);
  color:white;
  min-height:100vh;
  overflow-x:hidden;
}

/* PARTICLES */
.particle{
  position:fixed;
  top:-20px;
  font-size:20px;
  animation:fall linear infinite;
  opacity:.85;
  text-shadow:0 0 15px #ff4d88;
}

@keyframes fall{
  to{transform:translateY(110vh)}
}

/* PREMIUM CONTAINER */
.container{
  max-width:640px;
  margin:40px auto;
  padding:30px;
  border-radius:30px;
  text-align:center;
  position:relative;
  backdrop-filter:blur(25px);
  background:rgba(255,105,180,.08);
  border:1px solid rgba(255,105,180,.3);
  box-shadow:0 0 50px rgba(255,20,147,.6);
  animation:fadeUp .8s ease;
}

.container::before{
  content:"";
  position:absolute;
  inset:-2px;
  border-radius:30px;
  padding:2px;
  background:linear-gradient(45deg,#ff4d88,#ff99cc,#ff1a75,#ff66b2);
  -webkit-mask:
    linear-gradient(#000 0 0) content-box,
    linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  animation:glow 4s linear infinite;
}

@keyframes glow{
  0%{filter:hue-rotate(0deg)}
  100%{filter:hue-rotate(360deg)}
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(30px)}
  to{opacity:1}
}

h1{
  font-size:28px;
  background:linear-gradient(90deg,#ffc1e3,#ff4d88,#ff99cc);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  text-shadow:0 0 25px #ff4d88;
}

/* BUTTON */
.nav-btn{
  width:100%;
  margin:12px 0;
  padding:15px;
  border:none;
  border-radius:18px;
  background:linear-gradient(135deg,#ff4d88,#ff80bf);
  color:white;
  font-weight:600;
  cursor:pointer;
  transition:.3s;
  box-shadow:0 8px 25px rgba(0,0,0,.5);
  animation:pulse 2s infinite;
}

@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(255,77,136,.6)}
  70%{box-shadow:0 0 0 15px rgba(255,77,136,0)}
  100%{box-shadow:0 0 0 0 rgba(255,77,136,0)}
}

.nav-btn:hover{
  transform:translateY(-3px) scale(1.03);
}

.cs-btn{
  background:linear-gradient(135deg,#e60073,#ff3399);
}

/* PLAYLIST */
.playlist{
  margin-top:24px;
  background:rgba(0,0,0,.35);
  padding:18px;
  border-radius:18px;
  max-height:220px;
  overflow-y:auto;
  border:1px solid rgba(255,105,180,.3);
}

.song{
  padding:10px;
  border-radius:10px;
  cursor:pointer;
  transition:.3s;
}

.song:hover{
  background:rgba(255,105,180,.3);
}

.song.active{
  background:rgba(255,105,180,.5);
  box-shadow:0 0 15px #ff4d88;
}

.music-controls{
  margin-top:15px;
  display:flex;
  justify-content:center;
  gap:10px;
}

.music-btn{
  background:#2b0a1f;
  border:1px solid #ff4d88;
  color:#ff80bf;
  padding:8px 14px;
  border-radius:12px;
  cursor:pointer;
}

.music-btn:hover{
  background:#4d1437;
  box-shadow:0 0 10px #ff4d88;
}

/* WATERMARK */
.watermark{
  position:fixed;
  bottom:14px;
  left:50%;
  transform:translateX(-50%);
  font-size:12px;
  color:rgba(255,255,255,.6);
}
</style>
</head>

<body>

<div class="container">
  <h1>💎 Shine Shop • Valentine Edition 💘</h1>

  <button class="nav-btn" onclick="loveExplosion(event);location.href='/dashboard/'">🛒 Belanja</button>
  <button class="nav-btn" onclick="loveExplosion(event);location.href='/testimoni/'">🌹 Testimoni</button>
  <button class="nav-btn" onclick="loveExplosion(event);location.href='/ewallet/'">💳 E Wallet</button>
  <button class="nav-btn" onclick="loveExplosion(event);location.href='https://store.shinedomain.my.id'">🎁 Special Gift</button>
  <button class="nav-btn cs-btn" onclick="loveExplosion(event);location.href='https://t.me/shineshopstore1'">💬 Customer Service</button>

  <div class="playlist">
    <div id="playlist"></div>
  </div>

  <div class="music-controls">
    <button class="music-btn" onclick="toggleMusic()">⏯</button>
    <button class="music-btn" onclick="nextSong()">⏭</button>
    <button class="music-btn" onclick="toggleLoop()">🔁</button>
  </div>
</div>

<div class="watermark">© SHINE SHOP 2026 • Made with Love 💖</div>

<script>
/* HEART + ROSE PARTICLES */
function particle(){
  const p=document.createElement('div');
  p.className='particle';
  p.textContent=Math.random()>0.5?'💖':'🌹';
  p.style.left=Math.random()*100+'vw';
  p.style.animationDuration=4+Math.random()*6+'s';
  document.body.appendChild(p);
  setTimeout(()=>p.remove(),10000);
}
setInterval(particle,1000);

/* LOVE EXPLOSION */
function loveExplosion(e){
  for(let i=0;i<12;i++){
    const heart=document.createElement('div');
    heart.innerHTML='💘';
    heart.style.position='fixed';
    heart.style.left=e.clientX+'px';
    heart.style.top=e.clientY+'px';
    heart.style.fontSize='20px';
    heart.style.pointerEvents='none';
    document.body.appendChild(heart);

    const angle=Math.random()*2*Math.PI;
    const distance=80+Math.random()*40;
    const x=Math.cos(angle)*distance;
    const y=Math.sin(angle)*distance;

    heart.animate([
      {transform:'translate(0,0)',opacity:1},
      {transform:`translate(${x}px,${y}px)`,opacity:0}
    ],{duration:700,easing:'ease-out'});

    setTimeout(()=>heart.remove(),700);
  }
}

/* PLAYLIST */
const songs=[
  {title:"Yi Dian Tian",file:"https://files.catbox.moe/lkrrqk.mp3"}
];

let current=0, loop=true;
const audio=new Audio(songs[0].file);
audio.loop=true;
audio.volume=0.6;
audio.play();

const list=document.getElementById("playlist");

songs.forEach((s,i)=>{
  const d=document.createElement("div");
  d.className="song";
  d.textContent="🎵 "+s.title;
  d.onclick=()=>play(i);
  list.appendChild(d);
});

function play(i){
  current=i;
  document.querySelectorAll('.song').forEach((e,id)=>e.classList.toggle('active',id===current));
  audio.src=songs[current].file;
  audio.play();
}

function toggleMusic(){audio.paused?audio.play():audio.pause();}
function nextSong(){play((current+1)%songs.length);}
function toggleLoop(){loop=!loop;audio.loop=loop;}
  
  
/* 🚫 ANTI INSPECT */ 
document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("keydown",function(e){
if(e.key==="F12") e.preventDefault();
if(e.ctrlKey&&e.shiftKey&&["I","C","J"].includes(e.key)) e.preventDefault();
if(e.ctrlKey&&e.key==="u") e.preventDefault();
});

setInterval(()=>{
if(window.outerWidth-window.innerWidth>160||window.outerHeight-window.innerHeight>160){
document.body.innerHTML="<h1 style='color:gold;text-align:center;margin-top:40vh;'>🚫 Developer Tools Terdeteksi</h1>";
}
},1000);

setInterval(()=>{console.clear();},1000);
setInterval(()=>{debugger;},3000);
</script>

</body>
</html>
