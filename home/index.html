<!DOCTYPE html>
<html lang="id">
<head> 
  <meta name="google-adsense-account" content="ca-pub-9912622413153708">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9912622413153708"
     crossorigin="anonymous"></script>
 <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Shine Shop - Top Up & Suntik Sosmed</title>
  <style>
    :root{--bg:#0f172a;--accent:#7c3aed;--muted:#94a3b8}
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter,Segoe UI,system-ui,Arial;
      background:linear-gradient(180deg,#071026 0%, #07193a 100%);
      color:#e6eef8;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px
    }
    .container{
      width:100%;
      max-width:600px;
      background:rgba(255,255,255,0.03);
      border-radius:16px;
      padding:28px;
      box-shadow:0 8px 30px rgba(2,6,23,0.6);
      text-align:center
    }
    .logo{
      width:120px;
      margin:0 auto 16px;
      display:block;
      opacity:0;
      animation:fadeIn 1.2s ease forwards;
    }
    @keyframes fadeIn{
      from{opacity:0; transform:translateY(-15px);}
      to{opacity:1; transform:translateY(0);}
    }
    h1{
      font-size:22px;
      margin-bottom:20px;
      opacity:0;
      animation:fadeSlideIn 0.8s ease forwards;
      animation-delay:0.2s;
    }
    nav{display:flex;flex-direction:column;gap:12px}
    .nav-btn {
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.3s ease;
    }
    .nav-btn:hover {
      transform: translateY(-2px);
      background: linear-gradient(135deg, #0284c7, #4f46e5);
    }
    .login-admin {
      margin-top: 25px;
      background: linear-gradient(135deg, #16a34a, #22c55e);
      border: none;
      color: white;
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
    }
    .login-admin:hover {
      background: linear-gradient(135deg, #15803d, #16a34a);
    }

    /* Popup login */
    .popup {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
    }
    .popup-content {
      background: #1e293b;
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      width: 90%;
      max-width: 360px;
    }
    input {
      width: 90%;
      padding: 8px;
      margin: 8px 0;
      border: none;
      border-radius: 6px;
    }
    .btn-submit {
      background: #4f46e5;
      color: white;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-submit:hover {
      background: #4338ca;
    }

    /* Notifikasi lagu */
    .song-notif {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(15,23,42,0.9);
      color: white;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 14px;
      box-shadow: 0 0 15px rgba(0,0,0,0.3);
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.5s ease;
      z-index: 100;
    }
    .song-notif.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <script>
  // 🔧 Toggle Maintenance ON/OFF
  const isMaintenance = false; // ubah ke true jika mau matikan website
  if (isMaintenance) {
    window.location.href = "/maintenance/";
  }
  </script>

  <div class="container">
    <img src="logo.png" alt="Logo Toko" class="logo">
    <h1>Navigasi</h1>
    <nav>
      <button class="nav-btn" onclick="window.location.href='/topupgame/'">💎 Top up game</button>
      <button class="nav-btn" onclick="window.location.href='/dashboard/'">🚀 Suntik sosmed</button>
      <button class="nav-btn" onclick="window.location.href='/slot/'">🎰 Slot</button>
      <button class="nav-btn" onclick="window.location.href='/kontaksmm/'">🎧 Customer Service</button>
      <button class="nav-btn" onclick="window.location.href='/informasi/'">🔔 Informasi</button>
      <button class="nav-btn" onclick="window.location.href='/testimoni/'">🌟 Testimoni</button>
    </nav>

    <button class="login-admin" onclick="openLogin()">🔐 Login Admin</button>
  </div>

  <!-- Popup login -->
  <div class="popup" id="loginPopup">
    <div class="popup-content">
      <h2>Login Admin Panel</h2>
      <input type="text" id="username" placeholder="Username"><br>
      <input type="password" id="password" placeholder="Password"><br>
      <button class="btn-submit" onclick="login()">Masuk</button>
    </div>
  </div>

  <!-- Notifikasi lagu -->
  <div id="songNotif" class="song-notif"></div>

  <script>
    function openLogin() {
      document.getElementById('loginPopup').style.display = 'flex';
    }

    function login() {
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();
      const adminUser = "Alvino";
      const adminPass = "Alvino11";

      if (user === adminUser && pass === adminPass) {
        localStorage.setItem("adminName", user);
        window.location.href = "/admin/";
      } else {
        alert("Username atau password salah!");
      }
    }

    // 🎵 Playlist dan pemutar musik otomatis
    const playlist = [
      { name: "Once Again - Kim Min Seung", file: "/mp3/once again.mp3" },
      { name: "Not You - Alan Walker", file: "/mp3/Not You.mp3" }
    ];

    let currentSong = 0;
    const audio = new Audio();
    audio.volume = 1;
    audio.autoplay = true;

    function playSong(index) {
      currentSong = index;
      audio.src = playlist[index].file;
      audio.play().catch(() => console.log("Autoplay diblokir oleh browser"));
      showNotif(`🎵 Memutar: ${playlist[index].name}`);
    }

    function showNotif(text) {
      const notif = document.getElementById("songNotif");
      notif.textContent = text;
      notif.classList.add("show");
      setTimeout(() => notif.classList.remove("show"), 4000);
    }

    // 🔁 Saat lagu selesai → otomatis lanjut ke lagu berikutnya
    audio.addEventListener("ended", () => {
      currentSong++;
      if (currentSong >= playlist.length) {
        currentSong = 0; // kembali ke awal playlist
      }
      playSong(currentSong);
    });

    // 🚀 Mulai saat halaman dimuat
    window.addEventListener("load", () => {
      playSong(currentSong);
    });
  </script>
</body>
</html>
