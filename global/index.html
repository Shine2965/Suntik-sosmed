<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shine Shop</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
    *{
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body{
        font-family: 'Poppins', sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
            linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)),
            url('/home/logo.png') center/cover no-repeat fixed;
        color: white;
        padding: 20px;
    }

    :root{
        --border: rgba(255,255,255,0.15);
    }

    .container{
        width: 100%;
        max-width: 480px;
        background: rgba(255,255,255,0.05);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-radius: 18px;
        padding: 35px 25px;
        text-align: center;
        border: 1px solid rgba(255,255,255,0.1);
    }

    h1{
        font-size: 22px;
        font-weight: 600;
        margin-bottom: 30px;
        letter-spacing: 1px;
    }

    .gmail-display {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 10px;
        padding: 10px 14px;
        margin: 10px 0 16px 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
        font-size: 13px;
    }

    .gmail-display .label {
        color: #aaa;
        font-weight: 400;
    }

    .gmail-display .value {
        color: #4fc3f7;
        font-weight: 500;
        word-break: break-all;
        flex: 1;
        text-align: left;
        padding: 0 8px;
    }

    .gmail-display .value.not-set {
        color: #ff6666;
        font-style: italic;
        font-weight: 400;
    }

    .gmail-display .btn-change {
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.1);
        color: #fff;
        padding: 4px 14px;
        border-radius: 8px;
        font-size: 11px;
        cursor: pointer;
        transition: 0.3s;
        font-family: 'Poppins', sans-serif;
    }

    .gmail-display .btn-change:hover {
        background: rgba(255,255,255,0.15);
    }

    .announcement-box {
        background: rgba(255, 215, 0, 0.06);
        border: 1px solid rgba(255, 215, 0, 0.12);
        border-radius: 10px;
        padding: 12px 14px;
        margin: 8px 0 14px 0;
        text-align: left;
        display: none;
        font-size: 13px;
        color: #e8d5f0;
        line-height: 1.7;
    }

    .announcement-box.show {
        display: block;
        animation: fadeSlide 0.4s ease both;
    }

    @keyframes fadeSlide {
        from { opacity: 0; transform: translateY(-6px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .announcement-box .title {
        color: #ffd54f;
        font-weight: 600;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 4px;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .announcement-box .title .icon {
        font-size: 14px;
    }

    .announcement-box a {
        color: #4fc3f7;
        text-decoration: none;
        font-weight: 500;
    }

    .announcement-box a:hover {
        text-decoration: underline;
    }

    .note-box {
        font-family: Arial, sans-serif;
        font-size: 13px;
        line-height: 1.6;
        color: #1a202c;
        background-color: #ebf8ff;
        border-left: 4px solid #3182ce;
        padding: 12px 14px;
        border-radius: 4px;
        margin: 12px 0;
        text-align: left;
    }

    .note-box strong {
        color: #2b6cb0;
    }

    .nav-btn{
        width: 100%;
        padding: 14px;
        margin: 10px 0;
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.15);
        background: rgba(255,255,255,0.08);
        color: white;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: 0.25s;
        font-family: 'Poppins', sans-serif;
    }

    .nav-btn:hover{
        background: rgba(255,255,255,0.18);
    }

    .nav-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
    }

    .footer{
        margin-top: 25px;
        font-size: 12px;
        opacity: 0.6;
    }

    @media (max-width: 480px) {
        .container { padding: 24px 16px; }
        h1 { font-size: 18px; }
        .gmail-display { font-size: 12px; }
        .note-box { font-size: 12px; }
    }
    </style>

</head>
<body>

    <!-- ===== MAIN CONTAINER ===== -->
    <div class="container">
        <h1>Shine Shop Menu Global</h1>

        <!-- GMAIL DISPLAY -->
        <div class="gmail-display" id="gmailDisplayContainer">
            <span class="label">📧 Gmail:</span>
            <span class="value" id="gmailDisplay">Belum diatur</span>
            <button class="btn-change" id="changeGmailBtn">✏️ Ubah</button>
        </div>

        <!-- PENGUMUMAN -->
        <div class="announcement-box" id="announcementBox">
            <div class="title">
                <span class="icon">📢</span> Pengumuman
            </div>
            <div id="announcementContent"></div>
        </div>

        <!-- NOTE -->
        <div class="note-box">
            <strong>📌 Catatan Penting:</strong><br>
            Status pesanan: Partial / Canceled / Error<br>
            Silahkan mengajukan refund hubungi Customer Service melalui:<br>
            WhatsApp: +62 895-1810-3883<br>
            Instagram: onivla_
        </div>

        <button class="nav-btn" onclick="handleButtonClick('/sosmed-2/')">
            📱 Suntik Sosmed 2
        </button>

        <button class="nav-btn" onclick="handleButtonClick('https://link.dana.id/danakaget?c=sdsj6yazm&r=iB4jH9&orderId=20260904101214185215010300166995495908178')">
            💲 Event - Daget by Shine Shop
        </button>

        <button class="nav-btn" onclick="handleButtonClick('https://chat.whatsapp.com/EX9PcPqi7lp8ohijgWwqxF?s=cl&p=a&mlu=4&ilr=4')">
        🔥 Group WhatsApp 
        </button>

        <button class="nav-btn" onclick="handleButtonClick('https://wa.me/6289518103883')">
            🎧 CUSTOMER SERVICE (WhatsApp)
        </button>

        <div class="footer">
            &copy; Shine Shop - 2026
        </div>
    </div>

    <script>
    // ============================================================
    // 🔒 DRAGON PROTOCOL: GMAIL & USER ID
    // ============================================================

    const GMAIL_KEY = 'user_gmail';
    let gmailPromptActive = false;
    let userID = localStorage.getItem('user_id') || 'user-' + Math.random().toString(36).substring(2,8);

    if (!localStorage.getItem('user_id')) {
        localStorage.setItem('user_id', userID);
    }

    // ---------- GMAIL FUNCTIONS ----------
    function validateEmail(email) {
        return email && typeof email === 'string' && email.includes('@') && email.includes('.') && email.length > 5;
    }

    function getStoredGmail() {
        try {
            return localStorage.getItem(GMAIL_KEY) || null;
        } catch (e) {
            console.error('❌ Error get Gmail:', e);
            return null;
        }
    }

    function saveGmailToStorage(newGmail) {
        try {
            if (!newGmail || !validateEmail(newGmail)) {
                console.error('❌ Gmail tidak valid:', newGmail);
                return false;
            }
            localStorage.setItem(GMAIL_KEY, newGmail);
            console.log('✅ Gmail tersimpan:', newGmail);
            return true;
        } catch (e) {
            console.error('❌ Error simpan Gmail:', e);
            return false;
        }
    }

    function updateGmailDisplay() {
        try {
            const gmail = getStoredGmail();
            const displayEl = document.getElementById('gmailDisplay');
            if (!displayEl) return;

            if (gmail && validateEmail(gmail)) {
                displayEl.textContent = gmail;
                displayEl.className = 'value';
            } else {
                displayEl.textContent = '⚠️ Wajib diatur!';
                displayEl.className = 'value not-set';
            }
            return true;
        } catch (e) {
            console.error('❌ Error update display:', e);
            return false;
        }
    }

    // ============================================================
    // 🔥 LOAD PENGUMUMAN BERDASARKAN GMAIL
    // ============================================================
    async function loadAnnouncementByGmail() {
        const gmail = getStoredGmail();
        const box = document.getElementById('announcementBox');
        const content = document.getElementById('announcementContent');

        if (!box || !content) return;

        if (!gmail || !validateEmail(gmail)) {
            console.log('ℹ️ Gmail belum diatur, skip pengumuman');
            return;
        }

        try {
            const res = await fetch("/home2/pesan.json?t=" + Date.now(), { cache: "no-store" });
            if (!res.ok) {
                console.log('ℹ️ Tidak ada pengumuman');
                return;
            }

            const data = await res.json();
            let found = false;
            let html = '';

            if (data && data.all) {
                html += data.all + '<br><br>';
                found = true;
            }

            const gmailKey = gmail.toLowerCase().trim();
            if (data && data[gmailKey]) {
                html += data[gmailKey];
                found = true;
            }

            if (data && data[userID]) {
                html += data[userID];
                found = true;
            }

            if (found) {
                content.innerHTML = html;
                box.classList.add('show');
                console.log('📢 Pengumuman dimuat untuk Gmail:', gmail);
            }

        } catch (e) {
            console.log('ℹ️ Gagal memuat pengumuman:', e.message);
        }
    }

    // ============================================================
    // 🔥 CEK & MINTA GMAIL
    // ============================================================
    async function ensureGmail() {
        if (gmailPromptActive) return false;

        const gmail = getStoredGmail();

        if (gmail && validateEmail(gmail)) {
            updateGmailDisplay();
            return true;
        }

        gmailPromptActive = true;

        const result = await Swal.fire({
            title: '📧 Wajib Login Terlebih Dahulu',
            text: 'Masukkan Gmail untuk melanjutkan. Hal ini dilakukan agar mempermudah pelacakan transaksi Anda.',
            input: 'email',
            inputPlaceholder: 'contoh: email@gmail.com',
            inputAttributes: { autocomplete: 'email' },
            showCancelButton: true,
            cancelButtonText: '❌ Batal',
            confirmButtonText: '✅ Simpan',
            confirmButtonColor: '#4fc3f7',
            cancelButtonColor: '#666',
            allowOutsideClick: false,
            background: '#1a0e2e',
            color: '#fff',
            preConfirm: (email) => {
                if (!validateEmail(email)) {
                    Swal.showValidationMessage('⚠️ Format Gmail tidak valid!');
                    return false;
                }
                return email;
            }
        });

        gmailPromptActive = false;

        if (result.isDismissed) {
            return false;
        }

        if (result.isConfirmed && result.value) {
            const newGmail = result.value.trim();
            const saved = saveGmailToStorage(newGmail);

            if (saved) {
                updateGmailDisplay();
                await Swal.fire({
                    title: '✅ Gmail Tersimpan!',
                    text: `Gmail ${newGmail} berhasil disimpan. Hubungi admin jika ingin merubah Gmail.`,
                    icon: 'success',
                    confirmButtonColor: '#4fc3f7',
                    background: '#1a0e2e',
                    color: '#fff',
                    timer: 3000,
                    timerProgressBar: true
                });

                await loadAnnouncementByGmail();
                return true;
            }
            return false;
        }

        return false;
    }

    // ============================================================
    // 🔥 UBAH GMAIL DENGAN PASSWORD
    // ============================================================
    async function changeGmailWithPassword() {
        const currentGmail = getStoredGmail();

        let correctPassword = '';
        try {
            const res = await fetch('/pass.json?t=' + Date.now());
            if (res.ok) {
                const data = await res.json();
                correctPassword = data.password || '';
            }
        } catch (e) {
            console.error('Gagal mengambil pass.json:', e);
        }

        if (!correctPassword) {
            correctPassword = 'ALb17';
            console.warn('⚠️ pass.json tidak ditemukan, menggunakan default password');
        }

        const { value: password } = await Swal.fire({
            title: '🔑 Verifikasi Password',
            text: 'Masukkan password yang diberikan admin untuk mengubah Gmail:',
            input: 'password',
            inputPlaceholder: 'Masukkan password...',
            showCancelButton: true,
            confirmButtonText: '✅ Verifikasi',
            cancelButtonText: '❌ Batal',
            confirmButtonColor: '#4fc3f7',
            cancelButtonColor: '#666',
            background: '#1a0e2e',
            color: '#fff',
            preConfirm: (pass) => {
                if (!pass || pass.trim() === '') {
                    Swal.showValidationMessage('⚠️ Password tidak boleh kosong!');
                    return false;
                }
                return pass.trim();
            }
        });

        if (!password) return;

        if (password !== correctPassword) {
            Swal.fire({
                title: '❌ Password Salah!',
                text: 'Password yang Anda masukkan tidak valid.',
                icon: 'error',
                confirmButtonColor: '#ff4444',
                background: '#1a0e2e',
                color: '#fff'
            });
            return;
        }

        const { value: newGmail } = await Swal.fire({
            title: '📧 Ganti Gmail',
            text: `Gmail saat ini: ${currentGmail || 'Belum diatur'}`,
            input: 'email',
            inputPlaceholder: 'Masukkan Gmail baru...',
            inputValue: currentGmail || '',
            showCancelButton: true,
            confirmButtonText: '✅ Ganti',
            cancelButtonText: '❌ Batal',
            confirmButtonColor: '#4fc3f7',
            cancelButtonColor: '#666',
            background: '#1a0e2e',
            color: '#fff',
            preConfirm: (email) => {
                if (!validateEmail(email)) {
                    Swal.showValidationMessage('⚠️ Format Gmail tidak valid!');
                    return false;
                }
                return email.trim();
            }
        });

        if (newGmail && newGmail !== currentGmail) {
            const saved = saveGmailToStorage(newGmail);

            if (saved) {
                updateGmailDisplay();
                await loadAnnouncementByGmail();

                Swal.fire({
                    title: '✅ Gmail Diubah!',
                    text: `Gmail berhasil diubah menjadi: ${newGmail}`,
                    icon: 'success',
                    confirmButtonColor: '#4fc3f7',
                    background: '#1a0e2e',
                    color: '#fff',
                    timer: 2000,
                    timerProgressBar: true
                });
            } else {
                Swal.fire({
                    title: '❌ Gagal Menyimpan',
                    text: 'Terjadi error saat menyimpan Gmail. Coba lagi.',
                    icon: 'error',
                    confirmButtonColor: '#ff4444',
                    background: '#1a0e2e',
                    color: '#fff'
                });
            }
        } else if (newGmail === currentGmail) {
            Swal.fire({
                title: 'ℹ️ Sama',
                text: 'Gmail baru sama dengan yang lama. Tidak ada perubahan.',
                icon: 'info',
                confirmButtonColor: '#4fc3f7',
                background: '#1a0e2e',
                color: '#fff'
            });
        }
    }

    // ============================================================
    // 🔥 HANDLE BUTTON CLICK
    // ============================================================
    async function handleButtonClick(url) {
        // CEK GMAIL
        const gmailOk = await ensureGmail();
        if (!gmailOk && !getStoredGmail()) {
            console.log('❌ User membatalkan input Gmail, tidak lanjut navigasi');
            return;
        }

        // LANJUT NAVIGASI
        if (url) {
            if (url.startsWith('http://') || url.startsWith('https://')) {
                window.open(url, '_blank');
            } else {
                window.location.href = url;
            }
        }
    }

    // ============================================================
    // 🔥 ANTI INSPECT
    // ============================================================
    document.addEventListener("contextmenu", e => e.preventDefault());

    document.addEventListener("keydown", function(e) {
        const key = e.key.toLowerCase();
        if (e.key === "F12") e.preventDefault();
        if (e.ctrlKey && e.shiftKey && ["i", "c", "j"].includes(key)) e.preventDefault();
        if (e.ctrlKey && key === "u") e.preventDefault();
    });

    // ============================================================
    // 🔥 INIT
    // ============================================================
    window.addEventListener('load', async function() {
        // Update Gmail display
        updateGmailDisplay();

        // Load pengumuman berdasarkan Gmail
        await loadAnnouncementByGmail();

        console.log('🌸 Shine Shop Active!');
        console.log('📧 Gmail:', getStoredGmail() || 'Belum diatur');
        console.log('🆔 User ID:', userID);
        console.log('📢 Pengumuman berdasarkan Gmail');
    });

    // Event listener untuk tombol ubah Gmail
    document.getElementById('changeGmailBtn').addEventListener('click', changeGmailWithPassword);

    console.log('✅ Semua tombol telah di-handle dengan Gmail check');
    </script>

</body>
</html>
