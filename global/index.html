<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:'Poppins',sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    linear-gradient(rgba(0,0,0,0.75),rgba(0,0,0,0.75)),
    url('/home/logo.png') center/cover no-repeat fixed;
  color:white;
}
/* MENU */
.hamburger-btn {
    background:none;
    border:1px solid var(--border);
    padding:10px;
    border-radius:10px;
    cursor:pointer;
}

.hamburger-icon span {
    display:block;
    height:3px;
    width:24px;
    background:white;
    margin:4px 0;
}

/* OFFCANVAS */
.offcanvas {
    position:fixed;
    right:-260px;
    top:0;
    width:260px;
    height:100%;
    background:#111;
    padding:20px;
    transition:.3s;
    z-index:1000;
}

.offcanvas.open {
    right:0;
}

.overlay {
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    opacity:0;
    visibility:hidden;
    transition:.3s;
}

.overlay.show {
    opacity:1;
    visibility:visible;
}

.menu-list {
    list-style:none;
    padding:0;
}

.menu-list li {
    margin:10px 0;
}

.menu-list a {
    color:white;
    text-decoration:none;
}
:root{
  --border: rgba(255,255,255,0.15);
}
/* CONTENT */
.container {
    max-width:900px;
    margin:auto;
    padding:40px 20px;
}

.section {
    background:#151515;
    padding:25px;
    border-radius:14px;
    border:1px solid var(--border);
}
/* CONTAINER */
.container{
  width:90%;
  max-width:480px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(10px);
  border-radius:18px;
  padding:35px 25px;
  text-align:center;
  border:1px solid rgba(255,255,255,0.1);
}

/* TITLE */
h1{
  font-size:22px;
  font-weight:600;
  margin-bottom:30px;
  letter-spacing:1px;
}

/* BUTTON */
.nav-btn{
  width:100%;
  padding:14px;
  margin:10px 0;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.15);
  background:rgba(255,255,255,0.08);
  color:white;
  font-size:14px;
  font-weight:500;
  cursor:pointer;
  transition:0.25s;
}

.nav-btn:hover{
  background:rgba(255,255,255,0.18);
}

/* FOOTER */
.footer{
  margin-top:25px;
  font-size:12px;
  opacity:0.6;
}
</style>
   <!--BANNED! -->
  <script>
// ================= USER ID RANDOM =================
function generateUserID(){
  return 'user-' + Math.random().toString(36).substring(2,10) + '-' + Date.now().toString(36);
}

async function getUserID(){
  let id = localStorage.getItem("user_id");
  if(!id){
    id = generateUserID();
    localStorage.setItem("user_id", id);
  }
  return id;
}

// ================= USER BAN =================
async function checkUserBan(){
  try{
    const userID = await getUserID();

    const res = await fetch("/sosmed-2/payment/user.json",{cache:"no-store"});
    if(!res.ok) return;

    const list = await res.json();
    const banned = list.find(x => x.user === userID);

    if(banned){
      const reason = banned.reason || "Tidak ada keterangan";

      document.body.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:center;height:100vh;background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);color:white;text-align:center;">
      <div style="max-width:420px;background:rgba(255,255,255,.12);padding:30px;border-radius:22px;">
      <h1>🚫 Akses Diblokir</h1>
      <p>Akun kamu diblokir</p>
      <div>${reason}</div>
      <br>
      <small>User ID: ${userID}</small>
      </div></div>`;

      throw new Error("USER_BANNED");
    }
  }catch(e){
    if(e.message === "USER_BANNED") throw e;
  }
}
checkUserBan();
  </script>

  
</head>
