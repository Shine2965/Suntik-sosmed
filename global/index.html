<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shine Shop</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
    *{
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body{
        font-family: 'Poppins', sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
            linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)),
            url('/home/logo.png') center/cover no-repeat fixed;
        color: white;
    }

    /* MENU */
    .hamburger-btn {
        background: none;
        border: 1px solid var(--border);
        padding: 10px;
        border-radius: 10px;
        cursor: pointer;
    }

    .hamburger-icon span {
        display: block;
        height: 3px;
        width: 24px;
        background: white;
        margin: 4px 0;
    }

    /* OFFCANVAS */
    .offcanvas {
        position: fixed;
        right: -260px;
        top: 0;
        width: 260px;
        height: 100%;
        background: #111;
        padding: 20px;
        transition: .3s;
        z-index: 1000;
    }

    .offcanvas.open {
        right: 0;
    }

    .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.6);
        opacity: 0;
        visibility: hidden;
        transition: .3s;
    }

    .overlay.show {
        opacity: 1;
        visibility: visible;
    }

    .menu-list {
        list-style: none;
        padding: 0;
    }

    .menu-list li {
        margin: 10px 0;
    }

    .menu-list a {
        color: white;
        text-decoration: none;
    }

    :root{
        --border: rgba(255,255,255,0.15);
    }

    /* SECTION */
    .section {
        background: #151515;
        padding: 25px;
        border-radius: 14px;
        border: 1px solid var(--border);
    }

    /* CONTAINER (Sudah Diperbaiki) */
    .container{
        width: 90%;
        max-width: 480px;
        background: rgba(255,255,255,0.05);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px); /* Tambahan untuk safari */
        border-radius: 18px;
        padding: 35px 25px;
        text-align: center;
        border: 1px solid rgba(255,255,255,0.1);
    }

    /* TITLE */
    h1{
        font-size: 22px;
        font-weight: 600;
        margin-bottom: 30px;
        letter-spacing: 1px;
    }

    /* BUTTON */
    .nav-btn{
        width: 100%;
        padding: 14px;
        margin: 10px 0;
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.15);
        background: rgba(255,255,255,0.08);
        color: white;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: 0.25s;
    }

    .nav-btn:hover{
        background: rgba(255,255,255,0.18);
    }

    /* FOOTER */
    .footer{
        margin-top: 25px;
        font-size: 12px;
        opacity: 0.6;
    }
    </style>

</head>

<body>
    <div class="container">
        <h1>Shine Shop Menu Global</h1>

        <button class="nav-btn" onclick="location.href='/sunsosmed/'">
            Boost Sosmed 
        </button>
        <button class="nav-btn" onclick="location.href='/apprem/'">
            Aplikasi Premium 
        </button>
        <button class="nav-btn" onclick="location.href='/game/'">
            Top Up Game
        </button>
        <button class="nav-btn" onclick="location.href='/telegram/'"> 
            Telegram Market
        </button>
        
        <div class="footer">
            &copy; Shine Shop - 2023
        </div>
    </div> <!-- Mengembalikan div kontainer yang hilang -->
</body>
</html>
