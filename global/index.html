<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shine Shop</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
    *{
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body{
        font-family: 'Poppins', sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
            linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)),
            url('/home/logo.png') center/cover no-repeat fixed;
        color: white;
    }

    /* MENU */
    .hamburger-btn {
        background: none;
        border: 1px solid var(--border);
        padding: 10px;
        border-radius: 10px;
        cursor: pointer;
    }

    .hamburger-icon span {
        display: block;
        height: 3px;
        width: 24px;
        background: white;
        margin: 4px 0;
    }

    /* OFFCANVAS */
    .offcanvas {
        position: fixed;
        right: -260px;
        top: 0;
        width: 260px;
        height: 100%;
        background: #111;
        padding: 20px;
        transition: .3s;
        z-index: 1000;
    }

    .offcanvas.open {
        right: 0;
    }

    .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.6);
        opacity: 0;
        visibility: hidden;
        transition: .3s;
    }

    .overlay.show {
        opacity: 1;
        visibility: visible;
    }

    .menu-list {
        list-style: none;
        padding: 0;
    }

    .menu-list li {
        margin: 10px 0;
    }

    .menu-list a {
        color: white;
        text-decoration: none;
    }

    :root{
        --border: rgba(255,255,255,0.15);
    }

    /* SECTION */
    .section {
        background: #151515;
        padding: 25px;
        border-radius: 14px;
        border: 1px solid var(--border);
    }

    /* CONTAINER (Sudah Diperbaiki) */
    .container{
        width: 90%;
        max-width: 480px;
        background: rgba(255,255,255,0.05);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px); /* Tambahan untuk safari */
        border-radius: 18px;
        padding: 35px 25px;
        text-align: center;
        border: 1px solid rgba(255,255,255,0.1);
    }

    /* TITLE */
    h1{
        font-size: 22px;
        font-weight: 600;
        margin-bottom: 30px;
        letter-spacing: 1px;
    }

    /* BUTTON */
    .nav-btn{
        width: 100%;
        padding: 14px;
        margin: 10px 0;
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.15);
        background: rgba(255,255,255,0.08);
        color: white;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: 0.25s;
    }

    .nav-btn:hover{
        background: rgba(255,255,255,0.18);
    }

    /* FOOTER */
    .footer{
        margin-top: 25px;
        font-size: 12px;
        opacity: 0.6;
    }
    </style>

    <!-- BANNED SYSTEM -->
    <script>
    function generateUserID(){
        return 'user-' + Math.random().toString(36).substring(2,10) + '-' + Date.now().toString(36);
    }

    async function getUserID(){
        let id = localStorage.getItem("user_id");
        if(!id){
            id = generateUserID();
            localStorage.setItem("user_id", id);
        }
        return id;
    }

    async function checkUserBan(){
        try{
            const userID = await getUserID();
            const res = await fetch("/sosmed-2/payment/user.json",{cache:"no-store"});
            if(!res.ok) return;

            const list = await res.json();
            const banned = list.find(x => x.user === userID);

            if(banned){
                const reason = banned.reason || "Tidak ada keterangan";
                document.body.innerHTML = `
                <div style="display:flex;align-items:center;justify-content:center;height:100vh;background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);color:white;text-align:center;">
                    <div style="max-width:420px;background:rgba(255,255,255,.12);padding:30px;border-radius:22px;box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);backdrop-filter: blur(5px);">
                        <h1>🚫 Akses Diblokir</h1>
                        <p>Akun kamu diblokir</p>
                        <div style="margin: 15px 0; padding: 10px; background: rgba(255,0,0,0.2); border-radius: 8px;">${reason}</div>
                        <small style="opacity:0.7;">User ID: ${userID}</small>
                    </div>
                </div>`;
                throw new Error("USER_BANNED");
            }
        }catch(e){
            if(e.message === "USER_BANNED") throw e;
        }
    }
    checkUserBan();
    </script>
</head>

<body>
    <div class="container">
        <h1>Shine Shop Menu Global</h1>

        <button class="nav-btn" onclick="location.href='/sunsosmed/'">
            Boost Sosmed 
        </button>
        <button class="nav-btn" onclick="location.href='/apprem/'">
            Aplikasi Premium 
        </button>
        <button class="nav-btn" onclick="location.href='/game/'">
            Top Up Game
        </button>
        <button class="nav-btn" onclick="location.href='/telegram/'"> 
            Telegram Market
        </button>
        
        <div class="footer">
            &copy; Shine Shop - 2023
        </div>
    </div> <!-- Mengembalikan div kontainer yang hilang -->
</body>
</html>
