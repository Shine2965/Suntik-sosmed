<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - Shine Shop</title>
<style>
    body { font-family: Poppins, sans-serif; background:#0f172a; color:white; margin:0; padding:20px; }
    .card { background:#1e293b; padding:20px; border-radius:14px; max-width:480px; margin:auto; }
    h1 { text-align:center; }
    .btn { width:100%; padding:12px; background:#22c55e; border:none; border-radius:10px; margin-top:20px; font-size:16px; color:white; cursor:pointer; }
    .saldo-box { background:#0f172a; padding:14px; border-radius:10px; margin-top:10px; text-align:center; font-size:22px; }
</style>
</head>
<body>

<div class="card">
    <h1>Admin Dashboard</h1>

    <h3>Saldo Anda</h3>
    <div id="saldo_display" class="saldo-box">Memuat...</div>

    <button class="btn" onclick="location.href='/pencairan/'">💸 Menu Pencairan Saldo</button>
</div>

<script>
// Ambil data dari credentials.json (tanpa backend)
async function loadSaldo() {
    try {
        const res = await fetch("/credentials.json");
        const data = await res.json();

        // saldo langsung dari file
        const saldo = Number(data.saldo);

        document.getElementById("saldo_display").innerText =
            "Rp " + saldo.toLocaleString("id-ID");

    } catch (err) {
        document.getElementById("saldo_display").innerText = "Gagal memuat saldo";
    }
}

loadSaldo();
</script>

</body>
</html>
