<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Admin Panel - Shine Shop</title>
<style>
  :root{
    --bg:#1e1b4b;
    --accent:#22c55e;
    --text:#f8fafc;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:Inter,Segoe UI,system-ui,Arial;
    background:linear-gradient(160deg,#0f172a,#1e1b4b);
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
  }
  .container{
    max-width:650px;
    width:100%;
    background:rgba(255,255,255,0.05);
    border-radius:16px;
    padding:28px;
    box-shadow:0 8px 30px rgba(2,6,23,0.7);
    text-align:center;
    position:relative;
  }
  h1{
    font-size:24px;
    margin-bottom:24px;
    color:var(--accent);
  }
  nav{display:flex;flex-direction:column;gap:12px}
  .nav-btn {
    background: linear-gradient(135deg, #22c55e, #16a34a);
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    transition: transform 0.2s ease, background 0.3s ease;
  }
  .nav-btn:hover {
    transform: translateY(-2px);
    background: linear-gradient(135deg, #15803d, #22c55e);
  }
  .marquee {
    width:100%;
    overflow:hidden;
    white-space:nowrap;
    margin-bottom:20px;
    color:#22c55e;
    font-weight:bold;
  }
  .marquee span {
    display:inline-block;
    padding-left:100%;
    animation:marquee 10s linear infinite;
  }
  @keyframes marquee {
    0% { transform: translate(0,0); }
    100% { transform: translate(-100%,0); }
  }
  .logout {
    margin-top:20px;
    background:#ef4444;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
  }
  .logout:hover { background:#dc2626; }
</style>
</head>
<body>
  <div class="container">
    <div class="marquee"><span id="welcomeText">Selamat datang admin...</span></div>
    <h1>Admin Panel Shine Shop</h1>
    <nav>
      <button class="nav-btn" onclick="window.location.href='/topupgame/'">💎 Top up game</button>
      <button class="nav-btn" onclick="window.location.href='/dashboard/'">🚀 Suntik sosmed</button>
      <button class="nav-btn" onclick="window.location.href='/kontaksmm/'">🎧 Customer Service</button>
      <button class="nav-btn" onclick="window.location.href='/informasi/'">🔔 Informasi</button>
    </nav>
    <button class="logout" onclick="logout()">Logout</button>
  </div>

<script>
  // Ambil nama admin dari localStorage
  const adminName = localStorage.getItem("adminName") || "Tidak Dikenal";
  document.getElementById("welcomeText").textContent = 
    `Selamat datang admin ${adminName} di admin panel Shine Shop`;

  function logout(){
    localStorage.removeItem("adminName");
    window.location.href = "/";
  }
</script>
</body>
</html>
