<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - Shine Shop</title>

<!-- Google Font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
    body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: white;
        margin: 0;
        padding: 20px;
    }

    /* Running Text */
    .marquee {
        width: 100%;
        overflow: hidden;
        white-space: nowrap;
        box-sizing: border-box;
        background: rgba(255,255,255,0.05);
        padding: 12px 0;
        font-size: 17px;
        font-weight: 600;
        border-radius: 10px;
        backdrop-filter: blur(10px);
        margin-bottom: 20px;
    }

    .marquee span {
        display: inline-block;
        padding-left: 100%;
        animation: marquee 10s linear infinite;
    }

    @keyframes marquee {
        0% { transform: translate(0, 0); }
        100% { transform: translate(-100%, 0); }
    }

    /* Card Style Modern */
    .card {
        background: rgba(255,255,255,0.08);
        backdrop-filter: blur(14px);
        padding: 25px;
        border-radius: 20px;
        max-width: 460px;
        margin: auto;
        box-shadow: 0 8px 25px rgba(0,0,0,0.25);
        border: 1px solid rgba(255,255,255,0.1);
    }

    h1 {
        text-align: center;
        font-weight: 700;
        letter-spacing: 1px;
    }

    h3 {
        margin-top: 25px;
    }

    .saldo-box {
        background: rgba(255,255,255,0.1);
        padding: 16px;
        border-radius: 14px;
        margin-top: 10px;
        text-align: center;
        font-size: 24px;
        font-weight: 700;
        border: 1px solid rgba(255,255,255,0.15);
        backdrop-filter: blur(10px);
    }

    .btn {
        width: 100%;
        padding: 14px;
        background: #22c55e;
        border: none;
        border-radius: 14px;
        margin-top: 25px;
        font-size: 17px;
        font-weight: 600;
        color: white;
        cursor: pointer;
        transition: 0.25s;
        letter-spacing: 0.5px;
    }

    .btn:hover {
        transform: scale(1.03);
        background: #2dd46f;
    }
</style>
</head>
<body>

<!-- Running text -->
<div class="marquee">
    <span>Selamat datang {username} — semoga harimu menyenangkan! ✨</span>
</div>

<div class="card">
    <h1>Admin Dashboard</h1>

    <h3>Saldo Anda</h3>
    <div id="saldo_display" class="saldo-box">Memuat...</div>

    <button class="btn" onclick="location.href='/pencairan/'">💸 Menu Pencairan Saldo</button>
</div>

<script>
// Ambil data dari /home/data.json (TANPA ENCODE)
async function loadSaldo() {
    try {
        const res = await fetch("/home/data.json");
        const data = await res.json();

        const saldo = Number(data.saldo);

        document.getElementById("saldo_display").innerText =
            "Rp " + saldo.toLocaleString("id-ID");

    } catch (err) {
        document.getElementById("saldo_display").innerText = "Gagal memuat saldo";
    }
}

loadSaldo();
</script>

</body>
</html>
