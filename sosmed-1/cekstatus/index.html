<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Status & Refill Pesanan - Shine Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.025em;
        }
        .status-pending { background: #fef3c7; color: #92400e; }
        .status-processing { background: #dbeafe; color: #1e40af; }
        .status-success, .status-completed { background: #d1fae5; color: #065f46; }
        .status-error, .status-failed, .status-rejected { background: #fee2e2; color: #991b1b; }
        .status-partial { background: #ffedd5; color: #9a3412; }
        .status-unknown { background: #f3f4f6; color: #374151; }
        .card-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .tab-active { border-bottom: 3px solid #2563eb; color: #2563eb; font-weight: 600; }
        .tab-inactive { border-bottom: 3px solid transparent; color: #6b7280; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-blue-50 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-3xl">
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-2xl shadow-lg mb-4">
                <i class="fas fa-box-open text-white text-2xl"></i>
            </div>
            <h1 class="text-3xl font-bold text-gray-800 mb-2">Cek Status & Refill Pesanan suntik sosmed 1</h1>
            <p class="text-gray-500">Kelola status pesanan dan permintaan refill dengan mudah</p>
        </div>

        <!-- Tabs -->
        <div class="flex border-b border-gray-200 mb-6">
            <button onclick="switchTab('order')" id="tab-order" class="flex-1 py-3 text-center tab-active transition">
                <i class="fas fa-clipboard-list mr-2"></i>Status Pesanan
            </button>
            <button onclick="switchTab('refill')" id="tab-refill" class="flex-1 py-3 text-center tab-inactive transition">
                <i class="fas fa-sync-alt mr-2"></i>Status Refill
            </button>
        </div>

        <!-- ==================== TAB: ORDER ==================== -->
        <div id="panel-order">
            <!-- Form Card Order -->
            <div class="bg-white rounded-2xl shadow-xl p-6 mb-6 border border-gray-100">
                <div class="mb-4">
                    <label for="orderId" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-hashtag mr-1 text-blue-500"></i> ID Pesanan
                    </label>
                    <textarea 
                        id="orderId" 
                        rows="3"
                        placeholder="Masukkan ID pesanan (satu atau lebih, pisahkan dengan koma atau spasi)&#10;Contoh: 1107, 1234, 5678"
                        class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition resize-none text-gray-800 placeholder-gray-400"
                    ></textarea>
                    <p class="text-xs text-gray-400 mt-2">
                        <i class="fas fa-info-circle mr-1"></i>
                        Bisa cek / refill multiple order sekaligus
                    </p>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <button 
                        id="cekBtn"
                        onclick="cekStatus()"
                        class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 px-6 rounded-xl transition duration-200 flex items-center justify-center gap-2 shadow-md hover:shadow-lg disabled:opacity-60 disabled:cursor-not-allowed"
                    >
                        <i class="fas fa-search" id="btnIcon"></i>
                        <span id="btnText">Cek Status</span>
                    </button>

                    <button 
                        id="refillBtn"
                        onclick="refillOrder()"
                        class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3.5 px-6 rounded-xl transition duration-200 flex items-center justify-center gap-2 shadow-md hover:shadow-lg disabled:opacity-60 disabled:cursor-not-allowed"
                    >
                        <i class="fas fa-sync-alt" id="refillBtnIcon"></i>
                        <span id="refillBtnText">Refill Pesanan</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- ==================== TAB: REFILL STATUS ==================== -->
        <div id="panel-refill" class="hidden">
            <div class="bg-white rounded-2xl shadow-xl p-6 mb-6 border border-gray-100">
                <div class="mb-4">
                    <label for="refillId" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-hashtag mr-1 text-emerald-500"></i> ID Refill
                    </label>
                    <textarea 
                        id="refillId" 
                        rows="2"
                        placeholder="Masukkan ID Refill (satu atau lebih, pisahkan dengan koma atau spasi)&#10;Contoh: 123, 456"
                        class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition resize-none text-gray-800 placeholder-gray-400"
                    ></textarea>
                    <p class="text-xs text-gray-400 mt-2">
                        <i class="fas fa-info-circle mr-1"></i>
                        ID Refill didapat setelah berhasil request refill
                    </p>
                </div>

                <button 
                    id="cekRefillBtn"
                    onclick="cekRefillStatus()"
                    class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3.5 px-6 rounded-xl transition duration-200 flex items-center justify-center gap-2 shadow-md hover:shadow-lg disabled:opacity-60 disabled:cursor-not-allowed"
                >
                    <i class="fas fa-search" id="cekRefillBtnIcon"></i>
                    <span id="cekRefillBtnText">Cek Status Refill</span>
                </button>
            </div>
        </div>

        <!-- Loading -->
        <div id="loading" class="hidden text-center py-8">
            <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-blue-500 border-t-transparent"></div>
            <p class="text-gray-500 mt-3" id="loadingText">Sedang memproses...</p>
        </div>

        <!-- Results -->
        <div id="results" class="space-y-4"></div>

        <!-- Error -->
        <div id="errorBox" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl fade-in">
            <div class="flex items-start gap-3">
                <i class="fas fa-exclamation-circle mt-0.5"></i>
                <div>
                    <p class="font-medium" id="errorTitle">Terjadi Kesalahan</p>
                    <p class="text-sm mt-1" id="errorMsg"></p>
                </div>
            </div>
        </div>

        <!-- Success Toast-like -->
        <div id="successBox" class="hidden bg-emerald-50 border border-emerald-200 text-emerald-700 px-4 py-3 rounded-xl fade-in">
            <div class="flex items-start gap-3">
                <i class="fas fa-check-circle mt-0.5"></i>
                <div>
                    <p class="font-medium" id="successTitle">Berhasil</p>
                    <p class="text-sm mt-1" id="successMsg"></p>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center mt-10 text-sm text-gray-400">
            <p>Powered by Shine Shop</p>
        </div>
    </div>

    <script>
        const API_ID = 81074;
        const API_KEY = 'f0ugsa-n4ntem-ruhdvz-afehho-4uqw1k';

        const ENDPOINTS = {
            status: 'https://irvankedesmm.co.id/api/status',
            refill: 'https://irvankedesmm.co.id/api/refill',
            refillStatus: 'https://irvankedesmm.co.id/api/refill/status'
        };

        // ==================== UI Helpers ====================
        function switchTab(tab) {
            const orderTab = document.getElementById('tab-order');
            const refillTab = document.getElementById('tab-refill');
            const orderPanel = document.getElementById('panel-order');
            const refillPanel = document.getElementById('panel-refill');

            document.getElementById('results').innerHTML = '';
            hideError();
            hideSuccess();

            if (tab === 'order') {
                orderTab.classList.add('tab-active');
                orderTab.classList.remove('tab-inactive');
                refillTab.classList.add('tab-inactive');
                refillTab.classList.remove('tab-active');
                orderPanel.classList.remove('hidden');
                refillPanel.classList.add('hidden');
            } else {
                refillTab.classList.add('tab-active');
                refillTab.classList.remove('tab-inactive');
                orderTab.classList.add('tab-inactive');
                orderTab.classList.remove('tab-active');
                refillPanel.classList.remove('hidden');
                orderPanel.classList.add('hidden');
            }
        }

        function getStatusClass(status) {
            if (!status) return 'status-unknown';
            const s = status.toLowerCase();
            if (s === 'pending') return 'status-pending';
            if (s === 'processing') return 'status-processing';
            if (s === 'success' || s === 'completed') return 'status-success';
            if (s === 'error' || s === 'failed' || s === 'rejected') return 'status-error';
            if (s === 'partial') return 'status-partial';
            return 'status-unknown';
        }

        function getStatusIcon(status) {
            if (!status) return 'fa-question';
            const s = status.toLowerCase();
            if (s === 'pending') return 'fa-clock';
            if (s === 'processing') return 'fa-spinner';
            if (s === 'success' || s === 'completed') return 'fa-check-circle';
            if (s === 'error' || s === 'failed' || s === 'rejected') return 'fa-times-circle';
            if (s === 'partial') return 'fa-adjust';
            return 'fa-question';
        }

        function formatNumber(num) {
            if (num === undefined || num === null) return '-';
            return new Intl.NumberFormat('id-ID').format(num);
        }

        function parseIds(input) {
            return input
                .split(/[\s,]+/)
                .map(id => id.trim())
                .filter(id => id.length > 0);
        }

        function showLoading(text = 'Sedang memproses...') {
            document.getElementById('loadingText').textContent = text;
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('results').innerHTML = '';
            hideError();
            hideSuccess();
        }

        function hideLoading() {
            document.getElementById('loading').classList.add('hidden');
        }

        function showError(title, msg) {
            document.getElementById('errorTitle').textContent = title;
            document.getElementById('errorMsg').textContent = msg;
            document.getElementById('errorBox').classList.remove('hidden');
            document.getElementById('successBox').classList.add('hidden');
        }

        function hideError() {
            document.getElementById('errorBox').classList.add('hidden');
        }

        function showSuccess(title, msg) {
            document.getElementById('successTitle').textContent = title;
            document.getElementById('successMsg').textContent = msg;
            document.getElementById('successBox').classList.remove('hidden');
            document.getElementById('errorBox').classList.add('hidden');
        }

        function hideSuccess() {
            document.getElementById('successBox').classList.add('hidden');
        }

        function setButtonLoading(btnId, iconId, textId, loading, defaultText, defaultIcon) {
            const btn = document.getElementById(btnId);
            const icon = document.getElementById(iconId);
            const text = document.getElementById(textId);
            btn.disabled = loading;
            if (loading) {
                icon.className = 'fas fa-spinner fa-spin';
                text.textContent = 'Memproses...';
            } else {
                icon.className = 'fas ' + defaultIcon;
                text.textContent = defaultText;
            }
        }

        // ==================== Card Renderers ====================
        function createOrderCard(id, data) {
            const isFound = data.status && !String(data.msg || '').toLowerCase().includes('tidak ditemukan');
            const status = data.status || 'Tidak Ditemukan';
            const statusClass = getStatusClass(status);
            const statusIcon = getStatusIcon(status);

            return `
                <div class="bg-white rounded-2xl shadow-md border border-gray-100 p-5 card-hover transition-all duration-200 fade-in">
                    <div class="flex items-start justify-between mb-4">
                        <div>
                            <p class="text-xs text-gray-400 uppercase tracking-wide font-medium">Order ID</p>
                            <p class="text-xl font-bold text-gray-800">#${id}</p>
                        </div>
                        <span class="status-badge ${statusClass}">
                            <i class="fas ${statusIcon} mr-1"></i>${status}
                        </span>
                    </div>
                    
                    ${isFound ? `
                        <div class="grid grid-cols-2 gap-4 mt-4 pt-4 border-t border-gray-100">
                            <div>
                                <p class="text-xs text-gray-400 mb-1">Charge</p>
                                <p class="font-semibold text-gray-800">Rp ${formatNumber(data.charge)}</p>
                            </div>
                            <div>
                                <p class="text-xs text-gray-400 mb-1">Start Count</p>
                                <p class="font-semibold text-gray-800">${formatNumber(data.start_count)}</p>
                            </div>
                            <div>
                                <p class="text-xs text-gray-400 mb-1">Remains</p>
                                <p class="font-semibold text-gray-800">${formatNumber(data.remains)}</p>
                            </div>
                            <div>
                                <p class="text-xs text-gray-400 mb-1">Pesan</p>
                                <p class="font-medium text-gray-600 text-sm">${data.msg || '-'}</p>
                            </div>
                        </div>
                    ` : `
                        <div class="mt-3 pt-3 border-t border-gray-100">
                            <p class="text-sm text-red-500">
                                <i class="fas fa-info-circle mr-1"></i>
                                ${data.msg || 'Pesanan tidak ditemukan.'}
                            </p>
                        </div>
                    `}
                </div>
            `;
        }

        function createRefillResultCard(id, data, isRequest = false) {
            if (isRequest) {
                // Result of requesting refill
                const success = data.status === true;
                return `
                    <div class="bg-white rounded-2xl shadow-md border border-gray-100 p-5 card-hover transition-all duration-200 fade-in">
                        <div class="flex items-start justify-between mb-3">
                            <div>
                                <p class="text-xs text-gray-400 uppercase tracking-wide font-medium">Order ID</p>
                                <p class="text-xl font-bold text-gray-800">#${id}</p>
                            </div>
                            <span class="status-badge ${success ? 'status-success' : 'status-error'}">
                                <i class="fas ${success ? 'fa-check-circle' : 'fa-times-circle'} mr-1"></i>
                                ${success ? 'Berhasil' : 'Gagal'}
                            </span>
                        </div>
                        <div class="mt-3 pt-3 border-t border-gray-100">
                            <p class="text-sm ${success ? 'text-emerald-600' : 'text-red-500'}">
                                <i class="fas ${success ? 'fa-info-circle' : 'fa-exclamation-circle'} mr-1"></i>
                                ${data.msg || (success ? 'Refill berhasil dibuat.' : 'Gagal membuat refill.')}
                            </p>
                            ${success && data.data?.refill ? `
                                <div class="mt-3 bg-emerald-50 rounded-lg p-3">
                                    <p class="text-xs text-emerald-600 mb-1">ID Refill</p>
                                    <p class="font-bold text-emerald-800 text-lg">#${data.data.refill}</p>
                                    <p class="text-xs text-emerald-500 mt-1">Gunakan ID ini di tab Status Refill untuk memantau</p>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }

            // Result of checking refill status
            const isFound = data.status === true && data.data;
            const refillStatus = data.data?.refill_status || 'Tidak Ditemukan';
            const statusClass = getStatusClass(refillStatus);
            const statusIcon = getStatusIcon(refillStatus);

            return `
                <div class="bg-white rounded-2xl shadow-md border border-gray-100 p-5 card-hover transition-all duration-200 fade-in">
                    <div class="flex items-start justify-between mb-4">
                        <div>
                            <p class="text-xs text-gray-400 uppercase tracking-wide font-medium">Refill ID</p>
                            <p class="text-xl font-bold text-gray-800">#${data.data?.refill_id || id}</p>
                        </div>
                        <span class="status-badge ${statusClass}">
                            <i class="fas ${statusIcon} mr-1"></i>${refillStatus}
                        </span>
                    </div>
                    <div class="mt-3 pt-3 border-t border-gray-100">
                        <p class="text-sm ${isFound ? 'text-gray-600' : 'text-red-500'}">
                            <i class="fas fa-info-circle mr-1"></i>
                            ${data.msg || (isFound ? 'Refill ditemukan.' : 'Refill tidak ditemukan.')}
                        </p>
                    </div>
                </div>
            `;
        }

        // ==================== API Calls ====================
        async function apiPost(url, ids) {
            const formData = new URLSearchParams();
            formData.append('api_id', API_ID);
            formData.append('api_key', API_KEY);
            formData.append('id', ids.join(','));

            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData
            });

            if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
            return await response.json();
        }

        // Cek Status Pesanan
        async function cekStatus() {
            const orderInput = document.getElementById('orderId').value.trim();
            const resultsDiv = document.getElementById('results');

            if (!orderInput) {
                showError('Input Kosong', 'Silakan masukkan minimal satu ID pesanan.');
                return;
            }

            const ids = parseIds(orderInput);
            if (ids.length === 0) {
                showError('Input Tidak Valid', 'Tidak ada ID pesanan yang valid.');
                return;
            }

            setButtonLoading('cekBtn', 'btnIcon', 'btnText', true, 'Cek Status', 'fa-search');
            showLoading('Sedang mengecek status pesanan...');

            try {
                const data = await apiPost(ENDPOINTS.status, ids);
                hideLoading();

                if (data.status === false && !data.orders) {
                    resultsDiv.innerHTML = createOrderCard(ids[0], { msg: data.msg, status: null });
                } else if (data.orders) {
                    let html = '';
                    for (const [orderId, orderData] of Object.entries(data.orders)) {
                        html += createOrderCard(orderId, orderData);
                    }
                    resultsDiv.innerHTML = html;
                } else if (data.status === true && data.data) {
                    resultsDiv.innerHTML = createOrderCard(data.data.id || ids[0], {
                        ...data.data,
                        msg: data.msg
                    });
                } else {
                    showError('Respon Tidak Dikenal', JSON.stringify(data));
                }
            } catch (err) {
                hideLoading();
                showError('Gagal Terhubung', err.message || 'Tidak dapat terhubung ke server.');
            } finally {
                setButtonLoading('cekBtn', 'btnIcon', 'btnText', false, 'Cek Status', 'fa-search');
            }
        }

        // Request Refill
        async function refillOrder() {
            const orderInput = document.getElementById('orderId').value.trim();
            const resultsDiv = document.getElementById('results');

            if (!orderInput) {
                showError('Input Kosong', 'Silakan masukkan minimal satu ID pesanan untuk di-refill.');
                return;
            }

            const ids = parseIds(orderInput);
            if (ids.length === 0) {
                showError('Input Tidak Valid', 'Tidak ada ID pesanan yang valid.');
                return;
            }

            setButtonLoading('refillBtn', 'refillBtnIcon', 'refillBtnText', true, 'Refill Pesanan', 'fa-sync-alt');
            showLoading('Sedang meminta refill...');

            try {
                // Support multiple: call one by one or assume API supports comma
                // We'll try mass first, fallback to sequential if needed
                let html = '';
                let hasSuccess = false;

                // Try mass request first
                const data = await apiPost(ENDPOINTS.refill, ids);

                hideLoading();

                // Handle response
                if (data.status === true && data.data) {
                    // Single success
                    html = createRefillResultCard(ids[0], data, true);
                    hasSuccess = true;
                    showSuccess('Refill Berhasil', data.msg || `Refill #${data.data.refill} berhasil dibuat.`);
                } else if (data.orders || data.data?.orders) {
                    // Mass style (if supported)
                    const orders = data.orders || data.data.orders;
                    for (const [orderId, orderData] of Object.entries(orders)) {
                        html += createRefillResultCard(orderId, orderData, true);
                        if (orderData.status === true) hasSuccess = true;
                    }
                } else if (data.status === false) {
                    // Single fail or overall fail
                    html = createRefillResultCard(ids[0], data, true);
                } else {
                    // Unknown, try sequential for multiple
                    if (ids.length > 1) {
                        for (const id of ids) {
                            try {
                                const singleData = await apiPost(ENDPOINTS.refill, [id]);
                                html += createRefillResultCard(id, singleData, true);
                                if (singleData.status === true) hasSuccess = true;
                            } catch (e) {
                                html += createRefillResultCard(id, { status: false, msg: e.message }, true);
                            }
                        }
                    } else {
                        html = createRefillResultCard(ids[0], data, true);
                    }
                }

                resultsDiv.innerHTML = html;

                if (hasSuccess) {
                    // Auto switch hint
                    setTimeout(() => {
                        // Optional: bisa auto isi refill ID, tapi biarkan user copy manual
                    }, 500);
                }

            } catch (err) {
                hideLoading();
                // Fallback sequential for multiple IDs
                if (ids.length > 1) {
                    let html = '';
                    for (const id of ids) {
                        try {
                            const singleData = await apiPost(ENDPOINTS.refill, [id]);
                            html += createRefillResultCard(id, singleData, true);
                        } catch (e) {
                            html += createRefillResultCard(id, { status: false, msg: e.message }, true);
                        }
                    }
                    resultsDiv.innerHTML = html;
                } else {
                    showError('Gagal Terhubung', err.message || 'Tidak dapat terhubung ke server.');
                }
            } finally {
                setButtonLoading('refillBtn', 'refillBtnIcon', 'refillBtnText', false, 'Refill Pesanan', 'fa-sync-alt');
            }
        }

        // Cek Status Refill
        async function cekRefillStatus() {
            const refillInput = document.getElementById('refillId').value.trim();
            const resultsDiv = document.getElementById('results');

            if (!refillInput) {
                showError('Input Kosong', 'Silakan masukkan minimal satu ID Refill.');
                return;
            }

            const ids = parseIds(refillInput);
            if (ids.length === 0) {
                showError('Input Tidak Valid', 'Tidak ada ID Refill yang valid.');
                return;
            }

            setButtonLoading('cekRefillBtn', 'cekRefillBtnIcon', 'cekRefillBtnText', true, 'Cek Status Refill', 'fa-search');
            showLoading('Sedang mengecek status refill...');

            try {
                let html = '';

                // API mungkin support mass atau single. Kita coba mass dulu.
                const data = await apiPost(ENDPOINTS.refillStatus, ids);

                hideLoading();

                if (data.status === true && data.data) {
                    // Single
                    html = createRefillResultCard(ids[0], data, false);
                } else if (data.orders || (data.data && typeof data.data === 'object' && !data.data.refill_id)) {
                    const orders = data.orders || data.data;
                    for (const [rid, rdata] of Object.entries(orders)) {
                        html += createRefillResultCard(rid, rdata.status !== undefined ? rdata : { status: true, data: rdata, msg: rdata.msg }, false);
                    }
                } else if (data.status === false) {
                    html = createRefillResultCard(ids[0], data, false);
                } else {
                    // Sequential fallback
                    for (const id of ids) {
                        try {
                            const single = await apiPost(ENDPOINTS.refillStatus, [id]);
                            html += createRefillResultCard(id, single, false);
                        } catch (e) {
                            html += createRefillResultCard(id, { status: false, msg: e.message }, false);
                        }
                    }
                }

                resultsDiv.innerHTML = html || '<p class="text-center text-gray-500">Tidak ada data.</p>';

            } catch (err) {
                hideLoading();
                if (ids.length > 1) {
                    let html = '';
                    for (const id of ids) {
                        try {
                            const single = await apiPost(ENDPOINTS.refillStatus, [id]);
                            html += createRefillResultCard(id, single, false);
                        } catch (e) {
                            html += createRefillResultCard(id, { status: false, msg: e.message }, false);
                        }
                    }
                    resultsDiv.innerHTML = html;
                } else {
                    showError('Gagal Terhubung', err.message || 'Tidak dapat terhubung ke server.');
                }
            } finally {
                setButtonLoading('cekRefillBtn', 'cekRefillBtnIcon', 'cekRefillBtnText', false, 'Cek Status Refill', 'fa-search');
            }
        }

        // Enter key support
        document.getElementById('orderId').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                cekStatus();
            }
        });

        document.getElementById('refillId').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                cekRefillStatus();
            }
        });
    </script>
</body>
</html>
