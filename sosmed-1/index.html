<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suntik Sosmed 1 - Shine Shop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0b1220;
            color: #f1f5f9;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            background: rgba(17, 24, 39, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 28px 30px 32px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .header h1 {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(135deg, #8b5cf6, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .header .sub {
            color: #94a3b8;
            font-size: 13px;
            margin-top: 4px;
            letter-spacing: 0.3px;
        }

        .header .badge {
            display: inline-block;
            background: rgba(6, 182, 212, 0.12);
            border: 1px solid rgba(6, 182, 212, 0.2);
            color: #06b6d4;
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 6px;
            letter-spacing: 0.5px;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            margin-top: 18px;
            margin-bottom: 4px;
        }

        select,
        input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(11, 18, 32, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            color: #f1f5f9;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
            appearance: auto;
        }

        select:focus,
        input:focus {
            outline: none;
            border-color: #06b6d4;
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.12);
        }

        select option {
            background: #111827;
            color: #f1f5f9;
        }

        .sort-info {
            display: inline-block;
            font-size: 11px;
            color: #94a3b8;
            background: rgba(255, 255, 255, 0.04);
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            margin-top: 6px;
        }

        .info-box {
            margin-top: 14px;
            padding: 16px 18px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            border: 1px dashed rgba(255, 255, 255, 0.06);
            font-size: 13px;
            color: #94a3b8;
            line-height: 1.7;
            min-height: 60px;
            transition: all 0.2s;
        }

        .info-box .name {
            color: #f1f5f9;
            font-size: 16px;
            font-weight: 600;
        }

        .info-box .price {
            color: #34d399;
            font-weight: 700;
            font-size: 18px;
        }

        .info-box .detail {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-top: 8px;
            font-size: 13px;
        }

        .info-box .detail span {
            background: rgba(255, 255, 255, 0.04);
            padding: 2px 12px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .info-box .desc {
            margin-top: 8px;
            color: #94a3b8;
            font-size: 13px;
        }

        .info-box .comment-tag {
            display: inline-block;
            background: rgba(251, 191, 36, 0.12);
            color: #fbbf24;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 8px;
        }

        .loading {
            text-align: center;
            color: #94a3b8;
            padding: 30px 0;
            font-size: 14px;
        }

        .loading .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 2px solid rgba(255, 255, 255, 0.06);
            border-top: 2px solid #06b6d4;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .error-box {
            padding: 20px;
            background: rgba(248, 113, 113, 0.06);
            border: 1px solid #f87171;
            border-radius: 12px;
            color: #f87171;
            text-align: center;
            margin: 10px 0;
        }

        .error-box .retry-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f1f5f9;
            padding: 8px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            margin-top: 12px;
            transition: all 0.2s;
        }

        .error-box .retry-btn:hover {
            background: rgba(139, 92, 246, 0.15);
            border-color: #8b5cf6;
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 11px;
            color: #475569;
            letter-spacing: 0.3px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 16px 14px 20px;
            }
            .header h1 {
                font-size: 20px;
            }
            .info-box .detail {
                gap: 10px;
                font-size: 12px;
            }
            select,
            input {
                padding: 10px 12px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <h1>✦ Suntik Sosmed 1</h1>
            <div class="sub">Shine Shop — Pilih layanan favoritmu</div>
            <div class="badge">⚡ Powered by Ivankarde</div>
        </div>

        <!-- LOADING INDICATOR -->
        <div id="loadingIndicator" class="loading" style="display:none;">
            <span class="spinner"></span> Memuat data layanan...
        </div>

        <!-- SEARCH -->
        <label for="search">🔍 Cari Layanan</label>
        <input type="text" id="search" placeholder="Ketik nama atau ID layanan..." autocomplete="off">

        <!-- KATEGORI + SORT BADGE -->
        <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-top:10px;">
            <div style="flex:2;min-width:160px;">
                <label for="kategori">📂 Kategori</label>
                <select id="kategori">
                    <option value="">-- Pilih Kategori --</option>
                </select>
            </div>
            <div style="flex:1;min-width:100px;padding-bottom:2px;">
                <span class="sort-info">⬆️ Termurah → Termahal</span>
            </div>
        </div>

        <!-- LAYANAN -->
        <label for="layanan">📦 Layanan</label>
        <select id="layanan">
            <option value="">-- Pilih Layanan --</option>
        </select>

        <!-- INFO LAYANAN -->
        <div class="info-box" id="infoLayanan">
            <span style="color:#475569;">Pilih kategori &amp; layanan untuk melihat detail</span>
        </div>

        <!-- FOOTER -->
        <div class="footer">
            Shine Shop © 2026 — Suntik Sosmed 1
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ===== KONFIGURASI =====
            const API_ENDPOINT = '/api/ivankarde-services';

            let layananData = {};
            let selectedService = null;
            let isLoading = false;
            let searchTimer = null;

            // ===== DOM REFS =====
            const kategoriEl = document.getElementById('kategori');
            const layananEl = document.getElementById('layanan');
            const infoEl = document.getElementById('infoLayanan');
            const searchEl = document.getElementById('search');
            const loadingEl = document.getElementById('loadingIndicator');

            // ===== UTILITY =====
            function formatRp(n) {
                return 'Rp' + Number(n || 0).toLocaleString('id-ID');
            }

            function getActivePrice(service) {
                return service ? service.pricePerFollower : 0;
            }

            function getSortedServices(services) {
                if (!services || !Array.isArray(services)) return services;
                const sorted = [...services];
                sorted.sort((a, b) => getActivePrice(a) - getActivePrice(b));
                return sorted;
            }

            // ===== POPULATE KATEGORI =====
            function populateKategori(keepValue) {
                const current = keepValue || kategoriEl.value;
                kategoriEl.innerHTML = '<option value="">-- Pilih Kategori --</option>';
                const keys = Object.keys(layananData).sort((a, b) => a.localeCompare(b, 'id'));
                for (const k of keys) {
                    const opt = document.createElement('option');
                    opt.value = k;
                    opt.textContent = k + ' (' + layananData[k].length + ')';
                    kategoriEl.appendChild(opt);
                }
                if (current && layananData[current]) {
                    kategoriEl.value = current;
                }
            }

            // ===== LOAD LAYANAN =====
            function loadLayanan() {
                const kategori = kategoriEl.value;
                layananEl.innerHTML = '<option value="">-- Pilih Layanan --</option>';

                if (kategori && layananData[kategori]) {
                    const sorted = getSortedServices(layananData[kategori]);
                    const frag = document.createDocumentFragment();

                    for (const l of sorted) {
                        const opt = document.createElement('option');
                        opt.value = l.id;
                        let label = l.name + ' — ' + formatRp(getActivePrice(l)) + '/1rb';
                        if (l.comment) label += ' 📝';
                        if (l.id) label += ' (ID:' + l.id + ')';
                        opt.textContent = label;
                        frag.appendChild(opt);
                    }

                    layananEl.appendChild(frag);

                    if (sorted.length > 0) {
                        layananEl.value = sorted[0].id;
                        showInfo();
                    }
                } else {
                    infoEl.innerHTML = '<span style="color:#475569;">Pilih kategori untuk melihat layanan</span>';
                    selectedService = null;
                }
            }

            // ===== SHOW INFO =====
            function showInfo() {
                const kategori = kategoriEl.value;
                const layananID = layananEl.value;

                if (!kategori || !layananData[kategori]) {
                    infoEl.innerHTML = '<span style="color:#475569;">Pilih kategori terlebih dahulu</span>';
                    return;
                }

                selectedService = layananData[kategori].find(l => String(l.id) === String(layananID));
                if (!selectedService) {
                    infoEl.innerHTML = '<span style="color:#f87171;">Layanan tidak ditemukan</span>';
                    return;
                }

                const s = selectedService;
                const price = getActivePrice(s);

                let html = '';
                html += '<div class="name">' + s.name;
                if (s.comment) html += ' <span class="comment-tag">📝 Komentar</span>';
                html += '</div>';

                html += '<div class="price">' + formatRp(price) + ' <span style="font-size:13px;color:#94a3b8;font-weight:400;">/ 1.000 unit</span></div>';

                html += '<div class="detail">';
                html += '<span>🆔 ID: ' + s.id + '</span>';
                html += '<span>📊 Min: ' + s.min.toLocaleString('id-ID') + '</span>';
                html += '<span>📈 Max: ' + s.max.toLocaleString('id-ID') + '</span>';
                if (s.refill) html += '<span style="color:#34d399;">♻️ Refill</span>';
                html += '</div>';

                if (s.desc) {
                    html += '<div class="desc">📝 ' + s.desc + '</div>';
                }

                if (s.type && s.type !== 'Default') {
                    html += '<div class="desc" style="margin-top:4px;font-size:12px;color:#64748b;">Tipe: ' + s.type + '</div>';
                }

                infoEl.innerHTML = html;
            }

            // ===== SEARCH =====
            function searchLayanan() {
                clearTimeout(searchTimer);
                searchTimer = setTimeout(function() {
                    const q = searchEl.value.toLowerCase().trim();
                    if (!q) return;

                    for (const k in layananData) {
                        for (const l of layananData[k]) {
                            if (l.name.toLowerCase().includes(q) || String(l.id).includes(q)) {
                                kategoriEl.value = k;
                                loadLayanan();
                                layananEl.value = l.id;
                                showInfo();
                                return;
                            }
                        }
                    }

                    infoEl.innerHTML = '<span style="color:#f87171;">❌ Layanan "' + q + '" tidak ditemukan</span>';
                }, 300);
            }

            // ===== LOAD DATA DENGAN RETRY =====
            async function loadData(silent, retryCount = 0) {
                if (isLoading) return;
                isLoading = true;
                loadingEl.style.display = 'block';
                infoEl.innerHTML = '<span style="color:#475569;">⏳ Memuat data...</span>';

                const maxRetries = 3;

                try {
                    const res = await fetch(API_ENDPOINT + '?ts=' + Date.now());
                    if (!res.ok) throw new Error('HTTP ' + res.status);

                    const data = await res.json();
                    if (data && data.status === false) {
                        throw new Error(data.msg || 'Provider error');
                    }

                    if (Object.keys(data).length === 0) {
                        throw new Error('Data layanan kosong');
                    }

                    layananData = data;
                    populateKategori(true);
                    loadLayanan();

                    loadingEl.style.display = 'none';

                } catch (err) {
                    console.error('Load error:', err);

                    if (retryCount < maxRetries) {
                        loadingEl.innerHTML = '<span class="spinner"></span> Mencoba ulang (' + (retryCount + 1) + '/' +
                            maxRetries + ')...';
                        setTimeout(() => {
                            loadData(silent, retryCount + 1);
                        }, 2000 * (retryCount + 1));
                        return;
                    }

                    loadingEl.style.display = 'none';

                    infoEl.innerHTML =
                        '<div class="error-box">' +
                        '❌ <b>Data layanan tidak tersedia</b><br>' +
                        '<span style="font-size:12px;color:#94a3b8;">' + (err.message || 'Gagal terhubung ke server') +
                        '</span><br><br>' +
                        '<button class="retry-btn" onclick="location.reload()">🔄 Refresh Halaman</button>' +
                        '</div>';

                    if (!silent) {
                        alert('⚠️ Gagal memuat data layanan.\n' + (err.message || '') + '\n\nCoba refresh.');
                    }
                } finally {
                    isLoading = false;
                }
            }

            // ===== SMART REFRESH =====
            let refreshTimer = null;

            function startSmartRefresh() {
                if (refreshTimer) clearInterval(refreshTimer);
                refreshTimer = setInterval(function() {
                    if (document.visibilityState === 'visible' && !isLoading) {
                        loadData(true);
                    }
                }, 45000);
            }

            document.addEventListener('visibilitychange', function() {
                if (document.visibilityState === 'visible' && !isLoading) {
                    loadData(true);
                }
            });

            // ===== EVENT BINDING =====
            kategoriEl.addEventListener('change', loadLayanan);
            layananEl.addEventListener('change', showInfo);
            searchEl.addEventListener('input', searchLayanan);

            // ===== INIT =====
            window.addEventListener('load', function() {
                loadData(false);
                startSmartRefresh();
            });

            window.addEventListener('beforeunload', function() {
                if (refreshTimer) clearInterval(refreshTimer);
            });

        })();
    </script>

</body>
</html>
