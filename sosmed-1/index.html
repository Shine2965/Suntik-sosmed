<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shine Shop - SMM</title>

<style>
/* ===================================
   THEME COLOR
=================================== */
:root{
  --bg:#0d1117;
  --glass:rgba(255,255,255,0.06);
  --glass-border:rgba(255,255,255,0.12);
  --accent1:#7c3aed;
  --accent2:#0ea5e9;
  --text:#f1f5f9;
  --hover:rgba(255,255,255,0.12);
}

/* ===================================
   BASE
=================================== */
*{box-sizing:border-box;font-family:'Poppins',sans-serif;transition:.2s ease}
body{
  margin:0;
  background:linear-gradient(135deg,#0F2027,#1c1f24,#2c5364,#151515);
  background-size:300% 300%;
  animation:bgMove 12s infinite alternate;
  color:var(--text);
}
@keyframes bgMove{
  0%{background-position:0% 50%}
  100%{background-position:100% 50%}
}

/* ===================================
   HEADER NAVIGATION
=================================== */
.header{
  display:flex;
  align-items:center;
  padding:18px 22px;
  backdrop-filter:blur(8px);
  background:rgba(255,255,255,0.04);
  border-bottom:1px solid var(--glass-border);
}

.brand{display:flex;gap:12px;align-items:center}
.logo{
  width:46px;height:46px;border-radius:12px;
  background:var(--glass);
  display:grid;place-items:center;
  font-weight:700;color:white;
  border:1px solid var(--glass-border);
  text-shadow:0 0 8px var(--accent1);
}
h1{margin:0;font-size:19px;font-weight:600}

/* ===================================
   MENU MOBILE
=================================== */
.hamburger-btn{
  margin-left:auto;
  padding:12px 14px;
  border-radius:12px;
  background:var(--glass);
  border:1px solid var(--glass-border);
  cursor:pointer;
}
.hamburger-btn:hover{background:var(--hover)}

.hamburger-icon{width:26px;height:18px;position:relative}
.hamburger-icon span{
  height:3px;width:100%;background:white;border-radius:6px;
  position:absolute;left:0;
}
.hamburger-icon span:nth-child(1){top:0}
.hamburger-icon span:nth-child(2){top:7px}
.hamburger-icon span:nth-child(3){top:14px}

.hamburger-btn.active span:nth-child(1){transform:rotate(45deg);top:7px}
.hamburger-btn.active span:nth-child(2){opacity:0}
.hamburger-btn.active span:nth-child(3){transform:rotate(-45deg);top:7px}

.offcanvas{
  position:fixed;top:0;left:0;bottom:0;
  width:280px;max-width:90%;
  padding:28px 22px;
  background:rgba(15,17,23,0.95);
  backdrop-filter:blur(10px);
  border-right:2px solid var(--accent1);
  transform:translateX(-110%);
  transition:.4s ease;
  z-index:100;
}
.offcanvas.open{transform:translateX(0)}

.menu-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
.menu-list a{
  display:flex;align-items:center;
  padding:12px 16px;
  background:var(--glass);
  border:1px solid var(--glass-border);
  color:white;font-weight:500;
  border-radius:10px;
  text-decoration:none;
}
.menu-list a:hover{
  background:var(--hover);
  transform:translateX(6px);
}

.overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(2px);
  opacity:0;pointer-events:none;
  transition:opacity .3s ease;
  z-index:90;
}
.overlay.show{opacity:1;pointer-events:auto}

/* ===================================
   CONTAINER FORM
=================================== */
.container{
  max-width:820px;
  margin:50px auto;
  background:var(--glass);
  backdrop-filter:blur(10px);
  padding:28px;
  border-radius:20px;
  border:1px solid var(--glass-border);
  box-shadow:0 0 25px rgba(0,0,0,0.45);
  animation:fadeIn .6s ease;
}
@keyframes fadeIn{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

h2{text-align:center;margin-bottom:25px;font-size:22px;text-shadow:0 0 10px var(--accent2)}

label{font-weight:500;margin:10px 0 6px;display:block}
input,select{
  width:100%;padding:12px;
  background:rgba(255,255,255,0.07);
  border:1px solid var(--glass-border);
  border-radius:10px;
  color:white;
  font-size:15px;
}
input:focus,select:focus{
  border-color:var(--accent2);
  box-shadow:0 0 10px var(--accent2);
}

button{
  margin-top:20px;
  padding:14px;
  width:100%;
  font-size:16px;font-weight:600;
  border:0;border-radius:12px;
  cursor:pointer;
  background:linear-gradient(90deg,var(--accent1),var(--accent2));
  color:white;
  box-shadow:0 6px 18px rgba(0,0,0,0.4);
}
button:hover{opacity:0.85;transform:translateY(-2px)}

.desc{
  background:rgba(255,255,255,0.08);
  padding:15px;margin-top:10px;
  border-radius:10px;
  font-size:14px;
  border:1px dashed var(--glass-border);
}
</style>
</head>

<!-- HEADER -->
<header class="header">

    <h1>Shine Shop</h1>
  </div>
  <button class="hamburger-btn" id="menuToggle">
    <span class="hamburger-icon"><span></span><span></span><span></span></span>
  </button>
</header>

<div id="menuOverlay" class="overlay"></div>

<nav id="siteMenu" class="offcanvas">
  <header style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
    <strong style="font-size:18px">Menu Utama</strong>
    <button class="close" id="menuClose" style="font-size:22px;background:none;border:0;color:white;cursor:pointer">✕</button>
  </header>

  <ul class="menu-list">
    <li><a href="/dashboard/">🏠 Home</a></li>
    <li><a href="/topupgame/">💎 Top Up Game</a></li>
    <li><a href="/sosmed-1/">📱 Sosmed-1</a></li>
    <li><a href="/sosmed-2/">💉 Sosmed-2</a></li>
    <li><a href="/riwayat/">🧾 Riwayat Pesanan</a></li>
    <li><a href="/kontaksmm/">📞 Customer Service</a></li>
    <li><a href="/informasi/">🔔 Informasi</a></li>
  </ul>
</nav>

<script>
const toggleBtn=document.getElementById("menuToggle");
const closeBtn=document.getElementById("menuClose");
const offcanvas=document.getElementById("siteMenu");
const overlay=document.getElementById("menuOverlay");

function openMenu(){
  offcanvas.classList.add("open");
  overlay.classList.add("show");
  toggleBtn.classList.add("active");
}
function closeMenu(){
  offcanvas.classList.remove("open");
  overlay.classList.remove("show");
  toggleBtn.classList.remove("active");
}

toggleBtn.onclick=()=> offcanvas.classList.contains("open")?closeMenu():openMenu();
closeBtn.onclick=closeMenu;
overlay.onclick=closeMenu;
</script>

let selectedService=null;

window.onload=function(){
  const kategori=document.getElementById("kategori");
  for(let k in layananData){
    let opt=document.createElement("option");
    opt.value=k; opt.textContent=k;
    kategori.appendChild(opt);
  }
}

function loadLayanan(){
  const kategori=document.getElementById("kategori").value;
  const layanan=document.getElementById("layanan");
  layanan.innerHTML="<option value=''>-- Pilih Layanan --</option>";

  if(kategori){
    layananData[kategori].forEach(l=>{
      let opt=document.createElement("option");
      opt.value=l.id;
      opt.textContent=l.name+" (ID: "+l.id+")";
      layanan.appendChild(opt);
    });
  }
  document.getElementById("infoLayanan").innerHTML="";
  selectedService=null;
}

function showInfo(){
  const kategori=document.getElementById("kategori").value;
  const layananID=document.getElementById("layanan").value;

  selectedService=layananData[kategori].find(l=>l.id==layananID);
  document.getElementById("infoLayanan").innerHTML=
  `<b>${selectedService.name}</b><br>
   ID Produk: ${selectedService.id}<br>
   Harga: Rp${selectedService.pricePerFollower}/unit<br>
   Min: ${selectedService.min} | Max: ${selectedService.max}<br>
   ${selectedService.desc}`;
}

function hitungTotal(){
  if(!selectedService)return;
  const jumlah=parseInt(document.getElementById("jumlah").value||"0");
  if(jumlah < selectedService.min || jumlah > selectedService.max){
    document.getElementById("total").value="Jumlah tidak valid!";
    return;
  }
  document.getElementById("total").value=jumlah * selectedService.pricePerFollower;
}

function generateTransactionID(){
  return `TRX${Date.now()}${Math.floor(Math.random()*1000)}`;
}

function searchLayanan(){
  const q=document.getElementById("search").value.toLowerCase();
  const kategori=document.getElementById("kategori");
  const layanan=document.getElementById("layanan");

  for(let k in layananData){
    for(let l of layananData[k]){
      if(l.name.toLowerCase().includes(q) || String(l.id).includes(q)){
        kategori.value=k;
        loadLayanan();
        layanan.value=l.id;
        showInfo();
        return;
      }
    }
  }
}

function lanjutPembayaran(){
  if(!selectedService){alert("Pilih layanan terlebih dahulu!");return;}

  const jumlah=parseInt(document.getElementById("jumlah").value||"0");
  if(jumlah < selectedService.min || jumlah > selectedService.max){
    alert(`Jumlah harus antara ${selectedService.min} dan ${selectedService.max}`);
    return;
  }

  const trxID=generateTransactionID();
  const kategori=document.getElementById("kategori").value;
  const target=document.getElementById("target").value;
  const total=jumlah * selectedService.pricePerFollower;

  window.location.href=`/payment/?trx=${trxID}&kategori=${kategori}&layanan=${selectedService.name}&id=${selectedService.id}&jumlah=${jumlah}&total=${total}&target=${encodeURIComponent(target)}`;
}
