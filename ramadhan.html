<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shine Shop • Ramadhan 2026 Secure</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:linear-gradient(180deg,#031926,#064e3b,#022c22);
  color:white;
  min-height:100vh;
  overflow-x:hidden;
}
.moon{
  position:fixed;
  top:60px;
  right:80px;
  width:120px;
  height:120px;
  background:radial-gradient(circle,#facc15 60%,#eab308 80%);
  border-radius:50%;
  box-shadow:0 0 50px #facc15;
}
.moon::after{
  content:'';
  position:absolute;
  top:0;
  left:30px;
  width:120px;
  height:120px;
  background:#031926;
  border-radius:50%;
}
.star{
  position:fixed;
  color:#facc15;
  font-size:14px;
  animation:twinkle 2s infinite alternate;
}
@keyframes twinkle{from{opacity:.3}to{opacity:1}}
.mosque{
  position:fixed;
  bottom:0;
  width:100%;
  height:180px;
  background:url('https://i.ibb.co/6y0Z8xK/mosque.png') repeat-x bottom;
  background-size:contain;
  opacity:.25;
}
.container{
  max-width:640px;
  margin:120px auto 60px;
  padding:30px;
  background:rgba(0,0,0,.4);
  backdrop-filter:blur(18px);
  border-radius:26px;
  box-shadow:0 0 40px rgba(250,204,21,.6);
  text-align:center;
  border:1px solid rgba(250,204,21,.4);
}
h1{
  margin:0 0 10px;
  font-size:26px;
  background:linear-gradient(90deg,#dcfce7,#facc15,#bbf7d0);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  text-shadow:0 0 25px rgba(250,204,21,.8);
}
.countdown{margin:10px 0 20px;font-size:14px;color:#facc15;}
.nav-btn{
  width:100%;margin:10px 0;padding:15px;border:none;border-radius:16px;
  background:linear-gradient(135deg,#065f46,#facc15);
  color:white;font-size:15px;font-weight:600;cursor:pointer;transition:.3s;
}
.nav-btn:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 15px 35px rgba(250,204,21,.7);}
.watermark{
  position:fixed;bottom:10px;left:50%;transform:translateX(-50%);
  font-size:12px;color:rgba(255,255,255,.6);
}
</style></head>
<body><div class="moon"></div>
<div class="mosque"></div><script>
/* STARS */
for(let i=0;i<40;i++){
  const s=document.createElement('div');
  s.className='star';
  s.textContent='★';
  s.style.left=Math.random()*100+'vw';
  s.style.top=Math.random()*100+'vh';
  s.style.animationDuration=(1+Math.random()*2)+'s';
  document.body.appendChild(s);
}

/* DATES */
const idulFitri = new Date("March 31, 2026 00:00:00");
const takbiranStart = new Date("March 30, 2026 18:00:00");

/* AUDIO */
const ramadhanSound = "https://h.uguu.se/jUSzHsOE.mp3";
const takbiranSound = "https://h.uguu.se/gnhYpllC.mp3";

let bgAudio = new Audio();
bgAudio.loop = true;
bgAudio.volume = 1;

function setAudio(){
  const now = new Date();
  if(now >= takbiranStart){
    bgAudio.src = takbiranSound;
  }else{
    bgAudio.src = ramadhanSound;
  }
  bgAudio.play().catch(()=>{});
}

document.addEventListener("click", function initAudio(){
  setAudio();
  document.removeEventListener("click", initAudio);
});

/* COUNTDOWN */
function updateCountdown(){
  const now=new Date().getTime();
  const diff=idulFitri-now;
  if(diff<=0){
    document.getElementById("countdown").innerHTML="🌙 Selamat Hari Raya Idul Fitri 1447H 🌙";
    return;
  }
  const days=Math.floor(diff/(1000*60*60*24));
  const hours=Math.floor((diff%(1000*60*60*24))/(1000*60*60));
  const minutes=Math.floor((diff%(1000*60*60))/(1000*60));
  document.getElementById("countdown").innerHTML=
    "⏳ Menuju Idul Fitri: "+days+" Hari "+hours+" Jam "+minutes+" Menit";
}
setInterval(updateCountdown,1000);

/* ANTI INSPECT */
document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("keydown",function(e){
  if(e.key==="F12") e.preventDefault();
  if(e.ctrlKey && e.shiftKey && ["I","C","J"].includes(e.key)) e.preventDefault();
  if(e.ctrlKey && e.key==="u") e.preventDefault();
});
setInterval(function(){
  if(window.outerWidth-window.innerWidth>160 || window.outerHeight-window.innerHeight>160){
    triggerTamper();
  }
},1000);
setInterval(()=>{console.clear();},1000);
setInterval(()=>{debugger;},3000);

/* ANTI TAMPER */
const __secure_signature = document.documentElement.outerHTML.length;
const observer = new MutationObserver(function(mutations){
  for(const m of mutations){
    if(m.type === "childList" || m.type === "attributes"){
      triggerTamper();
    }
  }
});
observer.observe(document.documentElement,{childList:true,subtree:true,attributes:true});
setInterval(function(){
  if(document.documentElement.outerHTML.length !== __secure_signature){
    triggerTamper();
  }
},2000);
(function(){
  const devtools = /./;
  devtools.toString = function(){ triggerTamper(); };
  console.log('%c', devtools);
})();
setInterval(function(){
  if(console.clear.toString().indexOf('[native code]') === -1){
    triggerTamper();
  }
},2000);
function triggerTamper(){
  document.body.innerHTML = `
    <div style="height:100vh;display:flex;align-items:center;justify-content:center;background:#000;color:#facc15;font-family:sans-serif;font-size:22px;text-align:center;">
    🚫 SECURITY VIOLATION DETECTED
    </div>`;
  setTimeout(()=>{location.href="about:blank"},1500);
}
</script><div class="container">
  <h1>🌙 Shine Shop • Ramadhan 2026 🌙</h1>
  <div class="countdown" id="countdown"></div>
  <button class="nav-btn" onclick="location.href='/dashboard/'">🛒 Belanja</button>
  <button class="nav-btn" onclick="location.href='/testimoni/'">📈 Testimoni</button>
  <button class="nav-btn" onclick="location.href='/ewallet/'">💳 E Wallet</button>
  <button class="nav-btn" onclick="location.href='https://store.shinedomain.my.id'">📰 Informasi</button>
  <button class="nav-btn" onclick="location.href='https://t.me/shineshopstore1'">💬 Customer Service</button>
</div><div class="watermark">© SHINE SHOP 2026 • Marhaban Ya Ramadhan 🌙</div></body>
</html>
