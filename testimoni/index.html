<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHINE SHOP Testimoni</title>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{
  min-height:100vh;
  color:white;
  background: linear-gradient(-45deg,#0f172a,#1e1b4b,#111827,#312e81);
  background-size:400% 400%;
  animation: gradientMove 12s ease infinite;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:20px;
}

@keyframes gradientMove{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

.container{
  width:400px;
  padding:35px;
  border-radius:30px;
  backdrop-filter: blur(35px);
  background: rgba(255,255,255,0.05);
  border:1px solid rgba(255,255,255,0.15);
  box-shadow:0 0 60px rgba(255,215,0,0.6);
  margin-top:40px;
}

h2{
  text-align:center;
  margin-bottom:25px;
  background:linear-gradient(90deg,#facc15,#fbbf24,#fde68a);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

label{font-size:14px;font-weight:500;}

input,textarea{
  width:100%;
  margin-top:8px;
  margin-bottom:18px;
  padding:12px;
  border-radius:15px;
  border:1px solid rgba(255,255,255,0.2);
  background:rgba(255,255,255,0.07);
  color:white;
}

input:focus,textarea:focus{
  outline:none;
  border:1px solid gold;
  box-shadow:0 0 20px rgba(255,215,0,0.6);
}

textarea{resize:none;height:90px;}

button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:20px;
  font-weight:600;
  cursor:pointer;
  background:linear-gradient(90deg,#fbbf24,#f59e0b);
  color:black;
  box-shadow:0 0 30px rgba(255,215,0,0.6);
  transition:0.3s;
}

button:hover{
  transform:translateY(-4px);
  box-shadow:0 0 40px rgba(255,215,0,1);
}

.rating{display:flex;justify-content:center;gap:10px;margin-bottom:15px;}
.star{font-size:30px;cursor:pointer;color:#555;}
.star.selected{color:gold;text-shadow:0 0 15px gold;}

.rating-avg{
  text-align:center;
  padding:12px;
  border-radius:20px;
  margin-top:20px;
  background:rgba(255,215,0,0.15);
  font-weight:600;
  box-shadow:0 0 25px rgba(255,215,0,0.5);
}

.music-btn{
  position:fixed;
  bottom:25px;
  right:25px;
  width:60px;
  height:60px;
  border-radius:50%;
  background:linear-gradient(90deg,#fbbf24,#f59e0b);
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  font-size:22px;
  color:black;
  box-shadow:0 0 25px rgba(255,215,0,0.8);
}
</style>
</head>

<body>

<audio id="bgMusic" src="https://files.catbox.moe/e749oh.mp3" loop></audio>

<div class="container">
<h2>✨ Shine Shop Testimoni ✨</h2>

<form id="testiForm">
<label>Nama</label>
<input type="text" id="nama" required>

<label>Testimoni</label>
<textarea id="pesan" required></textarea>

<label>Rating</label>
<div class="rating">
<span class="star" data-value="1">★</span>
<span class="star" data-value="2">★</span>
<span class="star" data-value="3">★</span>
<span class="star" data-value="4">★</span>
<span class="star" data-value="5">★</span>
</div>

<button type="submit">Kirim Testimoni</button>
</form>

<div class="rating-avg" id="ratingAvg"></div>
</div>

<div class="music-btn" onclick="toggleMusic()">🎵</div>

<script>
fetch("https://api.ipify.org?format=json")
.then(res => res.json())
.then(data => {
  const blockedIPs = ["36.80.133.87","182.4.73.201","202.65.239.25","36.70.150.7","114.198.244.146","114.5.241.235"]

  if(blockedIPs.includes(data.ip)){
    document.body.innerHTML = "<h1>Access Denied</h1> <br> <li>Akses anda telah di hapus permanen oleh Admin! ajukan banding melalui telegram @MLIDShinebot</li>"
  }
})
/* TELEGRAM CONFIG */
const botToken="8404649278:AAHE9Og0hNA1RbKktA6o0fR-eQPOGvArQkE";
const channelId="-1002112920606";

/* RATING DATA */
let totalRating=169;
let totalReview=34;

function updateAverage(){
let avg = totalRating / totalReview;

if(avg > 5) avg = 5;
if(avg < 0) avg = 0;

avg = avg.toFixed(1);

document.getElementById("ratingAvg").innerHTML =
`⭐ Rating Shine Shop: ${avg}/5 (${totalReview} ulasan)`;
}
updateAverage();

/* RATING SELECT */
let selectedRating=0;
document.querySelectorAll(".star").forEach(star=>{
star.addEventListener("click",()=>{
selectedRating=parseInt(star.dataset.value);
document.querySelectorAll(".star").forEach(s=>s.classList.remove("selected"));
for(let i=0;i<selectedRating;i++){
document.querySelectorAll(".star")[i].classList.add("selected");
}
});
});

/* 🔒 12 JAM LOCK */
const COOLDOWN_TIME = 12 * 60 * 60 * 1000;

function checkLock(){
const data=JSON.parse(localStorage.getItem("shine12hLock"))||{lastSubmit:0};
if(Date.now()-data.lastSubmit < COOLDOWN_TIME){
const remaining=COOLDOWN_TIME-(Date.now()-data.lastSubmit);
const hours=Math.floor(remaining/(1000*60*60));
const minutes=Math.floor((remaining%(1000*60*60))/(1000*60));
Swal.fire({
icon:"warning",
title:"⏳ Dibatasi 12 Jam",
html:`Sisa waktu:<br><b style="color:gold">${hours} jam ${minutes} menit</b>`
});
return false;
}
return true;
}

function activateLock(){
localStorage.setItem("shine12hLock",JSON.stringify({lastSubmit:Date.now()}));
}

/* SUBMIT */
document.getElementById("testiForm").addEventListener("submit",async(e)=>{
e.preventDefault();
if(!checkLock()) return;
if(!selectedRating){Swal.fire("Pilih rating dahulu!");return;}

const nama=document.getElementById("nama").value;
const pesan=document.getElementById("pesan").value;

let safeRating = Math.min(Math.max(selectedRating,1),5);

totalRating += safeRating;
totalReview += 1;

updateAverage();

let avgNow = totalRating / totalReview;
if(avgNow > 5) avgNow = 5;
avgNow = avgNow.toFixed(1);

const caption=`⭐ TESTIMONI SHINE SHOP⭐

👤 ${nama}
🌟 Rating: ${safeRating}/5
📊 Rata-rata Saat Ini: ${avgNow}/5
📝 Total Review: ${totalReview}

💬 ${pesan}

yakin masih ragu dengan shine shop? buruan dapatkan pengalaman baru di shinedomain.my.id`;

await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({chat_id:channelId,text:caption})
});

activateLock();

Swal.fire("Testimoni berhasil dikirim!");
e.target.reset();
document.querySelectorAll(".star").forEach(s=>s.classList.remove("selected"));
selectedRating=0;
});

/* 🎵 MUSIC */
const music=document.getElementById("bgMusic");
music.volume=0.4;
function toggleMusic(){music.paused?music.play():music.pause();}
document.body.addEventListener("click",()=>{if(music.paused)music.play();},{once:true});

/* 🚫 ANTI INSPECT */
document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("keydown",function(e){
if(e.key==="F12") e.preventDefault();
if(e.ctrlKey&&e.shiftKey&&["I","C","J"].includes(e.key)) e.preventDefault();
if(e.ctrlKey&&e.key==="u") e.preventDefault();
});

setInterval(()=>{
if(window.outerWidth-window.innerWidth>160||window.outerHeight-window.innerHeight>160){
document.body.innerHTML="<h1 style='color:gold;text-align:center;margin-top:40vh;'>🚫 Developer Tools Terdeteksi</h1>";
}
},1000);

setInterval(()=>{console.clear();},1000);
setInterval(()=>{debugger;},3000);

</script>
</body>
</html>
