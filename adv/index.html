<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telegram Advertisement by Shine Shop</title>

<style>
body{
  font-family:Poppins;
  background:#0f172a;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.container{
  background:#1e293b;
  padding:20px;
  border-radius:12px;
  width:400px;
}
input, textarea{
  width:100%;
  margin:6px 0;
  padding:10px;
  border:none;
  border-radius:8px;
}
    p {
  color: red; /* Warna merah */
  font-family: 'Verdana', sans-serif;
  font-size: 16px; /* Ukuran font 10px */
  line-height: 1.6;
  margin-bottom: 20px;
    }
button{
  width:100%;
  padding:12px;
  margin-top:8px;
  background:#22c55e;
  border:none;
  border-radius:8px;
  color:white;
  cursor:pointer;
}
.btn-add{
  background:#3b82f6;
}
</style>
</head>
<body>

<div class="container">
  <h2>Kirim Telegram</h2>

  <input type="text" id="user_id" placeholder="User ID">
  <textarea id="message" placeholder="Isi pesan"></textarea>

  <h4>Inline Buttons</h4>
  <div id="buttons"></div>

  <button class="btn-add" onclick="tambahButton()">+ Tambah Button</button>
  <button onclick="kirim()">Kirim</button>
  <p>ISI USER ID DENGAN ID TELEGRAM KAMU DAN PASTIKAN SUDAH START BOT @Shineshoipbot</p><br>
  <p>Bot ini dibuat untuk membantu kalian dalam membuat teks promosi di telegram</p><br>
   
</div>

<script>
let buttonCount = 0;

function tambahButton(){
  buttonCount++;

  const div = document.createElement("div");
  div.innerHTML = `
    <input type="text" placeholder="Teks Button" id="text_${buttonCount}">
    <input type="text" placeholder="URL Button" id="url_${buttonCount}">
    <input type="number" placeholder="Baris (row)" id="row_${buttonCount}">
  `;

  document.getElementById("buttons").appendChild(div);
}

async function kirim(){
  const user_id = document.getElementById("user_id").value;
  const message = document.getElementById("message").value;

  let rows = {};

  for(let i=1;i<=buttonCount;i++){
    const text = document.getElementById(`text_${i}`)?.value;
    const url = document.getElementById(`url_${i}`)?.value;
    const row = document.getElementById(`row_${i}`)?.value || 1;

    if(text && url){
      if(!rows[row]) rows[row] = [];

      rows[row].push({
        text: text,
        url: url
      });
    }
  }

  const buttons = Object.values(rows);

  const res = await fetch("/api/send", {
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body:JSON.stringify({
      user_id,
      message,
      buttons
    })
  });

  const data = await res.json();

  if(data.ok){
    alert("Berhasil dikirim!");
  }else{
    alert("Error: " + JSON.stringify(data));
  }
}
  /* 🔒 ANTI DEVTOOLS (tidak ganggu mobile) */

document.addEventListener("keydown", function(e){
  // F12
  if(e.key === "F12") e.preventDefault();

  // Ctrl + Shift + I/C/J
  if(e.ctrlKey && e.shiftKey &&
    ["I","C","J"].includes(e.key)) e.preventDefault();

  // Ctrl + U
  if(e.ctrlKey && e.key === "u") e.preventDefault();
});

// Deteksi DevTools (lebih aman, tidak pakai resize hack)
setInterval(() => {
  const threshold = 160;
  if (window.devtoolsOpen) return;

  const widthThreshold = window.outerWidth - window.innerWidth > threshold;

  if (widthThreshold && !/Android|iPhone|iPad/i.test(navigator.userAgent)) {
    document.body.innerHTML =
      "<h1 style='color:gold;text-align:center;margin-top:40vh;'>🚫 Developer Tools Terdeteksi</h1>";
  }
}, 2000);
</script>

</body>
</html>
