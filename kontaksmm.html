<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="google-adsense-account" content="ca-pub-9912622413153708">
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kontak - Shine Shop</title>
  <style>
    :root{--bg:#071021;--card:#0b1220;--accent:#ffd166;--muted:#9aa7bf}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Arial;color:#e6eef8;background:linear-gradient(180deg,var(--bg),#04101a);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{width:100%;max-width:720px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));padding:28px;border-radius:14px;box-shadow:0 10px 30px rgba(2,6,23,0.6);border:1px solid rgba(255,255,255,0.03)}
    h1{margin:0 0 8px 0;font-size:22px}
    p.lead{margin:0 0 18px 0;color:var(--muted)}
    .contact-row{display:flex;gap:12px;align-items:center}
    .phone{font-weight:700;font-size:18px}
    .btns{margin-top:14px;display:flex;gap:10px}
    .btn{padding:10px 14px;border-radius:10px;border:none;background:transparent;color:var(--muted);cursor:pointer;border:1px solid rgba(255,255,255,0.06)}
    .btn.primary{background:linear-gradient(90deg,var(--accent),#ff8a65);color:#082032;border:none}
    .note{margin-top:14px;color:#bcd1e8;font-size:13px}
    @media (max-width:520px){.contact-row{flex-direction:column;align-items:flex-start}}
  </style>
</head>
<body>
  <div class="card">
    <h1>Butuh bantuan?</h1>
    <p class="lead">Jika Anda memerlukan bantuan, silakan hubungi kami melalui WhatsApp di nomor di bawah ini.</p>

    <div class="contact-row">
      <div>
        <div class="phone">+62 895-1810-3883</div>
        <div class="note">(Nomor WA resmi Shine Shop)</div>
      </div>
      <div style="flex:1"></div>
      <div class="btns">
        <button class="btn primary" onclick="openWhatsApp()">Buka WhatsApp</button>
        <button class="btn" onclick="copyNumber()">Salin Nomor</button>
      </div>
    </div>

    <p class="note">Atau klik langsung: <a id="waLink" href="https://wa.me/6289518103883?text=Halo%20Shine%20Shop%2C%20saya%20butuh%20bantuan." target="_blank">Chat via WhatsApp</a></p>
  </div>

  <script>
    function openWhatsApp(){
      window.open('https://wa.me/6289518103883?text=Halo%20Shine%20Shop%2C%20saya%20butuh%20bantuan.','_blank')
    }
    function copyNumber(){
      const num = '+6289518103883';
      navigator.clipboard?.writeText(num).then(()=>{
        alert('Nomor disalin: ' + num);
      }).catch(()=>{
        prompt('Salin nomor ini:', num);
      });
    }
  </script>
</body>
</html>
