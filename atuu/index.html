<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMM Panel</title>

<style>
body{
  font-family:Poppins;
  background:#0f172a;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:#1e293b;
  padding:20px;
  border-radius:12px;
  width:350px;
}
input,select,button{
  width:100%;
  padding:10px;
  margin:5px 0;
  border:none;
  border-radius:8px;
}
input,select{
  background:#0f172a;
  color:white;
}
button{
  background:#22c55e;
  color:white;
  font-weight:bold;
}
.result{
  background:#0f172a;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
  font-size:13px;
}
</style>
</head>

<body>

<div class="box">
  <h3>SMM Panel</h3>

  <button onclick="loadServices()">Load Services</button>
  <select id="service"></select>

  <input type="text" id="link" placeholder="Link target">
  <input type="number" id="quantity" placeholder="Quantity">

  <button onclick="createOrder()">Order</button>

  <hr>

  <input type="number" id="orderId" placeholder="Order ID">
  <button onclick="checkStatus()">Cek Status</button>

  <div class="result" id="result">...</div>
</div>

<script>
const API = "/smm"; // 🔥 ini connect ke backend

// LOAD SERVICES
async function loadServices(){
  const res = await fetch(API, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ action: "services" })
  });

  const data = await res.json();

  let select = document.getElementById("service");
  select.innerHTML = "";

  data.forEach(s => {
    let opt = document.createElement("option");
    opt.value = s.service;
    opt.textContent = `${s.name} - $${s.rate}`;
    select.appendChild(opt);
  });

  show("Services loaded");
}

// CREATE ORDER
async function createOrder(){
  const service = document.getElementById("service").value;
  const link = document.getElementById("link").value;
  const quantity = document.getElementById("quantity").value;

  const res = await fetch(API, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      action: "add",
      service,
      link,
      quantity
    })
  });

  const data = await res.json();
  show(data);
}

// CHECK STATUS
async function checkStatus(){
  const order = document.getElementById("orderId").value;

  const res = await fetch(API, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      action: "status",
      order
    })
  });

  const data = await res.json();
  show(data);
}

// SHOW RESULT
function show(data){
  document.getElementById("result").innerText =
    typeof data === "object"
    ? JSON.stringify(data, null, 2)
    : data;
}
</script>

</body>
</html>
