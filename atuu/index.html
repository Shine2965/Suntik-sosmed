<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMM Panel Frontend</title>

<style>
body{
  font-family:Poppins,sans-serif;
  background:#0f172a;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}
.box{
  background:#1e293b;
  padding:20px;
  border-radius:12px;
  width:350px;
}
h2{text-align:center;}
input,select,button{
  width:100%;
  padding:10px;
  margin:6px 0;
  border:none;
  border-radius:8px;
}
input,select{
  background:#0f172a;
  color:white;
}
button{
  background:#22c55e;
  color:white;
  font-weight:bold;
  cursor:pointer;
}
.result{
  margin-top:10px;
  background:#0f172a;
  padding:10px;
  border-radius:8px;
  font-size:13px;
}
</style>
</head>

<body>

<div class="box">
  <h2>SMM Panel</h2>

  <button onclick="loadServices()">Load Services</button>

  <select id="service"></select>

  <input type="text" id="link" placeholder="Link target">
  <input type="number" id="quantity" placeholder="Quantity">

  <button onclick="order()">Buat Order</button>

  <hr>

  <input type="number" id="orderId" placeholder="Order ID">
  <button onclick="statusOrder()">Cek Status</button>

  <div class="result" id="result">Result...</div>
</div>

<script>
const API = "/smm/";

// LOAD SERVICES
async function loadServices(){
  const res = await fetch(API, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      action: "services"
    })
  });

  const data = await res.json();

  let select = document.getElementById("service");
  select.innerHTML = "";

  data.forEach(s => {
    let opt = document.createElement("option");
    opt.value = s.service;
    opt.textContent = s.name + " | $" + s.rate;
    select.appendChild(opt);
  });

  result("Service berhasil dimuat");
}

// ORDER
async function order(){
  const service = document.getElementById("service").value;
  const link = document.getElementById("link").value;
  const quantity = document.getElementById("quantity").value;

  const res = await fetch(API, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      action: "add",
      service,
      link,
      quantity
    })
  });

  const data = await res.json();
  result(data);
}

// STATUS
async function statusOrder(){
  const order = document.getElementById("orderId").value;

  const res = await fetch(API, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      action: "status",
      order
    })
  });

  const data = await res.json();
  result(data);
}

// RESULT VIEW
function result(data){
  document.getElementById("result").innerText =
    typeof data === "object"
    ? JSON.stringify(data, null, 2)
    : data;
}
</script>

</body>
</html>
