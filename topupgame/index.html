  	    :root{

    }
    *{box-sizing:border-box;transition:all .3s ease}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:44px;height:44px;background:var(--card);border-radius:10px;display:grid;place-items:center;font-weight:700;box-shadow:inset 0 0 10px rgba(255,255,255,0.1)}
h1{font-size:18px;margin:0}
p.sub{margin:0;font-size:12px;opacity:0.9}

.hamburger-btn{margin-left:auto;background:rgba(255,255,255,0.15);border:0;padding:10px 12px;border-radius:12px;cursor:pointer;backdrop-filter:blur(4px)}
.hamburger-btn:hover{background:rgba(255,255,255,0.25)}
.hamburger-icon{width:26px;height:18px;position:relative;display:block}
.hamburger-icon span{position:absolute;left:0;right:0;height:3px;background:var(--text);border-radius:3px;transition:transform .4s ease,opacity .3s ease,top .3s ease}
.hamburger-icon span:nth-child(1){top:0}
.hamburger-icon span:nth-child(2){top:7px}
.hamburger-icon span:nth-child(3){top:14px}
.hamburger-btn.active span:nth-child(1){transform:rotate(45deg);top:7px}
.hamburger-btn.active span:nth-child(2){opacity:0}
.hamburger-btn.active span:nth-child(3){transform:rotate(-45deg);top:7px}

.offcanvas{position:fixed;top:0;left:0;bottom:0;width:280px;max-width:90%;background:var(--card);box-shadow:6px 0 30px rgba(0,0,0,0.6);transform:translateX(-110%);transition:transform .4s cubic-bezier(.25,.8,.25,1);z-index:60;padding:26px 20px;border-right:3px solid var(--accent1)}
.offcanvas.open{transform:translateX(0)}

.offcanvas header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.offcanvas header strong{font-size:18px}
.close{background:transparent;border:0;color:var(--text);font-size:22px;cursor:pointer}

.menu-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.menu-list a{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:10px;text-decoration:none;color:var(--text);font-weight:600;background:rgba(255,255,255,0.03)}
.menu-list a:hover{background:var(--hover);transform:translateX(6px)}

.cta{margin-top:20px;padding:12px;border-radius:10px;background:linear-gradient(90deg,var(--accent1),var(--accent2));text-align:center;font-weight:500}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);opacity:0;pointer-events:none;transition:opacity .3s ease;z-index:50}
.overlay.show{opacity:1;pointer-events:auto}

@media (min-width:720px){
  .header{padding:18px 22px}
}
.overlay.show {
  opacity: 1;
  pointer-events: auto;
  transition: opacity 0.3s ease;
}

  </nav>   <script>
    const toggleBtn = document.getElementById('menuToggle');
    const closeBtn = document.getElementById('menuClose');
    const offcanvas = document.getElementById('siteMenu');
    const overlay = document.getElementById('menuOverlay');
    const menuLinks = offcanvas.querySelectorAll('a');

    function openMenu(){
      offcanvas.classList.add('open');
      overlay.classList.add('show');
      toggleBtn.classList.add('active');
    }

    function closeMenu(){
      offcanvas.classList.remove('open');
      overlay.classList.remove('show');
      toggleBtn.classList.remove('active');
    }

    toggleBtn.addEventListener('click', ()=>{
      const opened = offcanvas.classList.contains('open');
      opened ? closeMenu() : openMenu();
    });

    closeBtn.addEventListener('click', closeMenu);
    overlay.addEventListener('click', closeMenu);

    menuLinks.forEach(link => {
      link.addEventListener('click', e => {
        e.preventDefault();
        const href = link.getAttribute('href');
        closeMenu();
        setTimeout(()=>{window.location.href = href;},300);
      });
    });

    document.addEventListener('keydown', e => {
      if(e.key === 'Escape' && offcanvas.classList.contains('open')) closeMenu();
    });
  </script>

    let selectedService = null;

    // Load kategori ke dropdown
    window.onload = function() {
      const kategori = document.getElementById("kategori");
      for (let k in layananData) {
        let opt = document.createElement("option");
        opt.value = k;
        opt.textContent = k;
        kategori.appendChild(opt);
      }
    };

    function loadLayanan() {
      const kategori = document.getElementById("kategori").value;
      const layanan = document.getElementById("layanan");
      layanan.innerHTML = "<option value=''>-- Pilih Layanan --</option>";
      if (kategori && layananData[kategori]) {
        layananData[kategori].forEach(l => {
          let opt = document.createElement("option");
          opt.value = l.id;
          opt.textContent = l.name + " (ID: " + l.id + ")";
          layanan.appendChild(opt);
        });
      }
      document.getElementById("infoLayanan").innerHTML = "";
      selectedService = null;
    }

    function showInfo() {
      const kategori = document.getElementById("kategori").value;
      const layananID = document.getElementById("layanan").value;
      if (kategori && layananID) {
        selectedService = layananData[kategori].find(l => l.id == layananID);
        document.getElementById("infoLayanan").innerHTML =
          `<b>${selectedService.name}</b><br>
           ID Produk: ${selectedService.id}<br>
           Harga: Rp${selectedService.pricePerFollower}/unit<br>
           Min: ${selectedService.min} | Max: ${selectedService.max}<br>
           ${selectedService.desc}`;
      }
    }

    function hitungTotal() {
      if (!selectedService) return;
      const jumlah = parseInt(document.getElementById("jumlah").value || "0");
      if (jumlah < selectedService.min || jumlah > selectedService.max) {
        document.getElementById("total").value = "Jumlah tidak valid!";
        return;
      }
      document.getElementById("total").value = jumlah * selectedService.pricePerFollower;
    }

    function generateTransactionID() {
      const now = Date.now();
      const random = Math.floor(Math.random() * 1000);
      return `TRX${now}${random}`;
    }

    function searchLayanan() {
      const q = document.getElementById("search").value.toLowerCase();
      const kategori = document.getElementById("kategori");
      const layanan = document.getElementById("layanan");

      for (let k in layananData) {
        for (let l of layananData[k]) {
          if (l.name.toLowerCase().includes(q) || String(l.id).includes(q) || k.toLowerCase().includes(q)) {
            kategori.value = k;
            loadLayanan();
            layanan.value = l.id;
            showInfo();
            return;
          }
        }
      }
    }

    function lanjutPembayaran() {
      if (!selectedService) { alert("Pilih layanan dulu!"); return; }
      const jumlah = parseInt(document.getElementById("jumlah").value || "0");
      if (jumlah < selectedService.min || jumlah > selectedService.max) {
        alert(`Jumlah harus antara ${selectedService.min} dan ${selectedService.max}`);
        return;
      }

      const trxID = generateTransactionID();
      const kategori = document.getElementById("kategori").value;
      const target = document.getElementById("target").value;
      const total = jumlah * selectedService.pricePerFollower;

      // Redirect ke payment.html dengan query string
      const url = `/payment/?trx=${encodeURIComponent(trxID)}&kategori=${encodeURIComponent(kategori)}&layanan=${encodeURIComponent(selectedService.name)}&id=${selectedService.id}&jumlah=${jumlah}&total=${total}&target=${encodeURIComponent(target)}`;
