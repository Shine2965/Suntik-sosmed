<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tugas sekolah - Alvino Jeremy</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@300;400;500&display=swap');

:root {
    --gold: #d4af37;
    --gold-soft: rgba(212,175,55,0.15);
    --bg: #0b0b0b;
    --card: #151515;
    --border: rgba(212,175,55,.25);
    --text: #f5f5f5;
    --muted: #b5b5b5;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    background: radial-gradient(circle at top, #1c1c1c, #000);
    color: var(--text);
    font-family: 'Inter', sans-serif;
}

/* WATERMARK */
body::before {
    content: "Alvino Jeremy • 9C";
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(-25deg);
    font-size: 80px;
    color: rgba(212,175,55,0.05);
    pointer-events: none;
}

/* HEADER */
.header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px;
}

.logo {
    width:50px;
    height:50px;
    border-radius:12px;
    overflow:hidden;
}

.logo img {
    width:100%;
    height:100%;
    object-fit:cover;
}

h1 {
    font-family: 'Playfair Display';
    color: var(--gold);
}

/* MENU */
.hamburger-btn {
    background:none;
    border:1px solid var(--border);
    padding:10px;
    border-radius:10px;
    cursor:pointer;
}

.hamburger-icon span {
    display:block;
    height:3px;
    width:24px;
    background:white;
    margin:4px 0;
}

/* OFFCANVAS */
.offcanvas {
    position:fixed;
    right:-260px;
    top:0;
    width:260px;
    height:100%;
    background:#111;
    padding:20px;
    transition:.3s;
    z-index:1000;
}

.offcanvas.open {
    right:0;
}

.overlay {
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    opacity:0;
    visibility:hidden;
    transition:.3s;
}

.overlay.show {
    opacity:1;
    visibility:visible;
}

.menu-list {
    list-style:none;
    padding:0;
}

.menu-list li {
    margin:10px 0;
}

.menu-list a {
    color:white;
    text-decoration:none;
}

/* CONTENT */
.container {
    max-width:900px;
    margin:auto;
    padding:40px 20px;
}

.section {
    background:#151515;
    padding:25px;
    border-radius:14px;
    border:1px solid var(--border);
}

ul {
    padding-left:20px;
}

.btn {
    margin-top:20px;
    padding:12px;
    border:none;
    border-radius:999px;
    background:linear-gradient(135deg,#00c6ff,#0072ff);
    color:white;
    cursor:pointer;
}
</style>
</head>

<body>

<header class="header">
    <div style="display:flex;align-items:center;gap:10px">
        <div class="logo">
            <img src="https://raw.githubusercontent.com/IkyyEzzXD/IkyyGantengPoll/main/uploads/1776385812303_80529_file_978.jpg" alt="logo">
        </div>
        <h1>Shine Shop</h1>
    </div>

    <button class="hamburger-btn" id="menuToggle">
        <div class="hamburger-icon">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </button>
</header>

<div id="menuOverlay" class="overlay"></div>

<nav id="siteMenu" class="offcanvas">
    <button id="menuClose">Tutup</button>
    <ul class="menu-list">
        <li><a href="/home2/">Home</a></li>
         <li><a href="/testimoni/">Testimoni</a></li>
        <li><a href="/sosmed-2/">Suntik Sosmed</a></li>
        <li><a href="/aboutowner/">Portofolio</a></li>
         <li><a href="/cekakses/">Cek Akses kamu</a></li>
    </ul>
</nav>

<div class="container">

    <h1>Penjelasan Suntik Sosmed</h1>

    <div class="section">
        <h2>Manfaat</h2>
        <ul>
            <li>Meningkatkan social proof</li>
            <li>Meningkatkan kredibilitas instan</li>
            <li>Hasil cepat</li>
        </ul>

        <p>
        Catatan: Followers biasanya tidak aktif dan bisa menurunkan engagement.
        </p>

        <button class="btn" onclick="location.href='/home2/'">
            Beli Suntik Sosmed
        </button>
    </div>

</div>

<script>
const toggle = document.getElementById("menuToggle");
const menu = document.getElementById("siteMenu");
const overlay = document.getElementById("menuOverlay");
const close = document.getElementById("menuClose");

toggle.onclick = () => {
    menu.classList.toggle("open");
    overlay.classList.toggle("show");
}

overlay.onclick = () => {
    menu.classList.remove("open");
    overlay.classList.remove("show");
}

close.onclick = () => {
    menu.classList.remove("open");
    overlay.classList.remove("show");
}
</script>

</body>
</html>
