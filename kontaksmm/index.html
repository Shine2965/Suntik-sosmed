<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Customer Service Chat</title>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root {
  --primary: #6366f1;
  --secondary: #9333ea;
  --bg: linear-gradient(135deg, #4f46e5, #9333ea);
}

body {
  font-family: "Poppins", sans-serif;
  background: var(--bg);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  color: #333;
}

.container {
  background: #ffffff;
  padding: 25px 20px;
  border-radius: 18px;
  width: 380px;
  box-shadow: 0 6px 25px rgba(0, 0, 0, 0.25);
  animation: fadeIn 0.5s ease-in-out;
  text-align: center;
}

h2 {
  color: var(--primary);
  font-weight: 600;
  margin-bottom: 10px;
}

#chat-section {
  display: none;
}

.icon-header {
  font-size: 45px;
  color: var(--primary);
  background: #eef2ff;
  padding: 18px;
  border-radius: 50%;
  margin-bottom: 12px;
  display: inline-block;
  box-shadow: 0 3px 8px rgba(99, 102, 241, 0.3);
}

.messages {
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 10px;
  height: 300px;
  overflow-y: auto;
  margin-bottom: 10px;
  background: #f9fafb;
}

.message {
  margin-bottom: 8px;
  padding: 8px 12px;
  border-radius: 8px;
  max-width: 80%;
  word-wrap: break-word;
  animation: slideUp 0.3s ease-in-out;
}

.customer {
  background: #c7d2fe;
  text-align: right;
  margin-left: auto;
  color: #111827;
}

.admin {
  background: #e9d5ff;
  text-align: left;
  color: #111827;
}

input,
button {
  width: 100%;
  padding: 10px;
  margin-top: 6px;
  border-radius: 8px;
  border: 1px solid #ccc;
  box-sizing: border-box;
  font-family: inherit;
}

input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 5px var(--primary);
}

button {
  background: var(--primary);
  color: white;
  font-weight: 600;
  border: none;
  cursor: pointer;
  transition: all 0.2s ease;
}

button:hover {
  background: var(--secondary);
}

/* Toast notification */
.toast {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: var(--primary);
  color: white;
  padding: 12px 18px;
  border-radius: 10px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.4s ease;
  z-index: 9999;
}

.toast.show {
  opacity: 1;
  transform: translateY(0);
}

/* Animations */
@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.9); }
  to { opacity: 1; transform: scale(1); }
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>
<audio id="bgm" autoplay loop muted>
  <source src="https://files.catbox.moe/e749oh.mp3" type="audio/mpeg">
</audio>
  
<div class="container">
  <div id="login-section">
    <div class="icon-header"><i class="fa-solid fa-headset"></i></div>
    <h2>Customer Service</h2>
    <input type="text" id="name" placeholder="Nama lengkap" required />
    <input type="email" id="email" placeholder="Alamat Gmail" required />
    <button onclick="startChat()">Mulai Chat</button>
  </div>

  <div id="chat-section">
    <div class="icon-header"><i class="fa-solid fa-headset"></i></div>
    <h2>Customer Service</h2>
    <div id="messages" class="messages"></div>

    <!-- Input teks -->
    <input type="text" id="message" placeholder="Tulis pesan..." />

    <!-- Input file (gambar) -->
    <input type="file" id="imageInput" accept="image/*" style="margin-top:8px;" />

    <!-- Tombol kirim -->
    <button onclick="sendMessage()">Kirim</button>
  </div>
</div>

<!-- Toast Notification -->
<div id="toast" class="toast"></div>

<script>
  const audio = document.getElementById("bgm");

// setelah audio mulai, unmute otomatis
audio.addEventListener("canplay", () => {
  audio.muted = false;
  audio.volume = 1.0; // atur volume (0.0 - 1.0)
});

// fallback jika browser nahan autoplay
setTimeout(() => {
  audio.muted = false;
  audio.play().catch(()=>{});
}, 1000);
// Popup informasi saat halaman pertama kali dibuka
window.onload = function() {
  Swal.fire({
    title: "Informasi",
    html: "Harap isi alamat Gmail dengan benar.<br><br>Kendala anda akan kami jawab melalui Gmail anda.<br><br>Silahkan tunggu jawaban dari kami paling lama <b>24 jam</b>.",
    icon: "info",
    confirmButtonText: "Mengerti",
    confirmButtonColor: "#6366f1"
  });
};

let customerName = "";
let customerEmail = "";

// Ganti token & chat_id di sini
const telegramBotToken = "8785872128:AAGJApScDjRIjg1VorXB35OvrvtUDCtVr0M";
const telegramChatId = "6317157631";

function startChat() {
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();

  if (!name || !email) {
    Swal.fire("Peringatan", "Nama dan Gmail harus diisi!", "warning");
    return;
  }

  customerName = name;
  customerEmail = email;
  document.getElementById("login-section").style.display = "none";
  document.getElementById("chat-section").style.display = "block";
}

function showToast(message, success = true) {
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.style.background = success ? "var(--primary)" : "#ef4444";
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 3000);
}

function sendMessage() {
  const msgInput = document.getElementById("message");
  const imgInput = document.getElementById("imageInput");
  const msg = msgInput.value.trim();
  const imageFile = imgInput.files[0];

  if (!msg && !imageFile) {
    showToast("⚠️ Ketik pesan atau pilih gambar dulu!", false);
    return;
  }

  const messagesDiv = document.getElementById("messages");

  // tampilkan pesan teks (jika ada)
  if (msg) {
    const textDiv = document.createElement("div");
    textDiv.classList.add("message", "customer");
    textDiv.textContent = msg;
    messagesDiv.appendChild(textDiv);
  }

  // tampilkan gambar (jika ada)
  if (imageFile) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = document.createElement("img");
      img.src = e.target.result;
      img.style.maxWidth = "70%";
      img.style.borderRadius = "8px";
      img.style.marginTop = "6px";
      img.classList.add("message", "customer");
      messagesDiv.appendChild(img);
    };
    reader.readAsDataURL(imageFile);
  }

  messagesDiv.scrollTop = messagesDiv.scrollHeight;
  msgInput.value = "";
  imgInput.value = "";

  // kirim ke telegram
  if (imageFile) {
    const formData = new FormData();
    formData.append("chat_id", telegramChatId);
    formData.append("caption", `📸 Foto dari Customer:\n👤 ${customerName}\n📧 ${customerEmail}\n📝 ${msg || "(Tanpa teks)"}`);
    formData.append("photo", imageFile);

    fetch(`https://api.telegram.org/bot${telegramBotToken}/sendPhoto`, {
      method: "POST",
      body: formData
    })
    .then(() => showToast("✅ Gambar berhasil dikirim!", true))
    .catch(() => showToast("❌ Gagal mengirim gambar!", false));
  } else {
    const text = `💬 Pesan Baru dari Customer:
👤 Nama: ${customerName}
📧 Gmail: ${customerEmail}
📝 Pesan: ${msg}`;

    fetch(`https://api.telegram.org/bot${telegramBotToken}/sendMessage`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        chat_id: telegramChatId,
        text: text
      })
    })
    .then(() => showToast("✅ Pesan berhasil dikirim!", true))
    .catch(() => showToast("❌ Gagal mengirim pesan!", false));
  }
}
  document.addEventListener("keydown", function(e){
  // F12
  if(e.key === "F12") e.preventDefault();

  // Ctrl + Shift + I/C/J
  if(e.ctrlKey && e.shiftKey &&
    ["I","C","J"].includes(e.key)) e.preventDefault();

  // Ctrl + U
  if(e.ctrlKey && e.key === "u") e.preventDefault();
});

// Deteksi DevTools (lebih aman, tidak pakai resize hack)
setInterval(() => {
  const threshold = 160;
  if (window.devtoolsOpen) return;

  const widthThreshold = window.outerWidth - window.innerWidth > threshold;

  if (widthThreshold && !/Android|iPhone|iPad/i.test(navigator.userAgent)) {
    document.body.innerHTML =
      "<h1 style='color:gold;text-align:center;margin-top:40vh;'>🚫 Developer Tools Terdeteksi</h1>";
  }
}, 2000);
</script>

</body>
</html>
