<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Produk</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #0d1117; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #161b22; border-radius: 16px; padding: 30px; max-width: 700px; width: 100%; border: 1px solid #30363d; }
        h1 { color: #f0f6fc; font-size: 24px; margin-bottom: 5px; text-align: center; }
        .sub { color: #8b949e; text-align: center; font-size: 14px; margin-bottom: 25px; }
        label { color: #f0f6fc; font-weight: 600; display: block; margin-top: 18px; margin-bottom: 6px; font-size: 14px; }
        input, select { width: 100%; padding: 12px; background: #0d1117; border: 1px solid #30363d; border-radius: 8px; color: #f0f6fc; font-size: 14px; }
        input:focus, select:focus { border-color: #58a6ff; outline: none; }
        .file-area { border: 2px dashed #30363d; border-radius: 10px; padding: 20px; text-align: center; margin-top: 8px; cursor: pointer; transition: 0.3s; }
        .file-area:hover { border-color: #58a6ff; background: #0d1117; }
        .file-area p { color: #8b949e; font-size: 14px; pointer-events: none; }
        .file-area input { display: none; }
        .file-list { margin-top: 10px; font-size: 13px; color: #58a6ff; display: flex; flex-wrap: wrap; gap: 8px; }
        .file-tag { background: #0d1117; padding: 6px 12px; border-radius: 20px; border: 1px solid #30363d; display: inline-block; }
        .btn { width: 100%; padding: 14px; background: #238636; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; margin-top: 25px; cursor: pointer; transition: 0.3s; }
        .btn:hover { background: #2ea043; }
        .btn:disabled { background: #555; cursor: not-allowed; }
        .note { color: #8b949e; font-size: 12px; margin-top: 8px; text-align: center; }
        .status { margin-top: 15px; padding: 12px; border-radius: 8px; display: none; text-align: center; font-weight: 600; }
        .status.success { display: block; background: #1a3a2a; color: #7ee787; border: 1px solid #238636; }
        .status.error { display: block; background: #3a1a1a; color: #f77878; border: 1px solid #da3633; }
        .status.loading { display: block; background: #1a2a3a; color: #58a6ff; border: 1px solid #1f6feb; }
        .required { color: #f77878; margin-left: 4px; }
        .keterangan { background: #0d1117; padding: 10px 14px; border-radius: 8px; border-left: 3px solid #58a6ff; margin-top: 6px; color: #8b949e; font-size: 13px; }
        .hapus-file { color: #f77878; cursor: pointer; margin-left: 8px; font-weight: bold; }
        .hapus-file:hover { color: #da3633; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📦 Form Produk</h1>
        <p class="sub">Lengkapi data produk & upload dokumentasi</p>

        <form id="productForm">
            <label>Nama Produk <span class="required">*</span></label>
            <input type="text" id="namaProduk" placeholder="Contoh: Kaos Polos Oversize" required>

            <label>Marketplace <span class="required">*</span></label>
            <select id="marketplace" required>
                <option value="">Pilih Marketplace</option>
                <option value="Shopee">Shopee</option>
                <option value="Lazada">Lazada</option>
                <option value="Tokopedia">Tokopedia</option>
                <option value="TikTok Shop">TikTok Shop</option>
                 <option value="kuhyon">kuh yon</option>
               
            </select>

            <label>📎 Upload File Pendukung <span class="required">*</span></label>
            <div class="keterangan">
                📸 Foto (JPG, PNG) &nbsp;|&nbsp; 📄 PDF &nbsp;|&nbsp; 🎥 Video (MP4, AVI, MOV, MKV, 3GP, WEBM)
                <br>📎 Sertakan: <strong>foto sebelum packing</strong>, <strong>foto resi</strong>, <strong>foto sesudah packing</strong>
            </div>
            <div class="file-area" id="fileArea">
                <p>📤 Klik di sini untuk pilih file (bisa banyak)</p>
                <input type="file" id="fileInput" multiple accept=".pdf,.jpg,.jpeg,.png,.mp4,.avi,.mov,.mkv,.3gp,.webm">
            </div>
            <div class="file-list" id="fileList"></div>

            <button type="submit" class="btn" id="submitBtn">🚀 Kirim ke Telegram</button>
            <p class="note">⚠️ Data akan dikirim melalui bot Telegram</p>
        </form>

        <div id="status" class="status"></div>
    </div>

    <script>
        // ========== KONFIGURASI ==========
        const BOT_TOKEN = '8785872128:AAGJApScDjRIjg1VorXB35OvrvtUDCtVr0M';
        const CHAT_ID = '6317157631';
        // ==================================

        const form = document.getElementById('productForm');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const submitBtn = document.getElementById('submitBtn');
        const statusDiv = document.getElementById('status');
        const fileArea = document.getElementById('fileArea');

        let selectedFiles = [];

        function getFileIcon(file) {
            if (file.type === 'application/pdf') return '📄';
            if (file.type.startsWith('image/')) return '🖼️';
            if (file.type.startsWith('video/')) return '🎥';
            return '📎';
        }

        function renderFileList() {
            fileList.innerHTML = '';
            if (selectedFiles.length === 0) {
                fileList.innerHTML = '<span style="color:#8b949e;font-size:13px;">Belum ada file dipilih</span>';
                return;
            }
            selectedFiles.forEach((file, index) => {
                const icon = getFileIcon(file);
                const tag = document.createElement('span');
                tag.className = 'file-tag';
                tag.innerHTML = `${icon} ${file.name} (${(file.size/1024).toFixed(1)} KB) <span class="hapus-file" data-index="${index}">✕</span>`;
                fileList.appendChild(tag);
            });

            document.querySelectorAll('.hapus-file').forEach(el => {
                el.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const idx = parseInt(this.dataset.index);
                    selectedFiles.splice(idx, 1);
                    renderFileList();
                    updateFileInput();
                });
            });
        }

        function updateFileInput() {
            const dt = new DataTransfer();
            selectedFiles.forEach(f => dt.items.add(f));
            fileInput.files = dt.files;
        }

        // ====== FIX: Event upload pake cara yang lebih aman ======
        // Klik di area → trigger file input
        fileArea.addEventListener('click', function(e) {
            // Jangan trigger kalo klik di tombol hapus (tapi udah di-stop di atas)
            fileInput.click();
        });

        // Saat file dipilih
        fileInput.addEventListener('change', function(e) {
            const newFiles = Array.from(this.files);
            if (newFiles.length === 0) return;

            newFiles.forEach(newFile => {
                const exists = selectedFiles.some(f => f.name === newFile.name && f.size === newFile.size);
                if (!exists) {
                    selectedFiles.push(newFile);
                }
            });

            renderFileList();
            updateFileInput();
            // Reset input biar bisa pilih file yang sama lagi
            this.value = '';
        });

        renderFileList();

        // Submit form
        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const namaProduk = document.getElementById('namaProduk').value.trim();
            const marketplace = document.getElementById('marketplace').value;

            if (!namaProduk || !marketplace || selectedFiles.length === 0) {
                showStatus('⚠️ Harap isi semua data dan upload minimal 1 file!', 'error');
                return;
            }

            let caption = `📦 *Form Produk*\n\n`;
            caption += `🆔 Nama Produk: ${namaProduk}\n`;
            caption += `🏪 Marketplace: ${marketplace}\n`;
            caption += `📎 Jumlah file: ${selectedFiles.length}`;

            showStatus('⏳ Mengirim data ke Telegram...', 'loading');
            submitBtn.disabled = true;

            try {
                const textResponse = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: caption,
                        parse_mode: 'Markdown'
                    })
                });
                if (!textResponse.ok) throw new Error('Gagal kirim pesan teks');

                for (let i = 0; i < selectedFiles.length; i++) {
                    const file = selectedFiles[i];
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('document', file);
                    formData.append('caption', `📎 File ${i+1}: ${file.name}`);

                    const fileResponse = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, {
                        method: 'POST',
                        body: formData
                    });
                    if (!fileResponse.ok) throw new Error(`Gagal kirim file: ${file.name}`);
                }

                showStatus('✅ Semua data berhasil dikirim ke Telegram!', 'success');
                form.reset();
                selectedFiles = [];
                renderFileList();
                updateFileInput();

            } catch (error) {
                console.error(error);
                showStatus('❌ Gagal mengirim: ' + error.message, 'error');
            }

            submitBtn.disabled = false;
        });

        function showStatus(message, type) {
            statusDiv.className = 'status ' + type;
            statusDiv.textContent = message;
            statusDiv.style.display = 'block';
        }
    </script>
</body>
</html>
