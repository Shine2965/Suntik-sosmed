<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Pembayaran QRIS - Shine Shop</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>

<style>
*{box-sizing:border-box}
body{
  font-family:'Poppins',sans-serif;
  background:
    radial-gradient(circle at top left,#00c6ff33,transparent 40%),
    radial-gradient(circle at bottom right,#0072ff33,transparent 40%),
    linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
  color:#fff;
}
.card{
  width:100%;
  max-width:460px;
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(14px);
  border-radius:22px;
  padding:24px;
  box-shadow:0 15px 35px rgba(0,0,0,.45),
             inset 0 0 0 1px rgba(255,255,255,.08);
}
h2{margin:0;font-size:22px;font-weight:700}
.subtitle{font-size:14px;color:#cbd5e1;margin-top:4px}
.qr-wrapper{
  background:#fff;border-radius:18px;padding:16px;
  width:fit-content;margin:18px auto;
}
.details{font-size:13.5px;line-height:1.7}
input{
  width:100%;padding:12px;border-radius:12px;
  border:none;margin-top:10px;font-size:13px;
}
.btn{
  width:100%;margin-top:18px;padding:14px;
  border-radius:999px;border:none;font-size:15px;
  font-weight:700;color:#fff;
  background:linear-gradient(135deg,#00c6ff,#0072ff);
  cursor:pointer;
}
.muted{text-align:center;font-size:12px;color:#cbd5e1;margin-top:12px}
.warning-box{
  background:linear-gradient(135deg,#dc2626,#7f1d1d);
  padding:20px;border-radius:16px;text-align:center;
}
</style>
</head>

<body>

<!-- BACKSOUND AUTO PLAY -->
<audio autoplay loop hidden>
  <source src="https://files.catbox.moe/1120of.mp3" type="audio/mpeg">
</audio>

<div id="blockedCard" class="card" style="display:none"></div>

<div id="mainCard" class="card">
  <h2>Pembayaran QRIS</h2>
  <div class="subtitle">Scan QR untuk menyelesaikan pembayaran</div>

  <div class="qr-wrapper">
    <canvas id="qrisCanvas" width="240" height="240"></canvas>
  </div>

  <div class="details" id="orderDetails"></div>

  <input type="text" id="namaInput" placeholder="Nama Lengkap">
  <input type="email" id="gmailInput" placeholder="Gmail Aktif">
  <input type="file" id="buktiInput" accept="image/*">

  <button id="confirmBtn" class="btn">Konfirmasi Pembayaran</button>

  <div class="muted">
    Setelah konfirmasi, admin memproses maksimal 24 jam
  </div>
</div>

<script>
/* KONFIG */
const botToken = "8404649278:AAEJqCwuCy5Aa37_6s8CGOwBW8hD3Prf4kY";
const chatId = "6845141887";
const channelId = "-1002112920606";

/* UTIL */
function maskGmail(email){
  if(!email.includes("@")) return email;
  const [n,d] = email.split("@");
  return n.slice(0,2)+"****@"+d;
}

async function getUserIP(){
  try{
    const r=await fetch("https://api.ipify.org?format=json");
    return (await r.json()).ip;
  }catch{return "-"}
}

async function getUserLocation(){
  try{
    const r=await fetch("https://ipwho.is/");
    const j=await r.json();
    return `${j.city||""}, ${j.country||""}`;
  }catch{return "-"}
}

/* INIT */
const p=new URLSearchParams(location.search);
const trx=p.get("trx")||"-";
const kategori=p.get("kategori")||"-";
const layanan=p.get("layanan")||"-";
const total=p.get("total")||"0";
const target=p.get("target")||"-";

orderDetails.innerHTML=`
<strong>ID Transaksi:</strong> ${trx}<br>
<strong>Kategori:</strong> ${kategori}<br>
<strong>Layanan:</strong> ${layanan}<br>
<strong>Target:</strong> ${target}<br>
<strong>Total:</strong> Rp ${Number(total).toLocaleString("id-ID")}
`;

function crc16(s){
  let c=0xFFFF;
  for(let i=0;i<s.length;i++){
    c^=s.charCodeAt(i)<<8;
    for(let j=0;j<8;j++)
      c=c&0x8000?(c<<1)^0x1021:c<<1;
  }
  return (c&0xFFFF).toString(16).toUpperCase().padStart(4,'0');
}

function buildQR(a){
  const str=String(parseInt(a));
  const tag="54"+String(str.length).padStart(2,"0")+str;
  const base="00020101021226670016COM.NOBUBANK.WWW01189360050300000879140214526036770909650303UMI51440014ID.CO.QRIS.WWW0215ID20243611417480303UMI5204541153033605802ID5920SHINE SHOP OK19967206008SURABAYA61056011162070703A01";
  const d=base+tag+"6304";
  return d+crc16(d);
}

QRCode.toCanvas(qrisCanvas,buildQR(total),{width:240});

/* KONFIRMASI */
confirmBtn.onclick=async()=>{
  const nama=namaInput.value.trim();
  const gmail=gmailInput.value.trim();
  const file=buktiInput.files[0];

  if(!nama||!gmail||!file)
    return Swal.fire("Lengkapi Data","","warning");

  Swal.fire({title:"Mengirim...",didOpen:()=>Swal.showLoading()});

  const ip=await getUserIP();
  const lokasi=await getUserLocation();
  const gMask=maskGmail(gmail);

  const caption=`
🚨 TRANSAKSI BARU !

ID TRANSAKSI: ${trx}
KATEGORI: ${kategori}
LAYANAN: ${layanan}
NAMA: ${nama}
GMAIL: ${gMask}

Terima kasih sudah memesan di
fine.shinedomain.my.id
`;

  let f=new FormData();
  f.append("chat_id",channelId);
  f.append("photo",file);
  f.append("caption",caption);

  await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`,{
    method:"POST",body:f
  });

  Swal.fire("Berhasil","Pembayaran dikirim","success");
};
</script>

</body>
</html>
