<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Pembayaran QRIS - Shine Shop</title>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
body{
  font-family:Poppins,Arial;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:#fff;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0
}
.card{
  background:rgba(255,255,255,.08);
  padding:22px;
  border-radius:14px;
  max-width:520px;
  width:100%;
  box-shadow:0 8px 20px rgba(0,0,0,.45)
}
img{
  display:block;
  margin:16px auto;
  width:260px;
  border-radius:12px;
  background:#fff;
  padding:8px
}
.details{font-size:14px;line-height:1.6}
.status{
  margin-top:14px;
  text-align:center;
  font-weight:700
}
.status.pending{color:#facc15}
.status.success{color:#22c55e}
.status.failed{color:#ef4444}
</style>
</head>
<body>

<div class="card">
  <h2>Pembayaran QRIS</h2>
  <p>Scan QR di bawah dan selesaikan pembayaran</p>

  <img id="qrisImg" src="" alt="QRIS">

  <div class="details" id="orderDetails"></div>

  <div id="paymentStatus" class="status pending">
    ⏳ Menunggu pembayaran...
  </div>

  <p style="font-size:13px;opacity:.8;text-align:center;margin-top:10px">
    Status pembayaran terdeteksi otomatis
  </p>
</div>

<script>
/* ================= CONFIG ================= */
const GATEWAY_URL = "https://atlantich2h.com/deposit/metode";
const API_KEY = "pAKg2tNnNHyTVVxVULpZ5AEBcyyj56lGlK8vZxUZFBKq46w5cVfx06cF263K33dN53AyLL3AryByEthTlkoMgOb6FJ9RunEirBOy";

/* Telegram */
const BOT_TOKEN = "7430992455:AAFYSSkMzy1UWwHTNzBEJBzAyPzfmF0wqto";
const ADMIN_CHAT = "6845141887";

/* ================= PARAM ================= */
const p = new URLSearchParams(location.search);
const trxID   = p.get("trx") || "TRX-"+Date.now();
const layanan = p.get("layanan") || "-";
const total   = p.get("total") || "0";

document.getElementById("orderDetails").innerHTML = `
<b>ID Transaksi:</b> ${trxID}<br>
<b>Layanan:</b> ${layanan}<br>
<b>Total:</b> Rp ${Number(total).toLocaleString("id-ID")}
`;

/* ================= CREATE QR ================= */
(async function createQR(){
  try{
    const res = await fetch(GATEWAY_URL,{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization": API_KEY
      },
      body:JSON.stringify({
        action: "create",
        trx_id: trxID,
        amount: total,
        description: layanan,
        metode: "qris"
      })
    });

    const data = await res.json();
    if(!data.qr_image) throw "QRIS gagal dibuat";

    document.getElementById("qrisImg").src = data.qr_image;

    startAutoCheck();

  }catch(e){
    Swal.fire("Error","Gagal membuat QRIS","error");
  }
})();

/* ================= AUTO CHECK (POST) ================= */
let checker = null;

function startAutoCheck(){
  checker = setInterval(checkPayment, 5000);
}

async function checkPayment(){
  try{
    const res = await fetch(GATEWAY_URL,{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization": API_KEY
      },
      body:JSON.stringify({
        action: "status",
        trx_id: trxID
      })
    });

    const data = await res.json();
    if(!data.status) return;

    const status = data.status.toLowerCase();

    if(status === "paid" || status === "success"){
      clearInterval(checker);
      paymentSuccess();
    }

    if(status === "failed"){
      clearInterval(checker);
      updateStatus("failed","❌ Pembayaran gagal");
    }

  }catch(e){}
}

/* ================= UI & NOTIF ================= */
function updateStatus(type,text){
  const el = document.getElementById("paymentStatus");
  el.className = "status "+type;
  el.innerText = text;
}

async function paymentSuccess(){
  updateStatus("success","✅ Pembayaran berhasil!");

  Swal.fire({
    icon:"success",
    title:"Pembayaran Berhasil",
    text:"Pesanan akan diproses otomatis"
  });

  /* Notif Telegram */
  await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({
      chat_id: ADMIN_CHAT,
      text:
`✅ PEMBAYARAN SUKSES
ID: ${trxID}
Layanan: ${layanan}
Total: Rp ${Number(total).toLocaleString("id-ID")}`
    })
  });

  setTimeout(()=>{
    window.location.href = "/dashboard/";
  },3000);
}
</script>

</body>
</html>
