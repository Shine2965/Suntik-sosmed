<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pembayaran QRIS - ORKUT</title>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:#fff;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center
}
.card{
  background:rgba(255,255,255,.08);
  padding:22px;
  border-radius:14px;
  max-width:420px;
  width:100%;
  text-align:center;
  box-shadow:0 8px 20px rgba(0,0,0,.45)
}
img{
  background:#fff;
  padding:10px;
  border-radius:12px;
  margin:15px auto;
  display:block
}
.status{
  font-weight:bold;
  margin-top:12px
}
.pending{color:#facc15}
.success{color:#22c55e}
.failed{color:#ef4444}
</style>
</head>
<body>

<div class="card">
  <h2>QRIS Payment</h2>

  <div id="info"></div>

  <img id="qrisImg" width="260" style="display:none">

  <div id="status" class="status pending">
    ⏳ Membuat QR...
  </div>
</div>

<script>
/* ================= CONFIG ORKUT ================= */
const ORKUT_APIKEY = "1996720:aY1InAWByrUtz0JFvXfjqgc3mbsDe2xV";
const ORKUT_BASE   = "https://orkutpay.com/api"; // ganti jika base kamu beda
const FEE = 500;

/* ================= PARAM ================= */
const params  = new URLSearchParams(location.search);
const amount  = parseInt(params.get("amount") || "0",10);
const layanan = params.get("layanan") || "-";
const total   = amount + FEE;

let REFF_ID = null;

/* ================= CREATE QR ================= */
async function createQR(){
  try{
    REFF_ID = "QR" + Date.now();

    const body = new URLSearchParams({
      api_key: ORKUT_APIKEY,
      reff_id: REFF_ID,
      nominal: total,
      metode: "QRIS"
    });

    const res = await fetch(`${ORKUT_BASE}/deposit/create`,{
      method:"POST",
      headers:{ "Content-Type":"application/x-www-form-urlencoded" },
      body
    });

    const json = await res.json();
    if(!json || !json.data?.qr_image){
      throw "QR gagal dibuat";
    }

    document.getElementById("info").innerHTML = `
      <b>ID Transaksi:</b> ${REFF_ID}<br>
      <b>Layanan:</b> ${layanan}<br>
      <b>Nominal:</b> Rp ${amount.toLocaleString("id-ID")}<br>
      <b>Fee:</b> Rp 500<br>
      <b>Total:</b> <b>Rp ${total.toLocaleString("id-ID")}</b>
    `;

    const img = document.getElementById("qrisImg");
    img.src = json.data.qr_image;
    img.style.display = "block";

    updateStatus("pending","⏳ Menunggu pembayaran...");

    startCheck();

  }catch(e){
    console.error(e);
    updateStatus("failed","❌ Gagal membuat QR");
  }
}

/* ================= CHECK STATUS ================= */
function startCheck(){
  setInterval(async ()=>{
    if(!REFF_ID) return;

    try{
      const body = new URLSearchParams({
        api_key: ORKUT_APIKEY,
        reff_id: REFF_ID
      });

      const res = await fetch(`${ORKUT_BASE}/deposit/status`,{
        method:"POST",
        headers:{ "Content-Type":"application/x-www-form-urlencoded" },
        body
      });

      const json = await res.json();
      const status = json?.data?.status?.toLowerCase();

      if(status === "success"){
        paymentSuccess();
      } else if(status === "failed"){
        updateStatus("failed","❌ Pembayaran gagal");
      }

    }catch(e){
      console.error("Status error",e);
    }

  },5000);
}

/* ================= UI ================= */
function updateStatus(cls,text){
  const el = document.getElementById("status");
  el.className = "status " + cls;
  el.innerText = text;
}

function paymentSuccess(){
  updateStatus("success","✅ Pembayaran berhasil!");
  Swal.fire({
    icon:"success",
    title:"Pembayaran Berhasil",
    text:"Pesanan sedang diproses"
  });
  setTimeout(()=>{
    location.href="/dashboard";
  },3000);
}

/* ================= INIT ================= */
createQR();
</script>

</body>
</html>
