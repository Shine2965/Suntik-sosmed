<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pembayaran QRIS - Shine Shop</title>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
body{
  font-family:Poppins,Arial;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:#fff;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0
}
.card{
  background:rgba(255,255,255,.08);
  padding:22px;
  border-radius:14px;
  max-width:520px;
  width:100%;
  box-shadow:0 8px 20px rgba(0,0,0,.45)
}
img{
  display:block;
  margin:16px auto;
  width:260px;
  border-radius:12px;
  background:#fff;
  padding:8px
}
.details{font-size:14px;line-height:1.6}
.status{
  margin-top:14px;
  text-align:center;
  font-weight:700
}
.status.pending{color:#facc15}
.status.success{color:#22c55e}
.status.failed{color:#ef4444}
</style>
</head>
<body>

<div class="card">
  <h2>Pembayaran QRIS</h2>
  <p>Scan QRIS dan selesaikan pembayaran</p>

  <img id="qrisImg" src="" alt="QRIS">

  <div class="details" id="orderDetails"></div>

  <div id="paymentStatus" class="status pending">
    ⏳ Menunggu pembayaran...
  </div>

  <p style="font-size:13px;opacity:.8;text-align:center">
    Status terdeteksi otomatis
  </p>
</div>

<script>
/* ================= CONFIG ================= */
const API_KEY = "pAKg2tNnNHyTVVxVULpZ5AEBcyyj56lGlK8vZxUZFBKq46w5cVfx06cF263K33dN53AyLL3AryByEthTlkoMgOb6FJ9RunEirBOy";
const CREATE_URL = "https://atlantich2h.com/deposit/create";

/* Telegram */
const BOT_TOKEN = "7430992455:AAFYSSkMzy1UWwHTNzBEJBzAyPzfmF0wqto";
const ADMIN_CHAT = "6845141887";

/* ================= PARAM ================= */
const p = new URLSearchParams(location.search);
const trxID   = p.get("trx") || "TRX" + Date.now();
const layanan = p.get("layanan") || "-";
const total   = p.get("total") || "50000";

document.getElementById("orderDetails").innerHTML = `
<b>ID Transaksi:</b> ${trxID}<br>
<b>Layanan:</b> ${layanan}<br>
<b>Total:</b> Rp ${Number(total).toLocaleString("id-ID")}
`;

/* ================= CREATE QRIS ================= */
(async function(){
  try{
    const body = new URLSearchParams({
      api_key: API_KEY,
      reff_id: trxID,
      nominal: total,
      type: "ewallet",
      method: "qris"
    });

    const res = await fetch(CREATE_URL,{
      method:"POST",
      headers:{
        "Content-Type":"application/x-www-form-urlencoded"
      },
      body: body.toString()
    });

    const data = await res.json();

    /*
      Contoh response asumsi:
      {
        status: "pending",
        qr_image: "https://..."
      }
    */

    if(!data.qr_image) throw "QRIS tidak tersedia";

    document.getElementById("qrisImg").src = data.qr_image;

    startAutoCheck();

  }catch(err){
    Swal.fire("Error","Gagal membuat QRIS","error");
  }
})();

/* ================= AUTO CHECK STATUS ================= */
let checker;

function startAutoCheck(){
  checker = setInterval(checkStatus, 5000);
}

async function checkStatus(){
  try{
    const body = new URLSearchParams({
      api_key: API_KEY,
      reff_id: trxID
    });

    const res = await fetch(CREATE_URL,{
      method:"POST",
      headers:{
        "Content-Type":"application/x-www-form-urlencoded"
      },
      body: body.toString()
    });

    const data = await res.json();
    if(!data.status) return;

    const status = data.status.toLowerCase();

    if(status === "success" || status === "paid"){
      clearInterval(checker);
      paymentSuccess();
    }

    if(status === "failed"){
      clearInterval(checker);
      updateStatus("failed","❌ Pembayaran gagal");
    }

  }catch(e){}
}

/* ================= UI & NOTIF ================= */
function updateStatus(type,text){
  const el = document.getElementById("paymentStatus");
  el.className = "status " + type;
  el.innerText = text;
}

async function paymentSuccess(){
  updateStatus("success","✅ Pembayaran berhasil!");

  Swal.fire({
    icon:"success",
    title:"Pembayaran Berhasil",
    text:"Pesanan akan diproses otomatis"
  });

  await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      chat_id: ADMIN_CHAT,
      text:
`✅ PEMBAYARAN SUKSES
ID: ${trxID}
Layanan: ${layanan}
Total: Rp ${Number(total).toLocaleString("id-ID")}`
    })
  });

  setTimeout(()=>{
    window.location.href = "/dashboard/";
  },3000);
}
</script>

</body>
</html>
