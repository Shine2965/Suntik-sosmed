<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Katalog Premium - Shine Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Poppins',sans-serif;
  min-height:100vh;
  background:#0a0e1a;
  color:#e2e8f0;
  padding:20px;
}
.header{
  max-width:1100px;
  margin:0 auto 24px;
  text-align:center;
}
.header h1{
  font-size:28px;
  font-weight:800;
  background:linear-gradient(135deg,#f0f9ff,#a5b4fc,#c4b5fd);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}
.header p{color:#94a3b8;font-size:14px;margin-top:6px}
.toolbar{
  max-width:1100px;
  margin:0 auto 20px;
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
}
.toolbar .left{display:flex;gap:10px;flex-wrap:wrap}
input,select{
  padding:12px 16px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.08);
  background:rgba(255,255,255,0.05);
  color:#f1f5f9;
  font-family:'Poppins',sans-serif;
  font-size:14px;
  outline:none;
  min-width:180px;
}
input:focus,select:focus{
  border-color:#00c6ff;
  box-shadow:0 0 0 3px rgba(0,198,255,0.12);
}
.btn{
  padding:12px 20px;
  border-radius:999px;
  border:none;
  font-weight:700;
  font-size:14px;
  cursor:pointer;
  font-family:'Poppins',sans-serif;
  transition:0.25s;
}
.btn-primary{
  background:linear-gradient(135deg,#00c6ff,#0072ff);
  color:#fff;
  box-shadow:0 6px 20px rgba(0,114,255,0.3);
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(0,114,255,0.4)}
.btn-secondary{
  background:rgba(255,255,255,0.06);
  color:#e2e8f0;
  border:1px solid rgba(255,255,255,0.1);
}
.btn-secondary:hover{background:rgba(255,255,255,0.1)}
.grid{
  max-width:1100px;
  margin:0 auto;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:18px;
}
.card{
  background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:20px;
  overflow:hidden;
  transition:transform 0.25s, box-shadow 0.25s;
  backdrop-filter:blur(12px);
}
.card:hover{
  transform:translateY(-4px);
  box-shadow:0 20px 50px rgba(0,0,0,0.4);
}
.card-img{
  width:100%;
  height:160px;
  object-fit:cover;
  background:#1e293b;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#64748b;
  font-size:13px;
}
.card-img img{width:100%;height:100%;object-fit:cover}
.card-body{padding:16px}
.card-body h3{
  font-size:16px;
  font-weight:700;
  color:#f8fafc;
  margin-bottom:6px;
  line-height:1.3;
}
.card-body .desc{
  font-size:12px;
  color:#94a3b8;
  margin-bottom:10px;
  min-height:36px;
  line-height:1.5;
}
.price-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:8px;
}
.price{
  font-size:18px;
  font-weight:800;
  color:#22c55e;
}
.price-old{
  font-size:12px;
  color:#64748b;
  text-decoration:line-through;
}
.stock{
  font-size:12px;
  padding:4px 10px;
  border-radius:20px;
  font-weight:600;
}
.stock.available{background:rgba(34,197,94,0.15);color:#22c55e}
.stock.unavailable{background:rgba(239,68,68,0.15);color:#ef4444}
.meta{font-size:11px;color:#64748b;margin-bottom:12px}
.card-actions{display:flex;gap:8px}
.card-actions .btn{flex:1;padding:10px;font-size:13px}
.btn-buy{
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:#fff;
}
.btn-buy:disabled{
  opacity:0.4;
  cursor:not-allowed;
}
.btn-stock{
  background:rgba(0,198,255,0.15);
  color:#00c6ff;
  border:1px solid rgba(0,198,255,0.25);
}
.loading{
  text-align:center;
  padding:60px 20px;
  color:#94a3b8;
  font-size:15px;
}
.empty{
  text-align:center;
  padding:60px 20px;
  color:#64748b;
}
.badge-markup{
  display:inline-block;
  background:rgba(250,204,21,0.15);
  color:#facc15;
  font-size:10px;
  padding:2px 8px;
  border-radius:10px;
  margin-left:6px;
  font-weight:600;
}
@media(max-width:480px){
  .header h1{font-size:22px}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="header">
  <h1>✦ Katalog Premium App ✦</h1>
  <p>Harga sudah termasuk keuntungan 30% · Stok realtime dari Premku</p>
</div>

<div class="toolbar">
  <div class="left">
    <input type="text" id="searchInput" placeholder="Cari produk...">
    <select id="filterStatus">
      <option value="all">Semua Status</option>
      <option value="available">Tersedia</option>
      <option value="unavailable">Habis</option>
    </select>
  </div>
  <div>
    <button class="btn btn-primary" id="btnRefresh">🔄 Refresh</button>
  </div>
</div>

<div id="content" class="loading">⏳ Memuat produk...</div>

<script>
const PREMKU_API_KEY = "d18db436519ea72a85bc49ff62f82b82";
const PREMKU_PRODUCTS_URL = "https://premku.com/api/products";
const PREMKU_STOCK_URL = "https://premku.com/api/stock";
const MARKUP_PERCENT = 30;

// Ganti path payment sesuai lokasi file payment.html kamu
const PAYMENT_PAGE = "payment.html"; 

let allProducts = [];

function formatRp(n) {
  return "Rp " + Number(n).toLocaleString("id-ID");
}

function applyMarkup(apiPrice) {
  return Math.ceil(apiPrice * (1 + MARKUP_PERCENT / 100));
}

async function fetchProducts() {
  const content = document.getElementById("content");
  content.className = "loading";
  content.textContent = "⏳ Memuat produk...";

  try {
    const res = await fetch(PREMKU_PRODUCTS_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Accept": "application/json"
      },
      body: JSON.stringify({ api_key: PREMKU_API_KEY })
    });

    const data = await res.json();
    console.log("Products:", data);

    if (!data.success || !Array.isArray(data.products)) {
      content.className = "empty";
      content.textContent = "❌ Gagal memuat produk: " + (data.message || "Unknown error");
      return;
    }

    allProducts = data.products.map(p => ({
      ...p,
      sellPrice: applyMarkup(p.price || 0)
    }));

    renderProducts();
  } catch (err) {
    console.error(err);
    content.className = "empty";
    content.textContent = "❌ Error: " + err.message;
  }
}

function renderProducts() {
  const search = (document.getElementById("searchInput").value || "").toLowerCase();
  const statusFilter = document.getElementById("filterStatus").value;

  let list = allProducts.filter(p => {
    const matchSearch = !search || 
      (p.name || "").toLowerCase().includes(search) || 
      (p.description || "").toLowerCase().includes(search);
    const matchStatus = statusFilter === "all" || (p.status || "").toLowerCase() === statusFilter;
    return matchSearch && matchStatus;
  });

  const content = document.getElementById("content");

  if (list.length === 0) {
    content.className = "empty";
    content.textContent = "Tidak ada produk yang cocok.";
    return;
  }

  content.className = "grid";
  content.innerHTML = list.map(p => {
    const available = (p.status || "").toLowerCase() === "available" && (p.stock || 0) > 0;
    const img = p.image 
      ? `<img src="\( {p.image}" alt=" \){p.name}" onerror="this.parentElement.innerHTML='No Image'">`
      : "No Image";

    return `
      <div class="card">
        <div class="card-img">${img}</div>
        <div class="card-body">
          <h3>${p.name || "-"}</h3>
          <div class="desc">${p.description || "Tidak ada deskripsi"}</div>
          <div class="price-row">
            <div>
              <div class="price">\( {formatRp(p.sellPrice)} <span class="badge-markup">+ \){MARKUP_PERCENT}%</span></div>
              <div class="price-old">API: ${formatRp(p.price || 0)}</div>
            </div>
            <span class="stock ${available ? "available" : "unavailable"}">
              ${available ? `Stok: ${p.stock}` : "Habis"}
            </span>
          </div>
          <div class="meta">ID: ${p.id}</div>
          <div class="card-actions">
            <button class="btn btn-stock" onclick="checkStock(\( {p.id}, ' \){(p.name || "").replace(/'/g, "\\'")}')">Cek Stok</button>
            <button class="btn btn-buy" ${available ? "" : "disabled"} 
              onclick="buyProduct(\( {p.id}, ' \){(p.name || "").replace(/'/g, "\\'")}', ${p.sellPrice})">
              Beli
            </button>
          </div>
        </div>
      </div>
    `;
  }).join("");
}

async function checkStock(productId, productName) {
  Swal.fire({
    title: "Mengecek stok...",
    text: productName,
    allowOutsideClick: false,
    didOpen: () => Swal.showLoading()
  });

  try {
    const res = await fetch(PREMKU_STOCK_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Accept": "application/json"
      },
      body: JSON.stringify({
        api_key: PREMKU_API_KEY,
        product_id: productId
      })
    });

    const data = await res.json();

    if (data.success) {
      Swal.fire({
        icon: data.stock > 0 ? "success" : "warning",
        title: data.product || productName,
        html: `<b>Stok realtime:</b> ${data.stock}`,
        confirmButtonColor: "#00c6ff"
      });
    } else {
      Swal.fire("Gagal", data.message || "Tidak bisa cek stok", "error");
    }
  } catch (err) {
    Swal.fire("Error", err.message, "error");
  }
}

function buyProduct(productId, productName, sellPrice) {
  Swal.fire({
    title: "Beli " + productName,
    html: `
      <p style="margin-bottom:12px">Harga: <b style="color:#22c55e">${formatRp(sellPrice)}</b> / akun</p>
      <input id="swal-qty" type="number" min="1" value="1" class="swal2-input" placeholder="Jumlah">
    `,
    showCancelButton: true,
    confirmButtonText: "Lanjut Bayar",
    confirmButtonColor: "#22c55e",
    cancelButtonText: "Batal",
    preConfirm: () => {
      const qty = parseInt(document.getElementById("swal-qty").value) || 0;
      if (qty < 1) {
        Swal.showValidationMessage("Jumlah minimal 1");
        return false;
      }
      return qty;
    }
  }).then(result => {
    if (!result.isConfirmed) return;

    const qty = result.value;
    const total = sellPrice * qty;
    const trx = "INV-" + Date.now() + "-" + Math.random().toString(36).substring(2, 8).toUpperCase();

    const params = new URLSearchParams({
      trx: trx,
      layanan: productName,
      total: total,
      id: productId,
      jumlah: qty
    });

    window.location.href = PAYMENT_PAGE + "?" + params.toString();
  });
}

document.getElementById("btnRefresh").onclick = fetchProducts;
document.getElementById("searchInput").oninput = renderProducts;
document.getElementById("filterStatus").onchange = renderProducts;

fetchProducts();
</script>
</body>
</html>
