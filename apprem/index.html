<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premku Products - Shine Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            padding: 30px 20px;
            background: radial-gradient(circle at 20% 30%, #00c6ff10, transparent 50%),
                        radial-gradient(circle at 80% 70%, #0072ff10, transparent 50%),
                        #0a0a0a;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header-card {
            background: #1a1a1a;
            border-radius: 24px;
            padding: 30px 28px;
            border: 1px solid #00c6ff33;
            box-shadow: 0 0 40px rgba(0,198,255,0.05);
            margin-bottom: 20px;
        }
        .header-card h1 {
            color: #00c6ff;
            font-size: 28px;
            margin-bottom: 4px;
        }
        .header-card .sub {
            color: #888;
            font-size: 14px;
        }
        .header-card .stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .header-card .stats .stat-item {
            background: #0d0d0d;
            padding: 8px 18px;
            border-radius: 12px;
            border: 1px solid #00c6ff15;
        }
        .header-card .stats .stat-item .num {
            color: #00c6ff;
            font-size: 20px;
            font-weight: 700;
        }
        .header-card .stats .stat-item .label {
            color: #888;
            font-size: 12px;
        }
        .btn {
            padding: 10px 24px;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-size: 13px;
            font-family: 'Poppins', sans-serif;
        }
        .btn-refresh {
            background: #00c6ff22;
            color: #00c6ff;
            border: 1px solid #00c6ff44;
        }
        .btn-refresh:hover {
            background: #00c6ff44;
        }
        .btn-back {
            background: #444;
            color: #fff;
        }
        .btn-back:hover {
            background: #555;
        }
        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .filter-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 12px 0 16px 0;
        }
        .filter-group .btn-filter {
            background: #222;
            color: #aaa;
            border: 1px solid #333;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.3s;
        }
        .filter-group .btn-filter:hover {
            background: #333;
            color: #fff;
        }
        .filter-group .btn-filter.active {
            background: #00c6ff22;
            color: #00c6ff;
            border-color: #00c6ff44;
        }
        .search-box {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .search-box input {
            flex: 1;
            min-width: 200px;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #00c6ff33;
            background: #0d0d0d;
            color: #fff;
            font-size: 14px;
            outline: none;
            font-family: 'Poppins', sans-serif;
            transition: 0.3s;
        }
        .search-box input:focus {
            border-color: #00c6ff;
            box-shadow: 0 0 20px rgba(0,198,255,0.08);
        }
        .search-box input::placeholder {
            color: #555;
        }

        /* PRODUCT GRID */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }
        .product-card {
            background: #1a1a1a;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #00c6ff15;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .product-card:hover {
            transform: translateY(-5px);
            border-color: #00c6ff44;
            box-shadow: 0 12px 40px rgba(0,198,255,0.08);
        }
        .product-card .image-wrapper {
            width: 100%;
            height: 160px;
            border-radius: 12px;
            overflow: hidden;
            background: #0d0d0d;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
            border: 1px solid #00c6ff08;
        }
        .product-card .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .product-card .image-wrapper .no-image {
            color: #444;
            font-size: 13px;
            text-align: center;
        }
        .product-card .product-name {
            font-size: 16px;
            font-weight: 700;
            color: #f1f5f9;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .product-card .product-id {
            font-size: 11px;
            color: #666;
            margin-bottom: 6px;
        }
        .product-card .product-price {
            font-size: 20px;
            font-weight: 800;
            color: #00c6ff;
        }
        .product-card .product-price .original {
            font-size: 14px;
            color: #666;
            text-decoration: line-through;
            font-weight: 400;
            margin-right: 8px;
        }
        .product-card .product-price .markup-badge {
            font-size: 10px;
            background: #ffaa0044;
            color: #ffaa00;
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: 600;
            margin-left: 6px;
        }
        .product-card .product-desc {
            font-size: 13px;
            color: #94a3b8;
            margin: 6px 0 10px 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .product-card .product-stock {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            margin-bottom: 10px;
        }
        .product-card .product-stock .stock-badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        .product-card .product-stock .stock-badge.available {
            background: #00ffaa22;
            color: #00ffaa;
        }
        .product-card .product-stock .stock-badge.unavailable {
            background: #ff444422;
            color: #ff4444;
        }
        .product-card .product-stock .stock-badge.low {
            background: #ffaa0022;
            color: #ffaa00;
        }
        .product-card .btn-check-stock {
            width: 100%;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid #00c6ff33;
            background: rgba(0,198,255,0.05);
            color: #00c6ff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Poppins', sans-serif;
        }
        .product-card .btn-check-stock:hover {
            background: rgba(0,198,255,0.15);
            border-color: #00c6ff66;
        }
        .product-card .btn-check-stock:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .product-card .status-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .product-card .status-badge.available {
            background: #00ffaa22;
            color: #00ffaa;
        }
        .product-card .status-badge.unavailable {
            background: #ff444422;
            color: #ff4444;
        }

        .no-data {
            color: #666;
            text-align: center;
            padding: 40px 0;
            font-size: 14px;
        }
        .loading {
            color: #888;
            text-align: center;
            padding: 20px 0;
            font-size: 14px;
        }
        .env-status {
            text-align: center;
            font-size: 11px;
            color: #555;
            margin-top: 8px;
        }
        .security-badge {
            text-align: center;
            font-size: 10px;
            color: #444;
            margin-top: 12px;
            border-top: 1px solid #00c6ff15;
            padding-top: 12px;
        }
        .stock-modal-content {
            padding: 10px 0;
        }
        .stock-modal-content .row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #00c6ff08;
        }
        .stock-modal-content .row:last-child {
            border-bottom: none;
        }
        .stock-modal-content .label {
            color: #888;
        }
        .stock-modal-content .value {
            color: #fff;
            font-weight: 600;
        }
        .stock-modal-content .value.green {
            color: #00ffaa;
        }
        .stock-modal-content .value.red {
            color: #ff4444;
        }
        .stock-modal-content .value.yellow {
            color: #ffaa00;
        }

        @media (max-width: 600px) {
            .product-grid {
                grid-template-columns: 1fr 1fr;
            }
            .header-card {
                padding: 20px 16px;
            }
            .header-card .stats {
                gap: 10px;
            }
            .header-card .stats .stat-item {
                padding: 6px 14px;
            }
            .header-card .stats .stat-item .num {
                font-size: 16px;
            }
            .product-card .image-wrapper {
                height: 120px;
            }
            .product-card .product-price {
                font-size: 17px;
            }
        }
        @media (max-width: 420px) {
            .product-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ===== HEADER ===== -->
        <div class="header-card">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;">
                <div>
                    <h1>📦 Premku Products</h1>
                    <div class="sub">Daftar produk dengan markup harga 30%</div>
                </div>
                <div class="header-actions">
                    <button class="btn btn-refresh" onclick="loadProducts()">🔄 Refresh</button>
                    <button class="btn btn-back" onclick="location.href='/'">🏠 Home</button>
                </div>
            </div>
            <div class="stats">
                <div class="stat-item">
                    <div class="num" id="totalProducts">0</div>
                    <div class="label">Total Produk</div>
                </div>
                <div class="stat-item">
                    <div class="num" id="availableProducts" style="color:#00ffaa;">0</div>
                    <div class="label">Tersedia</div>
                </div>
                <div class="stat-item">
                    <div class="num" id="unavailableProducts" style="color:#ff4444;">0</div>
                    <div class="label">Tidak Tersedia</div>
                </div>
                <div class="stat-item">
                    <div class="num" id="totalStock" style="color:#ffaa00;">0</div>
                    <div class="label">Total Stok</div>
                </div>
            </div>
            <div class="env-status" id="envStatus">🔌 Mengambil data produk...</div>
        </div>

        <!-- ===== FILTER & SEARCH ===== -->
        <div class="header-card">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Cari produk..." oninput="filterProducts()">
                <button class="btn btn-refresh" onclick="document.getElementById('searchInput').value='';filterProducts();" style="padding:10px 20px;">Clear</button>
            </div>
            <div class="filter-group">
                <button class="btn-filter active" data-filter="all" onclick="setFilter('all')">📋 Semua</button>
                <button class="btn-filter" data-filter="available" onclick="setFilter('available')">✅ Tersedia</button>
                <button class="btn-filter" data-filter="unavailable" onclick="setFilter('unavailable')">❌ Tidak Tersedia</button>
                <button class="btn-filter" data-filter="lowstock" onclick="setFilter('lowstock')">⚠️ Stok Menipis (&lt; 10)</button>
            </div>
        </div>

        <!-- ===== PRODUCT GRID ===== -->
        <div id="productContainer">
            <div class="loading">⏳ Memuat produk...</div>
        </div>

        <div class="text-muted" style="text-align:center;margin-top:20px;color:#666;font-size:12px;">
            © Shine Shop · Premku Products
        </div>
        <div class="security-badge">🔒 Data dari API Premku · Markup 30%</div>
    </div>

    <script>
        // ===================== KONFIGURASI =====================
        const API_KEY = 'd18db436519ea72a85bc49ff62f82b82'; // Ganti dengan API key Anda
        const PRODUCTS_URL = 'https://premku.com/api/products';
        const STOCK_URL = 'https://premku.com/api/stock';
        const MARKUP_PERCENT = 30; // 30% markup

        let allProducts = [];
        let filteredProducts = [];
        let currentFilter = 'all';
        let searchQuery = '';

        // ===================== LOAD PRODUCTS =====================
        async function loadProducts() {
            const container = document.getElementById('productContainer');
            const statusEl = document.getElementById('envStatus');
            container.innerHTML = '<div class="loading">⏳ Memuat produk...</div>';

            try {
                statusEl.textContent = '⏳ Mengambil data dari Premku...';
                statusEl.style.color = '#888';

                const response = await fetch(PRODUCTS_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        api_key: API_KEY
                    })
                });

                if (!response.ok) {
                    throw new Error('Gagal mengambil data: ' + response.status);
                }

                const data = await response.json();
                console.log('📦 Data Premku:', data);

                if (!data.success || !data.products) {
                    throw new Error(data.message || 'Format data tidak valid');
                }

                allProducts = data.products;
                filteredProducts = [...allProducts];
                updateStats();
                renderProducts();
                statusEl.textContent = `✅ ${allProducts.length} produk dimuat`;
                statusEl.style.color = '#00ffaa';

            } catch (err) {
                console.error('Error load products:', err);
                statusEl.textContent = '❌ ' + err.message;
                statusEl.style.color = '#ff6666';
                container.innerHTML = `
                    <div style="text-align:center;padding:40px;color:#ff6666;">
                        ❌ Gagal memuat produk: ${err.message}
                        <br><br>
                        <button class="btn btn-refresh" onclick="loadProducts()">🔄 Coba Lagi</button>
                    </div>
                `;
            }
        }

        // ===================== UPDATE STATS =====================
        function updateStats() {
            const total = allProducts.length;
            const available = allProducts.filter(p => p.status === 'available').length;
            const unavailable = allProducts.filter(p => p.status === 'unavailable').length;
            const totalStock = allProducts.reduce((sum, p) => sum + (p.stock || 0), 0);

            document.getElementById('totalProducts').textContent = total;
            document.getElementById('availableProducts').textContent = available;
            document.getElementById('unavailableProducts').textContent = unavailable;
            document.getElementById('totalStock').textContent = totalStock;
        }

        // ===================== RENDER PRODUCTS =====================
        function renderProducts() {
            const container = document.getElementById('productContainer');

            let productsToShow = filteredProducts;

            // Filter
            if (currentFilter === 'available') {
                productsToShow = productsToShow.filter(p => p.status === 'available');
            } else if (currentFilter === 'unavailable') {
                productsToShow = productsToShow.filter(p => p.status === 'unavailable');
            } else if (currentFilter === 'lowstock') {
                productsToShow = productsToShow.filter(p => p.status === 'available' && (p.stock || 0) < 10);
            }

            // Search
            if (searchQuery) {
                const q = searchQuery.toLowerCase();
                productsToShow = productsToShow.filter(p =>
                    (p.name || '').toLowerCase().includes(q) ||
                    (p.description || '').toLowerCase().includes(q) ||
                    String(p.id).includes(q)
                );
            }

            if (productsToShow.length === 0) {
                container.innerHTML = '<div class="no-data">📭 Tidak ada produk yang sesuai</div>';
                return;
            }

            let html = '<div class="product-grid">';
            productsToShow.forEach(product => {
                const isAvailable = product.status === 'available';
                const stock = product.stock || 0;
                const originalPrice = product.price || 0;
                const markedUpPrice = Math.round(originalPrice * (1 + MARKUP_PERCENT / 100));

                // Status badge
                let statusBadge = '';
                let stockBadge = '';
                if (isAvailable) {
                    statusBadge = `<span class="status-badge available">✅ Tersedia</span>`;
                    if (stock < 10 && stock > 0) {
                        stockBadge = `<span class="stock-badge low">⚠️ Stok ${stock}</span>`;
                    } else if (stock > 0) {
                        stockBadge = `<span class="stock-badge available">✅ Stok ${stock}</span>`;
                    } else {
                        stockBadge = `<span class="stock-badge unavailable">❌ Habis</span>`;
                    }
                } else {
                    statusBadge = `<span class="status-badge unavailable">❌ Tidak Tersedia</span>`;
                    stockBadge = `<span class="stock-badge unavailable">❌ Tidak Tersedia</span>`;
                }

                html += `
                    <div class="product-card" data-id="${product.id}">
                        ${statusBadge}
                        <div class="image-wrapper">
                            ${product.image ? 
                                `<img src="${product.image}" alt="${product.name}" loading="lazy" onerror="this.parentElement.innerHTML='<span class=\\'no-image\\'>🖼️ No Image</span>'">` :
                                `<span class="no-image">🖼️ No Image</span>`
                            }
                        </div>
                        <div class="product-name">${product.name || 'Unknown'}</div>
                        <div class="product-id">🆔 ID: ${product.id}</div>
                        <div class="product-price">
                            <span class="original">Rp ${originalPrice.toLocaleString('id-ID')}</span>
                            Rp ${markedUpPrice.toLocaleString('id-ID')}
                            <span class="markup-badge">+${MARKUP_PERCENT}%</span>
                        </div>
                        ${product.description ? `<div class="product-desc">${product.description}</div>` : ''}
                        <div class="product-stock">
                            ${stockBadge}
                        </div>
                        <button class="btn-check-stock" onclick="checkStock(${product.id}, '${product.name}')" ${!isAvailable ? 'disabled' : ''}>
                            🔍 Cek Stok
                        </button>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        // ===================== FILTER =====================
        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.btn-filter').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === filter);
            });
            renderProducts();
        }

        function filterProducts() {
            searchQuery = document.getElementById('searchInput').value.trim();
            renderProducts();
        }

        // ===================== CHECK STOCK =====================
        async function checkStock(productId, productName) {
            Swal.fire({
                title: '⏳ Mengecek Stok',
                text: `Mengecek stok ${productName}...`,
                timerProgressBar: true,
                didOpen: () => {
                    Swal.showLoading();
                },
                allowOutsideClick: false
            });

            try {
                const response = await fetch(STOCK_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        api_key: API_KEY,
                        product_id: productId
                    })
                });

                if (!response.ok) {
                    throw new Error('Gagal mengambil data stok: ' + response.status);
                }

                const data = await response.json();
                console.log('📊 Data Stok:', data);

                Swal.close();

                if (data.success) {
                    const stock = data.stock || 0;
                    const stockStatus = stock > 0 ? '✅ Tersedia' : '❌ Habis';
                    const stockColor = stock > 10 ? '#00ffaa' : stock > 0 ? '#ffaa00' : '#ff4444';

                    Swal.fire({
                        title: `📦 ${data.product || productName}`,
                        html: `
                            <div class="stock-modal-content">
                                <div class="row">
                                    <span class="label">🆔 ID</span>
                                    <span class="value">${productId}</span>
                                </div>
                                <div class="row">
                                    <span class="label">📦 Produk</span>
                                    <span class="value">${data.product || productName}</span>
                                </div>
                                <div class="row">
                                    <span class="label">📊 Stok</span>
                                    <span class="value" style="color:${stockColor};">${stock} unit</span>
                                </div>
                                <div class="row">
                                    <span class="label">📌 Status</span>
                                    <span class="value" style="color:${stockColor};">${stockStatus}</span>
                                </div>
                            </div>
                        `,
                        icon: stock > 0 ? 'success' : 'error',
                        confirmButtonColor: '#00c6ff'
                    });
                } else {
                    throw new Error(data.message || 'Gagal mengecek stok');
                }

            } catch (err) {
                Swal.close();
                console.error('Error check stock:', err);
                Swal.fire({
                    title: '❌ Gagal',
                    text: err.message,
                    icon: 'error',
                    confirmButtonColor: '#ff4444'
                });
            }
        }

        // ===================== ANTI INSPECT =====================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' ||
                (e.ctrlKey && e.shiftKey && ['I', 'C', 'J'].includes(e.key)) ||
                (e.ctrlKey && e.key === 'u')) {
                e.preventDefault();
                return false;
            }
        });

        // ===================== INIT =====================
        document.addEventListener('DOMContentLoaded', function() {
            loadProducts();
            console.log('📦 Premku Products siap!');
            console.log('📈 Markup harga:', MARKUP_PERCENT + '%');
        });
    </script>
</body>
</html>
