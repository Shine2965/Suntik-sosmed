<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shine Shop - App Premium</title>
<style>
:root {
  --bg: #090d16;
  --glass: rgba(255, 255, 255, 0.04);
  --glass-strong: rgba(255, 255, 255, 0.09);
  --border: rgba(255, 255, 255, 0.07);
  --accent1: #8b5cf6;
  --accent2: #06b6d4;
  --accent-gradient: linear-gradient(135deg, #8b5cf6, #06b6d4);
  --text: #f1f5f9;
  --text-muted: #94a3b8;
  --danger: #f87171;
  --discount-bg: #f59e0b;
  --discount-text: #090d16;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  color: var(--text);
  background: linear-gradient(-45deg, #0f172a, #1e293b, #0f172a, #0b1524);
  background-size: 400% 400%;
  animation: gradientBG 20s ease infinite;
  min-height: 100vh;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
@keyframes gradientBG {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--accent1); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent2); }

.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 24px;
  backdrop-filter: blur(20px) saturate(1.2);
  -webkit-backdrop-filter: blur(20px) saturate(1.2);
  background: rgba(15, 23, 42, 0.6);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 80;
}
.header.scrolled { background: rgba(9, 13, 22, 0.85); }
.brand { display: flex; align-items: center; gap: 14px; }
.logo {
  width: 44px; height: 44px; border-radius: var(--radius-sm);
  overflow: hidden; background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border);
  box-shadow: 0 0 20px rgba(139, 92, 246, 0.25);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.logo img { width: 100%; height: 100%; object-fit: cover; }
h1 {
  font-size: 18px; margin: 0; font-weight: 600; letter-spacing: 0.3px;
  background: var(--accent-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.hamburger-btn {
  margin-left: auto; background: var(--glass);
  border: 1px solid var(--border); padding: 8px 12px;
  border-radius: var(--radius-sm); cursor: pointer;
  display: flex; flex-direction: column; gap: 4.5px;
}
.hamburger-btn:hover { background: var(--glass-strong); border-color: rgba(255,255,255,0.2); transform: scale(1.02); }
.hamburger-icon span {
  display: block; height: 2px; width: 22px; background: white;
  border-radius: 10px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.hamburger-btn.active .hamburger-icon span:nth-child(1) { transform: rotate(45deg) translateY(5px) translateX(2px); }
.hamburger-btn.active .hamburger-icon span:nth-child(2) { opacity: 0; transform: scale(0.8); }
.hamburger-btn.active .hamburger-icon span:nth-child(3) { transform: rotate(-45deg) translateY(-5px) translateX(2px); }

.offcanvas {
  position: fixed; top: 0; left: -300px; width: 280px; height: 100%;
  background: rgba(9, 13, 22, 0.97); backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px); padding: 30px 20px; z-index: 100;
  border-right: 1px solid var(--border);
  box-shadow: 12px 0 48px rgba(0, 0, 0, 0.6);
  transition: left 0.4s cubic-bezier(0.4, 0, 0.2, 1); overflow-y: auto;
}
.offcanvas.open { left: 0; }
.offcanvas-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
.offcanvas-header .brand-text { font-size: 18px; font-weight: 600; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.close-offcanvas { background: var(--glass); border: 1px solid var(--border); color: var(--text-muted); padding: 6px 14px; border-radius: var(--radius-sm); cursor: pointer; font-size: 14px; }
.close-offcanvas:hover { background: var(--glass-strong); color: white; border-color: var(--danger); }
.menu-list { list-style: none; padding: 0; margin-top: 8px; }
.menu-list li { margin-bottom: 8px; }
.menu-list a { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--glass); border-radius: var(--radius-sm); color: var(--text-muted); text-decoration: none; border: 1px solid var(--border); font-weight: 500; font-size: 14px; }
.menu-list a:hover { background: rgba(139, 92, 246, 0.12); color: white; border-color: var(--accent1); transform: translateX(8px); box-shadow: 0 4px 12px rgba(139, 92, 246, 0.15); }
.menu-list a .icon { font-size: 18px; }
.overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); opacity: 0; pointer-events: none; z-index: 90; transition: opacity 0.4s ease; }
.overlay.show { opacity: 1; pointer-events: auto; }

.container {
  max-width: 900px; margin: 30px auto; padding: 30px 35px;
  border-radius: var(--radius);
  background: rgba(30, 41, 59, 0.35);
  backdrop-filter: blur(20px) saturate(1.1);
  -webkit-backdrop-filter: blur(20px) saturate(1.1);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  animation: fadeUp 0.6s ease both;
}
@keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

h2 { text-align: center; margin-top: 0; margin-bottom: 28px; font-weight: 700; font-size: 26px; letter-spacing: -0.5px; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

.product-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin-top: 16px;
}
.product-item {
  background: #0d0d0d; border-radius: 16px; padding: 18px 16px;
  border: 1px solid #00ffaa10; transition: 0.3s;
}
.product-item:hover { border-color: #00ffaa33; transform: translateY(-3px); box-shadow: 0 8px 30px rgba(0,255,170,0.05); }
.product-item .product-name { color: #fff; font-size: 15px; font-weight: 600; }
.product-item .product-price { color: #00ffaa; font-size: 16px; font-weight: 700; margin-top: 4px; }
.product-item .product-price .original { color: #666; font-size: 12px; text-decoration: line-through; font-weight: 400; margin-right: 6px; }
.product-item .product-stock { font-size: 12px; margin-top: 4px; }
.product-item .product-stock.available { color: #22c55e; }
.product-item .product-stock.unavailable { color: #ef4444; }
.product-item .product-stock.low { color: #ffaa00; }
.product-item .product-desc { color: #888; font-size: 12px; margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.product-item .product-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.product-item .product-image { width: 100%; height: 120px; border-radius: 10px; overflow: hidden; background: #1a1a1a; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; border: 1px solid #00ffaa10; }
.product-item .product-image img { width: 100%; height: 100%; object-fit: cover; }
.product-item .product-image .no-image { color: #444; font-size: 12px; }
.profit-badge { display: inline-block; background: #ffaa0022; color: #ffaa00; border: 1px solid #ffaa0044; padding: 2px 10px; border-radius: 20px; font-size: 10px; font-weight: 600; margin-left: 6px; }
.btn { padding: 8px 16px; border-radius: 30px; border: none; font-weight: 600; cursor: pointer; transition: 0.3s; font-size: 12px; font-family: 'Poppins', sans-serif; }
.btn-beli { background: #ffaa0044; color: #ffaa00; border: 1px solid #ffaa0055; }
.btn-beli:hover { background: #ffaa0066; }
.btn-beli:disabled { opacity: 0.3; cursor: not-allowed; }
.btn-stock { background: #00ccff44; color: #00ccff; border: 1px solid #00ccff55; }
.btn-stock:hover { background: #00ccff66; }
.btn-refresh { background: #00ffaa22; color: #00ffaa; border: 1px solid #00ffaa44; padding: 8px 16px; border-radius: 30px; font-weight: 600; cursor: pointer; font-size: 12px; }
.btn-refresh:hover { background: #00ffaa44; }
.loading-spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid #00ffaa33; border-top-color: #00ffaa; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.text-muted { color: #666; font-size: 12px; }
.env-status { text-align: center; font-size: 11px; color: #555; margin-top: 8px; }
.filter-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.filter-row input { flex: 1; min-width: 200px; padding: 10px 16px; border-radius: 12px; border: 1px solid #00ffaa33; background: #0d0d0d; color: #fff; font-size: 13px; outline: none; font-family: 'Poppins', sans-serif; }
.filter-row input:focus { border-color: #00ffaa; }
.filter-row input::placeholder { color: #555; }
.filter-row .filter-stock select { padding: 10px 14px; border-radius: 12px; border: 1px solid #00ffaa33; background: #0d0d0d; color: #fff; font-size: 13px; outline: none; font-family: 'Poppins', sans-serif; }

@media (max-width: 600px) {
  .product-grid { grid-template-columns: 1fr; }
  .container { padding: 20px 16px; margin: 16px 12px; border-radius: var(--radius-sm); }
  .header { padding: 10px 14px; }
  h1 { font-size: 15px; }
  h2 { font-size: 20px; }
  .filter-row { flex-direction: column; }
  .filter-row input { min-width: unset; width: 100%; }
  .filter-row .filter-stock { width: 100%; }
  .filter-row .filter-stock select { width: 100%; }
}
</style>
</head>
<body>
<header class="header">
  <div class="brand">
    <div class="logo"><img src="/home/logo.png" alt="Shine Shop Logo"></div>
    <h1>Shine Shop</h1>
  </div>
  <button class="hamburger-btn" id="menuToggle">
    <div class="hamburger-icon"><span></span><span></span><span></span></div>
  </button>
</header>
<div id="menuOverlay" class="overlay"></div>
<nav id="siteMenu" class="offcanvas">
  <div class="offcanvas-header">
    <span class="brand-text">Menu Utama</span>
    <button class="close-offcanvas" id="menuClose">✕</button>
  </div>
  <ul class="menu-list">
    <li><a href='/sosmed-2/cekstatus'><span class="icon">📦</span> Cek Pesanan</a></li>
    <li><a href='https://whatsapp.com/channel/0029Vb8pYHd0G0XjnloL680y'><span class="icon">📢</span> Channel WhatsApp</a></li>
  </ul>
</nav>
<script>
const toggleBtn=document.getElementById("menuToggle");
const closeBtn=document.getElementById("menuClose");
const offcanvas=document.getElementById("siteMenu");
const overlay=document.getElementById("menuOverlay");
function openMenu(){ offcanvas.classList.add("open"); overlay.classList.add("show"); toggleBtn.classList.add("active"); }
function closeMenu(){ offcanvas.classList.remove("open"); overlay.classList.remove("show"); toggleBtn.classList.remove("active"); }
toggleBtn.onclick=()=> offcanvas.classList.contains("open")?closeMenu():openMenu();
closeBtn.onclick=closeMenu;
overlay.onclick=closeMenu;
</script>

<div class="container">
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;">
    <h2 style="margin-bottom:0;">📦 List Produk</h2>
    <button class="btn-refresh" onclick="loadProducts()">🔄 Refresh</button>
  </div>
  <div class="env-status" id="envStatus">🔌 Memuat produk...</div>
  <div class="filter-row" style="margin-top:16px;">
    <input type="text" id="searchInput" placeholder="🔍 Cari produk..." oninput="filterProducts()">
    <div class="filter-stock">
      <select id="stockFilter" onchange="filterProducts()">
        <option value="all">📊 Semua Stok</option>
        <option value="available">✅ Tersedia</option>
        <option value="low">⚠️ Stok Menipis (&lt;10)</option>
        <option value="unavailable">❌ Habis</option>
      </select>
    </div>
  </div>
  <div id="productCount" style="font-size:12px;color:#666;text-align:right;margin-bottom:8px;"></div>
  <div id="productGrid" class="product-grid">
    <div style="text-align:center;padding:40px;color:#888;grid-column:1/-1;">
      <div class="loading-spinner"></div>
      <div style="margin-top:12px;">⏳ Memuat produk...</div>
    </div>
  </div>
  <div class="text-muted" style="text-align:center;margin-top:20px;">© Shine Shop · App Premium (+30% profit)</div>
</div>

<script>
const PREMKU_API_KEY = 'd18db436519ea72a85bc49ff62f82b82';
const PREMKU_PRODUCTS_URL = 'https://premku.com/api/products';
const PREMKU_STOCK_URL = 'https://premku.com/api/stock';
const PROFIT_PERCENT = 30;

let productsData = [];
let filteredProducts = [];

async function apiFetch(url, payload) {
  try {
    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!response.ok) {
      const text = await response.text();
      throw new Error(`HTTP ${response.status}: ${text.substring(0, 100)}`);
    }
    return await response.json();
  } catch (err) {
    console.error('❌ API Error:', err);
    throw err;
  }
}

async function loadProducts() {
  const grid = document.getElementById('productGrid');
  const statusEl = document.getElementById('envStatus');
  grid.innerHTML = `<div style="text-align:center;padding:40px;color:#888;grid-column:1/-1;"><div class="loading-spinner"></div><div style="margin-top:12px;">⏳ Memuat produk...</div></div>`;
  statusEl.textContent = '⏳ Mengambil data produk...';
  statusEl.style.color = '#888';

  try {
    const data = await apiFetch(PREMKU_PRODUCTS_URL, { api_key: PREMKU_API_KEY });
    console.log('📦 Premku Products Response:', data);

    if (data.success === true && data.products) {
      productsData = data.products.map(p => ({
        ...p,
        selling_price: Math.round(p.price * (1 + PROFIT_PERCENT / 100)),
        profit: Math.round(p.price * (PROFIT_PERCENT / 100))
      }));
      statusEl.textContent = `✅ ${productsData.length} produk dimuat`;
      statusEl.style.color = '#00ffaa';
      filterProducts();
    } else {
      statusEl.textContent = '❌ ' + (data.message || 'Gagal memuat produk');
      statusEl.style.color = '#ff6666';
      grid.innerHTML = `
        <div style="text-align:center;padding:40px;color:#ff6666;grid-column:1/-1;">
          <div style="font-size:36px;">❌</div>
          <div style="margin-top:8px;font-weight:600;">Gagal Memuat Produk</div>
          <div style="font-size:13px;color:#888;margin-top:4px;">${data.message || 'Coba refresh'}</div>
          <button class="btn-refresh" onclick="loadProducts()" style="margin-top:12px;">🔄 Coba Lagi</button>
        </div>
      `;
    }
  } catch (err) {
    console.error('Error load products:', err);
    statusEl.textContent = '❌ ' + err.message;
    statusEl.style.color = '#ff6666';
    grid.innerHTML = `
      <div style="text-align:center;padding:40px;color:#ff6666;grid-column:1/-1;">
        <div style="font-size:36px;">❌</div>
        <div style="margin-top:8px;font-weight:600;">Error: ${err.message}</div>
        <button class="btn-refresh" onclick="loadProducts()" style="margin-top:12px;">🔄 Coba Lagi</button>
      </div>
    `;
  }
}

function filterProducts() {
  const search = document.getElementById('searchInput').value.toLowerCase().trim();
  const stockFilter = document.getElementById('stockFilter').value;
  filteredProducts = productsData.filter(p => {
    if (search && !p.name.toLowerCase().includes(search) && !String(p.id).includes(search)) return false;
    if (stockFilter === 'available' && p.stock <= 0) return false;
    if (stockFilter === 'low' && p.stock > 10) return false;
    if (stockFilter === 'low' && p.stock <= 0) return false;
    if (stockFilter === 'unavailable' && p.stock > 0) return false;
    return true;
  });
  renderProducts(filteredProducts);
  document.getElementById('productCount').textContent = `Menampilkan ${filteredProducts.length} dari ${productsData.length} produk`;
}

function renderProducts(products) {
  const grid = document.getElementById('productGrid');
  if (products.length === 0) {
    grid.innerHTML = `<div style="text-align:center;padding:40px;color:#888;grid-column:1/-1;"><div style="font-size:36px;">🔍</div><div>Tidak ada produk yang sesuai</div></div>`;
    return;
  }
  grid.innerHTML = products.map(p => {
    const stockClass = p.stock > 0 ? (p.stock < 10 ? 'low' : 'available') : 'unavailable';
    const stockLabel = p.stock > 0 ? (p.stock < 10 ? '⚠️ Stok: ' + p.stock : '✅ Stok: ' + p.stock) : '❌ Habis';
    const isAvailable = p.stock > 0 && p.status === 'available';
    return `
      <div class="product-item">
        <div class="product-image">
          ${p.image ? `<img src="${p.image}" alt="${p.name}" onerror="this.parentElement.innerHTML='<span class=\\'no-image\\'>📷 No Image</span>'">` : `<span class="no-image">📷 No Image</span>`}
        </div>
        <div class="product-name">${p.name} <span class="profit-badge">+30%</span></div>
        <div class="product-price">
          <span class="original">Rp ${p.price.toLocaleString('id-ID')}</span>
          Rp ${p.selling_price.toLocaleString('id-ID')}
        </div>
        <div class="product-stock ${stockClass}">${stockLabel}</div>
        <div class="product-desc">${p.description || 'Tidak ada deskripsi'}</div>
        <div class="product-actions">
          <button class="btn btn-beli" onclick="beliProduk(${p.id}, '${p.name.replace(/'/g, "\\'")}', ${p.selling_price}, ${p.stock})" ${!isAvailable ? 'disabled' : ''}>
            ${isAvailable ? '🛒 Beli' : '❌ Habis'}
          </button>
          <button class="btn btn-stock" onclick="cekStok(${p.id}, '${p.name.replace(/'/g, "\\'")}')">📊 Cek Stok</button>
        </div>
      </div>
    `;
  }).join('');
}

async function cekStok(productId, productName) {
  try {
    const data = await apiFetch(PREMKU_STOCK_URL, { api_key: PREMKU_API_KEY, product_id: productId });
    console.log('📦 Stock Response:', data);
    if (data.success === true) {
      Swal.fire({
        title: '📊 Cek Stok',
        html: `
          <div style="text-align:center;">
            <div style="font-size:16px;font-weight:600;color:#fff;">${data.product || productName}</div>
            <div style="font-size:48px;font-weight:800;color:${data.stock > 0 ? '#00ffaa' : '#ef4444'};margin:12px 0;">${data.stock}</div>
            <div style="color:#888;font-size:13px;">${data.stock > 0 ? '✅ Tersedia' : '❌ Habis'}</div>
          </div>
        `,
        icon: data.stock > 0 ? 'success' : 'error',
        confirmButtonColor: '#00ccff'
      });
    } else {
      Swal.fire({ title: '❌ Gagal Cek Stok', text: data.message || 'Terjadi kesalahan', icon: 'error', confirmButtonColor: '#ff4444' });
    }
  } catch (err) {
    Swal.fire({ title: '❌ Error', text: err.message || 'Terjadi kesalahan', icon: 'error', confirmButtonColor: '#ff4444' });
  }
}

function beliProduk(productId, productName, price, stock) {
  if (stock <= 0) {
    Swal.fire({ title: '❌ Stok Habis', text: 'Produk ini sedang tidak tersedia.', icon: 'error', confirmButtonColor: '#ff4444' });
    return;
  }
  Swal.fire({
    title: '🛒 Beli Produk',
    html: `
      <div style="text-align:center;color:#ddd;">
        <div style="font-size:16px;font-weight:600;color:#fff;">${productName}</div>
        <div style="font-size:20px;font-weight:700;color:#00ffaa;margin:8px 0;">Rp ${price.toLocaleString('id-ID')}</div>
        <div style="color:#888;font-size:13px;">Stok: <strong style="color:#22c55e;">${stock}</strong></div>
        <div style="margin-top:12px;">
          <label style="color:#94a3b8;font-size:13px;">Jumlah</label>
          <input type="number" id="qtyInput" value="1" min="1" max="${stock}" style="width:100%;padding:10px;border-radius:10px;border:1px solid #00ffaa33;background:#0d0d0d;color:#fff;font-size:14px;margin-top:4px;text-align:center;">
        </div>
        <div style="margin-top:8px;font-size:12px;color:#888;">💰 Harga sudah termasuk keuntungan 30%</div>
      </div>
    `,
    icon: 'info',
    confirmButtonColor: '#00ffaa',
    confirmButtonText: '💳 Lanjut ke Pembayaran',
    showCancelButton: true,
    cancelButtonColor: '#444',
    cancelButtonText: 'Batal',
    preConfirm: () => {
      const qty = parseInt(document.getElementById('qtyInput').value);
      if (!qty || qty < 1) { Swal.showValidationMessage('Masukkan jumlah minimal 1'); return false; }
      if (qty > stock) { Swal.showValidationMessage(`Stok tersisa ${stock}`); return false; }
      return { qty };
    }
  }).then((result) => {
    if (result.isConfirmed && result.value) {
      const qty = result.value.qty;
      const total = price * qty;
      const refId = 'INV-' + Date.now() + '-' + Math.random().toString(36).substring(2,6);
      const params = new URLSearchParams({
        trx: refId,
        product_id: productId,
        product: productName,
        price: price,
        qty: qty,
        total: total
      });
      window.location.href = '/apprem/payment/?' + params.toString();
    }
  });
}

document.addEventListener('DOMContentLoaded', function() { loadProducts(); });
document.addEventListener("keydown", function(e){
  if(e.key === "F12") e.preventDefault();
  if(e.ctrlKey && e.shiftKey && ["I","J"].includes(e.key)) e.preventDefault();
  if(e.ctrlKey && e.key === "u") e.preventDefault();
});
console.log('📦 App Premium - List Produk siap!');
