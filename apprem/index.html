<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Produk - Shine Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            padding: 30px 20px;
            background: radial-gradient(circle at 20% 30%, #00ffaa10, transparent 50%),
                        radial-gradient(circle at 80% 70%, #00c6ff10, transparent 50%),
                        #0a0a0a;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .card {
            background: #1a1a1a;
            border-radius: 24px;
            padding: 30px 28px;
            border: 1px solid #00ffaa33;
            box-shadow: 0 0 40px rgba(0,255,170,0.05);
            margin-bottom: 20px;
        }
        .card h2 { color: #00ffaa; font-size: 22px; margin-bottom: 6px; }
        .card .sub { color: #888; font-size: 14px; margin-bottom: 20px; }
        .btn {
            padding: 12px 24px;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-size: 13px;
            font-family: 'Poppins', sans-serif;
        }
        .btn-primary { background: #00ffaa; color: #0a0a0a; }
        .btn-primary:hover { background: #00dd99; transform: scale(0.97); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-refresh { background: #00ffaa22; color: #00ffaa; border: 1px solid #00ffaa44; }
        .btn-refresh:hover { background: #00ffaa44; }
        .btn-small { padding: 6px 14px; font-size: 11px; }
        .btn-beli { background: #ffaa0044; color: #ffaa00; border: 1px solid #ffaa0055; }
        .btn-beli:hover { background: #ffaa0066; }
        .btn-beli:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn-stock { background: #00ccff44; color: #00ccff; border: 1px solid #00ccff55; }
        .btn-stock:hover { background: #00ccff66; }
        .text-muted { color: #666; font-size: 12px; }
        .text-success { color: #00ffaa; }
        .text-danger { color: #ff4444; }
        .text-warning { color: #ffaa00; }
        .text-info { color: #00ccff; }
        .env-status { text-align: center; font-size: 11px; color: #555; margin-top: 8px; }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }
        .product-item {
            background: #0d0d0d;
            border-radius: 16px;
            padding: 18px 16px;
            border: 1px solid #00ffaa10;
            transition: 0.3s;
        }
        .product-item:hover { border-color: #00ffaa33; transform: translateY(-3px); box-shadow: 0 8px 30px rgba(0,255,170,0.05); }
        .product-item .product-name { color: #fff; font-size: 15px; font-weight: 600; }
        .product-item .product-price { color: #00ffaa; font-size: 16px; font-weight: 700; margin-top: 4px; }
        .product-item .product-price .original { color: #666; font-size: 12px; text-decoration: line-through; font-weight: 400; margin-right: 6px; }
        .product-item .product-stock { font-size: 12px; margin-top: 4px; }
        .product-item .product-stock.available { color: #22c55e; }
        .product-item .product-stock.unavailable { color: #ef4444; }
        .product-item .product-stock.low { color: #ffaa00; }
        .product-item .product-desc { color: #888; font-size: 12px; margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .product-item .product-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
        .product-item .product-image {
            width: 100%; height: 120px; border-radius: 10px; overflow: hidden;
            background: #1a1a1a; margin-bottom: 10px;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid #00ffaa10;
        }
        .product-item .product-image img { width: 100%; height: 100%; object-fit: cover; }
        .product-item .product-image .no-image { color: #444; font-size: 12px; }
        .profit-badge {
            display: inline-block;
            background: #ffaa0022; color: #ffaa00;
            border: 1px solid #ffaa0044;
            padding: 2px 10px; border-radius: 20px;
            font-size: 10px; font-weight: 600;
            margin-left: 6px;
        }
        .loading-spinner {
            display: inline-block;
            width: 20px; height: 20px;
            border: 2px solid #00ffaa33;
            border-top-color: #00ffaa;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .filter-row {
            display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px;
        }
        .filter-row input {
            flex: 1; min-width: 200px; padding: 10px 16px; border-radius: 12px;
            border: 1px solid #00ffaa33; background: #0d0d0d; color: #fff;
            font-size: 13px; outline: none; font-family: 'Poppins', sans-serif;
        }
        .filter-row input:focus { border-color: #00ffaa; }
        .filter-row input::placeholder { color: #555; }
        .filter-row .filter-stock select {
            padding: 10px 14px; border-radius: 12px;
            border: 1px solid #00ffaa33; background: #0d0d0d; color: #fff;
            font-size: 13px; outline: none; font-family: 'Poppins', sans-serif;
        }
        .no-products { text-align: center; padding: 40px 20px; color: #888; }
        .no-products .icon { font-size: 48px; margin-bottom: 12px; }

        @media (max-width: 600px) {
            .product-grid { grid-template-columns: 1fr; }
            .card { padding: 20px 16px; }
            .filter-row { flex-direction: column; }
            .filter-row input { min-width: unset; width: 100%; }
            .filter-row .filter-stock { width: 100%; }
            .filter-row .filter-stock select { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;">
                <div>
                    <h2>📦 List Produk</h2>
                    <div class="sub">App Premium - Harga sudah termasuk keuntungan 30%</div>
                </div>
                <div style="display:flex;gap:10px;flex-wrap:wrap;">
                    <button class="btn btn-refresh btn-small" onclick="loadProducts()">🔄 Refresh</button>
                    <button class="btn btn-primary btn-small" onclick="location.href='/apprem/payment/'">💳 Beli Produk</button>
                </div>
            </div>
            <div class="env-status" id="envStatus">🔌 Memuat produk...</div>
        </div>

        <div class="card">
            <div class="filter-row">
                <input type="text" id="searchInput" placeholder="🔍 Cari produk..." oninput="filterProducts()">
                <div class="filter-stock">
                    <select id="stockFilter" onchange="filterProducts()">
                        <option value="all">📊 Semua Stok</option>
                        <option value="available">✅ Tersedia</option>
                        <option value="low">⚠️ Stok Menipis (&lt;10)</option>
                        <option value="unavailable">❌ Habis</option>
                    </select>
                </div>
            </div>
            <div id="productCount" style="font-size:12px;color:#666;text-align:right;"></div>
        </div>

        <div class="card" id="productCard">
            <div id="productGrid" class="product-grid">
                <div style="text-align:center;padding:40px;color:#888;grid-column:1/-1;">
                    <div class="loading-spinner"></div>
                    <div style="margin-top:12px;">⏳ Memuat produk...</div>
                </div>
            </div>
        </div>
        <div class="text-muted" style="text-align:center;margin-top:20px;">© Shine Shop · App Premium</div>
    </div>

    <script>
        const PREMKU_API_KEY = 'd18db436519ea72a85bc49ff62f82b82';
        const PREMKU_PRODUCTS_URL = 'https://premku.com/api/products';
        const PREMKU_STOCK_URL = 'https://premku.com/api/stock';
        const PROFIT_PERCENT = 30;

        let productsData = [];
        let filteredProducts = [];

        async function apiFetch(url, payload) {
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!response.ok) {
                    const text = await response.text();
                    throw new Error(`HTTP ${response.status}: ${text.substring(0, 100)}`);
                }
                return await response.json();
            } catch (err) {
                console.error('❌ API Error:', err);
                throw err;
            }
        }

        async function loadProducts() {
            const grid = document.getElementById('productGrid');
            const statusEl = document.getElementById('envStatus');
            grid.innerHTML = `<div style="text-align:center;padding:40px;color:#888;grid-column:1/-1;"><div class="loading-spinner"></div><div style="margin-top:12px;">⏳ Memuat produk...</div></div>`;
            statusEl.textContent = '⏳ Mengambil data produk...';
            statusEl.style.color = '#888';

            try {
                const data = await apiFetch(PREMKU_PRODUCTS_URL, { api_key: PREMKU_API_KEY });
                console.log('📦 Premku Products Response:', data);

                if (data.success === true && data.products) {
                    productsData = data.products.map(p => ({
                        ...p,
                        selling_price: Math.round(p.price * (1 + PROFIT_PERCENT / 100)),
                        profit: Math.round(p.price * (PROFIT_PERCENT / 100))
                    }));
                    statusEl.textContent = `✅ ${productsData.length} produk dimuat`;
                    statusEl.style.color = '#00ffaa';
                    filterProducts();
                } else {
                    statusEl.textContent = '❌ ' + (data.message || 'Gagal memuat produk');
                    statusEl.style.color = '#ff6666';
                    grid.innerHTML = `
                        <div style="text-align:center;padding:40px;color:#ff6666;grid-column:1/-1;">
                            <div style="font-size:36px;">❌</div>
                            <div style="margin-top:8px;font-weight:600;">Gagal Memuat Produk</div>
                            <div style="font-size:13px;color:#888;margin-top:4px;">${data.message || 'Coba refresh'}</div>
                            <button class="btn btn-refresh" onclick="loadProducts()" style="margin-top:12px;">🔄 Coba Lagi</button>
                        </div>
                    `;
                }
            } catch (err) {
                console.error('Error load products:', err);
                statusEl.textContent = '❌ ' + err.message;
                statusEl.style.color = '#ff6666';
                grid.innerHTML = `
                    <div style="text-align:center;padding:40px;color:#ff6666;grid-column:1/-1;">
                        <div style="font-size:36px;">❌</div>
                        <div style="margin-top:8px;font-weight:600;">Error: ${err.message}</div>
                        <button class="btn btn-refresh" onclick="loadProducts()" style="margin-top:12px;">🔄 Coba Lagi</button>
                    </div>
                `;
            }
        }

        function filterProducts() {
            const search = document.getElementById('searchInput').value.toLowerCase().trim();
            const stockFilter = document.getElementById('stockFilter').value;
            filteredProducts = productsData.filter(p => {
                if (search && !p.name.toLowerCase().includes(search) && !String(p.id).includes(search)) return false;
                if (stockFilter === 'available' && p.stock <= 0) return false;
                if (stockFilter === 'low' && p.stock > 10) return false;
                if (stockFilter === 'low' && p.stock <= 0) return false;
                if (stockFilter === 'unavailable' && p.stock > 0) return false;
                return true;
            });
            renderProducts(filteredProducts);
            document.getElementById('productCount').textContent = `Menampilkan ${filteredProducts.length} dari ${productsData.length} produk`;
        }

        function renderProducts(products) {
            const grid = document.getElementById('productGrid');
            if (products.length === 0) {
                grid.innerHTML = `<div class="no-products" style="grid-column:1/-1;"><div class="icon">🔍</div><div>Tidak ada produk yang sesuai</div></div>`;
                return;
            }
            grid.innerHTML = products.map(p => {
                const stockClass = p.stock > 0 ? (p.stock < 10 ? 'low' : 'available') : 'unavailable';
                const stockLabel = p.stock > 0 ? (p.stock < 10 ? '⚠️ Stok: ' + p.stock : '✅ Stok: ' + p.stock) : '❌ Habis';
                const isAvailable = p.stock > 0 && p.status === 'available';
                return `
                    <div class="product-item">
                        <div class="product-image">
                            ${p.image ? `<img src="${p.image}" alt="${p.name}" onerror="this.parentElement.innerHTML='<span class=\\'no-image\\'>📷 No Image</span>'">` : `<span class="no-image">📷 No Image</span>`}
                        </div>
                        <div class="product-name">${p.name} <span class="profit-badge">+30%</span></div>
                        <div class="product-price">
                            <span class="original">Rp ${p.price.toLocaleString('id-ID')}</span>
                            Rp ${p.selling_price.toLocaleString('id-ID')}
                        </div>
                        <div class="product-stock ${stockClass}">${stockLabel}</div>
                        <div class="product-desc">${p.description || 'Tidak ada deskripsi'}</div>
                        <div class="product-actions">
                            <button class="btn btn-beli btn-small" onclick="beliProduk(${p.id}, '${p.name.replace(/'/g, "\\'")}', ${p.selling_price}, ${p.stock})" ${!isAvailable ? 'disabled' : ''}>
                                ${isAvailable ? '🛒 Beli' : '❌ Habis'}
                            </button>
                            <button class="btn btn-stock btn-small" onclick="cekStok(${p.id}, '${p.name.replace(/'/g, "\\'")}')">📊 Cek Stok</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function cekStok(productId, productName) {
            try {
                const data = await apiFetch(PREMKU_STOCK_URL, { api_key: PREMKU_API_KEY, product_id: productId });
                console.log('📦 Stock Response:', data);
                if (data.success === true) {
                    Swal.fire({
                        title: '📊 Cek Stok',
                        html: `
                            <div style="text-align:center;">
                                <div style="font-size:16px;font-weight:600;color:#fff;">${data.product || productName}</div>
                                <div style="font-size:48px;font-weight:800;color:${data.stock > 0 ? '#00ffaa' : '#ef4444'};margin:12px 0;">${data.stock}</div>
                                <div style="color:#888;font-size:13px;">${data.stock > 0 ? '✅ Tersedia' : '❌ Habis'}</div>
                            </div>
                        `,
                        icon: data.stock > 0 ? 'success' : 'error',
                        confirmButtonColor: '#00ccff'
                    });
                } else {
                    Swal.fire({ title: '❌ Gagal Cek Stok', text: data.message || 'Terjadi kesalahan', icon: 'error', confirmButtonColor: '#ff4444' });
                }
            } catch (err) {
                Swal.fire({ title: '❌ Error', text: err.message || 'Terjadi kesalahan', icon: 'error', confirmButtonColor: '#ff4444' });
            }
        }

        function beliProduk(productId, productName, price, stock) {
            if (stock <= 0) {
                Swal.fire({ title: '❌ Stok Habis', text: 'Produk ini sedang tidak tersedia.', icon: 'error', confirmButtonColor: '#ff4444' });
                return;
            }
            Swal.fire({
                title: '🛒 Beli Produk',
                html: `
                    <div style="text-align:center;color:#ddd;">
                        <div style="font-size:16px;font-weight:600;color:#fff;">${productName}</div>
                        <div style="font-size:20px;font-weight:700;color:#00ffaa;margin:8px 0;">Rp ${price.toLocaleString('id-ID')}</div>
                        <div style="color:#888;font-size:13px;">Stok: <strong style="color:#22c55e;">${stock}</strong></div>
                        <div style="margin-top:12px;">
                            <label style="color:#94a3b8;font-size:13px;">Jumlah</label>
                            <input type="number" id="qtyInput" value="1" min="1" max="${stock}" style="width:100%;padding:10px;border-radius:10px;border:1px solid #00ffaa33;background:#0d0d0d;color:#fff;font-size:14px;margin-top:4px;text-align:center;">
                        </div>
                        <div style="margin-top:8px;font-size:12px;color:#888;">💰 Harga sudah termasuk keuntungan 30%</div>
                    </div>
                `,
                icon: 'info',
                confirmButtonColor: '#00ffaa',
                confirmButtonText: '💳 Lanjut ke Pembayaran',
                showCancelButton: true,
                cancelButtonColor: '#444',
                cancelButtonText: 'Batal',
                preConfirm: () => {
                    const qty = parseInt(document.getElementById('qtyInput').value);
                    if (!qty || qty < 1) { Swal.showValidationMessage('Masukkan jumlah minimal 1'); return false; }
                    if (qty > stock) { Swal.showValidationMessage(`Stok tersisa ${stock}`); return false; }
                    return { qty };
                }
            }).then((result) => {
                if (result.isConfirmed && result.value) {
                    const qty = result.value.qty;
                    const total = price * qty;
                    const refId = 'INV-' + Date.now() + '-' + Math.random().toString(36).substring(2,6);
                    const params = new URLSearchParams({
                        trx: refId,
                        product_id: productId,
                        product: productName,
                        price: price,
                        qty: qty,
                        total: total
                    });
                    window.location.href = '/apprem/payment/?' + params.toString();
                }
            });
        }

        document.addEventListener('DOMContentLoaded', function() { loadProducts(); });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I','C','J'].includes(e.key)) || (e.ctrlKey && e.key === 'u')) {
                e.preventDefault(); return false;
            }
        });
        console.log('📦 App Premium - List Produk siap!');
        console.log('💰 Profit 30% aktif');
    </script>
</body>
</html>
