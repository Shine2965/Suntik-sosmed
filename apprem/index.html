<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>App Premium - Daftar Produk</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Poppins',sans-serif;
  min-height:100vh;
  background:#0a0e1a;
  color:#fff;
  padding:20px;
  position:relative;
  overflow-x:hidden;
}
body::before{
  content:'';
  position:fixed;
  top:-50%;
  left:-50%;
  width:200%;
  height:200%;
  background:
    radial-gradient(circle at 20% 30%, rgba(0,198,255,0.10) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(0,114,255,0.08) 0%, transparent 50%),
    radial-gradient(circle at 50% 50%, rgba(168,85,247,0.05) 0%, transparent 60%);
  z-index:0;
  pointer-events:none;
}
.container{
  max-width:1100px;
  margin:0 auto;
  position:relative;
  z-index:1;
}
.header{
  text-align:center;
  margin-bottom:28px;
  padding:20px 0;
}
.header h1{
  font-size:28px;
  font-weight:800;
  background:linear-gradient(135deg,#f0f9ff 0%,#b6d4fe 40%,#a5b4fc 70%,#c4b5fd 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  margin-bottom:6px;
}
.header p{
  color:#94a3b8;
  font-size:14px;
  font-weight:300;
}
.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  justify-content:center;
  margin-bottom:24px;
  align-items:center;
}
.btn{
  padding:12px 22px;
  border-radius:999px;
  border:none;
  font-size:14px;
  font-weight:700;
  color:#fff;
  background:linear-gradient(135deg,#00c6ff,#0072ff);
  cursor:pointer;
  transition:all 0.25s ease;
  font-family:'Poppins',sans-serif;
  box-shadow:0 6px 20px rgba(0,114,255,0.25);
}
.btn:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 28px rgba(0,114,255,0.35);
}
.btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.btn-secondary{
  background:linear-gradient(135deg,#22c55e,#16a34a);
  box-shadow:0 6px 20px rgba(34,197,94,0.25);
}
.btn-secondary:hover{
  box-shadow:0 10px 28px rgba(34,197,94,0.35);
}
.btn-outline{
  background:transparent;
  border:1px solid rgba(255,255,255,0.15);
  box-shadow:none;
  color:#e2e8f0;
}
.btn-outline:hover{
  background:rgba(255,255,255,0.06);
  border-color:rgba(0,198,255,0.4);
}
.search-box{
  flex:1;
  min-width:200px;
  max-width:320px;
  padding:12px 16px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,0.08);
  background:rgba(255,255,255,0.05);
  color:#f1f5f9;
  font-size:14px;
  outline:none;
  font-family:'Poppins',sans-serif;
}
.search-box:focus{
  border-color:#00c6ff;
  box-shadow:0 0 0 3px rgba(0,198,255,0.12);
}
.search-box::placeholder{color:#64748b}
.status-bar{
  text-align:center;
  font-size:13px;
  color:#94a3b8;
  margin-bottom:18px;
  min-height:22px;
}
.status-bar.loading{color:#ffaa00}
.status-bar.error{color:#ef4444}
.status-bar.success{color:#22c55e}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:18px;
}
.card{
  background:rgba(255,255,255,0.04);
  backdrop-filter:blur(20px);
  border-radius:20px;
  border:1px solid rgba(255,255,255,0.06);
  overflow:hidden;
  transition:transform 0.25s ease, box-shadow 0.25s ease;
  display:flex;
  flex-direction:column;
}
.card:hover{
  transform:translateY(-4px);
  box-shadow:0 20px 50px rgba(0,0,0,0.4);
  border-color:rgba(0,198,255,0.2);
}
.card-img{
  width:100%;
  height:140px;
  object-fit:cover;
  background:rgba(0,0,0,0.3);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#64748b;
  font-size:40px;
}
.card-img img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.card-body{
  padding:16px;
  flex:1;
  display:flex;
  flex-direction:column;
}
.card-body h3{
  font-size:15px;
  font-weight:700;
  color:#f1f5f9;
  margin-bottom:6px;
  line-height:1.35;
}
.card-body .desc{
  font-size:12px;
  color:#94a3b8;
  margin-bottom:10px;
  line-height:1.5;
  flex:1;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.meta{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:12px;
  align-items:center;
}
.badge{
  font-size:11px;
  font-weight:600;
  padding:4px 10px;
  border-radius:999px;
}
.badge.available{
  background:rgba(34,197,94,0.15);
  color:#22c55e;
  border:1px solid rgba(34,197,94,0.3);
}
.badge.unavailable{
  background:rgba(239,68,68,0.15);
  color:#ef4444;
  border:1px solid rgba(239,68,68,0.3);
}
.stock{
  font-size:12px;
  color:#94a3b8;
}
.stock strong{color:#00ffaa}
.price-box{
  margin-top:auto;
  padding-top:10px;
  border-top:1px solid rgba(255,255,255,0.06);
}
.price-original{
  font-size:11px;
  color:#64748b;
  text-decoration:line-through;
}
.price-sell{
  font-size:18px;
  font-weight:800;
  color:#facc15;
  letter-spacing:-0.3px;
}
.price-sell span{
  font-size:12px;
  font-weight:500;
  color:#94a3b8;
}
.card-actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}
.card-actions .btn{
  flex:1;
  padding:10px;
  font-size:12px;
  border-radius:12px;
}
.card-actions .btn-sm{
  padding:10px 12px;
  flex:0 0 auto;
}

/* Stock check modal style via Swal */

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:60px 20px;
  color:#64748b;
}
.empty .icon{font-size:48px;margin-bottom:12px}

.profit-note{
  text-align:center;
  font-size:11px;
  color:#64748b;
  margin-top:24px;
  padding:12px;
  background:rgba(255,255,255,0.03);
  border-radius:12px;
}
.wib-time{
  text-align:center;
  font-size:11px;
  color:#64748b;
  margin-top:8px;
}
.wib-time span{color:#00ffaa;font-variant-numeric:tabular-nums}

@media(max-width:480px){
  .header h1{font-size:22px}
  .grid{grid-template-columns:1fr}
  .toolbar{flex-direction:column}
  .search-box{max-width:100%}
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>✦ App Premium</h1>
    <p>Daftar produk · Harga sudah termasuk keuntungan 30%</p>
  </div>

  <div class="toolbar">
    <input type="text" class="search-box" id="searchInput" placeholder="Cari produk...">
    <button class="btn" id="btnRefresh">🔄 Refresh</button>
    <button class="btn btn-secondary" id="btnCheckStock">📦 Cek Stok ID</button>
  </div>

  <div class="status-bar" id="statusBar">Memuat produk...</div>

  <div class="grid" id="productGrid">
    <div class="empty"><div class="icon">⏳</div>Memuat...</div>
  </div>

  <div class="profit-note">
    Harga jual = harga modal × 1.30 (keuntungan 30%). Stok diambil realtime dari API Premku.
  </div>
  <div class="wib-time">🕐 WIB: <span id="wibTime">--:--:--</span></div>
</div>

<script>
const PREMKU_API_KEY = "d18db436519ea72a85bc49ff62f82b82";
const PREMKU_PRODUCTS_URL = "/apprem/api/products.php";
const PREMKU_STOCK_URL = "/apprem/api/stock.php";
const MARKUP = 1.30; // 30% keuntungan

let allProducts = [];

function formatRp(n) {
  return 'Rp ' + Number(n || 0).toLocaleString('id-ID');
}

function getWIBTime() {
  return new Intl.DateTimeFormat('id-ID', {
    timeZone: 'Asia/Jakarta',
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',
    hour12: false
  }).format(new Date());
}

function updateWIB() {
  const el = document.getElementById('wibTime');
  if (el) el.textContent = getWIBTime();
}
setInterval(updateWIB, 1000);
updateWIB();

function setStatus(msg, type = '') {
  const el = document.getElementById('statusBar');
  el.textContent = msg;
  el.className = 'status-bar ' + type;
}

async function fetchProducts() {
  setStatus('⏳ Memuat daftar produk...', 'loading');
  document.getElementById('btnRefresh').disabled = true;

  try {
    const res = await fetch(PREMKU_PRODUCTS_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Accept': 'application/json'
      },
      body: JSON.stringify({ api_key: PREMKU_API_KEY })
    });

    const data = await res.json();
    console.log('Products response:', data);

    if (data.success && Array.isArray(data.products)) {
      allProducts = data.products;
      renderProducts(allProducts);
      setStatus(`✅ ${allProducts.length} produk dimuat`, 'success');
    } else {
      allProducts = [];
      renderProducts([]);
      setStatus('❌ Gagal memuat produk: ' + (data.message || 'Unknown error'), 'error');
    }
  } catch (err) {
    console.error(err);
    allProducts = [];
    renderProducts([]);
    setStatus('❌ Error: ' + err.message, 'error');
  }

  document.getElementById('btnRefresh').disabled = false;
}

function renderProducts(list) {
  const grid = document.getElementById('productGrid');
  const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();

  let filtered = list;
  if (q) {
    filtered = list.filter(p =>
      (p.name || '').toLowerCase().includes(q) ||
      (p.description || '').toLowerCase().includes(q) ||
      String(p.id).includes(q)
    );
  }

  if (!filtered.length) {
    grid.innerHTML = `<div class="empty"><div class="icon">📭</div>Tidak ada produk ditemukan</div>`;
    return;
  }

  grid.innerHTML = filtered.map(p => {
    const modal = Number(p.price) || 0;
    const sell = Math.ceil(modal * MARKUP);
    const available = (p.status === 'available' || (p.stock > 0));
    const stockText = typeof p.stock === 'number' ? p.stock : '-';
    const img = p.image
      ? `<img src="${p.image}" alt="${p.name || ''}" onerror="this.parentElement.innerHTML='📦'">`
      : '📦';

    return `
      <div class="card" data-id="${p.id}">
        <div class="card-img">${img}</div>
        <div class="card-body">
          <h3>${p.name || 'Produk #' + p.id}</h3>
          <div class="desc">${p.description || 'Tidak ada deskripsi'}</div>
          <div class="meta">
            <span class="badge ${available ? 'available' : 'unavailable'}">
              ${available ? '✓ Tersedia' : '✗ Habis'}
            </span>
            <span class="stock">Stok: <strong>${stockText}</strong></span>
            <span class="stock">ID: <strong>${p.id}</strong></span>
          </div>
          <div class="price-box">
            <div class="price-original">Modal: ${formatRp(modal)}</div>
            <div class="price-sell">${formatRp(sell)} <span>(+30%)</span></div>
          </div>
          <div class="card-actions">
            <button class="btn btn-sm btn-outline" onclick="checkStockOne(${p.id})">Cek Stok</button>
            <button class="btn" onclick="goPay(${p.id}, '${(p.name || '').replace(/'/g, "\\'")}', ${sell})" ${!available ? 'disabled' : ''}>
              Beli
            </button>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

async function checkStockOne(productId) {
  Swal.fire({
    title: 'Mengecek stok...',
    allowOutsideClick: false,
    didOpen: () => Swal.showLoading()
  });

  try {
    const res = await fetch(PREMKU_STOCK_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Accept': 'application/json'
      },
      body: JSON.stringify({
        api_key: PREMKU_API_KEY,
        product_id: parseInt(productId)
      })
    });

    const data = await res.json();
    console.log('Stock response:', data);

    if (data.success) {
      Swal.fire({
        title: '📦 Stok Realtime',
        html: `
          <div style="text-align:left;color:#ddd;font-size:14px;">
            <p><b>Produk:</b> ${data.product || '-'}</p>
            <p><b>Stok:</b> <span style="color:#00ffaa;font-size:22px;font-weight:700;">${data.stock}</span></p>
          </div>
        `,
        icon: data.stock > 0 ? 'success' : 'warning',
        confirmButtonColor: '#00c6ff'
      });
    } else {
      Swal.fire('Gagal', data.message || 'Tidak bisa cek stok', 'error');
    }
  } catch (err) {
    Swal.fire('Error', err.message, 'error');
  }
}

function goPay(productId, name, sellPrice) {
  // Generate simple trx ID
  const trx = 'INV-' + Date.now() + '-' + Math.random().toString(36).substring(2, 8).toUpperCase();
  const qty = 1;
  const params = new URLSearchParams({
    trx: trx,
    layanan: name,
    total: String(sellPrice),
    id: String(productId),
    jumlah: String(qty)
  });
  window.location.href = '/apprem/payment/?' + params.toString();
}

// Manual check stock by ID
document.getElementById('btnCheckStock').onclick = async () => {
  const { value: id } = await Swal.fire({
    title: 'Cek Stok Produk',
    input: 'number',
    inputLabel: 'Masukkan Product ID',
    inputPlaceholder: 'Contoh: 1',
    showCancelButton: true,
    confirmButtonText: 'Cek',
    confirmButtonColor: '#00c6ff',
    inputValidator: (v) => {
      if (!v || parseInt(v) < 1) return 'ID tidak valid';
    }
  });
  if (id) checkStockOne(id);
};

document.getElementById('btnRefresh').onclick = () => fetchProducts();
document.getElementById('searchInput').oninput = () => renderProducts(allProducts);

// Init
fetchProducts();
</script>
</body>
</html>
