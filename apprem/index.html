<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>List Produk - Shine Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Poppins',sans-serif;
  min-height:100vh;
  padding:30px 20px;
  color:#fff;
  background:#0a0e1a;
}
.container{max-width:900px;margin:0 auto}
.card{
  background:rgba(255,255,255,0.04);
  backdrop-filter:blur(24px);
  border-radius:24px;
  padding:30px 28px;
  border:1px solid rgba(255,255,255,0.06);
  box-shadow:0 30px 80px rgba(0,0,0,0.5);
  margin-bottom:20px;
}
.card h2{
  font-size:24px;
  font-weight:800;
  background:linear-gradient(135deg,#f0f9ff,#b6d4fe,#a5b4fc,#c4b5fd);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  margin-bottom:6px;
}
.card .sub{color:#94a3b8;font-size:14px;margin-bottom:20px}
.header-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.btn{
  padding:10px 24px;
  border-radius:30px;
  border:none;
  font-weight:600;
  cursor:pointer;
  transition:0.3s;
  font-family:'Poppins',sans-serif;
  font-size:13px;
}
.btn-primary{background:linear-gradient(135deg,#00c6ff,#0072ff);color:#fff;box-shadow:0 8px 24px rgba(0,114,255,0.25)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(0,114,255,0.35)}
.btn-back{background:#444;color:#fff}
.btn-back:hover{background:#555}
.btn-refresh{background:#00ffaa22;color:#00ffaa;border:1px solid #00ffaa44}
.btn-refresh:hover{background:#00ffaa44}
.btn-stock{background:#ffaa0044;color:#ffaa00;border:1px solid #ffaa0055;padding:4px 14px;border-radius:20px;font-size:11px}
.btn-stock:hover{background:#ffaa0066}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:12px 10px;color:#94a3b8;font-weight:600;border-bottom:1px solid rgba(255,255,255,0.06)}
td{padding:12px 10px;border-bottom:1px solid rgba(255,255,255,0.04)}
.status-available{color:#22c55e}
.status-unavailable{color:#ef4444}
.stock-low{color:#ffaa00}
.stock-out{color:#ef4444}
.stock-ok{color:#22c55e}
.product-image{width:50px;height:50px;border-radius:10px;object-fit:cover;background:#1a1a2e}
.price{color:#00ffaa;font-weight:700}
.price-sell{color:#facc15;font-weight:600;font-size:12px}
.loading-spinner{
  display:inline-block;width:24px;height:24px;
  border:2px solid #00ffaa33;border-top-color:#00ffaa;
  border-radius:50%;animation:spin 0.8s linear infinite
}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:600px){
  .card{padding:16px}
  table{font-size:11px}
  th,td{padding:8px 6px}
  .product-image{width:36px;height:36px}
}
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;">
      <div>
        <h2>📦 List Produk</h2>
        <div class="sub">Daftar produk App Premium dengan harga & stok realtime</div>
      </div>
      <div class="header-actions">
        <button class="btn btn-back" onclick="location.href='/'">🏠 Home</button>
        <button class="btn btn-refresh" onclick="loadProducts()">🔄 Refresh</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;">
      <span style="color:#94a3b8;font-size:13px;" id="totalProducts">Memuat...</span>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <input type="text" id="searchInput" placeholder="🔍 Cari produk..." onkeyup="filterProducts()" style="padding:8px 14px;border-radius:10px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.05);color:#fff;font-size:13px;outline:none;width:200px;">
      </div>
    </div>
    <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Gambar</th>
            <th>Nama Produk</th>
            <th>Harga Modal</th>
            <th>Harga Jual</th>
            <th>Stok</th>
            <th>Status</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="productTableBody">
          <tr><td colspan="8" style="text-align:center;padding:40px;color:#94a3b8;"><span class="loading-spinner"></span> Memuat produk...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
const PREMKU_API_KEY = 'd18db436519ea72a85bc49ff62f82b82';
const PROFIT_MARGIN = 1.3;
const PRODUCTS_URL = 'https://premku.com/api/products';
const STOCK_URL = 'https://premku.com/api/stock';

let products = [];
let filteredProducts = [];

async function loadProducts() {
  const tbody = document.getElementById('productTableBody');
  tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:40px;color:#94a3b8;"><span class="loading-spinner"></span> Memuat produk...</td></tr>`;
  
  try {
    const response = await fetch(PRODUCTS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ api_key: PREMKU_API_KEY })
    });
    
    const result = await response.json();
    console.log('📦 Products Response:', result);
    
    if (result.success === true && result.products) {
      products = result.products;
      filteredProducts = [...products];
      renderProducts();
    } else {
      tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:40px;color:#ef4444;">❌ ${result.message || 'Gagal memuat produk'}</td></tr>`;
    }
  } catch (err) {
    console.error('Error load products:', err);
    tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:40px;color:#ef4444;">❌ Error: ${err.message}</td></tr>`;
  }
}

function renderProducts() {
  const tbody = document.getElementById('productTableBody');
  const total = document.getElementById('totalProducts');
  
  if (filteredProducts.length === 0) {
    tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:40px;color:#94a3b8;">📭 Tidak ada produk ditemukan</td></tr>`;
    total.textContent = '0 produk';
    return;
  }
  
  total.textContent = `${filteredProducts.length} produk`;
  
  tbody.innerHTML = filteredProducts.map((p, index) => {
    const modalPrice = p.price || 0;
    const sellPrice = Math.round(modalPrice * PROFIT_MARGIN);
    const status = p.status || 'unavailable';
    const stock = p.stock || 0;
    
    let statusClass = 'status-unavailable';
    let statusText = '❌ Tidak Tersedia';
    if (status === 'available') {
      statusClass = 'status-available';
      statusText = '✅ Tersedia';
    }
    
    let stockClass = 'stock-out';
    let stockText = `${stock}`;
    if (stock > 50) { stockClass = 'stock-ok'; }
    else if (stock > 0) { stockClass = 'stock-low'; }
    else { stockClass = 'stock-out'; }
    
    const imageUrl = p.image || '';
    const imageHtml = imageUrl ? `<img src="${imageUrl}" alt="${p.name}" class="product-image" onerror="this.style.display='none'">` : `<div style="width:50px;height:50px;border-radius:10px;background:#1a1a2e;display:flex;align-items:center;justify-content:center;color:#444;font-size:20px;">📦</div>`;
    
    const orderUrl = `/sosmed-2/payment?product_id=${p.id}&jumlah=1&trx=PROD-${p.id}-${Date.now()}`;
    
    return `
      <tr>
        <td style="color:#94a3b8;">${index + 1}</td>
        <td>${imageHtml}</td>
        <td><strong style="color:#fff;">${p.name}</strong><br><span style="color:#666;font-size:11px;">ID: ${p.id}</span></td>
        <td><span class="price">Rp ${modalPrice.toLocaleString('id-ID')}</span></td>
        <td><span class="price-sell">Rp ${sellPrice.toLocaleString('id-ID')}</span><br><span style="color:#666;font-size:10px;">+30%</span></td>
        <td><span class="${stockClass}">${stockText}</span></td>
        <td><span class="${statusClass}">${statusText}</span></td>
        <td>
          <button class="btn-stock" onclick="checkStock(${p.id})">📊 Cek Stok</button>
          ${status === 'available' && stock > 0 ? `<a href="${orderUrl}" class="btn-stock" style="display:inline-block;background:#00ffaa22;color:#00ffaa;border:1px solid #00ffaa44;padding:4px 14px;border-radius:20px;font-size:11px;text-decoration:none;margin-top:4px;">🛒 Beli</a>` : ''}
        </td>
      </tr>
    `;
  }).join('');
}

async function checkStock(productId) {
  try {
    const response = await fetch(STOCK_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ api_key: PREMKU_API_KEY, product_id: productId })
    });
    
    const result = await response.json();
    console.log('📊 Stock Response:', result);
    
    if (result.success === true) {
      const product = result.product || 'Produk';
      const stock = result.stock || 0;
      const statusText = stock > 0 ? '✅ Tersedia' : '❌ Habis';
      const stockClass = stock > 0 ? 'stock-ok' : 'stock-out';
      
      Swal.fire({
        title: `📊 Stok ${product}`,
        html: `
          <div style="text-align:center;">
            <div style="font-size:48px;margin:10px 0;">${stock > 0 ? '📦' : '🚫'}</div>
            <div style="font-size:36px;font-weight:800;color:${stock > 0 ? '#00ffaa' : '#ef4444'};">${stock}</div>
            <div style="font-size:14px;color:#888;margin-top:4px;">${statusText}</div>
          </div>
        `,
        icon: stock > 0 ? 'success' : 'error',
        confirmButtonColor: stock > 0 ? '#22c55e' : '#ef4444',
        confirmButtonText: 'OK'
      });
    } else {
      Swal.fire({
        title: '❌ Gagal',
        text: result.message || 'Gagal mengecek stok',
        icon: 'error',
        confirmButtonColor: '#ef4444'
      });
    }
  } catch (err) {
    console.error('Error check stock:', err);
    Swal.fire({
      title: '❌ Error',
      text: err.message,
      icon: 'error',
      confirmButtonColor: '#ef4444'
    });
  }
}

function filterProducts() {
  const query = document.getElementById('searchInput').value.toLowerCase().trim();
  if (!query) {
    filteredProducts = [...products];
  } else {
    filteredProducts = products.filter(p => 
      p.name.toLowerCase().includes(query) || 
      String(p.id).includes(query)
    );
  }
  renderProducts();
}

loadProducts();
</script>
</body>
</html>
