<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Saham & Reksadana - Shine Shop</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #e5e7eb; padding: 20px; }
    .container { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
    .card { background: #020617; border-radius: 14px; padding: 16px; box-shadow: 0 10px 20px rgba(0,0,0,.35); }
    input { width: 100%; padding: 10px; border-radius: 10px; border: none; margin-top: 6px; }
    button { margin-top: 10px; width: 100%; padding: 10px; border-radius: 10px; border: none; background: #22c55e; font-weight: bold; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 8px; font-size: 14px; border-bottom: 1px solid #1e293b; }
    .profit { color: #22c55e; }
    .loss { color: #ef4444; }
    .summary { display: flex; justify-content: space-between; margin-top: 10px; }
  </style>
</head>
<body><h1>📈 Portofolio Saham & Reksadana</h1>
<p>Semua saham & reksadana dikelola oleh <b>Shine Shop</b></p><div class="container">  <div class="card">
    <h3>Masukkan Username</h3>
    <input id="username" placeholder="username wajib diisi" />
    <button onclick="loadUser()">Lihat Portofolio</button>
  </div>  <div class="card">
    <h3>Ringkasan Portofolio</h3>
    <div class="summary"><span>Total Aset</span><strong id="totalAset">Rp 0</strong></div>
    <div class="summary"><span>Profit Pengguna</span><strong id="userProfit">Rp 0</strong></div><table>
  <thead>
    <tr><th>Aset</th><th>Nilai</th><th>P/L Aset</th></tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

  </div>  <div class="card">
    <h3>Grafik Line Portofolio</h3>
    <canvas id="chart"></canvas>
  </div></div><script>
  let chart;

  async function loadUser() {
    const username = document.getElementById('username').value.trim();
    if (!username) return alert('Username wajib diisi');

    const res = await fetch('/saham/aset.json');
    const users = await res.json();

    const user = users[username];
    if (!user) return alert('Username tidak ditemukan');

    const aset = user.aset || [];
    const profitUser = Number(user.profit || 0);

    let total = 0;
    const tb = document.getElementById('tbody');
    tb.innerHTML = '';

    aset.forEach(a => {
      const namaAset = a.nama.replace(/^Saham - /, 'Saham Shine Shop - ');
      total += a.nilai;

      tb.innerHTML += `
        <tr>
          <td>${namaAset}</td>
          <td>Rp ${a.nilai.toLocaleString('id-ID')}</td>
          <td class="${a.pl >= 0 ? 'profit' : 'loss'}">Rp ${a.pl.toLocaleString('id-ID')}</td>
        </tr>`;
    });

    document.getElementById('totalAset').innerText = 'Rp ' + total.toLocaleString('id-ID');
    const up = document.getElementById('userProfit');
    up.innerText = 'Rp ' + profitUser.toLocaleString('id-ID');
    up.className = profitUser >= 0 ? 'profit' : 'loss';

    renderChart(aset.map((_, i) => i + 1), aset.map(() => total));
  }

  function renderChart(labels, data) {
    if (chart) chart.destroy();
    chart = new Chart(document.getElementById('chart'), {
      type: 'line',
      data: { labels, datasets: [{ label: 'Total Nilai Portofolio', data, borderColor: '#22c55e', tension: 0.3 }] }
    });
  }
</script></body>
</html>
