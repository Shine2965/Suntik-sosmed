<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shine Shop - Maintenance</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1c1c1c, #2c5364);
      color: white;
      text-align: center;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    h1 {
      font-size: 40px;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      color: #ddd;
      margin-bottom: 20px;
    }

    .login-box {
      background: rgba(255, 255, 255, 0.1);
      padding: 20px 30px;
      border-radius: 10px;
      display: none;
      width: 280px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

    .login-box input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: none;
      border-radius: 5px;
      outline: none;
    }

    .login-box button {
      width: 100%;
      padding: 10px;
      background: #0ea5e9;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s;
    }

    .login-box button:hover {
      background: #0284c7;
    }

    .admin-link {
      margin-top: 20px;
      color: #bbb;
      cursor: pointer;
      font-size: 14px;
      text-decoration: underline;
    }

    .error {
      color: #f87171;
      font-size: 14px;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <h1>🚧 Maintenance Mode 🚧</h1>
  <p>Situs sedang dalam perbaikan. Silakan kembali lagi nanti.</p>

  <div class="login-box" id="loginBox">
    <h3>Login Admin</h3>
    <input type="text" id="username" placeholder="Username Admin">
    <input type="password" id="password" placeholder="Password">
    <button onclick="loginAdmin()">Masuk</button>
    <div id="error" class="error"></div>
  </div>

  <div class="admin-link" onclick="toggleLogin()">Login Admin</div>

  <script>
    function toggleLogin() {
      const box = document.getElementById('loginBox');
      box.style.display = box.style.display === 'none' || box.style.display === '' ? 'block' : 'none';
    }

    function loginAdmin() {
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();
      const error = document.getElementById('error');

      // Ganti nilai berikut dengan kredensial admin kamu
      const adminUser = "shineshop";
      const adminPass = "Alvino11";

      if (user === adminUser && pass === adminPass) {
        window.location.href = "/dashboard/";
      } else {
        error.textContent = "Username atau password salah!";
      }
    }
  </script>
</body>
</html>
