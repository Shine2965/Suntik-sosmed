<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maintenance</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.card{
    width:100%;
    max-width:550px;
    background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.1);
    backdrop-filter:blur(15px);
    border-radius:25px;
    padding:35px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,.4);
}

.icon{
    font-size:70px;
    margin-bottom:15px;
}

h1{
    font-size:30px;
    margin-bottom:10px;
}

p{
    color:#cbd5e1;
    margin-bottom:25px;
}

.countdown{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

.box{
    background:rgba(255,255,255,.08);
    border-radius:15px;
    padding:18px 10px;
}

.box h2{
    font-size:30px;
}

.box span{
    color:#94a3b8;
    font-size:14px;
}

#status{
    margin-top:25px;
    color:#38bdf8;
    font-size:15px;
}

#loading{
    color:#fbbf24;
}

@media(max-width:500px){

.countdown{
grid-template-columns:repeat(2,1fr);
}

}
</style>
</head>
<body>

<div class="card">

<div class="icon">🚧</div>

<h1 id="title">Loading...</h1>

<p id="message">Mengambil data maintenance...</p>

<div class="countdown">

<div class="box">
<h2 id="days">0</h2>
<span>Hari</span>
</div>

<div class="box">
<h2 id="hours">0</h2>
<span>Jam</span>
</div>

<div class="box">
<h2 id="minutes">0</h2>
<span>Menit</span>
</div>

<div class="box">
<h2 id="seconds">0</h2>
<span>Detik</span>
</div>

</div>

<div id="status">
<span id="loading">Memuat data...</span>
</div>

</div>

<script>

async function loadMaintenance(){

try{

const res = await fetch("maintenance.json?t="+Date.now());

const data = await res.json();

document.getElementById("title").textContent=data.title;
document.getElementById("message").textContent=data.message;

const target=new Date(data.endTime).getTime();

setInterval(()=>{

const now=Date.now();

const diff=target-now;

if(diff<=0){

document.getElementById("days").textContent=0;
document.getElementById("hours").textContent=0;
document.getElementById("minutes").textContent=0;
document.getElementById("seconds").textContent=0;

document.getElementById("status").innerHTML="✅ Maintenance telah selesai.";

return;

}

const days=Math.floor(diff/(1000*60*60*24));

const hours=Math.floor((diff%(1000*60*60*24))/(1000*60*60));

const minutes=Math.floor((diff%(1000*60*60))/(1000*60));

const seconds=Math.floor((diff%(1000*60))/1000);

document.getElementById("days").textContent=days;
document.getElementById("hours").textContent=hours;
document.getElementById("minutes").textContent=minutes;
document.getElementById("seconds").textContent=seconds;

document.getElementById("status").innerHTML=
"Estimasi selesai:<br><b>"+new Date(data.endTime).toLocaleString("id-ID")+"</b>";

},1000);

}catch(e){

document.getElementById("loading").innerHTML=
"Gagal mengambil maintenance.json";

}

}

loadMaintenance();

</script>

</body>
</html>
