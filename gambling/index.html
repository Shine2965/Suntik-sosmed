<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Slot Machine — Shine Shop</title>
<style>
  :root{
    --bg:#071129;
    --panel:#0f1724;
    --accent:#ffb020;
    --muted:#9aa8bf;
    --glass: rgba(255,255,255,0.03);
    font-family: Inter, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background: radial-gradient(800px 400px at 10% 10%, rgba(14,65,118,0.6), transparent),
                radial-gradient(700px 300px at 90% 90%, rgba(34,12,63,0.5), transparent),
                linear-gradient(180deg,#021028,#040811 60%);
    color:#e6eef8;
    overflow:hidden;
  }
  .flash {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle, rgba(255,255,0,0.8), rgba(255,255,0,0.1), transparent);
    animation: flashAnim 1s ease-out forwards;
    z-index: 9999;
    pointer-events: none;
  }
  @keyframes flashAnim {
    0% { opacity: 0; }
    20% { opacity: 1; }
    100% { opacity: 0; }
  }

  .card{
    width:100%;
    max-width:960px;
    background:linear-gradient(180deg,var(--panel), rgba(15,23,36,0.92));
    border-radius:16px;
    padding:20px;
    box-shadow: 0 10px 30px rgba(2,7,23,0.7);
    border:1px solid rgba(255,255,255,0.03);
    display:grid;
    grid-template-columns: 1fr 320px;
    gap:18px;
  }
  header h1{margin:0 0 6px 0;font-size:20px}
  header p{margin:0;color:var(--muted);font-size:13px}
  .slot-area{
    background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    padding:18px;
    border-radius:12px;
    display:flex;
    flex-direction:column;
    gap:12px;
    align-items:center;
  }
  .reel-wrap{
    display:flex;
    gap:12px;
    align-items:center;
    justify-content:center;
  }
  .reel{
    width:110px;
    height:110px;
    background:var(--glass);
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:36px;
    font-weight:700;
    letter-spacing:1px;
    border:1px solid rgba(255,255,255,0.03);
    position:relative;
    overflow:hidden;
  }
  .spin {
    animation: spinAnim 0.1s linear infinite;
  }
  @keyframes spinAnim {
    0% { transform: rotateX(0deg); }
    100% { transform: rotateX(360deg); }
  }

  .controls{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:6px;
    flex-wrap:wrap;
  }
  .btn{
    background:linear-gradient(180deg,var(--accent), #ff8b00);
    color:#0b0b0b;
    border:none;
    padding:10px 14px;
    border-radius:10px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 6px 18px rgba(255,176,32,0.15);
  }
  .btn.secondary{
    background:transparent;
    color:var(--muted);
    border:1px solid rgba(255,255,255,0.04);
  }
  .sidebar{
    background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.02));
    border-radius:12px;
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .stat{
    display:flex;
    justify-content:space-between;
    gap:8px;
    align-items:center;
    padding:8px;
    border-radius:8px;
    background:rgba(0,0,0,0.15);
    font-size:14px;
  }
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  input[type=number]{
    width:100%;
    padding:8px 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.04);
    background:transparent;color:inherit;font-size:14px;
  }
  .history{
    max-height:180px; overflow:auto; font-size:13px;
    padding:8px;border-radius:8px;background:rgba(255,255,255,0.02);
  }
  .notice{font-size:12px;color:var(--muted)}
  .big-result{
    margin-top:6px;
    font-size:18px;
    font-weight:800;
  }
  .win{ color: #34d399; }
  .lose{ color: #f87171; }
  footer{grid-column:1/-1; text-align:center; color:var(--muted); font-size:12px; margin-top:6px}
  @media (max-width:880px){
    .card{grid-template-columns:1fr; padding:16px}
    .reel{width:86px;height:86px;font-size:28px}
  }
</style>
</head>
<body>
  <div class="card">
    <div class="main">
      <header>
        <h1>🎰 Slot Machine — Shine Shop</h1>
        <p>Semoga Beruntung!</p>
      </header>

      <div class="slot-area">
        <div class="reel-wrap" id="reels">
          <div class="reel" id="r1">🍒</div>
          <div class="reel" id="r2">🍋</div>
          <div class="reel" id="r3">🍉</div>
        </div>

        <div class="controls">
          <div>
            <label for="bet">Taruhan (kredit)</label>
            <input type="number" id="bet" min="1" value="100">
          </div>
          <button class="btn" id="spinBtn">PUTAR</button>
          <button class="btn secondary" id="maxBtn">MAX</button>
          <button class="btn secondary" id="resetBtn">RESET</button>
          <div class="notice">Kredit: <strong id="balance">10000</strong></div>
        </div>

        <div class="big-result" id="bigResult"></div>
      </div>
    </div>

    <aside class="sidebar">
      <div class="stat"><div>Saldo awal</div><div id="initial">10000</div></div>
      <div class="stat"><div>Taruhan saat ini</div><div id="currentBet"></div></div>
      <div>
        <label>Riwayat (terbaru)</label>
        <div class="history" id="history"></div>
      </div>
      <small class="notice">Disclaimer: Dibuat Oleh Shine Shop</small>
    </aside>

    <footer> slot machine by Shine Shop — 2025</footer>
  </div>

  <!-- Efek suara -->
  <audio id="winSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_9f4b3ef79d.mp3?filename=win-2-6896.mp3"></audio>
  <audio id="jackpotSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_3ff210ed7e.mp3?filename=success-fanfare-trumpets-6185.mp3"></audio>
  <audio id="spinSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_7364eb8f4e.mp3?filename=slot-machine-spinning-6988.mp3"></audio>

<script>
(() => {
  const reels = [r1, r2, r3].map(id => document.getElementById(id.id || id));
  const balanceEl = document.getElementById("balance");
  const bigResult = document.getElementById("bigResult");
  const betInput = document.getElementById("bet");
  const currentBetEl = document.getElementById("currentBet");
  const historyEl = document.getElementById("history");
  const winSound = document.getElementById("winSound");
  const jackpotSound = document.getElementById("jackpotSound");
  const spinSound = document.getElementById("spinSound");
  let balance = 10000;
  const SYMBOLS = ["🍒","🍋","🍉","⭐","💎","7️⃣","🔔"];
  let spinning = false;

  async function spin() {
    if (spinning) return;
    const bet = Math.max(1, parseInt(betInput.value));
    if (bet > balance) return alert("Kredit tidak cukup!");
    balance -= bet;
    updateUI();
    spinning = true;
    bigResult.textContent = "";

    const roll = Math.random();
    let result = [];
    if (roll < 0.03) result = ["7️⃣","7️⃣","7️⃣"];
    else if (roll < 0.33) {
      const sym = SYMBOLS[Math.floor(Math.random() * (SYMBOLS.length - 1))];
      result = [sym, sym, sym];
    } else result = SYMBOLS.sort(() => 0.5 - Math.random()).slice(0, 3);

    spinSound.currentTime = 0;
    spinSound.play();
    await spinAnimation(result, bet);
    spinSound.pause();
    spinSound.currentTime = 0;
    spinning = false;
  }

  function flashGold() {
    const flash = document.createElement("div");
    flash.className = "flash";
    document.body.appendChild(flash);
    setTimeout(() => flash.remove(), 3000);
  }

  async function spinAnimation(result, bet) {
    const spinDuration = [500, 1000, 1500];
    const intervals = [];

    reels.forEach((r, i) => {
      r.classList.add("spin");
      intervals[i] = setInterval(() => {
        r.textContent = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
      }, 80);
    });

    for (let i = 0; i < reels.length; i++) {
      await new Promise(res => setTimeout(res, spinDuration[i]));
      clearInterval(intervals[i]);
      reels[i].classList.remove("spin");
      reels[i].textContent = result[i];
    }

    evaluate(result, bet);
  }

  function evaluate(result, bet) {
    const key = result.join(",");
    let winAmount = 0;
    let message = "";

    if (key === "7️⃣,7️⃣,7️⃣") {
      winAmount = bet * 4;
      jackpotSound.play();
      flashGold();
      message = `🎉 JACKPOT! +${winAmount}`;
      bigResult.className = "big-result win";
    } else if (result[0] === result[1] && result[1] === result[2]) {
      winAmount = bet * 2;
      winSound.play();
      message = `MENANG +${winAmount} 💰`;
      bigResult.className = "big-result win";
    } else {
      message = `KALAH -${bet} 💸`;
      bigResult.className = "big-result lose";
    }

    if (winAmount > 0) balance += winAmount;

    bigResult.textContent = message;
    updateUI();
    addHistory(message + ` [${result.join(" ")}]`);
  }

  function addHistory(text) {
    const el = document.createElement("div");
    el.textContent = new Date().toLocaleTimeString() + " • " + text;
    historyEl.prepend(el);
    while (historyEl.children.length > 50) historyEl.removeChild(historyEl.lastChild);
  }

  function updateUI() {
    balanceEl.textContent = balance;
    currentBetEl.textContent = betInput.value;
  }

  document.getElementById("spinBtn").onclick = spin;
  document.getElementById("maxBtn").onclick = () => {
    betInput.value = balance;
    updateUI();
  };
  document.getElementById("resetBtn").onclick = () => {
    if (confirm("Reset saldo ke 10000?")) {
      balance = 10000;
      betInput.value = 100;
      updateUI();
      historyEl.innerHTML = "";
    }
  };
})();
</script>
</body>
  </html>
