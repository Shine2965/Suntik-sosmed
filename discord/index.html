<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discord Webhook Sender</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#111827;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    margin:0;
}

.container{
    width:90%;
    max-width:500px;
    background:#1f2937;
    padding:20px;
    border-radius:12px;
}

h2{
    text-align:center;
    margin-bottom:15px;
}

textarea{
    width:100%;
    height:150px;
    resize:none;
    padding:10px;
    border:none;
    border-radius:8px;
    outline:none;
}

button{
    width:100%;
    margin-top:10px;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#5865F2;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

#status{
    margin-top:10px;
    text-align:center;
}
</style>
</head>
<body>

<div class="container">
    <h2>Kirim Pesan ke Discord</h2>

    <textarea id="message" placeholder="Tulis pesan..."></textarea>

    <button onclick="sendWebhook()">Kirim</button>

    <div id="status"></div>
</div>

<script>
const WEBHOOK_URL = "https://discord.com/api/webhooks/1514916046924939334/qq_HrXsxn_Gq--s6jlIgwpeS8b1kncc8yB7kdDxhwJ9zozUGfNRRkZl9wGduc99VJW7g";

async function sendWebhook() {
    const msg = document.getElementById("message").value.trim();
    const status = document.getElementById("status");

    if(!msg){
        status.innerHTML = "❌ Pesan tidak boleh kosong";
        return;
    }

    try{
        const res = await fetch(WEBHOOK_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                content: msg
            })
        });

        if(res.ok){
            status.innerHTML = "✅ Pesan berhasil dikirim";
            document.getElementById("message").value = "";
        }else{
            status.innerHTML = "❌ Gagal mengirim pesan";
        }
    }catch(err){
        status.innerHTML = "❌ Error: " + err.message;
    }
}
</script>

</body>
</html>
