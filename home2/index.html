/* DATES */
const idulFitri = new Date("March 31, 2026 00:00:00");
const takbiranStart = new Date("March 30, 2026 18:00:00");

/* AUDIO */
const ramadhanSound = "https://raw.githubusercontent.com/IkyyExecutive/IkyyBokep/main/uploads/1771328890006_80503_1771328888977_file_2259.mp3";
const takbiranSound = "https://raw.githubusercontent.com/IkyyExecutive/IkyyBokep/main/uploads/1771328845888_38001_1771328844769_file_2257.mp3";

let bgAudio = new Audio();
bgAudio.loop = true;
bgAudio.volume = 1;
bgAudio.muted = false;

function setAudio(){
  const now = new Date();
  if(now >= takbiranStart){
    bgAudio.src = takbiranSound;
  }else{
    bgAudio.src = ramadhanSound;
  }
  bgAudio.play().catch(()=>{});
}

document.addEventListener("click", function initAudio(){
  setAudio();
  document.removeEventListener("click", initAudio);
});

function toggleSound(){
  bgAudio.muted = !bgAudio.muted;
  document.getElementById("soundBtn").innerText = bgAudio.muted ? "🔇 Unmute Sound" : "🔊 Mute Sound";
}

/* COUNTDOWN */
function updateCountdown(){
  const now=new Date().getTime();
  const diff=idulFitri-now;
  if(diff<=0){
    document.getElementById("countdown").innerHTML="🌙 Selamat Hari Raya Idul Fitri 1447H 🌙";
    return;
  }
  const days=Math.floor(diff/(1000*60*60*24));
  const hours=Math.floor((diff%(1000*60*60*24))/(1000*60*60));
  const minutes=Math.floor((diff%(1000*60*60))/(1000*60));
  document.getElementById("countdown").innerHTML=
    "⏳ Menuju Idul Fitri: "+days+" Hari "+hours+" Jam "+minutes+" Menit";
}
setInterval(updateCountdown,1000);

/* ANTI INSPECT */
document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("keydown",function(e){
  if(e.key==="F12") e.preventDefault();
  if(e.ctrlKey && e.shiftKey && ["I","C","J"].includes(e.key)) e.preventDefault();
  if(e.ctrlKey && e.key==="u") e.preventDefault();
});
setInterval(function(){
