<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shine Shop</title>

<link rel="icon" href="/home/logo.png" type="image/png">
<link rel="shortcut icon" href="/home/logo.png" type="image/png">
<link rel="apple-touch-icon" href="/home/logo.png">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:'Poppins',sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    linear-gradient(rgba(0,0,0,0.75),rgba(0,0,0,0.75)),
    url('/home/logo.png') center/cover no-repeat fixed;
  color:white;
}

/* CONTAINER */
.container{
  width:90%;
  max-width:480px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(10px);
  border-radius:18px;
  padding:35px 25px;
  text-align:center;
  border:1px solid rgba(255,255,255,0.1);
}

/* TITLE */
h1{
  font-size:22px;
  font-weight:600;
  margin-bottom:30px;
  letter-spacing:1px;
}

/* MENU */
.hamburger-btn {
    position:fixed;
    top:20px;
    left:20px;
    background:none;
    border:1px solid rgba(255,255,255,0.2);
    padding:10px;
    border-radius:10px;
    cursor:pointer;
    z-index:1001;
}

.hamburger-icon span {
    display:block;
    height:3px;
    width:24px;
    background:white;
    margin:4px 0;
}

/* OFFCANVAS */
.offcanvas {
    position:fixed;
    right:-260px;
    top:0;
    width:260px;
    height:100%;
    background:#111;
    padding:20px;
    transition:.3s;
    z-index:1000;
}

.offcanvas.open {
    right:0;
}

.overlay {
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    opacity:0;
    visibility:hidden;
    transition:.3s;
}

.overlay.show {
    opacity:1;
    visibility:visible;
}

.menu-list {
    list-style:none;
    padding:0;
}

.menu-list li {
    margin:10px 0;
}

.menu-list a {
    color:white;
    text-decoration:none;
}

/* BUTTON */
.nav-btn{
  width:100%;
  padding:14px;
  margin:10px 0;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.15);
  background:rgba(255,255,255,0.08);
  color:white;
  font-size:14px;
  font-weight:500;
  cursor:pointer;
  transition:0.25s;
}

.nav-btn:hover{
  background:rgba(255,255,255,0.18);
}

/* FOOTER */
.footer{
  margin-top:25px;
  font-size:12px;
  opacity:0.6;
}

/* USER BUBBLE */
.user-bubble{
  position:fixed;
  bottom:20px;
  right:20px;
  background:rgba(0,0,0,0.85);
  color:white;
  padding:12px 16px;
  border-radius:12px;
  font-size:13px;
  box-shadow:0 5px 20px rgba(0,0,0,0.4);
  opacity:0;
  transform:translateY(20px);
  transition:0.3s;
  z-index:9999;
}

.user-bubble.show{
  opacity:1;
  transform:translateY(0);
}
</style>
</head>

<body>

<button class="hamburger-btn" id="menuToggle">
    <div class="hamburger-icon">
        <span></span>
        <span></span>
        <span></span>
    </div>
</button>

<div id="menuOverlay" class="overlay"></div>

<nav id="siteMenu" class="offcanvas">
    <button id="menuClose">Tutup</button>
    <ul class="menu-list">
        <li><a href="/home2/">Home</a></li>
        <li><a href="/testimoni/">Testimoni</a></li>
        <li><a href="/global/">Suntik Sosmed</a></li>
        <li><a href="/aboutowner/">Portofolio</a></li>
        <li><a href="/cekakses/">Cek Akses kamu</a></li>
    </ul>
</nav>

<div class="container">

<h1>Shine Shop Suntik Sosmed</h1>

<button class="nav-btn" onclick="location.href='/global/'">🛒 Belanja</button>
<button class="nav-btn" onclick="location.href='/sewaweb/'">🌐 Sewa Website</button>
<button class="nav-btn" onclick="location.href='/testimoni/'">📈 Testimoni</button>
<button class="nav-btn" onclick="location.href='/riwayat/'">Riwayat Transaksi</button>
<button class="nav-btn" onclick="location.href='/cekakses/'">🔥 Cek Akses</button>
<button class="nav-btn" onclick="location.href='/aboutowner/'">🏆 Tentang Owner</button>  
<button class="nav-btn" onclick="location.href='/kontaksmm/'">✉️ Customer Service 1 (Aktif 24 jam)</button>
<button class="nav-btn" onclick="location.href='https://store.shinedomain.my.id'">📰 Informasi</button>
<button class="nav-btn" onclick="location.href='https://t.me/shineshoipbot'">💬 Customer Service ( Aktif 8.00-17.00 GMT+7)</button> 
  <button class="nav-btn" onclick="location.href='https://t.me/+2XtBryTgizU4MDQ1'">Grup Telegram</button>
  
<button class="nav-btn" onclick="location.href='/scammer/'">List scammer</button>

<div class="footer">
©Shine Shop - 2023
</div>
</div>

<!-- USER BUBBLE -->
<div id="userBubble" class="user-bubble"></div>

<script>
// MENU
const toggle = document.getElementById("menuToggle");
const menu = document.getElementById("siteMenu");
const overlay = document.getElementById("menuOverlay");
const close = document.getElementById("menuClose");

toggle.onclick = () => {
    menu.classList.toggle("open");
    overlay.classList.toggle("show");
}

overlay.onclick = () => {
    menu.classList.remove("open");
    overlay.classList.remove("show");
}

close.onclick = () => {
    menu.classList.remove("open");
    overlay.classList.remove("show");
}

// USER ID
function generateUserID(){
  return 'user-' + Math.random().toString(36).substring(2,10) + '-' + Date.now().toString(36);
}

function getUserID(){
  let id = localStorage.getItem("user_id");
  if(!id){
    id = generateUserID();
    localStorage.setItem("user_id", id);
  }
  return id;
}

const userID = getUserID();

// USER BUBBLE
function showUserBubble(){
  const bubble = document.getElementById("userBubble");
  bubble.innerHTML = `<b>Selamat Datang <br> User ID:</b><br>${userID}`;
  
  setTimeout(() => {
    bubble.classList.add("show");
  }, 500);

  setTimeout(() => {
    bubble.classList.remove("show");
  }, 5500);
}

window.onload = showUserBubble;
</script>

</body>
</html>
