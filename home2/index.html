<style>
*{

body{

/* CONTAINER */
.container{

/* TITLE */
h1{

  margin-bottom:30px;
  letter-spacing:1px;
}
/* MENU */
.hamburger-btn {
    background:none;
    border:1px solid var(--border);
    padding:10px;
    border-radius:10px;
    cursor:pointer;
}

.hamburger-icon span {
    display:block;
    height:3px;
    width:24px;
    background:white;
    margin:4px 0;
}

/* OFFCANVAS */
.offcanvas {
    position:fixed;
    right:-260px;
    top:0;
    width:260px;
    height:100%;
    background:#111;
    padding:20px;
    transition:.3s;
    z-index:1000;
}

.offcanvas.open {
    right:0;
}

.overlay {
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    opacity:0;
    visibility:hidden;
    transition:.3s;
}

.overlay.show {
    opacity:1;
    visibility:visible;
}

.menu-list {
    list-style:none;
    padding:0;
}

.menu-list li {
    margin:10px 0;
}

.menu-list a {
    color:white;
    text-decoration:none;
}

/* CONTENT */
.container {
    max-width:900px;
    margin:auto;
    padding:40px 20px;
}

.section {
    background:#151515;
    padding:25px;
    border-radius:14px;
    border:1px solid var(--border);
}
    
/* BUTTON */
.nav-btn{
  width:100%;
  padding:14px;
  margin:10px 0;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.15);
  background:rgba(255,255,255,0.08);
  color:white;
  font-size:14px;
  font-weight:500;
  cursor:pointer;
  transition:0.25s;
}

.nav-btn:hover{

/* FOOTER */
.footer{

  opacity:0.6;

<script>
const toggle = document.getElementById("menuToggle");
const menu = document.getElementById("siteMenu");
const overlay = document.getElementById("menuOverlay");
const close = document.getElementById("menuClose");

toggle.onclick = () => {
    menu.classList.toggle("open");
    overlay.classList.toggle("show");
}

overlay.onclick = () => {
    menu.classList.remove("open");
    overlay.classList.remove("show");
}

close.onclick = () => {
    menu.classList.remove("open");
    overlay.classList.remove("show");
}
    </script>
