<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shine Shop</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:'Poppins',sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    linear-gradient(rgba(0,0,0,0.75),rgba(0,0,0,0.75)),
    url('/home/logo.png') center/cover no-repeat fixed;
  color:white;
}

/* CONTAINER */
.container{
  width:90%;
  max-width:480px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(10px);
  border-radius:18px;
  padding:35px 25px;
  text-align:center;
  border:1px solid rgba(255,255,255,0.1);
}

/* TITLE */
h1{
  font-size:22px;
  font-weight:600;
  margin-bottom:30px;
  letter-spacing:1px;
}

/* BUTTON */
.nav-btn{
  width:100%;
  padding:14px;
  margin:10px 0;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.15);
  background:rgba(255,255,255,0.08);
  color:white;
  font-size:14px;
  font-weight:500;
  cursor:pointer;
  transition:0.25s;
}

.nav-btn:hover{
  background:rgba(255,255,255,0.18);
}

/* FOOTER */
.footer{
  margin-top:25px;
  font-size:12px;
  opacity:0.6;
}
  .user-bubble{
  position:fixed;bottom:20px;right:20px;
  background:rgba(0,0,0,0.85);
  padding:12px 16px;border-radius:12px;
  font-size:13px;z-index:9999;
  opacity:0;
  transform:translateY(20px);
  transition:0.3s;
}
.user-bubble.show{
  opacity:1;
  transform:translateY(0);
}
</style>
  
</head>

<body>

<div class="container">

<h1>Shine Shop Suntik Sosmed</h1>

<button class="nav-btn" onclick="location.href='/sosmed-1/'">
🛒 Suntik Sosmed - 1
</button>

<button class="nav-btn" onclick="location.href='/sosmed-2/'">
🛒 Suntik Sosmed - 2
</button>

  <button class="nav-btn" onclick="location.href='/telegram/'"> 
    Telegram Market
  </button>
  
  
<div class="footer">
©Shine Shop - 2023
</div>
<script>
  function getUserID(){
  let id=localStorage.getItem("user_id");
  if(!id){id=generateUserID();localStorage.setItem("user_id",id);}return id;
}
const userID=getUserID();

const bubble=document.getElementById("userBubble");

function showUserBubble(){
  bubble.innerHTML="<b>Selamat Belanja</b><br>User ID:<br>"+userID;
  bubble.classList.add("show");

  setTimeout(()=>{
    bubble.classList.remove("show");
    cekPesan();
  },1000);
}

// MULTIPLE SWEET ALERT SUPPORT
async function cekPesan(){
  try{
    const res=await fetch("/sunsosmed/pesan.json?cache="+Date.now());
    const data=await res.json();

    let alerts=[];

    if(data[userID]){
      alerts.push({
        title:'📩 Pesan Baru',
        html:'<b>UserID:</b><br>'+userID+'<br><br><b>Pesan:</b><br>'+data[userID],
        icon:'info'
      });
    }

    if(data["all"]){
      alerts.push({
        title:'📢 Pengumuman',
        html:data["all"],
        icon:'warning'
      });
    }
       if(data["all1"]){
      alerts.push({
        title:'📢 Pengumuman',
        html:data["all1"],
        icon:'warning'
      });
    }
       if(data["all2"]){
      alerts.push({
        title:'📢 Pengumuman',
        html:data["all2"],
        icon:'warning'
      });
    }



    // Tampilkan lebih dari 2 alert secara berurutan
    for(const alert of alerts){
      await Swal.fire({
        title:alert.title,
        html:alert.html,
        icon:alert.icon,
        confirmButtonText:'Tutup'
      });
    }

  }catch(e){console.log("Tidak ada pesan.");}
}

window.addEventListener("load",showUserBubble);
  
    /* ANTI INSPECT */
document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("keydown",function(e){
  if(e.key==="F12") e.preventDefault();
  if(e.ctrlKey && e.shiftKey && ["I","C","J"].includes(e.key)) e.preventDefault();
  if(e.ctrlKey && e.key==="u") e.preventDefault();
});
setInterval(function(){
  if(window.outerWidth-window.innerWidth>160 || window.outerHeight-window.innerHeight>160){
    document.body.innerHTML="<h1 style='color:#facc15;text-align:center;margin-top:40vh;'>🚫 Developer Tools Terdeteksi</h1>";
  }
},1000);
setInterval(()=>{console.clear();},1000);
setInterval(()=>{debugger;},3000);
</script>

</body>
</html>
