<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shine Shop - Suntik Sosmed</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                linear-gradient(rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.75)),
                url('/home/logo.png') center/cover no-repeat fixed;
            color: white;
            padding: 20px;
        }

        /* CONTAINER */
        .container {
            width: 90%;
            max-width: 480px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 18px;
            padding: 35px 25px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* TITLE */
        h1 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        /* BUTTON */
        .nav-btn {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.08);
            color: white;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.25s;
            font-family: 'Poppins', sans-serif;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: translateY(-2px);
        }

        .nav-btn:active {
            transform: scale(0.97);
        }

        /* FOOTER */
        .footer {
            margin-top: 25px;
            font-size: 12px;
            opacity: 0.6;
        }

        /* USER BUBBLE */
        .user-bubble {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            z-index: 9999;
            opacity: 0;
            transform: translateY(20px);
            transition: 0.3s;
            max-width: 250px;
            word-break: break-all;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .user-bubble.show {
            opacity: 1;
            transform: translateY(0);
        }

        .user-bubble .bubble-close {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }

        .user-bubble .bubble-close:hover {
            background: #ff6666;
            transform: scale(1.1);
        }

        /* RESPONSIVE */
        @media (max-width: 480px) {
            .container {
                padding: 25px 18px;
            }
            h1 {
                font-size: 18px;
            }
            .nav-btn {
                font-size: 13px;
                padding: 12px;
            }
            .user-bubble {
                bottom: 12px;
                right: 12px;
                font-size: 11px;
                padding: 10px 14px;
                max-width: 200px;
            }
        }

        /* LOADING STATE */
        .nav-btn.loading {
            opacity: 0.6;
            cursor: wait;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>✨ Shine Shop <br><span style="font-size:14px;color:#888;font-weight:300;">Suntik Sosmed</span></h1>

        <button class="nav-btn" onclick="goTo('/sosmed-1/')">
            🛒 Suntik Sosmed - 1
        </button>

        <button class="nav-btn" onclick="goTo('/sosmed-2/')">
            🛒 Suntik Sosmed - 2
        </button>

        <button class="nav-btn" onclick="goTo('/sosmed-3/')">
            🛒 Suntik Sosmed - 3
        </button>

        <button class="nav-btn" onclick="goTo('/sosmed-4/')">
            🛒 Suntik Sosmed - 4
        </button>

        <button class="nav-btn" onclick="goTo('/telegram/')">
            📱 Telegram Market
        </button>

        <button class="nav-btn" onclick="goTo('/info/dashboard/index.html')" style="border-color:rgba(0,255,170,0.3);background:rgba(0,255,170,0.05);">
            💰 Info Saldo
        </button>

        <div class="footer">© Shine Shop - 2023</div>
    </div>

    <div id="userBubble" class="user-bubble">
        <button class="bubble-close" onclick="closeBubble()">✕</button>
        <div id="bubbleContent"></div>
    </div>

    <script>
        // ===================== USER ID =====================
        function generateUserID() {
            return 'user-' + Math.random().toString(36).substring(2, 10) + '-' + Date.now().toString(36);
        }

        function getUserID() {
            let id = localStorage.getItem("user_id");
            if (!id) {
                id = generateUserID();
                localStorage.setItem("user_id", id);
            }
            return id;
        }

        const userID = getUserID();

        // ===================== BUBBLE =====================
        const bubble = document.getElementById('userBubble');
        const bubbleContent = document.getElementById('bubbleContent');
        let bubbleTimeout = null;

        function showUserBubble() {
            bubbleContent.innerHTML = `
                <b>👋 Selamat Belanja</b><br>
                <span style="font-size:11px;color:#888;">User ID:</span><br>
                <span style="font-size:11px;color:#00ffaa;word-break:break-all;">${userID}</span>
            `;
            bubble.classList.add('show');

            // Hapus timeout lama jika ada
            if (bubbleTimeout) clearTimeout(bubbleTimeout);

            bubbleTimeout = setTimeout(() => {
                bubble.classList.remove('show');
                bubbleTimeout = null;
                setTimeout(cekPesan, 500);
            }, 3000);
        }

        function closeBubble() {
            bubble.classList.remove('show');
            if (bubbleTimeout) {
                clearTimeout(bubbleTimeout);
                bubbleTimeout = null;
            }
        }

        // ===================== CEK PESAN =====================
        async function cekPesan() {
            try {
                const res = await fetch('/sunsosmed/pesan.json?cache=' + Date.now());
                if (!res.ok) {
                    console.log('Tidak ada pesan.');
                    return;
                }

                const data = await res.json();
                let alerts = [];

                if (data[userID]) {
                    alerts.push({
                        title: '📩 Pesan Baru',
                        html: '<b>UserID:</b><br>' + userID + '<br><br><b>Pesan:</b><br>' + data[userID],
                        icon: 'info'
                    });
                }

                if (data["all"]) {
                    alerts.push({
                        title: '📢 Pengumuman',
                        html: data["all"],
                        icon: 'warning'
                    });
                }
                if (data["all1"]) {
                    alerts.push({
                        title: '📢 Pengumuman',
                        html: data["all1"],
                        icon: 'warning'
                    });
                }
                if (data["all2"]) {
                    alerts.push({
                        title: '📢 Pengumuman',
                        html: data["all2"],
                        icon: 'warning'
                    });
                }

                // Tampilkan alert secara berurutan
                for (const alert of alerts) {
                    await Swal.fire({
                        title: alert.title,
                        html: alert.html,
                        icon: alert.icon,
                        confirmButtonText: 'Tutup',
                        confirmButtonColor: '#00ffaa'
                    });
                }

            } catch (e) {
                console.log('Tidak ada pesan.');
            }
        }

        // ===================== NAVIGASI =====================
        function goTo(url) {
            // Efek loading pada tombol
            const btns = document.querySelectorAll('.nav-btn');
            btns.forEach(btn => {
                btn.classList.add('loading');
                btn.style.opacity = '0.6';
            });

            setTimeout(() => {
                window.location.href = url;
            }, 300);
        }

        // ===================== INIT =====================
        window.addEventListener('load', function() {
            showUserBubble();

            // Jika bubble tidak muncul otomatis (fallback)
            setTimeout(() => {
                if (!bubble.classList.contains('show')) {
                    showUserBubble();
                }
            }, 1000);
        });

        // ===================== ANTI INSPECT =====================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' ||
                (e.ctrlKey && e.shiftKey && ['I', 'C', 'J'].includes(e.key)) ||
                (e.ctrlKey && e.key === 'u')) {
                e.preventDefault();
                return false;
            }
        });

        // ===================== LOG =====================
        console.log('🛒 Shine Shop siap!');
        console.log('👤 User ID:', userID);
    </script>

</body>
</html>
