  // Atur tanggal & waktu selesai (Tahun, Bulan-0, Tanggal, Jam, Menit, Detik)
  const targetDate = new Date(2025, 10, 2, 15, 40, 0);

  function goToStep(step) {
    const maintenance = document.getElementById("maintenance");
    const step1 = document.getElementById("step1");

    maintenance.classList.add("fade-out");
    setTimeout(() => {
      maintenance.classList.add("hidden");
      if(step === 1) {
        step1.classList.remove("hidden");
        step1.classList.remove("fade-out");
        step1.classList.add("fade-in");
      }
    }, 1000);
  }

  function updateCountdown() {
    const now = new Date().getTime();
    const distance = targetDate - now;

    if (distance < 0) {
      document.getElementById("countdown").innerHTML = "✅ Website sudah bisa diakses!";
      document.getElementById("dingSound").play();
      setTimeout(()=>{ goToStep(1); },2000);
      return;
    }

    const days = Math.floor(distance / (1000*60*60*24));
    const hours = Math.floor((distance % (1000*60*60*24)) / (1000*60*60));
    const minutes = Math.floor((distance % (1000*60*60)) / (1000*60));
    const seconds = Math.floor((distance % (1000*60)) / 1000);

    document.getElementById("countdown").innerHTML =
      `${days} hari ${hours} jam ${minutes} menit ${seconds} detik`;
  }

  setInterval(updateCountdown, 1000);
  updateCountdown();

let selectedService=null;
let orderData=null;
let qrCodeInstance=null;

function goToStep(step){
  for(let i=0;i<4;i++){
    const ElementById=document.getElementById('step'+i);
    if(el) el.classList.add('hidden');
  }
  document.getElementById('step'+step).classList.remove('hidden');
}

function loadLayanan(){
  const kategori=document.getElementById('kategori').value;
  const sel=document.getElementById('layanan');
  sel.innerHTML="<option value=''>Pilih...</option>";
  selectedService=null;
  document.getElementById('desc').innerHTML="";
  document.getElementById('infoMinMax').innerHTML="";
  if(!kategori||!layananData[kategori]) return;
  layananData[kategori].forEach((srv,idx)=>{
    const opt=document.createElement('option');
    opt.value=idx; opt.textContent=srv.name;
    sel.appendChild(opt);
  });
}

function updateDesc(){
  const kategori=document.getElementById('kategori').value;
  const layananIdx=document.getElementById('layanan').value;
  if(!kategori||layananIdx===""){selectedService=null;document.getElementById('desc').innerHTML="";document.getElementById('infoMinMax').innerHTML="";return;}
  const srv=layananData[kategori][layananIdx];
  selectedService=srv;
  document.getElementById('desc').innerText=srv.desc;
  document.getElementById('infoMinMax').innerText=`Minimal: ${srv.min}, Maksimal: ${srv.max}`;
  hitungTotal();
}

function hitungTotal(){
  if(!selectedService) return;
  const jumlah=parseInt(document.getElementById('jumlah').value||"0");
  const total=jumlah*selectedService.pricePerFollower;
  document.getElementById('total').value="Rp "+total.toLocaleString("id-ID");
}

function resetForm(){
  document.getElementById('wa').value="";
  document.getElementById('kategori').value="";
  document.getElementById('layanan').innerHTML="<option value=''>Pilih kategori dulu</option>";
  document.getElementById('desc').innerHTML="";
  document.getElementById('infoMinMax').innerHTML="";
  document.getElementById('jumlah').value="";
  document.getElementById('total').value="Rp 0";
  document.getElementById('username').value="";
  selectedService=null;
}

function lanjutPembayaran(){
  if(!selectedService){alert("Pilih layanan dulu!");return;}
  const jumlah=parseInt(document.getElementById('jumlah').value||"0");
  if(jumlah<selectedService.min||jumlah>selectedService.max){
    alert(`Jumlah harus antara ${selectedService.min} dan ${selectedService.max}`);return;
  }
  orderData={
    wa:document.getElementById('wa').value,
    kategori:document.getElementById('kategori').value,
    layanan:selectedService.name,
    jumlah:jumlah,
    total:jumlah*selectedService.pricePerFollower,
    username:document.getElementById('username').value
  };
  document.getElementById('orderSummary').innerText=`Pesanan: ${orderData.layanan}\nJumlah: ${orderData.jumlah}\nTotal: Rp ${orderData.total.toLocaleString("id-ID")}`;
  generateQR();
  goToStep(2);
}

function goBackToForm(){goToStep(1);}

function confirmPaid(){
  const adminWa="6289518103883";
  const pesan=encodeURIComponent(`Halo Admin, saya sudah bayar.\nDetail Pesanan:\n${orderData.layanan}\nJumlah: ${orderData.jumlah}\nTotal: Rp ${orderData.total.toLocaleString("id-ID")}`);
  window.open(`https://wa.me/${adminWa}?text=${pesan}`,"_blank");
  goToStep(3);
}

function generateQR(){
  const payload=`0002010102112669...5204000053033605802ID5913ShineShop6009Indonesia6105ID8213${orderData.total}6304ABCD`;
  document.getElementById("payload").innerText=payload;
  if(qrCodeInstance){qrCodeInstance.update({data:payload});}
  else {
    qrCodeInstance=new QRCodeStyling({width:250,height:250,type:"svg",data:payload,dotsOptions:{color:"#000"},backgroundOptions:{color:"#fff"}});
    qrCodeInstance.append(document.getElementById("qrisBox"));
  }
}
function downloadQR(){if(qrCodeInstance)qrCodeInstance.download({name:"qris-shine-shop",extension:"png"});}

function toggleMenu(){
  document.getElementById("hamburger").classList.toggle("active");
  document.getElementById("menu").classList.toggle("active");
}

function filterOptions(selectId,searchId){
  const input=document.getElementById(searchId).value.toLowerCase();
  const sel=document.getElementById(selectId);
  Array.from(sel.options).forEach(opt=>{
    if(opt.text.toLowerCase().includes(input))opt.style.display="";
    else opt.style.display="none";
  });
}
