<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sewa Web Shine Shop</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

*{
box-sizing:border-box;
font-family:Poppins;
}

body{
background:#0f172a;
color:white;
padding:20px;
}

h1{
text-align:center;
margin-bottom:20px;
}

.container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.card{
background:#1e293b;
padding:25px;
border-radius:15px;
}

.price{
color:#38bdf8;
font-weight:700;
margin-bottom:10px;
}

.btns{
display:flex;
gap:10px;
margin-top:10px;
}

button{
flex:1;
padding:10px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:600;
}

.month{
background:#38bdf8;
}

.perma{
background:#22c55e;
color:white;
}

.popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
display:none;
justify-content:center;
align-items:center;
background:rgba(0,0,0,.7);
}

.box{
background:white;
color:black;
padding:25px;
border-radius:12px;
text-align:center;
}

.close{
background:#ef4444;
color:white;
margin-top:10px;
}

.confirm{
background:#22c55e;
color:white;
margin-top:10px;
}

/* tombol musik */

.music-btn{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:70px;
height:70px;
border-radius:50%;
background:#38bdf8;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
cursor:pointer;
box-shadow:0 0 20px #38bdf8;
animation:pulse 2s infinite;
z-index:999;
}

@keyframes pulse{

0%{box-shadow:0 0 10px #38bdf8;}
50%{box-shadow:0 0 35px #38bdf8;}
100%{box-shadow:0 0 10px #38bdf8;}

}

</style>
</head>

<body>

<h1>Sewa Web Shine Shop</h1>

<div class="container">

<div class="card">
<h3>Newbie</h3>
<div class="price">5000/bulan • 10000/permanen</div>
<div class="btns">
<button class="month" onclick="buy('Newbie',5000)">Perbulan</button>
<button class="perma" onclick="buy('Newbie',10000)">Permanen</button>
</div>
</div>

<div class="card">
<h3>Reguler</h3>
<div class="price">20000/bulan • 30000/permanen</div>
<div class="btns">
<button class="month" onclick="buy('Reguler',20000)">Perbulan</button>
<button class="perma" onclick="buy('Reguler',30000)">Permanen</button>
</div>
</div>

<div class="card">
<h3>VIP</h3>
<div class="price">50000/bulan • 60000/permanen</div>
<div class="btns">
<button class="month" onclick="buy('VIP',50000)">Perbulan</button>
<button class="perma" onclick="buy('VIP',60000)">Permanen</button>
</div>
</div>

<div class="card">
<h3>VVIP</h3>
<div class="price">100000/bulan • 150000/permanen</div>
<div class="btns">
<button class="month" onclick="buy('VVIP',100000)">Perbulan</button>
<button class="perma" onclick="buy('VVIP',150000)">Permanen</button>
</div>
</div>

<div class="card">
<h3>Hype</h3>
<div class="price">200000/bulan • 300000/permanen</div>
<div class="btns">
<button class="month" onclick="buy('Hype',200000)">Perbulan</button>
<button class="perma" onclick="buy('Hype',300000)">Permanen</button>
</div>
</div>

</div>


<!-- POPUP QR -->

<div class="popup" id="popup">
<div class="box">

<h3 id="paket"></h3>
<p id="harga"></p>

<div id="qrcode"></div>

<button class="confirm"
onclick="window.location.href='https://t.me/shinedomain'">
Konfirmasi Pembayaran
</button>

<button class="close" onclick="closeQR()">Tutup</button>

</div>
</div>


<!-- AUDIO -->

<audio id="music" loop>
<source src="https://raw.githubusercontent.com/IkyyExecutive-v2/IkyySukaNgewe/main/uploads/1773720595309_2430_1773720593858_file_3108.mp3">
</audio>

<div class="music-btn" onclick="toggleMusic()" id="musicBtn">
▶
</div>


<script>

const baseQR="00020101021226670016COM.NOBUBANK.WWW01189360050300000879140214526036770909650303UMI51440014ID.CO.QRIS.WWW0215ID20243611417480303UMI5204541153033605802ID5920SHINE SHOP OK19967206008SURABAYA61056011162070703A01"

function buy(paket,nominal){

document.getElementById("popup").style.display="flex"

document.getElementById("paket").innerText="Paket "+paket
document.getElementById("harga").innerText="Rp "+nominal.toLocaleString()

let payload=baseQR+"54"+nominal.toString().length+nominal

document.getElementById("qrcode").innerHTML=""

new QRCode(document.getElementById("qrcode"),{
text:payload,
width:220,
height:220
})

}

function closeQR(){
document.getElementById("popup").style.display="none"
}

/* MUSIC */

function toggleMusic(){

let music=document.getElementById("music")
let btn=document.getElementById("musicBtn")

if(music.paused){
music.play()
btn.innerHTML="⏸"
}else{
music.pause()
btn.innerHTML="▶"
}

}

/* ANTI INSPECT */

document.addEventListener("contextmenu",e=>e.preventDefault())

document.onkeydown=function(e){

if(e.keyCode==123)return false

if(e.ctrlKey && e.shiftKey && e.keyCode==73)return false

if(e.ctrlKey && e.keyCode==85)return false

}

</script>

</body>
  </html>
