<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mengarahkan ke halaman utama..</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      background: radial-gradient(circle at 30% 30%, #ffeef2, #fff5f8);
      color: #333;
    }
    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #ff6b9a;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin-bottom: 15px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h1 {
      font-size: 1.2em;
    }
  </style>
</head>
<body>
  <div class="loader"></div>
  <h1>Mengarahkan ke halaman utama...</h1>
  <script>
    setTimeout(() => {
      window.location.href = "/home/";
    }, 500); // redirect setelah 1 detik
  </script>
</body>
</html>
