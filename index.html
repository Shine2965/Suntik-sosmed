<!DOCTYPE html>

<head> 
  <meta name="google-adsense-account" content="ca-pub-9912622413153708">

     crossorigin="anonymous"></script>
 <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Menu - Top Up & Suntik Sosmed</title>
  <style>
    :root{--bg:#0f172a;--accent:#7c3aed;--muted:#94a3b8}
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Inter,Segoe UI,system-ui,Arial;
      background:linear-gradient(180deg,#071026 0%, #07193a 100%);
      color:#e6eef8;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px
    }
    .container{
      width:100%;
      max-width:600px;
      background:rgba(255,255,255,0.02);
      border-radius:16px;
      padding:28px;
      box-shadow:0 8px 30px rgba(2,6,23,0.6);
      text-align:center
    }
    /* Logo dengan animasi fade-in */
    .logo{
      width:120px;
      margin:0 auto 16px;
      display:block;
      opacity:0;
      animation:fadeIn 1.2s ease forwards;
    }
    @keyframes fadeIn{
      from{opacity:0; transform:translateY(-15px);}
      to{opacity:1; transform:translateY(0);}
    }
    h1{
      font-size:22px;
      margin-bottom:20px;
      opacity:0;
      animation:fadeSlideIn 0.8s ease forwards;
      animation-delay:0.2s;
    }
    nav{display:flex;flex-direction:column;gap:12px}
    
    /* Tombol navigasi dengan animasi masuk + background gradasi bergerak */
    .nav-btn{
      background:linear-gradient(270deg, #7c3aed, #6366f1, #3b82f6, #7c3aed);
      background-size:400% 400%;
      border:none;
      padding:14px;
      border-radius:12px;
      color:#fff;
      cursor:pointer;
      font-weight:600;
      font-size:16px;
      opacity:0;
      transform:translateY(15px);
      animation:fadeSlideIn 0.8s ease forwards, gradientMove 6s ease infinite;
    }
    .nav-btn:nth-child(1){animation-delay:0.5s, 0s;}
    .nav-btn:nth-child(2){animation-delay:0.8s, 0s;}
    
    @keyframes fadeSlideIn{
      to{opacity:1; transform:translateY(0);}
    }
    @keyframes gradientMove{
      0%{background-position:0% 50%;}
      50%{background-position:100% 50%;}
      100%{background-position:0% 50%;}
    }
    .nav-btn:hover{
      box-shadow:0 0 18px rgba(124,58,237,0.6);
      transform:scale(1.03);
    }
  </style>
</head>
<body>
  <script>
  // 🔧 Toggle Maintenance ON/OFF
  const isMaintenance = false; // ubah ke true jika mau matikan website

  if (isMaintenance) {
    window.location.href = "maintenance2.html";
  }
  </script>
  <div class="container">
    <!-- Logo toko (file logo.png ada di folder sama dengan index.html) -->
    <img src="logo.png" alt="Logo Toko" class="logo">

    <h1>Navigasi</h1>
    <nav>
      <button class="nav-btn" onclick="window.location.href='top%20up%20game.html'">💎Top up game</button>
      <button class="nav-btn" onclick="window.location.href='dashboardsmm.html'">🚀Suntik sosmed</button>
      <button class="nav-btn" onclick="window.location.href='kontaksmm.html'">🎧Customer Service</button>
        <button class="nav-btn" onclick="window.location.href='global-chat/index.html'">🌐TESTER</button>
      
    </nav>
  </div>
</body>
</html>
