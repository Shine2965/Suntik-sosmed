<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="theme-color" content="#0f172a">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shine Shop</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/home/logo.png">
<link rel="icon" type="image/png" sizes="192x192" href="/home/logo.png">
<link rel="apple-touch-icon" sizes="180x180" href="/home/logo.png">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      background: radial-gradient(circle at 30% 30%, #ffeef2, #fff5f8);
      color: #333;
    }
    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #ff6b9a;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin-bottom: 15px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h1 {
      font-size: 1.2em;
    }
  </style>
</head>
<body>
  <div class="loader"></div>
  <h1>Mengarahkan ke halaman utama...</h1>
  <script>
    setTimeout(() => {
      window.location.href = "/home2/";
    }, 10); // redirect setelah 1 detik
    /* 🚫 ANTI INSPECT */
document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("keydown",function(e){
if(e.key==="F12") e.preventDefault();
if(e.ctrlKey&&e.shiftKey&&["I","C","J"].includes(e.key)) e.preventDefault();
if(e.ctrlKey&&e.key==="u") e.preventDefault();
});

setInterval(()=>{
if(window.outerWidth-window.innerWidth>160||window.outerHeight-window.innerHeight>160){
document.body.innerHTML="<h1 style='color:gold;text-align:center;margin-top:40vh;'>🚫 Developer Tools Terdeteksi</h1>";
}
},1000);

setInterval(()=>{console.clear();},1000);
setInterval(()=>{debugger;},3000);
    
  </script>
</body>
</html>
