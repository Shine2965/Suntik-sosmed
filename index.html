<style>
/* ========== RESET & BASE ========== */
* {
  box-sizing: border-box;

body {

/* ========== ANIMATED BACKGROUND ========== */
body::before {
  content: '';
  position: fixed;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: 
    radial-gradient(circle at 20% 30%, rgba(0, 198, 255, 0.15) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(0, 114, 255, 0.12) 0%, transparent 50%),

  z-index: 0;
  pointer-events: none;
}

@keyframes bgFloat {
  0% { transform: translate(0, 0) rotate(0deg); }
  33% { transform: translate(2%, -2%) rotate(2deg); }
  66% { transform: translate(-1%, 3%) rotate(-1deg); }
  100% { transform: translate(1%, -1%) rotate(1deg); }
}

/* ========== ORB DECORATIONS ========== */
.orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(80px);
  pointer-events: none;
  z-index: 0;
  animation: orbPulse 6s ease-in-out infinite alternate;
}

.orb-1 {
  width: 400px;
  height: 400px;
  top: -100px;
  right: -100px;
  background: rgba(0, 198, 255, 0.15);
  animation-delay: 0s;
}

.orb-2 {
  width: 300px;
  height: 300px;
  bottom: -50px;
  left: -50px;
  background: rgba(168, 85, 247, 0.12);
  animation-delay: 2s;
}

.orb-3 {
  width: 200px;
  height: 200px;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0, 114, 255, 0.08);
  animation-delay: 4s;
}

@keyframes orbPulse {
  0% { transform: scale(0.8); opacity: 0.6; }
  100% { transform: scale(1.2); opacity: 1; }
}

/* ========== CONTAINER ========== */
.container {
  width: 90%;
  max-width: 500px;
  background: rgba(255, 255, 255, 0.04);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border-radius: 28px;
  padding: 40px 30px;
  text-align: center;
  border: 1px solid rgba(255, 255, 255, 0.08);
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.06);
  position: relative;
  z-index: 1;
  margin-bottom: 16px;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.container:hover {
  transform: translateY(-3px);
  box-shadow: 0 40px 100px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.08);
}

/* ========== GLOW LINE AT TOP ========== */
.container::before {
  content: '';
  position: absolute;
  top: 0;
  left: 20%;
  right: 20%;
  height: 2px;
  background: linear-gradient(90deg, transparent, #00c6ff, #0072ff, #8b5cf6, transparent);

}

/* ========== LOGO / ICON WRAPPER ========== */
.logo-wrapper {
  width: 80px;

  padding: 4px;
  position: relative;
  animation: logoPulse 3s ease-in-out infinite;
}

.logo-wrapper::after {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  background: linear-gradient(135deg, #00c6ff, #0072ff, #8b5cf6);
  opacity: 0.3;
  filter: blur(12px);
  z-index: -1;
  animation: logoGlow 3s ease-in-out infinite alternate;
}

@keyframes logoGlow {
  0% { opacity: 0.2; transform: scale(0.9); }
  100% { opacity: 0.6; transform: scale(1.1); }
}

@keyframes logoPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.03); }
}

.logo-wrapper img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  display: block;
}

/* ========== TYPOGRAPHY ========== */
h1 {

.tagline {

.nav-btn:hover {

/* ========== SPECIAL BUTTON VARIANT ========== */

.nav-btn.purple {

.nav-btn.purple:hover {

.nav-btn.green {

  border-color: rgba(34, 197, 94, 0.25);
}

/* ========== DIVIDER ========== */
.divider {
  width: 60px;
  height: 2px;
  margin: 12px auto;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
  border-radius: 100%;
}

/* ========== FOOTER ========== */
.footer {
  margin-top: 20px;
  font-size: 11px;
  color: #475569;
  letter-spacing: 0.5px;
}

.footer span {

  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-weight: 600;

/* ========== USER BUBBLE ========== */
.user-bubble {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: rgba(15, 23, 42, 0.9);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,0.06);
  padding: 14px 20px;
  border-radius: 16px;

  opacity: 0;
  transform: translateY(30px) scale(0.95);
  transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  max-width: 260px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
}

.user-bubble.show {
  opacity: 1;

}

.user-bubble b {
  color: #e2e8f0;

}

.user-bubble .user-id {

/* ========== RESPONSIVE ========== */
@media (max-width: 480px) {

  }
}
</style>

<body>

<!-- ========== ORB DECORATIONS ========== -->

<!-- ========== USER BUBBLE ========== -->

<script>
// ============================================================
// 🔒 DRAGON PROTOCOL: PERSISTENT USER ID & REFERRAL CODE
// ============================================================

// ---------- USER ID (IMMUTABLE) ----------
function generateUserID() {
  return 'user-' + Math.random().toString(36).substring(2, 10) + '-' + Date.now().toString(36);
}

function getOrCreateUserID() {
  let id = localStorage.getItem('user_id');
  if (!id) {
    id = generateUserID();
    localStorage.setItem('user_id', id);
  }
  return id;
}

const userID = getOrCreateUserID();

// ---------- REFERRAL CODE (IMMUTABLE ONCE SET) ----------
function getReferralFromURL() {
  const params = new URLSearchParams(window.location.search);
  return params.get('ref') || null;
}

function getStoredReferral() {
  return localStorage.getItem('referral_code') || null;
}

function setReferralIfNotExists(code) {
  if (!code) return false;
  const existing = getStoredReferral();
  if (!existing) {
    localStorage.setItem('referral_code', code);
    return true;
  }
  return false; // already exists, ignore new one
}

// ---------- LOCK: Prevent localStorage manipulation via console ----------
// Override setItem untuk referral_code & user_id biar gak bisa diubah dari console
(function lockLocalStorage() {
  const originalSetItem = Storage.prototype.setItem;
  const originalRemoveItem = Storage.prototype.removeItem;
  
  Storage.prototype.setItem = function(key, value) {
    if (key === 'referral_code' && localStorage.getItem('referral_code') !== null) {
      console.warn('🔒 Shine Lock: Referral code sudah diset, tidak bisa diubah!');
      return;
    }
    if (key === 'user_id' && localStorage.getItem('user_id') !== null) {
      console.warn('🔒 Shine Lock: User ID sudah diset, tidak bisa diubah!');
      return;
    }
    originalSetItem.call(this, key, value);
  };
  
  Storage.prototype.removeItem = function(key) {
    if (key === 'referral_code' || key === 'user_id') {
      console.warn('🔒 Dragon Lock: Gak bisa hapus ' + key + '!');
      return;
    }
    originalRemoveItem.call(this, key);
  };
})();

// ---------- EXECUTE ----------
// 1. Simpan referral dari URL (hanya jika belum ada)
const urlRef = getReferralFromURL();
if (urlRef) {
  const isNew = setReferralIfNotExists(urlRef);
  if (isNew) {
    console.log('✅ Referral code tersimpan: ' + urlRef);
  } else {
    console.log('ℹ️ Referral code sudah ada, abaikan dari URL: ' + urlRef);
  }
}

// 2. Tampilkan status referral
const statusElement = document.getElementById('status-ref');
const storedRef = getStoredReferral();
if (storedRef) {
  statusElement.innerHTML = `✅ Terdeteksi! Kode referral Anda: <strong>${storedRef}</strong>`;
} else {
  statusElement.innerHTML = `❌ Tidak ada kode referral tersimpan.`;
}

// 3. Tampilkan user bubble
const bubble = document.getElementById('userBubble');

function showUserBubble() {
  bubble.innerHTML = `<b>👋 Selamat Datang</b><span class="user-id">${userID}</span>`;
  bubble.classList.add('show');
  setTimeout(() => {
    bubble.classList.remove('show');
    cekPesan();
  }, 500);
}

// ---------- PESAN CHECK (existing) ----------
async function cekPesan() {
  try {
    const res = await fetch('/home2/pesan.json?cache=' + Date.now());
    const data = await res.json();
    let alerts = [];
    if (data[userID]) {
      alerts.push({
        title: '📩 Pesan Baru',
        html: '<b>UserID:</b><br>' + userID + '<br><br><b>Pesan:</b><br>' + data[userID],
        icon: 'info'
      });
    }
    if (data['all']) {
      alerts.push({
        title: '📢 Pengumuman',
        html: data['all'],
        icon: 'warning'
      });
    }
    if (data['all1']) {
      alerts.push({
        title: '📢 Pengumuman',
        html: data['all1'],
        icon: 'warning'
      });
    }
    if (data['all2']) {
      alerts.push({
        title: '📢 Pengumuman',
        html: data['all2'],
        icon: 'warning'
      });
    }
    for (const alert of alerts) {
      await Swal.fire({
        title: alert.title,
        html: alert.html,
        icon: alert.icon,
        confirmButtonText: 'Tutup'
      });
    }
  } catch (e) {
    console.log('Tidak ada pesan.');
  }
}

// ---------- INIT ----------
window.addEventListener('load', showUserBubble);

// ---------- ANTI DEVTOOLS ----------
document.addEventListener('keydown', function(e) {
  if (e.key === 'F12') e.preventDefault();
  if (e.ctrlKey && e.shiftKey && ['I', 'C', 'J'].includes(e.key)) e.preventDefault();
  if (e.ctrlKey && e.key === 'u') e.preventDefault();
});

setInterval(() => {
  const threshold = 160;
  if (window.devtoolsOpen) return;
  const widthThreshold = window.outerWidth - window.innerWidth > threshold;
  if (widthThreshold && !/Android|iPhone|iPad/i.test(navigator.userAgent)) {
    document.body.innerHTML = "<h1 style='color:gold;text-align:center;margin-top:40vh;'>🚫 Developer Tools Terdeteksi</h1>";
  }
}, 2000);

console.log('🐉 Dragon V1 Active - Referral & UserID Locked!');
</script>
