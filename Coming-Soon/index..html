<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <style>
        /* ===============================
           ROOT THEME
        =================================*/
        :root {
            --bg: #090d16;
            --glass: rgba(255, 255, 255, 0.04);
            --glass-strong: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.06);
            --accent1: #8b5cf6;
            --accent2: #06b6d4;
            --accent-gradient: linear-gradient(135deg, #8b5cf6, #06b6d4);
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --radius: 20px;
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        /* ===============================
           BASE
        =================================*/
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(-45deg, #0f172a, #1e293b, #0f172a, #0b1524);
            background-size: 400% 400%;
            animation: gradientBG 20s ease infinite;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ===============================
           ANIMATED BACKGROUND PARTICLES
        =================================*/
        .particles {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--accent1);
            border-radius: 50%;
            opacity: 0.3;
            animation: floatParticle 15s infinite ease-in-out;
        }

        .particle:nth-child(1) { top: 10%; left: 10%; animation-delay: 0s; width: 6px; height: 6px; background: var(--accent2); }
        .particle:nth-child(2) { top: 80%; left: 85%; animation-delay: 2s; width: 8px; height: 8px; }
        .particle:nth-child(3) { top: 40%; left: 5%; animation-delay: 4s; width: 5px; height: 5px; background: var(--accent2); }
        .particle:nth-child(4) { top: 70%; left: 20%; animation-delay: 6s; width: 10px; height: 10px; opacity: 0.2; }
        .particle:nth-child(5) { top: 20%; left: 75%; animation-delay: 8s; width: 7px; height: 7px; }
        .particle:nth-child(6) { top: 50%; left: 50%; animation-delay: 3s; width: 12px; height: 12px; opacity: 0.15; background: var(--accent2); }
        .particle:nth-child(7) { top: 85%; left: 60%; animation-delay: 5s; width: 5px; height: 5px; }
        .particle:nth-child(8) { top: 15%; left: 45%; animation-delay: 7s; width: 9px; height: 9px; background: var(--accent2); }

        @keyframes floatParticle {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.2; }
            25% { transform: translate(30px, -40px) scale(1.3); opacity: 0.5; }
            50% { transform: translate(-20px, 20px) scale(0.8); opacity: 0.3; }
            75% { transform: translate(40px, 30px) scale(1.1); opacity: 0.5; }
        }

        /* ===============================
           GLOW ORBS
        =================================*/
        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
            animation: orbPulse 8s ease-in-out infinite alternate;
        }

        .glow-orb.orb1 {
            width: 400px;
            height: 400px;
            background: rgba(139, 92, 246, 0.15);
            top: -100px;
            right: -100px;
        }

        .glow-orb.orb2 {
            width: 300px;
            height: 300px;
            background: rgba(6, 182, 212, 0.12);
            bottom: -50px;
            left: -50px;
            animation-delay: 4s;
        }

        @keyframes orbPulse {
            0% { transform: scale(1) translate(0, 0); opacity: 0.6; }
            100% { transform: scale(1.2) translate(30px, -20px); opacity: 1; }
        }

        /* ===============================
           MAIN CARD
        =================================*/
        .card {
            position: relative;
            z-index: 1;
            max-width: 600px;
            width: 100%;
            padding: 50px 48px;
            background: rgba(30, 41, 59, 0.35);
            backdrop-filter: blur(24px) saturate(1.2);
            -webkit-backdrop-filter: blur(24px) saturate(1.2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            text-align: center;
            animation: fadeUp 0.8s ease both;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ===============================
           BADGE
        =================================*/
        .badge {
            display: inline-block;
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: white;
            background: var(--accent-gradient);
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.3);
            margin-bottom: 24px;
            animation: pulseBadge 2.5s ease-in-out infinite;
        }

        @keyframes pulseBadge {
            0%, 100% { box-shadow: 0 4px 20px rgba(139, 92, 246, 0.3); }
            50% { box-shadow: 0 4px 40px rgba(139, 92, 246, 0.6); }
        }

        /* ===============================
           ICON / LOGO PLACEHOLDER
        =================================*/
        .icon-wrapper {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            border-radius: 50%;
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            box-shadow: 0 0 40px rgba(139, 92, 246, 0.1);
            animation: iconFloat 3s ease-in-out infinite;
        }

        @keyframes iconFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* ===============================
           TYPOGRAPHY
        =================================*/
        h1 {
            font-size: 42px;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 12px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
        }

        .subtitle {
            font-size: 18px;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        .description {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.8;
            max-width: 400px;
            margin: 16px auto 0;
        }

        /* ===============================
           DIVIDER
        =================================*/
        .divider {
            width: 60px;
            height: 3px;
            margin: 20px auto;
            border-radius: 10px;
            background: var(--accent-gradient);
        }

        /* ===============================
           NOTIFY FORM
        =================================*/
        .notify-form {
            display: flex;
            gap: 12px;
            margin-top: 28px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .notify-form input {
            flex: 1;
            min-width: 200px;
            padding: 14px 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.6);
            color: white;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .notify-form input::placeholder {
            color: var(--text-muted);
        }

        .notify-form input:focus {
            outline: none;
            border-color: var(--accent2);
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.15);
            background: rgba(15, 23, 42, 0.85);
        }

        .notify-form button {
            padding: 14px 32px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            background: var(--accent-gradient);
            color: white;
            box-shadow: 0 8px 24px rgba(124, 58, 237, 0.3);
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .notify-form button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(6, 182, 212, 0.4);
        }

        /* ===============================
           SOCIAL ICONS
        =================================*/
        .socials {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 28px;
            flex-wrap: wrap;
        }

        .socials a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--glass);
            border: 1px solid var(--border);
            color: var(--text-muted);
            text-decoration: none;
            font-size: 18px;
            transition: all 0.3s ease;
        }

        .socials a:hover {
            background: rgba(139, 92, 246, 0.12);
            border-color: var(--accent1);
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(139, 92, 246, 0.15);
        }

        /* ===============================
           FOOTER
        =================================*/
        .footer {
            margin-top: 32px;
            font-size: 12px;
            color: var(--text-muted);
            opacity: 0.5;
            letter-spacing: 0.5px;
        }

        .footer span {
            color: var(--accent1);
            opacity: 1;
        }

        /* ===============================
           RESPONSIVE
        =================================*/
        @media (max-width: 600px) {
            .card {
                padding: 32px 24px;
            }

            h1 {
                font-size: 30px;
            }

            .subtitle {
                font-size: 16px;
            }

            .icon-wrapper {
                width: 64px;
                height: 64px;
                font-size: 28px;
            }

            .notify-form {
                flex-direction: column;
            }

            .notify-form input {
                min-width: unset;
                width: 100%;
            }

            .notify-form button {
                width: 100%;
            }

            .glow-orb.orb1 {
                width: 200px;
                height: 200px;
                top: -50px;
                right: -50px;
            }

            .glow-orb.orb2 {
                width: 150px;
                height: 150px;
                bottom: -30px;
                left: -30px;
            }
        }

        @media (max-width: 400px) {
            .card {
                padding: 24px 16px;
            }

            h1 {
                font-size: 26px;
            }

            .socials a {
                width: 38px;
                height: 38px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>

    <script>
        // Simple form handler
        document.getElementById('notifyForm').addEventListener('submit', function(e) {
            e.preventDefault();

                alert('✅ Terima kasih! Kami akan memberi tahu Anda segera.');

        });
    </script>

</body>
</html>
