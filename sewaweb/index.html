<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sewa Web • Shine Shop</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

*{
box-sizing:border-box;
font-family:Poppins;
}

body{
background:#0f172a;
color:white;
padding:20px;
}

h1{
text-align:center;
margin-bottom:20px;
}

.container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:20px;
}

/* CARD */

.card{
background:#1e293b;
padding:25px;
border-radius:15px;
}

.price{
color:#38bdf8;
font-weight:700;
margin-bottom:10px;
}

ul{
font-size:14px;
margin-bottom:15px;
padding-left:18px;
}

/* MUSIC */

.music-box{
display:flex;
flex-direction:column;
align-items:center;
margin-bottom:10px;
}

.music-title{
width:100%;
overflow:hidden;
white-space:nowrap;
border-top:1px solid #334155;
border-bottom:1px solid #334155;
margin-bottom:6px;
}

.music-title span{
display:inline-block;
padding-left:100%;
animation:marquee 10s linear infinite;
}

@keyframes marquee{
0%{transform:translateX(0)}
100%{transform:translateX(-100%)}
}

/* equalizer */

.equalizer{
display:flex;
gap:3px;
height:18px;
align-items:flex-end;
}

.bar{
width:4px;
background:#38bdf8;
height:5px;
animation:music 1s infinite;
animation-play-state:paused;
}

.bar:nth-child(2){animation-delay:.2s}
.bar:nth-child(3){animation-delay:.4s}
.bar:nth-child(4){animation-delay:.6s}
.bar:nth-child(5){animation-delay:.8s}

@keyframes music{

0%{height:5px}
50%{height:18px}
100%{height:5px}

}

.music-btn{
width:40px;
height:40px;
border-radius:50%;
background:#38bdf8;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
margin-top:6px;
}

/* BUTTON */

.btns{
display:flex;
gap:10px;
}

button{
flex:1;
padding:10px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:600;
}

.month{
background:#38bdf8;
}

.perma{
background:#22c55e;
color:white;
}

/* popup */

.popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
display:none;
justify-content:center;
align-items:center;
background:rgba(0,0,0,.7);
}

.box{
background:white;
color:black;
padding:25px;
border-radius:12px;
text-align:center;
max-width:320px;
}

.confirm{
background:#22c55e;
color:white;
padding:10px;
border:none;
border-radius:8px;
margin-top:10px;
}

.close{
background:#ef4444;
color:white;
padding:10px;
border:none;
border-radius:8px;
margin-top:10px;
}

.info{
margin-top:40px;
background:#1e293b;
padding:25px;
border-radius:15px;
line-height:1.6;
}

.info h3{
color:#38bdf8;
margin-top:15px;
}

</style>
</head>

<body>

<h1>Sewa Web Shine Shop</h1>

<div class="container">

<div class="card">

<h3>Paket Newbie</h3>

<div class="price">
Rp5.000/bulan<br>
Rp10.000/permanen
</div>

<ul>
<li>Fee add balance 11%</li>
<li>Web suntik sosmed terbatas</li>
<li>Bebas request tampilan</li>
<li>Bebas subdomain</li>
</ul>

<div class="music-box">

<div class="music-title">
<span>🎵 Benson Boone - In The Stars</span>
</div>

<div class="equalizer">

<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>

</div>

<div class="music-btn" onclick="toggleMusic()" id="musicBtn">
▶
</div>

</div>

<div class="btns">
<button class="month" onclick="buy('Newbie',5000)">Perbulan</button>
<button class="perma" onclick="buy('Newbie',10000)">Permanen</button>
</div>

</div>

</div>

<!-- POPUP -->

<div class="popup" id="popup">

<div class="box">

<h3 id="paket"></h3>

<p id="harga"></p>

<div id="qrcode"></div>

<button class="confirm"
onclick="window.location.href='https://t.me/shinedomain'">
Konfirmasi Pembayaran
</button>

<br>

<button class="close" onclick="closeQR()">Tutup</button>

</div>

</div>

<audio id="music" loop>
<source src="https://raw.githubusercontent.com/IkyyExecutive-v2/IkyySukaNgewe/main/uploads/1773720595309_2430_1773720593858_file_3108.mp3">
</audio>

<script>

/* QRIS */

const qris =
"00020101021226670016COM.NOBUBANK.WWW01189360050300000879140214526036770909650303UMI51440014ID.CO.QRIS.WWW0215ID20243611417480303UMI5204541153033605802ID5920SHINE SHOP OK19967206008SURABAYA61056011162070703A01"

function buy(paket,nominal){

document.getElementById("popup").style.display="flex"

document.getElementById("paket").innerText="Paket "+paket

document.getElementById("harga").innerText="Rp "+nominal.toLocaleString()

document.getElementById("qrcode").innerHTML=""

new QRCode(document.getElementById("qrcode"),{

text:qris,

width:220,

height:220

})

}

function closeQR(){

document.getElementById("popup").style.display="none"

}

/* MUSIC */

function toggleMusic(){

let music=document.getElementById("music")

let btn=document.getElementById("musicBtn")

let bars=document.querySelectorAll(".bar")

if(music.paused){

music.play()

btn.innerHTML="⏸"

bars.forEach(bar=>{

bar.style.animationPlayState="running"

})

}else{

music.pause()

btn.innerHTML="▶"

bars.forEach(bar=>{

bar.style.animationPlayState="paused"

})

}

}

/* ANTI INSPECT */

document.addEventListener("contextmenu",e=>e.preventDefault())

document.onkeydown=function(e){

if(e.keyCode==123)return false

if(e.ctrlKey && e.shiftKey && e.keyCode==73)return false

if(e.ctrlKey && e.keyCode==85)return false

}

</script>

</body>
</html>
