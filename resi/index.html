<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Form Bukti Packing</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:linear-gradient(135deg,#5865F2,#7289DA);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{
    background:#fff;
    width:100%;
    max-width:550px;
    border-radius:15px;
    padding:25px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
}

h1{
    text-align:center;
    color:#5865F2;
    margin-bottom:20px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:8px;
    font-weight:bold;
}

input,select{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #ccc;
    font-size:15px;
}

input[type=file]{
    padding:8px;
}

.info{
    margin-top:20px;
    background:#FFF7D6;
    border-left:5px solid orange;
    padding:15px;
    border-radius:10px;
}

.info ul{
    margin-left:20px;
    margin-top:8px;
}

button{
    margin-top:25px;
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#5865F2;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#4752C4;
}

.preview{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(90px,1fr));
    gap:10px;
    margin-top:15px;
}

.preview img{
    width:100%;
    height:90px;
    object-fit:cover;
    border-radius:10px;
    border:2px solid #ddd;
}

#status{
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}
</style>

</head>
<body>

<div class="card">

<h1>📦 Form Bukti Packing</h1>

<form id="packingForm">

<label>Nama Produk</label>
<input
type="text"
name="produk"
placeholder="Masukkan nama produk"
required>

<label>Marketplace</label>
<select name="marketplace" required>
<option value="">Pilih Marketplace</option>
<option value="Shopee">Shopee</option>
<option value="Lazada">Lazada</option>
<option value="Tokopedia">Tokopedia</option>
<option value="TikTok Shop">TikTok Shop</option>
</select>

<label>Upload Foto (Maksimal 5)</label>

<input
    type="file"
    id="file"
    name="file"
    accept="image/*,.pdf,application/pdf"
    multiple
    required>
<div class="preview" id="preview"></div>

<div class="info">
<b>📌 Wajib Melampirkan:</b>
<ul>
    <li>Foto sebelum packing</li>
    <li>Foto resi</li>
    <li>Foto sesudah packing</li>
    <li>dokumen Resi PDF</li>
</ul>

<p style="margin-top:10px;">
Maksimal <b>5 file</b>.<br>
Format yang didukung:
<b>JPG, JPEG, PNG, WEBP, PDF</b>.
</p>
</div>
    <p style="margin-top:10px;">
Minimal <b>3 foto</b> dan maksimal <b>5 foto</b>.
</p>

<button type="submit">
Kirim Bukti Packing
</button>

<div id="status"></div>

</form>

</div>

<script>

const fileInput = document.getElementById("file");
const preview = document.getElementById("preview");

fileInput.addEventListener("change", () => {

    preview.innerHTML = "";

    if (fileInput.files.length > 5) {
        alert("Maksimal 5 file.");
        fileInput.value = "";
        return;
    }

    Array.from(fileInput.files).forEach(file => {

        if (file.type.startsWith("image/")) {

            const reader = new FileReader();

            reader.onload = e => {

                const img = document.createElement("img");
                img.src = e.target.result;
                preview.appendChild(img);

            };

            reader.readAsDataURL(file);

        } else if (file.type === "application/pdf") {

            const div = document.createElement("div");

            div.style.padding = "10px";
            div.style.border = "2px solid #ccc";
            div.style.borderRadius = "10px";
            div.style.textAlign = "center";
            div.innerHTML = "📄<br>" + file.name;

            preview.appendChild(div);

        }

    });

});
    const files = fileInput.files;

if (files.length < 3) {
    alert("Minimal upload 3 file.");
    return;
}

if (files.length > 5) {
    alert("Maksimal upload 5 file.");
    return;
}

document.getElementById("packingForm").addEventListener("submit", async function(e){

    e.preventDefault();

    const status = document.getElementById("status");

    const formData = new FormData(this);

    
});
    
const formData=new FormData(this);

status.style.color="blue";
status.innerHTML="⏳ Mengirim data...";

try{

const res=await fetch("/api/upload",{
method:"POST",
body:formData
});

if(res.ok){

status.style.color="green";
status.innerHTML="✅ Data berhasil dikirim.";

this.reset();
preview.innerHTML="";

}else{

status.style.color="red";
status.innerHTML="❌ Gagal mengirim data.";

}

}catch(err){

status.style.color="red";
status.innerHTML="❌ Tidak dapat terhubung ke server.";

}

});

</script>

</body>
</html>
