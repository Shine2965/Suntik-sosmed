<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Bukti Packing</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.card{
    width:100%;
    max-width:500px;
    background:#1e293b;
    padding:25px;
    border-radius:15px;
    color:#fff;
    box-shadow:0 0 20px rgba(0,0,0,.4);
}

h2{
    text-align:center;
    margin-bottom:20px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:8px;
    font-weight:bold;
}

input,select{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    outline:none;
}

input[type=file]{
    background:#fff;
}

.info{
    margin-top:10px;
    background:#334155;
    padding:12px;
    border-radius:8px;
    font-size:14px;
    line-height:1.6;
}

button{
    width:100%;
    margin-top:20px;
    padding:14px;
    border:none;
    border-radius:8px;
    background:#3b82f6;
    color:#fff;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#2563eb;
}

#status{
    text-align:center;
    margin-top:15px;
}
</style>

</head>
<body>

<div class="card">

<h2>Upload Bukti Packing</h2>

<form id="form">

<label>Nama Produk</label>
<input
type="text"
id="produk"
required
placeholder="Masukkan nama produk">

<label>Marketplace</label>
<select id="marketplace" required>
<option value="">Pilih Marketplace</option>
<option>Shopee</option>
<option>Lazada</option>
<option>Tokopedia</option>
<option>TikTok Shop</option>
</select>

<label>Upload File (Wajib)</label>
<input
type="file"
id="file"
multiple
required
accept="image/*">

<div class="info">
<b>Wajib menyertakan:</b><br><br>

📷 Foto sebelum packing<br>
📦 Foto resi<br>
📷 Foto sesudah packing
</div>

<button type="submit">
Kirim
</button>

</form>

<div id="status"></div>

</div>

<script>

// GANTI DENGAN WEBHOOK DISCORD ANDA
const WEBHOOK_URL="https://discord.com/api/webhooks/1482245411325345793/79LyZzxEZxoHVZeW9bgJpf_SmPDQ4uZCO6DO652Hids_7xZjK0gUYuOZrgBqoin-Qez6";

document.getElementById("form").addEventListener("submit",async(e)=>{

e.preventDefault();

const produk=document.getElementById("produk").value;
const marketplace=document.getElementById("marketplace").value;
const files=document.getElementById("file").files;

if(files.length<1){
alert("Minimal upload 1 foto.");
return;
}

const formData=new FormData();

formData.append(
"content",
`📦 **Upload Bukti Packing**

**Nama Produk:** ${produk}
**Marketplace:** ${marketplace}`
);

for(let i=0;i<files.length;i++){
formData.append("files["+i+"]",files[i]);
}

document.getElementById("status").innerHTML="Mengirim...";

try{

const res=await fetch(WEBHOOK_URL,{
method:"POST",
body:formData
});

if(res.ok){
document.getElementById("status").innerHTML="✅ Berhasil dikirim.";
document.getElementById("form").reset();
}else{
document.getElementById("status").innerHTML="❌ Gagal mengirim.";
}

}catch(err){
document.getElementById("status").innerHTML=
"❌ Request diblokir browser (CORS). Gunakan backend/proxy untuk meneruskan data ke Discord Webhook.";
}

});

</script>

</body>
</html>
