<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Produk</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#0f172a;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.container{
    width:100%;
    max-width:650px;
    background:#1e293b;
    padding:25px;
    border-radius:18px;
    box-shadow:0 0 30px rgba(0,0,0,.4);
}

h1{
    text-align:center;
    margin-bottom:20px;
}

label{
    display:block;
    margin-top:18px;
    margin-bottom:8px;
    font-weight:bold;
}

input[type=text]{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    outline:none;
    background:#334155;
    color:#fff;
}

input[type=file]{
    width:100%;
    padding:10px;
    border-radius:10px;
    background:#334155;
    color:#fff;
}

small{
    color:#cbd5e1;
}

.preview{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:15px;
}

.preview img{
    width:120px;
    height:120px;
    object-fit:cover;
    border-radius:10px;
    border:2px solid #475569;
}

.preview video{
    width:100%;
    border-radius:10px;
    margin-top:10px;
}

button{
    width:100%;
    margin-top:25px;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:#fff;
    font-size:17px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.progress{
    width:100%;
    height:14px;
    background:#334155;
    border-radius:30px;
    overflow:hidden;
    margin-top:20px;
    display:none;
}

.progress-bar{
    width:0%;
    height:100%;
    background:#22c55e;
    transition:.2s;
}

#status{
    text-align:center;
    margin-top:15px;
}
</style>
</head>
<body>

<div class="container">

<h1>Upload Produk</h1>

<form id="uploadForm">

<label>Nama Produk</label>
<input
type="text"
name="productName"
placeholder="Masukkan nama produk"
required>

<label>Upload Foto (Maksimal 3)</label>
<input
type="file"
id="photos"
name="photos"
accept="image/*"
multiple
required>

<small>Maksimal 3 foto. sebelum dipacking, resi dan sesudah dipacking</small>

<div class="preview" id="photoPreview"></div>

<label>Upload Video</label>
<input
type="file"
id="video"
name="video"
accept="video/*"
required>

<small>Video maksimal 20 menit. Vidio berisi proses packing produk</small>

<div class="preview" id="videoPreview"></div>

<div class="progress" id="progress">
<div class="progress-bar" id="bar"></div>
</div>

<p id="status"></p>

<button type="submit">
Kirim
</button>

</form>

</div>

<script>

const photoInput=document.getElementById("photos");
const videoInput=document.getElementById("video");

photoInput.addEventListener("change",()=>{

if(photoInput.files.length>3){
alert("Maksimal hanya 3 foto.");
photoInput.value="";
document.getElementById("photoPreview").innerHTML="";
return;
}

const preview=document.getElementById("photoPreview");
preview.innerHTML="";

[...photoInput.files].forEach(file=>{

const img=document.createElement("img");
img.src=URL.createObjectURL(file);

preview.appendChild(img);

});

});

videoInput.addEventListener("change",()=>{

const preview=document.getElementById("videoPreview");
preview.innerHTML="";

const file=videoInput.files[0];

if(!file) return;

const video=document.createElement("video");

video.controls=true;
video.src=URL.createObjectURL(file);

preview.appendChild(video);

});

document.getElementById("uploadForm").addEventListener("submit",function(e){

e.preventDefault();

const formData=new FormData();

formData.append(
"productName",
this.productName.value
);

for(const file of photoInput.files){
formData.append("photos",file);
}

if(videoInput.files[0]){
formData.append(
"video",
videoInput.files[0]
);
}

const xhr=new XMLHttpRequest();

xhr.open(
"POST",
"/api/upload"
);

document.getElementById("progress").style.display="block";

xhr.upload.onprogress=function(e){

if(e.lengthComputable){

const percent=(e.loaded/e.total)*100;

document.getElementById("bar").style.width=
percent+"%";

}

};

xhr.onload=function(){

if(xhr.status===200){

document.getElementById("status").innerHTML=
"✅ Upload berhasil.";

document.getElementById("bar").style.width="100%";

document.getElementById("uploadForm").reset();

document.getElementById("photoPreview").innerHTML="";
document.getElementById("videoPreview").innerHTML="";

}else{

document.getElementById("status").innerHTML=
"❌ Upload gagal.";

}

};

xhr.onerror=function(){

document.getElementById("status").innerHTML=
"❌ Terjadi kesalahan.";

};

xhr.send(formData);

});

</script>

</body>
</html>
