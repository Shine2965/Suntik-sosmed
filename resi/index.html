<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Upload Bukti Packing</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f4f6f9;
display:flex;
justify-content:center;
padding:30px;
}

.container{
width:100%;
max-width:600px;
background:#fff;
padding:25px;
border-radius:15px;
box-shadow:0 10px 30px rgba(0,0,0,.15);
}

h2{
text-align:center;
margin-bottom:20px;
color:#333;
}

label{
display:block;
margin-top:18px;
margin-bottom:8px;
font-weight:bold;
}

input[type=text],
select{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:10px;
font-size:15px;
}

input[type=file]{
width:100%;
padding:12px;
border:2px dashed #888;
border-radius:10px;
background:#fafafa;
}

.note{
margin-top:10px;
font-size:14px;
color:#666;
line-height:22px;
background:#f5f5f5;
padding:12px;
border-radius:10px;
}

#fileList{
margin-top:15px;
}

.file-item{
padding:8px;
background:#eef2ff;
margin-bottom:8px;
border-radius:8px;
font-size:14px;
}

button{
width:100%;
margin-top:20px;
padding:15px;
border:none;
background:#2563eb;
color:#fff;
font-size:16px;
border-radius:10px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#1d4ed8;
}

#status{
margin-top:15px;
text-align:center;
font-weight:bold;
}
</style>

</head>
<body>

<div class="container">

<h2>Form Bukti Packing</h2>

<form id="uploadForm">

<label>Nama Produk</label>
<input
type="text"
name="produk"
placeholder="Masukkan nama produk"
required>

<label>Marketplace</label>
<select name="marketplace" required>
<option value="">Pilih Marketplace</option>
<option>Shopee</option>
<option>Lazada</option>
<option>Tokopedia</option>
<option>TikTok Shop</option>
</select>

<label>Upload Bukti</label>

<input
type="file"
id="files"
name="files"
multiple
accept=".jpg,.jpeg,.png,.webp,.pdf">

<div class="note">
<b>Wajib melampirkan:</b><br><br>

📸 Foto sebelum packing<br>
🧾 Foto resi<br>
📦 Foto sesudah packing<br><br>

Maksimal 5 file.<br>
Format yang didukung:
JPG, PNG, JPEG, WEBP, PDF
</div>

<div id="fileList"></div>

<button type="submit">
Kirim Bukti Packing
</button>

</form>

<div id="status"></div>

</div>

<script>

const filesInput=document.getElementById("files");
const list=document.getElementById("fileList");

filesInput.addEventListener("change",()=>{

list.innerHTML="";

if(filesInput.files.length>5){

alert("Maksimal hanya 5 file.");

filesInput.value="";

return;

}

[...filesInput.files].forEach(file=>{

const div=document.createElement("div");

div.className="file-item";

div.innerHTML=file.name;

list.appendChild(div);

});

});

document.getElementById("uploadForm").addEventListener("submit",async(e)=>{

e.preventDefault();

const status=document.getElementById("status");

const form=new FormData();

form.append("produk",e.target.produk.value);

form.append("marketplace",e.target.marketplace.value);

for(const file of filesInput.files){

form.append("files",file);

}

status.innerHTML="Mengirim...";

try{

const res=await fetch("/api/upload",{

method:"POST",

body:form

});

if(res.ok){

status.innerHTML="✅ Berhasil dikirim.";

e.target.reset();

list.innerHTML="";

}else{

status.innerHTML="❌ Gagal mengirim.";

}

}catch(err){

status.innerHTML="❌ Tidak dapat terhubung ke server.";

}

});

</script>

</body>
</html>
