<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Upload Bukti Packing</title>

<style>
body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}

.container{
    max-width:500px;
    margin:auto;
    background:#fff;
    padding:20px;
    border-radius:12px;
    box-shadow:0 5px 20px rgba(0,0,0,.1);
}

h2{
    text-align:center;
    margin-bottom:20px;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input,select{
    width:100%;
    padding:12px;
    border-radius:8px;
    border:1px solid #ccc;
    margin-top:6px;
}

input[type=file]{
    padding:8px;
}

.info{
    background:#eef7ff;
    padding:12px;
    border-radius:8px;
    margin-top:10px;
    color:#004b87;
    font-size:14px;
}

button{
    width:100%;
    margin-top:20px;
    padding:14px;
    border:none;
    background:#2196F3;
    color:#fff;
    font-size:16px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    background:#1976D2;
}

#status{
    margin-top:15px;
    text-align:center;
}
</style>

</head>
<body>

<div class="container">

<h2>Upload Bukti Packing</h2>

<form id="packingForm">

<label>Nama Produk</label>
<input
type="text"
name="produk"
required>

<label>Marketplace</label>

<select name="marketplace" required>
<option value="">Pilih Marketplace</option>
<option>Shopee</option>
<option>Lazada</option>
<option>Tokopedia</option>
<option>TikTok Shop</option>
</select>

<label>Upload Bukti (Maksimal 5 File)</label>

<input
type="file"
name="files"
id="files"
multiple
accept="image/*"
required>

<div class="info">
<b>Wajib menyertakan:</b>
<ul>
<li>Foto sebelum packing</li>
<li>Foto resi</li>
<li>Foto sesudah packing</li>
</ul>

Maksimal 5 file.
</div>

<button type="submit">
Kirim
</button>

</form>

<div id="status"></div>

</div>

<script>

const form=document.getElementById("packingForm");

form.addEventListener("submit",async(e)=>{

e.preventDefault();

const input=document.getElementById("files");

if(input.files.length>5){

alert("Maksimal hanya 5 file.");

return;

}

const fd=new FormData(form);

for(const f of input.files){

fd.append("attachments",f);

}

document.getElementById("status").innerHTML="Mengirim...";

try{

const res=await fetch("/api/upload",{

method:"POST",
body:fd

});

const data=await res.json();

if(data.success){

document.getElementById("status").innerHTML="✅ Berhasil dikirim.";

form.reset();

}else{

document.getElementById("status").innerHTML="❌ Gagal.";

}

}catch{

document.getElementById("status").innerHTML="❌ Terjadi kesalahan.";

}

});

</script>

</body>
</html>
