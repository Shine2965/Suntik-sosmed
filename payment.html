<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pembayaran QRIS - Shine Shop</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
  <style>
    body {
      font-family: "Poppins", Arial, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: white;
      margin: 0;
      padding: 0;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: rgba(255, 255, 255, 0.08);
      padding: 25px 30px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
      animation: fadeIn 1s ease-in-out;
      max-width: 420px;
      backdrop-filter: blur(6px);
    }

    h2 {
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    canvas {
      margin: 20px 0;
      background: white;
      padding: 10px;
      border-radius: 12px;
    }

    .details {
      text-align: left;
      font-size: 14px;
      margin: 15px 0;
      line-height: 1.6;
    }

    input[type="file"] {
      margin-top: 10px;
      background: white;
      color: #333;
      padding: 8px;
      border-radius: 6px;
      width: 100%;
      max-width: 320px;
      border: none;
    }

    .btn-confirm {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 20px;
      border-radius: 30px;
      background: linear-gradient(45deg, #00c6ff, #0072ff);
      color: white;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s ease;
      cursor: pointer;
      border: none;
      width: 100%;
    }

    .btn-confirm:hover {
      transform: scale(1.05);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Popup umum */
    .popup {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    .popup-content {
      background: #161b22;
      padding: 25px 30px;
      border-radius: 14px;
      max-width: 400px;
      color: #fff;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
      animation: pop 0.4s ease;
    }

    @keyframes pop {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* Spinner di tengah popup */
    .spinner {
      width: 60px;
      height: 60px;
      border: 6px solid rgba(255, 255, 255, 0.2);
      border-top: 6px solid #00c6ff;
      border-radius: 50%;
      margin: 0 auto 15px auto;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .info-text {
      margin-top: 10px;
      font-size: 13px;
      color: #cfcfcf;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Pembayaran QRIS</h2>
    <p>Silakan scan QR di bawah untuk membayar</p>
    <canvas id="qrisCanvas"></canvas>
    <div class="details" id="orderDetails"></div>

    <input type="file" id="buktiInput" accept="image/*" />
    <button class="btn-confirm" id="confirmBtn">Konfirmasi Pembayaran</button>
  </div>

  <!-- Popup Loading -->
  <div class="popup" id="popupLoading">
    <div class="popup-content">
      <div class="spinner"></div>
      <h3>Mengirimkan data ke Admin...</h3>
      <p class="info-text">Mohon tunggu beberapa saat.</p>
    </div>
  </div>

  <!-- Popup Sukses -->
  <div class="popup" id="popupSuccess">
    <div class="popup-content" id="popupSuccessContent"></div>
  </div>

  <script>
    // === KONFIGURASI BOT TELEGRAM ===
    const botToken = "7430992455:AAEbBWWfV9peNcN5m8mfAImCkbT2CowFnbg"; // Ganti dengan token bot kamu
    const chatId = "6845141887"; // Ganti dengan chat ID admin

    // === FUNGSI CRC ===
    function crc16ccitt(str) {
      let crc = 0xffff;
      for (let i = 0; i < str.length; i++) {
        crc ^= str.charCodeAt(i) << 8;
        for (let j = 0; j < 8; j++) {
          crc =
            crc & 0x8000
              ? ((crc << 1) ^ 0x1021) & 0xffff
              : (crc << 1) & 0xffff;
        }
      }
      return crc.toString(16).toUpperCase().padStart(4, "0");
    }

    function buildEmvPayloadWith54(amount, baseBefore54) {
      const amtInt = parseInt(amount, 10);
      const amtStr = String(amtInt);
      const len = String(amtStr.length).padStart(2, "0");
      const tag54 = "54" + len + amtStr;
      const payloadForCrc = baseBefore54 + tag54 + "6304";
      const crc = crc16ccitt(payloadForCrc);
      return payloadForCrc + crc;
    }

    // === PARAMETER PESANAN ===
    const urlParams = new URLSearchParams(window.location.search);
    const kategori = urlParams.get("kategori") || "-";
    const layanan = urlParams.get("layanan") || "-";
    const idLayanan = urlParams.get("id") || "-";
    const jumlah = urlParams.get("jumlah") || "-";
    const target = urlParams.get("target") || "-";
    const total = urlParams.get("total") || "0";
    const idTransaksi = "TX" + Date.now();
    const tanggalJam = new Date().toLocaleString("id-ID");

    // === QR PAYLOAD ===
    const baseTemplate =
      "00020101021226670016COM.NOBUBANK.WWW01189360050300000879140214526036770909650303UMI51440014ID.CO.QRIS.WWW0215ID20243611417480303UMI5204541153033605802ID5920SHINE SHOP OK19967206008SURABAYA61056011162070703A01";
    const payload = buildEmvPayloadWith54(total, baseTemplate);
    QRCode.toCanvas(document.getElementById("qrisCanvas"), payload, { width: 240 });

    // === TAMPILKAN DETAIL ===
    const detailHTML = `
      <strong>ID Transaksi:</strong> ${idTransaksi}<br>
      <strong>ID Layanan:</strong> ${idLayanan}<br>
      <strong>Tanggal:</strong> ${tanggalJam}<br>
      <strong>Kategori:</strong> ${kategori}<br>
      <strong>Layanan:</strong> ${layanan}<br>
      <strong>Jumlah:</strong> ${jumlah}<br>
      <strong>Target/Link:</strong> ${target}<br>
      <strong>Total:</strong> Rp ${Number(total).toLocaleString("id-ID")}
    `;
    document.getElementById("orderDetails").innerHTML = detailHTML;

    // === EVENT KONFIRMASI ===
    document.getElementById("confirmBtn").addEventListener("click", async () => {
      const file = document.getElementById("buktiInput").files[0];
      if (!file) {
        alert("Silakan upload bukti transfer terlebih dahulu!");
        return;
      }

      // Tampilkan popup loading
      document.getElementById("popupLoading").style.display = "flex";

      const pesan = `
💳 *KONFIRMASI PEMBAYARAN BARU*
━━━━━━━━━━━━━━━━━━━━━━━
🧾 *ID Transaksi:* ${idTransaksi}
🆔 *ID Layanan:* ${idLayanan}
📅 *Tanggal:* ${tanggalJam}

📂 *Kategori:* ${kategori}
⚙️ *Layanan:* ${layanan}
🔢 *Jumlah:* ${jumlah}
🎯 *Target:* ${target}
💰 *Total:* Rp ${Number(total).toLocaleString("id-ID")}
━━━━━━━━━━━━━━━━━━━━━━━
📸 *Bukti transfer dikirim berikut.*
      `;

      try {
        const formData = new FormData();
        formData.append("chat_id", chatId);
        formData.append("caption", pesan);
        formData.append("photo", file);
        formData.append("parse_mode", "Markdown");

        const res = await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, {
          method: "POST",
          body: formData,
        });

        document.getElementById("popupLoading").style.display = "none";

        if (res.ok) {
          const popupSuccess = document.getElementById("popupSuccess");
          const popupSuccessContent = document.getElementById("popupSuccessContent");

          popupSuccessContent.innerHTML = `
            <h3>✅ Pembayaran Berhasil Dikirim!</h3>
            <div style="text-align:left;margin-top:10px;">${detailHTML}</div>
            <p class="info-text" style="margin-top:15px;">Transaksi akan diproses admin paling lama 24 jam.</p>
          `;
          popupSuccess.style.display = "flex";

          setTimeout(() => (window.location.href = "dashboardsmm.html"), 5000);
        } else {
          alert("Gagal mengirim data ke Admin. Coba lagi.");
        }
      } catch (err) {
        document.getElementById("popupLoading").style.display = "none";
        alert("Terjadi kesalahan saat mengirim data ke Admin.");
      }
    });
  </script>
</body>
</html>
