<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pembayaran QRIS - Shine Shop</title>
<script src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
<style>
  body { font-family: Arial, sans-serif; background: #eef2ff; padding: 20px; }
  .container { max-width: 500px; margin: auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.1);}
  h1 { text-align: center; color: #4f46e5; }
  .summary { margin-top: 15px; padding: 15px; background: #f9fafb; border-radius: 10px; }
  .summary p { margin: 6px 0; }
  #qris { text-align: center; margin: 20px 0; }
  button { margin-top: 15px; padding: 12px; background: linear-gradient(90deg,#4f46e5,#6366f1); color: white; border: none; cursor: pointer; border-radius: 10px; width: 100%; font-size: 18px; font-weight: 600; }
  button:hover { box-shadow: 0 5px 15px rgba(79,70,229,0.4); }
</style>
</head>
<body>
<div class="container">
  <h1>Pembayaran QRIS</h1>
  <div class="summary">
    <p>ID Transaksi: <span id="txId"></span></p>
    <p>Layanan: <span id="serviceName"></span></p>
    <p>Jumlah: <span id="qty"></span></p>
    <p>Total: Rp <span id="total"></span></p>
    <p>Username/Link: <span id="username"></span></p>
  </div>

  <div id="qris"></div>

  <a id="waLink" href="" target="_blank">
    <button>Konfirmasi Pembayaran via WhatsApp</button>
  </a>
</div>

<script>
  const qrCode = new QRCodeStyling({ width: 260, height: 260, type: "svg" });
  document.getElementById("qris").appendChild(qrCode.getElement());

  const urlParams = new URLSearchParams(window.location.search);
  const serviceName = urlParams.get("serviceName");
  const price = parseInt(urlParams.get("price"));
  const qty = parseInt(urlParams.get("qty"));
  const username = urlParams.get("username");
  const txId = urlParams.get("txId");
  const total = price * qty;

  document.getElementById("serviceName").innerText = serviceName;
  document.getElementById("qty").innerText = qty;
  document.getElementById("username").innerText = username;
  document.getElementById("txId").innerText = txId;
  document.getElementById("total").innerText = total.toLocaleString('id-ID');

  function generateCRC16(payload) {
    const table = [0x0000,0x1021,0x2042,0x3063,0x4084,0x50A5,0x60C6,0x70E7,
                   0x8108,0x9129,0xA14A,0xB16B,0xC18C,0xD1AD,0xE1CE,0xF1EF];
    let crc = 0xFFFF;
    for(let i=0; i<payload.length; i++){
      let c = payload.charCodeAt(i);
      let tbl_idx = ((crc >> 12) ^ (c >> 4)) & 0xF;
      crc = (crc << 4) ^ table[tbl_idx];
      tbl_idx = ((crc >> 12) ^ (c & 0xF)) & 0xF;
      crc = (crc << 4) ^ table[tbl_idx];
      crc &= 0xFFFF;
    }
    return crc.toString(16).toUpperCase().padStart(4, '0');
  }

  // QRIS EMV dengan nominal (Tag 54)
  let payload = `00020101021226670016COM.NOBUBANK.WWW01189360050300000879140214526036770909650303UMI51440014ID.CO.QRIS.WWW0215ID20243611417480303UMI5204541153033605802ID5920SHINE SHOP OK19967206008SURABAYA61056011162070703A0154${('000000'+total).slice(-12)}63`;
  const crc = generateCRC16(payload);
  payload += crc;

  qrCode.update({ data: payload });

  const waMessage = `Halo Admin, saya sudah melakukan pemesanan:\n\nID: ${txId}\nLayanan: ${serviceName}\nJumlah: ${qty}\nTotal: Rp${total.toLocaleString('id-ID')}\nUsername/Link: ${username}\n\nMohon segera diproses.`;
  document.getElementById("waLink").href = `https://wa.me/6289518103883?text=${encodeURIComponent(waMessage)}`;
</script>
</body>
</html>
