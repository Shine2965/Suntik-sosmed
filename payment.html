<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pembayaran QRIS - Shine Shop</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #1c1c1c);
      background-size: 400% 400%;
      animation: gradientBG 12s ease infinite;
      color: #fff;
      text-align: center;
      padding: 20px;
    }
    @keyframes gradientBG {
      0% {background-position:0% 50%;}
      50% {background-position:100% 50%;}
      100% {background-position:0% 50%;}
    }
    .card {
      max-width: 500px;
      margin: auto;
      background: rgba(0,0,0,0.7);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }
    #qrisCanvas {
      margin: 20px auto;
      display: block;
      background: #fff;
      padding: 10px;
      border-radius: 8px;
    }
    button {
      background: linear-gradient(90deg, #4CAF50, #45a049);
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 15px;
    }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Pembayaran QRIS</h2>
    <p><b>ID Transaksi:</b> <span id="trx"></span></p>
    <p><b>ID Layanan:</b> <span id="id"></span></p>
    <p><b>Kategori:</b> <span id="kategori"></span></p>
    <p><b>Layanan:</b> <span id="layanan"></span></p>
    <p><b>Jumlah:</b> <span id="jumlah"></span></p>
    <p><b>Target/Link:</b> <span id="target"></span></p>
    <p><b>Total:</b> Rp<span id="total"></span></p>

    <canvas id="qrisCanvas"></canvas>
    <p>Silakan scan QRIS ini untuk melakukan pembayaran</p>

    <button onclick="konfirmasiWA()">Konfirmasi Pembayaran via WhatsApp</button>
  </div>

  <script>
    function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }

    // Ambil data dari query string
    const trx = getQueryParam("trx");
    const id = getQueryParam("id");
    const kategori = getQueryParam("kategori");
    const layanan = getQueryParam("layanan");
    const jumlah = getQueryParam("jumlah");
    const target = getQueryParam("target");
    const total = getQueryParam("total");

    document.getElementById("trx").textContent = trx;
    document.getElementById("id").textContent = id;
    document.getElementById("kategori").textContent = kategori;
    document.getElementById("layanan").textContent = layanan;
    document.getElementById("jumlah").textContent = jumlah;
    document.getElementById("target").textContent = target;
    document.getElementById("total").textContent = total;

    // Buat QRIS EMV Tag 54 (amount)
    function generateEMV(amount) {
      return `00020101021226670016COM.NOBUBANK.WWW01189360050300000879140214526036770909650303UMI51440014ID.CO.QRIS.WWW0215ID20243611417480303UMI5204541153033605802ID5920SHINE SHOP OK19967206008SURABAYA61056011162070703A015402${amount}6304ABCD`;
    }

    const emv = generateEMV(total);

    // Generate QR Code
    QRCode.toCanvas(document.getElementById("qrisCanvas"), emv, { width: 250 }, function (error) {
      if (error) console.error(error);
    });

    // Tombol konfirmasi WA
    function konfirmasiWA() {
      const now = new Date();
      const tanggalJam = now.toLocaleString("id-ID");

      const pesan = 
`Halo admin saya sudah melakukan pembayaran

Id Transaksi : ${trx}
Id Layanan : ${id}
Tanggal & Jam : ${tanggalJam}
Kategori : ${kategori}
Layanan : ${layanan}
Jumlah : ${jumlah}
Target/Link : ${target}
Harga : Rp${total}

Mohon dicek dan segera diproses, terima kasih.`;

      const waURL = `https://wa.me/6289518103883?text=${encodeURIComponent(pesan)}`;
      window.open(waURL, "_blank");
    }
  </script>
</body>
</html>
