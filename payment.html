<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pembayaran QRIS - Shine Shop</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    body {
      font-family: "Poppins", Arial, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: white;
      margin: 0;
      padding: 0;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: rgba(255, 255, 255, 0.08);
      padding: 25px 30px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
      animation: fadeIn 1s ease-in-out;
      max-width: 420px;
      backdrop-filter: blur(6px);
    }

    h2 {
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    canvas {
      margin: 20px 0;
      background: white;
      padding: 10px;
      border-radius: 12px;
    }

    .details {
      text-align: left;
      font-size: 14px;
      margin: 15px 0;
      line-height: 1.6;
    }

    input[type="file"] {
      margin-top: 10px;
      background: white;
      color: #333;
      padding: 8px;
      border-radius: 6px;
      width: 100%;
      max-width: 320px;
      border: none;
    }

    .btn-confirm {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 20px;
      border-radius: 30px;
      background: linear-gradient(45deg, #00c6ff, #0072ff);
      color: white;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s ease;
      cursor: pointer;
      border: none;
    }

    .btn-confirm:hover {
      transform: scale(1.05);
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Pembayaran QRIS</h2>
    <p>Silakan scan QR di bawah untuk membayar</p>
    <canvas id="qrisCanvas"></canvas>
    <div class="details" id="orderDetails"></div>

    <input type="file" id="buktiInput" accept="image/*" />
    <button class="btn-confirm" id="confirmBtn">Konfirmasi Pembayaran</button>
  </div>

  <script>
    // === KONFIGURASI BOT TELEGRAM ===
    const botToken = "7430992455:AAEbBWWfV9peNcN5m8mfAImCkbT2CowFnbg"; // Ganti dengan token bot kamu
    const chatId = "6845141887"; // Ganti dengan chat ID admin kamu

    // Escape MarkdownV2 agar tidak error "Bad Request"
    function escapeMarkdownV2(text) {
      return text.replace(/[_*[\]()~`>#+\-=|{}.!]/g, "\\$&");
    }

    // === FUNGSI CRC ===
    function crc16ccitt(str) {
      let crc = 0xffff;
      for (let i = 0; i < str.length; i++) {
        crc ^= str.charCodeAt(i) << 8;
        for (let j = 0; j < 8; j++) {
          crc =
            crc & 0x8000
              ? ((crc << 1) ^ 0x1021) & 0xffff
              : (crc << 1) & 0xffff;
        }
      }
      return crc.toString(16).toUpperCase().padStart(4, "0");
    }

    function buildEmvPayloadWith54(amount, baseBefore54) {
      const amtInt = parseInt(amount, 10);
      const amtStr = String(amtInt);
      const len = String(amtStr.length).padStart(2, "0");
      const tag54 = "54" + len + amtStr;
      const payloadForCrc = baseBefore54 + tag54 + "6304";
      const crc = crc16ccitt(payloadForCrc);
      return payloadForCrc + crc;
    }

    // === PARAMETER PESANAN ===
    const urlParams = new URLSearchParams(window.location.search);
    const kategori = urlParams.get("kategori") || "-";
    const layanan = urlParams.get("layanan") || "-";
    const idLayanan = urlParams.get("id") || "-";
    const jumlah = urlParams.get("jumlah") || "-";
    const target = urlParams.get("target") || "-";
    const total = urlParams.get("total") || "0";
    const idTransaksi = "TX" + Date.now();
    const tanggalJam = new Date().toLocaleString("id-ID");

    // === GENERATE QR ===
    const baseTemplate =
      "00020101021226670016COM.NOBUBANK.WWW01189360050300000879140214526036770909650303UMI51440014ID.CO.QRIS.WWW0215ID20243611417480303UMI5204541153033605802ID5920SHINE SHOP OK19967206008SURABAYA61056011162070703A01";
    const payload = buildEmvPayloadWith54(total, baseTemplate);
    QRCode.toCanvas(document.getElementById("qrisCanvas"), payload, { width: 240 });

    // === TAMPILKAN DETAIL ===
    document.getElementById("orderDetails").innerHTML = `
      <strong>ID Transaksi:</strong> ${idTransaksi}<br>
      <strong>ID Layanan:</strong> ${idLayanan}<br>
      <strong>Tanggal:</strong> ${tanggalJam}<br>
      <strong>Kategori:</strong> ${kategori}<br>
      <strong>Layanan:</strong> ${layanan}<br>
      <strong>Jumlah:</strong> ${jumlah}<br>
      <strong>Target/Link:</strong> ${target}<br>
      <strong>Total:</strong> Rp ${Number(total).toLocaleString("id-ID")}
    `;

    // === KONFIRMASI PEMBAYARAN ===
    document.getElementById("confirmBtn").addEventListener("click", async () => {
      const file = document.getElementById("buktiInput").files[0];
      if (!file) {
        Swal.fire({
          icon: "warning",
          title: "Bukti Transfer Belum Dipilih!",
          text: "Silakan upload bukti transfer terlebih dahulu.",
          confirmButtonColor: "#3085d6",
        });
        return;
      }

      // Spinner pop up
      Swal.fire({
        title: "Mengirimkan data ke Admin...",
        html: `<div class="spinner-border" role="status"></div>`,
        allowOutsideClick: false,
        didOpen: () => Swal.showLoading(),
      });

      const caption = `
💳 *KONFIRMASI PEMBAYARAN BARU*\n
🧾 ID Transaksi: ${escapeMarkdownV2(idTransaksi)}\n
🆔 ID Layanan: ${escapeMarkdownV2(idLayanan)}\n
📅 Tanggal: ${escapeMarkdownV2(tanggalJam)}\n
📂 Kategori: ${escapeMarkdownV2(kategori)}\n
⚙️ Layanan: ${escapeMarkdownV2(layanan)}\n
🔢 Jumlah: ${escapeMarkdownV2(jumlah)}\n
🎯 Target: ${escapeMarkdownV2(target)}\n
💰 Total: Rp ${escapeMarkdownV2(Number(total).toLocaleString("id-ID"))}\n
📸 Bukti transfer terlampir di atas.
      `;

      const formData = new FormData();
      formData.append("chat_id", chatId);
      formData.append("photo", file);
      formData.append("caption", caption);
      formData.append("parse_mode", "MarkdownV2");

      try {
        const res = await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, {
          method: "POST",
          body: formData,
        });

        if (!res.ok) throw new Error("Gagal kirim ke Telegram");

        // Pop up sukses animasi
        await Swal.fire({
          icon: "success",
          title: "Data Berhasil Dikirim!",
          showConfirmButton: false,
          timer: 1500,
        });

        // Pop up detail transaksi
        await Swal.fire({
          icon: "info",
          title: "Detail Transaksi",
          html: `
            <div style='text-align:left'>
              <b>ID Transaksi:</b> ${idTransaksi}<br>
              <b>ID Layanan:</b> ${idLayanan}<br>
              <b>Kategori:</b> ${kategori}<br>
              <b>Layanan:</b> ${layanan}<br>
              <b>Jumlah:</b> ${jumlah}<br>
              <b>Total:</b> Rp ${Number(total).toLocaleString("id-ID")}<br>
              <b>Target:</b> ${target}<br><br>
              <i>Transaksi akan diproses admin paling lama 24 jam.</i>
            </div>`,
          confirmButtonText: "OK",
        });

        window.location.href = "dashboardsmm.html";
      } catch (err) {
        Swal.fire({
          icon: "error",
          title: "Gagal Mengirim Data ke Admin!",
          text: "Periksa koneksi internet atau token bot Telegram kamu.",
        });
      }
    });
  </script>
</body>
</html>
