<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Page</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
    }

    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;

        background-image: url("/home/logo.png");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
    }

    .overlay {
        position: absolute;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.55);
        backdrop-filter: blur(4px);
    }

    .card {
        position: relative;
        z-index: 2;
        width: 330px;
        padding: 30px;
        border-radius: 18px;

        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255,255,255,0.3);
        backdrop-filter: blur(12px);

        box-shadow: 0 0 20px rgba(0, 255, 200, 0.4);
        text-align: center;
    }

    h2 {
        margin-bottom: 20px;
        color: #ffffff;
        font-weight: 600;
        font-size: 26px;
        letter-spacing: 1px;
    }

    input {
        width: 100%;
        padding: 12px;
        margin: 8px 0;
        border-radius: 10px;
        border: none;
        outline: none;
        font-size: 15px;
        background: linear-gradient(135deg, #ffffffc0, #d9d9d9c0);
    }

    button {
        width: 100%;
        padding: 12px;
        margin-top: 12px;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        color: white;
        cursor: pointer;
        transition: .2s;
    }

    .btn-login {
        background: linear-gradient(135deg, #10b981, #06b6d4);
    }
    .btn-login:hover {
        transform: scale(1.03);
        box-shadow: 0 0 12px rgba(16,185,129,0.7);
    }

    .btn-daftar {
        background: linear-gradient(135deg, #f43f5e, #fb923c);
        margin-top: 10px;
    }
    .btn-daftar:hover {
        transform: scale(1.03);
        box-shadow: 0 0 12px rgba(251,146,60,0.7);
    }

    #msg {
        margin-top: 10px;
        color: #ff6b6b;
        font-size: 14px;
        font-weight: 500;
    }
</style>
</head>

<body>

<!-- 🔊 Musik autoplay -->
<audio id="bgmusic" autoplay loop muted>
    <source src="/mp3/once again.mp3" type="audio/mpeg">
</audio>

<script>
setTimeout(() => {
    const audio = document.getElementById("bgmusic");
    audio.muted = false;
    audio.volume = 1.0;
}, 1000);
</script>

<div class="overlay"></div>

<div class="card">
    <h2>Welcome Back</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">

    <button class="btn-login" onclick="login()">Masuk</button>
    <button class="btn-daftar" onclick="window.location.href='https://t.me/shineshopstore1'">
        Daftar
    </button>

    <p id="msg"></p>
</div>

<script>
let accounts = {};

// ===============================
// Ambil akun.json
// ===============================
fetch("akun.json")
    .then(res => res.json())
    .then(data => {
        accounts = data;
    })
    .catch(err => console.error("akun.json error:", err));


// ===============================
// Proses Login (Tanpa Session)
// ===============================
function login() {
    const user = document.getElementById("username").value;
    const pass = document.getElementById("password").value;
    const msg = document.getElementById("msg");

    if (!accounts[user] || accounts[user].password !== pass) {
        msg.textContent = "Username atau password salah!";
        return;
    }

    window.location.href = "/bugwa/";
}
</script>

</body>
</html>
