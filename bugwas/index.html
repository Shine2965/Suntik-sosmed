<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Modern</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
    }

    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;

        background-image: url("/home/logo.png");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
    }

    .overlay {
        position: absolute;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.55);
        backdrop-filter: blur(4px);
    }

    .card {
        position: relative;
        z-index: 2;
        width: 330px;
        padding: 30px;
        border-radius: 18px;

        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255,255,255,0.3);
        backdrop-filter: blur(12px);

        box-shadow: 0 0 20px rgba(0, 255, 200, 0.4);
        text-align: center;
    }

    h2 {
        margin-bottom: 20px;
        color: #ffffff;
        font-weight: 600;
        font-size: 26px;
        letter-spacing: 1px;
    }

    input {
        width: 100%;
        padding: 12px;
        margin: 8px 0;
        border-radius: 10px;
        border: none;
        outline: none;
        font-size: 15px;
        background: linear-gradient(135deg, #ffffffc0, #d9d9d9c0);
    }

    button {
        width: 100%;
        padding: 12px;
        margin-top: 12px;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        color: white;
        cursor: pointer;
        transition: .2s;
    }

    .btn-login {
        background: linear-gradient(135deg, #10b981, #06b6d4);
    }
    .btn-login:hover {
        transform: scale(1.03);
        box-shadow: 0 0 12px rgba(16,185,129,0.7);
    }

    .btn-daftar {
        background: linear-gradient(135deg, #f43f5e, #fb923c);
        margin-top: 10px;
    }
    .btn-daftar:hover {
        transform: scale(1.03);
        box-shadow: 0 0 12px rgba(251,146,60,0.7);
    }

    #msg {
        margin-top: 10px;
        color: #ff6b6b;
        font-size: 14px;
        font-weight: 500;
    }
</style>
</head>

<body>

<div class="overlay"></div>

<div class="card">
    <h2>Welcome Back</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">

    <button class="btn-login" onclick="login()">Masuk</button>
    <button class="btn-daftar" onclick="window.location.href='https://t.me/shineshopstore1'">
        Daftar
    </button>

    <p id="msg"></p>
</div>

<script>
let accounts = {};

// ===============================
// 🔥 Fungsi buat generate expired
// ===============================
function generateExpire(duration) {
    if (duration === "permanent") return "permanent";

    const now = new Date();
    now.setDate(now.getDate() + duration);

    return now.toISOString().slice(0, 19).replace("T", " ");
}

// ===============================
// 🔥 Ambil akun.json
// ===============================
fetch("akun.json")
    .then(res => res.json())
    .then(data => {
        accounts = data;

        // Tambahkan expired_date otomatis
        for (const user in accounts) {
            accounts[user].expired_date = generateExpire(accounts[user].duration);
        }
    })
    .catch(err => console.error("akun.json error:", err));


// ===============================
// 🔥 Cek login otomatis
// ===============================
function checkLogin() {
    const perm = localStorage.getItem("sessionPermanent");
    const cookie = document.cookie.includes("sessionExpiry=true");

    if (perm || cookie) {
        window.location.href = "/bugwa/";
    }
}
checkLogin();


// ===============================
// 🔥 Proses Login
// ===============================
function login() {
    const user = document.getElementById("username").value;
    const pass = document.getElementById("password").value;
    const msg = document.getElementById("msg");

    if (!accounts[user] || accounts[user].password !== pass) {
        msg.textContent = "Username atau password salah!";
        return;
    }

    const duration = accounts[user].duration;
    const expired = accounts[user].expired_date;

    console.log("Expired Date:", expired);

    // Simpan expired ke localStorage
    localStorage.setItem("expireTime", expired);

    if (duration === "permanent") {
        localStorage.setItem("sessionPermanent", "true");
    } else {
        const d = new Date(expired);
        document.cookie = `sessionExpiry=true; expires=${d.toUTCString()}; path=/`;
    }

    window.location.href = "/bugwa/";
}
</script>

</body>
</html>
