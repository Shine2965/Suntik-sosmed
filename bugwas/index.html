<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Login BugWA — Shine Shop</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Musik autoplay + loop -->
<audio id="bgmusic" autoplay loop muted>
  <source src="/mp3/once again.mp3" type="audio/mpeg">
</audio>

<script>
  // Autoplay fix (Chrome/Android muted autoplay policy)
  setTimeout(() => {
    try {
      const a = document.getElementById('bgmusic');
      if (a) {
        a.muted = false;
        a.volume = 1.0;
      }
    } catch (e) {}
  }, 700);

  // Unmute after first user interaction
  document.addEventListener('click', function once() {
    try {
      const a = document.getElementById('bgmusic');
      if (a && a.paused) {
        a.play().catch(() => {});
      }
    } catch (e) {}
    document.removeEventListener('click', once);
  }, { once: true });
</script>

<div class="overlay"></div>

<div class="card">
  <h2>Welcome Bug WA By Shine Shop</h2>

  <input id="username" placeholder="Username">
  <input id="password" type="password" placeholder="Password">

  <div id="msg"></div>

  <button class="btn-login" onclick="doLogin()">Masuk</button>

  <button class="btn-daftar" onclick="window.location.href='https://t.me/shineshopstore1'">
    Daftar
  </button>
</div>

<!-- Medium encrypted script -->
<script src="/bugwa/script.js"></script>

<script>
  // Load akun JSON
  loadAccounts();
</script>

</body>
</html>
