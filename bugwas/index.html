<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Login Page</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Background musik (autoplay + loop) -->
<audio id="bgmusic" autoplay loop muted>
  <source src="/mp3/once again.mp3" type="audio/mpeg">
</audio>

<script>
  // Unmute trick: some browsers block audible autoplay — unmute after short delay (or after first user interaction)
  setTimeout(() => {
    try {
      const a = document.getElementById("bgmusic");
      if (a) { a.muted = false; a.volume = 1.0; }
    } catch(e) {}
  }, 800);
  // Also allow user click to ensure playback on strict browsers
  document.addEventListener("click", function once() {
    try { const a = document.getElementById("bgmusic"); if(a && a.paused) a.play().catch(()=>{}); }catch(e){}
    document.removeEventListener("click", once);
  }, { once: true });
</script>

<div class="overlay"></div>

<div class="card">
  <h2>Welcome Back</h2>

  <input type="text" id="username" placeholder="Username" autocomplete="off">
  <input type="password" id="password" placeholder="Password" autocomplete="off">

  <button class="btn-login" onclick="login()">Masuk</button>
  <button class="btn-daftar" onclick="window.location.href='https://t.me/shineshopstore1'">Daftar</button>

  <p id="msg"></p>
</div>

<!-- Obfuscated script (medium) -->
<script src="script.js"></script>
</body>
</html>
