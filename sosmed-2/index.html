<!DOCTYPE html>  
<html lang="id">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>Shine Shop - SMM</title>  
  <style>
/* ===============================  
   ROOT THEME  
=================================*/  
:root {  
  --bg: #090d16;  
  --glass: rgba(255, 255, 255, 0.03);  
  --glass-strong: rgba(255, 255, 255, 0.07);  
  --border: rgba(255, 255, 255, 0.08);  
  --accent1: #8b5cf6;  
  --accent2: #06b6d4;  
  --text: #f1f5f9;  
  --text-muted: #94a3b8;
  --danger: #f87171;
  --discount-bg: #f59e0b;
  --discount-text: #090d16;
}  
  
/* ===============================  
   BASE  
=================================*/  
* {  
  box-sizing: border-box;  
  font-family: 'Poppins', sans-serif;  
  transition: all 0.3s ease;
}  
  
body {  
  margin: 0;  
  color: var(--text);  
  background: linear-gradient(-45deg, #0f172a, #1e293b, #0f172a, #0b1524);  
  background-size: 400% 400%;  
  animation: gradientBG 15s ease infinite;  
  min-height: 100vh;
}  
  
@keyframes gradientBG {  
  0% { background-position: 0% 50%; }  
  50% { background-position: 100% 50%; }  
  100% { background-position: 0% 50%; }  
}  
  
/* ===============================  
   HEADER  
=================================*/  
.header {  
  display: flex;  
  align-items: center;  
  padding: 16px 24px;  
  backdrop-filter: blur(16px);  
  -webkit-backdrop-filter: blur(16px);
  background: rgba(15, 23, 42, 0.5);  
  border-bottom: 1px solid var(--border);  
  position: sticky;
  top: 0;
  z-index: 80;
}  
  
.brand {  
  display: flex;  
  align-items: center;  
  gap: 14px;  
}  
  
.logo {  
  width: 44px;  
  height: 44px;  
  border-radius: 12px;  
  overflow: hidden;  
  background: rgba(255, 255, 255, 0.05);  
  border: 1px solid var(--border);  
  box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);  
  display: flex;  
  align-items: center;  
  justify-content: center;  
}  
  
.logo img {  
  width: 100%;  
  height: 100%;  
  object-fit: cover;  
}  
  
h1 {  
  font-size: 18px;  
  margin: 0;  
  font-weight: 600;  
  letter-spacing: 0.5px;
}  
  
/* ===============================  
   HAMBURGER  
=================================*/  
.hamburger-btn {  
  margin-left: auto;  
  background: var(--glass);  
  border: 1px solid var(--border);  
  padding: 10px 12px;  
  border-radius: 10px;  
  cursor: pointer;  
  display: flex;
  flex-direction: column;
  gap: 4px;
}  

.hamburger-btn:hover {
  background: var(--glass-strong);
  border-color: rgba(255, 255, 255, 0.2);
}
  
.hamburger-icon span {  
  display: block;  
  height: 2px;  
  width: 22px;  
  background: white;  
  border-radius: 6px;  
}  
  
.hamburger-btn.active span:nth-child(1) {  
  transform: rotate(45deg) translateY(6px);  
}  
.hamburger-btn.active span:nth-child(2) {  
  opacity: 0;  
}  
.hamburger-btn.active span:nth-child(3) {  
  transform: rotate(-45deg) translateY(-6px);  
}  
  
/* ===============================  
   OFFCANVAS  
=================================*/  
.offcanvas {  
  position: fixed;  
  top: 0;  
  left: -280px;  
  width: 260px;  
  height: 100%;  
  background: #090d16;  
  padding: 30px 20px;  
  z-index: 100;  
  border-right: 1px solid var(--border);  
  box-shadow: 10px 0 30px rgba(0,0,0,0.5);
}  
  
.offcanvas.open {  
  left: 0;  
}  
  
.menu-list {  
  list-style: none;  
  padding: 0;  
  margin-top: 20px;
}  
  
.menu-list li {  
  margin-bottom: 12px;  
}  
  
.menu-list a {  
  display: block;  
  padding: 14px;  
  background: var(--glass);  
  border-radius: 12px;  
  color: var(--text-muted);  
  text-decoration: none;  
  border: 1px solid var(--border);  
  font-weight: 500;
  font-size: 14px;
}  
  
.menu-list a:hover {  
  background: rgba(139, 92, 246, 0.1);  
  color: white;
  border-color: var(--accent1);
  transform: translateX(6px);  
}  
  
/* ===============================  
   OVERLAY  
=================================*/  
.overlay {  
  position: fixed;  
  inset: 0;  
  background: rgba(0, 0, 0, 0.5);  
  backdrop-filter: blur(4px);
  opacity: 0;  
  pointer-events: none;  
  z-index: 90;  
}  
.overlay.show {  
  opacity: 1;  
  pointer-events: auto;  
}  
  
/* ===============================  
   CONTAINER  
=================================*/  
.container {  
  max-width: 720px;  
  margin: 40px auto;  
  padding: 40px;  
  border-radius: 24px;  
  background: rgba(30, 41, 59, 0.4);  
  backdrop-filter: blur(20px);  
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border);  
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);  
}  
  
h2 {  
  text-align: center;  
  margin-top: 0;
  margin-bottom: 30px;  
  font-weight: 700;  
  font-size: 26px;
  letter-spacing: -0.5px;
  background: linear-gradient(90deg, var(--accent1), var(--accent2));  
  -webkit-background-clip: text;  
  -webkit-text-fill-color: transparent;  
}  
  
/* ===============================  
   FORM  
=================================*/  
label {  
  display: block;  
  margin-top: 20px;  
  font-size: 13px;  
  font-weight: 500;  
  color: var(--text-muted);
  letter-spacing: 0.5px;
  text-transform: uppercase;
}  
  
input, select {  
  width: 100%;  
  padding: 14px 16px;  
  margin-top: 8px;  
  border-radius: 12px;  
  border: 1px solid var(--border);  
  background: rgba(15, 23, 42, 0.6);  
  color: white;  
  font-size: 14px;  
}  
  
input:focus, select:focus {  
  outline: none;  
  border-color: var(--accent2);  
  box-shadow: 0 0 20px rgba(6, 182, 212, 0.25);  
  background: rgba(15, 23, 42, 0.8);
}  
  
.desc, .aver {  
  margin-top: 12px;  
  padding: 16px;  
  background: var(--glass);  
  border-radius: 12px;  
  border: 1px dashed rgba(255, 255, 255, 0.12);  
  font-size: 13px;  
  color: var(--text-muted);
  line-height: 1.5;
}  

.discount-badge {
  display: inline-block;
  background: var(--discount-bg);
  color: var(--discount-text);
  padding: 2px 12px;
  border-radius: 20px;
  font-weight: 700;
  font-size: 12px;
  margin-left: 8px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.price-strike {
  text-decoration: line-through;
  color: var(--text-muted);
  font-size: 13px;
  margin-right: 8px;
}

.price-discount {
  color: var(--discount-bg);
  font-weight: 700;
  font-size: 15px;
}

button {  
  width: 100%;  
  padding: 16px;  
  margin-top: 30px;  
  border-radius: 12px;  
  border: none;  
  font-weight: 600;  
  font-size: 15px;  
  cursor: pointer;  
  background: linear-gradient(90deg, var(--accent1), var(--accent2));  
  color: white;  
  box-shadow: 0 8px 20px rgba(124, 58, 237, 0.3);  
}  
  
button:hover {  
  transform: translateY(-2px);  
  box-shadow: 0 12px 25px rgba(6, 182, 212, 0.5);  
}  

p {  
  color: var(--danger);  
  font-size: 13px;  
  line-height: 1.6;  
  margin-top: 10px;
  margin-bottom: 20px;  
}
</style>
</head>  
<body>  
<audio id="bgm" autoplay loop muted>  
  <source src="https://raw.githubusercontent.com/IkyyExecutive-v2/IkyySukaNgewe/main/uploads/1773720595309_2430_1773720593858_file_3108.mp3" type="audio/mpeg">  
</audio>  
  
<!-- HEADER -->  
<header class="header">  
  <div class="brand">  
    <div class="logo">  
      <img src="/home/logo.png" alt="Shine Shop Logo">  
    </div>  
    <h1>Shine Shop</h1>  
  </div>  
  
  <button class="hamburger-btn" id="menuToggle">  
    <div class="hamburger-icon">  
      <span></span>  
      <span></span>  
      <span></span>  
    </div>  
  </button>  
</header>  
  
<div id="menuOverlay" class="overlay"></div>  
  
<nav id="siteMenu" class="offcanvas">  
  <header style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">  
    <strong style="font-size:18px">Menu Utama</strong>  
    <button class="close" id="menuClose" style="font-size:22px;background:none;border:0;color:white;cursor:pointer">✕</button>  
  </header>  
  
  <ul class="menu-list">  
    <li><a href="/index.html/">🏠 Home</a>/</li>
	<li><a href="/sosmed-1/">⚜️ Suntik Sosmed 1</a></li>  
     </ul>  
</nav>  
  
<script>  
const toggleBtn=document.getElementById("menuToggle");  
const closeBtn=document.getElementById("menuClose");  
const offcanvas=document.getElementById("siteMenu");  
const overlay=document.getElementById("menuOverlay");  
  
function openMenu(){  
  offcanvas.classList.add("open");  
  overlay.classList.add("show");  
  toggleBtn.classList.add("active");  
}  
function closeMenu(){  
  offcanvas.classList.remove("open");  
  overlay.classList.remove("show");  
  toggleBtn.classList.remove("active");  
}  
  
toggleBtn.onclick=()=> offcanvas.classList.contains("open")?closeMenu():openMenu();  
closeBtn.onclick=closeMenu;  
overlay.onclick=closeMenu;  
</script>  
  
<!-- FORM -->  
<div class="container">  
  
<h2>Suntik Sosmed 2 - Shine Shop</h2>  
  
<label>Cari Layanan:</label>  
<input type="text" id="search" placeholder="Contoh: Instagram / 14444" onkeyup="searchLayanan()">  
  
<label for="kategori">Kategori:</label>  
<select id="kategori" onchange="loadLayanan()">  
  <option value="">-- Pilih Kategori --</option>  
</select>  
  
<label for="layanan">Layanan:</label>  
<select id="layanan" onchange="showInfo()">  
  <option value="">-- Pilih Layanan --</option>  
</select>  
  
<div class="desc" id="infoLayanan"></div>  
  
<label>Jumlah Pesanan:</label>  
<input type="number" id="jumlah" min="1" oninput="hitungTotal()">  
  
<label>Target / Link:</label>  
<input type="text" id="target" placeholder="Masukkan username atau link">  
  
<label>Total Harga (Rp):</label>  
<input type="text" id="total" readonly>  
  
<button onclick="lanjutPembayaran()">Lanjut ke Pembayaran</button>  
  
</div>  
  
<script>  
	const audio = document.getElementById("bgm");  
  
// setelah audio mulai, unmute otomatis  
audio.addEventListener("canplay", () => {  
  audio.muted = false;  
  audio.volume = 1.0; // atur volume (0.0 - 1.0)  
});  
  
// fallback jika browser nahan autoplay  
setTimeout(() => {  
  audio.muted = false;  
  audio.play().catch(()=>{});  
}, 1000);  
	  
// DATA LAYANAN
let layananData = {};
let selectedService = null;

async function loadData() {
  try {
    const res = await fetch("/sosmed-2/list.json?ts=" + Date.now());

    if (!res.ok) {
      throw new Error("Gagal memuat list.json");
    }

    layananData = await res.json();

    const kategori = document.getElementById("kategori");
    kategori.innerHTML = '<option value="">-- Pilih Kategori --</option>';

    for (const k in layananData) {
      const opt = document.createElement("option");
      opt.value = k;
      opt.textContent = k;
      kategori.appendChild(opt);
    }

  } catch (err) {
    console.error(err);
    alert("Data layanan gagal dimuat.");
  }
}

// Jalankan saat halaman selesai dimuat
window.addEventListener("load", loadData);
	
	function loadLayanan(){  
  const kategori=document.getElementById("kategori").value;  
  const layanan=document.getElementById("layanan");  
  layanan.innerHTML="<option value=''>-- Pilih Layanan --</option>";  
  
  if(kategori && layananData[kategori]){  
    layananData[kategori].forEach(l=>{  
      let opt=document.createElement("option");  
      opt.value=l.id;  
      // Tampilkan nama + diskon jika ada
      let label = l.name + " (ID: "+l.id+")";
      if(l.diskon && l.diskon < l.pricePerFollower) {
        label += " 🔥 DISKON";
      }
      opt.textContent = label;
      layanan.appendChild(opt);  
    });  
  }  
  document.getElementById("infoLayanan").innerHTML="";  
  selectedService=null;  
}  
  
function showInfo(){  
  const kategori=document.getElementById("kategori").value;  
  const layananID=document.getElementById("layanan").value;  
  
  selectedService=layananData[kategori].find(l=>l.id==layananID);  
  if(!selectedService) return;
  
  let priceDisplay = '';
  let diskonDisplay = '';
  
  // Cek diskon
  if(selectedService.diskon && selectedService.diskon < selectedService.pricePerFollower) {
    priceDisplay = `<span class="price-strike">Rp${selectedService.pricePerFollower}</span> <span class="price-discount">Rp${selectedService.diskon}</span> <span class="discount-badge">Diskon</span>`;
    diskonDisplay = `<br>Harga Diskon: Rp${selectedService.diskon}/unit (hemat Rp${selectedService.pricePerFollower - selectedService.diskon})`;
  } else {
    priceDisplay = `Rp${selectedService.pricePerFollower}/unit`;
  }
  
  document.getElementById("infoLayanan").innerHTML=  
  `<b>${selectedService.name}</b><br>  
   ID Produk: ${selectedService.id}<br>  
   Harga: ${priceDisplay}<br>  
   ${diskonDisplay}
   Min: ${selectedService.min} | Max: ${selectedService.max}<br>  
   ${selectedService.desc || ''}`;  
}  
  
function hitungTotal(){  
  if(!selectedService) return;  
  const jumlah=parseInt(document.getElementById("jumlah").value||"0");  
  if(jumlah < selectedService.min || jumlah > selectedService.max){  
    document.getElementById("total").value="Jumlah tidak valid!";  
    return;  
  }
  
  // Pake harga diskon jika ada, kalo ga ada pake harga normal
  const hargaAktif = (selectedService.diskon && selectedService.diskon < selectedService.pricePerFollower) 
    ? selectedService.diskon 
    : selectedService.pricePerFollower;
  
  document.getElementById("total").value=jumlah * hargaAktif;  
}  
  
function generateTransactionID(){  
  return `TRX${Date.now()}${Math.floor(Math.random()*1000)}`;  
}  
  
function searchLayanan(){  
  const q=document.getElementById("search").value.toLowerCase();  
  const kategori=document.getElementById("kategori");  
  const layanan=document.getElementById("layanan");  
  
  for(let k in layananData){  
    for(let l of layananData[k]){  
      if(l.name.toLowerCase().includes(q) || String(l.id).includes(q)){  
        kategori.value=k;  
        loadLayanan();  
        layanan.value=l.id;  
        showInfo();  
        return;  
      }  
    }  
  }  
}  
  
function lanjutPembayaran(){  
  if(!selectedService){alert("Pilih layanan terlebih dahulu!");return;}  
  
  const jumlah=parseInt(document.getElementById("jumlah").value||"0");  
  if(jumlah < selectedService.min || jumlah > selectedService.max){  
    alert(`Jumlah harus antara ${selectedService.min} dan ${selectedService.max}`);  
    return;  
  }  
  
  const trxID=generateTransactionID();  
  const kategori=document.getElementById("kategori").value;  
  const target=document.getElementById("target").value;  
  
  // Pake harga diskon jika ada
  const hargaAktif = (selectedService.diskon && selectedService.diskon < selectedService.pricePerFollower) 
    ? selectedService.diskon 
    : selectedService.pricePerFollower;
  
  const total=jumlah * hargaAktif;  
  
  window.location.href=`payment/?trx=${trxID}&kategori=${kategori}&layanan=${selectedService.name}&id=${selectedService.id}&jumlah=${jumlah}&total=${total}&target=${encodeURIComponent(target)}&diskon=${diskon}`;  
}  
   
document.addEventListener("keydown", function(e){
  // F12
  if(e.key === "F12") e.preventDefault();

  // Ctrl + Shift + I/C/J
  if(e.ctrlKey && e.shiftKey &&
    ["I","C","J"].includes(e.key)) e.preventDefault();

  // Ctrl + U
  if(e.ctrlKey && e.key === "u") e.preventDefault();
});
setInterval(() => {
  const threshold = 160;
  if (window.devtoolsOpen) return;

  const widthThreshold = window.outerWidth - window.innerWidth > threshold;

  if (widthThreshold && !/Android|iPhone|iPad/i.test(navigator.userAgent)) {
    document.body.innerHTML =
      "<h1 style='color:gold;text-align:center;margin-top:40vh;'>🚫 Developer Tools Terdeteksi</h1>";
  }
}, 2000);
  
</script>  
  
</body>  
	</html>
