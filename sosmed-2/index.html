<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shine Shop - SMM</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg1:#0f172a;
  --bg2:#0b1120;
  --glass:rgba(255,255,255,0.05);
  --border:rgba(255,255,255,0.15);
  --accent1:#7c3aed;
  --accent2:#06b6d4;
  --accent3:#9333ea;
  --text:#f8fafc;
}

*{
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
  transition:all .25s ease;
}

body{
  margin:0;
  color:var(--text);
  background:
  radial-gradient(circle at 20% 20%, rgba(124,58,237,.25), transparent 40%),
  radial-gradient(circle at 80% 70%, rgba(6,182,212,.25), transparent 40%),
  linear-gradient(135deg,var(--bg1),var(--bg2));
  min-height:100vh;
}

/* HEADER */
.header{
  display:flex;
  align-items:center;
  padding:18px 24px;
  background:rgba(15,23,42,0.75);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}

.brand{display:flex;gap:14px;align-items:center}

.logo{
  width:48px;height:48px;
  border-radius:14px;
  display:grid;place-items:center;
  font-weight:700;
  background:linear-gradient(135deg,var(--accent1),var(--accent2));
  box-shadow:0 0 20px rgba(124,58,237,.6);
}

h1{margin:0;font-size:20px;font-weight:600}

.hamburger-btn{
  margin-left:auto;
  padding:12px;
  border-radius:14px;
  background:var(--glass);
  border:1px solid var(--border);
  cursor:pointer;
}

.hamburger-icon{width:26px;height:18px;position:relative}
.hamburger-icon span{
  height:3px;width:100%;
  background:white;border-radius:6px;
  position:absolute;left:0;
}
.hamburger-icon span:nth-child(1){top:0}
.hamburger-icon span:nth-child(2){top:7px}
.hamburger-icon span:nth-child(3){top:14px}

.hamburger-btn.active span:nth-child(1){transform:rotate(45deg);top:7px}
.hamburger-btn.active span:nth-child(2){opacity:0}
.hamburger-btn.active span:nth-child(3){transform:rotate(-45deg);top:7px}

/* CONTAINER */
.container{
  max-width:820px;
  margin:60px auto;
  padding:35px;
  background:rgba(15,23,42,0.75);
  backdrop-filter:blur(20px);
  border-radius:24px;
  border:1px solid var(--border);
  box-shadow:
  0 0 40px rgba(124,58,237,.25),
  0 20px 60px rgba(0,0,0,.6);
}

h2{
  text-align:center;
  margin-bottom:30px;
  font-size:24px;
  background:linear-gradient(90deg,var(--accent1),var(--accent2));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

label{
  font-weight:500;
  margin:12px 0 6px;
  display:block;
  font-size:14px;
}

input,select{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:1px solid var(--border);
  background:var(--glass);
  color:white;
  font-size:15px;
}

input:focus,select:focus{
  outline:none;
  border-color:var(--accent2);
  box-shadow:0 0 15px rgba(6,182,212,.6);
}

.desc{
  margin-top:15px;
  padding:18px;
  border-radius:16px;
  background:rgba(124,58,237,.08);
  border:1px solid rgba(124,58,237,.4);
  font-size:14px;
  line-height:1.6;
}

button{
  margin-top:25px;
  padding:16px;
  width:100%;
  border-radius:16px;
  border:none;
  font-weight:600;
  font-size:16px;
  color:white;
  cursor:pointer;
  background:linear-gradient(90deg,var(--accent1),var(--accent2),var(--accent3));
  background-size:200% 200%;
  animation:gradientMove 4s ease infinite;
  box-shadow:0 10px 30px rgba(124,58,237,.5);
}

@keyframes gradientMove{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

#total{
  font-weight:600;
  font-size:16px;
  letter-spacing:1px;
}
</style>
</head>

<body>

<div class="container">
<h2>Form Pemesanan Sosmed - 2</h2>

<label>Kategori:</label>
<select id="kategori" onchange="loadLayanan()">
<option value="">-- Pilih Kategori --</option>
</select>

<label>Layanan:</label>
<select id="layanan" onchange="showInfo()">
<option value="">-- Pilih Layanan --</option>
</select>

<div class="desc" id="infoLayanan"></div>

<label>Jumlah Pesanan:</label>
<input type="number" id="jumlah" min="1" oninput="hitungTotal()">

<label>Target / Link:</label>
<input type="text" id="target">

<label>Total Harga (Rp):</label>
<input type="text" id="total" readonly>

<button onclick="lanjutPembayaran()">Lanjut ke Pembayaran</button>
</div>

<script>
const layananData={
"Sosmed-2 Facebook-followers":[
{ id:"5954", name:"Facebook Follower", pricePerFollower:8, min:50, max:5000000, desc:"Garansi 30 hari (free refill)" }
],
"Sosmed-2 WhatsApp-followers":[
{ id:"5519", name:"Whatsapp Channel Member", pricePerFollower:35, min:10, max:50000, desc:"No refill / Global user" }
]
};

let selectedService=null;

window.onload=function(){
const kategori=document.getElementById("kategori");
for(let k in layananData){
let opt=document.createElement("option");
opt.value=k;
opt.textContent=k;
kategori.appendChild(opt);
}
};

function formatRupiah(angka){
return new Intl.NumberFormat("id-ID",{
style:"currency",
currency:"IDR",
minimumFractionDigits:0
}).format(angka);
}

function loadLayanan(){
const kategori=document.getElementById("kategori").value;
const layanan=document.getElementById("layanan");
layanan.innerHTML="<option value=''>-- Pilih Layanan --</option>";
if(kategori){
layananData[kategori].forEach(l=>{
let opt=document.createElement("option");
opt.value=l.id;
opt.textContent=l.name+" (ID: "+l.id+")";
layanan.appendChild(opt);
});
}
document.getElementById("infoLayanan").innerHTML="";
selectedService=null;
}

function showInfo(){
const kategori=document.getElementById("kategori").value;
const layananID=document.getElementById("layanan").value;
selectedService=layananData[kategori].find(l=>l.id==layananID);

document.getElementById("infoLayanan").innerHTML=
`<b>${selectedService.name}</b><br>
Harga: ${formatRupiah(selectedService.pricePerFollower)} / unit<br>
Min: ${selectedService.min} | Max: ${selectedService.max}<br>
${selectedService.desc}`;
}

function hitungTotal(){
if(!selectedService)return;
const jumlah=parseInt(document.getElementById("jumlah").value||"0");
if(jumlah < selectedService.min || jumlah > selectedService.max){
document.getElementById("total").value="Jumlah tidak valid!";
return;
}
const total=jumlah*selectedService.pricePerFollower;
document.getElementById("total").value=formatRupiah(total);
}

function lanjutPembayaran(){
if(!selectedService){alert("Pilih layanan terlebih dahulu!");return;}
const jumlah=parseInt(document.getElementById("jumlah").value||"0");
if(jumlah < selectedService.min || jumlah > selectedService.max){
alert("Jumlah tidak valid!");
return;
}
const total=jumlah*selectedService.pricePerFollower;
alert("Total pembayaran: "+formatRupiah(total));
}
</script>

</body>
</html>
