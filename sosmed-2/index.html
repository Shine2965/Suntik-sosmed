<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shine Shop - SMM</title>

<style>
/* ===============================
   ROOT THEME
=================================*/
:root{
  --bg:#0f172a;
  --glass:rgba(255,255,255,0.05);
  --glass-strong:rgba(255,255,255,0.08);
  --border:rgba(255,255,255,0.15);
  --accent1:#7c3aed;
  --accent2:#06b6d4;
  --text:#f8fafc;
}

/* ===============================
   BASE
=================================*/
*{
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  margin:0;
  color:var(--text);
  background:linear-gradient(-45deg,#0f172a,#1e293b,#111827,#0f2027);
  background-size:400% 400%;
  animation:gradientBG 15s ease infinite;
}

@keyframes gradientBG{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

/* ===============================
   HEADER
=================================*/
.header{
  display:flex;
  align-items:center;
  padding:18px 22px;
  backdrop-filter:blur(12px);
  background:rgba(0,0,0,0.3);
  border-bottom:1px solid var(--border);
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
}

.logo{
  width:50px;
  height:50px;
  border-radius:14px;
  overflow:hidden;
  background:rgba(255,255,255,0.05);
  border:1px solid var(--border);
  box-shadow:0 0 20px rgba(124,58,237,0.6);
  display:flex;
  align-items:center;
  justify-content:center;
}

.logo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

h1{
  font-size:18px;
  margin:0;
  font-weight:600;
}

/* ===============================
   HAMBURGER
=================================*/
.hamburger-btn{
  margin-left:auto;
  background:var(--glass);
  border:1px solid var(--border);
  padding:10px 14px;
  border-radius:12px;
  cursor:pointer;
}

.hamburger-icon span{
  display:block;
  height:3px;
  width:24px;
  background:white;
  margin:4px 0;
  border-radius:6px;
  transition:.3s;
}

.hamburger-btn.active span:nth-child(1){
  transform:rotate(45deg) translateY(7px);
}
.hamburger-btn.active span:nth-child(2){
  opacity:0;
}
.hamburger-btn.active span:nth-child(3){
  transform:rotate(-45deg) translateY(-7px);
}

/* ===============================
   OFFCANVAS
=================================*/
.offcanvas{
  position:fixed;
  top:0;
  left:-280px;
  width:260px;
  height:100%;
  background:#0b1120;
  padding:25px;
  transition:.4s;
  z-index:100;
  border-right:2px solid var(--accent1);
}

.offcanvas.open{
  left:0;
}

.menu-list{
  list-style:none;
  padding:0;
}

.menu-list li{
  margin-bottom:10px;
}

.menu-list a{
  display:block;
  padding:12px;
  background:var(--glass);
  border-radius:10px;
  color:white;
  text-decoration:none;
  border:1px solid var(--border);
}

.menu-list a:hover{
  background:var(--glass-strong);
  transform:translateX(6px);
}

/* ===============================
   OVERLAY
=================================*/
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  opacity:0;
  pointer-events:none;
  transition:.3s;
  z-index:90;
}
.overlay.show{
  opacity:1;
  pointer-events:auto;
}

/* ===============================
   CONTAINER
=================================*/
.container{
  max-width:820px;
  margin:60px auto;
  padding:35px;
  border-radius:25px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(15px);
  border:1px solid var(--border);
  box-shadow:0 0 40px rgba(0,0,0,0.6);
}

h2{
  text-align:center;
  margin-bottom:25px;
  font-weight:600;
  background:linear-gradient(90deg,var(--accent1),var(--accent2));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* ===============================
   FORM
=================================*/
label{
  display:block;
  margin-top:15px;
  font-size:14px;
  font-weight:500;
}

input,select{
  width:100%;
  padding:13px;
  margin-top:5px;
  border-radius:12px;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.07);
  color:white;
  font-size:14px;
}

input:focus,select:focus{
  outline:none;
  border-color:var(--accent2);
  box-shadow:0 0 15px rgba(6,182,212,0.6);
}

.desc{
  margin-top:10px;
  padding:15px;
  background:var(--glass);
  border-radius:12px;
  border:1px dashed var(--border);
  font-size:13px;
}

button{
  width:100%;
  padding:14px;
  margin-top:25px;
  border-radius:14px;
  border:none;
  font-weight:600;
  font-size:15px;
  cursor:pointer;
  background:linear-gradient(90deg,var(--accent1),var(--accent2));
  color:white;
  box-shadow:0 0 20px rgba(124,58,237,0.6);
  transition:.3s;
}

button:hover{
  transform:translateY(-3px);
  box-shadow:0 0 30px rgba(6,182,212,0.9);
}
</style>
</head>

<audio id="bgm" autoplay loop muted>
  <source src="https://o.uguu.se/QmEYASRO.mp3" type="audio/mpeg">
</audio>

<!-- HEADER -->
<!-- HEADER -->
<header class="header">
  <div class="brand">
    <div class="logo">
      <img src="/home/logo.png" alt="Shine Shop Logo">
    </div>
    <h1>Shine Shop</h1>
  </div>

  <button class="hamburger-btn" id="menuToggle">
    <div class="hamburger-icon">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </button>
</header>
	
<div id="menuOverlay" class="overlay"></div>

<nav id="siteMenu" class="offcanvas">
  <header style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
    <strong style="font-size:18px">Menu Utama</strong>
    <button class="close" id="menuClose" style="font-size:22px;background:none;border:0;color:white;cursor:pointer">✕</button>
  </header>

  <ul class="menu-list">
    <li><a href="/home/">🏠 Home</a></li> 
    <li><a href="/telegram/">💠 Gift/Stars Telegram</a></li>
	<li><a href="/ewallet/">💳 DOMPET DIGITAL</a></li>
     </ul>
</nav>

<script>
const toggleBtn=document.getElementById("menuToggle");
const closeBtn=document.getElementById("menuClose");
const offcanvas=document.getElementById("siteMenu");
const overlay=document.getElementById("menuOverlay");

function openMenu(){
  offcanvas.classList.add("open");
  overlay.classList.add("show");
  toggleBtn.classList.add("active");
}
function closeMenu(){
  offcanvas.classList.remove("open");
  overlay.classList.remove("show");
  toggleBtn.classList.remove("active");
}

toggleBtn.onclick=()=> offcanvas.classList.contains("open")?closeMenu():openMenu();
closeBtn.onclick=closeMenu;
overlay.onclick=closeMenu;
</script>

<!-- FORM -->
<div class="container">

<h2>Suntik Sosmed - Shine Shop</h2>

<label>Cari Layanan:</label>
<input type="text" id="search" placeholder="Contoh: Instagram / 14444" onkeyup="searchLayanan()">

<label for="kategori">Kategori:</label>
<select id="kategori" onchange="loadLayanan()">
  <option value="">-- Pilih Kategori --</option>
</select>

<label for="layanan">Layanan:</label>
<select id="layanan" onchange="showInfo()">
  <option value="">-- Pilih Layanan --</option>
</select>

<div class="desc" id="infoLayanan"></div>

<label>Jumlah Pesanan:</label>
<input type="number" id="jumlah" min="1" oninput="hitungTotal()">

<label>Target / Link:</label>
<input type="text" id="target" placeholder="Masukkan username atau link">

<label>Total Harga (Rp):</label>
<input type="text" id="total" readonly>

<button onclick="lanjutPembayaran()">Lanjut ke Pembayaran</button>

</div>

<script>
	const audio = document.getElementById("bgm");

// setelah audio mulai, unmute otomatis
audio.addEventListener("canplay", () => {
  audio.muted = false;
  audio.volume = 1.0; // atur volume (0.0 - 1.0)
});

// fallback jika browser nahan autoplay
setTimeout(() => {
  audio.muted = false;
  audio.play().catch(()=>{});
}, 1000);
	
// DATA LAYANAN
const layananData={
 //Layanan Promo  
      "Facebook Followers [All Type]": [  
		{ id: "1616", name: "Facebook Followers FP 4 [ Max 1M ] Hidden Data | Speed 20K/ Day | No Refill (Rp 2.100/K)", pricePerFollower: 2.1, min: 100, max: 1000000, desc:  "Masukkan username/link account facebook NO GARANSI" },  
        { id: "1606", name: "Facebook Followers FP 3 [ Max 1M ] Hidden Quality | Speed 50K/ Day | Refill 30 Days (Rp 4.500/K)", pricePerFollower: 4.5, min: 100, max: 1000000, desc:  "Masukkan username/link account facebook GARANSI 30 HARI" },  
		],
	"Telegram Channel Member": [  
		{ id: "357", name: "Telegram Channel Members FP 1 [ Max 100K ] (Rp 2.800/K)", pricePerFollower: 2.8, min: 100, max: 1000000, desc:  "Masukkan username telegram atau link CHANNEL WAJIB PUBLIC! NO GARANSI" },  
    	{ id: "1147", name: "Telegram Channel/Group Members FP 11 [ Max 150K ] Refill 30Days | 15k/days (Rp 8.600/K)", pricePerFollower: 8.6, min: 100, max: 1000000, desc:  "Masukkan username telegram atau link CHANNEL WAJIB PUBLIC! GARANSI 30 HARI" }
      ],
	 "Tiktok Followers (Emergency)": [  
		{ id: "1614", name: "TikTok Followers FP 58 [ Max 1M ] No Refill | Speed 5K/ Day | Slow (Rp 14.000/K)", pricePerFollower: 14, min: 100, max: 1000000, desc:  "NO GARANSI!" },
     { id: "1443", name: "TikTok Followers FP 25 | Max 100K | Speed 1K/ Day | Low Speed | No Refill (Rp 15.000/K)", pricePerFollower: 15, min: 100, max: 1000000, desc:  "- Low Speed - Speed 1K/ Day- No Refill" },
       { id: "1545", name: "TikTok Followers FP 44 [ Max 1M ] [ Real HQ ] 50K/ Day | Refill 30 Days (Rp 18.000/K)", pricePerFollower: 18, min: 100, max: 1000000, desc:  "Speed 50K/Day No Refill" }
      ],
   "Instagram Followers (Best Speed)": [  
		{ id: "1620", name: "Instagram Followers FP 15 [ Max 5M ] Mix Quality | Speed 50K/ Day | NR (Rp 7.600/K)", pricePerFollower: 7.6, min: 100, max: 1000000, desc:  "NO GARANSI!" },
     { id: "1572", name: "Instagram Followers FP 12 [ Max 1M ] Real | 40K/ Day | Refill 30 Days (Rp 29.000/K)", pricePerFollower: 29, min: 100, max: 1000000, desc:  "Free Refill 30D" },
       { id: "1492", name: "Instagram Followers FP 7 [ Max 100K ] [ Old Account ] [ Speed 5K - 20K/ Day ] [ Refill 30 Days ] (Rp 32.200/K)", pricePerFollower: 32.2, min: 100, max: 1000000, desc:  "Refill 30D" }
      ],
  "Tiktok Views": [  
		{ id: "1600", name: "Tiktok View FP 54 [ Max Unlimited ] Speed 500K/ Day | No Refill (Rp 30/K)", pricePerFollower: 0.030, min: 1000, max: 1000000, desc:  "NO GARANSI!" },
     { id: "1568", name: "TikTok View 48 [ Max Unlimited ] 5M/ Day | No Refill (Rp 200/K)", pricePerFollower: 0.2, min: 1000, max: 1000000, desc:  "No Garansi" }
      ],
  "Tiktok Like": [  
		{ id: "1600", name: "TikTok Likes FP 95 | Max 1M | Speed 50K/ Days | Refill 30 Days (Rp 800/K)", pricePerFollower: 0.8, min: 1000, max: 1000000, desc:  "GARANSI 30D, MIX QUALITY" }
      ]
	
};

let selectedService=null;

window.onload=function(){
  const kategori=document.getElementById("kategori");
  for(let k in layananData){
    let opt=document.createElement("option");
    opt.value=k; opt.textContent=k;
    kategori.appendChild(opt);
  }
}

function loadLayanan(){
  const kategori=document.getElementById("kategori").value;
  const layanan=document.getElementById("layanan");
  layanan.innerHTML="<option value=''>-- Pilih Layanan --</option>";

  if(kategori){
    layananData[kategori].forEach(l=>{
      let opt=document.createElement("option");
      opt.value=l.id;
      opt.textContent=l.name+" (ID: "+l.id+")";
      layanan.appendChild(opt);
    });
  }
  document.getElementById("infoLayanan").innerHTML="";
  selectedService=null;
}

function showInfo(){
  const kategori=document.getElementById("kategori").value;
  const layananID=document.getElementById("layanan").value;

  selectedService=layananData[kategori].find(l=>l.id==layananID);
  document.getElementById("infoLayanan").innerHTML=
  `<b>${selectedService.name}</b><br>
   ID Produk: ${selectedService.id}<br>
   Harga: Rp${selectedService.pricePerFollower}/unit<br>
   Min: ${selectedService.min} | Max: ${selectedService.max}<br>
   ${selectedService.desc}`;
}

function hitungTotal(){
  if(!selectedService)return;
  const jumlah=parseInt(document.getElementById("jumlah").value||"0");
  if(jumlah < selectedService.min || jumlah > selectedService.max){
    document.getElementById("total").value="Jumlah tidak valid!";
    return;
  }
  document.getElementById("total").value=jumlah * selectedService.pricePerFollower;
}

function generateTransactionID(){
  return `TRX${Date.now()}${Math.floor(Math.random()*1000)}`;
}

function searchLayanan(){
  const q=document.getElementById("search").value.toLowerCase();
  const kategori=document.getElementById("kategori");
  const layanan=document.getElementById("layanan");

  for(let k in layananData){
    for(let l of layananData[k]){
      if(l.name.toLowerCase().includes(q) || String(l.id).includes(q)){
        kategori.value=k;
        loadLayanan();
        layanan.value=l.id;
        showInfo();
        return;
      }
    }
  }
}

function lanjutPembayaran(){
  if(!selectedService){alert("Pilih layanan terlebih dahulu!");return;}

  const jumlah=parseInt(document.getElementById("jumlah").value||"0");
  if(jumlah < selectedService.min || jumlah > selectedService.max){
    alert(`Jumlah harus antara ${selectedService.min} dan ${selectedService.max}`);
    return;
  }

  const trxID=generateTransactionID();
  const kategori=document.getElementById("kategori").value;
  const target=document.getElementById("target").value;
  const total=jumlah * selectedService.pricePerFollower;

  window.location.href=`/payment/?trx=${trxID}&kategori=${kategori}&layanan=${selectedService.name}&id=${selectedService.id}&jumlah=${jumlah}&total=${total}&target=${encodeURIComponent(target)}`;
}
	

// MAINTENANCE REDIRECT
const isMaintenance=false;
if(isMaintenance){
  window.location.href="/sosmed-2/";
}
	
/* 🚫 ANTI INSPECT */
document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("keydown",function(e){
if(e.key==="F12") e.preventDefault();
if(e.ctrlKey&&e.shiftKey&&["I","C","J"].includes(e.key)) e.preventDefault();
if(e.ctrlKey&&e.key==="u") e.preventDefault();
});

setInterval(()=>{
if(window.outerWidth-window.innerWidth>160||window.outerHeight-window.innerHeight>160){
document.body.innerHTML="<h1 style='color:gold;text-align:center;margin-top:40vh;'>🚫 Developer Tools Terdeteksi</h1>";
}
},1000);

setInterval(()=>{console.clear();},1000);
setInterval(()=>{debugger;},3000);


</script>

</body>
</html>
