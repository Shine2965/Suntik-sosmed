<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Cek Status Pesanan - Shine Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body {
  font-family: 'Poppins', sans-serif;
  min-height: 100vh;
  padding: 20px;
  color: #fff;
  background: #0a0e1a;
  position: relative;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background:
    radial-gradient(circle at 20% 30%, rgba(0,198,255,0.12) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(0,114,255,0.10) 0%, transparent 50%),
    radial-gradient(circle at 50% 50%, rgba(168,85,247,0.06) 0%, transparent 60%);
  animation: bgFloat 20s ease-in-out infinite alternate;
  z-index: 0;
  pointer-events: none;
}
@keyframes bgFloat {
  0% { transform: translate(0,0) rotate(0deg); }
  33% { transform: translate(2%,-2%) rotate(2deg); }
  66% { transform: translate(-1%,3%) rotate(-1deg); }
  100% { transform: translate(1%,-1%) rotate(1deg); }
}
.orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(80px);
  pointer-events: none;
  z-index: 0;
  animation: orbPulse 6s ease-in-out infinite alternate;
}
.orb-1 { width: 400px; height: 400px; top: -100px; right: -100px; background: rgba(0,198,255,0.10); animation-delay: 0s; }
.orb-2 { width: 300px; height: 300px; bottom: -50px; left: -50px; background: rgba(168,85,247,0.08); animation-delay: 2s; }
.orb-3 { width: 200px; height: 200px; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(0,114,255,0.06); animation-delay: 4s; }
@keyframes orbPulse {
  0% { transform: scale(0.8); opacity: 0.6; }
  100% { transform: scale(1.2); opacity: 1; }
}
.container {
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
  border-radius: 28px;
  padding: 32px 28px;
  border: 1px solid rgba(255,255,255,0.06);
  box-shadow: 0 30px 80px rgba(0,0,0,0.5);
  position: relative;
  z-index: 1;
}
.container::before {
  content: '';
  position: absolute;
  top: 0;
  left: 20%;
  right: 20%;
  height: 2px;
  background: linear-gradient(90deg, transparent, #00c6ff, #0072ff, #8b5cf6, transparent);
  border-radius: 100%;
  filter: blur(2px);
  opacity: 0.5;
}
h1 {
  font-size: 24px;
  font-weight: 700;
  text-align: center;
  margin-bottom: 4px;
  background: linear-gradient(135deg, #f0f9ff 0%, #b6d4fe 40%, #a5b4fc 70%, #c4b5fd 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.subtitle {
  text-align: center;
  font-size: 13px;
  color: #94a3b8;
  margin-bottom: 20px;
}
.tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 18px;
  background: rgba(255,255,255,0.04);
  border-radius: 12px;
  padding: 4px;
  flex-wrap: wrap;
}
.tab-btn {
  flex: 1;
  min-width: 80px;
  padding: 10px 14px;
  border: none;
  border-radius: 10px;
  background: transparent;
  color: #94a3b8;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s ease;
  font-family: 'Poppins', sans-serif;
  text-align: center;
}
.tab-btn:hover {
  color: #e2e8f0;
}
.tab-btn.active {
  background: linear-gradient(135deg, #00c6ff, #0072ff);
  color: white;
  box-shadow: 0 4px 16px rgba(0,114,255,0.25);
}
.tab-content {
  display: none;
  animation: fadeSlide 0.3s ease both;
}
.tab-content.active {
  display: block;
}
@keyframes fadeSlide {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}
label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  color: #94a3b8;
  text-transform: uppercase;
  letter-spacing: 0.7px;
  margin-top: 14px;
}
input, textarea {
  width: 100%;
  padding: 12px 16px;
  margin-top: 5px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.05);
  color: #f1f5f9;
  font-size: 14px;
  transition: all 0.25s ease;
  outline: none;
  font-family: 'Poppins', sans-serif;
}
input:focus, textarea:focus {
  border-color: #00c6ff;
  background: rgba(255,255,255,0.08);
  box-shadow: 0 0 0 3px rgba(0,198,255,0.10);
}
input::placeholder, textarea::placeholder {
  color: #64748b;
}
textarea {
  resize: vertical;
  min-height: 80px;
}
.btn {
  width: 100%;
  margin-top: 16px;
  padding: 14px;
  border-radius: 999px;
  border: none;
  font-size: 14px;
  font-weight: 700;
  color: #fff;
  cursor: pointer;
  transition: all 0.25s ease;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-family: 'Poppins', sans-serif;
}
.btn-primary {
  background: linear-gradient(135deg, #00c6ff, #0072ff);
  box-shadow: 0 8px 24px rgba(0,114,255,0.25);
}
.btn-primary:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 12px 32px rgba(0,114,255,0.35);
}
.btn-primary:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none !important;
}
.btn-success {
  background: linear-gradient(135deg, #22c55e, #16a34a);
  box-shadow: 0 8px 24px rgba(34,197,94,0.25);
}
.btn-success:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 12px 32px rgba(34,197,94,0.35);
}
.btn-success:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none !important;
}
.btn-warning {
  background: linear-gradient(135deg, #f59e0b, #d97706);
  box-shadow: 0 8px 24px rgba(245,158,11,0.25);
}
.btn-warning:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 12px 32px rgba(245,158,11,0.35);
}
.btn-warning:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none !important;
}
.btn-danger {
  background: linear-gradient(135deg, #ef4444, #dc2626);
  box-shadow: 0 8px 24px rgba(239,68,68,0.25);
}
.btn-danger:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 12px 32px rgba(239,68,68,0.35);
}
.btn-danger:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none !important;
}
.btn-secondary {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.08);
  color: #e2e8f0;
}
.btn-secondary:hover:not(:disabled) {
  background: rgba(255,255,255,0.12);
}
.btn-secondary:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
.result-box {
  margin-top: 16px;
  padding: 16px;
  border-radius: 12px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.06);
  display: none;
  max-height: 400px;
  overflow-y: auto;
}
.result-box.show {
  display: block;
}
.result-box .status-badge {
  display: inline-block;
  padding: 4px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
}
.status-pending { background: rgba(251,191,36,0.15); color: #fbbf24; border: 1px solid rgba(251,191,36,0.2); }
.status-processing { background: rgba(6,182,212,0.15); color: #06b6d4; border: 1px solid rgba(6,182,212,0.2); }
.status-completed { background: rgba(34,197,94,0.15); color: #22c55e; border: 1px solid rgba(34,197,94,0.2); }
.status-partial { background: rgba(251,146,60,0.15); color: #fb923c; border: 1px solid rgba(251,146,60,0.2); }
.status-canceled { background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.2); }
.status-error { background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.2); }
.result-row {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  font-size: 13px;
}
.result-row .label {
  color: #94a3b8;
}
.result-row .value {
  color: #e2e8f0;
  font-weight: 500;
}
.result-title {
  font-weight: 600;
  color: #e2e8f0;
  margin-bottom: 8px;
  font-size: 14px;
}
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 14px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.08);
  color: #94a3b8;
  padding: 8px 18px;
  border-radius: 30px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  text-decoration: none;
  font-family: 'Poppins', sans-serif;
}
.back-btn:hover {
  background: rgba(255,255,255,0.12);
  color: #fff;
}
.hint {
  font-size: 11px;
  color: #64748b;
  margin-top: 4px;
}
.divider {
  height: 1px;
  background: rgba(255,255,255,0.06);
  margin: 14px 0;
}
.gmail-display {
  background: rgba(255,255,255,0.04);
  padding: 10px 16px;
  border-radius: 12px;
  margin-bottom: 16px;
  border: 1px solid rgba(0,198,255,0.12);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  font-size: 13px;
}
.gmail-display .label {
  color: #94a3b8;
  font-weight: 500;
}
.gmail-display .value {
  color: #00ffaa;
  font-weight: 600;
  word-break: break-all;
}
.gmail-display .value.not-set {
  color: #ff6666;
  font-style: italic;
  font-weight: 400;
}
@media (max-width: 480px) {
  .container { padding: 20px 16px; border-radius: 20px; }
  h1 { font-size: 20px; }
  .tabs .tab-btn { font-size: 10px; padding: 8px 10px; min-width: 60px; }
  .btn { font-size: 12px; padding: 12px; }
  input, textarea { font-size: 13px; padding: 10px 12px; }
}
</style>
</head>
<body>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<div class="container">
  <h1>📋 Manajemen Pesanan</h1>
  <div class="subtitle">Cek status, refill, atau cancel order Indosmm</div>

  <!-- GMAIL DISPLAY -->
  <div class="gmail-display">
    <span class="label">📧 Gmail:</span>
    <span class="value" id="gmailDisplay">Memuat...</span>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="status">📊 Status</button>
    <button class="tab-btn" data-tab="status-multiple">📊 Multiple</button>
    <button class="tab-btn" data-tab="refill">🔄 Refill</button>
    <button class="tab-btn" data-tab="refill-status">🔍 Refill Status</button>
    <button class="tab-btn" data-tab="cancel">❌ Cancel</button>
  </div>

  <!-- ===== TAB 1: STATUS SINGLE ===== -->
  <div class="tab-content active" id="tab-status">
    <label for="orderId">Order ID</label>
    <input type="text" id="orderId" placeholder="Masukkan Order ID (contoh: 23501)">
    <button class="btn btn-primary" id="btnStatus">✅ Cek Status</button>
    <div class="result-box" id="resultStatus"></div>
  </div>

  <!-- ===== TAB 2: STATUS MULTIPLE ===== -->
  <div class="tab-content" id="tab-status-multiple">
    <label for="orderIds">Order IDs (pisahkan dengan koma)</label>
    <textarea id="orderIds" placeholder="23501, 23502, 23503"></textarea>
    <div class="hint">📌 Maksimal 100 order ID</div>
    <button class="btn btn-primary" id="btnStatusMultiple">📊 Cek Status Multiple</button>
    <div class="result-box" id="resultStatusMultiple"></div>
  </div>

  <!-- ===== TAB 3: REFILL ===== -->
  <div class="tab-content" id="tab-refill">
    <label for="refillOrderId">Order ID</label>
    <input type="text" id="refillOrderId" placeholder="Masukkan Order ID untuk refill">
    <button class="btn btn-success" id="btnRefill">🔄 Refill Order</button>
    <div class="divider"></div>
    <label for="refillOrders">Multiple Refill (pisahkan dengan koma)</label>
    <textarea id="refillOrders" placeholder="23501, 23502, 23503"></textarea>
    <div class="hint">📌 Maksimal 100 order ID</div>
    <button class="btn btn-success" id="btnRefillMultiple">🔄 Refill Multiple</button>
    <div class="result-box" id="resultRefill"></div>
  </div>

  <!-- ===== TAB 4: REFILL STATUS ===== -->
  <div class="tab-content" id="tab-refill-status">
    <label for="refillStatusId">Refill ID</label>
    <input type="text" id="refillStatusId" placeholder="Masukkan Refill ID">
    <button class="btn btn-primary" id="btnRefillStatus">🔍 Cek Refill Status</button>
    <div class="divider"></div>
    <label for="refillStatusIds">Multiple Refill IDs (pisahkan dengan koma)</label>
    <textarea id="refillStatusIds" placeholder="1, 2, 3"></textarea>
    <div class="hint">📌 Maksimal 100 refill ID</div>
    <button class="btn btn-primary" id="btnRefillStatusMultiple">🔍 Cek Multiple Refill</button>
    <div class="result-box" id="resultRefillStatus"></div>
  </div>

  <!-- ===== TAB 5: CANCEL ===== -->
  <div class="tab-content" id="tab-cancel">
    <label for="cancelOrders">Order IDs (pisahkan dengan koma)</label>
    <textarea id="cancelOrders" placeholder="23501, 23502, 23503"></textarea>
    <div class="hint">⚠️ Cancel tidak bisa dibatalkan! Hati-hati.</div>
    <button class="btn btn-danger" id="btnCancel">❌ Cancel Orders</button>
    <div class="result-box" id="resultCancel"></div>
  </div>

  <a href="/sosmed-3/" class="back-btn">← Kembali</a>
</div>

<script>
// ============================================================
// 🔧 KONFIGURASI
// ============================================================
const INDOSMM_API_URL = 'https://indosmm.id/api/v2';

let INDO_API_KEY = '';

// ============================================================
// 🔥 GMAIL
// ============================================================
function getStoredGmail() {
  return localStorage.getItem('user_gmail') || null;
}

function validateEmail(email) {
  return email && email.includes('@') && email.includes('.') && email.length > 5;
}

function updateGmailDisplay() {
  const gmail = getStoredGmail();
  const el = document.getElementById('gmailDisplay');
  if (!el) return;
  if (gmail && validateEmail(gmail)) {
    el.textContent = gmail;
    el.className = 'value';
  } else {
    el.textContent = '⚠️ Belum diatur!';
    el.className = 'value not-set';
  }
}
updateGmailDisplay();

// ============================================================
// 🔥 AMBIL API KEY
// ============================================================
async function fetchApiKey() {
  try {
    const res = await fetch('/api/qris-config');
    if (res.ok) {
      const data = await res.json();
      if (data.indo_api_key) {
        INDO_API_KEY = data.indo_api_key;
        console.log('✅ Indo API Key loaded');
        return;
      }
    }
  } catch (e) {
    console.warn('⚠️ Gagal ambil API Key:', e);
  }
  INDO_API_KEY = 'a1174c530b97e1bc0a7eec7baff3ac6e';
  console.log('📌 Menggunakan default Indo API Key');
}

// ============================================================
// 🔥 TABS
// ============================================================
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    const target = document.getElementById('tab-' + this.dataset.tab);
    if (target) target.classList.add('active');
    // Sembunyikan semua result
    document.querySelectorAll('.result-box').forEach(r => r.classList.remove('show'));
  });
});

// ============================================================
// 🔥 UTILITY
// ============================================================
function showResult(el, html, isError = false) {
  el.innerHTML = html;
  el.className = 'result-box show';
  if (isError) {
    el.style.borderColor = 'rgba(239,68,68,0.3)';
  } else {
    el.style.borderColor = 'rgba(255,255,255,0.06)';
  }
}

function getStatusBadge(status) {
  const s = String(status || '').toLowerCase();
  if (s.includes('pending')) return '<span class="status-badge status-pending">⏳ Pending</span>';
  if (s.includes('processing') || s.includes('proses')) return '<span class="status-badge status-processing">🔄 Processing</span>';
  if (s.includes('complete') || s.includes('sukses') || s.includes('done')) return '<span class="status-badge status-completed">✅ Completed</span>';
  if (s.includes('partial')) return '<span class="status-badge status-partial">⚠️ Partial</span>';
  if (s.includes('cancel')) return '<span class="status-badge status-canceled">❌ Canceled</span>';
  if (s.includes('error')) return '<span class="status-badge status-error">❌ Error</span>';
  return `<span class="status-badge" style="background:rgba(255,255,255,0.08);color:#94a3b8;">${status}</span>`;
}

function formatNumber(n) {
  return Number(n || 0).toLocaleString('id-ID');
}

// ============================================================
// 🔥 API CALL
// ============================================================
async function callIndosmm(payload) {
  const response = await fetch(INDOSMM_API_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Accept': 'application/json'
    },
    body: JSON.stringify(payload)
  });
  if (!response.ok) {
    throw new Error('HTTP ' + response.status);
  }
  return await response.json();
}

// ============================================================
// 🔥 TAB 1: STATUS SINGLE
// ============================================================
document.getElementById('btnStatus').addEventListener('click', async function() {
  const orderId = document.getElementById('orderId').value.trim();
  if (!orderId) {
    Swal.fire('⚠️', 'Masukkan Order ID!', 'warning');
    return;
  }
  if (!INDO_API_KEY) await fetchApiKey();
  if (!INDO_API_KEY) {
    Swal.fire('❌', 'API Key tidak ditemukan!', 'error');
    return;
  }

  this.disabled = true;
  this.textContent = '⏳ Mengecek...';
  const el = document.getElementById('resultStatus');

  try {
    const result = await callIndosmm({
      key: INDO_API_KEY,
      action: 'status',
      order: orderId
    });

    let html = `<div class="result-title">📊 Status Order #${orderId}</div>`;
    if (result.status) {
      html += `
        <div class="result-row"><span class="label">Status</span><span class="value">${getStatusBadge(result.status)}</span></div>
        <div class="result-row"><span class="label">💰 Charge</span><span class="value">${result.charge || '-'}</span></div>
        <div class="result-row"><span class="label">📊 Start Count</span><span class="value">${formatNumber(result.start_count)}</span></div>
        <div class="result-row"><span class="label">📦 Remains</span><span class="value">${formatNumber(result.remains)}</span></div>
      `;
    } else {
      html += `<div style="color:#f87171;">❌ Gagal mendapatkan status: ${result.msg || 'Unknown error'}</div>`;
    }
    showResult(el, html);

  } catch (err) {
    showResult(el, `<div style="color:#f87171;">❌ Error: ${err.message}</div>`, true);
  } finally {
    this.disabled = false;
    this.textContent = '✅ Cek Status';
  }
});

// ============================================================
// 🔥 TAB 2: STATUS MULTIPLE
// ============================================================
document.getElementById('btnStatusMultiple').addEventListener('click', async function() {
  const raw = document.getElementById('orderIds').value.trim();
  if (!raw) {
    Swal.fire('⚠️', 'Masukkan Order IDs!', 'warning');
    return;
  }
  const ids = raw.split(',').map(s => s.trim()).filter(Boolean);
  if (ids.length === 0) {
    Swal.fire('⚠️', 'Format tidak valid!', 'warning');
    return;
  }
  if (ids.length > 100) {
    Swal.fire('⚠️', 'Maksimal 100 order ID!', 'warning');
    return;
  }
  if (!INDO_API_KEY) await fetchApiKey();
  if (!INDO_API_KEY) {
    Swal.fire('❌', 'API Key tidak ditemukan!', 'error');
    return;
  }

  this.disabled = true;
  this.textContent = '⏳ Mengecek...';
  const el = document.getElementById('resultStatusMultiple');

  try {
    const result = await callIndosmm({
      key: INDO_API_KEY,
      action: 'status',
      orders: ids.join(',')
    });

    let html = `<div class="result-title">📊 Status Multiple Orders (${ids.length})</div>`;
    
    if (Array.isArray(result)) {
      result.forEach((item, i) => {
        const orderId = item.order || ids[i] || '?';
        html += `
          <div style="background:rgba(255,255,255,0.03);border-radius:10px;padding:10px 12px;margin-bottom:8px;">
            <div style="font-weight:600;color:#e2e8f0;margin-bottom:4px;">🆔 Order #${orderId}</div>
            <div class="result-row"><span class="label">Status</span><span class="value">${getStatusBadge(item.status)}</span></div>
            ${item.charge ? `<div class="result-row"><span class="label">💰 Charge</span><span class="value">${item.charge}</span></div>` : ''}
            ${item.start_count ? `<div class="result-row"><span class="label">📊 Start Count</span><span class="value">${formatNumber(item.start_count)}</span></div>` : ''}
            ${item.remains ? `<div class="result-row"><span class="label">📦 Remains</span><span class="value">${formatNumber(item.remains)}</span></div>` : ''}

document.getElementById('btnCancel').addEventListener('click', async function() {

    Swal.fire('⚠️', 'Masukkan Order IDs!', 'warning');
    return;
  }
  const ids = raw.split(',').map(s => s.trim()).filter(Boolean);
  if (ids.length === 0 || ids.length > 100) {

    return;
  }
  if (!INDO_API_KEY) await fetchApiKey();
  if (!INDO_API_KEY) {
    Swal.fire('❌', 'API Key tidak ditemukan!', 'error');
    return;
  }

  const result = await Swal.fire({
    title: '⚠️ Konfirmasi Cancel',
    text: `Cancel ${ids.length} order? TINDAKAN INI TIDAK DAPAT DIBATALKAN!`,
    icon: 'error',
    showCancelButton: true,
    confirmButtonText: '⚠️ Ya, Cancel!',
    cancelButtonText: '❌ Batal',
    confirmButtonColor: '#ef4444',
    cancelButtonColor: '#666'
  });
  if (!result.isConfirmed) return;

  this.disabled = true;
  this.textContent = '⏳ Memproses...';
  const el = document.getElementById('resultCancel');

  try {
    const response = await callIndosmm({
      key: INDO_API_KEY,
      action: 'cancel',
      orders: ids.join(',')
    });

    let html = `<div class="result-title">❌ Cancel Orders (${ids.length})</div>`;
    
    if (Array.isArray(response)) {
      let successCount = 0;
      let failCount = 0;
      let details = '';
      response.forEach(item => {
        const orderId = item.order || '?';
        if (item.cancel === 1 || item.cancel === true) {
          successCount++;
          details += `<div style="color:#22c55e;font-size:13px;">✅ Order #${orderId} berhasil di-cancel</div>`;
        } else if (item.cancel && item.cancel.error) {
          failCount++;
          details += `<div style="color:#f87171;font-size:13px;">❌ Order #${orderId}: ${item.cancel.error}</div>`;
        } else {
          failCount++;
          details += `<div style="color:#f87171;font-size:13px;">❌ Order #${orderId}: Gagal cancel</div>`;
        }
      });
      html += `
        <div style="margin-bottom:8px;">✅ Berhasil: ${successCount} | ❌ Gagal: ${failCount}</div>
        ${details}
      `;
    } else {
      html += `<div style="color:#f87171;">❌ Response tidak valid</div>`;
    }
    showResult(el, html);

  } catch (err) {
    showResult(el, `<div style="color:#f87171;">❌ Error: ${err.message}</div>`, true);
  } finally {
    this.disabled = false;
    this.textContent = '❌ Cancel Orders';
  }
});
