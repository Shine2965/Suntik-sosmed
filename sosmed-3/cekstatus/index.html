<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Cek Status Pesanan - Shine Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
  min-height: 100vh;
  padding: 20px;
  color: #f1f5f9;
  background: #0b1220;
  position: relative;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 50% at 20% -10%, rgba(139, 92, 246, 0.18), transparent 50%),
    radial-gradient(ellipse 60% 40% at 90% 10%, rgba(6, 182, 212, 0.12), transparent 45%);
  pointer-events: none;
  z-index: 0;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: rgba(11, 18, 32, 0.88);
  border-bottom: 1px solid rgba(255,255,255,0.08);
  position: sticky;
  top: 0;
  z-index: 80;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  margin: -20px -20px 20px -20px;
  padding: 16px 20px;
}

.header .brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.header .brand .logo {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  overflow: hidden;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  display: flex;
  align-items: center;
  justify-content: center;
}

.header .brand .logo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.header .brand h1 {
  font-size: 17px;
  font-weight: 650;
  background: linear-gradient(135deg, #8b5cf6, #06b6d4);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.back-btn {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.08);
  color: #94a3b8;
  padding: 6px 16px;
  border-radius: 30px;
  font-size: 12px;
  cursor: pointer;
  transition: 0.3s;
  font-family: 'Poppins', sans-serif;
  text-decoration: none;
}

.back-btn:hover {
  background: rgba(255,255,255,0.12);
  color: #fff;
  border-color: rgba(139,92,246,0.3);
}

.container {
  max-width: 680px;
  margin: 0 auto;
  position: relative;
  z-index: 1;
}

.gmail-display {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  padding: 10px 16px;
  margin-bottom: 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  font-size: 13px;
}

.gmail-display .label {
  color: #94a3b8;
  font-weight: 400;
}

.gmail-display .value {
  color: #06b6d4;
  font-weight: 600;
  word-break: break-all;
}

.gmail-display .value.not-set {
  color: #f87171;
  font-style: italic;
  font-weight: 400;
}

.card {
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  border-radius: 16px;
  padding: 24px 20px;
  border: 1px solid rgba(255,255,255,0.06);
  margin-bottom: 16px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.35);
}

.card h2 {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 14px;
  background: linear-gradient(135deg, #8b5cf6, #06b6d4);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  display: flex;
  align-items: center;
  gap: 8px;
}

.card h2 .badge {
  font-size: 10px;
  font-weight: 600;
  background: rgba(139,92,246,0.15);
  color: #8b5cf6;
  padding: 2px 10px;
  border-radius: 20px;
  -webkit-text-fill-color: #8b5cf6;
}

label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  color: #94a3b8;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}

input, textarea {
  width: 100%;
  padding: 10px 14px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(11,18,32,0.65);
  color: #f1f5f9;
  font-size: 14px;
  font-family: 'Poppins', sans-serif;
  transition: border-color 0.25s, box-shadow 0.25s;
  outline: none;
}

input:focus, textarea:focus {
  border-color: #06b6d4;
  box-shadow: 0 0 0 3px rgba(6,182,212,0.14);
  background: rgba(11,18,32,0.9);
}

input::placeholder, textarea::placeholder {
  color: #64748b;
}

textarea {
  resize: vertical;
  min-height: 60px;
}

.btn {
  width: 100%;
  padding: 12px;
  margin-top: 12px;
  border-radius: 10px;
  border: none;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.25s ease;
  font-family: 'Poppins', sans-serif;
}

.btn-primary {
  background: linear-gradient(135deg, #8b5cf6, #06b6d4);
  color: white;
  box-shadow: 0 4px 16px rgba(124,58,237,0.25);
}

.btn-primary:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(6,182,212,0.3);
}

.btn-primary:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none !important;
}

.btn-success {
  background: linear-gradient(135deg, #22c55e, #16a34a);
  color: white;
  box-shadow: 0 4px 16px rgba(34,197,94,0.2);
}

.btn-success:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(34,197,94,0.3);
}

.btn-warning {
  background: linear-gradient(135deg, #f59e0b, #d97706);
  color: white;
  box-shadow: 0 4px 16px rgba(245,158,11,0.2);
}

.btn-warning:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(245,158,11,0.3);
}

.btn-danger {
  background: linear-gradient(135deg, #ef4444, #dc2626);
  color: white;
  box-shadow: 0 4px 16px rgba(239,68,68,0.2);
}

.btn-danger:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(239,68,68,0.3);
}

.btn-secondary {
  background: rgba(255,255,255,0.06);
  color: #94a3b8;
  border: 1px solid rgba(255,255,255,0.08);
}

.btn-secondary:hover:not(:disabled) {
  background: rgba(255,255,255,0.12);
  color: #fff;
}

.btn-sm {
  padding: 8px 16px;
  font-size: 12px;
  width: auto;
  margin-top: 0;
}

.result-box {
  margin-top: 14px;
  padding: 14px 16px;
  border-radius: 12px;
  background: rgba(11,18,32,0.6);
  border: 1px solid rgba(255,255,255,0.06);
  display: none;
  font-size: 13px;
  line-height: 1.7;
  overflow-x: auto;
}

.result-box.show {
  display: block;
  animation: fadeSlide 0.4s ease both;
}

@keyframes fadeSlide {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}

.result-box .status-badge {
  display: inline-block;
  padding: 2px 12px;
  border-radius: 20px;
  font-weight: 700;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}

.status-badge.success { background: rgba(34,197,94,0.15); color: #22c55e; border: 1px solid rgba(34,197,94,0.2); }
.status-badge.partial { background: rgba(245,158,11,0.15); color: #f59e0b; border: 1px solid rgba(245,158,11,0.2); }
.status-badge.processing { background: rgba(6,182,212,0.15); color: #06b6d4; border: 1px solid rgba(6,182,212,0.2); }
.status-badge.pending { background: rgba(251,191,36,0.15); color: #fbbf24; border: 1px solid rgba(251,191,36,0.2); }
.status-badge.cancel { background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.2); }
.status-badge.completed { background: rgba(34,197,94,0.15); color: #22c55e; border: 1px solid rgba(34,197,94,0.2); }

.result-box .row {
  display: flex;
  justify-content: space-between;
  padding: 4px 0;
  border-bottom: 1px solid rgba(255,255,255,0.03);
}

.result-box .row .label {
  color: #94a3b8;
  font-weight: 400;
}

.result-box .row .value {
  color: #f1f5f9;
  font-weight: 500;
  text-align: right;
}

.result-box .row .value .highlight {
  color: #facc15;
}

.tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 16px;
  background: rgba(11,18,32,0.5);
  border-radius: 12px;
  padding: 4px;
  border: 1px solid rgba(255,255,255,0.06);
  flex-wrap: wrap;
}

.tabs .tab {
  flex: 1;
  padding: 8px 12px;
  border-radius: 10px;
  border: none;
  background: transparent;
  color: #94a3b8;
  font-weight: 600;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.25s ease;
  font-family: 'Poppins', sans-serif;
  text-align: center;
  min-width: 80px;
}

.tabs .tab.active {
  background: linear-gradient(135deg, rgba(139,92,246,0.2), rgba(6,182,212,0.2));
  color: #f1f5f9;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}

.tabs .tab:hover:not(.active) {
  color: #f1f5f9;
  background: rgba(255,255,255,0.04);
}

.order-results {
  margin-top: 12px;
}

.order-item-result {
  background: rgba(11,18,32,0.4);
  border-radius: 10px;
  padding: 12px 14px;
  margin-bottom: 8px;
  border: 1px solid rgba(255,255,255,0.04);
}

.order-item-result .order-id {
  font-weight: 700;
  color: #facc15;
  font-size: 13px;
}

.order-item-result .order-detail {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px 12px;
  margin-top: 6px;
  font-size: 12px;
}

.order-item-result .order-detail .label {
  color: #94a3b8;
}

.order-item-result .order-detail .value {
  color: #f1f5f9;
  text-align: right;
}

.tab-content {
  display: none;
}

.tab-content.active {
  display: block;
  animation: fadeSlide 0.3s ease both;
}

.helper-text {
  font-size: 12px;
  color: #64748b;
  margin-top: 4px;
}

.loading-spinner {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 2px solid rgba(255,255,255,0.1);
  border-top: 2px solid #06b6d4;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  vertical-align: middle;
  margin-right: 8px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.divider {
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
  margin: 16px 0;
}

.footer {
  text-align: center;
  font-size: 11px;
  color: #4a5a7a;
  margin-top: 20px;
  letter-spacing: 0.5px;
}

.footer span {
  background: linear-gradient(135deg, #8b5cf6, #06b6d4);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-weight: 700;
}

@media (max-width: 480px) {
  .card { padding: 16px 14px; }
  .tabs .tab { font-size: 10px; padding: 6px 8px; min-width: 60px; }
  .order-item-result .order-detail { grid-template-columns: 1fr; gap: 2px; }
  .order-item-result .order-detail .value { text-align: left; }
  .header .brand h1 { font-size: 14px; }
  .header .brand .logo { width: 28px; height: 28px; }
  .back-btn { font-size: 11px; padding: 4px 12px; }
}

@media (max-width: 380px) {
  .card { padding: 12px 10px; }
  input, textarea { font-size: 12px; padding: 8px 10px; }
  .btn { font-size: 12px; padding: 10px; }
  .tabs .tab { font-size: 9px; padding: 4px 6px; min-width: 50px; }
}

::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(139,92,246,0.45); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: #06b6d4; }
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="brand">
    <div class="logo">
      <img src="/home/logo.png" alt="Shine Shop" width="40" height="40" loading="lazy">
    </div>
    <h1>Shine Shop</h1>
  </div>
  <a href="/sosmed-3/" class="back-btn">← Kembali</a>
</header>

<div class="container">

  <!-- GMAIL DISPLAY -->
  <div class="gmail-display">
    <span class="label">📧 Gmail:</span>
    <span class="value" id="gmailDisplay">Memuat...</span>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab active" data-tab="status">📊 Status Pesanan</button>
    <button class="tab" data-tab="refill">🔄 Buat Refill</button>
    <button class="tab" data-tab="refill-status">📋 Status Refill</button>
  </div>

  <!-- TAB 1: STATUS PESANAN -->
  <div class="tab-content active" id="tab-status">
    <div class="card">
      <h2>📊 Cek Status Pesanan <span class="badge">Single</span></h2>
      <label for="orderId">Order ID</label>
      <input type="text" id="orderId" placeholder="Masukkan ID pesanan (contoh: 23501)" autocomplete="off">
      <button class="btn btn-primary" id="btnCheckOrder">🔍 Cek Status</button>
      <div class="result-box" id="resultOrder"></div>
    </div>

    <div class="card">
      <h2>📊 Cek Banyak Pesanan <span class="badge">Multi</span></h2>
      <label for="orderIds">Order IDs (pisah koma)</label>
      <textarea id="orderIds" placeholder="23501, 23502, 23503" rows="2"></textarea>
      <div class="helper-text">Maksimal 100 ID</div>
      <button class="btn btn-primary" id="btnCheckOrders">🔍 Cek Semua</button>
      <div class="result-box" id="resultOrders"></div>
    </div>
  </div>

  <!-- TAB 2: REFILL -->
  <div class="tab-content" id="tab-refill">
    <div class="card">
      <h2>🔄 Buat Refill <span class="badge">Single</span></h2>
      <label for="refillOrderId">Order ID</label>
      <input type="text" id="refillOrderId" placeholder="Masukkan ID pesanan" autocomplete="off">
      <button class="btn btn-success" id="btnCreateRefill">🔄 Buat Refill</button>
      <div class="result-box" id="resultRefill"></div>
    </div>

    <div class="card">
      <h2>🔄 Buat Refill Banyak <span class="badge">Multi</span></h2>
      <label for="refillOrderIds">Order IDs (pisah koma)</label>
      <textarea id="refillOrderIds" placeholder="23501, 23502, 23503" rows="2"></textarea>
      <div class="helper-text">Maksimal 100 ID</div>
      <button class="btn btn-success" id="btnCreateRefills">🔄 Buat Semua</button>
      <div class="result-box" id="resultRefills"></div>
    </div>
  </div>

  <!-- TAB 3: REFILL STATUS -->
  <div class="tab-content" id="tab-refill-status">
    <div class="card">
      <h2>📋 Cek Status Refill <span class="badge">Single</span></h2>
      <label for="refillId">Refill ID</label>
      <input type="text" id="refillId" placeholder="Masukkan ID refill" autocomplete="off">
      <button class="btn btn-warning" id="btnCheckRefill">📋 Cek Status Refill</button>
      <div class="result-box" id="resultRefillStatus"></div>
    </div>

    <div class="card">
      <h2>📋 Cek Status Refill Banyak <span class="badge">Multi</span></h2>
      <label for="refillIds">Refill IDs (pisah koma)</label>
      <textarea id="refillIds" placeholder="123, 456, 789" rows="2"></textarea>
      <div class="helper-text">Maksimal 100 ID</div>
      <button class="btn btn-warning" id="btnCheckRefills">📋 Cek Semua</button>
      <div class="result-box" id="resultRefillsStatus"></div>
    </div>
  </div>

  <div class="footer">© <span>Shine Shop</span> · 2026</div>
</div>

<script>
// ============================================================
// 🔒 DRAGON PROTOCOL: KONFIGURASI
// ============================================================

const INDO_API_KEY = 'a11570b88893e5d72b274539c98c1fba';
const INDO_API_URL = 'https://indosmm.id/api/v2';

// ===== GMAIL =====
function getStoredGmail() {
  try {
    return localStorage.getItem('user_gmail') || null;
  } catch { return null; }
}

function validateEmail(email) {
  return email && email.includes('@') && email.includes('.') && email.length > 5;
}

function updateGmailDisplay() {
  const gmail = getStoredGmail();
  const el = document.getElementById('gmailDisplay');
  if (!el) return;
  if (gmail && validateEmail(gmail)) {
    el.textContent = gmail;
    el.className = 'value';
  } else {
    el.textContent = '⚠️ Belum diatur! Silakan login terlebih dahulu.';
    el.className = 'value not-set';
  }
}

// ===== UTILITY =====
function formatRp(n) {
  return 'Rp' + Number(n || 0).toLocaleString('id-ID');
}

function getStatusBadge(status) {
  const s = (status || '').toLowerCase();
  if (s === 'success' || s === 'completed') return 'success';
  if (s === 'partial') return 'partial';
  if (s === 'processing' || s === 'proses') return 'processing';
  if (s === 'pending' || s === 'waiting') return 'pending';
  if (s === 'cancel' || s === 'cancelled') return 'cancel';
  return 'pending';
}

function getStatusIcon(status) {
  const s = (status || '').toLowerCase();
  if (s === 'success' || s === 'completed') return '✅';
  if (s === 'partial') return '⚠️';
  if (s === 'processing' || s === 'proses') return '🔄';
  if (s === 'pending' || s === 'waiting') return '⏳';
  if (s === 'cancel' || s === 'cancelled') return '❌';
  return '📌';
}

function showResult(elementId, html, isError = false) {
  const el = document.getElementById(elementId);
  if (!el) return;
  el.innerHTML = html;
  el.className = 'result-box show';
  if (isError) {
    el.style.borderLeftColor = '#ef4444';
    el.style.borderLeft = '3px solid #ef4444';
  } else {
    el.style.borderLeft = '3px solid #06b6d4';
  }
}

function hideResult(elementId) {
  const el = document.getElementById(elementId);
  if (!el) return;
  el.className = 'result-box';
  el.innerHTML = '';
}

function setLoading(btnId, loading) {
  const btn = document.getElementById(btnId);
  if (!btn) return;
  if (loading) {
    btn.disabled = true;
    btn.innerHTML = '<span class="loading-spinner"></span> Memproses...';
  } else {
    btn.disabled = false;
    btn.innerHTML = btn.dataset.originalText || btn.textContent;
  }
}

// ============================================================
// 🔥 API CALLS
// ============================================================

async function callIndosmm(payload) {
  const response = await fetch(INDO_API_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Accept': 'application/json'
    },
    body: JSON.stringify(payload)
  });

  if (!response.ok) {
    throw new Error('HTTP ' + response.status + ': ' + response.statusText);
  }

  return await response.json();
}

// ============================================================
// 🔥 TAB 1: STATUS PESANAN
// ============================================================

// Single Order Status
document.getElementById('btnCheckOrder').addEventListener('click', async function() {
  const orderId = document.getElementById('orderId').value.trim();
  if (!orderId) {
    Swal.fire('⚠️ Error', 'Masukkan Order ID!', 'warning');
    return;
  }

  setLoading('btnCheckOrder', true);
  hideResult('resultOrder');

  try {
    const result = await callIndosmm({
      key: INDO_API_KEY,
      action: 'status',
      order: orderId
    });

    let html = `
      <div style="font-weight:600;margin-bottom:8px;font-size:14px;">
        🆔 Order ID: <span style="color:#facc15;">${orderId}</span>
      </div>
      <div class="row">
        <span class="label">📊 Status</span>
        <span class="value">
          <span class="status-badge ${getStatusBadge(result.status)}">
            ${getStatusIcon(result.status)} ${result.status || 'Unknown'}
          </span>
        </span>
      </div>
    `;

    if (result.charge !== undefined) {
      html += `
        <div class="row">
          <span class="label">💰 Charge</span>
          <span class="value">${result.charge}</span>
        </div>
      `;
    }

    if (result.start_count !== undefined) {
      html += `
        <div class="row">
          <span class="label">📊 Start Count</span>
          <span class="value">${result.start_count}</span>
        </div>
      `;
    }

    if (result.remains !== undefined) {
      html += `
        <div class="row">
          <span class="label">📦 Remains</span>
          <span class="value">${result.remains}</span>
        </div>
      `;
    }

    showResult('resultOrder', html);
  } catch (err) {
    showResult('resultOrder', `
      <div style="color:#f87171;">❌ Gagal mengecek status: ${err.message}</div>
    `, true);
  }

  setLoading('btnCheckOrder', false);
});

// Multiple Orders Status
document.getElementById('btnCheckOrders').addEventListener('click', async function() {
  const orderIds = document.getElementById('orderIds').value.trim();
  if (!orderIds) {
    Swal.fire('⚠️ Error', 'Masukkan Order IDs (pisah koma)!', 'warning');
    return;
  }

  // Clean and validate
  const ids = orderIds.split(',').map(id => id.trim()).filter(id => id);
  if (ids.length === 0) {
    Swal.fire('⚠️ Error', 'Masukkan minimal 1 Order ID!', 'warning');
    return;
  }

  if (ids.length > 100) {
    Swal.fire('⚠️ Error', 'Maksimal 100 Order ID!', 'warning');
    return;
  }

  setLoading('btnCheckOrders', true);
  hideResult('resultOrders');

  try {
    const result = await callIndosmm({
      key: INDO_API_KEY,
      action: 'status',
      orders: ids.join(',')
    });

    let html = `<div style="font-weight:600;margin-bottom:8px;">📋 Hasil ${ids.length} Pesanan</div>`;

    // Result bisa array atau object
    let results = [];
    if (Array.isArray(result)) {
      results = result;
    } else if (typeof result === 'object') {
      results = Object.values(result);
    } else {
      results = [result];
    }

    if (results.length === 0) {
      html += `<div style="color:#94a3b8;">Tidak ada data</div>`;
    } else {
      results.forEach((item, index) => {
        const orderId = item.order || ids[index] || 'unknown';
        html += `
          <div class="order-item-result">
            <div class="order-id">🆔 ${orderId}</div>
            <div class="order-detail">
              <span class="label">Status</span>
              <span class="value">
                <span class="status-badge ${getStatusBadge(item.status)}">
                  ${getStatusIcon(item.status)} ${item.status || 'Unknown'}
                </span>
              </span>
              ${item.charge !== undefined ? `
                <span class="label">Charge</span>
                <span class="value">${item.charge}</span>
              ` : ''}
              ${item.start_count !== undefined ? `
                <span class="label">Start</span>
                <span class="value">${item.start_count}</span>
              ` : ''}
              ${item.remains !== undefined ? `
                <span class="label">Remains</span>
                <span class="value">${item.remains}</span>
              ` : ''}
            </div>
          </div>
        `;
      });
    }

    showResult('resultOrders', html);
  } catch (err) {
    showResult('resultOrders', `
      <div style="color:#f87171;">❌ Gagal mengecek status: ${err.message}</div>
    `, true);
  }

  setLoading('btnCheckOrders', false);
});

// 🔥 TABS
// ============================================================

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', function() {
    // Remove active from all tabs
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    this.classList.add('active');

    // Hide all tab contents
    document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));

    // Show selected tab content
    const target = document.getElementById('tab-' + this.dataset.tab);
    if (target) target.classList.add('active');

    // Hide all results when switching tabs
    document.querySelectorAll('.result-box').forEach(el => {
      el.className = 'result-box';
      el.innerHTML = '';
    });
  });
});
