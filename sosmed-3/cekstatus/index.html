<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cek Status & Refill Pesanan IndoSMM</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f4f7f6;
      color: #333;
      display: flex;
      justify-content: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 600px;
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #2c3e50;
    }
    .tabs {
      display: flex;
      border-bottom: 2px solid #eee;
      margin-bottom: 20px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      text-align: center;
      background: none;
      border: none;
      font-weight: bold;
      color: #7f8c8d;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.3s;
    }
    .tab-btn.active {
      color: #3498db;
      border-bottom-color: #3498db;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 14px;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
    button.btn-submit {
      width: 100%;
      padding: 12px;
      background-color: #3498db;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }
    button.btn-submit:hover {
      background-color: #2980b9;
    }
    .result-box {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      background-color: #f8f9fa;
      border: 1px solid #e9ecef;
      display: none;
    }
    .result-item {
      margin-bottom: 8px;
      font-size: 15px;
    }
    .badge {
      padding: 4px 8px;
      border-radius: 4px;
      color: #fff;
      font-weight: bold;
      font-size: 12px;
    }
    .badge-success { background-color: #2ecc71; }
    .badge-process { background-color: #f1c40f; color: #333; }
    .badge-canceled { background-color: #e74c3c; }
    .badge-partial { background-color: #e67e22; }
    
    .btn-whatsapp {
      display: inline-block;
      margin-top: 10px;
      padding: 10px 15px;
      background-color: #25d366;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
      text-align: center;
    }
    .btn-whatsapp:hover {
      background-color: #1eb954;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Layanan Cek & Refill IndoSMM</h2>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('statusTab')">Cek Status Pesanan</button>
    <button class="tab-btn" onclick="switchTab('createRefillTab')">Ajuin Refill</button>
    <button class="tab-btn" onclick="switchTab('refillStatusTab')">Cek Status Refill</button>
  </div>

  <!-- Tab 1: Cek Status Pesanan -->
  <div id="statusTab" class="tab-content active">
    <form id="formCekStatus">
      <div class="form-group">
        <label for="orderId">Order ID:</label>
        <input type="text" id="orderId" placeholder="Masukkan ID Pesanan (cth: 1234456)" required />
      </div>
      <button type="submit" class="btn-submit">Cek Status</button>
    </form>
    <div id="resultStatus" class="result-box"></div>
  </div>

  <!-- Tab 2: Create Refill -->
  <div id="createRefillTab" class="tab-content">
    <form id="formCreateRefill">
      <div class="form-group">
        <label for="refillOrderId">Order ID (Gunakan koma jika > 1 ID):</label>
        <input type="text" id="refillOrderId" placeholder="cth: 1234, 1235, 1236" required />
      </div>
      <button type="submit" class="btn-submit">Ajuin Refill</button>
    </form>
    <div id="resultCreateRefill" class="result-box"></div>
  </div>

  <!-- Tab 3: Get Refill Status -->
  <div id="refillStatusTab" class="tab-content">
    <form id="formRefillStatus">
      <div class="form-group">
        <label for="refillId">Refill ID (Gunakan koma jika > 1 ID):</label>
        <input type="text" id="refillId" placeholder="cth: 1, 2, 3" required />
      </div>
      <button type="submit" class="btn-submit">Cek Status Refill</button>
    </form>
    <div id="resultRefillStatus" class="result-box"></div>
  </div>
</div>

<script>
  function switchTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    
    document.getElementById(tabId).classList.add('active');
    event.currentTarget.classList.add('active');
  }

  // Helper badge warna status
  function getStatusBadge(status) {
    const st = String(status).toLowerCase();
    if (st.includes('success') || st.includes('completed')) {
      return `<span class="badge badge-success">${status} (Selesai)</span>`;
    } else if (st.includes('process') || st.includes('in progress')) {
      return `<span class="badge badge-process">${status} (Dalam Proses)</span>`;
    } else if (st.includes('canceled') || st.includes('cancelled')) {
      return `<span class="badge badge-canceled">${status} (Dibatalkan)</span>`;
    } else if (st.includes('partial')) {
      return `<span class="badge badge-partial">${status} (Parsial)</span>`;
    }
    return `<span class="badge badge-process">${status}</span>`;
  }

  // Form 1: Cek Status Pesanan
  document.getElementById('formCekStatus').addEventListener('submit', async (e) => {
    e.preventDefault();
    const orderId = document.getElementById('orderId').value.trim();
    const resultBox = document.getElementById('resultStatus');

    resultBox.style.display = 'block';
    resultBox.innerHTML = 'Sedang memuat...';

    try {
      const res = await fetch('/api/cekstatus.js', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'status', order: orderId })
      });
      const data = await res.json();

      if (data.error) {
        resultBox.innerHTML = `<strong style="color: red;">Error:</strong> ${data.error}`;
        return;
      }

      const statusText = data.status || 'Unknown';
      let htmlOutput = `
        <div class="result-item"><strong>Order ID:</strong> ${orderId}</div>
        <div class="result-item"><strong>Jumlah Awal (Start Count):</strong> ${data.start_count || '-'}</div>
        <div class="result-item"><strong>Sisa (Remains):</strong> ${data.remains || '-'}</div>
        <div class="result-item"><strong>Status:</strong> ${getStatusBadge(statusText)}</div>
      `;

      // Jika status Partial atau Canceled -> Tampilkan Tombol Refund WhatsApp
      const lowerStatus = statusText.toLowerCase();
      if (lowerStatus.includes('partial') || lowerStatus.includes('canceled') || lowerStatus.includes('cancelled')) {
        const waText = encodeURIComponent(`min Saya mau mengajukan reffund Sosmed 3 berikut id pesanannya : ${orderId}`);
        const waLink = `https://wa.me/6289518103883?text=${waText}`;
        htmlOutput += `
          <div style="margin-top: 15px;">
            <p style="font-size: 13px; color: #666; margin-bottom: 5px;">Pesanan bermasalah? Ajukan refund via WhatsApp:</p>
            <a href="${waLink}" target="_blank" class="btn-whatsapp">💬 Ajukan Refund via WhatsApp</a>
          </div>
        `;
      }

      resultBox.innerHTML = htmlOutput;

    } catch (err) {
      resultBox.innerHTML = '<span style="color:red;">Gagal mengambil data pesanan.</span>';
    }
  });

  // Form 2: Create Refill
  document.getElementById('formCreateRefill').addEventListener('submit', async (e) => {
    e.preventDefault();
    const orderId = document.getElementById('refillOrderId').value.trim();
    const resultBox = document.getElementById('resultCreateRefill');

    resultBox.style.display = 'block';
    resultBox.innerHTML = 'Mengajukan refill...';

    try {
      const res = await fetch('/api/cekstatus.js', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'refill', order: orderId })
      });
      const data = await res.json();

      if (data.error) {
        resultBox.innerHTML = `<strong style="color: red;">Error:</strong> ${data.error}`;
      } else if (data.refill) {
        resultBox.innerHTML = `
          <div class="result-item"><strong style="color: green;">Refill Berhasil Diajukan!</strong></div>
          <div class="result-item"><strong>Refill ID:</strong> ${data.refill}</div>
        `;
      } else {
        resultBox.innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
      }
    } catch (err) {
      resultBox.innerHTML = '<span style="color:red;">Gagal melakukan pengajuan refill.</span>';
    }
  });

  // Form 3: Get Refill Status
  document.getElementById('formRefillStatus').addEventListener('submit', async (e) => {
    e.preventDefault();
    const refillId = document.getElementById('refillId').value.trim();
    const resultBox = document.getElementById('resultRefillStatus');

    resultBox.style.display = 'block';
    resultBox.innerHTML = 'Sedang mengecek status refill...';

    try {
      const res = await fetch('/api/cekstatus.js', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'refill_status', refill: refillId })
      });
      const data = await res.json();

      if (data.error) {
        resultBox.innerHTML = `<strong style="color: red;">Error:</strong> ${data.error}`;
      } else {
        resultBox.innerHTML = `
          <div class="result-item"><strong>Refill ID:</strong> ${refillId}</div>
          <div class="result-item"><strong>Status Refill:</strong> ${getStatusBadge(data.status || 'Unknown')}</div>
        `;
      }
    } catch (err) {
      resultBox.innerHTML = '<span style="color:red;">Gagal mengambil status refill.</span>';
    }
  });
</script>

</body>
</html>
