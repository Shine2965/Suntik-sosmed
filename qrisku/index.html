<!DOCTYPE html><html lang="id"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Pembayaran QRIS - Shine Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
<style>
*{box-sizing:border-box}
body{
  font-family:'Poppins',sans-serif;
  background:
    radial-gradient(circle at top left,#00c6ff33,transparent 40%),
    radial-gradient(circle at bottom right,#0072ff33,transparent 40%),
    linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
  color:#fff;
}
.card{
  width:100%;
  max-width:460px;
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(14px);
  border-radius:22px;
  padding:24px;
}
h2{margin:0;font-size:22px;font-weight:700}
.subtitle{font-size:14px;color:#cbd5e1;margin-top:4px}
.qr-wrapper{
  background:#fff;
  border-radius:18px;
  padding:16px;
  margin:18px auto;
  width:fit-content
}
.details{font-size:13.5px;line-height:1.7}
input{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:none;
  margin-top:10px;
  font-size:13px
}
p {
  color: red;
  font-family: 'Verdana', sans-serif;
  font-size: 10px;
  line-height: 1.6;
  margin-bottom: 20px;
}
.btn{
  width:100%;
  margin-top:18px;
  padding:14px;
  border-radius:999px;
  border:none;
  font-size:15px;
  font-weight:700;
  color:#fff;
  background:linear-gradient(135deg,#00c6ff,#0072ff);
  cursor:pointer
}
.muted{text-align:center;font-size:12px;color:#cbd5e1;margin-top:12px}
</style>
</head>
<body>
<div class="card">
<h2>Pembayaran QRIS Andashaa Store - Sosmed 2</h2>
<div class="subtitle">Scan QR untuk menyelesaikan pembayaran</div>
<div class="qr-wrapper">
<canvas id="qrisCanvas" width="240" height="240"></canvas>
</div>
<div class="details" id="orderDetails"></div>
<input type="text" id="namaInput" placeholder="Nama Lengkap">
<input type="email" id="gmailInput" placeholder="Gmail Aktif">
<input type="text" id="voucherInput" placeholder="Kode Voucher (opsional)">
<button id="applyVoucher" class="btn" style="margin-top:10px;background:#22c55e;">Gunakan Voucher</button>
<input type="file" id="buktiInput" accept="image/*">
<button id="confirmBtn" class="btn">Konfirmasi Pembayaran</button>
<div class="muted">Admin memproses maksimal 72 jam</div>
<p>Screenshot seluruh transaksi sebagai bukti jika terjadi kendala.</p>
</div>
<script>
const p = new URLSearchParams(location.search);
const trx = p.get("trx") || "-";
const layanan = p.get("layanan") || "-";
const total = Number(p.get("total") || 0);
const target = p.get("target") || "-";let originalTotal = total; let finalTotal = total;

function crc16(s){ let c=0xFFFF; for(let i=0;i<s.length;i++){ c^=s.charCodeAt(i)<<8; for(let j=0;j<8;j++){ c=c&0x8000?(c<<1)^0x1021:c<<1; }} return (c&0xFFFF).toString(16).toUpperCase().padStart(4,'0'); }

function buildQR(a){ const str=String(parseInt(a)); const tag="54"+String(str.length).padStart(2,"0")+str; const base="00020101021226670016COM.NOBUBANK.WWW01189360050300000879140214526036770909650303UMI51440014ID.CO.QRIS.WWW0215ID20243611417480303UMI5204541153033605802ID5920SHINE SHOP OK19967206008SURABAYA61056011162070703A01"; const d=base+tag+"6304"; return d+crc16(d); }

function updateDisplay(){ orderDetails.innerHTML = <strong>ID:</strong> ${trx}<br> <strong>Layanan:</strong> ${layanan}<br> <strong>Target:</strong> ${target}<br> <strong>Total:</strong> Rp ${finalTotal.toLocaleString("id-ID")};

QRCode.toCanvas(qrisCanvas, buildQR(finalTotal), { width:240 }, function(err){ if(err) return console.error(err);

const ctx = qrisCanvas.getContext("2d");
const logo = new Image();
logo.src = "/home/logo.png";

logo.onload = function(){
  const size = 50;
  const x = (qrisCanvas.width - size)/2;
  const y = (qrisCanvas.height - size)/2;

  // Clip jadi lingkaran biar nyatu halus
  ctx.save();
  ctx.beginPath();
  ctx.arc(x + size/2, y + size/2, size/2, 0, Math.PI * 2);
  ctx.closePath();
  ctx.clip();

  // Gambar logo tanpa background putih
  ctx.drawImage(logo, x, y, size, size);

  ctx.restore();
};

}); }

updateDisplay(); </script>

</body>
</html>
