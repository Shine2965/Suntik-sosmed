<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QRIS Payment - Shine Shop</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background: linear-gradient(135deg,#0f172a,#1e293b);
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.container{
  width:100%;
  max-width:420px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(15px);
  border-radius:20px;
  padding:25px;
  box-shadow:0 0 40px rgba(0,0,0,0.5);
}

h1{
  text-align:center;
  margin-bottom:15px;
}

.qr-box{
  text-align:center;
  margin:15px 0;
}

.qr-box img{
  width:220px;
  border-radius:15px;
  background:#fff;
  padding:10px;
}

input, textarea{
  width:100%;
  padding:12px;
  margin:8px 0;
  border:none;
  border-radius:10px;
  background:rgba(255,255,255,0.08);
  color:#fff;
}

input::placeholder, textarea::placeholder{
  color:#ccc;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  background:#22c55e;
  color:#fff;
  font-weight:600;
  cursor:pointer;
  margin-top:10px;
}

button:hover{
  background:#16a34a;
}

.file{
  background:rgba(255,255,255,0.08);
  padding:10px;
  border-radius:10px;
}

.status{
  text-align:center;
  margin-top:10px;
  font-size:14px;
  color:#22c55e;
}
</style>
</head>

<body>

<div class="container">
  <h1>QRIS Payment</h1>

  <input type="number" id="nominal" placeholder="Masukkan nominal" oninput="generateQR()">

  <div class="qr-box">
    <img id="qr" src="">
  </div>

  <input type="text" id="tele" placeholder="Username Telegram (@username)">

  <textarea id="produk" placeholder="Apa yang dibeli..."></textarea>

  <input type="file" id="bukti" class="file" accept="image/*">

  <button onclick="kirim()">Kirim Bukti Transfer</button>

  <div class="status" id="status"></div>
</div>

<script>
const baseQR = "00020101021126670016COM.NOBUBANK.WWW01189360050300000879140214526036770909650303UMI51440014ID.CO.QRIS.WWW0215ID20243611417480303UMI5204541153033605802ID5920SHINE SHOP OK19967206008SURABAYA61056011162070703A0163041008";

function crc16(str) {
  let crc = 0xFFFF;
  for (let c = 0; c < str.length; c++) {
    crc ^= str.charCodeAt(c) << 8;
    for (let i = 0; i < 8; i++) {
      if ((crc & 0x8000) !== 0) {
        crc = (crc << 1) ^ 0x1021;
      } else {
        crc <<= 1;
      }
    }
  }
  return (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, "0");
}

function generateQR(){
  let nominal = document.getElementById("nominal").value;
  if(!nominal) return;

  let amount = "54" + ("0" + nominal.length).slice(-2) + nominal;
  let raw = baseQR.slice(0,-4) + amount;
  let finalQR = raw + crc16(raw);

  document.getElementById("qr").src =
    "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=" + finalQR;
}

async function kirim(){
  let file = document.getElementById("bukti").files[0];
  let nominal = document.getElementById("nominal").value;
  let produk = document.getElementById("produk").value;
  let tele = document.getElementById("tele").value;

  if(!file || !nominal || !tele){
    alert("Lengkapi semua data!");
    return;
  }

  let formData = new FormData();
  formData.append("photo", file);

  formData.append("caption",
`🧾 PEMBAYARAN MASUK

👤 Telegram: ${tele}
💰 Nominal: Rp${nominal}
📦 Produk: ${produk}

📍 QRIS Shine Shop`);

  document.getElementById("status").innerText = "Mengirim...";

  try{
    let res = await fetch("/api/send", {
      method: "POST",
      body: formData
    });

    let data = await res.json();

    if(data.success){
      document.getElementById("status").innerText = "✅ Berhasil dikirim!";
    } else {
      document.getElementById("status").innerText = "❌ Gagal kirim!";
    }
  }catch(e){
    document.getElementById("status").innerText = "❌ Error koneksi!";
  }
}
</script>

</body>
</html>
