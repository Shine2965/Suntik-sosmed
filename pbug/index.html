<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Pembayaran QRIS - Shine Shop</title>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
<style>
  body{font-family:'Poppins',Arial,sans-serif;background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);color:#fff;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center}
  .card{background:rgba(255,255,255,0.08);padding:22px;border-radius:14px;max-width:520px;width:100%;box-shadow:0 8px 20px rgba(0,0,0,0.45)}
  canvas{background:#fff;padding:10px;border-radius:12px;display:block;margin:16px auto}
  .details{font-size:14px;text-align:left;margin:10px 0;line-height:1.6;color:#fff}
  .btn{width:100%;margin-top:14px;padding:12px;border-radius:30px;background:linear-gradient(45deg,#00c6ff,#0072ff);border:none;color:#fff;font-weight:700;cursor:pointer}
  .muted{color:#d0d7de;font-size:13px;margin-top:8px}
</style>
</head>

<body>

<div id="mainCard" class="card">
  <h2 style="margin:0 0 6px 0">Pembayaran QRIS</h2>
  <p>Silakan scan QR di bawah untuk membayar</p>

  <canvas id="qrisCanvas" width="260" height="260"></canvas>

  <div class="details" id="orderDetails"></div>

  <button id="confirmBtn" class="btn">Konfirmasi Pembayaran</button>

  <div class="muted">Setelah konfirmasi, admin akan memproses paling lama 24 jam.</div>
</div>

<script>
/* === CONFIG === */
const botToken  = "7430992455:AAFYSSkMzy1UWwHTNzBEJBzAyPzfmF0wqto";
const chatId    = "6845141887"; // hanya admin

/* === INIT === */
initOrderUI();

/* === QR & UI === */
function initOrderUI(){
  const url = new URL(location.href);
  const p = url.searchParams;

  const trxID     = p.get("trx") || "-";
  const kategori  = p.get("kategori") || "-";
  const layanan   = p.get("layanan") || "-";
  const idLayanan = p.get("id") || "-";
  const jumlah    = p.get("jumlah") || "-";
  const total     = p.get("total") || "0";
  const target    = p.get("target") || "-";

  const tanggal = new Date().toLocaleString("id-ID",{timeZone:"Asia/Jakarta"});

  const det = `
    <strong>ID Transaksi:</strong> ${trxID}<br>
    <strong>ID Layanan:</strong> ${idLayanan}<br>
    <strong>Tanggal:</strong> ${tanggal}<br>
    <strong>Kategori:</strong> ${kategori}<br>
    <strong>Layanan:</strong> ${layanan}<br>
    <strong>Jumlah:</strong> ${jumlah}<br>
    <strong>Target:</strong> <code>${target}</code><br>
    <strong>Total:</strong> Rp ${Number(total).toLocaleString("id-ID")}
  `;
  document.getElementById("orderDetails").innerHTML = det;

  // QR Builder
  function crc16(s){let crc=0xFFFF;for(let i=0;i<s.length;i++){crc^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++){crc=(crc&0x8000)?((crc<<1)^0x1021)&0xFFFF:(crc<<1)&0xFFFF;}}return crc.toString(16).toUpperCase().padStart(4,'0');}
  function buildQR(amount){const a=parseInt(amount||0,10);const str=String(a);const len=String(str.length).padStart(2,"0");const tag54="54"+len+str;const base="00020101021226670016COM.NOBUBANK.WWW01189360050300000879140214526036770909650303UMI51440014ID.CO.QRIS.WWW0215ID20243611417480303UMI5204541153033605802ID5920SHINE SHOP OK19967206008SURABAYA61056011162070703A01";const data=base+tag54+"6304";return data+crc16(data);}

  QRCode.toCanvas(document.getElementById("qrisCanvas"), buildQR(total), {width:260});

  // === KONFIRMASI TANPA UPLOAD FOTO ===
  document.getElementById("confirmBtn").onclick = async () => {
    Swal.fire({title:"Mengirimkan data ke Admin...",allowOutsideClick:false,didOpen:()=>Swal.showLoading()});

    const tgl = new Date().toLocaleString("id-ID",{timeZone:"Asia/Jakarta"});

    const textMessage = `💳 KONFIRMASI PEMBAYARAN BARU
📰 ID Transaksi: ${trxID}
🆔 ID Layanan: ${idLayanan}
🗓️ Tanggal: ${tgl} WIB
📂 Kategori: ${kategori}
⚙️ Layanan: ${layanan}
🔢 Jumlah: ${jumlah}
🎯 Target: ${target}
💰 Total: Rp ${Number(total).toLocaleString("id-ID")}

❗ *User tidak mengupload bukti transfer*
Transaksi akan diproses admin paling lama 24 jam.`;

    try{
      const res = await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({chat_id:chatId,text:textMessage})
      });

      const jr = await res.json();
      if(!jr.ok) throw new Error(jr.description || "Gagal mengirim ke admin");

      Swal.close();
      await Swal.fire({
        icon:"success",
        title:"Berhasil!",
        html:`Konfirmasi berhasil dikirim ke admin.`,
      });

      window.location.href = "/dashboard/";

    }catch(err){
      Swal.close();
      Swal.fire({icon:"error",title:"Gagal",text: err.message || "Terjadi kesalahan saat mengirim"});
    }
  };
}
</script>
</body>
</html>
