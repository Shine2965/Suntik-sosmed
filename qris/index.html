<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SHINE SHOP QRIS</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Arial',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:url('https://images.minecraft.net/content/dam/games/minecraft/key-art/MCV-Vanilla-KeyArt.jpg') center center/cover no-repeat;
padding:20px;
}

.container{
width:420px;
text-align:center;
}

.title{
background:#6b3f15;
border:4px solid #4a2a0c;
color:#fff;
font-size:34px;
font-weight:bold;
padding:12px;
text-shadow:3px 3px #000;
margin-bottom:10px;
}

.board{
background:#e6d3ae;
border:6px solid #8b5a2b;
padding:15px;
margin-bottom:15px;
font-size:22px;
font-weight:bold;
}

.input-box{
margin-bottom:15px;
}

input{
width:100%;
padding:15px;
font-size:20px;
border:none;
outline:none;
border-radius:8px;
text-align:center;
}

button{
width:100%;
padding:15px;
font-size:18px;
font-weight:bold;
background:#55aa33;
color:white;
border:none;
cursor:pointer;
margin-top:10px;
border-radius:8px;
}

button:hover{
opacity:.9;
}

.qris-frame{
position:relative;
background:#fff;
padding:20px;
border:12px solid #888;
display:flex;
justify-content:center;
align-items:center;
}

#qrcode{
width:300px;
height:300px;
}

.logo{
position:absolute;
width:70px;
height:70px;
background:white;
padding:6px;
border-radius:15px;
}

.footer{
margin-top:10px;
background:#444;
color:white;
padding:12px;
font-weight:bold;
}
</style>
</head>
<body>

<div class="container">

<div class="title">
SHINE SHOP
</div>

<div class="board">
NMID : ID2024361141748
</div>

<div class="input-box">
<input type="number" id="nominal" placeholder="Masukkan Nominal">
<button onclick="generateQRIS()">Generate QRIS</button>
</div>

<div class="qris-frame">

<div id="qrcode"></div>

<img src="/home/logo.png" class="logo">

</div>

<div class="footer">
SATU QRIS UNTUK SEMUA
</div>

</div>

<script>

const qrisStatis =
"00020101021126670016COM.NOBUBANK.WWW01189360050300000879140214526036770909650303UMI51440014ID.CO.QRIS.WWW0215ID20243611417480303UMI5204541153033605802ID5920SHINE SHOP OK19967206008SURABAYA61056011162070703A0163041008";

function crc16(str) {
let crc = 0xFFFF;

for (let c = 0; c < str.length; c++) {
crc ^= str.charCodeAt(c) << 8;

for (let i = 0; i < 8; i++) {
if ((crc & 0x8000) !== 0) {
crc = (crc << 1) ^ 0x1021;
} else {
crc <<= 1;
}
crc &= 0xFFFF;
}
}

return crc.toString(16).toUpperCase().padStart(4, '0');
}

function makeDynamicQRIS(qris, amount){

qris = qris.replace("010211","010212");

const amountTag =
"54" +
amount.toString().length.toString().padStart(2,'0') +
amount;

qris = qris.replace("5802ID", amountTag + "5802ID");

qris = qris.substring(0, qris.length - 4);

const crc = crc16(qris + "6304");

return qris + "6304" + crc;
}

function generateQRIS(){

let nominal = document.getElementById("nominal").value;

if(!nominal){
alert("Masukkan nominal terlebih dahulu");
return;
}

let qrisFinal = makeDynamicQRIS(qrisStatis, nominal);

document.getElementById("qrcode").innerHTML = "";

new QRCode(document.getElementById("qrcode"),{
text:qrisFinal,
width:300,
height:300,
correctLevel:QRCode.CorrectLevel.H
});
}

generateQRIS();

</script>

</body>
</html>
