<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHINE SHOP QRIS Minecraft</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{
min-height:100vh;display:flex;justify-content:center;align-items:center;
background:linear-gradient(#28a5ff,#7fd0ff);padding:20px;
}
.container{width:430px;max-width:100%}
.title{
background:#7b4d1f;color:#fff;border:5px solid #4d2d12;
padding:12px;text-align:center;font-size:32px;font-weight:bold;
text-shadow:3px 3px #000;margin-bottom:10px;
}
.board{
background:#ead7b0;border:5px solid #8b5a2b;padding:10px;
text-align:center;font-size:20px;font-weight:bold;margin-bottom:10px;
}
.input-area{display:flex;gap:8px;margin-bottom:10px}
input{flex:1;padding:12px;font-size:18px}
button{padding:12px 18px;font-size:16px;font-weight:bold;cursor:pointer}
.qrframe{
position:relative;background:#fff;border:12px solid #7f7f7f;
padding:15px;display:flex;justify-content:center;align-items:center;
}
.logo{
position:absolute;width:70px;height:70px;background:#fff;
padding:6px;border-radius:12px;
}
.footer{
margin-top:10px;background:#555;color:#fff;padding:12px;
text-align:center;font-weight:bold;
}
</style>
</head>
<body>
<div class="container">
<div class="title">SHINE SHOP</div>
<div class="board">NMID : ID2024361141748</div>

<div class="input-area">
<input type="number" id="nominal" placeholder="Masukkan nominal">
<button onclick="generateQRIS()">Generate</button>
</div>

<div class="qrframe">
<div id="qrcode"></div>
<img class="logo" src="/home/logo.png">
</div>

<div class="footer">SATU QRIS UNTUK SEMUA</div>
</div>

<script>
const qrisStatis="00020101021126670016COM.NOBUBANK.WWW01189360050300000879140214526036770909650303UMI51440014ID.CO.QRIS.WWW0215ID20243611417480303UMI5204541153033605802ID5920SHINE SHOP OK19967206008SURABAYA61056011162070703A0163041008";

function crc16(str){
let crc=0xFFFF;
for(let c=0;c<str.length;c++){
crc^=str.charCodeAt(c)<<8;
for(let i=0;i<8;i++){
crc=((crc&0x8000)!==0)?((crc<<1)^0x1021):(crc<<1);
crc&=0xFFFF;
}}
return crc.toString(16).toUpperCase().padStart(4,'0');
}

function makeDynamicQRIS(qris,amount){
qris=qris.replace("010211","010212");
const amountTag="54"+String(amount).length.toString().padStart(2,"0")+amount;
qris=qris.replace("5802ID",amountTag+"5802ID");
qris=qris.substring(0,qris.length-4);
const crc=crc16(qris+"6304");
return qris+"6304"+crc;
}

function generateQRIS(){
const nominal=document.getElementById("nominal").value||"1000";
const payload=makeDynamicQRIS(qrisStatis,nominal);
document.getElementById("qrcode").innerHTML="";
new QRCode(document.getElementById("qrcode"),{
text:payload,width:300,height:300,
correctLevel:QRCode.CorrectLevel.H
});
}
generateQRIS();
</script>
</body>
</html>
