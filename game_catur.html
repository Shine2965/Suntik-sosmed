<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cek Status Transaksi - ShineShop</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f9ff;
      padding: 20px;
    }
    .card {
      background: #fff;
      padding: 20px;
      max-width: 400px;
      margin: auto;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      border: 1px solid #ddd;
    }
    button {
      background: #007bff;
      color: #fff;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    pre {
      background: #f0f0f0;
      padding: 10px;
      border-radius: 6px;
      margin-top: 15px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Cek Status Pesanan</h2>
    <form id="cekForm">
      <input type="text" id="order_id" placeholder="Masukkan Order ID" required />
      <button type="submit">Cek Status</button>
    </form>
    <div id="hasil"></div>
  </div>

  <script>
    document.getElementById("cekForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const orderId = document.getElementById("order_id").value;
      document.getElementById("hasil").innerHTML = "⏳ Mengecek...";

      try {
        const res = await fetch("cek-status.php", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({ order_id: orderId })
        });

        const data = await res.json();
        if (data.response) {
          document.getElementById("hasil").innerHTML = `
            <pre>
ID Pesanan   : ${data.data.id}
Harga        : Rp${data.data.price}
Status       : ${data.data.status}
Start Count  : ${data.data.start_count}
Sisa         : ${data.data.remains}
            </pre>`;
        } else {
          document.getElementById("hasil").innerHTML = `<pre>❌ Error: ${data.error || "Gagal cek status"}\nRaw: ${data.raw || ""}</pre>`;
        }
      } catch (err) {
        document.getElementById("hasil").innerHTML = `<pre>❌ Error JS: ${err.message}</pre>`;
      }
    });
  </script>
</body>
</html>
