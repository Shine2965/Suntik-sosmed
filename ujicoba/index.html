<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riwayat Pesanan</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      padding: 20px;
      margin: 0;
    }
    .container {
      max-width: 500px;
      margin: 40px auto;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    h1 { text-align: center; }

    input, select {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    .card {
      padding: 15px;
      border-radius: 10px;
      background: #f9f9f9;
      margin-bottom: 10px;
      border-left: 5px solid #ccc;
    }

    .status { font-weight: bold; }
    .success { color: green; }
    .process { color: orange; }
    .pending { color: #888; }
    .failed { color: red; }

    .refresh-info {
      text-align: center;
      font-size: 12px;
      color: #666;
      margin-bottom: 10px;
    }

    .nav { text-align: center; margin-top: 15px; }
    .nav a { color: #007bff; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Riwayat Pesanan</h1>

    <div class="refresh-info">🔄 Auto refresh setiap 5 detik</div>

    <!-- 🔍 SEARCH -->
    <input type="text" id="searchId" placeholder="Cari ID Transaksi..." oninput="tampilkanRiwayat()">

    <!-- 🔽 FILTER -->
    <select id="filterStatus" onchange="tampilkanRiwayat()">
      <option value="semua">Semua Status</option>
      <option value="sukses">Sukses</option>
      <option value="pending">Pending</option>
      <option value="proses">Proses</option>
      <option value="gagal">Gagal</option>
    </select>

    <div id="hasil"></div>

    <div class="nav">
      <p>⬅️ <a href="/home/">Kembali ke Pemesanan</a></p>
    </div>
  </div>

  <script>
    let dataPesanan = {};

    async function loadData() {
      try {
        const res = await fetch('/riwayat/data.json?t=' + Date.now()); // anti cache
        dataPesanan = await res.json();
        tampilkanRiwayat();
      } catch (err) {
        console.error("Gagal load data:", err);
      }
    }

    function tampilkanRiwayat() {
      const hasil = document.getElementById("hasil");
      const filter = document.getElementById("filterStatus").value;
      const search = document.getElementById("searchId").value.trim().toUpperCase();
      const userId = localStorage.getItem("user_id");

      if (!userId) {
        hasil.innerHTML = `<p style="color:red;">❌ User tidak ditemukan</p>`;
        return;
      }

      hasil.innerHTML = "";
      let ditemukan = false;

      for (let id in dataPesanan) {
        let item = dataPesanan[id];

        if (item.userid !== userId) continue;

        if (search && !id.includes(search)) continue;

        if (filter !== "semua" && item.status.toLowerCase() !== filter) continue;

        ditemukan = true;

        let statusClass = "";
        switch(item.status.toLowerCase()) {
          case "sukses": statusClass = "success"; break;
          case "proses": statusClass = "process"; break;
          case "pending": statusClass = "pending"; break;
          case "gagal": statusClass = "failed"; break;
        }

        hasil.innerHTML += `
          <div class="card">
            <p>📌 ID: <b>${id}</b></p>
            <p>🛒 Produk: ${item.produk}</p>
            <p>#️⃣ Jumlah order: ${item.jumlah}</p>
            <p>🗓️ Waktu order: ${item.waktu}</p>
            <p class="status ${statusClass}">📦 Status: ${item.status}</p>
            <p>✉️ Pesan dari admin: ${item.pesan}</p>
          </div>
        `;
      }

      if (!ditemukan) {
        hasil.innerHTML = `<p style="color:red;">❌ Data tidak ditemukan</p>`;
      }
    }

    // 🚀 INITIAL LOAD
    loadData();

    // 🔄 AUTO REFRESH tiap 5 detik
    setInterval(() => {
      loadData();
    }, 5000);
  </script>
</body>
</html>
