<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shine Shop</title>

<link rel="icon" href="/home/logo.png" type="image/png">
<link rel="shortcut icon" href="/home/logo.png" type="image/png">
<link rel="apple-touch-icon" href="/home/logo.png">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:'Poppins',sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    linear-gradient(rgba(0,0,0,0.75),rgba(0,0,0,0.75)),
    url('/home/logo.png') center/cover no-repeat fixed;
  color:white;
}

.container{
  width:90%;
  max-width:480px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(10px);
  border-radius:18px;
  padding:35px 25px;
  text-align:center;
  border:1px solid rgba(255,255,255,0.1);
}

h1{
  font-size:22px;
  font-weight:600;
  margin-bottom:30px;
  letter-spacing:1px;
}

.nav-btn{
  width:100%;
  padding:14px;
  margin:10px 0;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.15);
  background:rgba(255,255,255,0.08);
  color:white;
  font-size:14px;
  font-weight:500;
  cursor:pointer;
  transition:0.25s;
}

.nav-btn:hover{
  background:rgba(255,255,255,0.18);
}

.footer{
  margin-top:25px;
  font-size:12px;
  opacity:0.6;
}

/* USER BUBBLE */
.user-bubble{
  position:fixed;
  bottom:20px;
  right:20px;
  background:rgba(0,0,0,0.85);
  color:white;
  padding:12px 16px;
  border-radius:12px;
  font-size:13px;
  box-shadow:0 5px 20px rgba(0,0,0,0.4);
  opacity:0;
  transform:translateY(20px);
  transition:0.3s;
  z-index:9999;
}

.user-bubble.show{
  opacity:1;
  transform:translateY(0);
}

/* POPUP PESAN */
#pesanModal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:10000;
}

#pesanModal .box{
  background:#111;
  padding:25px;
  border-radius:15px;
  width:90%;
  max-width:400px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,0.5);
}

#pesanModal button{
  margin-top:15px;
  padding:10px 15px;
  border:none;
  border-radius:8px;
  background:#4caf50;
  color:white;
  cursor:pointer;
  font-weight:500;
}
</style>
</head>

<body>

<div class="container">

<h1>Shine Shop Suntik Sosmed</h1>

<button class="nav-btn" onclick="location.href='/global/'">🛒 Belanja</button>
<button class="nav-btn" onclick="location.href='/sewaweb/'">🌐 Sewa Website</button>
<button class="nav-btn" onclick="location.href='/testimoni/'">📈 Testimoni</button>
<button class="nav-btn" onclick="location.href='/riwayat/'">Riwayat Transaksi</button>
<button class="nav-btn" onclick="location.href='/cekakses/'">🔥 Cek Akses</button>
<button class="nav-btn" onclick="location.href='/aboutowner/'">🏆 Tentang Owner</button>
<button class="nav-btn" onclick="location.href='https://store.shinedomain.my.id'">📰 Informasi</button>
<button class="nav-btn" onclick="location.href='https://t.me/shineshoipbot'">💬 Customer Service ( Aktif )</button>
<button class="nav-btn" onclick="location.href='https://t.me/+2XtBryTgizU4MDQ1'">Grup Telegram</button>
<button class="nav-btn" onclick="location.href='/scammer/'">List scammer</button>

<div class="footer">
©Shine Shop - 2023
</div>

</div>

<!-- USER BUBBLE -->
<div id="userBubble" class="user-bubble"></div>

<!-- POPUP PESAN -->
<div id="pesanModal">
  <div class="box">
    <h3>📩 Pesan Baru</h3>
    <p id="isiPesan" style="margin-top:10px;"></p>
    <button onclick="tutupPesan()">Pesan Telah Dibaca</button>
  </div>
</div>

<script>

// USER ID
function generateUserID(){
  return 'user-' + Math.random().toString(36).substring(2,10) + '-' + Date.now().toString(36);
}

function getUserID(){
  let id = localStorage.getItem("user_id");
  if(!id){
    id = generateUserID();
    localStorage.setItem("user_id", id);
  }
  return id;
}

const userID = getUserID();

// USER BUBBLE
function showUserBubble(){
  const bubble = document.getElementById("userBubble");
  bubble.innerHTML = `<b>Selamat Datang <br> User ID:</b><br>${userID}`;
  setTimeout(()=>{ bubble.classList.add("show"); },500);
  setTimeout(()=>{ bubble.classList.remove("show"); },5500);
}

// CEK PESAN
async function cekPesan(){
  try{
    const response = await fetch('/home2/pesan.json');
    const data = await response.json();

    if(data.UserID === userID){

      if(localStorage.getItem("pesan_dibaca_" + userID)){
        return;
      }

      document.getElementById("isiPesan").innerText = data.Pesan;
      document.getElementById("pesanModal").style.display = "flex";
    }

  }catch(err){
    console.log("Tidak ada pesan.");
  }
}

function tutupPesan(){
  localStorage.setItem("pesan_dibaca_" + userID, "true");
  document.getElementById("pesanModal").style.display = "none";
}

window.addEventListener("load", ()=>{
  showUserBubble();
  cekPesan();
});

</script>

</body>
</html>
