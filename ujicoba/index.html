<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cloudflare Block List</title>

<style>
body{
    font-family:Arial;
    background:#111;
    color:#fff;
}

table{
    width:100%;
    border-collapse:collapse;
}

td,th{
    padding:10px;
    border:1px solid #333;
}

button{
    padding:8px 15px;
    cursor:pointer;
}
</style>

</head>
<body>

<h2>Blocked IP</h2>

<table>

<thead>

<tr>
<th>IP</th>
<th>Mode</th>
<th>Reason</th>
<th>Aksi</th>
</tr>

</thead>

<tbody id="list"></tbody>

</table>

<script>

async function load(){

const res = await fetch("/api/list-block");
const data = await res.json();

let html = "";

data.forEach(x=>{

const reason =
    x.notes ||
    x.description ||
    x.comment ||
    "-";

html += `
<tr>

<td>${x.configuration.value}</td>

<td>${x.mode}</td>

<td>${reason}</td>

<td>

<button onclick="hapus('${x.id}')">
Hapus
</button>

</td>

</tr>
`;

});

document.getElementById("list").innerHTML = html;

}

async function hapus(id){

if(!confirm("Hapus blokir IP?")) return;

await fetch("/api/unblock",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
id
})

});

load();

}

load();

</script>

</body>
</html>
