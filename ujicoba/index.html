<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shine Shop</title><link rel="icon" href="/home/logo.png" type="image/png">
<link rel="shortcut icon" href="/home/logo.png" type="image/png">
<link rel="apple-touch-icon" href="/home/logo.png"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Poppins',sans-serif;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(rgba(0,0,0,0.75),rgba(0,0,0,0.75)),url('/home/logo.png') center/cover no-repeat fixed;
  color:white;
}
.container{
  width:90%;
  max-width:480px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(10px);
  border-radius:18px;
  padding:35px 25px;
  text-align:center;
  border:1px solid rgba(255,255,255,0.1);
}
h1{font-size:22px;font-weight:600;margin-bottom:30px;}
.nav-btn{
  width:100%;padding:14px;margin:10px 0;border-radius:12px;
  border:1px solid rgba(255,255,255,0.15);
  background:rgba(255,255,255,0.08);
  color:white;font-size:14px;font-weight:500;cursor:pointer;
  transition:0.25s;
}
.nav-btn:hover{background:rgba(255,255,255,0.18);}
.footer{margin-top:25px;font-size:12px;opacity:0.6;}
.user-bubble{
  position:fixed;bottom:20px;right:20px;
  background:rgba(0,0,0,0.85);
  padding:12px 16px;border-radius:12px;
  font-size:13px;z-index:9999;
}
</style></head><body><div class="container">
<h1>Shine Shop Suntik Sosmed</h1><button class="nav-btn" onclick="location.href='/global/'">🛒 Belanja</button> <button class="nav-btn" onclick="location.href='/sewaweb/'">🌐 Sewa Website</button> <button class="nav-btn" onclick="location.href='/testimoni/'">📈 Testimoni</button> <button class="nav-btn" onclick="location.href='/riwayat/'">Riwayat Transaksi</button> <button class="nav-btn" onclick="location.href='/cekakses/'">🔥 Cek Akses</button> <button class="nav-btn" onclick="location.href='/aboutowner/'">🏆 Tentang Owner</button> <button class="nav-btn" onclick="location.href='/kontaksmm/'">✉️ Customer Service</button>

<div class="footer">©Shine Shop - 2023</div>
</div><div id="userBubble" class="user-bubble"></div><script>
// USER ID
function generateUserID(){
  return 'user-'+Math.random().toString(36).substring(2,10)+'-'+Date.now().toString(36);
}
function getUserID(){
  let id=localStorage.getItem("user_id");
  if(!id){id=generateUserID();localStorage.setItem("user_id",id);}return id;
}
const userID=getUserID();

// USER BUBBLE
function showUserBubble(){
  const bubble=document.getElementById("userBubble");
  bubble.innerHTML="<b>User ID:</b><br>"+userID;
}
window.onload=showUserBubble;

// CEK PESAN + SWEETALERT
async function cekPesan(){
  try{
    const res=await fetch("/home2/pesan.json?cache="+Date.now());
    const data=await res.json();

    if(data[userID]){
      Swal.fire({
        title:'📩 Pesan Baru',
        html:'<b>UserID:</b><br>'+userID+'<br><br><b>Pesan:</b><br>'+data[userID],
        icon:'info',
        confirmButtonText:'Tutup'
      });
    }else if(data["all"]){
      Swal.fire({
        title:'📢 Pengumuman',
        html:data["all"],
        icon:'warning',
        confirmButtonText:'Tutup'
      });
    }

  }catch(e){console.log("Tidak ada pesan.");}
}

window.addEventListener("load",cekPesan);
</script></body>
</html>
