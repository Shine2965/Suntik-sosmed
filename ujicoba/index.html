<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riwayat Pesanan</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      padding: 20px;
      margin: 0;
    }
    .container {
      max-width: 500px;
      margin: 40px auto;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    h1 { text-align: center; }

    .result {
      margin-top: 15px;
    }

    .card {
      padding: 15px;
      border-radius: 10px;
      background: #f9f9f9;
      margin-bottom: 10px;
      border-left: 5px solid #ccc;
    }

    .status { font-weight: bold; }
    .success { color: green; }
    .process { color: orange; }
    .pending { color: #888; }
    .failed { color: red; }

    .nav { text-align: center; margin-top: 15px; }
    .nav a { color: #007bff; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Riwayat Pesanan Kamu</h1>

    <div id="hasil" class="result"></div>

    <div class="nav">
      <p>⬅️ <a href="/home/">Kembali ke Pemesanan</a></p>
    </div>
  </div>

  <script>
    let dataPesanan = {};

    async function loadData() {
      try {
        const res = await fetch('/riwayat/data.json');
        dataPesanan = await res.json();

        tampilkanRiwayat();
      } catch (err) {
        console.error("Gagal load data:", err);
      }
    }

    function tampilkanRiwayat() {
      const hasil = document.getElementById("hasil");

      // Ambil user_id dari localStorage
      const userId = localStorage.getItem("user_id");

      if (!userId) {
        hasil.innerHTML = `<p style="color:red;">❌ User tidak ditemukan. Silakan login ulang.</p>`;
        return;
      }

      let ditemukan = false;
      hasil.innerHTML = "";

      // Loop semua data
      for (let id in dataPesanan) {
        let item = dataPesanan[id];

        if (item.userid === userId) {
          ditemukan = true;

          let statusClass = "";
          switch(item.status.toLowerCase()) {
            case "sukses": statusClass = "success"; break;
            case "proses": statusClass = "process"; break;
            case "pending": statusClass = "pending"; break;
            case "gagal": statusClass = "failed"; break;
          }

          hasil.innerHTML += `
            <div class="card">
              <p>📌 ID: <b>${id}</b></p>
              <p>🛒 Produk: ${item.produk}</p>
              <p>#️⃣ Jumlah: ${item.jumlah}</p>
              <p>🗓️ Waktu: ${item.waktu}</p>
              <p class="status ${statusClass}">📦 Status: ${item.status}</p>
              <p>✉️ Pesan: ${item.pesan}</p>
            </div>
          `;
        }
      }

      if (!ditemukan) {
        hasil.innerHTML = `<p style="color:red;">❌ Tidak ada riwayat transaksi untuk akun ini.</p>`;
      }
    }

    loadData();

    /* 🚫 ANTI INSPECT */
    document.addEventListener("contextmenu",e=>e.preventDefault());
    document.addEventListener("keydown",function(e){
      if(e.key==="F12") e.preventDefault();
      if(e.ctrlKey&&e.shiftKey&&["I","C","J"].includes(e.key)) e.preventDefault();
      if(e.ctrlKey&&e.key==="u") e.preventDefault();
    });

    setInterval(()=>{
      if(window.outerWidth-window.innerWidth>160||window.outerHeight-window.innerHeight>160){
        document.body.innerHTML="<h1 style='color:gold;text-align:center;margin-top:40vh;'>🚫 Developer Tools Terdeteksi</h1>";
      }
    },1000);

    setInterval(()=>{console.clear();},1000);
    setInterval(()=>{debugger;},3000);

  </script>
</body>
</html>
