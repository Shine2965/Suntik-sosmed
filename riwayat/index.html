<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riwayat Pesanan</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      padding: 20px;
      margin: 0;
    }
    .container {
      max-width: 500px;
      margin: 40px auto;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    h1 { text-align: center; }
    input, button {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background: #0056b3; }
    .result {
      margin-top: 15px;
      padding: 15px;
      border-radius: 8px;
      background: #f9f9f9;
      display: none;
    }
    .status { font-weight: bold; font-size: 15px; }
    .success { color: green; }
    .process { color: orange; }
    .pending { color: #888; }
    .failed { color: red; }
    .nav { text-align: center; margin-top: 15px; }
    .nav a { color: #007bff; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Cek Riwayat Pesanan</h1>

    <input type="text" id="transaksiId" placeholder="Masukkan ID Transaksi">
    <button onclick="cekStatus()">Cek Status</button>

    <div id="hasil" class="result"></div>

    <div class="nav">
      <p>⬅️ <a href="/home/">Kembali ke Pemesanan</a></p>
    </div>
  </div>

  <script>
    let dataPesanan = {};

    // Load data JSON
    async function loadData() {
      try {
        const res = await fetch('/riwayat/data.json');
        dataPesanan = await res.json();
      } catch (err) {
        console.error("Gagal load data:", err);
      }
    }

    // Jalankan saat halaman dibuka
    loadData();

    function cekStatus() {
      const inputId = document.getElementById("transaksiId").value.trim().toUpperCase();
      const hasil = document.getElementById("hasil");

      if (!inputId) {
        hasil.style.display = "block";
        hasil.innerHTML = `<p style="color:red;">❌ Masukkan ID Transaksi dulu!</p>`;
        return;
      }

      if (dataPesanan[inputId]) {
        let statusClass = "";
        switch(dataPesanan[inputId].status.toLowerCase()) {
          case "sukses": statusClass = "success"; break;
          case "proses": statusClass = "process"; break;
          case "pending": statusClass = "pending"; break;
          case "gagal": statusClass = "failed"; break;
        }

        hasil.style.display = "block";
        hasil.innerHTML = `
          <p>📌 ID Transaksi: <b>${inputId}</b></p>
          <p>🛒 Produk: ${dataPesanan[inputId].produk}</p>
          <p>#️⃣ Jumlah: ${dataPesanan[inputId].jumlah}</p>
          
          <p class="status ${statusClass}">📦 Status: ${dataPesanan[inputId].status}</p>
        `;
      } else {
        hasil.style.display = "block";
        hasil.innerHTML = `<p style="color:red;">❌ ID Transaksi tidak ditemukan!</p>`;
      }
    }
    /* 🚫 ANTI INSPECT */  
document.addEventListener("contextmenu",e=>e.preventDefault());  
document.addEventListener("keydown",function(e){  
if(e.key==="F12") e.preventDefault();  
if(e.ctrlKey&&e.shiftKey&&["I","C","J"].includes(e.key)) e.preventDefault();  
if(e.ctrlKey&&e.key==="u") e.preventDefault();  
});  
  
setInterval(()=>{  
if(window.outerWidth-window.innerWidth>160||window.outerHeight-window.innerHeight>160){  
document.body.innerHTML="<h1 style='color:gold;text-align:center;margin-top:40vh;'>🚫 Developer Tools Terdeteksi</h1>";  
}  
},1000);  
  
setInterval(()=>{console.clear();},1000);  
setInterval(()=>{debugger;},3000);  
  
  </script>
</body>
</html>
