<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riwayat Pesanan</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      padding: 20px;
      margin: 0;
    }
    .container {
      max-width: 500px;
      margin: 40px auto;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    h1 { text-align: center; }

    input, select {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    .card {
      padding: 15px;
      border-radius: 10px;
      background: #f9f9f9;
      margin-bottom: 10px;
      border-left: 5px solid #ccc;
    }

    .status { font-weight: bold; }
    .success { color: green; }
    .process { color: orange; }
    .pending { color: #888; }
    .dibatalkan { color: red; }

    .refresh-info {
      text-align: center;
      font-size: 12px;
      color: #666;
      margin-bottom: 10px;
    }

    .nav { text-align: center; margin-top: 15px; }
    .nav a { color: #007bff; text-decoration: none; font-weight: bold; }

    .user-info {
      background: #e8f0fe;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 14px;
      color: #333;
      border-left: 4px solid #007bff;
    }
    .user-info .label { font-weight: 600; color: #555; }
    .user-info .value { color: #007bff; font-weight: 600; word-break: break-all; }
    .user-info .value.not-set { color: #ff4444; font-style: italic; }

    .statistik {
      margin: 15px 0;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 10px;
      border: 1px solid #ddd;
    }
    .statistik h3 { margin-top: 0; }
    .statistik p { margin: 6px 0; }
    .statistik .total { font-weight: 700; }
    .statistik .sukses { color: green; font-weight: 600; }
    .statistik .proses { color: orange; font-weight: 600; }
    .statistik .pending { color: #888; font-weight: 600; }
    .statistik .batal { color: red; font-weight: 600; }

    .no-data {
      text-align: center;
      padding: 30px 0;
      color: #888;
      font-size: 16px;
    }

    .gmail-warning {
      background: #fff3cd;
      border: 1px solid #ffc107;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 15px;
      color: #856404;
      font-size: 14px;
      text-align: center;
    }
    .gmail-warning .btn-set-gmail {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 20px;
      background: #007bff;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      text-decoration: none;
    }
    .gmail-warning .btn-set-gmail:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>

<script>
// ================= USER ID RANDOM =================
function generateUserID(){
  return 'user-' + Math.random().toString(36).substring(2,10) + '-' + Date.now().toString(36);
}

async function getUserID(){
  let id = localStorage.getItem("user_id");
  if(!id){
    id = generateUserID();
    localStorage.setItem("user_id", id);
  }
  return id;
}

// ================= USER BAN =================
async function checkUserBan(){
  try{
    const userID = await getUserID();
    const res = await fetch("/sosmed-2/payment/user.json",{cache:"no-store"});
    if(!res.ok) return;
    const list = await res.json();
    const banned = list.find(x => x.user === userID);
    if(banned){
      const reason = banned.reason || "Tidak ada keterangan";
      document.body.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:center;height:100vh;background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);color:white;text-align:center;">
      <div style="max-width:420px;background:rgba(255,255,255,.12);padding:30px;border-radius:22px;">
      <h1>🚫 Akses Diblokir</h1>
      <p>Akun kamu diblokir</p>
      <div>${reason}</div>
      <br>
      <small>User ID: ${userID}</small>
      </div></div>`;
      throw new Error("USER_BANNED");
    }
  }catch(e){
    if(e.message === "USER_BANNED") throw e;
  }
}
checkUserBan();
</script>

<body>
  <div class="container">
    <h1>📋 Riwayat Pesanan</h1>
    
    <!-- ===== USER INFO (GMAIL dari LOCAL STORAGE) ===== -->
    <div class="user-info" id="userInfoContainer">
      <span class="label">📧 Gmail:</span>
      <span class="value" id="userGmailDisplay">Memuat...</span>
    </div>

    <p style="font-size:12px;color:#888;text-align:center;">⚠️ DATA RIWAYAT TRANSAKSI AKAN DI RESET SETIAP BULAN NAMUN DATA TETAP TERSIMPAN DI DATABASE ADMIN</p>
    
    <div class="refresh-info">🔄 Auto refresh setiap 5 detik</div>

    <!-- 🔍 SEARCH GLOBAL -->
    <input type="text" id="searchId" placeholder="Cari ID Transaksi (global)..." oninput="tampilkanRiwayat()">

    <!-- 🔽 FILTER -->
    <select id="filterStatus" onchange="tampilkanRiwayat()">
      <option value="semua">Semua Status</option>
      <option value="sukses">Sukses</option>
      <option value="pending">Pending</option>
      <option value="proses">Proses</option>
      <option value="dibatalkan">Dibatalkan</option>
    </select>

    <!-- ===== STATISTIK ===== -->
    <div class="statistik" id="statistikContainer">
      <h3>📊 Statistik Transaksi</h3>
      <p>📦 Total Transaksi : <b id="totalTransaksi">0</b></p>
      <p class="sukses">✅ Sukses : <b id="totalSukses">0</b></p>
      <p class="proses">🟠 Proses : <b id="totalProses">0</b></p>
      <p class="pending">⏳ Pending : <b id="totalPending">0</b></p>
      <p class="batal">❌ Dibatalkan : <b id="totalBatal">0</b></p>
    </div>

    <div id="hasil"></div>

    <div class="nav">
      <p>⬅️ <a href="/sosmed-2/">Kembali ke Pemesanan</a></p>
    </div>
  </div>

  <script>
// ============================================================
// 🔒 AMBIL GMAIL DARI LOCAL STORAGE
// ============================================================
function getStoredGmail() {
  return localStorage.getItem('user_gmail') || null;
}

function validateEmail(email) {
  return email && email.includes('@') && email.includes('.') && email.length > 5;
}

// Tampilkan Gmail di header
function displayUserGmail() {
  const displayEl = document.getElementById('userGmailDisplay');
  const gmail = getStoredGmail();
  if (gmail && validateEmail(gmail)) {
    displayEl.textContent = gmail;
    displayEl.className = 'value';
  } else {
    displayEl.textContent = '⚠️ Gmail belum diatur!';
    displayEl.className = 'value not-set';
  }
}

// ============================================================
// 🔒 AMBIL DATA RIWAYAT
// ============================================================
let dataPesanan = {};
let userGmail = '';

async function loadData() {
  try {
    const files = [
      "/riwayat/data.json",
      "/riwayat/data-juli-2026.json",
      "/riwayat/agustus2026.json"
    ];

    const responses = await Promise.all(
      files.map(file => fetch(file + "?t=" + Date.now()))
    );

    const jsons = await Promise.all(
      responses.map(res => res.ok ? res.json() : {})
    );

    dataPesanan = {};
    jsons.forEach(data => {
      Object.assign(dataPesanan, data);
    });

    // Update Gmail terbaru
    userGmail = getStoredGmail();
    displayUserGmail();

    hitungStatistik();
    tampilkanRiwayat();

  } catch (err) {
    console.error("Gagal memuat data:", err);
  }
}

// ============================================================
// 🔒 TAMPILKAN RIWAYAT (FILTER BERDASARKAN GMAIL)
// ============================================================
function tampilkanRiwayat() {
  const hasil = document.getElementById("hasil");
  const filter = document.getElementById("filterStatus").value;
  const search = document.getElementById("searchId").value.trim().toUpperCase();
  const userGmail = getStoredGmail();

  hasil.innerHTML = "";
  let ditemukan = false;
  let totalItem = 0;

  // Jika Gmail belum diatur, tampilkan pesan
  if (!userGmail || !validateEmail(userGmail)) {
    hasil.innerHTML = `
      <div class="gmail-warning">
        ⚠️ Gmail belum diatur. Silakan atur Gmail di halaman utama terlebih dahulu.
        <br>
        <a href="/" class="btn-set-gmail">🏠 Kembali ke Halaman Utama</a>
      </div>
    `;
    return;
  }

  for (let id in dataPesanan) {
    let item = dataPesanan[id];

    // 🔍 MODE SEARCH GLOBAL (bisa cari semua transaksi)
    if (search) {
      if (!id.includes(search)) continue;
    } else {
      // 👤 MODE NORMAL (filter berdasarkan Gmail)
      // Cek apakah item memiliki Gmail yang cocok
      const itemGmail = item.gmail || item.Gmail || item.email || '';
      if (itemGmail.toLowerCase() !== userGmail.toLowerCase()) {
        continue;
      }
    }

    // 🔽 FILTER STATUS
    if (filter !== "semua" && item.status.toLowerCase() !== filter) continue;

    ditemukan = true;
    totalItem++;

    let statusClass = "";
    switch(item.status.toLowerCase()) {
      case "sukses": statusClass = "success"; break;
      case "proses": statusClass = "process"; break;
      case "pending": statusClass = "pending"; break;
      case "dibatalkan": statusClass = "dibatalkan"; break;
    }

    hasil.innerHTML += `
      <div class="card">
        <p>📌 ID: <b>${id}</b></p>
        <p>🛒 Produk: ${item.produk || '-'}</p>
        <p>#️⃣ Jumlah: ${item.jumlah || '-'}</p>
        <p>🗓️ Waktu: ${item.waktu || '-'}</p>
        <p class="status ${statusClass}">📦 Status: ${item.status || '-'}</p>
        <p>✉️ Pesan: ${item.pesan || '-'}</p>
        ${item.gmail ? `<p style="font-size:11px;color:#888;">📧 ${item.gmail}</p>` : ''}
      </div>
    `;
  }

  if (!ditemukan) {
    if (search) {
      hasil.innerHTML = `<div class="no-data">🔍 Tidak ada transaksi dengan ID <b>"${search}"</b></div>`;
    } else {
      hasil.innerHTML = `<div class="no-data">📭 Belum ada transaksi untuk Gmail <b>${userGmail}</b></div>`;
    }
  } else {
    // Tambahkan informasi total ditemukan
    const infoEl = document.createElement('div');
    infoEl.style.cssText = 'text-align:center;font-size:13px;color:#666;margin-top:8px;';
    infoEl.textContent = `📊 Menampilkan ${totalItem} transaksi`;
    hasil.appendChild(infoEl);
  }
}

// ============================================================
// 🔒 HITUNG STATISTIK (BERDASARKAN GMAIL USER)
// ============================================================
function hitungStatistik() {
  const userGmail = getStoredGmail();
  let total = 0;
  let sukses = 0;
  let proses = 0;
  let pending = 0;
  let batal = 0;

  for (let id in dataPesanan) {
    const item = dataPesanan[id];
    const itemGmail = item.gmail || item.Gmail || item.email || '';

    // Hanya hitung transaksi milik user
    if (userGmail && validateEmail(userGmail)) {
      if (itemGmail.toLowerCase() !== userGmail.toLowerCase()) {
        continue;
      }
    } else {
      // Jika Gmail belum diatur, tampilkan 0
      break;
    }

    total++;

    switch ((item.status || "").toLowerCase()) {
      case "sukses": sukses++; break;
      case "proses": proses++; break;
      case "pending": pending++; break;
      case "dibatalkan": batal++; break;
    }
  }

  document.getElementById("totalTransaksi").textContent = total;
  document.getElementById("totalSukses").textContent = sukses;
  document.getElementById("totalProses").textContent = proses;
  document.getElementById("totalPending").textContent = pending;
  document.getElementById("totalBatal").textContent = batal;
}

// ============================================================
// 🔄 AUTO REFRESH
// ============================================================
loadData();
setInterval(() => {
  loadData();
}, 5000);

// ============================================================
// 🔒 ANTI DEVTOOLS
// ============================================================
document.addEventListener("keydown", function(e){
  if(e.key === "F12") e.preventDefault();
  if(e.ctrlKey && e.shiftKey && ["I","C","J"].includes(e.key)) e.preventDefault();
  if(e.ctrlKey && e.key === "u") e.preventDefault();
});

setInterval(() => {
  const threshold = 160;
  if (window.devtoolsOpen) return;
  const widthThreshold = window.outerWidth - window.innerWidth > threshold;
  if (widthThreshold && !/Android|iPhone|iPad/i.test(navigator.userAgent)) {
    document.body.innerHTML =
      "<h1 style='color:gold;text-align:center;margin-top:40vh;'>🚫 Developer Tools Terdeteksi</h1>";
  }
}, 2000);

console.log('📋 Riwayat Pesanan siap!');
console.log('📧 Gmail user:', getStoredGmail());
  </script>
</body>
</html>
