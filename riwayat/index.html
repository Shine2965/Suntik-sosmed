<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riwayat Pesanan</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      padding: 20px;
      margin: 0;
    }
    .container {
      max-width: 500px;
      margin: 40px auto;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    h1 { text-align: center; }

    input, select {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    .card {
      padding: 15px;
      border-radius: 10px;
      background: #f9f9f9;
      margin-bottom: 10px;
      border-left: 5px solid #ccc;
    }

    .status { font-weight: bold; }
    .success { color: green; }
    .process { color: orange; }
    .pending { color: #888; }
    .dibatalkan { color: red; }

    .refresh-info {
      text-align: center;
      font-size: 12px;
      color: #666;
      margin-bottom: 10px;
    }

    .nav { text-align: center; margin-top: 15px; }
    .nav a { color: #007bff; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>
  <div id="statistik" style="
margin:15px 0;
padding:15px;
background:#f8f9fa;
border-radius:10px;
border:1px solid #ddd;
">
  <h3 style="margin-top:0;">📊 Statistik Transaksi Shine Shop</h3>

  <p>📦 Total Transaksi : <b id="totalTransaksi">0</b></p>
  <p style="color:green;">✅ Sukses : <b id="totalSukses">0</b></p>
  <p style="color:orange;">🟠 Proses : <b id="totalProses">0</b></p>
  <p style="color:#666;">⏳ Pending : <b id="totalPending">0</b></p>
  <p style="color:red;">❌ Dibatalkan : <b id="totalBatal">0</b></p>
  </div>
  
  <div class="container">
    <h1>Riwayat Pesanan</h1>
<p> DATA RIWAYAT TRANSAKSI AKAN DI RESET SETIAP BULAN NAMUN DATA TRANSAKSI TETAP TERSIMPAN DI DATABASE ADMIN</p>
    <div class="refresh-info">🔄 Auto refresh setiap 5 detik</div>

    <!-- 🔍 SEARCH GLOBAL -->
    <input type="text" id="searchId" placeholder="Cari ID Transaksi (global)..." oninput="tampilkanRiwayat()">

    <!-- 🔽 FILTER -->
    <select id="filterStatus" onchange="tampilkanRiwayat()">
      <option value="semua">Semua Status</option>
      <option value="sukses">Sukses</option>
      <option value="pending">Pending</option>
      <option value="proses">Proses</option>
      <option value="dibatalkan">Dibatalkan</option>
    </select>

    <div id="hasil"></div>

    <div class="nav">
      <p>⬅️ <a href="index.html">Kembali ke Pemesanan</a></p>
    </div>
  </div>

  <script>
 let dataPesanan = {};

async function loadData() {
  try {

    const files = [
      "/riwayat/data.json",
      "/riwayat/data-juli-2026.json"
      // Tambahkan file lain di sini jika ada
      // "/riwayat/data-agustus-2026.json",
      // "/riwayat/data-september-2026.json"
    ];

    const responses = await Promise.all(
      files.map(file => fetch(file + "?t=" + Date.now()))
    );

    const jsons = await Promise.all(
      responses.map(res => res.ok ? res.json() : {})
    );

    // Gabungkan seluruh data
    dataPesanan = {};

    jsons.forEach(data => {
      Object.assign(dataPesanan, data);
    });

    hitungStatistik();
    tampilkanRiwayat();

  } catch (err) {
    console.error("Gagal memuat data:", err);
  }
}
    function tampilkanRiwayat() {
      const hasil = document.getElementById("hasil");
      const filter = document.getElementById("filterStatus").value;
      const search = document.getElementById("searchId").value.trim().toUpperCase();
      const userId = localStorage.getItem("user_id");

      hasil.innerHTML = "";
      let ditemukan = false;

      for (let id in dataPesanan) {
        let item = dataPesanan[id];

        // 🔍 MODE SEARCH GLOBAL
        if (search) {
          if (!id.includes(search)) continue;
        } else {
          // 👤 MODE NORMAL (berdasarkan user)
          if (item.userid !== userId) continue;
        }

        // 🔽 FILTER STATUS
        if (filter !== "semua" && item.status.toLowerCase() !== filter) continue;

        ditemukan = true;

        let statusClass = "";
        switch(item.status.toLowerCase()) {
          case "sukses": statusClass = "success"; break;
          case "proses": statusClass = "process"; break;
          case "pending": statusClass = "pending"; break;
          case "dibatalkan": statusClass = "dibatalkan"; break;
        }

        hasil.innerHTML += `
          <div class="card">
            <p>📌 ID: <b>${id}</b></p>
            <p>🛒 Produk: ${item.produk}</p>
            <p>#️⃣ Jumlah: ${item.jumlah}</p>
            <p>🗓️ Waktu: ${item.waktu}</p>
            <p class="status ${statusClass}">📦 Status: ${item.status}</p>
            <p>✉️ Pesan: ${item.pesan}</p>
          </div>
        `;
      }

      if (!ditemukan) {
        hasil.innerHTML = `<p style="color:red;">❌ Data tidak ditemukan</p>`;
      }
    }

    function hitungStatistik() {

  let total = 0;
  let sukses = 0;
  let proses = 0;
  let pending = 0;
  let batal = 0;

  for (let id in dataPesanan) {

    total++;

    switch ((dataPesanan[id].status || "").toLowerCase()) {

      case "sukses":
        sukses++;
        break;

      case "proses":
        proses++;
        break;

      case "pending":
        pending++;
        break;

      case "dibatalkan":
        batal++;
        break;
    }
  }

  document.getElementById("totalTransaksi").textContent = total;
  document.getElementById("totalSukses").textContent = sukses;
  document.getElementById("totalProses").textContent = proses;
  document.getElementById("totalPending").textContent = pending;
  document.getElementById("totalBatal").textContent = batal;
    }
    loadData();

    // 🔄 AUTO REFRESH
    setInterval(() => {
      loadData();
    }, 1000);
    
        document.addEventListener("keydown", function(e){
  // F12
  if(e.key === "F12") e.preventDefault();

  // Ctrl + Shift + I/C/J
  if(e.ctrlKey && e.shiftKey &&
    ["I","C","J"].includes(e.key)) e.preventDefault();

  // Ctrl + U
  if(e.ctrlKey && e.key === "u") e.preventDefault();
});

// Deteksi DevTools (lebih aman, tidak pakai resize hack)
setInterval(() => {
  const threshold = 160;
  if (window.devtoolsOpen) return;

  const widthThreshold = window.outerWidth - window.innerWidth > threshold;

  if (widthThreshold && !/Android|iPhone|iPad/i.test(navigator.userAgent)) {
    document.body.innerHTML =
      "<h1 style='color:gold;text-align:center;margin-top:40vh;'>🚫 Developer Tools Terdeteksi</h1>";
  }
}, 2000);
  </script>
</body>
</html>
