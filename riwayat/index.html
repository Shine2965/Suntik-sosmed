<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riwayat Pesanan</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      padding: 20px;
      margin: 0;
    }
    .container {
      max-width: 500px;
      margin: 40px auto;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    h1 { text-align: center; }
    input, button {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background: #0056b3; }
    .result {
      margin-top: 15px;
      padding: 15px;
      border-radius: 8px;
      background: #f9f9f9;
      display: none;
    }
    .status { font-weight: bold; font-size: 15px; }
    .success { color: green; }
    .process { color: orange; }
    .pending { color: #888; }
    .failed { color: red; }
    .nav { text-align: center; margin-top: 15px; }
    .nav a { color: #007bff; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Cek Riwayat Pesanan</h1>
    <input type="text" id="transaksiId" placeholder="Masukkan ID Transaksi">
    <button onclick="cekStatus()">Cek Status</button>
    <div id="hasil" class="result"></div>

    <div class="nav">
      <p>⬅️ <a href="index.html">Kembali ke Pemesanan</a></p>
    </div>
  </div>

  <script>
    // Data pesanan manual
      const dataPesanan = {
            
                    "TRX1761621398508515": { produk: " 100 Like IG", status: "Sukses" }, 
        "TRX1761896948954185": { produk: " 1K Like tiktok", status: "Sukses" }, 
        "TRX1762081300891594": { produk: " 300 Followers Tiktok ", status: " Sukses" }, 
        "TRX1762163139044381": { produk: " Bug WA", status: "Sukses" }, 
        "TRX1762518266382412": { produk: "155 Followers Tiktok", status: "Sukses" }, 
        "TRX1762527076381944": { produk: " 110 Followers Tiktok", status: "Sukses" }, 
        "TRX1762666830786236": { produk: "100 Followers Tiktok", status: "Sukses" }, 
        "TRX1762754994149125": { produk: " 500 Followers Tiktok", status: "Sukses" },
        "TRX1763026153573764": { produk: "350 Followers IG", status: "Sukses" }, 
        "TRX1763104151116181": { produk: "1K Followers IG", status: "Sukses" },
        "TRX1763245467848820": { produk: "1K Like tiktok", status: "Sukses" }, 
        "TRX1763391387331971": { produk: " 1.2K like tiktok", status: "Sukses " }, 
   "TRX1763429418724872": { produk: " 2K Like Tiktok ", status: "Sukses" }, 
        "TRX1763432073622223": { produk: " 1K Like Tiktok ", status: "Sukses" }, 
        "TRX1763557822659835": { produk: " 500 Followers Tiktok ", status: "Sukses" }, 
        "TRX1763782912284304": { produk: " 250 Followers Tiktok", status: "Sukses" },
        "TRX1764121011723399": { produk: "1K Views Tiktok", status: "Sukses" }, 
        "TRX1764292841819755": { produk: " 10K Views Tiktok ", status: "Sukses" }, 
"TRX1764292178151665": { produk: "20K views tiktok", status: " Sukses" },
        "TRX1764487323906829": { produk: "Tester", status: "Sukses"}
       
        
    };
    
    function cekStatus() {
      const inputId = document.getElementById("transaksiId").value.trim().toUpperCase();
      const hasil = document.getElementById("hasil");

      if (dataPesanan[inputId]) {
        let statusClass = "";
        switch(dataPesanan[inputId].status.toLowerCase()) {
          case "sukses": statusClass = "success"; break;
          case "proses": statusClass = "process"; break;
          case "pending": statusClass = "pending"; break;
          case "gagal": statusClass = "failed"; break;
        }

        hasil.style.display = "block";
        hasil.innerHTML = `
          <p>📌 ID Transaksi: <b>${inputId}</b></p>
          <p>🛒 Produk: ${dataPesanan[inputId].produk}</p>
          <p class="status ${statusClass}">📦 Status: ${dataPesanan[inputId].status}</p>
        `;
      } else {
        hasil.style.display = "block";
        hasil.innerHTML = `<p style="color:red;">❌ ID Transaksi tidak ditemukan!</p>`;
      }
    }
  </script>
</body>
</html>
