<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard — Pencairan Saldo</title>

    <!-- FONT GOOGLE -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            font-family: 'Inter', sans-serif;
            color: white;
        }

        /* HEADER */
        .header {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            padding: 20px;
            text-align: center;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        /* Running Text */
        .marquee {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            box-sizing: border-box;
            background: #0f172a;
            padding: 10px 0;
            font-size: 18px;
            font-weight: 600;
            border-bottom: 1px solid #1e293b;
        }
        .marquee span {
            display: inline-block;
            padding-left: 100%;
            animation: marquee 10s linear infinite;
        }
        @keyframes marquee {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }

        .container {
            max-width: 480px;
            margin: 30px auto;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(16px);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        input, select, button {
            width: 100%;
            margin-top: 12px;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            background: rgba(255,255,255,0.1);
            color: white;
            outline: none;
        }

        .saldo-box {
            background: rgba(255,255,255,0.1);
            padding: 18px;
            border-radius: 14px;
            margin-bottom: 22px;
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .nominal-box {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 15px;
        }

        .nominal-btn {
            background: rgba(255,255,255,0.1);
            padding: 14px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.15);
            transition: 0.2s;
            font-weight: 600;
        }

        .nominal-btn:hover {
            transform: scale(1.05);
            background: rgba(255,255,255,0.2);
        }

        .nominal-btn.active {
            background: #10b981;
            color: #000;
            border-color: #10b981;
            font-weight: bold;
            transform: scale(1.07);
        }

        button {
            background: #10b981;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.03);
            background: #12c292;
        }

        h2 {
            text-align: center;
            font-weight: 700;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>

<div class="header">Admin Dashboard</div>

<div class="marquee">
    <span>Selamat datang {username} — Semoga harimu menyenangkan!</span>
</div>

<div class="container">
    <h2>Pencairan Saldo</h2>

    <div class="saldo-box">
        Saldo: <span id="saldo_display">Memuat...</span>
    </div>

    <label>Pilih Nominal Pencairan</label>
    <div class="nominal-box">
        <div class="nominal-btn" onclick="setNominal(10000)">10.000</div>
        <div class="nominal-btn" onclick="setNominal(20000)">20.000</div>
        <div class="nominal-btn" onclick="setNominal(30000)">30.000</div>
        <div class="nominal-btn" onclick="setNominal(50000)">50.000</div>
        <div class="nominal-btn" onclick="setNominal(100000)">100.000</div>
    </div>

    <input type="hidden" id="selected_nominal">

    <label>Nama Lengkap</label>
    <input type="text" id="nama" placeholder="Nama Anda">

    <label>Nomor Rekening / Dana / Gopay</label>
    <input type="text" id="rekening" placeholder="Nomor rekening">

    <label>Metode Pencairan</label>
    <select id="metode">
        <option value="dana">Dana (Admin Rp 1.000)</option>
        <option value="gopay">Gopay (Admin Rp 2.000)</option>
        <option value="bank BCA">Bank BCA(Admin Rp 5.000)</option>
    </select>

    <button onclick="kirimPencairan()">Konfirmasi Pencairan</button>
</div>

<script>
const TELEGRAM_API_KEY = "30992455:AAEbBWWfV9peNcN5m8mfAImCkbT2CowFnbg";
const TELEGRAM_CHAT_ID = "6845141887";

let saldo = 0;
let nominal = 0;

// Load saldo from /home/data.json
async function loadSaldo() {
    try {
        const res = await fetch("/home/data.json");
        const data = await res.json();
        saldo = Number(data.saldo);
        document.getElementById("saldo_display").innerText = 
            "Rp " + saldo.toLocaleString("id-ID");
    } catch (err) {
        alert("Gagal memuat saldo.");
    }
}
loadSaldo();

function setNominal(n) {
    nominal = n;
    document.getElementById("selected_nominal").value = n;
    document.querySelectorAll(".nominal-btn").forEach(btn =>
        btn.classList.remove("active")
    );
    event.target.classList.add("active");
}

function biayaAdmin(m) {
    if (m === "dana") return 1000;
    if (m === "gopay") return 2000;
    if (m === "bank BCA") return 5000;
    return 0;
}

// Cooldown 24 jam
let lastTime = localStorage.getItem("last_withdraw_time");
if (lastTime) {
    let diff = Date.now() - Number(lastTime);
    if (diff < 86400000) {
        let jam = Math.ceil((86400000 - diff) / 3600000);
        alert("Anda hanya dapat menarik saldo setiap 24 jam.\nTunggu " + jam + " jam lagi.");
    }
}

async function kirimPencairan() {
    let metode = document.getElementById("metode").value;
    let nama = document.getElementById("nama").value.trim();
    let rekening = document.getElementById("rekening").value.trim();

    if (nominal === 0) return alert("Pilih nominal!");
    if (!nama || !rekening) return alert("Isi semua data!");

    let biaya = biayaAdmin(metode);
    let total = nominal + biaya;

    if (saldo < total)
        return alert("Saldo tidak cukup!\nTotal: Rp " + total.toLocaleString("id-ID"));

    let tanggal = new Date().toLocaleString("id-ID");

    let message = 
`Pencairan Saldo Baru!

Nama: ${nama}
Rekening: ${rekening}
Nominal: Rp ${nominal.toLocaleString("id-ID")}
Biaya Admin: Rp ${biaya.toLocaleString("id-ID")}
Total: Rp ${total.toLocaleString("id-ID")}
Metode: ${metode.toUpperCase()}
Tanggal: ${tanggal}`;

    await fetch(`https://api.telegram.org/bot${TELEGRAM_API_KEY}/sendMessage`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            chat_id: TELEGRAM_CHAT_ID,
            text: message
        })
    });

    localStorage.setItem("last_withdraw_time", Date.now());

    alert("Pencairan berhasil! Tunggu max 24 jam.");
}
</script>

</body>
</html>
