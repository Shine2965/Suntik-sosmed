<!DOCTYPE html>  <html lang="id">    <head>    
    <meta charset="UTF-8">    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">    
    <title>Admin Dashboard — Pencairan Saldo</title>  <link rel="preconnect" href="https://fonts.googleapis.com">    
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">    <style>    
    body {    
        margin: 0;    
        background: linear-gradient(135deg, #0f172a, #1e293b);    
        font-family: 'Inter', sans-serif;    
        color: white;    
    }    
  
    .header {    
        background: rgba(255,255,255,0.05);    
        backdrop-filter: blur(10px);    
        padding: 20px;    
        text-align: center;    
        font-size: 26px;    
        font-weight: 700;    
    }    
  
    .marquee {    
        width: 100%;    
        overflow: hidden;    
        white-space: nowrap;    
        background: #0f172a;    
        padding: 10px 0;    
        font-size: 18px;    
        font-weight: 600;    
    }    
    .marquee span {    
        display: inline-block;    
        padding-left: 100%;    
        animation: marquee 10s linear infinite;    
    }    
    @keyframes marquee {    
        0% { transform: translate(0, 0); }    
        100% { transform: translate(-100%, 0); }    
    }    
  
    .container {    
        max-width: 480px;    
        margin: 30px auto;    
        background: rgba(255,255,255,0.08);    
        backdrop-filter: blur(16px);    
        padding: 25px;    
        border-radius: 20px;    
        box-shadow: 0 8px 25px rgba(0,0,0,0.2);    
    }    
  
    input, select, button {    
        width: 100%;    
        margin-top: 12px;    
        padding: 14px;    
        border-radius: 12px;    
        border: none;    
        font-size: 16px;    
        background: rgba(255,255,255,0.1);    
        color: white;    
    }    
  
    .saldo-box {    
        background: rgba(255,255,255,0.1);    
        padding: 18px;    
        border-radius: 14px;    
        margin-bottom: 22px;    
        text-align: center;    
        font-size: 22px;    
        font-weight: 700;    
    }    
  
    .nominal-box {    
        display: grid;    
        grid-template-columns: repeat(2, 1fr);    
        gap: 12px;    
        margin-top: 15px;    
    }    
  
    .nominal-btn {    
        background: rgba(255,255,255,0.1);    
        padding: 14px;    
        border-radius: 12px;    
        text-align: center;    
        cursor: pointer;    
        border: 1px solid rgba(255,255,255,0.15);    
        font-weight: 600;    
        transition: 0.2s;    
    }    
  
    .nominal-btn:hover {    
        transform: scale(1.05);    
    }    
  
    .nominal-btn.active {    
        background: #10b981;    
        color: #000;    
        border-color: #10b981;    
        transform: scale(1.07);    
    }    
  
    button {    
        background: #10b981;    
        font-weight: 700;    
        cursor: pointer;    
        transition: 0.2s;    
    }    
    button:hover {    
        transform: scale(1.03);    
    }    
  
    /* POPUP */    
    .popup-bg {    
        position: fixed;    
        top: 0; left: 0;    
        width: 100%; height: 100%;    
        background: rgba(0,0,0,0.6);    
        display: none;    
        justify-content: center;    
        align-items: center;    
    }    
    .popup {    
        background: #1e293b;    
        padding: 25px;    
        border-radius: 15px;    
        width: 80%;    
        max-width: 340px;    
        text-align: center;    
        font-size: 18px;    
        font-weight: 600;    
    }    
</style>  </head>    
<body>  <div class="header">Admin Dashboard</div>  <div class="marquee">    
    <span id="marquee_text">Memuat...</span>    
</div>  <div class="container">    
    <h2 style="text-align:center;">Pencairan Saldo</h2>  <div class="saldo-box">    
    Saldo: <span id="saldo_display">Memuat...</span>    
</div>    <label>Pilih Nominal Pencairan</label>

<div class="nominal-box">    
    <div class="nominal-btn" onclick="setNominal(10000)">10.000</div>    
    <div class="nominal-btn" onclick="setNominal(20000)">20.000</div>    
    <div class="nominal-btn" onclick="setNominal(30000)">30.000</div>    
    <div class="nominal-btn" onclick="setNominal(50000)">50.000</div>    
    <div class="nominal-btn" onclick="setNominal(100000)">100.000</div>    
</div>    <input type="hidden" id="selected_nominal">    <label>Nama Lengkap</label>
<input type="text" id="nama" placeholder="Nama Anda">

<label>Nomor Rekening / Dana / Gopay</label>
<input type="text" id="rekening" placeholder="Nomor rekening">

<label>Metode Pencairan</label>
<select id="metode">
<option value="dana">Dana (Admin Rp 1.000)</option>
<option value="gopay">Gopay (Admin Rp 2.000)</option>
<option value="bca">Bank BCA (Admin Rp 5.000)</option>
</select>

<button onclick="kirimPencairan()">Konfirmasi Pencairan</button>

</div>  <!-- POPUP -->  <div id="popup_bg" class="popup-bg">    
    <div id="popup_box" class="popup">Memuat...</div>    
</div>  <script>    
let saldo = 0;    
let nominal = 0;    // AMBIL SALDO + USERNAME
async function loadSaldo() {
try {
const res = await fetch("/home/data.json");
const data = await res.json();

saldo = Number(data.saldo);    
    const username = data.username || "Pengguna";    

    document.getElementById("saldo_display").innerText =    
        "Rp " + saldo.toLocaleString("id-ID");    

    document.getElementById("marquee_text").innerText =    
        "Selamat datang " + username + " — Semoga harimu menyenangkan! ✨";    

} catch (err) {    
    alert("Gagal memuat data.");    
}

}
loadSaldo();

function setNominal(n) {
nominal = n;
document.getElementById("selected_nominal").value = n;
document.querySelectorAll(".nominal-btn").forEach(btn =>
btn.classList.remove("active")
);
event.target.classList.add("active");
}

function biayaAdmin(m) {
if (m === "dana") return 1000;
if (m === "gopay") return 2000;
if (m === "bca") return 5000;
return 0;
}

// POPUP
function popup(msg) {
document.getElementById("popup_box").innerText = msg;
document.getElementById("popup_bg").style.display = "flex";
}

// KIRIM PENCAIRAN
async function kirimPencairan() {

// CEK COOLDOWN    
let last = localStorage.getItem("wd_time");    
if (last && Date.now() - last < 86400000) {    
    return alert("Anda sudah melakukan pencairan. Tunggu 24 jam untuk pencairan berikutnya.");    
}    

let nama = document.getElementById("nama").value.trim();    
let rek = document.getElementById("rekening").value.trim();    
let metode = document.getElementById("metode").value;    

if (!nominal) return alert("Pilih nominal!");    
if (!nama || !rek) return alert("Lengkapi semua data!");    

let biaya = biayaAdmin(metode);    
let total = nominal + biaya;    

if (saldo < total)    
    return alert("Saldo tidak cukup!\nTotal: Rp " + total.toLocaleString("id-ID"));    

let tanggal = new Date().toLocaleString("id-ID");    

let pesan =

`Halo admin ada penarikan saldo baru nih!

📅 Tanggal: ${tanggal}
👤 Nama: ${nama}
🏦 No Rekening: ${rek}
💰 Jumlah Pencairan: Rp ${nominal.toLocaleString("id-ID")}

Metode: ${metode.toUpperCase()}
Total (dengan admin): Rp ${total.toLocaleString("id-ID")}`;

popup("Mengirim data...");    

await fetch(`https://api.telegram.org/bot7430992455:AAHrTCIV5S20Pr_Jy9PjmwcwTPjIGWo4wA4/sendMessage`, {    
    method: "POST",    
    headers: {"Content-Type": "application/json"},    
    body: JSON.stringify({    
        chat_id: "6845141887",    
        text: pesan    
    })    
});    

popup("Permintaan Pencairan saldo berhasil dikirim!\nSilahkan tunggu saldo masuk paling lama 24 jam");    

localStorage.setItem("wd_time", Date.now());    

setTimeout(() => {    
    window.location.href = "/home/";    
}, 3000);

}
</script>  </body>

</html>
