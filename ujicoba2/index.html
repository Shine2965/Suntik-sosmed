<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shine Shop CS Bot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .chat-container {
            width: 420px;
            max-height: 750px;
            background: #1a1a1a;
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(0,255,200,0.15);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid #00ffaa33;
        }
        .chat-header {
            background: #00ffaa22;
            padding: 15px 20px;
            text-align: center;
            border-bottom: 1px solid #00ffaa44;
        }
        .chat-header h2 {
            color: #00ffaa;
            font-size: 20px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px #00ffaa66;
        }
        .chat-header small {
            color: #888;
            font-size: 11px;
        }
        .chat-messages {
            flex: 1;
            padding: 15px 18px;
            overflow-y: auto;
            max-height: 450px;
            background: #111;
        }
        .chat-messages::-webkit-scrollbar {
            width: 4px;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: #00ffaa66;
            border-radius: 10px;
        }
        .msg {
            margin: 8px 0;
            padding: 12px 16px;
            border-radius: 16px;
            max-width: 92%;
            font-size: 14px;
            line-height: 1.5;
            animation: fadeIn 0.3s ease;
            word-wrap: break-word;
        }
        .msg-bot {
            background: #00ffaa15;
            color: #d0d0d0;
            border-left: 3px solid #00ffaa;
            align-self: flex-start;
            margin-right: auto;
        }
        .msg-user {
            background: #00ffaa25;
            color: #fff;
            border-right: 3px solid #00ffaa;
            align-self: flex-end;
            margin-left: auto;
            text-align: right;
        }
        .msg-warning {
            background: #ff003322;
            color: #ff6666;
            border: 1px solid #ff003388;
            text-align: center;
            font-weight: bold;
            padding: 14px;
            border-radius: 12px;
            margin: 12px 0;
        }
        .chat-input-area {
            padding: 12px 18px;
            background: #0d0d0d;
            border-top: 1px solid #00ffaa22;
            display: flex;
            gap: 10px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 30px;
            background: #222;
            color: #fff;
            font-size: 14px;
            outline: 1px solid #00ffaa44;
        }
        .chat-input-area input:focus {
            outline: 2px solid #00ffaa;
        }
        .chat-input-area button {
            padding: 12px 24px;
            background: #00ffaa;
            border: none;
            border-radius: 30px;
            font-weight: bold;
            color: #0a0a0a;
            cursor: pointer;
            transition: 0.2s;
        }
        .chat-input-area button:hover {
            background: #00dd99;
            transform: scale(0.96);
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 10px 0;
            justify-content: center;
        }
        .btn-group button {
            background: #00ffaa22;
            color: #00ffaa;
            border: 1px solid #00ffaa55;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            flex: 1;
            min-width: 120px;
        }
        .btn-group button:hover {
            background: #00ffaa55;
            color: #fff;
            transform: scale(1.02);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .typing {
            color: #888;
            font-size: 13px;
            padding: 8px 16px;
            font-style: italic;
        }
        #gmail-warning {
            color: #ff4444;
            font-weight: bold;
            font-size: 12px;
            padding: 10px 18px;
            background: #ff000011;
            border-bottom: 1px solid #ff444466;
            text-align: center;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .status-sukses { background: #00ffaa33; color: #00ffaa; }
        .status-pending { background: #ffaa0033; color: #ffaa00; }
        .status-dibatalkan { background: #ff003333; color: #ff4444; }
    </style>
</head>
<body>

<div class="chat-container" id="app">
    <div class="chat-header">
        <h2>🛸 Shine Shop CS</h2>
        <small>Powered by Dragon V1</small>
    </div>
    <div id="gmail-warning">⚠️ PESAN ANDA AKAN DIBACA OTOMATIS & DIBALAS VIA GMAIL ⚠️</div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-area">
        <input type="text" id="chatInput" placeholder="Ketik pesan..." autocomplete="off">
        <button id="sendBtn">Kirim</button>
    </div>
</div>

<script>
    // ===================== KONFIGURASI =====================
    // AMAN: Token dari environment variable Vercel
    const TELEGRAM_TOKEN = '8785872128:AAGJApScDjRIjg1VorXB35OvrvtUDCtVr0M';
    const TELEGRAM_CHAT_ID = '6317157631';
    const USER_ID_KEY = 'user_id';

    // ===================== STATE =====================
    let userId = localStorage.getItem(USER_ID_KEY);
    if (!userId) {
        userId = 'user-' + Math.random().toString(36).substring(2, 10) + '-' + Math.random().toString(36).substring(2, 8);
        localStorage.setItem(USER_ID_KEY, userId);
    }

    let currentStep = 'idle';
    let pendingTrxId = null;
    let allTransactions = {};
    let isProcessing = false;

    // ===================== DOM =====================
    const messagesEl = document.getElementById('chatMessages');
    const inputEl = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');

    function addMessage(text, sender, extraClass = '') {
        const div = document.createElement('div');
        div.className = `msg ${sender === 'bot' ? 'msg-bot' : 'msg-user'} ${extraClass}`;
        div.innerHTML = text;
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return div;
    }

    function addTyping() {
        const div = document.createElement('div');
        div.className = 'typing';
        div.id = 'typingIndicator';
        div.textContent = '💬 Bot sedang mengetik...';
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function removeTyping() {
        const el = document.getElementById('typingIndicator');
        if (el) el.remove();
    }

    function addButtons(buttons) {
        const div = document.createElement('div');
        div.className = 'btn-group';
        buttons.forEach((btn) => {
            const b = document.createElement('button');
            b.textContent = btn.label;
            b.onclick = () => {
                handleUserInput(btn.value);
            };
            div.appendChild(b);
        });
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function getStatusBadge(status) {
        const classes = {
            'sukses': 'status-sukses',
            'pending': 'status-pending',
            'dibatalkan': 'status-dibatalkan'
        };
        const emojis = {
            'sukses': '✅',
            'pending': '⏳',
            'dibatalkan': '❌'
        };
        const cls = classes[status.toLowerCase()] || '';
        const emoji = emojis[status.toLowerCase()] || '📦';
        return `<span class="status-badge ${cls}">${emoji} ${status}</span>`;
    }

    // ===================== TELEGRAM =====================
    async function sendToTelegram(message) {
        if (!TELEGRAM_TOKEN) {
            console.warn('⚠️ TELEGRAM_TOKEN tidak diset!');
            return;
        }
        try {
            const payload = {
                chat_id: TELEGRAM_CHAT_ID,
                text: `📨 **Pesan CS**\n👤 User: ${userId}\n✉️ Gmail: ${localStorage.getItem('customer_email') || 'belum diisi'}\n💬 ${message}`,
                parse_mode: 'Markdown'
            };
            const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (!response.ok) {
                console.error('Telegram error:', await response.text());
            }
        } catch (e) {
            console.error('Gagal kirim ke Telegram:', e);
        }
    }

    // ===================== LOAD DATA JSON =====================
    async function loadAllTransactions() {
        const files = [
            '/riwayat/data.json',
            '/riwayat/data-juli-2026.json',
            '/riwayat/agustus-2026.json'
        ];

        let mergedData = {};

        for (const file of files) {
            try {
                const response = await fetch(file);
                if (!response.ok) {
                    console.warn(`⚠️ Gagal load ${file}: ${response.status}`);
                    continue;
                }
                const data = await response.json();
                mergedData = { ...mergedData, ...data };
                console.log(`✅ Loaded ${file}: ${Object.keys(data).length} entries`);
            } catch (e) {
                console.error(`❌ Error loading ${file}:`, e);
            }
        }

        return mergedData;
    }

    // ===================== BOT LOGIC =====================
    function getCustomerEmail() {
        return localStorage.getItem('customer_email');
    }

    function setCustomerEmail(email) {
        localStorage.setItem('customer_email', email);
    }

    function askEmail() {
        addMessage('📧 Mohon masukkan alamat Gmail Anda terlebih dahulu.', 'bot');
        currentStep = 'waiting_email';
    }

    async function handleBotLogic(input) {
        if (isProcessing) return;
        isProcessing = true;

        try {
            const trimmed = input.trim();
            const lower = trimmed.toLowerCase();

            // STEP 1: Cek email
            let email = getCustomerEmail();
            if (!email && currentStep !== 'waiting_email') {
                askEmail();
                isProcessing = false;
                return;
            }

            if (currentStep === 'waiting_email') {
                if (trimmed.includes('@') && trimmed.includes('.')) {
                    setCustomerEmail(trimmed);
                    addMessage(`✅ Gmail ${trimmed} tersimpan. Ada yang bisa saya bantu?`, 'bot');
                    await sendToTelegram(`📧 Gmail terdaftar: ${trimmed}`);
                    currentStep = 'idle';
                } else {
                    addMessage('❌ Format Gmail tidak valid. Masukkan email benar (contoh: user@gmail.com)', 'bot');
                }
                isProcessing = false;
                return;
            }

            // STEP 2: Handle perintah khusus
            if (['oy', 'hai', 'hi', 'halo', 'p', 'hay', 'hello'].includes(lower)) {
                addMessage('Halo ka, ada yang bisa saya bantu? 😊', 'bot');
                await sendToTelegram(`Pesan: ${trimmed}`);
                isProcessing = false;
                return;
            }

            if (lower.includes('transaksi') || lower.includes('pesanan') || lower.includes('beli') || lower.includes('order') || lower.includes('cek')) {
                addMessage('Baik, boleh dibantu id transaksi Kaka yang dimaksud?', 'bot');
                currentStep = 'waiting_trx';
                await sendToTelegram(`Pesan: ${trimmed} (menunggu TRX)`);
                isProcessing = false;
                return;
            }

            if (lower.includes('refund') || lower.includes('dibatalkan') || lower.includes('batal') || lower.includes('komplain')) {
                addMessage('Baik, boleh dibantu id transaksi nya kak?', 'bot');
                currentStep = 'waiting_refund_trx';
                await sendToTelegram(`Pesan: ${trimmed} (menunggu TRX refund)`);
                isProcessing = false;
                return;
            }

            // STEP 3: Cek apakah input adalah TRX
            if (trimmed.startsWith('TRX')) {
                if (currentStep === 'waiting_refund_trx') {
                    await handleRefundTrx(trimmed);
                } else if (currentStep === 'waiting_trx' || currentStep === 'idle') {
                    await handleTransactionCheck(trimmed);
                }
                isProcessing = false;
                return;
            }

            // STEP 4: Handle input refund rekening
            if (currentStep === 'waiting_refund_rek') {
                await handleRefundRek(trimmed);
                isProcessing = false;
                return;
            }

            // Fallback
            addMessage('Maaf ka, saya kurang paham. Bisa dijelaskan lagi?', 'bot');
            await sendToTelegram(`Pesan tidak dikenali: ${trimmed}`);
        } catch (error) {
            console.error('Error in handleBotLogic:', error);
            addMessage('⚠️ Maaf, terjadi kesalahan. Silakan coba lagi.', 'bot');
        } finally {
            isProcessing = false;
        }
    }

    async function handleTransactionCheck(trxId) {
        addTyping();
        currentStep = 'idle';

        try {
            if (Object.keys(allTransactions).length === 0) {
                allTransactions = await loadAllTransactions();
            }

            const data = allTransactions[trxId];
            removeTyping();

            if (!data) {
                addMessage(`❌ Transaksi dengan ID ${trxId} tidak ditemukan. Coba periksa kembali kode transaksi Anda.`, 'bot');
                await sendToTelegram(`❌ TRX ${trxId} tidak ditemukan`);
                return;
            }

            const statusText = data.status || 'Unknown';
            const statusBadge = getStatusBadge(statusText);

            let reply = `Halo kak, pesanan anda dengan id transaksi <b>${trxId}</b><br><br>
📦 <b>Produk:</b> ${data.produk || '-'}<br>
📅 <b>Waktu:</b> ${data.waktu || '-'}<br>
🔢 <b>Jumlah:</b> ${data.jumlah || '-'}<br>
👤 <b>User ID:</b> ${data.userid || '-'}<br>
<b>Status:</b> ${statusBadge}`;

            if (data.pesan) {
                reply += `<br><br>📝 <b>Catatan:</b> ${data.pesan}`;
            }

            // Cek apakah transaksi milik user ini
            if (data.userid && data.userid !== userId) {
                reply += `<br><br>⚠️ <b>Perhatian:</b> Transaksi ini terdaftar atas nama user lain.`;
            }

            if (statusText.toLowerCase() === 'dibatalkan') {
                const nominal = parseInt(data.jumlah) || 0;
                if (nominal < 1000) {
                    reply += `<br><br>🎫 Karena transaksi di bawah Rp 1.000, refund akan dikonversi ke <b>kode voucher</b> yang akan dikirim via Gmail oleh admin.`;
                    addMessage(reply, 'bot');
                    await sendToTelegram(`Refund ${trxId} -> voucher (dibawah 1K)`);
                    currentStep = 'idle';
                } else {
                    reply += `<br><br>⚠️ Pesanan dibatalkan. Silakan kirim nomor rekening e-wallet (DANA/OVO/GoPay) untuk refund.`;
                    addMessage(reply, 'bot');
                    addMessage('📱 Ketik nomor e-wallet Anda (contoh: 081234567890):', 'bot');
                    currentStep = 'waiting_refund_rek';
                    pendingTrxId = trxId;
                    await sendToTelegram(`Refund ${trxId} - menunggu rekening`);
                }
                return;
            }

            addMessage(reply, 'bot');
            await sendToTelegram(`Cek transaksi ${trxId}: ${statusText}`);
        } catch (error) {
            removeTyping();
            console.error('Error in handleTransactionCheck:', error);
            addMessage('❌ Gagal memeriksa transaksi. Silakan coba lagi.', 'bot');
        }
    }

    async function handleRefundTrx(trxId) {
        addTyping();
        
        try {
            if (Object.keys(allTransactions).length === 0) {
                allTransactions = await loadAllTransactions();
            }

            const data = allTransactions[trxId];
            removeTyping();

            if (!data) {
                addMessage(`❌ Transaksi ${trxId} tidak ditemukan.`, 'bot');
                currentStep = 'idle';
                return;
            }

            if (data.status.toLowerCase() !== 'dibatalkan') {
                addMessage(`ℹ️ Transaksi ${trxId} statusnya <b>${data.status}</b>, bukan dibatalkan. Tidak bisa refund.`, 'bot');
                currentStep = 'idle';
                return;
            }

            const nominal = parseInt(data.jumlah) || 0;
            let reply = `🔁 Refund untuk ${trxId}:<br><br>📦 ${data.produk || '-'}<br>💰 Jumlah: Rp ${nominal.toLocaleString()}<br>📅 ${data.waktu || '-'}`;
            
            if (nominal < 1000) {
                reply += `<br><br>🎫 Karena transaksi di bawah Rp 1.000, refund akan dikonversi ke <b>kode voucher</b> yang akan dikirim via Gmail oleh admin.`;
                addMessage(reply, 'bot');
                await sendToTelegram(`Refund ${trxId} -> voucher (dibawah 1K)`);
                currentStep = 'idle';
            } else {
                reply += `<br><br>💳 Silakan kirim nomor rekening e-wallet Anda (DANA/OVO/GoPay) untuk diproses.`;
                addMessage(reply, 'bot');
                addMessage('📱 Ketik nomor e-wallet Anda (min 8 digit):', 'bot');
                currentStep = 'waiting_refund_rek';
                pendingTrxId = trxId;
                await sendToTelegram(`Refund ${trxId} - menunggu rekening`);
            }
        } catch (error) {
            removeTyping();
            console.error('Error in handleRefundTrx:', error);
            addMessage('❌ Gagal memproses refund. Silakan coba lagi.', 'bot');
        }
    }

    async function handleRefundRek(input) {
        let rek = input.trim();
        if (rek.length < 8 || !/^\d+$/.test(rek)) {
            addMessage('❌ Nomor rekening tidak valid. Masukkan minimal 8 digit angka.', 'bot');
            return;
        }

        addMessage(`✅ Rekening ${rek} sudah dicatat. Refund akan diproses admin dalam 1x24 jam.`, 'bot');
        await sendToTelegram(`💰 Refund untuk ${pendingTrxId || 'unknown'} -> Rek: ${rek}`);
        currentStep = 'idle';
        pendingTrxId = null;
    }

    // ===================== HANDLE USER INPUT =====================
    function handleUserInput(input) {
        if (!input.trim()) return;
        if (isProcessing) {
            addMessage('⏳ Mohon tunggu, saya sedang memproses permintaan sebelumnya...', 'bot');
            return;
        }
        
        addMessage(input, 'user');
        sendToTelegram(`🧑 User: ${input}`);
        handleBotLogic(input);
        inputEl.value = '';
    }

    // ===================== EVENT LISTENER ===========
