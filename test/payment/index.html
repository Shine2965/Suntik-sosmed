<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Mutasi QRIS - Shine Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            padding: 30px 20px;
            background: radial-gradient(circle at 20% 30%, #00c6ff10, transparent 50%),
                        radial-gradient(circle at 80% 70%, #0072ff10, transparent 50%),
                        #0a0a0a;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .card {
            background: #1a1a1a;
            border-radius: 24px;
            padding: 30px 28px;
            border: 1px solid #00ffaa33;
            box-shadow: 0 0 40px rgba(0,255,170,0.05);
            margin-bottom: 20px;
        }
        .card h2 {
            color: #00ffaa;
            font-size: 22px;
            margin-bottom: 6px;
        }
        .card .sub {
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .btn {
            padding: 10px 24px;
            border-radius: 30px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-size: 13px;
            font-family: 'Poppins', sans-serif;
        }
        .btn-back {
            background: #444;
            color: #fff;
        }
        .btn-back:hover {
            background: #555;
        }
        .btn-refresh {
            background: #00ffaa22;
            color: #00ffaa;
            border: 1px solid #00ffaa44;
        }
        .btn-refresh:hover {
            background: #00ffaa44;
        }
        .btn-primary {
            background: #00ffaa;
            color: #0a0a0a;
        }
        .btn-primary:hover {
            background: #00dd99;
            transform: scale(0.97);
        }
        .btn-danger {
            background: #ff444422;
            color: #ff6666;
            border: 1px solid #ff444455;
        }
        .btn-danger:hover {
            background: #ff444466;
            color: #fff;
        }
        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .text-muted {
            color: #666;
            font-size: 12px;
        }
        .text-success {
            color: #00ffaa;
        }
        .text-danger {
            color: #ff4444;
        }
        .text-warning {
            color: #ffaa00;
        }
        .security-badge {
            text-align: center;
            font-size: 10px;
            color: #444;
            margin-top: 12px;
            border-top: 1px solid #00ffaa15;
            padding-top: 12px;
        }
        .env-status {
            text-align: center;
            font-size: 11px;
            color: #555;
            margin-top: 8px;
        }
        .role-badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .role-badge.admin {
            background: #ff444422;
            color: #ff6666;
        }
        .role-badge.vip {
            background: #ffaa0044;
            color: #ffaa00;
        }

        /* ===== STATS ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin: 12px 0;
        }
        .stats-grid .stat-item {
            background: #0d0d0d;
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            border: 1px solid #00ffaa15;
        }
        .stats-grid .stat-item .num {
            font-size: 24px;
            font-weight: 700;
        }
        .stats-grid .stat-item .num.green {
            color: #00ffaa;
        }
        .stats-grid .stat-item .num.yellow {
            color: #ffaa00;
        }
        .stats-grid .stat-item .num.blue {
            color: #00ccff;
        }
        .stats-grid .stat-item .num.white {
            color: #fff;
        }
        .stats-grid .stat-item .label {
            color: #888;
            font-size: 11px;
            margin-top: 4px;
        }

        /* ===== TABLE ===== */
        .table-wrap {
            overflow-x: auto;
            margin-top: 12px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        table th {
            text-align: left;
            padding: 10px 12px;
            color: #888;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 10px;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #00ffaa22;
            position: sticky;
            top: 0;
            background: #1a1a1a;
            z-index: 10;
        }
        table td {
            padding: 10px 12px;
            border-bottom: 1px solid #222;
            color: #ddd;
            vertical-align: middle;
        }
        table tr:hover td {
            background: #ffffff05;
        }
        table .status-success {
            color: #00ffaa;
            font-weight: 600;
        }
        table .status-pending {
            color: #ffaa00;
            font-weight: 600;
        }
        table .status-failed {
            color: #ff4444;
            font-weight: 600;
        }
        table .status-refund {
            color: #ff6b9d;
            font-weight: 600;
        }
        .no-data {
            color: #666;
            text-align: center;
            padding: 30px 0;
            font-size: 14px;
        }
        .loading {
            color: #888;
            text-align: center;
            padding: 20px 0;
            font-size: 14px;
        }
        .last-update {
            color: #555;
            font-size: 11px;
            text-align: right;
            margin-top: 12px;
        }

        /* ===== FILTER ===== */
        .filter-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin: 12px 0;
        }
        .filter-group .btn-filter {
            background: #222;
            color: #aaa;
            border: 1px solid #333;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: 0.3s;
        }
        .filter-group .btn-filter:hover {
            background: #333;
            color: #fff;
        }
        .filter-group .btn-filter.active {
            background: #00ffaa22;
            color: #00ffaa;
            border-color: #00ffaa44;
        }

        .search-box {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .search-box input {
            flex: 1;
            min-width: 150px;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid #00ffaa33;
            background: #0d0d0d;
            color: #fff;
            font-size: 13px;
            outline: none;
            font-family: 'Poppins', sans-serif;
        }
        .search-box input:focus {
            border-color: #00ffaa;
        }
        .search-box .btn-search {
            background: #00ccff44;
            color: #00ccff;
            border: 1px solid #00ccff44;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .search-box .btn-search:hover {
            background: #00ccff66;
        }
        .search-box .btn-clear {
            background: #444;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .search-box .btn-clear:hover {
            background: #555;
        }

        .badge-verified {
            display: inline-block;
            background: #00ffaa22;
            color: #00ffaa;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
        }
        .badge-pending {
            display: inline-block;
            background: #ffaa0022;
            color: #ffaa00;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
        }

        @media (max-width: 600px) {
            .card {
                padding: 20px 16px;
            }
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
            .header-actions {
                flex-direction: column;
            }
            .header-actions .btn {
                width: 100%;
                text-align: center;
            }
            table {
                font-size: 11px;
            }
            table th,
            table td {
                padding: 6px 8px;
            }
            .filter-group {
                flex-direction: column;
            }
            .search-box {
                flex-direction: column;
            }
            .search-box input {
                width: 100%;
            }
            .search-box .btn-search,
            .search-box .btn-clear {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ===== HEADER ===== -->
        <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;">
                <div>
                    <h2>💳 Cek Mutasi QRIS</h2>
                    <div class="sub">Data transaksi QRIS secara real-time dari Qiospay</div>
                </div>
                <div class="header-actions">
                    <button class="btn btn-refresh" onclick="loadMutasi()">🔄 Refresh</button>
                    <button class="btn btn-back" onclick="location.href='/'">🏠 Home</button>
                </div>
            </div>
            <div id="userInfo" style="color:#888;font-size:13px;margin-top:8px;">
                👤 <span id="userEmailDisplay">-</span>
                <span id="userRoleDisplay" style="margin-left:10px;"></span>
            </div>
            <div class="env-status" id="envStatus">🔌 Menghubungi server...</div>
        </div>

        <!-- ===== STATISTIK ===== -->
        <div class="card" id="statsCard">
            <h2>📊 Ringkasan Mutasi</h2>
            <div class="stats-grid" id="statsGrid">
                <div class="stat-item">
                    <div class="num white" id="totalTransaksi">0</div>
                    <div class="label">Total Transaksi</div>
                </div>
                <div class="stat-item">
                    <div class="num green" id="totalSukses">0</div>
                    <div class="label">✅ Sukses</div>
                </div>
                <div class="stat-item">
                    <div class="num yellow" id="totalPending">0</div>
                    <div class="label">⏳ Pending</div>
                </div>
                <div class="stat-item">
                    <div class="num blue" id="totalAmount">Rp 0</div>
                    <div class="label">Total Nominal</div>
                </div>
            </div>
        </div>

        <!-- ===== SEARCH & FILTER ===== -->
        <div class="card">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Cari Order ID / Customer..." oninput="filterTable()">
                <button class="btn-search" onclick="filterTable()">🔍 Cari</button>
                <button class="btn-clear" onclick="clearSearch()">✕ Clear</button>
            </div>
            <div class="filter-group">
                <button class="btn-filter active" data-filter="all" onclick="setFilter('all')">📋 Semua</button>
                <button class="btn-filter" data-filter="success" onclick="setFilter('success')">✅ Sukses</button>
                <button class="btn-filter" data-filter="pending" onclick="setFilter('pending')">⏳ Pending</button>
                <button class="btn-filter" data-filter="failed" onclick="setFilter('failed')">❌ Gagal</button>
                <button class="btn-filter" data-filter="refund" onclick="setFilter('refund')">↩️ Refund</button>
            </div>
        </div>

        <!-- ===== LIST MUTASI ===== -->
        <div class="card" id="tableCard">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
                <h2>📋 Daftar Mutasi</h2>
                <span style="color:#666;font-size:12px;" id="itemCount">0 item</span>
            </div>
            <div class="table-wrap" id="tableWrap">
                <div class="loading">⏳ Memuat data mutasi...</div>
            </div>
            <div class="last-update" id="lastUpdate">-</div>
        </div>

        <div class="text-muted" style="text-align:center;margin-top:20px;">
            © Shine Shop · Mutasi QRIS System
        </div>
        <div class="security-badge">🔒 Data real-time dari Qiospay</div>
    </div>

    <script>
        // ============================================================
        // 🔒 KONFIGURASI
        // ============================================================
        const LOGIN_URL = '/info/index.html';
        const MUTASI_API = '/api/mutasi';
        const SESSION_TIMEOUT = 36000000;

        let allData = [];
        let filteredData = [];
        let currentFilter = 'all';
        let searchQuery = '';

        // ============================================================
        // 🔒 CEK SESSION
        // ============================================================
        function checkSession() {
            const loggedIn = localStorage.getItem('logged_in');
            const sessionToken = localStorage.getItem('session_token');
            const sessionCreated = parseInt(localStorage.getItem('session_created') || '0');
            const now = Date.now();

            if (loggedIn !== 'true' || !sessionToken) {
                window.location.href = LOGIN_URL;
                return false;
            }

            if (now - sessionCreated > SESSION_TIMEOUT) {
                console.log('⏰ Session expired');
                window.location.href = LOGIN_URL;
                return false;
            }

            return true;
        }

        if (!checkSession()) {
            throw new Error('Redirect ke login');
        }

        // ============================================================
        // 🔒 GET USER DATA
        // ============================================================
        function getUserData() {
            return {
                email: localStorage.getItem('user_email') || '',
                role: localStorage.getItem('user_role') || 'user'
            };
        }

        // ============================================================
        // 🔒 TAMPILKAN USER
        // ============================================================
        function displayUser() {
            const user = getUserData();
            document.getElementById('userEmailDisplay').textContent = user.email || 'Belum login';

            let roleHtml = '';
            if (user.role === 'admin') {
                roleHtml = `<span class="role-badge admin">🔑 Admin</span>`;
            } else if (user.role === 'vip') {
                roleHtml = `<span class="role-badge vip">⭐ VIP</span>`;
            } else {
                roleHtml = `<span class="role-badge user">👤 User</span>`;
            }
            document.getElementById('userRoleDisplay').innerHTML = roleHtml;
        }

        // ============================================================
        // 🔒 FORMAT RUPIAH
        // ============================================================
        function formatRupiah(amount) {
            const num = parseInt(amount) || 0;
            return 'Rp ' + num.toLocaleString('id-ID');
        }

        // ============================================================
        // 🔒 FORMAT TANGGAL
        // ============================================================
        function formatDate(dateString) {
            if (!dateString) return '-';
            try {
                const date = new Date(dateString);
                const options = {
                    day: '2-digit',
                    month: 'long',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                    timeZone: 'Asia/Jakarta'
                };
                return date.toLocaleString('id-ID', options) + ' WIB';
            } catch {
                return dateString;
            }
        }

        // ============================================================
        // 🔒 LOAD MUTASI
        // ============================================================
        async function loadMutasi() {
            const statusEl = document.getElementById('envStatus');
            const container = document.getElementById('tableWrap');
            container.innerHTML = '<div class="loading">⏳ Memuat data mutasi...</div>';

            try {
                statusEl.textContent = '⏳ Mengambil data dari Qiospay...';
                statusEl.style.color = '#888';

                const res = await fetch(MUTASI_API + '?t=' + Date.now());
                
                if (!res.ok) {
                    throw new Error('Gagal mengambil data: ' + res.status);
                }

                const data = await res.json();
                
                if (!data.success) {
                    throw new Error(data.message || 'Gagal mengambil data');
                }

                // Ambil data transaksi
                const transactions = data.data || [];
                allData = transactions;
                filteredData = transactions;

                // Update statistik
                updateStats(transactions);

                // Render tabel
                renderTable(transactions);

                // Update last update
                document.getElementById('lastUpdate').textContent = '📅 Terakhir diperbarui: ' + new Date().toLocaleString('id-ID');

                statusEl.textContent = `✅ ${transactions.length} transaksi dimuat`;
                statusEl.style.color = '#00ffaa';

                console.log('📊 Mutasi dimuat:', transactions.length, 'transaksi');

            } catch (err) {
                console.error('Error load mutasi:', err);
                statusEl.textContent = '❌ ' + err.message;
                statusEl.style.color = '#ff6666';
                container.innerHTML = `
                    <div class="no-data" style="color:#ff6666;">
                        ❌ Gagal memuat data: ${err.message}
                        <br><br>
                        <button class="btn btn-refresh" onclick="loadMutasi()" style="margin-top:10px;">
                            🔄 Coba Lagi
                        </button>
                    </div>
                `;
            }
        }

        // ============================================================
        // 🔒 UPDATE STATS
        // ============================================================
        function updateStats(data) {
            let total = data.length;
            let sukses = 0;
            let pending = 0;
            let failed = 0;
            let refund = 0;
            let totalAmount = 0;

            data.forEach(item => {
                const status = (item.status || '').toLowerCase();
                if (status === 'success' || status === 'paid' || status === 'settlement') {
                    sukses++;
                } else if (status === 'pending') {
                    pending++;
                } else if (status === 'failed' || status === 'expired') {
                    failed++;
                } else if (status === 'refund') {
                    refund++;
                }
                totalAmount += parseInt(item.amount) || 0;
            });

            document.getElementById('totalTransaksi').textContent = total;
            document.getElementById('totalSukses').textContent = sukses;
            document.getElementById('totalPending').textContent = pending;
            document.getElementById('totalAmount').textContent = formatRupiah(totalAmount);
        }

        // ============================================================
        // 🔒 RENDER TABLE
        // ============================================================
        function renderTable(data) {
            const container = document.getElementById('tableWrap');

            if (data.length === 0) {
                container.innerHTML = `<div class="no-data">📭 Tidak ada data mutasi</div>`;
                document.getElementById('itemCount').textContent = '0 item';
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Customer</th>
                            <th>Nominal</th>
                            <th>Status</th>
                            <th>Tanggal</th>
                            <th>Keterangan</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            data.forEach((item) => {
                const status = (item.status || 'unknown').toLowerCase();
                let statusClass = 'status-pending';
                let statusDisplay = '⏳ Pending';
                let badgeClass = 'badge-pending';

                if (status === 'success' || status === 'paid' || status === 'settlement') {
                    statusClass = 'status-success';
                    statusDisplay = '✅ Sukses';
                    badgeClass = 'badge-verified';
                } else if (status === 'pending') {
                    statusClass = 'status-pending';
                    statusDisplay = '⏳ Pending';
                    badgeClass = 'badge-pending';
                } else if (status === 'failed' || status === 'expired') {
                    statusClass = 'status-failed';
                    statusDisplay = '❌ Gagal';
                    badgeClass = 'badge-pending';
                } else if (status === 'refund') {
                    statusClass = 'status-refund';
                    statusDisplay = '↩️ Refund';
                    badgeClass = 'badge-pending';
                }

                html += `
                    <tr>
                        <td><code style="color:#ffaa00;font-size:11px;">${item.order_id || item.id || '-'}</code></td>
                        <td>${item.customer_name || item.customer || '-'}</td>
                        <td style="color:#00ffaa;font-weight:600;">${formatRupiah(item.amount)}</td>
                        <td class="${statusClass}">${statusDisplay}</td>
                        <td style="font-size:11px;color:#888;">${formatDate(item.created_at || item.date)}</td>
                        <td style="font-size:11px;color:#666;">${item.note || item.description || '-'}</td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
                <div style="margin-top:12px;font-size:12px;color:#666;text-align:right;">
                    Menampilkan ${data.length} transaksi
                </div>
            `;

            container.innerHTML = html;
            document.getElementById('itemCount').textContent = `${data.length} item`;
        }

        // ============================================================
        // 🔒 FILTER
        // ============================================================
        function setFilter(filter) {
            currentFilter = filter;
            document.querySelectorAll('.btn-filter').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === filter);
            });
            applyFilters();
        }

        function filterTable() {
            searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
            applyFilters();
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            searchQuery = '';
            applyFilters();
        }

        function applyFilters() {
            let result = [...allData];

            // Filter status
            if (currentFilter !== 'all') {
                result = result.filter(item => {
                    const status = (item.status || '').toLowerCase();
                    if (currentFilter === 'success') {
                        return status === 'success' || status === 'paid' || status === 'settlement';
                    }
                    return status === currentFilter;
                });
            }

            // Filter search
            if (searchQuery) {
                result = result.filter(item => {
                    const orderId = (item.order_id || item.id || '').toLowerCase();
                    const customer = (item.customer_name || item.customer || '').toLowerCase();
                    const note = (item.note || item.description || '').toLowerCase();
                    return orderId.includes(searchQuery) || 
                           customer.includes(searchQuery) || 
                           note.includes(searchQuery);
                });
            }

            filteredData = result;
            renderTable(result);
            updateStats(result);
        }

        // ============================================================
        // 🔒 AUTO REFRESH
        // ============================================================
        let refreshInterval = null;

        function startAutoRefresh() {
            if (refreshInterval) clearInterval(refreshInterval);
            refreshInterval = setInterval(loadMutasi, 30000); // Refresh setiap 30 detik
        }

        // ============================================================
        // 🔒 ANTI INSPECT
        // ============================================================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' ||
                (e.ctrlKey && e.shiftKey && ['I', 'C', 'J'].includes(e.key)) ||
                (e.ctrlKey && e.key === 'u')) {
                e.preventDefault();
                return false;
            }
        });

        // ============================================================
        // 🔒 INIT
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            displayUser();
            loadMutasi();
            startAutoRefresh();

            console.log('💳 Cek Mutasi QRIS siap!');
            console.log('📡 Sumber data: ' + MUTASI_API);
            console.log('🔄 Auto refresh setiap 30 detik');
        });

        // Stop refresh saat halaman di-unload
        window.addEventListener('beforeunload', function() {
            if (refreshInterval) clearInterval(refreshInterval);
        });
    </script>
</body>
</html>
