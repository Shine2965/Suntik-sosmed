<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cek Status Transaksi - Shine Shop</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f9ff; padding: 20px; }
    h2 { color: #333; }
    input, button {
      padding: 10px; margin: 5px 0;
      width: 100%; max-width: 400px;
    }
    #result {
      margin-top: 20px; padding: 15px;
      border-radius: 8px; background: #fff;
      box-shadow: 0 0 6px rgba(0,0,0,0.1);
    }
    .status { font-weight: bold; padding: 5px 10px; border-radius: 6px; display: inline-block; }
    .Pending { background: #f1c40f; color: #000; }
    .Processing { background: #3498db; color: #fff; }
    .Success { background: #2ecc71; color: #fff; }
    .Error { background: #e74c3c; color: #fff; }
    .Partial { background: #9b59b6; color: #fff; }
  </style>
</head>
<body>
  <h2>Cek Status Transaksi</h2>
  <label for="order_id">Masukkan Order ID:</label><br>
  <input type="text" id="order_id" placeholder="contoh: 12345"><br>
  <button onclick="cekStatus()">Cek Status</button>

  <div id="result"></div>

  <script>
  async function cekStatus() {
    const orderId = document.getElementById("order_id").value.trim();
    const resultBox = document.getElementById("result");

    if (!orderId) {
      resultBox.innerHTML = "⚠️ Masukkan Order ID terlebih dahulu.";
      return;
    }

    resultBox.innerHTML = "⏳ Mengecek status...";

    try {
      const response = await fetch("cek-status.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ order_id: orderId })
      });

      const text = await response.text();
      console.log("Raw response:", text);

      let data;
      try {
        data = JSON.parse(text);
      } catch (e) {
        resultBox.innerHTML = "❌ Respon bukan JSON:<br>" + text;
        return;
      }

      if (data.response && data.data) {
        const d = data.data;
        resultBox.innerHTML = `
          <h3>Detail Pesanan</h3>
          <p><b>ID Pesanan:</b> ${d.id}</p>
          <p><b>Total Harga:</b> Rp ${d.price.toLocaleString("id-ID")}</p>
          <p><b>Status:</b> <span class="status ${d.status}">${d.status}</span></p>
          <p><b>Jumlah Awal:</b> ${d.start_count}</p>
          <p><b>Sisa:</b> ${d.remains}</p>
        `;
      } else {
        resultBox.innerHTML = "❌ Gagal mendapatkan data pesanan.<br>" + JSON.stringify(data);
      }
    } catch (error) {
      resultBox.innerHTML = "❌ Error: " + error.message;
    }
  }
  </script>
</body>
</html>
